[package]
name = "edge-observability"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tracing = "=0.1.44"
# 0.3.20 is deliberately retained: it contains the ANSI-injection fix while
# avoiding the currently reported 0.3.22/0.3.23 span-clone regression.
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt"] }
