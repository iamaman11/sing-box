[package]
name = "edge-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
edge-observability = { path = "../edge-observability" }
thiserror = "=2.0.18"
tracing = "=0.1.44"
edge-secrets = { path = "../edge-secrets" }
edge-shared-types = { path = "../edge-shared-types" }
edge-trust = { path = "../edge-trust" }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tonic = { version = "0.14.5", features = ["tls-ring"] }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
futures-util = "0.3.32"
rtnetlink = "0.23.0"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }

[[bin]]
name = "edge-agent"
path = "src/main.rs"
