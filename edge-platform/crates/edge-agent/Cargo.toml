[package]
name = "edge-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
edge-shared-types = { path = "../edge-shared-types" }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net"] }
tonic = "0.14.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"

[[bin]]
name = "edge-agent"
path = "src/main.rs"
