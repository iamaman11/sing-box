[package]
name = "edge-console"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
edge-observability = { path = "../edge-observability" }
edge-local-runtime = { path = "../edge-local-runtime" }
edge-controller-core = { path = "../edge-controller-core" }
edge-clash = { path = "../edge-clash" }
edge-secrets = { path = "../edge-secrets" }
edge-singbox = { path = "../edge-singbox" }
thiserror = "=2.0.18"
tracing = "=0.1.44"
edge-shared-types = { path = "../edge-shared-types" }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
prost = "0.14.3"
ring = "0.17.14"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
base64 = "=0.22.1"
serde_json = "=1.0.149"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_System_IO",
] }
windows-service = "=0.8.1"
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[[bin]]
name = "edge-console"
path = "src/main.rs"
