[package]
name = "edge-shared-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "edge-release-set"
path = "src/bin/release_set.rs"

[build-dependencies]
prost-build = "0.14.3"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.5"

[dependencies]
prost = "0.14.3"
prost-types = "0.14.3"
tonic = "0.14.5"
tonic-prost = "0.14.5"
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
