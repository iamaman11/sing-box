[package]
name = "edge-controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
edge-observability = { path = "../edge-observability" }
thiserror = "=2.0.18"
tracing = "=0.1.44"
edge-bundle = { path = "../edge-bundle" }
edge-clash = { path = "../edge-clash" }
edge-controller-core = { path = "../edge-controller-core" }
edge-local-runtime = { path = "../edge-local-runtime" }
edge-provider-cloudflare = { path = "../edge-provider-cloudflare" }
edge-provider-vultr = { path = "../edge-provider-vultr" }
edge-secrets = { path = "../edge-secrets" }
edge-shared-types = { path = "../edge-shared-types" }
edge-state = { version = "0.1.0", path = "../edge-state" }
edge-singbox = { path = "../edge-singbox" }
edge-trace = { path = "../edge-trace" }
edge-trust = { path = "../edge-trust" }
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }
ring = "0.17.14"
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = { version = "0.14.5", features = ["tls-ring"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[bin]]
name = "edge-controller"
path = "src/main.rs"
