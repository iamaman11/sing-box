syntax = "proto3";

package edge.platform.v1;

enum Profile {
  PROFILE_UNSPECIFIED = 0;
  DIRECT = 1;
  WARP = 2;
}

enum OperationLifecycleStatus {
  OPERATION_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  REQUESTED = 1;
  RUNNING = 2;
  SUCCEEDED = 3;
  FAILED = 4;
}

enum DeployPhase {
  DEPLOY_PHASE_UNSPECIFIED = 0;
  DEPLOY_PHASE_REQUESTED = 1;
  INSTANCE_CREATE_REQUESTED = 2;
  INSTANCE_PROVISIONING = 3;
  INSTANCE_ADDRESS_ASSIGNED = 4;
  INSTANCE_RUNTIME_READY = 5;
  HOST_TRUST_INITIALIZED = 6;
  BUNDLE_RENDERED = 7;
  BUNDLE_UPLOADED = 8;
  BASE_BOOTSTRAP_STARTED = 9;
  BASE_READY_VERIFIED = 10;
  DNS_CUTOVER_STARTED = 11;
  DNS_CUTOVER_VERIFIED = 12;
  TUNNEL_BOOTSTRAP_STARTED = 13;
  TUNNEL_READY_VERIFIED = 14;
  DEPLOYMENT_PUBLISHED = 15;
  LOCAL_CONFIG_SYNCED = 16;
  DEPLOY_PHASE_COMPLETED = 17;
  DEPLOY_PHASE_FAILED = 18;
  ROLLBACK_STARTED = 19;
  ROLLBACK_COMPLETED = 20;
  LOCAL_RUNTIME_START_STARTED = 21;
  LOCAL_RUNTIME_READY_VERIFIED = 22;
  SELECTOR_INTENTS_RECONCILING = 23;
  SELECTORS_VERIFIED = 24;
  APP_EGRESS_VERIFIED = 25;
  APP_READY_COMPLETED = 26;
}

enum AppReadinessPhase {
  APP_READINESS_PHASE_UNSPECIFIED = 0;
  DEPLOYMENT_ABSENT = 1;
  SERVER_RUNTIME_READY = 2;
  LOCAL_RUNTIME_READY = 3;
  SELECTORS_READY = 4;
  APP_EGRESS_READY = 5;
  APP_READY = 6;
  APP_READINESS_FAILED = 7;
}

enum BootstrapMode {
  BOOTSTRAP_MODE_UNSPECIFIED = 0;
  BOOTSTRAP_BASE = 1;
  BOOTSTRAP_TUNNEL = 2;
  BOOTSTRAP_FULL = 3;
}

enum FileCategory {
  FILE_CATEGORY_UNSPECIFIED = 0;
  REQUIRED_REPO_INPUT = 1;
  LOCAL_ONLY_SENSITIVE = 2;
}

enum ErrorSubsystem {
  ERROR_SUBSYSTEM_UNSPECIFIED = 0;
  PROVIDER_COMPUTE = 1;
  PROVIDER_DNS = 2;
  RUNTIME_COMPOSE = 3;
  TRANSPORT_SSH = 4;
  LOCAL_SINGBOX = 5;
  SERVER_AGENT = 6;
  STATE = 7;
}

message PlatformError {
  string code = 1;
  string stage = 2;
  string message = 3;
  bool retryable = 4;
  ErrorSubsystem subsystem = 5;
}

message AgentState {
  bool healthy = 1;
  bool ready = 2;
  string topology_version = 3;
  optional string active_bundle_id = 4;
  repeated string degraded_reasons = 5;
  bool docker_reachable = 6;
  bool compose_file_present = 7;
  optional string observed_stack_path = 8;
  repeated string running_containers = 9;
  repeated string missing_containers = 10;
  repeated uint32 listening_tcp_ports = 11;
  repeated uint32 listening_udp_ports = 12;
}

message FilePresence {
  string path = 1;
  bool present = 2;
  FileCategory category = 3;
}

message InventoryReport {
  string repo_root = 1;
  bool rust_workspace_present = 2;
  repeated FilePresence required_repo_files = 3;
  repeated FilePresence local_only_files = 4;
  repeated string blockers = 5;
  repeated string warnings = 6;
}

message ControllerStatus {
  InventoryReport inventory = 1;
  AgentState agent_state = 2;
  LocalSingboxState local_singbox = 3;
  DeploymentSummary deployment = 4;
  ProviderObservation provider = 5;
  RuntimeObservation runtime = 6;
  SelectorState selector = 7;
  repeated string status_notes = 8;
  SelectorState ubuntu_selector = 9;
  UbuntuProxyState ubuntu_proxy = 10;
  AppReadinessPhase app_readiness_phase = 11;
}

message Empty {}

message AgentVersion {
  string name = 1;
  string version = 2;
}

message BootstrapRuntimeRequest {
  BootstrapMode mode = 1;
}

message BootstrapRuntimeResponse {
  bool success = 1;
  BootstrapMode mode = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  AgentState post_state = 6;
  repeated string warnings = 7;
}

message LocalSingboxState {
  bool process_running = 1;
  bool managed_config = 2;
  string expected_config_path = 3;
  optional string active_config_path = 4;
  optional uint32 clash_api_port = 5;
  repeated string warnings = 6;
}

message StartLocalRuntimeRequest {
  optional string singbox_binary_path = 1;
  optional string config_path = 2;
  optional string state_path = 3;
  bool force_restart = 4;
  bool visible_window = 5;
}

message StopLocalRuntimeRequest {
  optional string config_path = 1;
  bool expected_config_only = 2;
}

message RestartLocalRuntimeRequest {
  optional string singbox_binary_path = 1;
  optional string config_path = 2;
  optional string state_path = 3;
  bool visible_window = 4;
}

message LocalRuntimeResponse {
  bool success = 1;
  optional uint32 pid = 2;
  string note = 3;
  repeated string warnings = 4;
  optional Operation operation = 5;
  LocalSingboxState local_singbox = 6;
}

message DeploymentSummary {
  bool live_state_present = 1;
  optional string source_state_path = 2;
  optional string deployment_label = 3;
  optional string instance_id = 4;
  optional string server_ip = 5;
  optional string tunnel_domain = 6;
}

message ProviderObservation {
  bool configured = 1;
  string compute_provider = 2;
  string dns_provider = 3;
  repeated string warnings = 4;
}

message RuntimeObservation {
  bool edge_agent_reachable = 1;
  string runtime_kind = 2;
  repeated string warnings = 3;
  bool docker_reachable = 4;
  optional string observed_stack_path = 5;
  repeated string running_containers = 6;
  repeated string missing_containers = 7;
  repeated uint32 listening_tcp_ports = 8;
  repeated uint32 listening_udp_ports = 9;
  optional string topology_version = 10;
  optional string active_bundle_id = 11;
  bool compose_file_present = 12;
}

message ProxyGroupState {
  string name = 1;
  optional string selected = 2;
  repeated string candidates = 3;
  repeated string warnings = 4;
}

message SelectorState {
  optional string desired_main_route = 1;
  optional string observed_main_route = 2;
  bool degraded = 3;
  repeated string warnings = 4;
  repeated ProxyGroupState proxy_groups = 5;
}

message UbuntuProxyState {
  bool available = 1;
  optional string host = 2;
  optional uint32 port = 3;
  optional string url = 4;
  repeated string warnings = 5;
}

message GetSelectorStateRequest {
  optional string group = 1;
}

message SetSelectorRequest {
  string group = 1;
  string name = 2;
}

message SetSelectorResponse {
  bool success = 1;
  optional string previous = 2;
  optional string current = 3;
  repeated string warnings = 4;
  optional Operation operation = 5;
  SelectorState selector = 6;
}

message GetTraceRequest {
  optional string proxy_url = 1;
}

message TraceObservation {
  bool available = 1;
  optional string ip = 2;
  optional string warp = 3;
  optional string colo = 4;
  optional string note = 5;
}

message DoctorRequest {
  bool require_server_ready = 1;
  bool require_local_runtime = 2;
  bool require_egress_traces = 3;
}

message DoctorCheck {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

message DoctorResponse {
  bool ok = 1;
  repeated DoctorCheck checks = 2;
  ControllerStatus status = 3;
  optional TraceObservation desktop_trace = 4;
  optional TraceObservation ubuntu_trace = 5;
  optional Operation operation = 6;
}

message TrustEntry {
  int64 id = 1;
  string deployment_id = 2;
  string instance_id = 3;
  string ip = 4;
  string known_host_line = 5;
  optional string domain_name = 6;
  optional string ca_cert_path = 7;
  optional string server_cert_path = 8;
  optional string client_cert_path = 9;
  int64 updated_at_unix = 10;
}

message SecretRefEntry {
  string name = 1;
  string secret_ref = 2;
  int64 updated_at_unix = 3;
}

message GetSecretRefRequest {
  string name = 1;
}

message SetSecretRefRequest {
  string name = 1;
  string secret_ref = 2;
}

message ListSecretRefsRequest {}

message ListSecretRefsResponse {
  repeated SecretRefEntry secrets = 1;
}

message BundleFile {
  string relative_path = 1;
  bytes content = 2;
  bool executable = 3;
}

message ApplyBundleRequest {
  repeated BundleFile stack_files = 1;
  repeated BundleFile host_files = 2;
  optional BundleFile deployment_summary = 3;
  optional BundleFile agent_env_file = 4;
  bool prune_existing = 5;
}

message ApplyBundleResponse {
  bool success = 1;
  repeated string written_paths = 2;
  optional string stack_dir = 3;
  repeated string warnings = 4;
}

message VerifyRuntimeRequest {
  bool require_readiness = 1;
}

message ReadBundleIdentityRequest {}

message ReadBundleIdentityResponse {
  optional string active_bundle_id = 1;
  optional string topology_version = 2;
  optional string deployment_summary_path = 3;
}

message ReadRenderedArtifactsRequest {}

message ReadRenderedArtifactsResponse {
  repeated FilePresence files = 1;
}

message DeployRequest {
  optional string label_prefix = 1;
  optional string target_ip = 2;
  optional string instance_id = 3;
  optional string tunnel_domain = 4;
  optional string acme_email = 5;
  optional string dns_record_name = 6;
  optional string cloudflare_zone_name = 7;
  bool mock_provider = 8;
  bool skip_dns = 9;
  optional string snapshot_id = 10;
}

message DeployResponse {
  bool success = 1;
  DeploymentSummary deployment = 2;
  ProviderObservation provider = 3;
  RuntimeObservation runtime = 4;
  repeated string warnings = 5;
  optional Operation operation = 6;
}

message DestroyRequest {
  optional string instance_id = 1;
  optional string target_ip = 2;
  optional string dns_record_name = 3;
  optional string cloudflare_zone_name = 4;
  bool mock_provider = 5;
  bool delete_dns = 6;
  bool delete_instance = 7;
  optional string lifecycle_reason = 8;
}

message DestroyResponse {
  bool success = 1;
  repeated string warnings = 2;
  optional Operation operation = 3;
  optional DeploymentSummary deployment = 4;
}

message Operation {
  int64 id = 1;
  string kind = 2;
  OperationLifecycleStatus status = 3;
  int64 created_at_unix = 4;
}

message OperationEvent {
  int64 id = 1;
  int64 operation_id = 2;
  string message = 3;
  int64 created_at_unix = 4;
}

message OperationStatus {
  Operation operation = 1;
  repeated OperationEvent recent_events = 2;
}

message GetOperationRequest {
  int64 operation_id = 1;
}

message ListOperationEventsRequest {
  int64 operation_id = 1;
}

message ListOperationEventsResponse {
  repeated OperationEvent events = 1;
}

service ControllerService {
  rpc GetStatus(Empty) returns (ControllerStatus);
  rpc Doctor(DoctorRequest) returns (DoctorResponse);
  rpc GetSecretRef(GetSecretRefRequest) returns (SecretRefEntry);
  rpc SetSecretRef(SetSecretRefRequest) returns (SecretRefEntry);
  rpc ListSecretRefs(ListSecretRefsRequest) returns (ListSecretRefsResponse);
  rpc BootstrapRuntime(BootstrapRuntimeRequest) returns (BootstrapRuntimeResponse);
  rpc StartLocalRuntime(StartLocalRuntimeRequest) returns (LocalRuntimeResponse);
  rpc StopLocalRuntime(StopLocalRuntimeRequest) returns (LocalRuntimeResponse);
  rpc RestartLocalRuntime(RestartLocalRuntimeRequest) returns (LocalRuntimeResponse);
  rpc GetSelectorState(GetSelectorStateRequest) returns (SelectorState);
  rpc SetSelector(SetSelectorRequest) returns (SetSelectorResponse);
  rpc GetTrace(GetTraceRequest) returns (TraceObservation);
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc Destroy(DestroyRequest) returns (DestroyResponse);
  rpc GetOperation(GetOperationRequest) returns (OperationStatus);
  rpc ListOperationEvents(ListOperationEventsRequest) returns (ListOperationEventsResponse);
}

service AgentService {
  rpc GetHealth(Empty) returns (AgentState);
  rpc GetReadiness(Empty) returns (AgentState);
  rpc GetRuntimeState(Empty) returns (AgentState);
  rpc GetVersion(Empty) returns (AgentVersion);
  rpc ApplyBundle(ApplyBundleRequest) returns (ApplyBundleResponse);
  rpc BootstrapRuntime(BootstrapRuntimeRequest) returns (BootstrapRuntimeResponse);
  rpc VerifyRuntime(VerifyRuntimeRequest) returns (AgentState);
  rpc ReadBundleIdentity(ReadBundleIdentityRequest) returns (ReadBundleIdentityResponse);
  rpc ReadRenderedArtifacts(ReadRenderedArtifactsRequest) returns (ReadRenderedArtifactsResponse);
}
