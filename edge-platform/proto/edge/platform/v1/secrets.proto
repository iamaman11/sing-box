syntax = "proto3";

package edge.platform.v1;

message SecretRefEntry {
  string name = 1;
  string secret_ref = 2;
  int64 updated_at_unix = 3;
}

message GetSecretRefRequest {
  string name = 1;
}

message SetSecretRefRequest {
  string name = 1;
  string secret_ref = 2;
}

message ListSecretRefsRequest {}

message ListSecretRefsResponse {
  repeated SecretRefEntry secrets = 1;
}
