syntax = "proto3";

package edge.platform.v1;

import "edge/platform/v1/operation.proto";
import "edge/platform/v1/runtime.proto";

enum CheckStatus {
  CHECK_STATUS_UNSPECIFIED = 0;
  PASS = 1;
  FAIL = 2;
  WARN = 3;
  SKIPPED = 4;
}

enum DiagnosticSubsystem {
  DIAGNOSTIC_SUBSYSTEM_UNSPECIFIED = 0;
  DIAGNOSTIC_STATE = 1;
  PROVIDER = 2;
  SERVER_RUNTIME = 3;
  LOCAL_RUNTIME = 4;
  SELECTOR = 5;
  EGRESS = 6;
  RELEASE = 7;
  SECURITY = 8;
}

message DiagnosticEvidence {
  string code = 1;
  string summary = 2;
}

message DoctorRequest {
  bool require_server_ready = 1;
  bool require_local_runtime = 2;
  bool require_egress_traces = 3;
}

message DoctorCheck {
  // Legacy compatibility fields retained through the v1 transition.
  string name = 1;
  bool ok = 2;
  string detail = 3;

  string check_id = 4;
  CheckStatus status = 5;
  DiagnosticSubsystem subsystem = 6;
  repeated DiagnosticEvidence evidence = 7;
}

message DoctorResponse {
  bool ok = 1;
  repeated DoctorCheck checks = 2;
  ControllerStatus status = 3;
  optional TraceObservation desktop_trace = 4;
  optional TraceObservation ubuntu_trace = 5;
  optional Operation operation = 6;
}

// Bounded, read-only quality observations. No selector, DNS or route mutation.
// A latency-only result is NOT a full quality acceptance.
enum QualityPath {
  QUALITY_PATH_UNSPECIFIED = 0;
  QUALITY_PATH_LINE1 = 1;
  QUALITY_PATH_LINE2 = 2;
}
enum QualityEvidence {
  QUALITY_EVIDENCE_UNSPECIFIED = 0;
  QUALITY_EVIDENCE_LATENCY_ONLY = 1;
  QUALITY_EVIDENCE_AUTH_UNAVAILABLE = 2;
  QUALITY_EVIDENCE_UNAVAILABLE = 3;
}
message QualityRequest {}
message QualityCandidate {
  string name = 1;
  QualityPath path = 2;
  QualityEvidence evidence = 3;
  uint32 attempted = 4;
  uint32 succeeded = 5;
  optional uint32 min_latency_ms = 6;
  optional uint32 median_latency_ms = 7;
  optional uint32 p95_latency_ms = 8;
  optional uint32 jitter_ms = 9;
  optional string egress_ip = 10;
  optional string colo = 11;
  optional string warp = 12;
  optional uint64 download_bytes_per_second = 13;
  string note = 14;
}
message QualityReport {
  // Always false until all 10 candidates have independently confirmed
  // request/egress/throughput evidence. Never equate delay with full quality.
  bool full_matrix_accepted = 1;
  repeated QualityCandidate candidates = 2;
  string note = 3;
}

