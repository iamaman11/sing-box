syntax = "proto3";

package edge.platform.v1;

import "edge/platform/v1/common.proto";
import "edge/platform/v1/operation.proto";

message AgentState {
  bool healthy = 1;
  bool ready = 2;
  string topology_version = 3;
  optional string active_bundle_id = 4;
  repeated string degraded_reasons = 5;
  bool docker_reachable = 6;
  bool compose_file_present = 7;
  optional string observed_stack_path = 8;
  repeated string running_containers = 9;
  repeated string missing_containers = 10;
  repeated uint32 listening_tcp_ports = 11;
  repeated uint32 listening_udp_ports = 12;
  optional bool direct_egress_ready = 13;
  optional bool warp_egress_ready = 14;
  optional bool mesh_runtime_ready = 15;
  repeated ContainerRuntimeObservation containers = 16;
}

message ContainerRuntimeObservation {
  string name = 1;
  bool present = 2;
  bool running = 3;
  optional string expected_image = 4;
  optional string observed_image = 5;
  bool exact_image_ready = 6;
  optional string health = 7;
  optional int64 exit_code = 8;
  optional uint64 restart_count = 9;
  optional bool oom_killed = 10;
  repeated string networks = 11;
  repeated string published_ports = 12;
  repeated string mounts = 13;
  bool runtime_error_present = 14;
  repeated string recent_events = 15;
}

message ControllerStatus {
  InventoryReport inventory = 1;
  AgentState agent_state = 2;
  LocalSingboxState local_singbox = 3;
  DeploymentSummary deployment = 4;
  ProviderObservation provider = 5;
  RuntimeObservation runtime = 6;
  SelectorState selector = 7;
  repeated string status_notes = 8;
  SelectorState ubuntu_selector = 9;
  UbuntuProxyState ubuntu_proxy = 10;
  AppReadinessPhase app_readiness_phase = 11;
}

message Ipv4LinkObservation {
  uint32 interface_index = 1;
  string name = 2;
  bool up = 3;
  bool lower_up = 4;
  bool loopback = 5;
}

message Ipv4AddressObservation {
  uint32 interface_index = 1;
  string address = 2;
  uint32 prefix_length = 3;
  bool global_scope = 4;
}

message Ipv4RouteObservation {
  string destination = 1;
  uint32 prefix_length = 2;
  uint32 output_interface_index = 3;
  optional string preferred_source = 4;
  bool kernel_protocol = 5;
  bool link_scope = 6;
}

message Ipv4NetworkObservation {
  repeated Ipv4LinkObservation links = 1;
  repeated Ipv4AddressObservation addresses = 2;
  repeated Ipv4RouteObservation routes = 3;
}

message AgentVersion {
  string name = 1;
  string version = 2;
}

message BootstrapRuntimeRequest {
  BootstrapMode mode = 1;
}

message BootstrapRuntimeResponse {
  bool success = 1;
  BootstrapMode mode = 2;
  int32 exit_code = 3;
  string stdout = 4;
  string stderr = 5;
  AgentState post_state = 6;
  repeated string warnings = 7;
}

message LocalSingboxState {
  bool process_running = 1;
  bool managed_config = 2;
  string expected_config_path = 3;
  optional string active_config_path = 4;
  optional uint32 clash_api_port = 5;
  repeated string warnings = 6;
}

message WindowsTunnelBinding {
  string domain = 1;
  uint32 hy2_port = 2;
  string hy2_password = 3;
  uint32 vless_port = 4;
  string vless_uuid = 5;
  string reality_public_key = 6;
  string reality_short_id = 7;
}

message WindowsRuntimeState {
  uint32 schema_version = 1;
  optional string deployment_label = 2;
  string instance_id = 3;
  string server_ip = 4;
  WindowsTunnelBinding direct = 5;
  WindowsTunnelBinding warp = 6;
}

message StartLocalRuntimeRequest {
  optional string singbox_binary_path = 1;
  optional string config_path = 2;
  optional string state_path = 3;
  bool force_restart = 4;
  bool visible_window = 5;
}

message StopLocalRuntimeRequest {
  optional string config_path = 1;
  bool expected_config_only = 2;
}

message RestartLocalRuntimeRequest {
  optional string singbox_binary_path = 1;
  optional string config_path = 2;
  optional string state_path = 3;
  bool visible_window = 4;
}

message LocalRuntimeResponse {
  bool success = 1;
  optional uint32 pid = 2;
  string note = 3;
  repeated string warnings = 4;
  optional Operation operation = 5;
  LocalSingboxState local_singbox = 6;
}

message DeploymentSummary {
  bool live_state_present = 1;
  optional string source_state_path = 2;
  optional string deployment_label = 3;
  optional string instance_id = 4;
  optional string server_ip = 5;
  optional string tunnel_domain = 6;
}

message ProviderObservation {
  bool configured = 1;
  string compute_provider = 2;
  string dns_provider = 3;
  repeated string warnings = 4;
}

message RuntimeObservation {
  bool edge_agent_reachable = 1;
  string runtime_kind = 2;
  repeated string warnings = 3;
  bool docker_reachable = 4;
  optional string observed_stack_path = 5;
  repeated string running_containers = 6;
  repeated string missing_containers = 7;
  repeated uint32 listening_tcp_ports = 8;
  repeated uint32 listening_udp_ports = 9;
  optional string topology_version = 10;
  optional string active_bundle_id = 11;
  bool compose_file_present = 12;
}

message ProxyGroupState {
  string name = 1;
  optional string selected = 2;
  repeated string candidates = 3;
  repeated string warnings = 4;
}

message SelectorState {
  optional string desired_main_route = 1;
  optional string observed_main_route = 2;
  bool degraded = 3;
  repeated string warnings = 4;
  repeated ProxyGroupState proxy_groups = 5;
}

message UbuntuProxyState {
  bool available = 1;
  optional string host = 2;
  optional uint32 port = 3;
  optional string url = 4;
  repeated string warnings = 5;
}

message GetSelectorStateRequest {
  optional string group = 1;
}

message SetSelectorRequest {
  string group = 1;
  string name = 2;
}

message SetSelectorResponse {
  bool success = 1;
  optional string previous = 2;
  optional string current = 3;
  repeated string warnings = 4;
  optional Operation operation = 5;
  SelectorState selector = 6;
}

message GetTraceRequest {
  optional string proxy_url = 1;
}

message TraceObservation {
  bool available = 1;
  optional string ip = 2;
  optional string warp = 3;
  optional string colo = 4;
  optional string note = 5;
}

message MeshRuntimeConvergeRequest {
  string node_token = 1;
}

enum RuntimeProbeStatus {
  RUNTIME_PROBE_STATUS_UNSPECIFIED = 0;
  RUNTIME_PROBE_STATUS_OK = 1;
  RUNTIME_PROBE_STATUS_TIMEOUT = 2;
  RUNTIME_PROBE_STATUS_COMMAND_NOT_FOUND = 3;
  RUNTIME_PROBE_STATUS_PERMISSION_DENIED = 4;
  RUNTIME_PROBE_STATUS_UNSUPPORTED = 5;
  RUNTIME_PROBE_STATUS_NON_ZERO = 6;
  RUNTIME_PROBE_STATUS_EMPTY = 7;
  RUNTIME_PROBE_STATUS_PARSE_ERROR = 8;
  RUNTIME_PROBE_STATUS_OUTPUT_LIMIT = 9;
}

message RuntimeProbeEvidence {
  RuntimeProbeStatus status = 1;
  optional int32 exit_code = 2;
  // Bounded and secret-redacted detail. Populated only for approved failed probes.
  optional string diagnostic_stdout = 3;
  optional string diagnostic_stderr = 4;
}

message MeshContainerDiagnostics {
  bool present = 1;
  bool running = 2;
  optional int64 exit_code = 3;
  bool runtime_error_present = 4;
  repeated string recent_events = 5;
  string name = 6;
  optional string image = 7;
  optional uint64 restart_count = 8;
  optional bool oom_killed = 9;
  repeated string networks = 10;
}

message RuntimeNetworkInterface {
  string name = 1;
  optional uint32 mtu = 2;
  bool up = 3;
  repeated string addresses = 4;
}

message RuntimeNetworkRoute {
  string destination = 1;
  optional string gateway = 2;
  optional string device = 3;
  optional string preferred_source = 4;
  optional uint32 metric = 5;
  optional string table = 6;
  optional string protocol = 7;
}

message RuntimeNetworkRule {
  optional uint32 priority = 1;
  optional string source = 2;
  optional string destination = 3;
  optional string table = 4;
}

message RuntimeDnsDiagnostics {
  RuntimeProbeEvidence probe = 1;
  repeated string nameservers = 2;
  repeated string search_domains = 3;
}

message RuntimeSocketEndpoint {
  string protocol = 1;
  string local_address = 2;
  optional uint32 local_port = 3;
  optional string remote_address = 4;
  optional uint32 remote_port = 5;
  optional string state = 6;
}

message RuntimeRouteEvent {
  uint32 changed_count = 1;
  string window = 2;
  // True means this is only an aggregate counter, not event-level route evidence.
  bool aggregate_counter_only = 3;
}

message HostIdentityDiagnostics {
  RuntimeProbeEvidence probe = 1;
  optional string hostname = 2;
  optional string kernel_release = 3;
  optional string architecture = 4;
}

message HostTimeDiagnostics {
  RuntimeProbeEvidence probe = 1;
  optional uint64 unix_time_seconds = 2;
  optional uint64 uptime_seconds = 3;
}

message HostResourceDiagnostics {
  RuntimeProbeEvidence probe = 1;
  optional uint32 logical_cpus = 2;
  optional double load_1 = 3;
  optional double load_5 = 4;
  optional double load_15 = 5;
  optional uint64 memory_total_bytes = 6;
  optional uint64 memory_available_bytes = 7;
}

message HostRuntimeDiagnostics {
  HostIdentityDiagnostics identity = 1;
  HostTimeDiagnostics time = 2;
  HostResourceDiagnostics resources = 3;
}

message MeshRuntimeFailureSnapshot {
  uint64 observed_unix_time_seconds = 1;
  repeated string reasons = 2;
  optional string warp_connection_state = 3;
  optional string tunnel_protocol = 4;
  RuntimeProbeStatus warp_status = 5;
  RuntimeProbeStatus warp_settings = 6;
  RuntimeProbeStatus tun_device_status = 7;
  RuntimeProbeStatus ipv4_forwarding_status = 8;
  bool container_present = 9;
  bool container_running = 10;
  optional int64 container_exit_code = 11;
  optional uint64 container_restart_count = 12;
  optional bool container_oom_killed = 13;
  optional string container_image = 14;
  repeated string container_networks = 15;
  bool exact_image_ready = 16;
}

message RuntimeNetworkDiagnostics {
  RuntimeProbeEvidence interfaces_probe = 1;
  repeated RuntimeNetworkInterface interfaces = 2;
  RuntimeProbeEvidence routes_probe = 3;
  repeated RuntimeNetworkRoute routes = 4;
  RuntimeProbeEvidence rules_probe = 5;
  repeated RuntimeNetworkRule rules = 6;
  RuntimeDnsDiagnostics dns = 7;
  RuntimeProbeEvidence sockets_probe = 8;
  repeated RuntimeSocketEndpoint sockets = 9;
  // Legacy compatibility field. Use default_route_present_observed for observation quality.
  bool default_route_present = 10 [deprecated = true];
  optional bool default_route_present_observed = 11;
}

message MeshRuntimeDiagnostics {
  RuntimeProbeEvidence warp_status_probe = 1;
  optional string warp_connection_state = 2;
  RuntimeProbeEvidence warp_settings_probe = 3;
  optional string tunnel_protocol = 4;
  RuntimeProbeEvidence tun_device_probe = 5;
  optional bool tun_device_present = 6;
  RuntimeProbeEvidence ipv4_forwarding_probe = 7;
  optional bool ipv4_forwarding = 8;
  bool mesh_network_attached = 9;
  MeshContainerDiagnostics container = 10;
  RuntimeProbeEvidence capability_probe = 11;
  optional bool net_admin_present = 12;
  optional bool net_raw_present = 13;
  RuntimeNetworkDiagnostics host_network = 14;
  RuntimeNetworkDiagnostics container_network = 15;
  repeated RuntimeRouteEvent route_events = 16;
  HostRuntimeDiagnostics host = 17;
}

message MeshRuntimeState {
  bool token_store_present = 1;
  bool container_running = 2;
  bool exact_image_ready = 3;
  bool runtime_ready = 4;
  repeated string warnings = 5;
  MeshRuntimeDiagnostics diagnostics = 6;
  MeshRuntimeFailureSnapshot last_failure_snapshot = 7;
}
