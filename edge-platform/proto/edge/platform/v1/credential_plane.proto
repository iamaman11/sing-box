syntax = "proto3";

package edge.platform.v1;

enum CredentialProjectionKind {
  CREDENTIAL_PROJECTION_KIND_UNSPECIFIED = 0;
  CREDENTIAL_PROJECTION_KIND_WINDOWS = 1;
  CREDENTIAL_PROJECTION_KIND_VM = 2;
}

enum CredentialDeliverySlot {
  CREDENTIAL_DELIVERY_SLOT_UNSPECIFIED = 0;
  CREDENTIAL_DELIVERY_SLOT_A = 1;
  CREDENTIAL_DELIVERY_SLOT_B = 2;
}

// Phase 2 deliberately carries no application credential material. This typed,
// bounded payload exists only to prove that Windows and VM delivery projections
// are physically isolated before real credential generation is authorized.
message CredentialIsolationProbe {
  uint32 schema_version = 1;
  uint64 generation = 2;
  CredentialProjectionKind projection = 3;
  bool dummy_non_secret = 4;
}

// Shared client/server tunnel authentication. These values are consumed by both
// the Windows client and VM server. Reality key identity is deliberately not
// part of this lifecycle so routine tunnel-auth rotation cannot replace server
// identity accidentally.
message TunnelAuthentication {
  string vless_uuid = 1;
  string hysteria2_password = 2;
  string reality_short_id = 3;
}

message TunnelAuthenticationGeneration {
  uint64 generation = 1;
  TunnelAuthentication direct = 2;
  TunnelAuthentication warp = 3;
}

// Reality server identity rotates independently from tunnel authentication.
// One semantic generator creates each X25519 pair once; only the public half is
// projected to Windows and only the private half to the VM.
message RealityPublicIdentity {
  string public_key = 1;
}

message RealityPrivateIdentity {
  string private_key = 1;
}

message RealityPublicIdentityGeneration {
  uint64 generation = 1;
  RealityPublicIdentity direct = 2;
  RealityPublicIdentity warp = 3;
}

message RealityPrivateIdentityGeneration {
  uint64 generation = 1;
  RealityPrivateIdentity direct = 2;
  RealityPrivateIdentity warp = 3;
}

// Line 2 proxy authentication has an independent lifecycle. Rotating tunnel
// authentication or Reality identity must not implicitly replace this password.
message ProxyCredentialGeneration {
  uint64 generation = 1;
  string password = 2;
}

// Least-privilege Windows payload. Non-secret endpoint/domain/port policy stays
// in Git-owned desired state and is not duplicated here.
message WindowsCredentialProjection {
  TunnelAuthenticationGeneration tunnel_auth = 1;
  RealityPublicIdentityGeneration reality_identity = 2;
}

// Least-privilege VM payload. Mesh, Access and provider-control credentials are
// separate lifecycle classes and are intentionally absent from this message.
message VmCredentialProjection {
  TunnelAuthenticationGeneration tunnel_auth = 1;
  RealityPrivateIdentityGeneration reality_identity = 2;
  ProxyCredentialGeneration line2_proxy = 3;
}

// Local secret state contains only references to immutable canonical bundle
// blobs. Secret payload bytes remain in those private bundle files and never
// enter SQLite/JSON/provider metadata.
message LocalCredentialBundleRef {
  uint64 generation = 1;
  CredentialDeliverySlot slot = 2;
  string sha256 = 3;

  // Derived non-secret lifecycle metadata. These values let the GitHub-only
  // credential owner plan later independent rotations without reading active
  // Worker secret plaintext back from Cloudflare.
  uint64 tunnel_auth_generation = 4;
  uint64 reality_identity_generation = 5;
  optional uint64 line2_proxy_generation = 6;
}

// One local runtime owner has one projection-specific state machine. Candidate
// and previous are bounded; candidate and previous never coexist because the
// fixed A/B transport has only one inactive slot.
message LocalCredentialState {
  uint32 schema_version = 1;
  CredentialProjectionKind projection = 2;
  LocalCredentialBundleRef active = 3;
  LocalCredentialBundleRef candidate = 4;
  LocalCredentialBundleRef previous = 5;
  bool candidate_acceptance_enabled = 6;
}

// Permanent credential-delivery envelope. Worker secret slots contain the
// lowercase-hex canonical protobuf encoding of this message.
//
// schema_version=1 remains the fixed A/B transport contract. The outer
// generation is the delivery-snapshot revision; nested credential generations
// express independently rotating application credential lifecycles.
//
// Phase 6A dummy bundles set dummy_non_secret=true and carry no payload.
// Real bundles set dummy_non_secret=false and carry exactly one payload whose
// type matches projection.
message CredentialDeliveryBundle {
  uint32 schema_version = 1;
  uint64 generation = 2;
  CredentialProjectionKind projection = 3;
  bool dummy_non_secret = 4;

  // Phase 6A dummy bundles leave this unspecified, preserving their exact
  // accepted wire bytes. Real bundles identify the fixed A/B transport slot so
  // local active state can select the opposite slot for the next candidate.
  CredentialDeliverySlot slot = 5;

  oneof payload {
    WindowsCredentialProjection windows = 10;
    VmCredentialProjection vm = 11;
  }
}

// Runtime owners expose only non-activating candidate staging. The request is a
// typed credential bundle, never an arbitrary byte bag. The response contains
// only non-secret local state references.
message StageCredentialCandidateRequest {
  CredentialDeliveryBundle bundle = 1;
}

message CredentialStateObservation {
  LocalCredentialState state = 1;
}

message CredentialIngressPublicKey {
  uint32 schema_version = 1;
  CredentialProjectionKind projection = 2;

  // X25519 public key, base64url without padding. The corresponding private key
  // never leaves the existing local private credential root.
  string public_key = 3;
  string sha256 = 4;
}

// End-to-end encrypted transport envelope. GitHub runners may carry this
// ciphertext but cannot decrypt the contained credential bundle.
message SealedCredentialCandidate {
  uint32 schema_version = 1;
  CredentialProjectionKind projection = 2;
  uint64 generation = 3;
  CredentialDeliverySlot slot = 4;
  string recipient_key_sha256 = 5;
  string ephemeral_public_key = 6;
  string nonce = 7;
  string ciphertext = 8;
}

message StageSealedCredentialCandidateRequest {
  SealedCredentialCandidate candidate = 1;
}

message CredentialCandidateAcceptance {
  bool direct_pass = 1;
  bool warp_pass = 2;
  LocalCredentialBundleRef candidate = 3;
  string direct_colo = 4;
  string warp_colo = 5;
}


