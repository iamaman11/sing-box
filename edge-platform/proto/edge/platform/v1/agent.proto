syntax = "proto3";

package edge.platform.v1;

import "edge/platform/v1/bundle.proto";
import "edge/platform/v1/common.proto";
import "edge/platform/v1/credential_plane.proto";
import "edge/platform/v1/runtime.proto";

service AgentService {
  rpc GetHealth(Empty) returns (AgentState);
  rpc GetReadiness(Empty) returns (AgentState);
  rpc GetRuntimeState(Empty) returns (AgentState);
  rpc GetVersion(Empty) returns (AgentVersion);
  rpc ObserveIpv4Network(Empty) returns (Ipv4NetworkObservation);
  rpc ApplyBundle(ApplyBundleRequest) returns (ApplyBundleResponse);
  // Separate first-enrollment path: stores verified policy only, with no
  // runtime secrets, running containers, bootstrap, or active credential cursor.
  rpc StageInitialPolicyBundle(ApplyBundleRequest) returns (ApplyBundleResponse);
  rpc RollbackBundle(RollbackBundleRequest) returns (RollbackBundleResponse);
  rpc BootstrapRuntime(BootstrapRuntimeRequest) returns (BootstrapRuntimeResponse);
  rpc VerifyRuntime(VerifyRuntimeRequest) returns (AgentState);
  rpc ReadBundleIdentity(ReadBundleIdentityRequest) returns (ReadBundleIdentityResponse);
  rpc ReadRenderedArtifacts(ReadRenderedArtifactsRequest) returns (ReadRenderedArtifactsResponse);
  rpc ConvergeMeshRuntime(MeshRuntimeConvergeRequest) returns (MeshRuntimeState);
  rpc VerifyMeshRuntime(Empty) returns (MeshRuntimeState);
  rpc CleanupMeshRuntime(Empty) returns (MeshRuntimeState);
  rpc VerifyInitialCredentialHost(InitialCredentialHostProbeRequest) returns (InitialCredentialHostProbeResponse);
  rpc ApplyInitialVmCredential(InitialVmCredentialRuntimeRequest) returns (InitialVmCredentialRuntimeResponse);
  rpc VerifyInitialVmCredential(InitialVmCredentialRuntimeRequest) returns (InitialVmCredentialRuntimeResponse);
  rpc StageCredentialCandidate(StageCredentialCandidateRequest) returns (CredentialStateObservation);
  rpc GetCredentialState(Empty) returns (CredentialStateObservation);
}
