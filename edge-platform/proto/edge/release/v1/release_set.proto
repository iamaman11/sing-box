syntax = "proto3";

package edge.release.v1;

// Immutable production release authority. The SHA-256 of the exact canonical
// release-set.pb bytes is the release identity. Do not use maps in this schema.
message ReleaseSet {
  uint32 schema_version = 1;
  string source_revision = 2;
  SingBoxRelease sing_box = 3;
  WindowsRuntime windows_runtime = 4;
  VmRuntime vm_runtime = 5;
  CloudflareRuntime cloudflare = 6;
  SchemaVersions schemas = 7;
}

message SingBoxRelease {
  // Normalized stable version without a leading "v", prerelease, or build metadata.
  string version = 1;
  bytes windows_amd64_sha256 = 2;
  bytes linux_amd64_sha256 = 3;
}

message WindowsRuntime {
  bytes artifact_sha256 = 1;
  bytes controller_sha256 = 2;
  bytes console_sha256 = 3;
  bytes sing_box_sha256 = 4;
  // Versioned digest of the complete source/build/dependency inputs that can
  // change the reusable Windows candidate. Present from ReleaseSet v5.
  bytes input_sha256 = 5;
  // Source revision that originally produced the exact reusable Windows
  // artifact. Stable across later control-plane-only releases that reuse it.
  string source_revision = 6;
  // Read-only diagnostic binary bound to the same exact Windows release.
  // Present from ReleaseSet v6.
  bytes diagnostic_sha256 = 7;
}

message WindowsActivationState {
  uint32 schema_version = 1;
  string release_set_sha256 = 2;
  string source_revision = 3;
  string release_dir = 4;
  string controller_path = 5;
  string console_path = 6;
  string sing_box_path = 7;
  string diagnostic_path = 8;
  bytes controller_sha256 = 9;
  bytes console_sha256 = 10;
  bytes sing_box_sha256 = 11;
  bytes diagnostic_sha256 = 12;
}

message VmRuntime {
  bytes edge_agent_sha256 = 1;
  OciImage sing_box_image = 2;
  OciImage warp_egress_image = 3;
  string docker_engine_version = 4;
  string containerd_version = 5;
  string compose_version = 6;
  bytes edge_controller_sha256 = 7;
  bytes edge_orchestrator_sha256 = 8;
  // Versioned digest of every source/build/dependency input that can change the
  // reusable VM application runtime artifact set. Present from ReleaseSet v4.
  bytes runtime_input_sha256 = 9;
  // Source revision that originally produced the reusable VM runtime artifact
  // set. This remains stable when a later control-plane-only release reuses it.
  string runtime_source_revision = 10;
}

message CloudflareRuntime {
  string warp_version = 1;
  OciImage mesh_image = 2;
}

message SchemaVersions {
  uint32 config_schema = 1;
  uint32 db_schema = 2;
}

// Repository is tag-free and digest-free. The immutable digest is stored as
// exactly 32 raw SHA-256 bytes to prevent mutable-tag deployment identity.
message OciImage {
  string repository = 1;
  bytes sha256 = 2;
}
