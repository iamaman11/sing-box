name: N1 N2 Immutable Acceptance Resume
on:
  workflow_call:
    inputs:
      source_run_id:
        type: string
        required: true
permissions: {}
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read
    timeout-minutes: 15
    outputs:
      accepted: ${{ steps.proof.outputs.accepted }}
      release: ${{ steps.proof.outputs.release }}
      generation: ${{ steps.proof.outputs.generation }}
    steps:
      - name: Read-only attest one original publication, physical proofs and immutable ReleaseSet
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          ACCEPTED_REVISION: ""
          OUTPUT_DIR: ${{ runner.temp }}/original-release
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "iamaman11/sing-box"
          test "$GITHUB_REPOSITORY_ID" = "1221750822"
          test "$GITHUB_ACTOR_ID" = "44100369"
          test "$GITHUB_EVENT_NAME" = "issue_comment"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]{7,}$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/origin.json"
          jq -e --argjson id "$SOURCE_RUN" '.id==$id and .event=="issue_comment" and .head_branch=="main" and .run_attempt==1 and .status=="completed" and .conclusion=="failure" and .actor.id==44100369 and (.head_sha|test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/origin.json" >/dev/null
          export ACCEPTED_REVISION="$(jq -er .head_sha "$RUNNER_TEMP/origin.json")"
          gh api --paginate "repos/$REPOSITORY/issues/26/comments?per_page=100" | jq -s 'add' > "$RUNNER_TEMP/history.json"
          jq -er --arg marker '<!-- sing-box-credential-initial-attempt/v1 -->' '[.[]|.body|select(startswith($marker))] | if length==1 then .[0] else error("not one original BEGIN") end' "$RUNNER_TEMP/history.json" > "$RUNNER_TEMP/exact-begin"
          sed -n '2p' "$RUNNER_TEMP/exact-begin" > "$RUNNER_TEMP/begin.json"
          jq -e --argjson src "$SOURCE_RUN" '.schema=="sing-box.credential-initial-attempt/v1" and .phase=="BEGIN" and .github_run_id==$src and .generation==$src and .slot=="B" and (.release_set_sha256|test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/begin.json" >/dev/null
          jq -e --arg marker '<!-- sing-box-initial-resume-reboot/v1 -->' '[.[]|.body|select(startswith($marker))]|length==0' "$RUNNER_TEMP/history.json" >/dev/null
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$RUNNER_TEMP/origin-jobs.json"
          for job in \
            "vultr / One-time GitHub BEGIN then version-fenced paired Worker publication" \
            "vultr / Apply once and verify native VM runtime credential consumption" \
            "vultr / Independent public-port Line2 six-proxy HTTPS/TLS/auth witness" \
            "vultr / Revoke run-scoped Access token and remove temporary GitHub escrow" \
            "vultr / Destroy only this run's isolated Windows acceptance tree"; do
            jq -e --arg name "$job" '[.jobs[]|select(.name==$name and .conclusion=="success")]|length==1' "$RUNNER_TEMP/origin-jobs.json" >/dev/null
          done
          release="$(jq -er .release_set_sha256 "$RUNNER_TEMP/begin.json")"
          git init -q
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$ACCEPTED_REVISION"
          git checkout -q --detach FETCH_HEAD
          export EXPECTED_RELEASE_TAG="edge-release-$release"
          bash edge-platform/scripts/resolve_durable_release.sh
          . "$OUTPUT_DIR/resolved.env"
          test "$EDGE_ACCEPTED_REVISION" = "$ACCEPTED_REVISION"
          test "$EDGE_RELEASE_SET_SHA256" = "$release"
          test "$EDGE_CANDIDATE_REVISION" = "$(jq -er .release_source_revision "$RUNNER_TEMP/begin.json")"
          printf 'accepted=%s\nrelease=%s\ngeneration=%s\n' "$ACCEPTED_REVISION" "$release" "$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo 'N1_N2_ORIGINAL_WORKER_AND_VM_PROOFS=REUSED_EXACT' >> "$GITHUB_STEP_SUMMARY"

  access:
    needs: source
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Issue separate per-run Windows Access token via existing Cloudflare credential owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/acceptance-access
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -n "$CLOUDFLARE_CONTROL_TOKEN"; test -n "$CONTROL_PLANE_TOKEN"
          names="$(GH_TOKEN="$CONTROL_PLANE_TOKEN" gh secret list --repo "$REPOSITORY" --env production-vultr --json name --jq '.[].name')"
          if grep -Eq '^CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_(ID|SECRET)$' <<<"$names"; then exit 1; fi
          git init -q
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$ACCEPTED_REVISION"
          git checkout -q --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          . "$OUTPUT_DIR/resolved.env"
          test "$EDGE_ACCEPTED_REVISION" = "$GITHUB_SHA"
          owner="$OUTPUT_DIR/edge-orchestrator-linux-amd64"
          test "$(sha256sum "$owner"|cut -d' ' -f1)" = "$EDGE_ORCHESTRATOR_SHA256"
          chmod 755 "$owner"
          export EDGE_RELEASE_CONTEXT_PATH="$OUTPUT_DIR/resolved.env"
          umask 077
          "$owner" credentials initial-windows-acceptance-issue "$GITHUB_RUN_ID" "$RUNNER_TEMP/temp-id.env" "$RUNNER_TEMP/token-id" > "$RUNNER_TEMP/issue.txt"
          grep -Fxq 'acceptance_access_policy=HOST_PLUS_EXACT_ONE_RUN_SCOPED' "$RUNNER_TEMP/issue.txt"
          test -s "$RUNNER_TEMP/token-id"
          client="$(sed -n 's/^CF_ACCESS_CLIENT_ID=//p' "$RUNNER_TEMP/temp-id.env")"
          secret="$(sed -n 's/^CF_ACCESS_CLIENT_SECRET=//p' "$RUNNER_TEMP/temp-id.env")"
          test -n "$client"; test -n "$secret"
          echo "::add-mask::$client"; echo "::add-mask::$secret"
          printf '%s' "$client" | GH_TOKEN="$CONTROL_PLANE_TOKEN" gh secret set CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_ID --repo "$REPOSITORY" --env production-vultr
          printf '%s' "$secret" | GH_TOKEN="$CONTROL_PLANE_TOKEN" gh secret set CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_SECRET --repo "$REPOSITORY" --env production-vultr
          rm -f "$RUNNER_TEMP/temp-id.env" "$RUNNER_TEMP/token-id"

  windows:
    needs: [source, access]
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 25
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SOURCE_ACCEPTED: ${{ needs.source.outputs.accepted }}
      SOURCE_RELEASE: ${{ needs.source.outputs.release }}
      GENERATION: ${{ needs.source.outputs.generation }}
      EDGE_GITHUB_TOKEN: ${{ github.token }}
      EDGE_WINDOWS_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_ID }}
      EDGE_WINDOWS_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ORIGINAL immutable ProxyOnly release and prove real Line1 4 of 4, no privileged task
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:GITHUB_REPOSITORY_ID -cne '1221750822') { throw 'Foreign Windows acceptance owner' }
          if (-not $env:EDGE_WINDOWS_ACCESS_CLIENT_ID -or -not $env:EDGE_WINDOWS_ACCESS_CLIENT_SECRET) { throw 'Isolated Access identity missing' }
          if ((Get-Service -Name EdgePlatformController -ErrorAction Stop).Status -ne 'Stopped') { throw 'Serving SCM not stopped' }
          $root='C:\sing-box-acceptance'
          if (Test-Path -LiteralPath $root) { throw 'Existing isolated root, cannot overwrite' }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $sid=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $root '/inheritance:r' '/grant:r' "*$($sid):(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Windows isolated ACL failure' }
          [IO.File]::WriteAllText((Join-Path $root '.first-use-run'), "$env:GITHUB_RUN_ID|$env:SOURCE_RELEASE")
          $installer=Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\install-windows-release.ps1'
          & $installer -Repository 'iamaman11/sing-box' -ReleaseSetSha256 $env:SOURCE_RELEASE -AcceptedRevision $env:SOURCE_ACCEPTED -InstallRoot $root -GitHubToken $env:EDGE_GITHUB_TOKEN -ArchivedAcceptanceSourceRunId ([UInt64]$env:GENERATION)
          if ($LASTEXITCODE -ne 0) { throw 'Original release install failed' }
          $doctor=@(& (Join-Path $root 'bin\edge-diagnostic.exe') doctor (Join-Path $root 'current.pb'))
          if ($LASTEXITCODE -ne 0 -or -not ($doctor -contains 'windows_datapath_mode=ProxyOnly') -or -not ($doctor -contains "release_set_sha256=$env:SOURCE_RELEASE")) { throw 'Wrong Windows release or mode' }
          $console=Join-Path $root 'bin\edge-console.exe'
          & $console credential-initial-acceptance-bootstrap --install-root $root
          if ($LASTEXITCODE -ne 0) { throw 'Initial Access bootstrap failed, no retry' }
          & $console credential-initial-acceptance-stage ([UInt64]$env:GENERATION) --install-root $root
          if ($LASTEXITCODE -ne 0) { throw 'Worker read-only generation fetch/stage failed, no retry' }
          # The existing native witness reads candidate, checks sing-box,
          # sends HTTPS traffic and rejects four sets of wrong credentials.
          # The isolated root has NO privileged dispatcher or serving SCM.
          $raw=@(& $console credential-initial-line1-witness ([UInt64]$env:GENERATION) --install-root $root)
          if ($LASTEXITCODE -ne 0 -or -not ($raw -contains 'line1_external_4_of_4=PASS') -or -not ($raw -contains 'line1_direct_warp_egress_distinct=true') -or -not ($raw -contains 'windows_tun_mutations=0') -or -not ($raw -contains 'windows_scm_mutations=0')) { throw 'External Line1 not 4/4' }
          Write-Host 'N2_RESUME_EXTERNAL_LINE1_4_OF_4=PASS'
          Write-Host 'WINDOWS_SERVING_INSTALL_ROOT=UNTOUCHED'

  vm:
    needs: source
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      ip: ${{ steps.witness.outputs.ip }}
      provider: ${{ steps.witness.outputs.provider }}
      domain: ${{ steps.witness.outputs.domain }}
      username: ${{ steps.witness.outputs.username }}
    steps:
      - name: Existing exact VM NOOP owner and public authenticated Line2 6 of 6
        id: witness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ needs.source.outputs.accepted }}
          OUTPUT_DIR: ${{ runner.temp }}/vm-original-release
          RELEASE_SET: ${{ needs.source.outputs.release }}
          GENERATION: ${{ needs.source.outputs.generation }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VM_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          VM_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test -n "$VM_ACCESS_CLIENT_ID"; test -n "$VM_ACCESS_CLIENT_SECRET"
          git init -q
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$ACCEPTED_REVISION"
          git checkout -q --detach FETCH_HEAD
          export EXPECTED_RELEASE_TAG="edge-release-$RELEASE_SET"
          bash edge-platform/scripts/resolve_durable_release.sh
          . "$OUTPUT_DIR/resolved.env"
          test "$EDGE_RELEASE_SET_SHA256" = "$RELEASE_SET"
          owner="$OUTPUT_DIR/edge-orchestrator-linux-amd64"
          test "$(sha256sum "$owner"|cut -d' ' -f1)" = "$EDGE_ORCHESTRATOR_SHA256"
          chmod 755 "$owner"
          export EDGE_RELEASE_CONTEXT_PATH="$OUTPUT_DIR/resolved.env"
          "$owner" vultr-lifecycle plan infra/vultr/application-acceptance.json application-acceptance-1 > "$RUNNER_TEMP/plan.json"
          provider="$(jq -er 'if (.plans|length)==1 and .plans[0].class=="NOOP" and .plans[0].machine_id=="application-acceptance-1" then .plans[0].provider_id else error("not owned NOOP VM") end' "$RUNNER_TEMP/plan.json")"
          "$owner" vultr-lifecycle inventory infra/vultr/application-acceptance.json > "$RUNNER_TEMP/inventory.json"
          ip="$(jq -er --arg id "$provider" '[.inventory.resources[]|select(.provider_id==$id)]|if length==1 then .[0].main_ip else error("unknown VM IPv4") end' "$RUNNER_TEMP/inventory.json")"
          spec=infra/application/disposable-acceptance.json
          test "$(jq -er .machine_id "$spec")" = "application-acceptance-1"
          domain="$(jq -er .runtime_policy.line1.tunnel_domain "$spec")"
          username="$(jq -er .runtime_policy.line2.proxy_username "$spec")"
          test "$(jq -er .runtime_policy.line2.proxy_cert_cn "$spec")" = "$domain"
          identity="$RUNNER_TEMP/worker-access.env"
          umask 077
          printf 'CF_ACCESS_CLIENT_ID=%s\nCF_ACCESS_CLIENT_SECRET=%s\n' "$VM_ACCESS_CLIENT_ID" "$VM_ACCESS_CLIENT_SECRET" > "$identity"
          sudo chown root:root "$identity"; sudo chmod 0600 "$identity"
          trap 'sudo rm -f "$identity"' EXIT
          sudo env EDGE_RELEASE_CONTEXT_PATH="$EDGE_RELEASE_CONTEXT_PATH" "$owner" credentials initial-line2-external-witness "$GENERATION" "$ip" "$domain" "$username" "$identity" > "$RUNNER_TEMP/line2.txt"
          grep -Fxq 'line2_external_6_of_6=PASS' "$RUNNER_TEMP/line2.txt"
          grep -Fxq 'line2_direct_warp_egress_distinct=true' "$RUNNER_TEMP/line2.txt"
          test "$(grep -c '^line2_external_endpoint=' "$RUNNER_TEMP/line2.txt")" -eq 6
          printf 'ip=%s\nprovider=%s\ndomain=%s\nusername=%s\n' "$ip" "$provider" "$domain" "$username" >> "$GITHUB_OUTPUT"

  reboot:
    needs: [source, windows, vm]
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - name: Commit one reboot BEGIN then one exact provider reboot and prove external Line2 again
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ needs.source.outputs.accepted }}
          OUTPUT_DIR: ${{ runner.temp }}/reboot-original-release
          SOURCE_RUN: ${{ inputs.source_run_id }}
          RELEASE_SET: ${{ needs.source.outputs.release }}
          GENERATION: ${{ needs.source.outputs.generation }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          VM_IP: ${{ needs.vm.outputs.ip }}
          VM_PROVIDER: ${{ needs.vm.outputs.provider }}
          VM_DOMAIN: ${{ needs.vm.outputs.domain }}
          VM_USERNAME: ${{ needs.vm.outputs.username }}
          VM_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          VM_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          git init -q
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$ACCEPTED_REVISION"
          git checkout -q --detach FETCH_HEAD
          export EXPECTED_RELEASE_TAG="edge-release-$RELEASE_SET"
          bash edge-platform/scripts/resolve_durable_release.sh
          . "$OUTPUT_DIR/resolved.env"
          test "$EDGE_RELEASE_SET_SHA256" = "$RELEASE_SET"
          export EDGE_DOCKER_ENGINE_VERSION EDGE_CONTAINERD_VERSION EDGE_COMPOSE_VERSION
          owner="$OUTPUT_DIR/edge-orchestrator-linux-amd64"
          test "$(sha256sum "$owner"|cut -d' ' -f1)" = "$EDGE_ORCHESTRATOR_SHA256"
          chmod 755 "$owner"
          export EDGE_RELEASE_CONTEXT_PATH="$OUTPUT_DIR/resolved.env"
          umask 077
          key="$RUNNER_TEMP/singbox-vultr-ops"
          printf '%s\n' "$VULTR_SSH_PRIVATE_KEY" > "$key"; chmod 600 "$key"
          export EDGE_SSH_PRIVATE_KEY_PATH="$key"
          export EDGE_CONTROLLER_IPV4="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          "$owner" vultr-lifecycle inventory infra/vultr/application-acceptance.json > "$RUNNER_TEMP/inventory.json"
          jq -e --arg id "$VM_PROVIDER" --arg ip "$VM_IP" '[.inventory.resources[]|select(.provider_id==$id)]|length==1 and .[0].main_ip==$ip' "$RUNNER_TEMP/inventory.json" >/dev/null
          "$owner" vultr-lifecycle lease-acquire infra/vultr/application-acceptance.json application-acceptance-1 > "$RUNNER_TEMP/lease.json"
          jq -e '.status=="READY" and .lease_phase=="READY"' "$RUNNER_TEMP/lease.json" >/dev/null
          trap '"$owner" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 >/dev/null 2>&1 || true' EXIT
          "$owner" vultr-lifecycle action-plan infra/vultr/application-acceptance.json application-acceptance-1 reboot > "$RUNNER_TEMP/reboot-plan.json"
          authority="$(jq -er .plan_authority.authority_digest "$RUNNER_TEMP/reboot-plan.json")"
          [[ "$authority" =~ ^[0-9a-f]{64}$ ]]
          gh api --paginate "repos/$REPOSITORY/issues/26/comments?per_page=100" | jq -s add > "$RUNNER_TEMP/history.json"
          jq -e --arg marker '<!-- sing-box-initial-resume-reboot/v1 -->' '[.[]|.body|select(startswith($marker))]|length==0' "$RUNNER_TEMP/history.json" >/dev/null
          jq -e --argjson source "$SOURCE_RUN" --arg release "$RELEASE_SET" --arg marker '<!-- sing-box-credential-initial-attempt/v1 -->' '[.[]|.body|select(startswith($marker))]|length==1 and (.[0]|split("\n")[1]|fromjson|.github_run_id)==$source and (.[0]|split("\n")[1]|fromjson|.release_set_sha256)==$release' "$RUNNER_TEMP/history.json" >/dev/null
          body="$(jq -nc --argjson src "$SOURCE_RUN" --argjson run "$GITHUB_RUN_ID" --arg release "$RELEASE_SET" --arg authority "$authority" '{schema:"sing-box.initial-resume-reboot/v1",source_run_id:$src,resume_run_id:$run,release_set_sha256:$release,authority_digest:$authority,phase:"BEGIN"}')"
          gh issue comment 26 --repo "$REPOSITORY" --body "$(printf '<!-- sing-box-initial-resume-reboot/v1 -->\n%s' "$body")"
          # The GitHub BEGIN itself must be independently read back exactly
          # before the irreversible provider reboot. No blind ACK replay.
          gh api --paginate "repos/$REPOSITORY/issues/26/comments?per_page=100" | jq -s add > "$RUNNER_TEMP/reboot-journal.json"
          jq -e --arg expected "$(printf '<!-- sing-box-initial-resume-reboot/v1 -->\n%s' "$body")" --arg marker '<!-- sing-box-initial-resume-reboot/v1 -->' '
            [.[]|.body|select(startswith($marker))] |
            length==1 and .[0]==$expected
          ' "$RUNNER_TEMP/reboot-journal.json" >/dev/null
          # Single provider mutation; missing ACK remains UNKNOWN and forbids replay.
          "$owner" vultr-lifecycle action infra/vultr/application-acceptance.json application-acceptance-1 reboot "$authority" > "$RUNNER_TEMP/reboot.json"
          jq -e '.mutations_performed==1 and .reboot_observation.boot_id_changed==true and .reboot_observation.boot_id_before!=.reboot_observation.boot_id_after' "$RUNNER_TEMP/reboot.json" >/dev/null
          "$owner" vultr-lifecycle substrate-verify infra/vultr/application-acceptance.json application-acceptance-1 > "$RUNNER_TEMP/substrate.json"
          jq -e '.status=="PASS" and .plan.action=="NOOP"' "$RUNNER_TEMP/substrate.json" >/dev/null
          "$owner" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 > "$RUNNER_TEMP/released.json"
          jq -e '.status=="RELEASED"' "$RUNNER_TEMP/released.json" >/dev/null
          trap - EXIT
          identity="$RUNNER_TEMP/worker-access.env"
          test -n "$VM_ACCESS_CLIENT_ID"; test -n "$VM_ACCESS_CLIENT_SECRET"
          printf 'CF_ACCESS_CLIENT_ID=%s\nCF_ACCESS_CLIENT_SECRET=%s\n' "$VM_ACCESS_CLIENT_ID" "$VM_ACCESS_CLIENT_SECRET" > "$identity"
          sudo chown root:root "$identity"; sudo chmod 0600 "$identity"
          trap 'sudo rm -f "$identity"' EXIT
          sudo env EDGE_RELEASE_CONTEXT_PATH="$EDGE_RELEASE_CONTEXT_PATH" "$owner" credentials initial-line2-external-witness "$GENERATION" "$VM_IP" "$VM_DOMAIN" "$VM_USERNAME" "$identity" > "$RUNNER_TEMP/line2.txt"
          grep -Fxq 'line2_external_6_of_6=PASS' "$RUNNER_TEMP/line2.txt"
          grep -Fxq 'line2_direct_warp_egress_distinct=true' "$RUNNER_TEMP/line2.txt"
          test "$(grep -c '^line2_external_endpoint=' "$RUNNER_TEMP/line2.txt")" -eq 6
          echo 'N1_N2_REBOOT_AND_LINE2_6_OF_6=PASS' >> "$GITHUB_STEP_SUMMARY"

  post_windows:
    needs: [source, windows, reboot]
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    timeout-minutes: 15
    permissions: {}
    env:
      GENERATION: ${{ needs.source.outputs.generation }}
      SOURCE_RELEASE: ${{ needs.source.outputs.release }}
    steps:
      - name: Independently re-prove Line1 4 of 4 after actual VM reboot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root='C:\sing-box-acceptance'
          if ([IO.File]::ReadAllText((Join-Path $root '.first-use-run')) -cne "$env:GITHUB_RUN_ID|$env:SOURCE_RELEASE") { throw 'Windows isolated owner drifted' }
          $doctor=@(& (Join-Path $root 'bin\edge-diagnostic.exe') doctor (Join-Path $root 'current.pb'))
          if ($LASTEXITCODE -ne 0 -or -not ($doctor -contains "release_set_sha256=$env:SOURCE_RELEASE") -or -not ($doctor -contains 'windows_datapath_mode=ProxyOnly')) { throw 'Windows acceptance release mismatch' }
          $console=Join-Path $root 'bin\edge-console.exe'
          $raw=@(& $console credential-initial-line1-witness ([UInt64]$env:GENERATION) --install-root $root)
          if ($LASTEXITCODE -ne 0 -or -not ($raw -contains 'line1_external_4_of_4=PASS') -or -not ($raw -contains 'line1_direct_warp_egress_distinct=true') -or -not ($raw -contains 'windows_tun_mutations=0') -or -not ($raw -contains 'windows_scm_mutations=0')) { throw 'Post-reboot Line1 external witness failed' }
          Write-Host 'N1_N2_POST_REBOOT_LINE1_4_OF_4=PASS'

  windows_cleanup:
    needs: [source, access, windows, reboot, post_windows]
    if: always() && needs.source.result == 'success' && needs.access.result != 'skipped'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove exact isolated root, never serving Windows application
        shell: pwsh
        env:
          SOURCE_RELEASE: ${{ needs.source.outputs.release }}
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\reconcile-windows-first-use.ps1'
          & $script -SourceRunId $env:GITHUB_RUN_ID -ReleaseSetSha256 $env:SOURCE_RELEASE -RemoveOwned -RecoverEmptyPreMarker
          if (-not $?) { throw 'Windows exact isolated cleanup not proved' }

  access_cleanup:
    needs: [source, access, windows, reboot, post_windows]
    if: always() && needs.source.result == 'success' && needs.access.result != 'skipped'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Revoke only this run scoped Access token, restore host-only policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/resume-access-cleanup
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch -q --no-tags --depth=1 origin "$ACCEPTED_REVISION"
          git checkout -q --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          . "$OUTPUT_DIR/resolved.env"
          owner="$OUTPUT_DIR/edge-orchestrator-linux-amd64"
          test "$(sha256sum "$owner"|cut -d' ' -f1)" = "$EDGE_ORCHESTRATOR_SHA256"
          chmod 755 "$owner"
          export EDGE_RELEASE_CONTEXT_PATH="$OUTPUT_DIR/resolved.env"
          "$owner" credentials initial-windows-acceptance-cleanup "$GITHUB_RUN_ID" > "$RUNNER_TEMP/access-cleanup.txt"
          grep -Fxq 'acceptance_access_status=REVOKED_OR_ABSENT' "$RUNNER_TEMP/access-cleanup.txt"
          grep -Fxq 'windows_access_policy=EXACT_HOST_ONLY' "$RUNNER_TEMP/access-cleanup.txt"
      - name: Remove GH environment escrow and prove both entries absent
        if: always()
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CONTROL_PLANE_TOKEN"
          for name in CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_ID CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_SECRET; do
            names="$(GH_TOKEN="$CONTROL_PLANE_TOKEN" gh secret list --repo "$REPOSITORY" --env production-vultr --json name --jq '.[].name')"
            if grep -Fxq "$name" <<<"$names"; then
              GH_TOKEN="$CONTROL_PLANE_TOKEN" gh secret delete "$name" --repo "$REPOSITORY" --env production-vultr
            fi
          done
          names="$(GH_TOKEN="$CONTROL_PLANE_TOKEN" gh secret list --repo "$REPOSITORY" --env production-vultr --json name --jq '.[].name')"
          if grep -Eq '^CLOUDFLARE_WINDOWS_ACCEPTANCE_CLIENT_(ID|SECRET)$' <<<"$names"; then exit 1; fi
          echo 'N1_N2_RESUME_TEMPORARY_ESCROW=DELETED' >> "$GITHUB_STEP_SUMMARY"

  verdict:
    needs: [source, access, windows, vm, reboot, post_windows, windows_cleanup, access_cleanup]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require original immutable generation, real 10 of 10, reboot and complete cleanup
        shell: bash
        env:
          PREFLIGHT: ${{ needs.source.result }}
          TOKEN: ${{ needs.access.result }}
          LINE1: ${{ needs.windows.result }}
          LINE2: ${{ needs.vm.result }}
          REBOOT: ${{ needs.reboot.result }}
          POST_LINE1: ${{ needs.post_windows.result }}
          WIN_CLEANUP: ${{ needs.windows_cleanup.result }}
          ACCESS_CLEANUP: ${{ needs.access_cleanup.result }}
        run: |
          set -euo pipefail
          for name in PREFLIGHT TOKEN LINE1 LINE2 REBOOT POST_LINE1 WIN_CLEANUP ACCESS_CLEANUP; do
            if [[ "$(printenv "$name")" != "success" ]]; then
              echo "::error title=N1/N2 NOT_ACCEPTED::$name not proven"
              exit 1
            fi
          done
          echo 'N1_N2_ORIGINAL_PAIRED_CREDENTIALS_REUSED_NO_REPLAY=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'N1_N2_PHYSICAL_EXTERNAL_LINE1_4_OF_4=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'N1_N2_PHYSICAL_EXTERNAL_LINE2_6_OF_6=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'N1_N2_VM_REBOOT_AND_POST_REBOOT_EXTERNAL_10_OF_10=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'N1_N2_SCOPED_WINDOWS_AND_ACCESS_CLEANUP=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'N1_N2_ACCEPTANCE=PASS' >> "$GITHUB_STEP_SUMMARY"
