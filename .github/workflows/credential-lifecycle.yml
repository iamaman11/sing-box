name: Credential Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        description: Authorized /credentials command from the control-plane router
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.parse.outputs.operation }}
    steps:
      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.command_body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os

          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          allowed = {
              ("/credentials", "contract-plan"): "contract-plan",
              ("/credentials", "contract-converge"): "contract-converge",
              ("/credentials", "contract-verify"): "contract-verify",
              ("/credentials", "contract-prove"): "contract-prove",
              ("/credentials", "host-bootstrap-converge"): "host-bootstrap-converge",
              ("/credentials", "fresh-v2-cutover"): "fresh-v2-cutover",
              ("/credentials", "fresh-v2-publication-prove"): "fresh-v2-publication-prove",
              ("/credentials", "fresh-v2-cleanup"): "fresh-v2-cleanup",
          }
          operation = allowed.get(tuple(tokens))
          if operation is None:
              raise SystemExit("unsupported credential lifecycle command grammar")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"operation={operation}\n")
          PY

  execute:
    needs: authorize
    if: >-
      needs.authorize.outputs.operation != 'host-bootstrap-converge' &&
      needs.authorize.outputs.operation != 'fresh-v2-cutover' &&
      needs.authorize.outputs.operation != 'fresh-v2-publication-prove' &&
      needs.authorize.outputs.operation != 'fresh-v2-cleanup'
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified credential lifecycle owner
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"

      - name: Execute read-only or proof credential operation
        if: needs.authorize.outputs.operation != 'contract-converge'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -x "${EDGE_CREDENTIAL_ORCHESTRATOR}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          result="${RUNNER_TEMP}/credential-result.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials "${REQUESTED_OPERATION}" | tee "${result}"
          {
            echo '### Credential lifecycle result'
            echo
            printf 'Operation: `%s`\n' "${REQUESTED_OPERATION}"
            echo
            echo 'Execution used the exact accepted durable Edge Platform orchestrator.'
            echo 'No Vultr, SSH, shared-DNS, historical-account or runtime authority was materialized.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Execute A/B contract convergence
        if: needs.authorize.outputs.operation == 'contract-converge'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          test -x "${EDGE_CREDENTIAL_ORCHESTRATOR}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          test -n "${CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN}"
          result="${RUNNER_TEMP}/credential-result.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials "${REQUESTED_OPERATION}" | tee "${result}"
          {
            echo '### Credential lifecycle result'
            echo
            printf 'Operation: `%s`\n' "${REQUESTED_OPERATION}"
            echo
            echo 'A/B secret mutation used the separately materialized credential-rotation token.'
            echo 'No secret values are written to summaries, outputs, artifacts or caches.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

  host_bootstrap_release:
    name: Resolve exact host-bootstrap release
    needs: authorize
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"

  windows_host_bootstrap_prepare:
    name: Prepare Windows CMS bootstrap recipient
    needs:
      - authorize
      - host_bootstrap_release
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    outputs:
      recipient_cert_b64: ${{ steps.prepare.outputs.recipient_cert_b64 }}
      recipient_cert_sha256: ${{ steps.prepare.outputs.recipient_cert_sha256 }}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_ACCEPTED_REVISION: ${{ github.sha }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.host_bootstrap_release.outputs.release_set_sha256 }}
    steps:
      - name: Activate exact promoted ReleaseSet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Initial activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Current immutable console is unavailable'
          }
          & $console privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Exact ReleaseSet activation failed' }

          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Post-activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Windows activation does not match accepted ReleaseSet'
          }
          $newConsole = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($newConsole) -or -not (Test-Path -LiteralPath $newConsole -PathType Leaf)) {
            throw 'Promoted immutable console is unavailable'
          }
          "EDGE_CURRENT_CONSOLE=$newConsole" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Prepare non-exportable CMS recipient
        id: prepare
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE privileged-prepare-credential-access --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential Access bootstrap preparation failed' }
          $publicCert = Join-Path $env:EDGE_INSTALL_ROOT 'exchange\results\credential-access-bootstrap.cer'
          if (-not (Test-Path -LiteralPath $publicCert -PathType Leaf)) { throw 'Bootstrap public certificate was not exported' }
          $bytes = [IO.File]::ReadAllBytes($publicCert)
          if ($bytes.Length -lt 1 -or $bytes.Length -gt 65536) { throw 'Bootstrap public certificate size is invalid' }
          $b64 = [Convert]::ToBase64String($bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $publicCert).Hash.ToLowerInvariant()
          "recipient_cert_b64=$b64" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          "recipient_cert_sha256=$sha" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          Write-Host 'WINDOWS_CMS_RECIPIENT=PASS'
          Write-Host "WINDOWS_CMS_RECIPIENT_SHA256=$sha"

      - name: Prove runner remains outside protected state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Join-Path $env:EDGE_INSTALL_ROOT 'state\secrets\credential-access-v1.env'
          try {
            [IO.File]::ReadAllText($identity) | Out-Null
            throw 'NetworkService runner unexpectedly read protected credential Access identity'
          } catch [UnauthorizedAccessException] {
            Write-Host 'RUNNER_PROTECTED_STATE_ACCESS=DENIED'
          } catch [IO.FileNotFoundException] {
            Write-Host 'RUNNER_PROTECTED_STATE_ACCESS=DENIED_OR_NOT_YET_INSTALLED'
          }

  host_bootstrap_provider:
    name: Create and deliver permanent host identities
    needs:
      - authorize
      - host_bootstrap_release
      - windows_host_bootstrap_prepare
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      windows_cms_b64: ${{ steps.converge.outputs.windows_cms_b64 }}
      windows_cms_sha256: ${{ steps.converge.outputs.windows_cms_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.host_bootstrap_release.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Prove bootstrap secret-sink authority before Cloudflare mutation
        shell: bash
        env:
          CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${CONTROL_PLANE_TOKEN}"
          probe_name="EDGE_HOST_BOOTSTRAP_WRITE_PROBE"
          cleanup() {
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret delete "${probe_name}" \
              --repo "${REPOSITORY}" \
              --env production-vultr >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' 'non-sensitive-write-probe' | \
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set "${probe_name}" \
              --repo "${REPOSITORY}" \
              --env production-vultr
          names="$(
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret list \
              --repo "${REPOSITORY}" \
              --env production-vultr \
              --json name \
              --jq '.[].name'
          )"
          grep -Fxq "${probe_name}" <<<"${names}"
          cleanup
          trap - EXIT
          echo 'BOOTSTRAP_SECRET_SINK_AUTHORITY=PASS'

      - name: Converge exact host identities and seal Windows bootstrap
        id: converge
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          EDGE_WINDOWS_HOST_CLIENT_ID: ${{ secrets.CLOUDFLARE_WINDOWS_ACCESS_CLIENT_ID }}
          EDGE_WINDOWS_HOST_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_WINDOWS_ACCESS_CLIENT_SECRET }}
          EDGE_VM_HOST_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_HOST_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
          REPOSITORY: ${{ github.repository }}
          WINDOWS_RECIPIENT_CERT_B64: ${{ needs.windows_host_bootstrap_prepare.outputs.recipient_cert_b64 }}
          WINDOWS_RECIPIENT_CERT_SHA256: ${{ needs.windows_host_bootstrap_prepare.outputs.recipient_cert_sha256 }}
        run: |
          set -euo pipefail
          test -x "${EDGE_CREDENTIAL_ORCHESTRATOR}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          test -n "${CONTROL_PLANE_TOKEN}"
          test -n "${WINDOWS_RECIPIENT_CERT_B64}"
          test -n "${WINDOWS_RECIPIENT_CERT_SHA256}"

          work="${RUNNER_TEMP}/host-bootstrap"
          install -d -m 700 "${work}"
          cert_der="${work}/windows-recipient.cer"
          windows_identity="${work}/windows-host.env"
          vm_id="${work}/vm-client-id"
          vm_secret="${work}/vm-client-secret"
          cms="${work}/credential-access-bootstrap.cms"
          trap 'rm -f "${windows_identity}" "${vm_id}" "${vm_secret}"' EXIT

          printf '%s' "${WINDOWS_RECIPIENT_CERT_B64}" | base64 -d > "${cert_der}"
          test "$(sha256sum "${cert_der}" | awk '{print $1}')" = "${WINDOWS_RECIPIENT_CERT_SHA256}"
          chmod 600 "${cert_der}"

          export EDGE_WINDOWS_HOST_IDENTITY_OUTPUT="${windows_identity}"
          export EDGE_VM_HOST_CLIENT_ID_OUTPUT="${vm_id}"
          export EDGE_VM_HOST_CLIENT_SECRET_OUTPUT="${vm_secret}"
          result="${RUNNER_TEMP}/host-bootstrap-result.txt"
          set +e
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials host-bootstrap-converge | tee "${result}"
          orchestrator_status="${PIPESTATUS[0]}"
          set -e

          if [[ -s "${windows_identity}" ]]; then
            windows_client_id="$(sed -n 's/^CF_ACCESS_CLIENT_ID=//p' "${windows_identity}")"
            windows_client_secret="$(sed -n 's/^CF_ACCESS_CLIENT_SECRET=//p' "${windows_identity}")"
            test -n "${windows_client_id}"
            test -n "${windows_client_secret}"
            test "$(grep -c '^CF_ACCESS_CLIENT_ID=' "${windows_identity}")" -eq 1
            test "$(grep -c '^CF_ACCESS_CLIENT_SECRET=' "${windows_identity}")" -eq 1
            printf '%s' "${windows_client_id}" | GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_WINDOWS_ACCESS_CLIENT_ID --repo "${REPOSITORY}" --env production-vultr
            printf '%s' "${windows_client_secret}" | GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_WINDOWS_ACCESS_CLIENT_SECRET --repo "${REPOSITORY}" --env production-vultr
          fi
          if [[ -s "${vm_id}" && -s "${vm_secret}" ]]; then
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_VM_ACCESS_CLIENT_ID --repo "${REPOSITORY}" --env production-vultr < "${vm_id}"
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_VM_ACCESS_CLIENT_SECRET --repo "${REPOSITORY}" --env production-vultr < "${vm_secret}"
          fi

          if [[ "${orchestrator_status}" -ne 0 ]]; then
            echo "host identity provider convergence failed after preserving any issued one-time material in protected escrow" >&2
            exit "${orchestrator_status}"
          fi
          grep -Fxq 'credential_host_bootstrap_status=PASS' "${result}"
          grep -Fxq 'real_credentials_created=0' "${result}"
          grep -Fxq 'production_runtime_mutations=0' "${result}"
          test -s "${windows_identity}"
          test -s "${vm_id}"
          test -s "${vm_secret}"

          EDGE_CMS_CERT="${cert_der}" \
          EDGE_CMS_INPUT="${windows_identity}" \
          EDGE_CMS_OUTPUT="${cms}" \
          pwsh -NoProfile -NonInteractive -Command \
            '$ErrorActionPreference = "Stop"; Protect-CmsMessage -To $env:EDGE_CMS_CERT -LiteralPath $env:EDGE_CMS_INPUT -OutFile $env:EDGE_CMS_OUTPUT'
          test -s "${cms}"
          if grep -aFq 'CF_ACCESS_CLIENT_ID=' "${cms}" || grep -aFq 'CF_ACCESS_CLIENT_SECRET=' "${cms}"; then
            echo 'CMS envelope contains plaintext credential markers' >&2
            exit 1
          fi
          cms_sha="$(sha256sum "${cms}" | awk '{print $1}')"
          cms_b64="$(base64 -w0 "${cms}")"
          printf 'windows_cms_sha256=%s\n' "${cms_sha}" >> "${GITHUB_OUTPUT}"
          printf 'windows_cms_b64=%s\n' "${cms_b64}" >> "${GITHUB_OUTPUT}"
          rm -f "${windows_identity}" "${vm_id}" "${vm_secret}"
          trap - EXIT

          {
            echo '### Permanent host identity bootstrap'
            echo '- Cloudflare host identities: **CONVERGED**'
            echo '- VM plaintext sink: **production-vultr environment secrets only**'
            echo '- Windows plaintext: **temporary production-vultr bootstrap escrow only; deleted after SYSTEM install**'
            echo '- Windows runner transport: **CMS/RFC5652 ciphertext only**'
            echo '- Existing host token behavior: **reuse exact escrow or fail closed; never rotate implicitly**'
            echo '- Application credentials created: **0**'
            echo '- Production runtime mutations: **0**'
            printf -- '- Windows CMS SHA-256: %s\n' "${cms_sha}"
          } >> "${GITHUB_STEP_SUMMARY}"

  windows_host_bootstrap_install:
    name: Install Windows host identity inside SYSTEM boundary
    needs:
      - authorize
      - host_bootstrap_release
      - host_bootstrap_provider
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_WINDOWS_CMS_B64: ${{ needs.host_bootstrap_provider.outputs.windows_cms_b64 }}
      EDGE_WINDOWS_CMS_SHA256: ${{ needs.host_bootstrap_provider.outputs.windows_cms_sha256 }}
    steps:
      - name: Place ciphertext in bounded request exchange
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EDGE_WINDOWS_CMS_B64)) { throw 'Windows CMS bootstrap ciphertext is missing' }
          $cms = Join-Path $env:EDGE_INSTALL_ROOT 'exchange\requests\credential-access-bootstrap.cms'
          $bytes = [Convert]::FromBase64String($env:EDGE_WINDOWS_CMS_B64)
          [IO.File]::WriteAllBytes($cms, $bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $cms).Hash.ToLowerInvariant()
          if ($sha -cne $env:EDGE_WINDOWS_CMS_SHA256) { throw 'Windows CMS bootstrap ciphertext hash mismatch' }
          Write-Host "WINDOWS_CMS_SHA256=$sha"

      - name: Resolve current immutable console
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) { throw 'Current immutable console is unavailable' }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Install Access identity through SYSTEM dispatcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE privileged-install-credential-access --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential Access identity installation failed' }
          Write-Host 'WINDOWS_HOST_IDENTITY_INSTALL=PASS'

      - name: Prove runner still cannot read installed identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Join-Path $env:EDGE_INSTALL_ROOT 'state\secrets\credential-access-v1.env'
          try {
            [IO.File]::ReadAllText($identity) | Out-Null
            throw 'NetworkService runner unexpectedly read installed credential Access identity'
          } catch [UnauthorizedAccessException] {
            Write-Host 'RUNNER_CREDENTIAL_PLAINTEXT_ACCESS=DENIED'
          }

  host_bootstrap_cleanup:
    name: Delete temporary Windows bootstrap escrow
    needs:
      - authorize
      - windows_host_bootstrap_install
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Delete Windows host bootstrap escrow after local installation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CONTROL_PLANE_TOKEN}"
          names="$(
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret list               --repo "${REPOSITORY}"               --env production-vultr               --json name               --jq '.[].name'
          )"
          for name in             CLOUDFLARE_WINDOWS_ACCESS_CLIENT_ID             CLOUDFLARE_WINDOWS_ACCESS_CLIENT_SECRET
          do
            if grep -Fxq "${name}" <<<"${names}"; then
              GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret delete "${name}"                 --repo "${REPOSITORY}"                 --env production-vultr
            fi
          done
          echo 'WINDOWS_BOOTSTRAP_ESCROW=DELETED'
          echo 'VM_BOOTSTRAP_ESCROW=RETAINED_FOR_PRODUCTION_ENROLLMENT'

  cutover_release:
    name: Resolve exact Stage 2 ReleaseSet
    needs: authorize
    if: >-
      needs.authorize.outputs.operation == 'fresh-v2-cutover' ||
      needs.authorize.outputs.operation == 'fresh-v2-publication-prove' ||
      needs.authorize.outputs.operation == 'fresh-v2-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      agent_sha256: ${{ steps.release.outputs.agent_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve promoted ReleaseSet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'agent_sha256=%s\n' "${EDGE_AGENT_SHA256}" >> "${GITHUB_OUTPUT}"

  cutover_vm_preflight:
    name: Stage 2 VM preflight
    needs: [authorize, cutover_release]
    if: >-
      needs.authorize.outputs.operation == 'fresh-v2-cutover' ||
      needs.authorize.outputs.operation == 'fresh-v2-publication-prove'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.cutover_release.outputs.agent_sha256 }}
    steps:
      - name: Prove exact owner and empty v2 state
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          test "$(id -u)" != "0"
          if sudo -n id -u >/dev/null 2>&1; then exit 1; fi
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq 'credential_state_present=false' <<<"${state}"
          sudo -n "${owner}" local verify
          echo 'STAGE2_VM_PREFLIGHT=PASS'

  cutover_windows_preflight:
    name: Stage 2 Windows preflight
    needs: [authorize, cutover_release, cutover_vm_preflight]
    if: >-
      needs.authorize.outputs.operation == 'fresh-v2-cutover' ||
      needs.authorize.outputs.operation == 'fresh-v2-publication-prove'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      EDGE_ACCEPTED_REVISION: ${{ github.sha }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.cutover_release.outputs.release_set_sha256 }}
    steps:
      - name: Activate exact ReleaseSet and prove empty v2 state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $console = @(& $diagnostic doctor $current) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($console)) {
            throw 'Current exact Windows console is unavailable'
          }
          & $console privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2 exact ReleaseSet activation failed' }

          $console = @(& $diagnostic doctor $current) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          & $console ensure-controller $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows SCM controller is unavailable' }
          $state = @(& $console credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0 -or -not ($state -contains 'credential_state_present=false')) {
            throw 'Stage 2 requires empty Windows v2 credential state'
          }
          & $console privileged-ping --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows SYSTEM privileged boundary is unavailable' }
          & $console stage2-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Windows isolated Stage 2 runtime prerequisites failed' }

          Write-Host 'STAGE2_WINDOWS_ISOLATED_PREREQUISITES=PASS'
          Write-Host 'STAGE2_WINDOWS_PREFLIGHT=PASS'
          Write-Host 'STAGE2_EXTERNAL_SING_BOX=OUT_OF_SCOPE'
          Write-Host 'STAGE2_TUN_ACTIVATION=DEFERRED'

  cutover_publish:
    name: Publish one paired fresh-v2 generation
    needs: [authorize, cutover_release, cutover_windows_preflight]
    if: >-
      needs.authorize.outputs.operation == 'fresh-v2-cutover' ||
      needs.authorize.outputs.operation == 'fresh-v2-publication-prove'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      generation: ${{ steps.publish.outputs.generation }}
    steps:
      - name: Checkout and resolve exact credential owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.cutover_release.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Publish inactive slot A
        id: publish
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          generation="$(python3 - <<'PY'
          import os
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          generation = run_id * 1000 + run_attempt
          if generation <= 0 or generation > (2**64 - 1):
              raise SystemExit("workflow-derived credential generation is outside uint64")
          print(generation)
          PY
          )"
          result="${RUNNER_TEMP}/fresh-v2-publish.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials fresh-v2-publish "${generation}" | tee "${result}"
          grep -Fxq 'credential_fresh_v2_provider_publish=PASS' "${result}"
          grep -Fxq "credential_generation=${generation}" "${result}"
          grep -Fxq 'credential_slot=A' "${result}"
          grep -Fxq 'active_slot_mutated=false' "${result}"
          printf 'generation=%s\n' "${generation}" >> "${GITHUB_OUTPUT}"

  cutover_vm_admit:
    name: Admit VM fresh-v2 generation from data plane
    needs: [authorize, cutover_release, cutover_publish]
    if: >-
      needs.authorize.outputs.operation == 'fresh-v2-cutover' ||
      needs.authorize.outputs.operation == 'fresh-v2-publication-prove'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      GENERATION: ${{ needs.cutover_publish.outputs.generation }}
      EXPECTED_AGENT_SHA256: ${{ needs.cutover_release.outputs.agent_sha256 }}
    steps:
      - name: Read-only exact-generation admission
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          before="$(sudo -n "${owner}" local credential-state)"
          sudo -n "${owner}" local credential-admit "${GENERATION}"
          after="$(sudo -n "${owner}" local credential-state)"
          test "${before}" = "${after}"
          echo 'STAGE2_VM_DATA_PLANE_ADMISSION=PASS'
          echo 'STAGE2_VM_ADMISSION_STATE_MUTATED=false'

  cutover_windows_admit:
    name: Admit Windows fresh-v2 generation from data plane
    needs: [authorize, cutover_release, cutover_publish, cutover_vm_admit]
    if: >-
      needs.authorize.outputs.operation == 'fresh-v2-cutover' ||
      needs.authorize.outputs.operation == 'fresh-v2-publication-prove'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      GENERATION: ${{ needs.cutover_publish.outputs.generation }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.cutover_release.outputs.release_set_sha256 }}
    steps:
      - name: Read-only exact-generation admission through SYSTEM owner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Windows admission activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Windows admission owner does not match accepted ReleaseSet'
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Windows admission console is unavailable'
          }
          $before = @(& $console credential-state http://127.0.0.1:51051)
          & $console privileged-admit-credential ([UInt64]$env:GENERATION) --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows fresh-v2 data-plane admission failed' }
          $after = @(& $console credential-state http://127.0.0.1:51051)
          if (($before -join "`n") -cne ($after -join "`n")) {
            throw 'Windows data-plane admission mutated credential state'
          }
          Write-Host 'STAGE2_WINDOWS_DATA_PLANE_ADMISSION=PASS'
          Write-Host 'STAGE2_WINDOWS_ADMISSION_STATE_MUTATED=false'

  cutover_vm_stage:
    name: Stage and validate VM v2 candidate
    needs: [authorize, cutover_windows_admit, cutover_publish]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      GENERATION: ${{ needs.cutover_publish.outputs.generation }}
    steps:
      - name: Stage candidate
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          sudo -n "${owner}" local credential-stage "${GENERATION}"
          sudo -n "${owner}" local credential-transition validate-candidate

  cutover_windows_stage:
    name: Stage and validate Windows v2 candidate
    needs: [authorize, cutover_vm_stage, cutover_publish]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      GENERATION: ${{ needs.cutover_publish.outputs.generation }}
    steps:
      - name: Stage candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $console = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb')) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          & $console privileged-stage-credential ([UInt64]$env:GENERATION) --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows v2 candidate staging failed' }
          & $console credential-transition validate-candidate --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows v2 candidate validation failed' }

  cutover_vm_candidate:
    name: Apply VM v2 candidate
    needs: [authorize, cutover_windows_stage]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 15
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Apply candidate transaction
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/libexec/sing-box/edge-agent local credential-transition apply-candidate
          echo 'STAGE2_VM_CANDIDATE_RUNTIME=PASS'

  cutover_windows_candidate:
    name: Apply and verify Windows v2 candidate
    needs: [authorize, cutover_vm_candidate]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
    steps:
      - name: Apply candidate transaction
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $console = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb')) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          & $console credential-transition apply-candidate --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows v2 candidate transaction failed' }
          Write-Host 'STAGE2_WINDOWS_CANDIDATE_FUNCTIONAL=PASS'

  cutover_vm_rollback:
    name: Prove VM legacy rollback
    needs: [authorize, cutover_windows_candidate]
    if: >-
      needs.authorize.outputs.operation == 'fresh-v2-cutover' &&
      needs.cutover_windows_candidate.result == 'success'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 15
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Apply legacy LKG
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/libexec/sing-box/edge-agent local credential-transition apply-legacy
          echo 'STAGE2_VM_LEGACY_ROLLBACK=PASS'

  cutover_vm_restore:
    name: Restore exact v2 candidate on VM
    needs: [authorize, cutover_vm_rollback]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 15
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Reapply exact candidate v2
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/libexec/sing-box/edge-agent local credential-transition apply-candidate
          echo 'STAGE2_VM_V2_RESTORE=PASS'

  cutover_windows_restart:
    name: Prove Windows managed runtime restart recovery
    needs: [authorize, cutover_vm_restore]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
    steps:
      - name: Restart exact managed runtime and repeat direct/WARP proof
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $console = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb')) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          & $console restart-verify-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Windows managed runtime restart/recovery proof failed' }
          Write-Host 'STAGE2_WINDOWS_MANAGED_RESTART=PASS'
          Write-Host 'STAGE2_EXTERNAL_SING_BOX=UNTOUCHED'

  cutover_vm_abort_uncommitted:
    name: Abort uncommitted VM fresh-v2 state
    needs:
      - authorize
      - cutover_release
      - cutover_publish
      - cutover_vm_admit
      - cutover_windows_admit
      - cutover_vm_stage
      - cutover_windows_stage
      - cutover_vm_candidate
      - cutover_windows_candidate
      - cutover_vm_rollback
      - cutover_vm_restore
      - cutover_windows_restart
    if: >-
      always() &&
      (
        needs.authorize.outputs.operation == 'fresh-v2-cleanup' ||
        (
          needs.authorize.outputs.operation == 'fresh-v2-publication-prove' &&
          needs.cutover_publish.result == 'success'
        ) ||
        (
          needs.authorize.outputs.operation == 'fresh-v2-cutover' &&
          needs.cutover_publish.result == 'success' &&
          needs.cutover_windows_restart.result != 'success'
        )
      )
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 15
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.cutover_release.outputs.agent_sha256 }}
    steps:
      - name: Observe, restore legacy if needed, and discard only uncommitted candidate
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          state="$(sudo -n "${owner}" local credential-state)"
          if grep -Fxq 'credential_state_present=false' <<<"${state}"; then
            echo 'STAGE2_VM_ABORT=NO_LOCAL_V2_STATE'
            exit 0
          fi
          grep -Fxq 'credential_state_present=true' <<<"${state}"
          grep -Fxq 'credential_active_present=false' <<<"${state}"
          grep -Fxq 'credential_candidate_present=true' <<<"${state}"
          grep -Fxq 'credential_previous_present=false' <<<"${state}"
          sudo -n "${owner}" local credential-transition apply-legacy
          sudo -n "${owner}" local credential-transition discard-candidate
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq 'credential_state_present=false' <<<"${state}"
          echo 'STAGE2_VM_ABORT=LEGACY_RESTORED_AND_CANDIDATE_DISCARDED'

  cutover_windows_abort_uncommitted:
    name: Abort uncommitted Windows fresh-v2 state
    needs:
      - authorize
      - cutover_release
      - cutover_vm_abort_uncommitted
    if: >-
      always() &&
      needs.cutover_vm_abort_uncommitted.result == 'success' &&
      (
        needs.authorize.outputs.operation == 'fresh-v2-cleanup' ||
        needs.authorize.outputs.operation == 'fresh-v2-publication-prove' ||
        needs.authorize.outputs.operation == 'fresh-v2-cutover'
      )
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      EDGE_ACCEPTED_REVISION: ${{ github.sha }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.cutover_release.outputs.release_set_sha256 }}
    steps:
      - name: Observe and discard only uncommitted managed candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $console = @(& $diagnostic doctor $current) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          & $console privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows abort ReleaseSet activation failed' }

          $console = @(& $diagnostic doctor $current) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          & $console ensure-controller $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows abort controller unavailable' }
          $state = @(& $console credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if ($state -contains 'credential_state_present=false') {
            Write-Host 'STAGE2_WINDOWS_ABORT=NO_LOCAL_V2_STATE'
            Write-Host 'STAGE2_EXTERNAL_SING_BOX=UNTOUCHED'
            exit 0
          }
          if (-not ($state -contains 'credential_state_present=true') -or
              -not ($state -contains 'credential_active_present=false') -or
              -not ($state -contains 'credential_candidate_present=true') -or
              -not ($state -contains 'credential_previous_present=false')) {
            throw 'Windows abort refuses non-candidate-only v2 state'
          }
          & $console stop-local $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows managed runtime stop during abort failed' }
          & $console credential-transition discard-candidate --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate discard during abort failed' }
          $state = @(& $console credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if (-not ($state -contains 'credential_state_present=false')) {
            throw 'Windows abort did not return to empty v2 state'
          }
          Write-Host 'STAGE2_WINDOWS_ABORT=CANDIDATE_AND_MANAGED_RUNTIME_DISCARDED'
          Write-Host 'STAGE2_EXTERNAL_SING_BOX=UNTOUCHED'

  cutover_provider_abort_uncommitted:
    name: Restore credential Worker baseline after uncommitted abort
    needs:
      - authorize
      - cutover_release
      - cutover_vm_abort_uncommitted
      - cutover_windows_abort_uncommitted
    if: >-
      always() &&
      needs.cutover_vm_abort_uncommitted.result == 'success' &&
      needs.cutover_windows_abort_uncommitted.result == 'success' &&
      (
        needs.authorize.outputs.operation == 'fresh-v2-cleanup' ||
        needs.authorize.outputs.operation == 'fresh-v2-publication-prove' ||
        needs.authorize.outputs.operation == 'fresh-v2-cutover'
      )
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Resolve exact credential owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.cutover_release.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Restore paired dummy slot A and verify exact contract
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/fresh-v2-abort.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials fresh-v2-restore-baseline | tee "${result}"
          grep -Fxq 'credential_fresh_v2_baseline_restore=PASS' "${result}"
          verify="${RUNNER_TEMP}/fresh-v2-abort-verify.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials contract-verify | tee "${verify}"
          grep -Fxq 'credential_delivery_contract=FIXED_A_B' "${verify}"
          grep -Fxq 'provider_mutations=0' "${verify}"
          grep -Fxq 'production_runtime_mutations=0' "${verify}"
          echo 'STAGE2_UNCOMMITTED_ABORT=PASS'

  cutover_publication_prove_complete:
    name: Prove fresh-v2 publication transaction
    needs:
      - authorize
      - cutover_vm_admit
      - cutover_windows_admit
      - cutover_provider_abort_uncommitted
    if: >-
      always() &&
      needs.authorize.outputs.operation == 'fresh-v2-publication-prove' &&
      needs.cutover_vm_admit.result == 'success' &&
      needs.cutover_windows_admit.result == 'success' &&
      needs.cutover_provider_abort_uncommitted.result == 'success'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require admitted generation and restored provider baseline
        shell: bash
        run: |
          set -euo pipefail
          echo 'FRESH_V2_PUBLICATION_DATA_PLANE_ADMISSION=PASS'
          echo 'FRESH_V2_PUBLICATION_HOST_STATE_MUTATIONS=0'
          echo 'FRESH_V2_PUBLICATION_BASELINE_RESTORE=PASS'
          echo 'FRESH_V2_PUBLICATION_PROOF=PASS'

  cutover_windows_promote:
    name: Commit Windows v2 credential state
    needs: [authorize, cutover_windows_restart, cutover_publish]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      GENERATION: ${{ needs.cutover_publish.outputs.generation }}
    steps:
      - name: Promote after exact state observation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $console = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb')) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1

          & $console credential-transition promote --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) {
            $state = @(& $console credential-state $env:EDGE_CONTROLLER_ENDPOINT)
            if ($state -contains "credential_active_generation=$env:GENERATION" -and
                $state -contains 'credential_candidate_present=false') {
              Write-Host 'WINDOWS_PROMOTE_RESULT=OBSERVED_COMMITTED'
            } elseif ($state -contains "credential_candidate_generation=$env:GENERATION" -and
                      $state -contains 'credential_active_present=false') {
              & $console credential-transition promote --install-root $env:EDGE_INSTALL_ROOT
              if ($LASTEXITCODE -ne 0) { throw 'Windows v2 promotion failed after observed unchanged state' }
              Write-Host 'WINDOWS_PROMOTE_RESULT=BOUNDED_RETRY_AFTER_OBSERVE'
            } else {
              throw 'Windows v2 promotion failed with unexpected local state'
            }
          }

          $state = @(& $console credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if (-not ($state -contains "credential_active_generation=$env:GENERATION") -or
              -not ($state -contains 'credential_candidate_present=false')) {
            throw 'Windows v2 promotion did not converge to exact active generation'
          }
          Write-Host 'STAGE2_WINDOWS_PROMOTION=PASS'

  cutover_vm_promote:
    name: Commit VM v2 credential state
    needs: [authorize, cutover_windows_promote, cutover_publish]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      GENERATION: ${{ needs.cutover_publish.outputs.generation }}
    steps:
      - name: Promote after exact state observation
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          if ! sudo -n "${owner}" local credential-transition promote; then
            state="$(sudo -n "${owner}" local credential-state)"
            if grep -Fxq "credential_active_generation=${GENERATION}" <<<"${state}" &&
               grep -Fxq 'credential_candidate_present=false' <<<"${state}"; then
              echo 'VM_PROMOTE_RESULT=OBSERVED_COMMITTED'
            elif grep -Fxq "credential_candidate_generation=${GENERATION}" <<<"${state}" &&
                 grep -Fxq 'credential_active_present=false' <<<"${state}"; then
              sudo -n "${owner}" local credential-transition promote
              echo 'VM_PROMOTE_RESULT=BOUNDED_RETRY_AFTER_OBSERVE'
            else
              echo 'VM v2 promotion failed with unexpected local state' >&2
              exit 1
            fi
          fi
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq "credential_active_generation=${GENERATION}" <<<"${state}"
          grep -Fxq 'credential_candidate_present=false' <<<"${state}"
          echo 'STAGE2_VM_PROMOTION=PASS'

  cutover_vm_retire:
    name: Retire VM legacy LKG
    needs: [authorize, cutover_vm_promote, cutover_publish]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      GENERATION: ${{ needs.cutover_publish.outputs.generation }}
    steps:
      - name: Verify active v2 and retire legacy LKG
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq "credential_active_generation=${GENERATION}" <<<"${state}"
          grep -Fxq 'credential_candidate_present=false' <<<"${state}"
          grep -Fxq 'credential_previous_present=false' <<<"${state}"
          sudo -n "${owner}" local credential-transition retire-legacy
          echo 'STAGE2_VM_LEGACY_RETIRED=PASS'

  cutover_final_verify:
    name: Final Stage 2 credential-plane verify
    needs: [authorize, cutover_vm_retire, cutover_release]
    if: needs.authorize.outputs.operation == 'fresh-v2-cutover'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Resolve exact credential owner and verify read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.cutover_release.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          result="${RUNNER_TEMP}/credential-final-verify.txt"
          "${orchestrator}" credentials contract-verify | tee "${result}"
          grep -Fxq 'credential_delivery_status=PASS' "${result}"
          grep -Fxq 'provider_mutations=0' "${result}"
          grep -Fxq 'credential_secret_mutations=0' "${result}"
          echo 'STAGE2_FRESH_V2_CUTOVER=PASS'
