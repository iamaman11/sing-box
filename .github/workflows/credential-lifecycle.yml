name: Credential Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        description: Authorized /credentials command from the control-plane router
        required: true
        type: string

permissions: {}

# One credential transaction may span many jobs. Job-level production concurrency
# still protects shared mutable resources, while this workflow-level lock prevents
# separate credential transactions from interleaving between those jobs.
concurrency:
  group: credential-transaction-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.parse.outputs.operation }}
      credential_class: ${{ steps.parse.outputs.credential_class }}
      initial_generation: ${{ steps.parse.outputs.initial_generation }}
      initial_slot: ${{ steps.parse.outputs.initial_slot }}
      initial_original_run_id: ${{ steps.parse.outputs.initial_original_run_id }}
      initial_commit_run_id: ${{ steps.parse.outputs.initial_commit_run_id }}
      initial_runtime_machine: ${{ steps.initial_machine.outputs.machine_id }}
    steps:
      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.command_body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os

          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          allowed = {
              ("/credentials", "verify"): "verify",
              ("/credentials", "host-bootstrap-converge"): "host-bootstrap-converge",
          }
          credential_class = ""
          initial_generation = ""
          initial_slot = ""
          initial_original_run_id = ""
          initial_commit_run_id = ""
          operation = allowed.get(tuple(tokens))
          if (
              operation is None and len(tokens) == 3
              and tokens[:2] == ["/credentials", "initial-pair-commit"]
              and tokens[2].isascii() and tokens[2].isdecimal()
              and tokens[2][0] != "0"
              and 0 < int(tokens[2]) <= 18446744073709551615
          ):
              operation = "initial-pair-commit"
              initial_original_run_id = tokens[2]
          if (
              operation is None and len(tokens) == 4
              and tokens[:2] == ["/credentials", "initial-pair-recover"]
              and all(value.isascii() and value.isdecimal() and value[0] != "0"
                      and 0 < int(value) <= 18446744073709551615 for value in tokens[2:])
              and tokens[2] != tokens[3]
          ):
              operation = "initial-pair-recover"
              initial_original_run_id = tokens[2]
              initial_commit_run_id = tokens[3]
          if (
              operation is None
              and len(tokens) == 4
              and tokens[:2] == ["/credentials", "initial-pair-preflight"]
              and tokens[2].isascii() and tokens[2].isdecimal()
              and tokens[2][0] != "0"
              and 0 < int(tokens[2]) <= 18446744073709551615
              and tokens[3] in {"a", "b"}
          ):
              operation = "initial-pair-preflight"
              initial_generation = tokens[2]
              initial_slot = tokens[3]
          if (
              operation is None
              and len(tokens) == 3
              and tokens[0:2] == ["/credentials", "rotate"]
              and tokens[2] in {"tunnel-auth", "reality-identity", "line2-proxy-auth"}
          ):
              operation = "rotate-application"
              credential_class = tokens[2]
          if operation is None:
              raise SystemExit(
                  "unsupported credential lifecycle command grammar; steady-state application rotation is "
                  "/credentials rotate tunnel-auth|reality-identity|line2-proxy-auth"
              )
          # The first run is the only run that may reach a credential mutation.
          # GitHub "Re-run jobs" must not initiate another attempt after lost
          # provider ACK or an interrupted local compensation.
          if operation in {"rotate-application", "host-bootstrap-converge", "initial-pair-commit", "initial-pair-recover"}:
              if os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
                  raise SystemExit("credential mutation replay forbidden: read-only reconciliation required")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"operation={operation}\n")
              handle.write(f"credential_class={credential_class}\n")
              handle.write(f"initial_generation={initial_generation}\n")
              handle.write(f"initial_slot={initial_slot}\n")
              handle.write(f"initial_original_run_id={initial_original_run_id}\n")
              handle.write(f"initial_commit_run_id={initial_commit_run_id}\n")
          PY

      - name: Resolve exact current acceptance VM identity from Git ownership
        id: initial_machine
        if: steps.parse.outputs.operation == 'initial-pair-commit' || steps.parse.outputs.operation == 'initial-pair-recover'
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 <<'PY'
          import json, os, re
          from pathlib import Path
          a = json.loads(Path("infra/application/disposable-acceptance.json").read_text())
          p = a["vultr_spec_path"]
          if not re.fullmatch(r"infra/vultr/[a-z0-9_-]+\.json", p):
              raise SystemExit("first-use VM must be Git-owned")
          provider = json.loads(Path(p).read_text())
          machine = a["machine_id"]
          rows = [m for m in provider["machines"] if m["id"] == machine]
          if a.get("schema") != 2 or len(rows) != 1 or rows[0]["bootstrap_profile"] != "singbox-host-v2":
              raise SystemExit("initial pair commit VM origin unproven")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,62}", machine):
              raise SystemExit("initial pair commit VM label malformed")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"machine_id={machine}\n")
          PY

  execute:
    needs: authorize
    if: >-
      needs.authorize.outputs.operation == 'verify' ||
      needs.authorize.outputs.operation == 'initial-pair-preflight'
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}
      INITIAL_GENERATION: ${{ needs.authorize.outputs.initial_generation }}
      INITIAL_SLOT: ${{ needs.authorize.outputs.initial_slot }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified credential lifecycle owner
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"

      - name: Reconcile GitHub initial attempt history before first-use provider preflight
        if: env.REQUESTED_OPERATION == 'initial-pair-preflight'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only GitHub Issue #26 is the durable initial-issuance journal.
          # --paginate + jq -s 'add' must materialize all pages; a read or
          # parse failure is NOT evidence of an empty journal.
          history="${RUNNER_TEMP}/credential-initial-issue-history.json"
          gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" |
            jq -s 'add' > "${history}"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials initial-pair-journal-observe "${history}" |
            tee "${RUNNER_TEMP}/credential-initial-journal-observation.txt"
          grep -Fxq 'credential_initial_journal_empty=true' "${RUNNER_TEMP}/credential-initial-journal-observation.txt"
          grep -Fxq 'credential_journal_mutations=0' "${RUNNER_TEMP}/credential-initial-journal-observation.txt"

      - name: Execute read-only credential verification or initial pair preflight
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -x "${EDGE_CREDENTIAL_ORCHESTRATOR}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          result="${RUNNER_TEMP}/credential-result.txt"
          case "${REQUESTED_OPERATION}" in
            verify)
              "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials contract-verify | tee "${result}"
              ;;
            initial-pair-preflight)
              [[ "${INITIAL_GENERATION}" =~ ^[1-9][0-9]*$ ]]
              [[ "${INITIAL_SLOT}" == a || "${INITIAL_SLOT}" == b ]]
              "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials initial-pair-preflight "${INITIAL_GENERATION}" "${INITIAL_SLOT}" | tee "${result}"
              grep -Eq '^initial_pair_provider_intent_sha256=[0-9a-f]{64}$' "${result}"
              test "$(grep -Ec '^initial_pair_provider_intent_sha256=' "${result}")" -eq 1
              grep -Fxq 'initial_publication_authorized=false' "${result}"
              grep -Fxq 'credential_provider_mutations=0' "${result}"
              ;;
            *) exit 1 ;;
          esac
          {
            echo '### Credential lifecycle result'
            echo
            echo "Operation: \`${REQUESTED_OPERATION}\`"
            echo
            echo 'Execution used the exact accepted durable Edge Platform orchestrator.'
            echo 'No credential mutation, Vultr, SSH, shared-DNS, historical-account or runtime authority was materialized.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

  rotate_release:
    name: Resolve exact credential-rotation release
    needs: authorize
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      agent_sha256: ${{ steps.release.outputs.agent_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable ReleaseSet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'agent_sha256=%s\n' "${EDGE_AGENT_SHA256}" >> "${GITHUB_OUTPUT}"

  rotate_vm_state:
    name: Observe VM credential cursor
    needs: [authorize, rotate_release]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    outputs:
      active_generation: ${{ steps.state.outputs.active_generation }}
      active_slot: ${{ steps.state.outputs.active_slot }}
      candidate_present: ${{ steps.state.outputs.candidate_present }}
      candidate_generation: ${{ steps.state.outputs.candidate_generation }}
      candidate_slot: ${{ steps.state.outputs.candidate_slot }}
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.rotate_release.outputs.agent_sha256 }}
    steps:
      - name: Read exact non-secret VM credential cursor
        id: state
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq 'credential_state_present=true' <<<"${state}"
          grep -Fxq 'credential_active_present=true' <<<"${state}"
          active_generation="$(sed -n 's/^credential_active_generation=//p' <<<"${state}")"
          active_slot="$(sed -n 's/^credential_active_slot=//p' <<<"${state}")"
          candidate_present="$(sed -n 's/^credential_candidate_present=//p' <<<"${state}")"
          previous_present="$(sed -n 's/^credential_previous_present=//p' <<<"${state}")"
          [[ "${active_generation}" =~ ^[1-9][0-9]*$ ]]
          [[ "${active_slot}" = "1" || "${active_slot}" = "2" ]]
          [[ "${candidate_present}" = "true" || "${candidate_present}" = "false" ]]
          [[ "${previous_present}" = "true" || "${previous_present}" = "false" ]]
          if [[ "${candidate_present}" = "true" && "${previous_present}" = "true" ]]; then
            echo 'VM credential cursor violates fixed A/B candidate/previous exclusivity' >&2
            exit 1
          fi
          candidate_generation=""
          candidate_slot=""
          if [[ "${candidate_present}" = "true" ]]; then
            candidate_generation="$(sed -n 's/^credential_candidate_generation=//p' <<<"${state}")"
            candidate_slot="$(sed -n 's/^credential_candidate_slot=//p' <<<"${state}")"
            [[ "${candidate_generation}" =~ ^[1-9][0-9]*$ ]]
            [[ "${candidate_slot}" = "1" || "${candidate_slot}" = "2" ]]
            test "${candidate_slot}" != "${active_slot}"
          fi
          printf 'active_generation=%s\n' "${active_generation}" >> "${GITHUB_OUTPUT}"
          printf 'active_slot=%s\n' "${active_slot}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_present=%s\n' "${candidate_present}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_generation=%s\n' "${candidate_generation}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_slot=%s\n' "${candidate_slot}" >> "${GITHUB_OUTPUT}"
          echo "ROTATION_VM_PREVIOUS_PRESENT=${previous_present}"
          echo 'ROTATION_VM_CURSOR=PASS'

  rotate_windows_prepare:
    name: Prove paired active cursor and prepare Windows
    needs: [authorize, rotate_release, rotate_vm_state]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_RELEASE_SET_SHA256: ${{ needs.rotate_release.outputs.release_set_sha256 }}
      ACTIVE_GENERATION: ${{ needs.rotate_vm_state.outputs.active_generation }}
      ACTIVE_SLOT: ${{ needs.rotate_vm_state.outputs.active_slot }}
      VM_CANDIDATE_PRESENT: ${{ needs.rotate_vm_state.outputs.candidate_present }}
      VM_CANDIDATE_GENERATION: ${{ needs.rotate_vm_state.outputs.candidate_generation }}
      VM_CANDIDATE_SLOT: ${{ needs.rotate_vm_state.outputs.candidate_slot }}
    steps:
      - name: Reobserve exact active cursor then recover local transient state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw 'Windows rotation activation doctor failed' }
          $doctorValues = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $doctorValues[$parts[0]] = $parts[1] }
          }
          if ([string]$doctorValues['status'] -cne 'PASS' -or
              [string]$doctorValues['exact_release_files'] -cne 'PASS' -or
              [string]$doctorValues['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Windows managed owner is not the exact accepted ReleaseSet'
          }
          $console = [string]$doctorValues['console_path']
          $state = @(& $console credential-state http://127.0.0.1:51051)
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential-state observation failed' }
          $values = @{}
          foreach ($line in $state) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['credential_state_present'] -cne 'true' -or
              [string]$values['credential_active_present'] -cne 'true' -or
              [string]$values['credential_active_generation'] -cne $env:ACTIVE_GENERATION -or
              [string]$values['credential_active_slot'] -cne $env:ACTIVE_SLOT) {
            throw 'Windows and VM active credential cursors disagree; half-promoted recovery requires explicit diagnosis'
          }
          $candidatePresent = [string]$values['credential_candidate_present']
          $previousPresent = [string]$values['credential_previous_present']
          if (($candidatePresent -cne 'true' -and $candidatePresent -cne 'false') -or
              ($previousPresent -cne 'true' -and $previousPresent -cne 'false') -or
              ($candidatePresent -ceq 'true' -and $previousPresent -ceq 'true')) {
            throw 'Windows credential cursor violates fixed A/B transient-state invariants'
          }
          if ($candidatePresent -ceq 'true') {
            $candidateGeneration = [string]$values['credential_candidate_generation']
            $candidateSlot = [string]$values['credential_candidate_slot']
            if ($candidateGeneration -notmatch '^[1-9][0-9]*$' -or
                ($candidateSlot -cne '1' -and $candidateSlot -cne '2') -or
                $candidateSlot -ceq $env:ACTIVE_SLOT) {
              throw 'Windows candidate cursor is invalid'
            }
            if ($env:VM_CANDIDATE_PRESENT -ceq 'true' -and
                ($candidateGeneration -cne $env:VM_CANDIDATE_GENERATION -or
                 $candidateSlot -cne $env:VM_CANDIDATE_SLOT)) {
              throw 'Windows and VM carry different uncommitted candidates; refusing automatic recovery'
            }
            & $console credential-transition apply-active --install-root $env:EDGE_INSTALL_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Windows exact-active recovery apply failed' }
            & $console restart-verify-runtime
            if ($LASTEXITCODE -ne 0) { throw 'Windows exact-active recovery verification failed' }
            & $console credential-transition discard-candidate --install-root $env:EDGE_INSTALL_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Windows uncommitted candidate discard failed' }
            Write-Host 'ROTATION_WINDOWS_UNCOMMITTED_RECOVERY=ACTIVE_RESTORED'
          } else {
            & $console restart-verify-runtime
            if ($LASTEXITCODE -ne 0) { throw 'Windows active runtime verification failed' }
            Write-Host 'ROTATION_WINDOWS_UNCOMMITTED_RECOVERY=NOOP'
          }
          & $console credential-transition drop-previous --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows previous credential retirement failed' }
          $state = @(& $console credential-state http://127.0.0.1:51051)
          if (-not ($state -contains "credential_active_generation=$env:ACTIVE_GENERATION") -or
              -not ($state -contains 'credential_candidate_present=false') -or
              -not ($state -contains 'credential_previous_present=false')) {
            throw 'Windows rotation preparation did not converge to active-only state'
          }
          Write-Host 'ROTATION_WINDOWS_PREPARE=PASS'
          Write-Host 'ROTATION_PAIRED_ACTIVE_CURSOR=PASS'

  rotate_vm_prepare:
    name: Prepare VM active-only credential state
    needs: [authorize, rotate_release, rotate_vm_state, rotate_windows_prepare]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 15
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.rotate_release.outputs.agent_sha256 }}
      ACTIVE_GENERATION: ${{ needs.rotate_vm_state.outputs.active_generation }}
      ACTIVE_SLOT: ${{ needs.rotate_vm_state.outputs.active_slot }}
      CANDIDATE_PRESENT: ${{ needs.rotate_vm_state.outputs.candidate_present }}
      CANDIDATE_GENERATION: ${{ needs.rotate_vm_state.outputs.candidate_generation }}
      CANDIDATE_SLOT: ${{ needs.rotate_vm_state.outputs.candidate_slot }}
    steps:
      - name: Reobserve then recover candidate and retire previous
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq "credential_active_generation=${ACTIVE_GENERATION}" <<<"${state}"
          grep -Fxq "credential_active_slot=${ACTIVE_SLOT}" <<<"${state}"
          if [[ "${CANDIDATE_PRESENT}" = "true" ]]; then
            grep -Fxq "credential_candidate_generation=${CANDIDATE_GENERATION}" <<<"${state}"
            grep -Fxq "credential_candidate_slot=${CANDIDATE_SLOT}" <<<"${state}"
            grep -Fxq 'credential_previous_present=false' <<<"${state}"
            sudo -n "${owner}" local credential-transition apply-active
            sudo -n "${owner}" local credential-transition discard-candidate
            echo 'ROTATION_VM_UNCOMMITTED_RECOVERY=ACTIVE_RESTORED'
          else
            grep -Fxq 'credential_candidate_present=false' <<<"${state}"
            echo 'ROTATION_VM_UNCOMMITTED_RECOVERY=NOOP'
          fi
          sudo -n "${owner}" local credential-transition drop-previous
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq "credential_active_generation=${ACTIVE_GENERATION}" <<<"${state}"
          grep -Fxq "credential_active_slot=${ACTIVE_SLOT}" <<<"${state}"
          grep -Fxq 'credential_candidate_present=false' <<<"${state}"
          grep -Fxq 'credential_previous_present=false' <<<"${state}"
          echo 'ROTATION_VM_PREPARE=PASS'

  rotate_publish:
    name: Publish one class-scoped paired candidate
    needs:
      - authorize
      - rotate_release
      - rotate_vm_state
      - rotate_vm_prepare
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      generation: ${{ steps.publish.outputs.generation }}
      slot: ${{ steps.publish.outputs.slot }}
    steps:
      - name: Checkout and resolve exact credential owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.rotate_release.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Publish opposite fixed slot
        id: publish
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
          CREDENTIAL_CLASS: ${{ needs.authorize.outputs.credential_class }}
          ACTIVE_GENERATION: ${{ needs.rotate_vm_state.outputs.active_generation }}
          ACTIVE_SLOT: ${{ needs.rotate_vm_state.outputs.active_slot }}
        run: |
          set -euo pipefail
          generation="$((GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT))"
          if [[ "${ACTIVE_SLOT}" = "1" ]]; then
            slot="b"
            expected_slot="B"
          elif [[ "${ACTIVE_SLOT}" = "2" ]]; then
            slot="a"
            expected_slot="A"
          else
            echo "unsupported active slot: ${ACTIVE_SLOT}" >&2
            exit 1
          fi
          result="${RUNNER_TEMP}/credential-rotate-publish.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials rotate-application             "${CREDENTIAL_CLASS}" "${ACTIVE_GENERATION}" "${generation}" "${slot}" | tee "${result}"
          grep -Fxq 'credential_rotation_provider_publish=PASS' "${result}"
          grep -Fxq "credential_rotation_class=${CREDENTIAL_CLASS}" "${result}"
          grep -Fxq "credential_active_generation=${ACTIVE_GENERATION}" "${result}"
          grep -Fxq "credential_generation=${generation}" "${result}"
          grep -Fxq "credential_slot=${expected_slot}" "${result}"
          grep -Fxq 'active_slot_mutated=false' "${result}"
          grep -Fxq 'credential_rotation_delivery=CLASS_SCOPED_DELTA' "${result}"
          grep -Fxq 'active_credential_plaintext_readback=false' "${result}"
          grep -Fxq 'candidate_data_plane_reobservation=LOCAL_OWNERS' "${result}"
          printf 'generation=%s\n' "${generation}" >> "${GITHUB_OUTPUT}"
          printf 'slot=%s\n' "${expected_slot}" >> "${GITHUB_OUTPUT}"

  rotate_windows_stage:
    name: Stage and validate Windows rotation candidate
    needs: [authorize, rotate_release, rotate_publish]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_RELEASE_SET_SHA256: ${{ needs.rotate_release.outputs.release_set_sha256 }}
      GENERATION: ${{ needs.rotate_publish.outputs.generation }}
    steps:
      - name: Fetch, materialize and validate candidate without activation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate-stage activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['status'] -cne 'PASS' -or
              [string]$values['exact_release_files'] -cne 'PASS' -or
              [string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Windows candidate staging refuses a non-exact ReleaseSet owner'
          }
          $console = [string]$values['console_path']
          function Remove-StagedCandidateIfObserved {
            $state = @(& $console credential-state http://127.0.0.1:51051)
            if ($state -contains "credential_candidate_generation=$env:GENERATION" -and
                $state -contains 'credential_active_present=true' -and
                $state -contains 'credential_previous_present=false') {
              & $console credential-transition discard-candidate --install-root $env:EDGE_INSTALL_ROOT
              if ($LASTEXITCODE -ne 0) { throw 'Windows staged-candidate cleanup failed' }
              Write-Host 'ROTATION_WINDOWS_STAGE_ABORT=CANDIDATE_DISCARDED'
            }
          }
          & $console privileged-stage-credential ([UInt64]$env:GENERATION) --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) {
            Remove-StagedCandidateIfObserved
            throw 'Windows rotation candidate staging failed'
          }
          & $console credential-transition validate-candidate --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) {
            Remove-StagedCandidateIfObserved
            throw 'Windows rotation candidate validation failed'
          }
          Write-Host 'ROTATION_WINDOWS_STAGE=PASS'

  rotate_vm_candidate:
    name: Stage, validate and apply VM rotation candidate
    needs: [authorize, rotate_release, rotate_publish, rotate_windows_stage]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 15
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.rotate_release.outputs.agent_sha256 }}
      GENERATION: ${{ needs.rotate_publish.outputs.generation }}
    steps:
      - name: Fetch exact candidate, validate and apply with bounded compensation
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          cleanup_candidate() {
            state="$(sudo -n "${owner}" local credential-state)"
            if grep -Fxq "credential_candidate_generation=${GENERATION}" <<<"${state}" &&
               grep -Fxq 'credential_active_present=true' <<<"${state}" &&
               grep -Fxq 'credential_previous_present=false' <<<"${state}"; then
              sudo -n "${owner}" local credential-transition discard-candidate
              echo 'ROTATION_VM_STAGE_ABORT=CANDIDATE_DISCARDED'
            fi
          }
          if ! sudo -n "${owner}" local credential-stage "${GENERATION}"; then
            cleanup_candidate
            exit 1
          fi
          if ! sudo -n "${owner}" local credential-transition validate-candidate; then
            cleanup_candidate
            exit 1
          fi
          if ! sudo -n "${owner}" local credential-transition apply-candidate; then
            state="$(sudo -n "${owner}" local credential-state)"
            if grep -Fxq 'credential_active_present=true' <<<"${state}" &&
               grep -Fxq "credential_candidate_generation=${GENERATION}" <<<"${state}"; then
              sudo -n "${owner}" local credential-transition apply-active
              sudo -n "${owner}" local credential-transition discard-candidate
              echo 'ROTATION_VM_APPLY_ABORT=ACTIVE_RESTORED'
            fi
            exit 1
          fi
          echo 'ROTATION_VM_CANDIDATE_FUNCTIONAL=PASS'

  rotate_windows_candidate:
    name: Apply and verify Windows rotation candidate
    needs: [authorize, rotate_publish, rotate_windows_stage, rotate_vm_candidate]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
    steps:
      - name: Apply candidate and prove direct plus WARP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $console = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb')) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          try {
            & $console credential-transition apply-candidate --install-root $env:EDGE_INSTALL_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'candidate apply failed' }
            & $console restart-verify-runtime
            if ($LASTEXITCODE -ne 0) { throw 'candidate direct/WARP verification failed' }
          } catch {
            $state = @(& $console credential-state http://127.0.0.1:51051)
            if ($state -contains 'credential_active_present=true' -and
                $state -contains 'credential_candidate_present=true') {
              & $console credential-transition apply-active --install-root $env:EDGE_INSTALL_ROOT
              if ($LASTEXITCODE -eq 0) {
                & $console restart-verify-runtime
              }
              & $console credential-transition discard-candidate --install-root $env:EDGE_INSTALL_ROOT
            }
            throw
          }
          Write-Host 'ROTATION_WINDOWS_CANDIDATE_FUNCTIONAL=PASS'
          Write-Host 'ROTATION_WINDOWS_TUN_MUTATED=false'
          Write-Host 'ROTATION_EXTERNAL_SING_BOX=UNTOUCHED'

  rotate_vm_abort_after_windows_failure:
    name: Restore VM active state after Windows candidate failure
    needs:
      - authorize
      - rotate_vm_candidate
      - rotate_windows_candidate
    if: >-
      always() &&
      needs.authorize.outputs.operation == 'rotate-application' &&
      needs.rotate_vm_candidate.result == 'success' &&
      needs.rotate_windows_candidate.result != 'success'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Reobserve then compensate candidate runtime
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq 'credential_active_present=true' <<<"${state}"
          grep -Fxq 'credential_candidate_present=true' <<<"${state}"
          sudo -n "${owner}" local credential-transition apply-active
          sudo -n "${owner}" local credential-transition discard-candidate
          echo 'ROTATION_VM_ABORT=ACTIVE_RESTORED'

  rotate_windows_promote:
    name: Promote Windows rotation candidate
    needs: [authorize, rotate_publish, rotate_windows_candidate]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      GENERATION: ${{ needs.rotate_publish.outputs.generation }}
    steps:
      - name: Promote after exact state observation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $console = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb')) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          & $console credential-transition promote --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) {
            $state = @(& $console credential-state http://127.0.0.1:51051)
            if ($state -contains "credential_active_generation=$env:GENERATION" -and
                $state -contains 'credential_candidate_present=false') {
              Write-Host 'WINDOWS_ROTATION_PROMOTE=OBSERVED_COMMITTED'
            } elseif ($state -contains "credential_candidate_generation=$env:GENERATION" -and
                      $state -contains 'credential_previous_present=false') {
              & $console credential-transition promote --install-root $env:EDGE_INSTALL_ROOT
              if ($LASTEXITCODE -ne 0) { throw 'Windows promotion failed after observed unchanged state' }
              Write-Host 'WINDOWS_ROTATION_PROMOTE=BOUNDED_RETRY_AFTER_OBSERVE'
            } else {
              throw 'Windows promotion failed with unexpected local state'
            }
          }
          $state = @(& $console credential-state http://127.0.0.1:51051)
          if (-not ($state -contains "credential_active_generation=$env:GENERATION") -or
              -not ($state -contains 'credential_candidate_present=false') -or
              -not ($state -contains 'credential_previous_present=true')) {
            throw 'Windows promotion did not converge to active+previous state'
          }

  rotate_vm_promote:
    name: Promote VM rotation candidate
    needs: [authorize, rotate_publish, rotate_windows_promote]
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, production-1]
    timeout-minutes: 10
    concurrency:
      group: sing-box-production-runtime
      cancel-in-progress: false
    permissions: {}
    outputs:
      proven_unchanged: ${{ steps.promote.outputs.proven_unchanged }}
    env:
      GENERATION: ${{ needs.rotate_publish.outputs.generation }}
    steps:
      - name: Promote after exact state observation
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          printf 'proven_unchanged=false\n' >> "${GITHUB_OUTPUT}"
          if ! sudo -n "${owner}" local credential-transition promote; then
            state="$(sudo -n "${owner}" local credential-state)"
            if grep -Fxq "credential_active_generation=${GENERATION}" <<<"${state}" &&
               grep -Fxq 'credential_candidate_present=false' <<<"${state}"; then
              echo 'VM_ROTATION_PROMOTE=OBSERVED_COMMITTED'
            elif grep -Fxq "credential_candidate_generation=${GENERATION}" <<<"${state}" &&
                 grep -Fxq 'credential_previous_present=false' <<<"${state}"; then
              if ! sudo -n "${owner}" local credential-transition promote; then
                retry_state="$(sudo -n "${owner}" local credential-state)"
                if grep -Fxq 'credential_active_present=true' <<<"${retry_state}" &&
                   grep -Fxq "credential_candidate_generation=${GENERATION}" <<<"${retry_state}" &&
                   grep -Fxq 'credential_previous_present=false' <<<"${retry_state}"; then
                  printf 'proven_unchanged=true\n' >> "${GITHUB_OUTPUT}"
                  echo 'VM_ROTATION_PROMOTE=PROVEN_UNCHANGED_AFTER_BOUNDED_RETRY' >&2
                  exit 1
                fi
                if grep -Fxq "credential_active_generation=${GENERATION}" <<<"${retry_state}" &&
                   grep -Fxq 'credential_candidate_present=false' <<<"${retry_state}"; then
                  echo 'VM_ROTATION_PROMOTE=OBSERVED_COMMITTED_AFTER_RETRY'
                else
                  echo 'VM promotion retry failed with uncertain local state; no automatic cross-host compensation is authorized' >&2
                  exit 1
                fi
              else
                echo 'VM_ROTATION_PROMOTE=BOUNDED_RETRY_AFTER_OBSERVE'
              fi
            else
              echo 'VM promotion failed with uncertain local state; no automatic cross-host compensation is authorized' >&2
              exit 1
            fi
          fi
          state="$(sudo -n "${owner}" local credential-state)"
          grep -Fxq "credential_active_generation=${GENERATION}" <<<"${state}"
          grep -Fxq 'credential_candidate_present=false' <<<"${state}"
          grep -Fxq 'credential_previous_present=true' <<<"${state}"
          echo 'ROTATION_VM_PROMOTION=PASS'

  rotate_windows_compensate_failed_vm_promotion:
    name: Compensate Windows if VM promotion fails
    needs:
      - authorize
      - rotate_windows_promote
      - rotate_vm_promote
    if: >-
      always() &&
      needs.authorize.outputs.operation == 'rotate-application' &&
      needs.rotate_windows_promote.result == 'success' &&
      needs.rotate_vm_promote.result != 'success' &&
      needs.rotate_vm_promote.outputs.proven_unchanged == 'true'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
    steps:
      - name: Reobserve committed promotion then roll back previous
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $console = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb')) |
            Where-Object { $_ -like 'console_path=*' } |
            ForEach-Object { ([string]$_).Substring('console_path='.Length) } |
            Select-Object -First 1
          $state = @(& $console credential-state http://127.0.0.1:51051)
          if (-not ($state -contains 'credential_active_present=true') -or
              -not ($state -contains 'credential_previous_present=true') -or
              -not ($state -contains 'credential_candidate_present=false')) {
            throw 'Windows compensation refuses unexpected promoted state'
          }
          & $console credential-transition rollback-previous --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows compensation pointer rollback failed' }
          & $console restart-verify-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Windows compensated runtime verification failed' }
          Write-Host 'ROTATION_WINDOWS_PROMOTION_COMPENSATED=PASS'

  rotate_final_verify:
    name: Verify committed class-scoped rotation
    needs:
      - authorize
      - rotate_release
      - rotate_vm_state
      - rotate_publish
      - rotate_windows_promote
      - rotate_vm_promote
    if: needs.authorize.outputs.operation == 'rotate-application'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Resolve exact owner and verify provider read-only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.rotate_release.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          result="${RUNNER_TEMP}/credential-rotation-final.txt"
          "${orchestrator}" credentials contract-verify | tee "${result}"
          grep -Fxq 'credential_delivery_status=PASS' "${result}"
          grep -Fxq 'provider_mutations=0' "${result}"
          grep -Fxq 'production_runtime_mutations=0' "${result}"
          echo 'ROTATION_PROVIDER_VERIFY=PASS'

  host_bootstrap_release:
    name: Resolve exact host-bootstrap release
    needs: authorize
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"

  windows_host_bootstrap_prepare:
    name: Prepare Windows CMS bootstrap recipient
    needs:
      - authorize
      - host_bootstrap_release
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    outputs:
      recipient_cert_b64: ${{ steps.prepare.outputs.recipient_cert_b64 }}
      recipient_cert_sha256: ${{ steps.prepare.outputs.recipient_cert_sha256 }}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_ACCEPTED_REVISION: ${{ github.sha }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.host_bootstrap_release.outputs.release_set_sha256 }}
    steps:
      - name: Activate exact promoted ReleaseSet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Initial activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Current immutable console is unavailable'
          }
          & $console privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Exact ReleaseSet activation failed' }

          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Post-activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Windows activation does not match accepted ReleaseSet'
          }
          $newConsole = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($newConsole) -or -not (Test-Path -LiteralPath $newConsole -PathType Leaf)) {
            throw 'Promoted immutable console is unavailable'
          }
          "EDGE_CURRENT_CONSOLE=$newConsole" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Prepare non-exportable CMS recipient
        id: prepare
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE privileged-prepare-credential-access --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential Access bootstrap preparation failed' }
          $publicCert = Join-Path $env:EDGE_INSTALL_ROOT 'exchange\results\credential-access-bootstrap.cer'
          if (-not (Test-Path -LiteralPath $publicCert -PathType Leaf)) { throw 'Bootstrap public certificate was not exported' }
          $bytes = [IO.File]::ReadAllBytes($publicCert)
          if ($bytes.Length -lt 1 -or $bytes.Length -gt 65536) { throw 'Bootstrap public certificate size is invalid' }
          $b64 = [Convert]::ToBase64String($bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $publicCert).Hash.ToLowerInvariant()
          "recipient_cert_b64=$b64" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          "recipient_cert_sha256=$sha" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          Write-Host 'WINDOWS_CMS_RECIPIENT=PASS'
          Write-Host "WINDOWS_CMS_RECIPIENT_SHA256=$sha"

      - name: Prove runner remains outside protected state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Join-Path $env:EDGE_INSTALL_ROOT 'state\secrets\credential-access-v1.env'
          try {
            [IO.File]::ReadAllText($identity) | Out-Null
            throw 'NetworkService runner unexpectedly read protected credential Access identity'
          } catch [UnauthorizedAccessException] {
            Write-Host 'RUNNER_PROTECTED_STATE_ACCESS=DENIED'
          } catch [IO.FileNotFoundException] {
            Write-Host 'RUNNER_PROTECTED_STATE_ACCESS=DENIED_OR_NOT_YET_INSTALLED'
          }

  host_bootstrap_provider:
    name: Create and deliver permanent host identities
    needs:
      - authorize
      - host_bootstrap_release
      - windows_host_bootstrap_prepare
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      windows_cms_b64: ${{ steps.converge.outputs.windows_cms_b64 }}
      windows_cms_sha256: ${{ steps.converge.outputs.windows_cms_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.host_bootstrap_release.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Prove bootstrap secret-sink authority before Cloudflare mutation
        shell: bash
        env:
          CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${CONTROL_PLANE_TOKEN}"
          probe_name="EDGE_HOST_BOOTSTRAP_WRITE_PROBE"
          cleanup() {
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret delete "${probe_name}" \
              --repo "${REPOSITORY}" \
              --env production-vultr >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' 'non-sensitive-write-probe' | \
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set "${probe_name}" \
              --repo "${REPOSITORY}" \
              --env production-vultr
          names="$(
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret list \
              --repo "${REPOSITORY}" \
              --env production-vultr \
              --json name \
              --jq '.[].name'
          )"
          grep -Fxq "${probe_name}" <<<"${names}"
          cleanup
          trap - EXIT
          echo 'BOOTSTRAP_SECRET_SINK_AUTHORITY=PASS'

      - name: Converge exact host identities and seal Windows bootstrap
        id: converge
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          EDGE_WINDOWS_HOST_CLIENT_ID: ${{ secrets.CLOUDFLARE_WINDOWS_ACCESS_CLIENT_ID }}
          EDGE_WINDOWS_HOST_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_WINDOWS_ACCESS_CLIENT_SECRET }}
          EDGE_VM_HOST_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_HOST_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
          REPOSITORY: ${{ github.repository }}
          WINDOWS_RECIPIENT_CERT_B64: ${{ needs.windows_host_bootstrap_prepare.outputs.recipient_cert_b64 }}
          WINDOWS_RECIPIENT_CERT_SHA256: ${{ needs.windows_host_bootstrap_prepare.outputs.recipient_cert_sha256 }}
        run: |
          set -euo pipefail
          test -x "${EDGE_CREDENTIAL_ORCHESTRATOR}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          test -n "${CONTROL_PLANE_TOKEN}"
          test -n "${WINDOWS_RECIPIENT_CERT_B64}"
          test -n "${WINDOWS_RECIPIENT_CERT_SHA256}"

          work="${RUNNER_TEMP}/host-bootstrap"
          install -d -m 700 "${work}"
          cert_der="${work}/windows-recipient.cer"
          windows_identity="${work}/windows-host.env"
          vm_id="${work}/vm-client-id"
          vm_secret="${work}/vm-client-secret"
          cms="${work}/credential-access-bootstrap.cms"
          trap 'rm -f "${windows_identity}" "${vm_id}" "${vm_secret}"' EXIT

          printf '%s' "${WINDOWS_RECIPIENT_CERT_B64}" | base64 -d > "${cert_der}"
          test "$(sha256sum "${cert_der}" | awk '{print $1}')" = "${WINDOWS_RECIPIENT_CERT_SHA256}"
          chmod 600 "${cert_der}"

          export EDGE_WINDOWS_HOST_IDENTITY_OUTPUT="${windows_identity}"
          export EDGE_VM_HOST_CLIENT_ID_OUTPUT="${vm_id}"
          export EDGE_VM_HOST_CLIENT_SECRET_OUTPUT="${vm_secret}"
          result="${RUNNER_TEMP}/host-bootstrap-result.txt"
          set +e
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials host-bootstrap-converge | tee "${result}"
          orchestrator_status="${PIPESTATUS[0]}"
          set -e

          if [[ -s "${windows_identity}" ]]; then
            windows_client_id="$(sed -n 's/^CF_ACCESS_CLIENT_ID=//p' "${windows_identity}")"
            windows_client_secret="$(sed -n 's/^CF_ACCESS_CLIENT_SECRET=//p' "${windows_identity}")"
            test -n "${windows_client_id}"
            test -n "${windows_client_secret}"
            test "$(grep -c '^CF_ACCESS_CLIENT_ID=' "${windows_identity}")" -eq 1
            test "$(grep -c '^CF_ACCESS_CLIENT_SECRET=' "${windows_identity}")" -eq 1
            printf '%s' "${windows_client_id}" | GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_WINDOWS_ACCESS_CLIENT_ID --repo "${REPOSITORY}" --env production-vultr
            printf '%s' "${windows_client_secret}" | GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_WINDOWS_ACCESS_CLIENT_SECRET --repo "${REPOSITORY}" --env production-vultr
          fi
          if [[ -s "${vm_id}" && -s "${vm_secret}" ]]; then
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_VM_ACCESS_CLIENT_ID --repo "${REPOSITORY}" --env production-vultr < "${vm_id}"
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret set CLOUDFLARE_VM_ACCESS_CLIENT_SECRET --repo "${REPOSITORY}" --env production-vultr < "${vm_secret}"
          fi

          if [[ "${orchestrator_status}" -ne 0 ]]; then
            echo "host identity provider convergence failed after preserving any issued one-time material in protected escrow" >&2
            exit "${orchestrator_status}"
          fi
          grep -Fxq 'credential_host_bootstrap_status=PASS' "${result}"
          grep -Fxq 'real_credentials_created=0' "${result}"
          grep -Fxq 'production_runtime_mutations=0' "${result}"
          test -s "${windows_identity}"
          test -s "${vm_id}"
          test -s "${vm_secret}"

          EDGE_CMS_CERT="${cert_der}" \
          EDGE_CMS_INPUT="${windows_identity}" \
          EDGE_CMS_OUTPUT="${cms}" \
          pwsh -NoProfile -NonInteractive -Command \
            '$ErrorActionPreference = "Stop"; Protect-CmsMessage -To $env:EDGE_CMS_CERT -LiteralPath $env:EDGE_CMS_INPUT -OutFile $env:EDGE_CMS_OUTPUT'
          test -s "${cms}"
          if grep -aFq 'CF_ACCESS_CLIENT_ID=' "${cms}" || grep -aFq 'CF_ACCESS_CLIENT_SECRET=' "${cms}"; then
            echo 'CMS envelope contains plaintext credential markers' >&2
            exit 1
          fi
          cms_sha="$(sha256sum "${cms}" | awk '{print $1}')"
          cms_b64="$(base64 -w0 "${cms}")"
          printf 'windows_cms_sha256=%s\n' "${cms_sha}" >> "${GITHUB_OUTPUT}"
          printf 'windows_cms_b64=%s\n' "${cms_b64}" >> "${GITHUB_OUTPUT}"
          rm -f "${windows_identity}" "${vm_id}" "${vm_secret}"
          trap - EXIT

          {
            echo '### Permanent host identity bootstrap'
            echo '- Cloudflare host identities: **CONVERGED**'
            echo '- VM plaintext sink: **production-vultr environment secrets only**'
            echo '- Windows plaintext: **temporary production-vultr bootstrap escrow only; deleted after SYSTEM install**'
            echo '- Windows runner transport: **CMS/RFC5652 ciphertext only**'
            echo '- Existing host token behavior: **reuse exact escrow or fail closed; never rotate implicitly**'
            echo '- Application credentials created: **0**'
            echo '- Production runtime mutations: **0**'
            printf -- '- Windows CMS SHA-256: %s\n' "${cms_sha}"
          } >> "${GITHUB_STEP_SUMMARY}"

  windows_host_bootstrap_install:
    name: Install Windows host identity inside SYSTEM boundary
    needs:
      - authorize
      - host_bootstrap_release
      - host_bootstrap_provider
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_WINDOWS_CMS_B64: ${{ needs.host_bootstrap_provider.outputs.windows_cms_b64 }}
      EDGE_WINDOWS_CMS_SHA256: ${{ needs.host_bootstrap_provider.outputs.windows_cms_sha256 }}
    steps:
      - name: Place ciphertext in bounded request exchange
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EDGE_WINDOWS_CMS_B64)) { throw 'Windows CMS bootstrap ciphertext is missing' }
          $cms = Join-Path $env:EDGE_INSTALL_ROOT 'exchange\requests\credential-access-bootstrap.cms'
          $bytes = [Convert]::FromBase64String($env:EDGE_WINDOWS_CMS_B64)
          [IO.File]::WriteAllBytes($cms, $bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $cms).Hash.ToLowerInvariant()
          if ($sha -cne $env:EDGE_WINDOWS_CMS_SHA256) { throw 'Windows CMS bootstrap ciphertext hash mismatch' }
          Write-Host "WINDOWS_CMS_SHA256=$sha"

      - name: Resolve current immutable console
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) { throw 'Current immutable console is unavailable' }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Install Access identity through SYSTEM dispatcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE privileged-install-credential-access --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential Access identity installation failed' }
          Write-Host 'WINDOWS_HOST_IDENTITY_INSTALL=PASS'

      - name: Prove runner still cannot read installed identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Join-Path $env:EDGE_INSTALL_ROOT 'state\secrets\credential-access-v1.env'
          try {
            [IO.File]::ReadAllText($identity) | Out-Null
            throw 'NetworkService runner unexpectedly read installed credential Access identity'
          } catch [UnauthorizedAccessException] {
            Write-Host 'RUNNER_CREDENTIAL_PLAINTEXT_ACCESS=DENIED'
          }

  host_bootstrap_cleanup:
    name: Delete temporary Windows bootstrap escrow
    needs:
      - authorize
      - windows_host_bootstrap_install
    if: needs.authorize.outputs.operation == 'host-bootstrap-converge'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Delete Windows host bootstrap escrow after local installation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CONTROL_PLANE_TOKEN}"
          names="$(
            GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret list               --repo "${REPOSITORY}"               --env production-vultr               --json name               --jq '.[].name'
          )"
          for name in             CLOUDFLARE_WINDOWS_ACCESS_CLIENT_ID             CLOUDFLARE_WINDOWS_ACCESS_CLIENT_SECRET
          do
            if grep -Fxq "${name}" <<<"${names}"; then
              GH_TOKEN="${CONTROL_PLANE_TOKEN}" gh secret delete "${name}"                 --repo "${REPOSITORY}"                 --env production-vultr
            fi
          done
          echo 'WINDOWS_BOOTSTRAP_ESCROW=DELETED'
          echo 'VM_BOOTSTRAP_ESCROW=RETAINED_FOR_PRODUCTION_ENROLLMENT'

  initial_pair_release:
    name: First-use / exact immutable pair and original GitHub BEGIN
    needs: authorize
    if: needs.authorize.outputs.operation == 'initial-pair-commit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      generation: ${{ steps.original.outputs.generation }}
      slot: ${{ steps.original.outputs.slot }}
      slot_number: ${{ steps.original.outputs.slot_number }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      agent_sha256: ${{ steps.release.outputs.agent_sha256 }}
    steps:
      - name: Checkout protected exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact immutable ReleaseSet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/pair-release
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          bash edge-platform/scripts/resolve_durable_release.sh
          source "$OUTPUT_DIR/resolved.env"
          test "$EDGE_ACCEPTED_REVISION" = "$GITHUB_SHA"
          printf 'release_set_sha256=%s\n' "$EDGE_RELEASE_SET_SHA256" >> "$GITHUB_OUTPUT"
          printf 'agent_sha256=%s\n' "$EDGE_AGENT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Verify original durable first-use BEGIN only, never reissue credentials
        id: original
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.authorize.outputs.initial_original_run_id }}
        run: |
          set -euo pipefail
          # Journal comments alone are not host/run provenance. Require the
          # original workflow identity and failed exact first-use run.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE" > "$RUNNER_TEMP/pair-original-source-run.json"
          jq -e --argjson source "$SOURCE" '
            .id==$source and .event=="issue_comment" and
            .name=="/vultr initial-vm-install" and
            .path==".github/workflows/edge-control-plane.yml" and
            .head_branch=="main" and .run_attempt==1 and
            .status=="completed" and .conclusion=="failure" and
            .repository.id==1221750822
          ' "$RUNNER_TEMP/pair-original-source-run.json" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" | jq -s 'add' > "$RUNNER_TEMP/initial-pair-history.json"
          jq -e --argjson id "$SOURCE" '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->\n"))] |
            length==1 and (.[0]|split("\n")[1]|fromjson|
              .schema=="sing-box.credential-initial-attempt/v1" and .phase=="BEGIN"
              and .github_run_id==$id and .generation==$id and (.slot=="A" or .slot=="B"))
          ' "$RUNNER_TEMP/initial-pair-history.json" >/dev/null
          jq -r '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->\n"))] |
            .[0]|split("\n")[1]|fromjson|(.generation|tostring),.slot
          ' "$RUNNER_TEMP/initial-pair-history.json" > "$RUNNER_TEMP/pair-fields.txt"
          generation="$(sed -n '1p' "$RUNNER_TEMP/pair-fields.txt")"
          slot="$(sed -n '2p' "$RUNNER_TEMP/pair-fields.txt")"
          [[ "$generation" = "$SOURCE" ]] && [[ "$slot" = A || "$slot" = B ]]
          echo "generation=$generation" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          if [[ "$slot" = A ]]; then echo 'slot_number=1' >> "$GITHUB_OUTPUT"; else echo 'slot_number=2' >> "$GITHUB_OUTPUT"; fi

  initial_pair_vm_prepared:
    name: First-use / attest exact unpromoted VM candidate
    needs: [authorize, initial_pair_release]
    if: needs.authorize.outputs.operation == 'initial-pair-commit'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, "${{ needs.authorize.outputs.initial_runtime_machine }}"]
    timeout-minutes: 12
    concurrency:
      group: sing-box-production-runtime-${{ needs.authorize.outputs.initial_runtime_machine }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      prepared_sha256: ${{ steps.verify.outputs.prepared_sha256 }}
      candidate_bundle_sha256: ${{ steps.verify.outputs.candidate_bundle_sha256 }}
    steps:
      - name: Real VM owner candidate and current Line2 authenticated proof
        id: verify
        shell: bash
        env:
          EXPECTED_AGENT: ${{ needs.initial_pair_release.outputs.agent_sha256 }}
          GEN: ${{ needs.initial_pair_release.outputs.generation }}
          SLOT: ${{ needs.initial_pair_release.outputs.slot_number }}
          RELEASE: ${{ needs.initial_pair_release.outputs.release_set_sha256 }}
          MACHINE: ${{ needs.authorize.outputs.initial_runtime_machine }}
        run: |
          set -euo pipefail
          owner=/usr/local/libexec/sing-box/edge-agent
          test "$(sha256sum "$owner" | awk '{print $1}')" = "$EXPECTED_AGENT"
          state="$(sudo -n "$owner" local credential-state)"
          grep -Fxq 'credential_active_present=false' <<< "$state"
          grep -Fxq 'credential_previous_present=false' <<< "$state"
          grep -Fxq 'credential_candidate_present=true' <<< "$state"
          grep -Fxq "credential_candidate_generation=$GEN" <<< "$state"
          grep -Fxq "credential_candidate_slot=$SLOT" <<< "$state"
          grep -Fxq 'credential_initial_commit_receipt_present=false' <<< "$state"
          candidate="$(sed -n 's/^credential_candidate_sha256=//p' <<< "$state")"
          [[ "$candidate" =~ ^[a-f0-9]{64}$ ]]
          proof="$(sudo -n "$owner" local credential-initial-verify "$GEN")"
          grep -Fxq 'line2_authenticated_endpoints=6' <<< "$proof"
          grep -Fxq 'credential_pair_committed=false' <<< "$proof"
          after="$(sudo -n "$owner" local credential-state)"
          test "$state" = "$after"
          digest="$(printf '%s' "vm|$GITHUB_RUN_ID|$MACHINE|$RELEASE|$GEN|$SLOT|$candidate|$EXPECTED_AGENT" | sha256sum | awk '{print $1}')"
          echo "prepared_sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "candidate_bundle_sha256=$candidate" >> "$GITHUB_OUTPUT"

  initial_pair_windows_prepared:
    name: First-use / attest SYSTEM-owned stopped Windows candidate
    needs: [authorize, initial_pair_release]
    if: needs.authorize.outputs.operation == 'initial-pair-commit'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    outputs:
      prepared_sha256: ${{ steps.verify.outputs.prepared_sha256 }}
      candidate_bundle_sha256: ${{ steps.verify.outputs.candidate_bundle_sha256 }}
    steps:
      - name: Read exact stable doctor and private SYSTEM cursor without mutation
        id: verify
        shell: powershell
        env:
          RELEASE: ${{ needs.initial_pair_release.outputs.release_set_sha256 }}
          GEN: ${{ needs.initial_pair_release.outputs.generation }}
          SLOT: ${{ needs.initial_pair_release.outputs.slot }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\sing-box'
          $stable = Join-Path $root 'bin\edge-diagnostic.exe'
          $doctor = @(& $stable doctor (Join-Path $root 'current.pb'))
          $map = @{}
          foreach ($line in $doctor) { $kv=([string]$line).Split('=',2); if ($kv.Count -eq 2) { $map[$kv[0]]=$kv[1] } }
          foreach ($pair in @(@('release_set_sha256',$env:RELEASE),@('exact_release_files','PASS'),@('windows_datapath_mode','ProxyOnly'),@('scm_state','Stopped'),@('scm_start_type','OnDemand'),@('managed_tun_present','false'),@('managed_singbox_process_count','0'),@('unknown_singbox_process_count','0'))) {
            if ([string]$map[$pair[0]] -cne $pair[1]) { throw 'Windows initial paired-prepared owner/release not proven' }
          }
          $console = [string]$map['console_path']
          $out = @(& $console privileged-runtime-evidence --install-root $root)
          if ($LASTEXITCODE -ne 0) { throw 'Windows initial pair SYSTEM runtime evidence unavailable' }
          $d = @($out | Where-Object { [string]$_ -match '^detail=runtime_evidence=BOUNDED_READ_ONLY;' })
          if ($d.Count -ne 1 -or [string]$d[0] -notmatch ';credential_cursor=VALID;credential_active_present=false;credential_candidate_present=true;') {
            throw 'Windows initial pair persistent candidate missing'
          }
          if ([string]$d[0] -notmatch (';credential_candidate_generation=' + $env:GEN + ';credential_candidate_slot=' + $env:SLOT + ';credential_previous_present=false;')) {
            throw 'Windows initial paired candidate generation/slot mismatch'
          }
          if ([string]$d[0] -notmatch ';credential_initial_commit_receipt_present=false;') {
            throw 'Windows initial commit already attempted; reconcile'
          }
          $match = [regex]::Match([string]$d[0],';credential_candidate_sha256=([a-f0-9]{64});')
          if (-not $match.Success) { throw 'Windows SYSTEM candidate digest unavailable' }
          $sha = $match.Groups[1].Value
          $payload = "windows|$env:GITHUB_RUN_ID|$env:RELEASE|$env:GEN|$env:SLOT|$sha"
          $hash = [Security.Cryptography.SHA256]::Create()
          try { $bytes = $hash.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload)) } finally { $hash.Dispose() }
          $digest = [BitConverter]::ToString($bytes).Replace('-','').ToLowerInvariant()
          "prepared_sha256=$digest" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          "candidate_bundle_sha256=$sha" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT

  initial_pair_intent:
    name: First-use / exactly one durable paired COMMIT_INTENT
    needs: [authorize, initial_pair_release, initial_pair_vm_prepared, initial_pair_windows_prepared]
    if: needs.authorize.outputs.operation == 'initial-pair-commit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    outputs:
      intent_sha256: ${{ steps.intent.outputs.intent_sha256 }}
    steps:
      - name: Checkout exact accepted release authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create and prove exactly one immutable Issue #26 intent
        id: intent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/pair-release
          GEN: ${{ needs.initial_pair_release.outputs.generation }}
          SLOT: ${{ needs.initial_pair_release.outputs.slot }}
          SOURCE: ${{ needs.authorize.outputs.initial_original_run_id }}
          VM_PREPARED: ${{ needs.initial_pair_vm_prepared.outputs.prepared_sha256 }}
          WINDOWS_PREPARED: ${{ needs.initial_pair_windows_prepared.outputs.prepared_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          bash edge-platform/scripts/resolve_durable_release.sh
          source "$OUTPUT_DIR/resolved.env"
          owner="$OUTPUT_DIR/edge-orchestrator-linux-amd64"
          test "$(sha256sum "$owner" | awk '{print $1}')" = "$EDGE_ORCHESTRATOR_SHA256"
          chmod 0755 "$owner"
          export EDGE_RELEASE_CONTEXT_PATH="$OUTPUT_DIR/resolved.env"
          history="$RUNNER_TEMP/paired-commit-history.json"
          original="$RUNNER_TEMP/original-begin.txt"
          intent="$RUNNER_TEMP/paired-intent.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" | jq -s 'add' > "$history"
          # Preserve exact comment bytes: jq -r would append one newline.
          jq -j '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->\n"))] |
            if length==1 then .[0] else error("exact original BEGIN not found") end
          ' "$history" > "$original"
          "$owner" credentials initial-pair-commit-plan "$SOURCE" "$GITHUB_RUN_ID" "$GEN" "$SLOT" "$VM_PREPARED" "$WINDOWS_PREPARED" "$history" "$original" "$intent"
          test "$(wc -c < "$intent")" -lt 4096
          body="$(cat "$intent")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$body" > /dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" | jq -s 'add' > "$history"
          "$owner" credentials initial-pair-commit-readback "$SOURCE" "$GITHUB_RUN_ID" "$GEN" "$SLOT" "$VM_PREPARED" "$WINDOWS_PREPARED" "$history" "$original" "$intent" |
            grep -Fx 'credential_paired_commit_intent=EXACT_DURABLE_ONCE'
          intent_sha="$(sha256sum "$intent" | awk '{print $1}')"
          echo "intent_sha256=$intent_sha" >> "$GITHUB_OUTPUT"
          echo "paired_commit_intent=READBACK_ONCE"
          echo "paired_local_mutations=0"

  initial_pair_vm_commit:
    name: First-use / one nonreplayable VM local pointer commit
    needs: [authorize, initial_pair_release, initial_pair_vm_prepared, initial_pair_intent]
    if: needs.authorize.outputs.operation == 'initial-pair-commit'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, "${{ needs.authorize.outputs.initial_runtime_machine }}"]
    timeout-minutes: 12
    concurrency:
      group: sing-box-production-runtime-${{ needs.authorize.outputs.initial_runtime_machine }}
      cancel-in-progress: false
    permissions: {}
    env:
      EXPECTED_AGENT: ${{ needs.initial_pair_release.outputs.agent_sha256 }}
      GEN: ${{ needs.initial_pair_release.outputs.generation }}
      SLOT: ${{ needs.initial_pair_release.outputs.slot_number }}
      INTENT_SHA: ${{ needs.initial_pair_intent.outputs.intent_sha256 }}
      PREPARED_BUNDLE: ${{ needs.initial_pair_vm_prepared.outputs.candidate_bundle_sha256 }}
    steps:
      - name: Mutate VM pointer exactly once through root-owned Rust, no runtime restart
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$INTENT_SHA" =~ ^[0-9a-f]{64}$ ]]
          owner=/usr/local/libexec/sing-box/edge-agent
          test "$(sha256sum "$owner" | awk '{print $1}')" = "$EXPECTED_AGENT"
          before="$(sudo -n "$owner" local credential-state)"
          grep -Fxq 'credential_active_present=false' <<< "$before"
          grep -Fxq 'credential_initial_commit_receipt_present=false' <<< "$before"
          grep -Fxq "credential_candidate_generation=$GEN" <<< "$before"
          grep -Fxq "credential_candidate_slot=$SLOT" <<< "$before"
          grep -Fxq "credential_candidate_sha256=$PREPARED_BUNDLE" <<< "$before"
          sudo -n "$owner" local credential-initial-commit "$GEN" "$SLOT" "$INTENT_SHA"
          after="$(sudo -n "$owner" local credential-state)"
          grep -Fxq "credential_active_generation=$GEN" <<< "$after"
          grep -Fxq "credential_active_slot=$SLOT" <<< "$after"
          grep -Fxq "credential_initial_commit_intent_sha256=$INTENT_SHA" <<< "$after"
          grep -Fxq 'credential_candidate_present=false' <<< "$after"
          echo 'vm_first_use_pointer=ACTIVE_LOCAL_VERIFIED'
          echo 'credential_pair_committed=false'

  initial_pair_windows_commit:
    name: First-use / one SYSTEM-owned stopped Windows local pointer commit
    needs: [authorize, initial_pair_release, initial_pair_windows_prepared, initial_pair_intent, initial_pair_vm_commit]
    if: needs.authorize.outputs.operation == 'initial-pair-commit'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 12
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      GEN: ${{ needs.initial_pair_release.outputs.generation }}
      SLOT: ${{ needs.initial_pair_release.outputs.slot_number }}
      INTENT_SHA: ${{ needs.initial_pair_intent.outputs.intent_sha256 }}
      EXPECTED_RELEASE: ${{ needs.initial_pair_release.outputs.release_set_sha256 }}
    steps:
      - name: Mutate only SYSTEM credential pointer, no service/TUN start
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1' -or $env:INTENT_SHA -notmatch '^[0-9a-f]{64}$') { throw 'Paired Windows commit replay/intent blocked' }
          $root = 'C:\sing-box'
          $stable = Join-Path $root 'bin\edge-diagnostic.exe'
          $doctor = @(& $stable doctor (Join-Path $root 'current.pb'))
          $releaseLine = @($doctor | Where-Object { [string]$_ -ceq "release_set_sha256=$env:EXPECTED_RELEASE" })
          if ($releaseLine.Count -ne 1) { throw 'Windows commit immutable ReleaseSet drifted' }
          $consoleLine = @($doctor | Where-Object { [string]$_ -like 'console_path=*' })
          if ($consoleLine.Count -ne 1) { throw 'Windows commit exact console unknown' }
          $console = ([string]$consoleLine[0]).Split('=',2)[1]
          & $console privileged-initial-credential-commit ([UInt64]$env:GEN) ([UInt32]$env:SLOT) $env:INTENT_SHA --install-root $root
          if ($LASTEXITCODE -ne 0) { throw 'Windows paired commit UNKNOWN; NEVER REPLAY' }
          $evidence = @(& $console privileged-runtime-evidence --install-root $root)
          if ($LASTEXITCODE -ne 0) { throw 'Windows paired commit readback UNKNOWN' }
          $detail = @($evidence | Where-Object { [string]$_ -like 'detail=runtime_evidence=*' })
          if ($detail.Count -ne 1 -or [string]$detail[0] -notmatch (';credential_active_generation=' + $env:GEN + ';') -or
              [string]$detail[0] -notmatch (';credential_initial_commit_intent_sha256=' + $env:INTENT_SHA + '(?:;|$)')) {
            throw 'Windows paired commit active pointer/receipt readback UNKNOWN'
          }
          Write-Host 'windows_first_use_pointer=ACTIVE_LOCAL_VERIFIED'
          Write-Host 'windows_runtime_started=false'
          Write-Host 'credential_pair_committed=false'

  initial_pair_recovery_source:
    name: Recovery / immutable original decision and failed first-use run
    needs: authorize
    if: needs.authorize.outputs.operation == 'initial-pair-recover'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      generation: ${{ steps.proof.outputs.generation }}
      slot: ${{ steps.proof.outputs.slot }}
      slot_number: ${{ steps.proof.outputs.slot_number }}
      release_sha: ${{ steps.proof.outputs.release_sha }}
      agent_sha: ${{ steps.proof.outputs.agent_sha }}
      intent_sha: ${{ steps.proof.outputs.intent_sha }}
      vm_prepared: ${{ steps.proof.outputs.vm_prepared }}
      windows_prepared: ${{ steps.proof.outputs.windows_prepared }}
    steps:
      - name: Inspect exact previously failed GitHub transaction and Issue #26 journal
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/recovery-release
          SOURCE: ${{ needs.authorize.outputs.initial_original_run_id }}
          COMMIT: ${{ needs.authorize.outputs.initial_commit_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_REPOSITORY_ID" = 1221750822
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "$OUTPUT_DIR/resolved.env"
          test "$EDGE_ACCEPTED_REVISION" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE" > "$RUNNER_TEMP/first-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMMIT" > "$RUNNER_TEMP/commit-run.json"
          jq -e --argjson source "$SOURCE" '
            .id==$source and .event=="issue_comment" and
            .name=="/vultr initial-vm-install" and
            .path==".github/workflows/edge-control-plane.yml" and
            .head_branch=="main" and .run_attempt==1 and
            .status=="completed" and .conclusion=="failure" and
            .repository.id==1221750822
          ' "$RUNNER_TEMP/first-run.json" > /dev/null
          jq -e --argjson id "$COMMIT" --arg source "$SOURCE" '
            .id==$id and .event=="issue_comment" and
            .path==".github/workflows/edge-control-plane.yml" and
            .head_branch=="main" and .run_attempt==1 and
            .status=="completed" and .conclusion=="failure" and
            .repository.id==1221750822 and
            (.display_title | contains("/credentials initial-pair-commit " + $source))
          ' "$RUNNER_TEMP/commit-run.json" > /dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" | jq -s add > "$RUNNER_TEMP/pair-history.json"
          jq -e --argjson source "$SOURCE" --argjson commit "$COMMIT" --arg sha "$GITHUB_SHA" --arg release "$EDGE_RELEASE_SET_SHA256" '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->\n"))] as $begin |
            [.[]|.body|select(startswith("<!-- sing-box-credential-paired-commit/v1 -->\n"))] as $pair |
            ($begin|length)==1 and ($pair|length)==1 and
            ($begin[0]|split("\n")[1]|fromjson|.github_run_id==$source and .generation==$source) and
            ($pair[0]|split("\n")[1]|fromjson|
              .original_run_id==$source and .commit_run_id==$commit and
              .generation==$source and (.slot=="A" or .slot=="B") and
              .accepted_revision==$sha and .release_set_sha256==$release and
              (.vm_prepared_sha256|test("^[0-9a-f]{64}$")) and
              (.windows_prepared_sha256|test("^[0-9a-f]{64}$")))
          ' "$RUNNER_TEMP/pair-history.json" > /dev/null
          jq -e '[.[]|.body|select(contains("<!-- sing-box-credential-paired-recovery/"))]|length==0' "$RUNNER_TEMP/pair-history.json" >/dev/null
          jq -j '[.[]|.body|select(startswith("<!-- sing-box-credential-paired-commit/v1 -->\n"))][0]' "$RUNNER_TEMP/pair-history.json" > "$RUNNER_TEMP/original-pair-intent.txt"
          jq -r '[.[]|.body|select(startswith("<!-- sing-box-credential-paired-commit/v1 -->\n"))][0]|split("\n")[1]|fromjson|.generation,.slot,.vm_prepared_sha256,.windows_prepared_sha256' "$RUNNER_TEMP/pair-history.json" > "$RUNNER_TEMP/fields.txt"
          gen="$(sed -n '1p' "$RUNNER_TEMP/fields.txt")"
          slot="$(sed -n '2p' "$RUNNER_TEMP/fields.txt")"
          echo "generation=$gen" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          if [[ "$slot" = A ]]; then echo "slot_number=1" >> "$GITHUB_OUTPUT"; else echo "slot_number=2" >> "$GITHUB_OUTPUT"; fi
          echo "vm_prepared=$(sed -n '3p' "$RUNNER_TEMP/fields.txt")" >> "$GITHUB_OUTPUT"
          echo "windows_prepared=$(sed -n '4p' "$RUNNER_TEMP/fields.txt")" >> "$GITHUB_OUTPUT"
          echo "release_sha=$EDGE_RELEASE_SET_SHA256" >> "$GITHUB_OUTPUT"
          echo "agent_sha=$EDGE_AGENT_SHA256" >> "$GITHUB_OUTPUT"
          echo "intent_sha=$(sha256sum "$RUNNER_TEMP/original-pair-intent.txt" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  initial_pair_recovery_vm:
    name: Recovery / exact VM ACTIVE original receipt
    needs: [authorize, initial_pair_recovery_source]
    if: needs.authorize.outputs.operation == 'initial-pair-recover'
    runs-on: [self-hosted, Linux, X64, sing-box-production-vm, "${{ needs.authorize.outputs.initial_runtime_machine }}"]
    timeout-minutes: 12
    concurrency:
      group: sing-box-production-runtime-${{ needs.authorize.outputs.initial_runtime_machine }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      active_sha: ${{ steps.proof.outputs.active_sha }}
    steps:
      - name: Independent root owner, cursor and live Line2 authentication
        id: proof
        shell: bash
        env:
          AGENT_SHA: ${{ needs.initial_pair_recovery_source.outputs.agent_sha }}
          GEN: ${{ needs.initial_pair_recovery_source.outputs.generation }}
          SLOT: ${{ needs.initial_pair_recovery_source.outputs.slot_number }}
          ORIGINAL: ${{ needs.initial_pair_recovery_source.outputs.intent_sha }}
          COMMIT_RUN: ${{ needs.authorize.outputs.initial_commit_run_id }}
          MACHINE: ${{ needs.authorize.outputs.initial_runtime_machine }}
          RELEASE: ${{ needs.initial_pair_recovery_source.outputs.release_sha }}
          ORIGINAL_PREPARED: ${{ needs.initial_pair_recovery_source.outputs.vm_prepared }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          owner=/usr/local/libexec/sing-box/edge-agent
          test "$(sha256sum "$owner" | awk '{print $1}')" = "$AGENT_SHA"
          before="$(sudo -n "$owner" local credential-state)"
          for exact in 'credential_active_present=true' 'credential_candidate_present=false' 'credential_previous_present=false' "credential_active_generation=$GEN" "credential_active_slot=$SLOT" 'credential_initial_commit_receipt_present=true' "credential_initial_commit_intent_sha256=$ORIGINAL" 'credential_initial_recovery_receipt_present=false'; do
            grep -Fxq "$exact" <<< "$before"
          done
          active="$(sed -n 's/^credential_active_sha256=//p' <<< "$before")"
          [[ "$active" =~ ^[0-9a-f]{64}$ ]]
          # Independently reconstruct the ORIGINAL prepared receipt, not just
          # accept a same-generation ACTIVE credential from this VM.
          original_prepared="$(printf '%s' "vm|$COMMIT_RUN|$MACHINE|$RELEASE|$GEN|$SLOT|$active|$AGENT_SHA" | sha256sum | awk '{print $1}')"
          test "$original_prepared" = "$ORIGINAL_PREPARED"
          proof="$(sudo -n "$owner" local quality-line2)"
          grep -Fxq 'quality_status=PASS' <<< "$proof"
          test "$before" = "$(sudo -n "$owner" local credential-state)"
          echo "active_sha=$active" >> "$GITHUB_OUTPUT"

  initial_pair_recovery_windows:
    name: Recovery / stopped SYSTEM Windows candidate
    needs: [authorize, initial_pair_recovery_source]
    if: needs.authorize.outputs.operation == 'initial-pair-recover'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 12
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    outputs:
      candidate_sha: ${{ steps.proof.outputs.candidate_sha }}
    steps:
      - name: Independently inspect exact installed release and private cursor
        id: proof
        shell: powershell
        env:
          RELEASE: ${{ needs.initial_pair_recovery_source.outputs.release_sha }}
          GEN: ${{ needs.initial_pair_recovery_source.outputs.generation }}
          SLOT: ${{ needs.initial_pair_recovery_source.outputs.slot }}
          ORIGINAL: ${{ needs.initial_pair_recovery_source.outputs.intent_sha }}
          COMMIT_RUN: ${{ needs.authorize.outputs.initial_commit_run_id }}
          ORIGINAL_PREPARED: ${{ needs.initial_pair_recovery_source.outputs.windows_prepared }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'Recovery replay forbidden' }
          $root = 'C:\sing-box'
          $doctor = @(& (Join-Path $root 'bin\edge-diagnostic.exe') doctor (Join-Path $root 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw 'Recovery doctor unavailable' }
          foreach ($expected in @("release_set_sha256=$env:RELEASE",'exact_release_files=PASS','windows_datapath_mode=ProxyOnly','scm_state=Stopped','scm_start_type=OnDemand','managed_tun_present=false','managed_singbox_process_count=0','unknown_singbox_process_count=0')) {
            if (@($doctor | Where-Object { [string]$_ -ceq $expected }).Count -ne 1) { throw 'Recovery owner/SCM/TUN evidence drifted' }
          }
          $consoleLine = @($doctor | Where-Object { [string]$_ -like 'console_path=*' })
          if ($consoleLine.Count -ne 1) { throw 'Recovery console path unproven' }
          $console = ([string]$consoleLine[0]).Split('=',2)[1]
          $observation = @(& $console privileged-runtime-evidence --install-root $root)
          if ($LASTEXITCODE -ne 0) { throw 'Private SYSTEM cursor unavailable' }
          $line = @($observation | Where-Object { [string]$_ -match '^detail=runtime_evidence=BOUNDED_READ_ONLY;' })
          if ($line.Count -ne 1 -or [string]$line[0] -notmatch ';credential_cursor=VALID;credential_active_present=false;credential_candidate_present=true;') { throw 'Recovery refuses non-candidate Windows' }
          if ([string]$line[0] -notmatch (';credential_candidate_generation=' + $env:GEN + ';credential_candidate_slot=' + $env:SLOT + ';credential_previous_present=false;')) { throw 'Windows candidate generation or slot drift' }
          if ([string]$line[0] -notmatch ';credential_initial_recovery_receipt_present=false;') { throw 'Recovery already attempted/UNKNOWN' }
          if ([string]$line[0] -match ';credential_initial_commit_receipt_present=true;' -and [string]$line[0] -notmatch (';credential_initial_commit_intent_sha256=' + $env:ORIGINAL + ';')) { throw 'Original local receipt mismatch' }
          $match = [regex]::Match([string]$line[0],';credential_candidate_sha256=([a-f0-9]{64});')
          if (-not $match.Success) { throw 'Windows candidate identity unavailable' }
          # Bind the live SYSTEM candidate to the exact original prepared
          # Windows receipt, including original commit run and ReleaseSet.
          $payload = "windows|$env:COMMIT_RUN|$env:RELEASE|$env:GEN|$env:SLOT|$($match.Groups[1].Value)"
          $hash = [Security.Cryptography.SHA256]::Create()
          try { $bytes = $hash.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload)) } finally { $hash.Dispose() }
          $prepared = [BitConverter]::ToString($bytes).Replace('-','').ToLowerInvariant()
          if ($prepared -cne $env:ORIGINAL_PREPARED) { throw 'Windows candidate differs from original prepared COMMIT_INTENT' }
          "candidate_sha=$($match.Groups[1].Value)" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT

  initial_pair_recovery_intent:
    name: Recovery / Rust exact once-only GitHub RECOVERY_INTENT
    needs: [authorize, initial_pair_recovery_source, initial_pair_recovery_vm, initial_pair_recovery_windows]
    if: needs.authorize.outputs.operation == 'initial-pair-recover'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    outputs:
      recovery_sha: ${{ steps.intent.outputs.recovery_sha }}
    steps:
      - name: Persist and independently verify one non-secret recovery decision
        id: intent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/recovery-release
          SOURCE: ${{ needs.authorize.outputs.initial_original_run_id }}
          COMMIT: ${{ needs.authorize.outputs.initial_commit_run_id }}
          GEN: ${{ needs.initial_pair_recovery_source.outputs.generation }}
          SLOT: ${{ needs.initial_pair_recovery_source.outputs.slot }}
          VM_PREPARED: ${{ needs.initial_pair_recovery_source.outputs.vm_prepared }}
          WINDOWS_PREPARED: ${{ needs.initial_pair_recovery_source.outputs.windows_prepared }}
          VM_ACTIVE: ${{ needs.initial_pair_recovery_vm.outputs.active_sha }}
          WINDOWS_CANDIDATE: ${{ needs.initial_pair_recovery_windows.outputs.candidate_sha }}
          ORIGINAL_SHA: ${{ needs.initial_pair_recovery_source.outputs.intent_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "$OUTPUT_DIR/resolved.env"
          test "$EDGE_ACCEPTED_REVISION" = "$GITHUB_SHA"
          owner="$OUTPUT_DIR/edge-orchestrator-linux-amd64"
          test "$(sha256sum "$owner" | awk '{print $1}')" = "$EDGE_ORCHESTRATOR_SHA256"
          chmod 0755 "$owner"
          export EDGE_RELEASE_CONTEXT_PATH="$OUTPUT_DIR/resolved.env"
          history="$RUNNER_TEMP/recovery-history.json"
          original="$RUNNER_TEMP/recovery-original.txt"
          intent="$RUNNER_TEMP/recovery-original-commit.txt"
          report="$RUNNER_TEMP/recovery-hosts.json"
          planned="$RUNNER_TEMP/recovery-plan.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" | jq -s add > "$history"
          jq -j '[.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->\n"))] | if length==1 then .[0] else error("original BEGIN unknown") end' "$history" > "$original"
          jq -j '[.[]|.body|select(startswith("<!-- sing-box-credential-paired-commit/v1 -->\n"))] | if length==1 then .[0] else error("paired COMMIT_INTENT unknown") end' "$history" > "$intent"
          test "$(sha256sum "$intent" | awk '{print $1}')" = "$ORIGINAL_SHA"
          jq -nc --argjson gen "$GEN" --arg slot "$SLOT" '{vm:{generation:$gen,slot:$slot,cursor:"ACTIVE",runtime_verified:true,owner_origin_verified:true},windows:{generation:$gen,slot:$slot,cursor:"CANDIDATE",runtime_verified:false,owner_origin_verified:true}}' > "$report"
          args=("$SOURCE" "$COMMIT" "$GITHUB_RUN_ID" "$GEN" "$SLOT" "$VM_PREPARED" "$WINDOWS_PREPARED" "$VM_ACTIVE" "$WINDOWS_CANDIDATE" "$history" "$original" "$intent" "$report" "$planned")
          "$owner" credentials initial-pair-recovery-plan "${args[@]}" | grep -Fx 'paired_recovery_policy=LOCAL_INTENT_ONLY'
          test "$(wc -c < "$planned")" -lt 4096
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$(cat "$planned")" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" | jq -s add > "$history"
          "$owner" credentials initial-pair-recovery-readback "${args[@]}" | grep -Fx 'paired_recovery_intent=EXACT_DURABLE_ONCE'
          echo "recovery_sha=$(sha256sum "$planned" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "credential_provider_mutations=0"
          echo "credential_local_pointer_mutations=0"

  initial_pair_recovery_apply_windows:
    name: Recovery / one SYSTEM-owned local pointer completion
    needs: [authorize, initial_pair_recovery_source, initial_pair_recovery_windows, initial_pair_recovery_intent]
    if: needs.authorize.outputs.operation == 'initial-pair-recover'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 12
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      GEN: ${{ needs.initial_pair_recovery_source.outputs.generation }}
      SLOT: ${{ needs.initial_pair_recovery_source.outputs.slot_number }}
      RELEASE: ${{ needs.initial_pair_recovery_source.outputs.release_sha }}
      ORIGINAL: ${{ needs.initial_pair_recovery_source.outputs.intent_sha }}
      RECOVERY: ${{ needs.initial_pair_recovery_intent.outputs.recovery_sha }}
      CANDIDATE: ${{ needs.initial_pair_recovery_windows.outputs.candidate_sha }}
    steps:
      - name: Exact native SYSTEM recovery only after independently journalled intent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'No recovery replay' }
