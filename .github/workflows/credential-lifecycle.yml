  initial_pair_recovery_vm_readback:
    name: Recovery / independent VM ACTIVE re-attestation
    needs: [authorize, initial_pair_recovery_source, initial_pair_recovery_vm, initial_pair_recovery_intent, initial_pair_recovery_apply_windows]
    if: needs.authorize.outputs.operation == 'initial-pair-recover'
