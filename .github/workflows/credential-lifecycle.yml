          # manufacture paired Windows/network acceptance.
          quality="$(sudo -n "$owner" local quality-line2)"
          grep -Fxq 'quality_status=PASS' <<< "$quality"
          test "$state" = "$(sudo -n "$owner" local credential-state)"
          echo 'paired_vm_post_recovery=ACTIVE_ORIGIN_READBACK_PASS'
          echo 'credential_mutations=0'

