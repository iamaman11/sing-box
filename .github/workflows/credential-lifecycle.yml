      cancel-in-progress: false
    permissions: {}
    env:
      AGENT_SHA: ${{ needs.initial_pair_recovery_source.outputs.agent_sha }}
      GEN: ${{ needs.initial_pair_recovery_source.outputs.generation }}
      SLOT: ${{ needs.initial_pair_recovery_source.outputs.slot_number }}
      EXPECTED: ${{ needs.initial_pair_recovery_vm.outputs.active_sha }}
      ORIGINAL: ${{ needs.initial_pair_recovery_source.outputs.intent_sha }}
    steps:
      - name: Reopen exact VM owner after Windows commit, no credential writes
        shell: bash
        run: |
          set -euo pipefail
          owner=/usr/local/libexec/sing-box/edge-agent
          test "$(sha256sum "$owner" | awk '{print $1}')" = "$AGENT_SHA"
          state="$(sudo -n "$owner" local credential-state)"
          for exact in 'credential_active_present=true' 'credential_candidate_present=false' 'credential_previous_present=false' "credential_active_generation=$GEN" "credential_active_slot=$SLOT" "credential_active_sha256=$EXPECTED" 'credential_initial_commit_receipt_present=true' "credential_initial_commit_intent_sha256=$ORIGINAL" 'credential_initial_recovery_receipt_present=false'; do
