name: Credential Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        description: Authorized /credentials command from the control-plane router
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.parse.outputs.operation }}
    steps:
      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.command_body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os

          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          allowed = {
              ("/credentials", "contract-plan"): "contract-plan",
              ("/credentials", "contract-converge"): "contract-converge",
              ("/credentials", "contract-verify"): "contract-verify",
              ("/credentials", "contract-prove"): "contract-prove",
              ("/credentials", "rotate"): "rotate",
          }
          operation = allowed.get(tuple(tokens))
          if operation is None:
              raise SystemExit("unsupported credential lifecycle command grammar")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"operation={operation}\n")
          PY

  rotate_resolve:
    needs: authorize
    if: needs.authorize.outputs.operation == 'rotate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      accepted_revision: ${{ steps.release.outputs.accepted_revision }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable cutover release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          printf 'accepted_revision=%s\n' "${EDGE_ACCEPTED_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"

  rotate_windows_prepare:
    needs: [authorize, rotate_resolve]
    if: needs.authorize.outputs.operation == 'rotate'
    runs-on: [self-hosted, windows, x64, sing-box-windows-lab]
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    outputs:
      ingress_proto: ${{ steps.credential.outputs.ingress_proto }}
      state_proto: ${{ steps.credential.outputs.state_proto }}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      EDGE_ACCEPTED_REVISION: ${{ needs.rotate_resolve.outputs.accepted_revision }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.rotate_resolve.outputs.release_set_sha256 }}
    steps:
      - name: Resolve current immutable console
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:EDGE_INSTALL_ROOT -PathType Container)) {
            throw "Installed Windows application root is missing"
          }
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Initial activation doctor failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Current activation did not provide an immutable console path'
          }
          "EDGE_ACTIVATION_REQUEST_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Converge exact accepted ReleaseSet through privileged dispatcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Privileged exact-release activation failed: $LASTEXITCODE" }

      - name: Verify exact activation and SCM owner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Independent activation doctor failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -ne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Active Windows ReleaseSet does not match accepted authority'
          }
          if ([string]$values['exact_release_files'] -ne 'PASS') {
            throw 'Independent diagnostic did not prove exact release files'
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Verified activation did not provide current immutable console path'
          }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

          if ([IO.Path]::GetFullPath($env:EDGE_ACTIVATION_REQUEST_CONSOLE) -cne [IO.Path]::GetFullPath($console)) {
            & $console privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            if ($LASTEXITCODE -ne 0) { throw "Exact release-owner handoff failed: $LASTEXITCODE" }
          }

          & $console ensure-controller $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw "SCM-owned controller verification failed: $LASTEXITCODE" }
          $service = Get-CimInstance Win32_Service -Filter "Name='EdgePlatformController'"
          if (-not $service -or [string]$service.StartName -cne 'NT SERVICE\EdgePlatformController' -or [string]$service.State -cne 'Running') {
            throw 'EdgePlatformController SCM authority is not exact'
          }

      - name: Verify transport-only runner boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('state', 'runtime', 'logs')) {
            $path = Join-Path $env:EDGE_INSTALL_ROOT $relative
            $denied = $false
            try {
              [IO.Directory]::GetFileSystemEntries($path) | Out-Null
            } catch [UnauthorizedAccessException] {
              $denied = $true
            }
            if (-not $denied) {
              throw "NetworkService runner unexpectedly has direct access to protected application directory: $relative"
            }
          }

      - name: Read public credential ingress and non-secret state
        id: credential
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Parse-Values([object[]]$Lines) {
            $result = @{}
            foreach ($line in $Lines) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $result[$parts[0]] = $parts[1] }
            }
            return $result
          }

          $ingressLines = @(& $env:EDGE_CURRENT_CONSOLE credential-ingress-key $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Credential ingress-key observation failed: $LASTEXITCODE" }
          $ingress = Parse-Values $ingressLines
          if ($ingress['status'] -ne 'PASS' -or $ingress['secret_material_returned'] -ne 'false') {
            throw 'Credential ingress-key observation violated the secret-safe contract'
          }
          $ingressProto = [string]$ingress['credential_ingress_proto']
          if ([string]::IsNullOrWhiteSpace($ingressProto)) { throw 'Credential ingress protobuf is missing' }

          $stateLines = @(& $env:EDGE_CURRENT_CONSOLE credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Credential state observation failed: $LASTEXITCODE" }
          $state = Parse-Values $stateLines
          if ($state['status'] -ne 'PASS' -or $state['secret_material_returned'] -ne 'false') {
            throw 'Credential state observation violated the secret-safe contract'
          }
          $stateProto = if ($state['credential_state'] -eq 'ABSENT') {
            'ABSENT'
          } elseif ($state['credential_state'] -eq 'PRESENT') {
            [string]$state['credential_state_proto']
          } else {
            throw 'Credential state observation returned an unknown state'
          }
          if ([string]::IsNullOrWhiteSpace($stateProto)) { throw 'Credential state protobuf is missing' }

          "ingress_proto=$ingressProto" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          "state_proto=$stateProto" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT

  rotate_execute:
    needs: [authorize, rotate_resolve, rotate_windows_prepare]
    if: needs.authorize.outputs.operation == 'rotate'
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sealed_candidate: ${{ steps.rotate.outputs.sealed_candidate }}
      windows_candidate_sha256: ${{ steps.rotate.outputs.windows_candidate_sha256 }}
      delivery_generation: ${{ steps.rotate.outputs.delivery_generation }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable cutover owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          EXPECTED_RELEASE_SET_SHA256: ${{ needs.rotate_resolve.outputs.release_set_sha256 }}
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_SET_SHA256}" = "${EXPECTED_RELEASE_SET_SHA256}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          printf 'EDGE_DOCKER_ENGINE_VERSION=%s\n' "${EDGE_DOCKER_ENGINE_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_CONTAINERD_VERSION=%s\n' "${EDGE_CONTAINERD_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_COMPOSE_VERSION=%s\n' "${EDGE_COMPOSE_VERSION}" >> "${GITHUB_ENV}"

      - name: Materialize strict SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Discover controller egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4 or not value.is_global:
              raise SystemExit("controller egress is not a global IPv4 address")
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Publish and stage paired real v2 candidate
        id: rotate
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
          EDGE_WINDOWS_CREDENTIAL_INGRESS_PROTO: ${{ needs.rotate_windows_prepare.outputs.ingress_proto }}
          EDGE_WINDOWS_CREDENTIAL_STATE_PROTO: ${{ needs.rotate_windows_prepare.outputs.state_proto }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/credential-rotate-result.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials rotate > "${result}"
          grep -qx 'credential_cutover_status=CANDIDATE_READY' "${result}"
          grep -qx 'plaintext_credential_output=false' "${result}"
          grep -qx 'runtime_activation_performed=false' "${result}"
          grep -qx 'transient_support_access=ABSENT' "${result}"

          sealed="$(sed -n 's/^windows_sealed_candidate=//p' "${result}")"
          digest="$(sed -n 's/^windows_candidate_sha256=//p' "${result}")"
          generation="$(sed -n 's/^delivery_generation=//p' "${result}")"
          test -n "${sealed}"
          [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${generation}" =~ ^[1-9][0-9]*$ ]]
          printf 'sealed_candidate=%s\n' "${sealed}" >> "${GITHUB_OUTPUT}"
          printf 'windows_candidate_sha256=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'delivery_generation=%s\n' "${generation}" >> "${GITHUB_OUTPUT}"

          {
            echo '### Credential v2 candidate preparation'
            echo
            echo 'One fresh paired snapshot is published only to the inactive A slot.'
            echo 'VM is staged through the strict private agent transport; Windows receives only authenticated ciphertext.'
            echo 'No plaintext credential material is emitted to GitHub.'
            echo
            echo '~~~text'
            grep -v '^windows_sealed_candidate=' "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f "${result}"

      - name: Remove local sensitive material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${EDGE_SSH_PRIVATE_KEY_PATH:-${RUNNER_TEMP}/singbox-vultr-ops}"

  rotate_windows_stage:
    needs: [authorize, rotate_resolve, rotate_execute]
    if: needs.authorize.outputs.operation == 'rotate'
    runs-on: [self-hosted, windows, x64, sing-box-windows-lab]
    timeout-minutes: 15
    permissions: {}
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      EDGE_RELEASE_SET_SHA256: ${{ needs.rotate_resolve.outputs.release_set_sha256 }}
      EDGE_SEALED_CANDIDATE: ${{ needs.rotate_execute.outputs.sealed_candidate }}
      EDGE_EXPECTED_CANDIDATE_SHA256: ${{ needs.rotate_execute.outputs.windows_candidate_sha256 }}
      EDGE_EXPECTED_GENERATION: ${{ needs.rotate_execute.outputs.delivery_generation }}
    steps:
      - name: Resolve exact immutable console
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw "Windows activation doctor failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -ne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Windows ReleaseSet changed between prepare and sealed staging'
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console)) { throw 'Current console path is missing' }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Stage authenticated ciphertext through controller owner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Parse-Values([object[]]$Lines) {
            $result = @{}
            foreach ($line in $Lines) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $result[$parts[0]] = $parts[1] }
            }
            return $result
          }

          $stageLines = @(& $env:EDGE_CURRENT_CONSOLE stage-sealed-credential $env:EDGE_SEALED_CANDIDATE $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Sealed Windows credential staging failed: $LASTEXITCODE" }
          $stage = Parse-Values $stageLines
          if ($stage['status'] -ne 'PASS' -or $stage['secret_material_returned'] -ne 'false') {
            throw 'Sealed Windows staging violated the secret-safe contract'
          }
          if ([string]$stage['candidate_generation'] -ne $env:EDGE_EXPECTED_GENERATION) {
            throw 'Windows staged candidate generation mismatch'
          }
          if ([string]$stage['candidate_sha256'] -ne $env:EDGE_EXPECTED_CANDIDATE_SHA256) {
            throw 'Windows staged candidate digest mismatch'
          }
          if ($stage['active'] -ne 'ABSENT' -or $stage['previous'] -ne 'ABSENT') {
            throw 'Initial Windows staging unexpectedly changed active/previous state'
          }

          $observeLines = @(& $env:EDGE_CURRENT_CONSOLE credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Windows candidate re-observation failed: $LASTEXITCODE" }
          $observed = Parse-Values $observeLines
          if ([string]$observed['candidate_generation'] -ne $env:EDGE_EXPECTED_GENERATION -or
              [string]$observed['candidate_sha256'] -ne $env:EDGE_EXPECTED_CANDIDATE_SHA256 -or
              $observed['secret_material_returned'] -ne 'false') {
            throw 'Windows candidate did not survive exact read-only re-observation'
          }

          Write-Output 'status=PASS'
          Write-Output "windows_candidate_generation=$($observed['candidate_generation'])"
          Write-Output "windows_candidate_sha256=$($observed['candidate_sha256'])"
          Write-Output 'runtime_activation_performed=false'
          Write-Output 'runner_plaintext_credential_access=false'

  execute:
    needs: authorize
    if: needs.authorize.outputs.operation != 'rotate'
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified credential lifecycle owner
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"

      - name: Execute read-only or proof credential operation
        if: needs.authorize.outputs.operation != 'contract-converge'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -x "${EDGE_CREDENTIAL_ORCHESTRATOR}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          result="${RUNNER_TEMP}/credential-result.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials "${REQUESTED_OPERATION}" | tee "${result}"
          {
            echo '### Credential lifecycle result'
            echo
            printf 'Operation: `%s`\n' "${REQUESTED_OPERATION}"
            echo
            echo 'Execution used the exact accepted durable Edge Platform orchestrator.'
            echo 'No Vultr, SSH, shared-DNS, historical-account or runtime authority was materialized.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Execute A/B contract convergence
        if: needs.authorize.outputs.operation == 'contract-converge'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          test -x "${EDGE_CREDENTIAL_ORCHESTRATOR}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          test -n "${CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN}"
          result="${RUNNER_TEMP}/credential-result.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials "${REQUESTED_OPERATION}" | tee "${result}"
          {
            echo '### Credential lifecycle result'
            echo
            printf 'Operation: `%s`\n' "${REQUESTED_OPERATION}"
            echo
            echo 'A/B secret mutation used the separately materialized credential-rotation token.'
            echo 'No secret values are written to summaries, outputs, artifacts or caches.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
