name: Application Lifecycle Dev

on:
  push:
    branches:
      - application/github-vm-lifecycle

permissions:
  contents: write

concurrency:
  group: application-lifecycle-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0

      - name: Format in ephemeral runner
        working-directory: edge-platform
        shell: bash
        run: cargo fmt --all

      - name: Commit rustfmt result to feature branch when needed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- edge-platform; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge-platform
          git commit -m "style: apply rustfmt to application lifecycle"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"             HEAD:application/github-vm-lifecycle

      - name: Test workspace
        working-directory: edge-platform
        shell: bash
        run: cargo test --workspace --locked
