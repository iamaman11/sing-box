name: Application Lifecycle Dev

on:
  push:
    branches:
      - application/github-vm-lifecycle

permissions:
  contents: read

concurrency:
  group: application-lifecycle-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0

      - name: Format in ephemeral runner
        working-directory: edge-platform
        shell: bash
        run: cargo fmt --all

      - name: Test workspace
        working-directory: edge-platform
        shell: bash
        run: cargo test --workspace --locked
