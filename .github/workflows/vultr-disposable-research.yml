name: Vultr Disposable Research

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: vultr-disposable-research
  queue: max

jobs:
  catalog:
    if: >-
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == '1' &&
      github.event.comment.body == '/vultr-research catalog'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 5

    steps:
      - name: Select disposable candidates
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error               --connect-timeout 10 --max-time 30               --header "Authorization: Bearer ${VULTR_API_KEY}"               --header "Accept: application/json"               "https://api.vultr.com$1"
          }

          regions="$(api '/v2/regions?per_page=500')"
          plans="$(api '/v2/plans?per_page=500')"
          oses="$(api '/v2/os?per_page=500')"

          echo 'candidate_os:'
          jq -r '
            .os
            | map(select(.arch == "x64" and (.family == "debian" or .family == "ubuntu")))
            | sort_by(.family, .name)
            | .[]
            | "  - id=\(.id) family=\(.family) name=\(.name)"
          ' <<<"$oses" | head -n 20

          echo 'candidate_regions:'
          jq -r '
            .regions
            | map(select(.continent == "Europe"))
            | sort_by(.country, .city)
            | .[]
            | "  - id=\(.id) city=\(.city) country=\(.country)"
          ' <<<"$regions"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          jq -r '
            .plans
            | map(select(.type == "vc2" and .vcpu_count >= 1 and .ram >= 512))
            | sort_by(.monthly_cost, .ram, .vcpu_count)
            | .[]
            | [.id, (.monthly_cost|tostring), (.ram|tostring), (.vcpu_count|tostring), (.disk|tostring), (.locations|join(","))]
            | @tsv
          ' <<<"$plans" > "$tmp/plans.tsv"

          echo 'cheapest_europe_candidates:'
          count=0
          while IFS=$'\t' read -r plan cost ram vcpu disk locations; do
            IFS=',' read -ra locs <<<"$locations"
            for region in "${locs[@]}"; do
              if jq -e --arg r "$region" '.regions[] | select(.id == $r and .continent == "Europe")' <<<"$regions" >/dev/null; then
                city="$(jq -r --arg r "$region" '.regions[] | select(.id == $r) | .city' <<<"$regions")"
                country="$(jq -r --arg r "$region" '.regions[] | select(.id == $r) | .country' <<<"$regions")"
                printf '  - plan=%s cost=%s ram_mb=%s vcpu=%s disk_gb=%s region=%s city=%s country=%s\n'                   "$plan" "$cost" "$ram" "$vcpu" "$disk" "$region" "$city" "$country"
                count=$((count+1))
                if [[ "$count" -ge 20 ]]; then
                  exit 0
                fi
              fi
            done
          done < "$tmp/plans.tsv"

  lifecycle:
    if: >-
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == '1' &&
      github.event.comment.body == '/vultr-research lifecycle'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15

    steps:
      - name: Disposable create to destroy lifecycle
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          api_base='https://api.vultr.com'
          rid="singbox-research-${GITHUB_RUN_ID}"
          region='waw'
          plan='vc2-1c-1gb'
          os_id='2625'
          health_port='18080'
          tmp="$(mktemp -d)"
          response="$tmp/response.json"
          headers="$tmp/headers.txt"
          body="$tmp/body.json"
          private_key="$tmp/id_ed25519"
          known_hosts="$tmp/known_hosts"
          host_scan="$tmp/host_scan"

          instance_id=''
          firewall_id=''
          ssh_key_id=''
          instance_ip=''
          API_STATUS=''
          API_CURL_RC=''

          safe_api_once() {
            local method="$1"
            local path="$2"
            local request_body="${3:-}"
            local -a args=(
              --silent
              --show-error
              --connect-timeout 10
              --max-time 30
              --retry 0
              --request "$method"
              --header "Authorization: Bearer ${VULTR_API_KEY}"
              --header "Accept: application/json"
              --output "$response"
              --dump-header "$headers"
              --write-out '%{http_code}'
            )

            : > "$response"
            : > "$headers"

            if [[ -n "$request_body" ]]; then
              args+=(--header 'Content-Type: application/json' --data-binary "@$request_body")
            fi

            set +e
            API_STATUS="$(curl "${args[@]}" "$api_base$path")"
            API_CURL_RC="$?"
            set -e

            if [[ "$API_CURL_RC" -ne 0 ]]; then
              echo "api method=$method path=$path transport_rc=$API_CURL_RC"
              return 90
            fi

            echo "api method=$method path=$path status=$API_STATUS"
            return 0
          }

          expect_status() {
            local expected="$1"
            if [[ "$API_STATUS" != "$expected" ]]; then
              echo "expected_status=$expected actual_status=$API_STATUS"
              return 1
            fi
          }

          discover_and_delete_research_instances() {
            safe_api_once GET "/v2/instances?tag=$rid&per_page=500" || return 0
            [[ "$API_STATUS" == '200' ]] || return 0
            jq -r --arg rid "$rid" '
              .instances[]
              | select(.label == $rid and (.tags | index($rid)))
              | .id
            ' "$response" | while read -r id; do
              [[ -n "$id" ]] || continue
              safe_api_once DELETE "/v2/instances/$id" || true
            done
          }

          cleanup() {
            local rc="$?"
            set +e
            trap - EXIT

            echo "cleanup_begin original_rc=$rc"

            if [[ -n "$instance_id" ]]; then
              safe_api_once DELETE "/v2/instances/$instance_id" || true
            else
              discover_and_delete_research_instances || true
            fi

            for _ in $(seq 1 24); do
              safe_api_once GET "/v2/instances?tag=$rid&per_page=500" || true
              if [[ "$API_STATUS" == '200' ]] && [[ "$(jq -r --arg rid "$rid" '[.instances[] | select(.label == $rid and (.tags | index($rid)))] | length' "$response" 2>/dev/null)" == '0' ]]; then
                break
              fi
              sleep 5
            done

            if [[ -n "$firewall_id" ]]; then
              for _ in $(seq 1 12); do
                safe_api_once GET "/v2/firewalls/$firewall_id" || true
                if [[ "$API_STATUS" == '404' ]]; then
                  break
                fi
                if [[ "$API_STATUS" == '200' ]] && [[ "$(jq -r '.firewall_group.instance_count // 0' "$response" 2>/dev/null)" == '0' ]]; then
                  safe_api_once DELETE "/v2/firewalls/$firewall_id" || true
                  [[ "$API_STATUS" == '204' || "$API_STATUS" == '404' ]] && break
                fi
                sleep 5
              done
            fi

            if [[ -n "$ssh_key_id" ]]; then
              safe_api_once DELETE "/v2/ssh-keys/$ssh_key_id" || true
            fi

            rm -rf "$tmp"

            echo "cleanup_end original_rc=$rc"
            exit "$rc"
          }
          trap cleanup EXIT

          if [[ -z "${VULTR_API_KEY:-}" || -z "${VULTR_SSH_PRIVATE_KEY:-}" ]]; then
            echo 'bootstrap_secrets=FAIL'
            exit 1
          fi

          curl --fail --silent --show-error             "https://raw.githubusercontent.com/iamaman11/sing-box/${GITHUB_SHA}/infra/vultr/singbox-ops.pub"             > "$tmp/singbox-ops.pub"

          tr -d '\r' <<<"$VULTR_SSH_PRIVATE_KEY" > "$private_key"
          chmod 600 "$private_key"

          expected_key="$(awk '{print $1 " " $2}' "$tmp/singbox-ops.pub")"
          derived_key="$(ssh-keygen -y -f "$private_key" | awk '{print $1 " " $2}')"
          if [[ "$expected_key" != "$derived_key" ]]; then
            echo 'ssh_private_public_match=FAIL'
            exit 1
          fi
          echo 'ssh_private_public_match=PASS'

          runner_ip="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          python3 - "$runner_ip" <<'PY'
          import ipaddress, sys
          ip = ipaddress.ip_address(sys.argv[1])
          if ip.version != 4:
              raise SystemExit("runner egress is not IPv4")
          PY
          echo "runner_egress_ipv4=$runner_ip"

          jq -n --arg description "$rid" '{description:$description}' > "$body"
          safe_api_once POST '/v2/firewalls' "$body"
          expect_status 201
          firewall_id="$(jq -r '.firewall_group.id // empty' "$response")"
          [[ -n "$firewall_id" ]]
          echo "firewall_create=PASS id=$firewall_id"

          for port in 22 "$health_port"; do
            jq -n               --arg subnet "$runner_ip"               --arg port "$port"               --arg notes "$rid port-$port"               '{ip_type:"v4",protocol:"tcp",subnet:$subnet,subnet_size:32,port:$port,notes:$notes}' > "$body"
            safe_api_once POST "/v2/firewalls/$firewall_id/rules" "$body"
            expect_status 201
          done
          echo 'firewall_rules_create=PASS'

          public_key_full="$(tr -d '\r\n' < "$tmp/singbox-ops.pub")"
          jq -n --arg name "$rid" --arg key "$public_key_full" '{name:$name,ssh_key:$key}' > "$body"
          safe_api_once POST '/v2/ssh-keys' "$body"
          expect_status 201
          ssh_key_id="$(jq -r '.ssh_key.id // empty' "$response")"
          [[ -n "$ssh_key_id" ]]
          returned_key="$(jq -r '.ssh_key.ssh_key // empty' "$response" | awk '{print $1 " " $2}')"
          [[ "$returned_key" == "$expected_key" ]]
          echo "ssh_key_create=PASS id=$ssh_key_id"

          health_body="$rid"
          health_len="${#health_body}"
          cat > "$tmp/cloud-init.yaml" <<EOF
          #cloud-config
          disable_root: true
          ssh_pwauth: false
          users:
            - name: singbox-ops
              lock_passwd: true
              shell: /bin/bash
              sudo: "ALL=(ALL) NOPASSWD:ALL"
              ssh_authorized_keys:
                - $public_key_full
          write_files:
            - path: /etc/systemd/system/singbox-research-health.socket
              permissions: '0644'
              content: |
                [Unit]
                Description=sing-box disposable research health socket
                [Socket]
                ListenStream=$health_port
                Accept=yes
                [Install]
                WantedBy=sockets.target
            - path: /etc/systemd/system/singbox-research-health@.service
              permissions: '0644'
              content: |
                [Unit]
                Description=sing-box disposable research health responder
                [Service]
                ExecStart=/bin/sh -c 'printf "HTTP/1.1 200 OK\\r\\nContent-Length: $health_len\\r\\nConnection: close\\r\\n\\r\\n$health_body"'
                StandardInput=socket
                StandardOutput=socket
                StandardError=journal
          runcmd:
            - [mkdir, -p, /var/lib/singbox-research]
            - [sh, -c, "printf '%s\\n' '$rid' > /var/lib/singbox-research/bootstrap-ok"]
            - [systemctl, daemon-reload]
            - [systemctl, enable, --now, singbox-research-health.socket]
          EOF

          user_data="$(base64 -w0 "$tmp/cloud-init.yaml")"
          jq -n             --arg region "$region"             --arg plan "$plan"             --argjson os_id "$os_id"             --arg label "$rid"             --arg hostname "$rid"             --arg firewall "$firewall_id"             --arg ssh_key "$ssh_key_id"             --arg user_data "$user_data"             --arg rid "$rid"             '{
              region:$region,
              plan:$plan,
              os_id:$os_id,
              label:$label,
              hostname:$hostname,
              firewall_group_id:$firewall,
              sshkey_id:[$ssh_key],
              user_data:$user_data,
              activation_email:false,
              enable_ipv6:false,
              tags:["managed-by-singbox","environment-research",$rid]
            }' > "$body"

          safe_api_once POST '/v2/instances' "$body"
          expect_status 201
          instance_id="$(jq -r '.instance.id // empty' "$response")"
          [[ -n "$instance_id" ]]
          echo "instance_create=PASS id=$instance_id"

          ready=0
          for _ in $(seq 1 72); do
            safe_api_once GET "/v2/instances/$instance_id"
            expect_status 200
            status="$(jq -r '.instance.status // empty' "$response")"
            power="$(jq -r '.instance.power_status // empty' "$response")"
            server="$(jq -r '.instance.server_status // empty' "$response")"
            ip="$(jq -r '.instance.main_ip // empty' "$response")"
            if [[ "$status" == 'active' && "$power" == 'running' && "$server" == 'ok' && -n "$ip" && "$ip" != '0.0.0.0' ]]; then
              instance_ip="$ip"
              ready=1
              break
            fi
            sleep 5
          done
          [[ "$ready" == '1' ]]
          echo "provider_ready=PASS ip=$instance_ip"

          safe_api_once GET "/v2/instances/$instance_id"
          expect_status 200
          jq -e             --arg region "$region"             --arg plan "$plan"             --argjson os_id "$os_id"             --arg label "$rid"             --arg firewall "$firewall_id"             --arg rid "$rid"             '.instance
             | .region == $region
             and .plan == $plan
             and .os_id == $os_id
             and .label == $label
             and .firewall_group_id == $firewall
             and (.tags | index($rid) != null)' "$response" >/dev/null
          echo 'provider_identity=PASS'

          safe_api_once GET "/v2/instances/$instance_id/user-data"
          expect_status 200
          returned_user_data="$(jq -r '.user_data.data // empty' "$response")"
          [[ "$returned_user_data" == "$user_data" ]]
          echo 'user_data_roundtrip=PASS'

          health_ok=0
          for _ in $(seq 1 72); do
            set +e
            got="$(curl --silent --show-error --connect-timeout 2 --max-time 4 "http://$instance_ip:$health_port/" 2>/dev/null)"
            hrc="$?"
            set -e
            if [[ "$hrc" -eq 0 && "$got" == "$health_body" ]]; then
              health_ok=1
              break
            fi
            sleep 5
          done
          [[ "$health_ok" == '1' ]]
          echo 'cloud_init_systemd_health=PASS'

          scan_ok=0
          for _ in $(seq 1 24); do
            set +e
            ssh-keyscan -T 5 -t ed25519 "$instance_ip" > "$host_scan" 2>/dev/null
            src="$?"
            set -e
            if [[ "$src" -eq 0 && -s "$host_scan" ]]; then
              scan_ok=1
              break
            fi
            sleep 5
          done
          [[ "$scan_ok" == '1' ]]
          cp "$host_scan" "$known_hosts"
          host_key_before="$(awk '{print $2 " " $3}' "$host_scan" | head -n 1)"
          host_fp_before="$(ssh-keygen -lf "$host_scan" -E sha256 | awk '{print $2}' | head -n 1)"
          echo "ssh_host_tofu_observed=$host_fp_before"

          ssh             -i "$private_key"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$known_hosts"             -o ConnectTimeout=10             "singbox-ops@$instance_ip"             "test \"\$(id -un)\" = singbox-ops && test -f /var/lib/singbox-research/bootstrap-ok && systemctl is-active --quiet singbox-research-health.socket && printf 'ssh_guest_probe=PASS\\n'"

          safe_api_once POST "/v2/instances/$instance_id/reboot"
          expect_status 204
          echo 'reboot_request=PASS'

          reboot_ok=0
          for _ in $(seq 1 72); do
            sleep 5
            set +e
            got="$(curl --silent --show-error --connect-timeout 2 --max-time 4 "http://$instance_ip:$health_port/" 2>/dev/null)"
            hrc="$?"
            set -e
            if [[ "$hrc" -eq 0 && "$got" == "$health_body" ]]; then
              reboot_ok=1
              break
            fi
          done
          [[ "$reboot_ok" == '1' ]]
          echo 'reboot_recovery=PASS'

          ssh-keyscan -T 5 -t ed25519 "$instance_ip" > "$host_scan" 2>/dev/null
          host_key_after="$(awk '{print $2 " " $3}' "$host_scan" | head -n 1)"
          [[ "$host_key_after" == "$host_key_before" ]]
          echo 'ssh_host_key_stable_after_reboot=PASS'

          ssh             -i "$private_key"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$known_hosts"             -o ConnectTimeout=10             "singbox-ops@$instance_ip"             "test \"\$(id -un)\" = singbox-ops && systemctl is-active --quiet singbox-research-health.socket && printf 'ssh_after_reboot=PASS\\n'"

          safe_api_once POST "/v2/instances/$instance_id/halt"
          expect_status 204
          echo 'halt_request=PASS'

          halted=0
          for _ in $(seq 1 36); do
            sleep 5
            safe_api_once GET "/v2/instances/$instance_id"
            expect_status 200
            power="$(jq -r '.instance.power_status // empty' "$response")"
            if [[ "$power" != 'running' ]]; then
              halted=1
              echo "halt_observed_power_status=$power"
              break
            fi
          done
          [[ "$halted" == '1' ]]

          safe_api_once POST "/v2/instances/$instance_id/start"
          expect_status 204
          echo 'start_request=PASS'

          started=0
          for _ in $(seq 1 72); do
            sleep 5
            safe_api_once GET "/v2/instances/$instance_id"
            expect_status 200
            power="$(jq -r '.instance.power_status // empty' "$response")"
            server="$(jq -r '.instance.server_status // empty' "$response")"
            if [[ "$power" == 'running' && "$server" == 'ok' ]]; then
              set +e
              got="$(curl --silent --show-error --connect-timeout 2 --max-time 4 "http://$instance_ip:$health_port/" 2>/dev/null)"
              hrc="$?"
              set -e
              if [[ "$hrc" -eq 0 && "$got" == "$health_body" ]]; then
                started=1
                break
              fi
            fi
          done
          [[ "$started" == '1' ]]
          echo 'halt_start_recovery=PASS'

          safe_api_once DELETE "/v2/instances/$instance_id"
          expect_status 204
          echo 'instance_delete_request=PASS'

          absent=0
          for _ in $(seq 1 72); do
            sleep 5
            safe_api_once GET "/v2/instances/$instance_id" || true
            if [[ "$API_STATUS" == '404' ]]; then
              absent=1
              break
            fi
          done
          [[ "$absent" == '1' ]]
          echo 'instance_absence=PASS'
          instance_id=''

          for _ in $(seq 1 24); do
            safe_api_once GET "/v2/firewalls/$firewall_id"
            expect_status 200
            [[ "$(jq -r '.firewall_group.instance_count // 0' "$response")" == '0' ]] && break
            sleep 5
          done

          safe_api_once DELETE "/v2/firewalls/$firewall_id"
          expect_status 204
          echo 'firewall_delete=PASS'
          firewall_id=''

          safe_api_once DELETE "/v2/ssh-keys/$ssh_key_id"
          expect_status 204
          echo 'ssh_key_delete=PASS'
          ssh_key_id=''

          safe_api_once GET "/v2/instances?tag=$rid&per_page=500"
          expect_status 200
          [[ "$(jq -r --arg rid "$rid" '[.instances[] | select(.label == $rid and (.tags | index($rid)))] | length' "$response")" == '0' ]]

          safe_api_once GET '/v2/firewalls?per_page=500'
          expect_status 200
          [[ "$(jq -r --arg rid "$rid" '[.firewall_groups[] | select(.description == $rid)] | length' "$response")" == '0' ]]

          safe_api_once GET '/v2/ssh-keys?per_page=500'
          expect_status 200
          [[ "$(jq -r --arg rid "$rid" '[.ssh_keys[] | select(.name == $rid)] | length' "$response")" == '0' ]]

          echo 'clean_absence=PASS'
          echo 'disposable_lifecycle=PASS'
