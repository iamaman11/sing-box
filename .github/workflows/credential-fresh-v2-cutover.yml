name: Fresh V2 Terminal Cutover

on:
  workflow_call:

permissions: {}

concurrency:
  group: sing-box-fresh-v2-terminal-cutover
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact Stage 2 ReleaseSet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      edge_agent_sha256: ${{ steps.release.outputs.edge_agent_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'edge_agent_sha256=%s\n' "${EDGE_AGENT_SHA256}" >> "${GITHUB_OUTPUT}"

  vm_preflight:
    name: VM preflight — exact owner + legacy only
    needs: resolve
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.resolve.outputs.edge_agent_sha256 }}
    steps:
      - name: Prove bounded exact local owner
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test -x "${owner}"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          test "$(id -u)" != "0"
          if sudo -n id -u >/dev/null 2>&1; then
            echo "production runner unexpectedly has generic root authority" >&2
            exit 1
          fi
          if test -r /var/run/docker.sock; then
            echo "production runner unexpectedly has Docker socket authority" >&2
            exit 1
          fi

      - name: Require initial legacy-only credential state
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          result="${RUNNER_TEMP}/vm-credential-preflight.txt"
          sudo -n "${owner}" local credential-state | tee "${result}"
          grep -Fxq 'credential_state_present=false' "${result}"
          grep -Fxq 'legacy_credential_store_present=true' "${result}"

  windows_preflight:
    name: Windows preflight — exact release + no v2 state
    needs: resolve
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      EDGE_ACCEPTED_REVISION: ${{ github.sha }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.resolve.outputs.release_set_sha256 }}
    steps:
      - name: Activate exact Stage 2 ReleaseSet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Initial activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console)) { throw 'Current console path is unavailable' }
          & $console privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2 ReleaseSet activation failed' }

          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Post-activation doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Windows activation does not match Stage 2 ReleaseSet'
          }
          $console = [string]$values['console_path']
          & $console ensure-controller $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows controller is unavailable' }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Require initial Windows v2 state absent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $result = @(& $env:EDGE_CURRENT_CONSOLE credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential-state observation failed' }
          $result | ForEach-Object { Write-Host $_ }
          if (-not ($result -contains 'credential_state=ABSENT')) {
            throw 'Stage 2 initial cutover refuses existing Windows v2 credential state'
          }

  publish:
    name: Publish one paired fresh-v2 snapshot to inactive slot
    needs:
      - resolve
      - vm_preflight
      - windows_preflight
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      generation: ${{ steps.publish.outputs.generation }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact orchestrator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${{ needs.resolve.outputs.release_set_sha256 }}"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Generate once and publish slot A only
        id: publish
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/fresh-v2-publish.txt"
          "${EDGE_CREDENTIAL_ORCHESTRATOR}" credentials fresh-v2-publish | tee "${result}"
          grep -Fxq 'credential_fresh_v2_status=PASS' "${result}"
          grep -Fxq 'credential_slot=A' "${result}"
          grep -Fxq 'paired_projection_count=2' "${result}"
          grep -Fxq 'active_slot_mutated=false' "${result}"
          generation="$(sed -n 's/^credential_generation=//p' "${result}")"
          [[ "${generation}" =~ ^[1-9][0-9]*$ ]]
          printf 'generation=%s\n' "${generation}" >> "${GITHUB_OUTPUT}"

  vm_stage:
    name: VM non-activating v2 stage
    needs:
      - resolve
      - publish
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 10
    permissions: {}
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.resolve.outputs.edge_agent_sha256 }}
      GENERATION: ${{ needs.publish.outputs.generation }}
    steps:
      - name: Stage exact generation through local owner
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          result="${RUNNER_TEMP}/vm-stage.txt"
          sudo -n "${owner}" local credential-stage "${GENERATION}" | tee "${result}"
          grep -Fxq 'operation=CREDENTIAL_STAGE' "${result}"
          grep -Fxq "credential_generation=${GENERATION}" "${result}"
          grep -Fxq 'credential_active_present=false' "${result}"
          grep -Fxq 'credential_candidate_present=true' "${result}"

  windows_stage:
    name: Windows non-activating v2 stage
    needs:
      - publish
      - windows_preflight
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      GENERATION: ${{ needs.publish.outputs.generation }}
    steps:
      - name: Stage exact generation inside SYSTEM boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-stage-credential ([UInt64]$env:GENERATION) --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows v2 staging failed' }

  vm_candidate:
    name: VM candidate-v2 bounded acceptance
    needs:
      - resolve
      - vm_stage
      - windows_stage
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 20
    permissions: {}
    env:
      EXPECTED_AGENT_SHA256: ${{ needs.resolve.outputs.edge_agent_sha256 }}
    steps:
      - name: Apply candidate without pointer promotion
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EXPECTED_AGENT_SHA256}"
          result="${RUNNER_TEMP}/vm-candidate.txt"
          sudo -n "${owner}" local credential-apply-candidate | tee "${result}"
          grep -Fxq 'operation=CREDENTIAL_APPLY_CANDIDATE' "${result}"
          grep -Fxq 'credential_pointer_mutated=false' "${result}"
          grep -Fxq 'credential_runtime_ready=true' "${result}"
          grep -Fxq 'credential_runtime_warp_ready=true' "${result}"

  windows_apply_candidate:
    name: Windows candidate-v2 apply without promotion
    needs:
      - vm_candidate
      - windows_stage
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
    steps:
      - name: Apply candidate config transactionally through SYSTEM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-apply-credential-candidate --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate apply failed' }

  windows_candidate_functional:
    name: Windows candidate direct + WARP functional acceptance
    needs: windows_apply_candidate
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
    steps:
      - name: Restart isolated runtime and prove both egress modes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console restart-local $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows candidate restart failed' }

          & $console set-selector auto-direct-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Direct selector apply failed' }
          $direct = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw 'Direct trace failed' }
          $direct | ForEach-Object { Write-Host $_ }
          if (-not ($direct -match 'Current tunnel WARP\s+: off')) {
            throw 'Candidate direct egress did not prove WARP=off'
          }

          & $console set-selector auto-warp-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'WARP selector apply failed' }
          $warp = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw 'WARP trace failed' }
          $warp | ForEach-Object { Write-Host $_ }
          if (-not ($warp -match 'Current tunnel WARP\s+: (on|plus)')) {
            throw 'Candidate WARP egress did not prove WARP=on/plus'
          }

          & $console set-selector auto-direct-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Selector restore failed' }
          Write-Host 'WINDOWS_CANDIDATE_DIRECT=PASS'
          Write-Host 'WINDOWS_CANDIDATE_WARP=PASS'

  vm_promote:
    name: Promote VM v2 local authority
    needs: windows_candidate_functional
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Promote candidate and reapply active
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          sudo -n "${owner}" local credential-promote | tee "${RUNNER_TEMP}/vm-promote.txt"
          grep -Fxq 'operation=CREDENTIAL_PROMOTE' "${RUNNER_TEMP}/vm-promote.txt"
          grep -Fxq 'credential_active_present=true' "${RUNNER_TEMP}/vm-promote.txt"
          grep -Fxq 'credential_candidate_present=false' "${RUNNER_TEMP}/vm-promote.txt"

  windows_promote:
    name: Promote Windows v2 local authority
    needs: vm_promote
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
    steps:
      - name: Promote through SYSTEM boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-promote-credential --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows v2 promotion failed' }

  vm_recovery:
    name: VM active-v2 restart/recovery proof
    needs: windows_promote
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Reapply exact active v2 through local owner
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          sudo -n "${owner}" local credential-apply-active | tee "${RUNNER_TEMP}/vm-recovery.txt"
          grep -Fxq 'operation=CREDENTIAL_APPLY_ACTIVE' "${RUNNER_TEMP}/vm-recovery.txt"
          grep -Fxq 'credential_runtime_ready=true' "${RUNNER_TEMP}/vm-recovery.txt"
          grep -Fxq 'credential_runtime_warp_ready=true' "${RUNNER_TEMP}/vm-recovery.txt"

  windows_recovery:
    name: Windows active-v2 restart/recovery proof
    needs: vm_recovery
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
    steps:
      - name: Reapply active v2 and prove direct/WARP after restart
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-apply-active-credential --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows active-v2 reapply failed' }
          & $console restart-local $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows active-v2 restart failed' }
          & $console set-selector auto-direct-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          $direct = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if (-not ($direct -match 'Current tunnel WARP\s+: off')) { throw 'Recovered direct v2 trace failed' }
          & $console set-selector auto-warp-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          $warp = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if (-not ($warp -match 'Current tunnel WARP\s+: (on|plus)')) { throw 'Recovered WARP v2 trace failed' }
          & $console set-selector auto-direct-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          Write-Host 'WINDOWS_V2_RECOVERY=PASS'

  vm_rollback:
    name: VM bounded rollback proof to legacy-v1
    needs: windows_recovery
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Apply legacy runtime without changing v2 pointer
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          sudo -n "${owner}" local credential-apply-legacy | tee "${RUNNER_TEMP}/vm-rollback.txt"
          grep -Fxq 'operation=CREDENTIAL_APPLY_LEGACY' "${RUNNER_TEMP}/vm-rollback.txt"
          grep -Fxq 'credential_pointer_mutated=false' "${RUNNER_TEMP}/vm-rollback.txt"
          grep -Fxq 'credential_runtime_ready=true' "${RUNNER_TEMP}/vm-rollback.txt"

  windows_rollback:
    name: Windows bounded rollback proof to legacy-v1
    needs: vm_rollback
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
    steps:
      - name: Restore legacy state and prove functional runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-apply-legacy-credential --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows legacy rollback apply failed' }
          & $console restart-local $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows legacy rollback restart failed' }
          & $console set-selector auto-direct-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          $direct = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if (-not ($direct -match 'Current tunnel WARP\s+: off')) { throw 'Legacy rollback direct trace failed' }
          Write-Host 'WINDOWS_LEGACY_ROLLBACK=PASS'

  vm_restore:
    name: Restore accepted active v2 on VM
    needs: windows_rollback
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Restore active v2
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          sudo -n "${owner}" local credential-apply-active | tee "${RUNNER_TEMP}/vm-restore.txt"
          grep -Fxq 'operation=CREDENTIAL_APPLY_ACTIVE' "${RUNNER_TEMP}/vm-restore.txt"
          grep -Fxq 'credential_runtime_ready=true' "${RUNNER_TEMP}/vm-restore.txt"

  windows_restore:
    name: Restore accepted active v2 on Windows
    needs: vm_restore
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
    steps:
      - name: Restore active v2 and prove both egress modes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-apply-active-credential --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows active-v2 restore failed' }
          & $console restart-local $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows active-v2 restore restart failed' }
          & $console set-selector auto-direct-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          $direct = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if (-not ($direct -match 'Current tunnel WARP\s+: off')) { throw 'Restored direct v2 trace failed' }
          & $console set-selector auto-warp-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          $warp = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if (-not ($warp -match 'Current tunnel WARP\s+: (on|plus)')) { throw 'Restored WARP v2 trace failed' }
          & $console set-selector auto-direct-tunnel $env:EDGE_CONTROLLER_ENDPOINT
          Write-Host 'WINDOWS_V2_RESTORE=PASS'

  vm_retire_legacy:
    name: Retire VM legacy-v1 after rollback proof
    needs: windows_restore
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Delete only proven legacy LKG
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          sudo -n "${owner}" local credential-retire-legacy | tee "${RUNNER_TEMP}/vm-retire.txt"
          grep -Fxq 'operation=CREDENTIAL_RETIRE_LEGACY' "${RUNNER_TEMP}/vm-retire.txt"
          grep -Fxq 'legacy_credential_store_present=false' "${RUNNER_TEMP}/vm-retire.txt"

  windows_retire_legacy:
    name: Retire Windows legacy-v1 after rollback proof
    needs: vm_retire_legacy
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
    steps:
      - name: Delete protected legacy runtime-state backup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-retire-legacy-credential --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows legacy credential retirement failed' }

  vm_final:
    name: Final VM v2 state proof
    needs:
      - publish
      - vm_retire_legacy
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 10
    permissions: {}
    env:
      GENERATION: ${{ needs.publish.outputs.generation }}
    steps:
      - name: Prove only accepted v2 active remains
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          result="${RUNNER_TEMP}/vm-final.txt"
          sudo -n "${owner}" local credential-state | tee "${result}"
          grep -Fxq 'credential_active_present=true' "${result}"
          grep -Fxq "credential_active_generation=${GENERATION}" "${result}"
          grep -Fxq 'credential_candidate_present=false' "${result}"
          grep -Fxq 'credential_previous_present=false' "${result}"
          grep -Fxq 'legacy_credential_store_present=false' "${result}"
          sudo -n "${owner}" local verify >/dev/null

  windows_final:
    name: Final Windows v2 state proof
    needs:
      - publish
      - windows_retire_legacy
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 10
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      GENERATION: ${{ needs.publish.outputs.generation }}
    steps:
      - name: Prove only accepted v2 active remains
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          $state = @(& $console credential-state $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw 'Windows final credential-state failed' }
          $state | ForEach-Object { Write-Host $_ }
          if (-not ($state -contains "credential_active_generation=$env:GENERATION")) { throw 'Windows active generation mismatch' }
          if (-not ($state -contains 'credential_candidate_generation=0')) { throw 'Windows candidate remains' }
          if (-not ($state -contains 'credential_previous_generation=0')) { throw 'Windows previous remains' }
          $trace = @(& $console trace $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw 'Windows final trace failed' }

  provider_final:
    name: Final read-only credential-plane verification
    needs:
      - resolve
      - vm_final
      - windows_final
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve and run read-only contract verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          orchestrator="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          result="${RUNNER_TEMP}/final-contract-verify.txt"
          "${orchestrator}" credentials contract-verify | tee "${result}"
          grep -Fxq 'credential_delivery_status=PASS' "${result}"
          grep -Fxq 'real_credentials_created=0' "${result}"
          grep -Fxq 'production_runtime_mutations=0' "${result}"

  terminal:
    name: Stage 2 terminal PASS
    needs:
      - publish
      - vm_final
      - windows_final
      - provider_final
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Emit terminal evidence
        shell: bash
        env:
          GENERATION: ${{ needs.publish.outputs.generation }}
        run: |
          set -euo pipefail
          echo 'STAGE2_TERMINAL=PASS'
          echo "STAGE2_GENERATION=${GENERATION}"
          echo 'STAGE2_SLOT=A'
          echo 'STAGE2_ROLLBACK_PROOF=PASS'
          echo 'STAGE2_RESTORE_V2=PASS'
          echo 'STAGE2_LEGACY_RETIRED=PASS'
          echo 'RUNNER_PLAINTEXT_AUTHORITY=false'

  vm_failure_rollback:
    name: Failure containment — VM runtime back to legacy
    needs:
      - vm_stage
      - vm_candidate
      - vm_promote
      - vm_recovery
      - vm_rollback
      - vm_restore
      - vm_retire_legacy
      - terminal
    if: >-
      always() &&
      needs.vm_stage.result == 'success' &&
      needs.vm_retire_legacy.result != 'success' &&
      needs.terminal.result != 'success'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - production-1
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Restore legacy runtime only; preserve v2 evidence
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          sudo -n "${owner}" local credential-apply-legacy
          echo 'STAGE2_FAILURE_VM_RUNTIME=LEGACY_RESTORED'
          echo 'STAGE2_FAILURE_V2_STATE=PRESERVED_FOR_ANALYSIS'

  windows_failure_rollback:
    name: Failure containment — Windows runtime back to legacy
    needs:
      - windows_stage
      - windows_apply_candidate
      - windows_candidate_functional
      - windows_promote
      - windows_recovery
      - windows_rollback
      - windows_restore
      - windows_retire_legacy
      - terminal
    if: >-
      always() &&
      needs.windows_stage.result == 'success' &&
      needs.windows_retire_legacy.result != 'success' &&
      needs.terminal.result != 'success'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
    steps:
      - name: Restore legacy runtime only; preserve v2 evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $values = @{}
          foreach ($line in @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          & $console privileged-apply-legacy-credential --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Windows failure containment could not restore legacy runtime' }
          & $console restart-local $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'Windows failure containment restart failed' }
          Write-Host 'STAGE2_FAILURE_WINDOWS_RUNTIME=LEGACY_RESTORED'
          Write-Host 'STAGE2_FAILURE_V2_STATE=PRESERVED_FOR_ANALYSIS'
