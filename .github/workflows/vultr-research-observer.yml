name: Vultr Research Observer

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  observe:
    if: >-
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == '1' &&
      github.event.comment.body == '/vultr-research observe'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 3

    steps:
      - name: Observe disposable resource leaks
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          set -euo pipefail

          api() {
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer ${VULTR_API_KEY}" \
              --header "Accept: application/json" \
              "https://api.vultr.com$1"
          }

          instances="$(api '/v2/instances?tag=research-disposable&per_page=500')"
          firewalls="$(api '/v2/firewalls?per_page=500')"
          ssh_keys="$(api '/v2/ssh-keys?per_page=500')"

          ni="$(jq '[.instances[] | select(((.tags // []) | index("research-disposable")) != null)] | length' <<<"$instances")"
          nf="$(jq '[.firewall_groups[] | select((.description // "") | startswith("singbox-research-"))] | length' <<<"$firewalls")"
          nk="$(jq '[.ssh_keys[] | select((.name // "") | startswith("singbox-research-"))] | length' <<<"$ssh_keys")"

          echo "observer.instances=$ni"
          echo "observer.firewalls=$nf"
          echo "observer.ssh_keys=$nk"

          if [[ "$ni" != 0 || "$nf" != 0 || "$nk" != 0 ]]; then
            echo "observer.overall=FAIL"
            exit 1
          fi

          echo "observer.overall=PASS"
