name: Cloudflare Credential Plane

on:
  workflow_call:
    inputs:
      command_body:
        description: Authorized /credential-plane command from the control-plane router
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.parse.outputs.operation }}

    steps:
      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.command_body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os

          allowed = {"inventory", "plan", "converge", "verify", "prove"}
          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          if len(tokens) != 2 or tokens[0] != "/credential-plane" or tokens[1] not in allowed:
              raise SystemExit("unsupported /credential-plane command grammar")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"operation={tokens[1]}\n")
          PY

  execute:
    needs: authorize
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f infra/production/production.textproto

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified credential-plane owner
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_CREDENTIAL_PLANE_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"

      - name: Execute typed credential-plane operation
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          bin="${EDGE_CREDENTIAL_PLANE_ORCHESTRATOR}"
          operation="${REQUESTED_OPERATION}"
          result="${RUNNER_TEMP}/credential-plane-result.txt"

          test -x "${bin}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          "${bin}" cloudflare-credential-plane "${operation}" | tee "${result}"

          {
            echo '### Cloudflare credential-plane result'
            echo
            printf 'Operation: `%s`\n' "${operation}"
            echo
            echo 'Execution used the exact accepted durable Edge Platform orchestrator.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
