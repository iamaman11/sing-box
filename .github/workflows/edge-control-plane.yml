name: Edge Control Plane
run-name: ${{ startsWith(github.event.comment.body, '/') && github.event.comment.body || 'Edge Control Plane — NO_COMMAND' }}

on:
  issue_comment:
    types: [created]
  # Internal continuation only after protected main has published a ReleaseSet.
  # Never a second public /host mutation ingress.
  workflow_run:
    workflows: [Edge Platform CI]
    types: [completed]

permissions:
  contents: read

jobs:
  host:
    # One Rust-owned host lifecycle entry point. GitHub authorizes the caller;
    # existing release identity and typed protobuf identify the exact hosts.
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (github.event.comment.body == '/host status' ||
       startsWith(github.event.comment.body, '/host status ') ||
       startsWith(github.event.comment.body, '/host apply ') ||
       startsWith(github.event.comment.body, '/host recover ') ||
       startsWith(github.event.comment.body, '/host diagnose ') ||
       startsWith(github.event.comment.body, '/host admin '))
    outputs:
      kind: ${{ steps.observe.outputs.kind }}
      owner: ${{ steps.observe.outputs.owner }}
      runner_labels: ${{ steps.observe.outputs.runner_labels }}
      machine_id: ${{ steps.observe.outputs.machine_id }}
      desired_spec_path: ${{ steps.observe.outputs.desired_spec_path }}
      operation: ${{ steps.observe.outputs.operation }}
      windows_runner_label: ${{ steps.observe.outputs.windows_runner_label }}
      admitted_at_unix: ${{ steps.observe.outputs.admitted_at_unix }}
      host_matrix: ${{ steps.observe.outputs.host_matrix }}
      host_targets_present: ${{ steps.observe.outputs.host_targets_present }}
      runner_inventory_state: ${{ steps.runner_inventory.outputs.state }}
      diagnostic_git_phase: ${{ steps.observe.outputs.git_phase }}
      diagnostic_git_owner: ${{ steps.observe.outputs.git_owner }}
      diagnostic_git_reason: ${{ steps.observe.outputs.git_reason }}
      diagnostic_git_last_proven_step: ${{ steps.observe.outputs.git_last_proven_step }}
      diagnostic_git_next_action: ${{ steps.observe.outputs.git_next_action }}
      diagnostic_release_set_sha256: ${{ steps.observe.outputs.diagnostic_release_set_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      COMMAND_BODY: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
      BUF_VERSION: "1.73.0"
      BUF_LINUX_X86_64_SHA256: "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1"
    steps:
      - name: Fetch exact protected Git desired state
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f infra/hosts/hosts.textproto

      - name: Resolve exact immutable native Rust owner
        shell: bash
        env:
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          echo "HOST_OWNER=${owner}" >> "${GITHUB_ENV}"

      - name: Validate exact Git host through pinned protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          buf_bin="${RUNNER_TEMP}/buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            --output "${buf_bin}"
          echo "${BUF_LINUX_X86_64_SHA256}  ${buf_bin}" | sha256sum --check -
          chmod 0755 "${buf_bin}"
          test "$("${buf_bin}" --version)" = "${BUF_VERSION}"
          cd edge-platform
          "${buf_bin}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "../infra/hosts/hosts.textproto#format=txtpb" \
            --to "${RUNNER_TEMP}/hosts.binpb#format=binpb"
          test -s "${RUNNER_TEMP}/hosts.binpb"
          echo "HOSTS_SHA256=$(sha256sum "${RUNNER_TEMP}/hosts.binpb" | cut -d' ' -f1)" >> "${GITHUB_ENV}"

      - name: Read official runner registration for host routing
        id: runner_inventory
        shell: bash
        run: |
          set -euo pipefail
          inventory_state=RUNNER_API_FETCHED_UNVERIFIED
          if ! gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            > "${RUNNER_TEMP}/host-runners.json"; then
            rm -f "${RUNNER_TEMP}/host-runners.json"
            # Read-only host diagnostics still dispatch to the exact
            # Git-owned runner label. The physical owner independently
            # validates its immutable RUNNER_NAME before any diagnostic.
            # This token may lack repository Administration:read. Observe
            # the actual HTTP status in a separate GET; never infer OFFLINE
            # from missing GitHub inventory, or publish the response body.
            http_response="$(gh api -i -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=1" 2>/dev/null || true)"
            http_status="$(printf '%s\n' "${http_response}" | grep -E '^HTTP/[0-9.]+ [0-9]{3}' | tail -n 1 | awk '{print $2}' || true)"
            case "${http_status}" in
              401|403) inventory_state="RUNNER_API_PERMISSION_DENIED_HTTP_${http_status}" ;;
              429) inventory_state=RUNNER_API_RATE_LIMIT_HTTP_429 ;;
              5??) inventory_state="RUNNER_API_SERVER_ERROR_HTTP_${http_status}" ;;
              4??) inventory_state="RUNNER_API_REJECTED_HTTP_${http_status}" ;;
              *) inventory_state=RUNNER_API_TRANSPORT_OR_PARSE_UNAVAILABLE ;;
            esac
            echo 'RUNNER_REGISTRATION_UNPROVEN_NATIVE_OWNER_MUST_VERIFY' >&2
          fi
          if [[ -e "${RUNNER_TEMP}/host-runners.json" ]]; then
            test -s "${RUNNER_TEMP}/host-runners.json" || exit 1
          fi
          # This closed enum records API transport, not online native proof.
          # The Rust owner still parses exact registration and label evidence.
          [[ "${inventory_state}" =~ ^RUNNER_API_[A-Z0-9_]+$ ]]
          echo "state=${inventory_state}" >> "${GITHUB_OUTPUT}"
          echo "host_runner_inventory_state=${inventory_state}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Show one typed native host status or read-only lifecycle preflight
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${COMMAND_BODY}" == "/host status" ]]; then
            command=(status)
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]status[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})([[:space:]]--deep)?$ ]]; then
            machine="${BASH_REMATCH[1]}"
            command=(status "${machine}")
            if [[ "${COMMAND_BODY}" == *" --deep" ]]; then command+=(--deep); fi
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]apply[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})[[:space:]](config/[A-Za-z0-9][A-Za-z0-9._-]{0,63}/(line1-gateway|line2-proxy))$ ]]; then
            command=(apply "${BASH_REMATCH[1]}" --resource-id "${BASH_REMATCH[2]}")
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]admin[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})[[:space:]]([A-Za-z0-9_-]{1,24000})$ ]]; then
            command=(admin "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}")
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]diagnose[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})[[:space:]](.{1,480})$ ]]; then
            machine="${BASH_REMATCH[1]}"
            # Splitting into argv is ONLY transport. Rust coordinator and native
            # root owner independently validate the closed read-only grammar.
            read -r -a probe_argv <<< "${BASH_REMATCH[2]}"
            command=(diagnose "${machine}" -- "${probe_argv[@]}")
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]](apply|recover)[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})$ ]]; then
            command=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}")
          else
            echo 'HOST_COMMAND_INVALID' >&2
            exit 1
          fi
          # The old accepted main may still support diagnostic STATUS, but
          # must never mint a signed mutation from a release missing its Git
          # registry. Compare the published asset to our independent exact
          # checked-out textproto compilation, before preparing HostIntent.
          if [[ "${command[0]}" != "status" ]]; then
            source "${RUNNER_TEMP}/host-release/resolved.env"
            test "${EDGE_RELEASE_SCHEMA_VERSION}" = "8"
            [[ "${EDGE_FLEET_REGISTRY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            test "${EDGE_FLEET_REGISTRY_SHA256}" = "${HOSTS_SHA256}"
            cmp -s "${RUNNER_TEMP}/host-release/fleet-registry.pb" "${RUNNER_TEMP}/hosts.binpb"
            test -s "${RUNNER_TEMP}/host-release/application-bundle.pb"
          fi
          runner_args=()
          if [[ -f "${RUNNER_TEMP}/host-runners.json" ]]; then
            runner_args=(--runner-inventory-json "${RUNNER_TEMP}/host-runners.json")
          fi
          "${HOST_OWNER}" host \
            --hosts-pb "${RUNNER_TEMP}/hosts.binpb" \
            --hosts-sha256 "${HOSTS_SHA256}" \
            --github-output "${GITHUB_OUTPUT}" \
            --source-comment-id "${{ github.event.comment.id }}" \
            --intent-output "${RUNNER_TEMP}/host-intent.pb" \
            "${runner_args[@]}" \
            "${command[@]}" | tee "${RUNNER_TEMP}/host-observation.txt"
          if [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]status[[:space:]][a-zA-Z0-9][a-zA-Z0-9._-]{0,63}[[:space:]]--deep$ ]]; then
            # Trust ONLY the exact Rust-produced Git readiness (one machine).
            # GH outputs are ephemeral transport, never independent evidence.
            test "$(grep -c '^host_machine_id=' "${RUNNER_TEMP}/host-observation.txt")" = 1
            for field in phase owner reason last_proven_step next_action; do
              value="$(grep -E "^host_first_use_${field}=" "${RUNNER_TEMP}/host-observation.txt" | cut -d= -f2-)"
              [[ "${value}" =~ ^[A-Z][A-Z0-9_]{1,119}$ ]] || {
                echo HOST_DIAGNOSTIC_GIT_STAGE_MISSING >&2
                exit 1
              }
              printf 'git_%s=%s\n' "${field}" "${value}" >> "${GITHUB_OUTPUT}"
            done
            digest="$(grep -E '^release_set_sha256=' "${RUNNER_TEMP}/host-observation.txt" | cut -d= -f2-)"
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]] || {
              echo HOST_DIAGNOSTIC_RELEASE_DIGEST_INVALID >&2
              exit 1
            }
            echo "diagnostic_release_set_sha256=${digest}" >> "${GITHUB_OUTPUT}"
          fi
          {
            echo '### Host — exact typed operation'
            echo '~~~text'
            cat "${RUNNER_TEMP}/host-observation.txt"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Retain one typed intent and blocked/prepared receipt
        if: ${{ steps.observe.outputs.operation == 'APPLY_PREFLIGHT' || steps.observe.outputs.operation == 'RECOVER_PREFLIGHT' ||
               steps.observe.outputs.operation == 'DIAGNOSE' || steps.observe.outputs.operation == 'ADMIN' }}
        uses: actions/upload-artifact@v4
        with:
          name: host-intent-${{ github.event.comment.id }}
          path: |
            ${{ runner.temp }}/host-intent.pb
            ${{ runner.temp }}/host-intent.receipt.pb
          if-no-files-found: error
          retention-days: 7

  host_observe:
    # No routine hosted SSH refresh/upgrade; the installed native owner
    # independently verifies current Git receipt and signed intent.
    # Stale root trust fails closed instead of inventing an SSH fallback.
    needs: [host, host_report, host_worker_authorizer]
    if: >-
      always() && !cancelled() &&
      needs.host.result == 'success' &&
      needs.host_report.result == 'success' &&
      needs.host.outputs.host_targets_present == 'true' &&
      (needs.host.outputs.kind != 'VM' ||
       needs.host.outputs.operation != 'APPLY_PREFLIGHT' ||
       needs.host_worker_authorizer.result == 'success' &&
       needs.host_worker_authorizer.outputs.source_upgrade_required == 'false') &&
      (needs.host.outputs.operation == 'STATUS' ||
       needs.host.outputs.operation == 'APPLY_PREFLIGHT' ||
       needs.host.outputs.operation == 'RECOVER_PREFLIGHT' ||
       needs.host.outputs.operation == 'DIAGNOSE' ||
       needs.host.outputs.operation == 'ADMIN')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host.outputs.host_matrix) }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/host-native-observe.yml
    with:
      machine_id: ${{ matrix.machine_id }}
      owner: ${{ matrix.owner }}
      kind: ${{ matrix.kind }}
      runner_labels: ${{ toJSON(matrix.runner_labels) }}
      operation: ${{ needs.host.outputs.operation }}
      command_body: ${{ github.event.comment.body }}
      source_comment_id: ${{ github.event.comment.id }}
      report_comment_id: ${{ needs.host_report.outputs.comment_id }}

  host_report:
    # Post an immediate, bounded Actions run pointer. An offline runner
    # must not postpone ChatGPT's discovery of the physical status workflow.
    needs: host
    if: >-
      github.run_attempt == 1 &&
      needs.host.result == 'success' &&
      (needs.host.outputs.operation == 'STATUS' ||
       needs.host.outputs.operation == 'APPLY_PREFLIGHT' ||
       needs.host.outputs.operation == 'RECOVER_PREFLIGHT' ||
       needs.host.outputs.operation == 'DIAGNOSE' ||
       needs.host.outputs.operation == 'ADMIN' ||
       needs.host.outputs.operation == 'FIRST_USE_PREFLIGHT' ||
       needs.host.outputs.operation == 'FIRST_USE_ABORT_PREFLIGHT' ||
       needs.host.outputs.operation == 'WORKER_AUTHORIZER_PREFLIGHT')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      comment_id: ${{ steps.publish.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      COMMAND_BODY: ${{ github.event.comment.body }}
      TARGETS_PRESENT: ${{ needs.host.outputs.host_targets_present }}
      HOST_OPERATION: ${{ needs.host.outputs.operation }}
      RUNNER_INVENTORY_STATE: ${{ needs.host.outputs.runner_inventory_state }}
    steps:
      - name: Publish one read-only observation pointer immediately
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMENT_ID}" =~ ^[0-9]+$ ]]
          [[ "${RUNNER_INVENTORY_STATE}" =~ ^RUNNER_API_[A-Z0-9_]+$ ]]
          case "${TARGETS_PRESENT}" in
            true) result=PER_HOST_NATIVE_REPORTS_INDEPENDENT ;;
            false)
              if [[ "${HOST_OPERATION}" == "WORKER_AUTHORIZER_PREFLIGHT" ]]; then
                result=CANONICAL_VM_WORKER_AUTHORIZER_STAGE
              elif [[ "${HOST_OPERATION}" == FIRST_USE_PREFLIGHT ||
                       "${HOST_OPERATION}" == APPLY_PREFLIGHT ]]; then
                result=FIRST_USE_GIT_RECEIPT_REGISTRATION_REQUIRED
              else
                result=NO_NATIVE_TARGET_AVAILABLE
              fi
              ;;
            *) exit 1 ;;
          esac
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          report_kind='Host read-only report'
          if [[ "${HOST_OPERATION}" == RECOVER_PREFLIGHT ]]; then
            report_kind='Host code-only recovery report'
          fi
          body="$(printf '%s for operator command #%s\n\nOperation: `%s`\nResult: `%s`\nPhysical dispatch selected: `%s`\nRunner inventory API: `%s` (not physical proof)\nCI evidence: %s\n\nResults arrive as separate correlated replies. Unresponsive runners remain UNPROVEN. For VM /host recover, the installed root owner may refresh only its exact protected binary/trust and diagnose; this never authorizes resource replay, Docker/network changes or a signed INSTALL.\n' \
            "${report_kind}" "${SOURCE_COMMENT_ID}" "${COMMAND_BODY}" "${result}" "${TARGETS_PRESENT}" "${RUNNER_INVENTORY_STATE}" "${run_url}")"
          comment_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f "body=${body}" --jq '.id')"
          [[ "${comment_id}" =~ ^[0-9]+$ ]]
          echo "comment_id=${comment_id}" >> "${GITHUB_OUTPUT}"


  host_worker_authorizer:
    # A fixed typed continuation of the same /host apply, not a second
    # public command. Before Git signer enrollment ONLY the existing VM
    # Worker may get the canonical Host authorization code. This cannot
    # create a VM, rotate A/B or touch the Windows Worker.
    needs: [host, host_report]
    if: >-
      needs.host.result == 'success' &&
      needs.host_report.result == 'success' &&
      (needs.host.outputs.operation == 'WORKER_AUTHORIZER_PREFLIGHT' ||
       needs.host.outputs.operation == 'APPLY_PREFLIGHT') &&
      needs.host.outputs.kind == 'VM' &&
      github.event_name == 'issue_comment' &&
      github.event.comment.body == format('/host apply {0}', needs.host.outputs.machine_id) &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    # Rust writes a closed, verified plan scalar. If this run upgraded Worker
    # bytes, native INSTALL MUST be a separate future /host apply operation.
    # Absent/invalid output fails closed at host_observe.
    outputs:
      source_upgrade_required: ${{ steps.plan.outputs.required }}
    env:
      TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      HOST_ORIGINAL_COMMAND: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact protected VM release and published owner
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          export ACCEPTED_REVISION="${GITHUB_SHA}"
          export OUTPUT_DIR="${RUNNER_TEMP}/host-worker-release"
          export REPOSITORY="${GITHUB_REPOSITORY}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          [[ "${EDGE_FLEET_REGISTRY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "${OUTPUT_DIR}/fleet-registry.pb" | cut -d' ' -f1)" = "${EDGE_FLEET_REGISTRY_SHA256}"
          bin="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${bin}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${bin}"
          echo "HOST_VM_WORKER_OWNER=${bin}" >> "${GITHUB_ENV}"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          echo "HOST_FLEET_REGISTRY=${OUTPUT_DIR}/fleet-registry.pb" >> "${GITHUB_ENV}"
          echo "HOST_FLEET_SHA256=${EDGE_FLEET_REGISTRY_SHA256}" >> "${GITHUB_ENV}"

      - name: Plan exact VM Worker release with GET only
        id: plan
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_CONTROL_TOKEN}" && test -n "${CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN}"
          # Complete GitHub records are transport evidence only: Rust owns
          # all operation-specific admission decisions.
          history="${RUNNER_TEMP}/vm-worker-begins.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/26/comments?per_page=100" | jq -s 'add' > "${history}"
          test -s "${history}" && test ! -L "${history}"
          export HOST_VM_WORKER_BEGIN_HISTORY_PATH="${history}"
          "${HOST_VM_WORKER_OWNER}" host \
            --hosts-pb "${HOST_FLEET_REGISTRY}" \
            --hosts-sha256 "${HOST_FLEET_SHA256}" \
            vm-worker-authorizer-upgrade "${TARGET_MACHINE}" --plan-only |
            tee "${RUNNER_TEMP}/host-vm-worker-plan.txt"
          # Rust emits only required=true/false after exact live GET validation.

      - name: Require exact Rust VM Worker plan decision
        shell: bash
        env:
          RUST_WORKER_PLAN_REQUIRED: ${{ steps.plan.outputs.required }}
        run: |
          set -euo pipefail
          case "${RUST_WORKER_PLAN_REQUIRED}" in
            true|false) ;;
            *) echo 'HOST_VM_WORKER_TYPED_DECISION_MISSING_OR_INVALID' >&2; exit 1 ;;
          esac

      - name: Reserve one durable VM Worker version transaction before mutation
        if: steps.plan.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          [[ "${TARGET_MACHINE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]
          [[ "${SOURCE_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${HOST_ORIGINAL_COMMAND}" = "/host apply ${TARGET_MACHINE}"
          # Prior BEGINs were checked by the Rust GET-only plan against the
          # original operator comment, completed owner job and Cloudflare
          # predecessor. Unknown/failed earlier outcomes remain NO_REPLAY.
          record="<!-- sing-box-vm-worker-authorizer-begin/v1 machine=${TARGET_MACHINE} comment=${SOURCE_COMMENT_ID} revision=${GITHUB_SHA} run=${GITHUB_RUN_ID} -->"
          reservation_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/26/comments" -f "body=${record}" --jq '.id')"
          [[ "${reservation_id}" =~ ^[1-9][0-9]*$ ]]
          stored="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${reservation_id}" --jq '.body')"
          test "${stored}" = "${record}"
          echo "host_vm_worker_durable_begin=EXACT_GITHUB_ISSUE26"

      - name: Apply exact VM Worker code once and verify immutable active version
        if: steps.plan.outputs.required == 'true'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
          # Protected Environment secret, consumed ONLY in the existing native
          # mutation owner AFTER the typed plan and durable GitHub BEGIN.
          # No local Vault, runner agent or extra service in the runtime path.
          EDGE_HOST_GITHUB_APP_PKCS8_BASE64: ${{ secrets.EDGE_HOST_GITHUB_APP_PKCS8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_CONTROL_TOKEN}" && test -n "${CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN}"
          "${HOST_VM_WORKER_OWNER}" host \
            --hosts-pb "${HOST_FLEET_REGISTRY}" \
            --hosts-sha256 "${HOST_FLEET_SHA256}" \
            vm-worker-authorizer-upgrade "${TARGET_MACHINE}" |
            tee "${RUNNER_TEMP}/host-vm-worker-result.txt"
          # Successful Rust completion includes exact active-source proof.
          {
            echo '### Canonical VM Worker authorizer code'
            echo '~~~text'
            cat "${RUNNER_TEMP}/host-vm-worker-result.txt"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Prepare one ephemeral VM signer with existing protected owner
        if: needs.host.outputs.operation == 'WORKER_AUTHORIZER_PREFLIGHT'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/host-vm-signer-private"
          pub="${RUNNER_TEMP}/host-vm-signer-public"
          test ! -e "${key}" && test ! -e "${pub}"
          "${HOST_VM_WORKER_OWNER}" host --hosts-pb "${HOST_FLEET_REGISTRY}" --hosts-sha256 "${HOST_FLEET_SHA256}" \
            vm-worker-signer-prepare "${TARGET_MACHINE}" --key-path "${key}" --public-path "${pub}" \
            | sed '/^host_vm_signer_public_key_hex=/d'
          test -s "${key}" && test -s "${pub}"
          chmod 0600 "${key}"
          [[ "$(cat "${pub}")" =~ ^[0-9a-f]{64}$ ]]

      - name: Reserve exact public-key Git draft before VM Worker mutation
        if: needs.host.outputs.operation == 'WORKER_AUTHORIZER_PREFLIGHT'
        shell: bash
        env:
          REGISTRATION_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "${HOST_ORIGINAL_COMMAND}" = "/host apply ${TARGET_MACHINE}"
          [[ "${TARGET_MACHINE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]
          [[ "${SOURCE_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          test -n "${REGISTRATION_TOKEN}"
          export GH_TOKEN="${REGISTRATION_TOKEN}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${GITHUB_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push')" = true
          branch="host-signer-${TARGET_MACHINE}-${SOURCE_COMMENT_ID}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/host-signer-${TARGET_MACHINE}-" --jq 'length')" = 0 ||
            { echo 'HOST_SIGNER_PRIOR_RESERVATION_NO_REPLAY' >&2; exit 1; }
          history="${RUNNER_TEMP}/host-signer-history.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/26/comments?per_page=100" | jq -s 'add' > "${history}"
          python3 - "${history}" "${TARGET_MACHINE}" <<'PY'
          import json, sys
          comments = json.load(open(sys.argv[1], encoding="utf-8"))
          assert isinstance(comments, list)
          prefix = "<!-- sing-box-vm-signer-begin/v1 machine=" + sys.argv[2] + " "
          if any(isinstance(c, dict) and isinstance(c.get("body"), str)
                 and c["body"].startswith(prefix) for c in comments):
              raise SystemExit("HOST_SIGNER_PRIOR_BEGIN_NO_REPLAY")
          PY
          public="$(cat "${RUNNER_TEMP}/host-vm-signer-public")"
          [[ "${public}" =~ ^[0-9a-f]{64}$ ]]
          candidate="${RUNNER_TEMP}/host-signer-candidate.pb"
          "${HOST_VM_WORKER_OWNER}" host --hosts-pb "${HOST_FLEET_REGISTRY}" --hosts-sha256 "${HOST_FLEET_SHA256}" \
            register-signer "${TARGET_MACHINE}" --signer-public-key-hex "${public}" --output-path "${candidate}" |
            tee "${RUNNER_TEMP}/host-signer-candidate-report.txt"
          buf="${RUNNER_TEMP}/host-signer-buf"
          curl --fail --silent --show-error --location "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64" -o "${buf}"
          echo "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1  ${buf}" | sha256sum --check --status
          chmod 0755 "${buf}"
          spec="${RUNNER_TEMP}/host-signer-candidate.textproto"
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState --from "${candidate}#format=binpb" --to "${spec}#format=txtpb")
          roundtrip="${RUNNER_TEMP}/host-signer-roundtrip.pb"
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState --from "${spec}#format=txtpb" --to "${roundtrip}#format=binpb")
          "${HOST_VM_WORKER_OWNER}" host --hosts-pb "${HOST_FLEET_REGISTRY}" --hosts-sha256 "${HOST_FLEET_SHA256}" \
            verify-signer "${TARGET_MACHINE}" --signer-public-key-hex "${public}" --candidate-path "${roundtrip}" |
            tee "${RUNNER_TEMP}/host-signer-verified-report.txt"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/heads/${branch}" -f "sha=${GITHUB_SHA}" >/dev/null
          original="$(gh api "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto?ref=${branch}" --jq '.sha')"
          encoded="$(base64 -w0 < "${spec}")"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto" \
            -f "branch=${branch}" -f "sha=${original}" \
            -f "message=host: reserve public VM signer" -f "content=${encoded}" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto?ref=${branch}" --jq '.content' |
            base64 --decode | cmp -s - "${spec}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f "head=${branch}" -f "base=main" -F draft=true \
            -f "title=host: pin public VM Worker signer for ${TARGET_MACHINE}" \
            -f "body=DRAFT PUBLIC ONLY. Origin issue #1 comment ${SOURCE_COMMENT_ID}. Worker secrets must be attested before protected merge. No VM CREATE or signed INSTALL." >/dev/null
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=iamaman11:${branch}" |
            jq -er --arg branch "${branch}" '[.[] | select(.head.ref == $branch and .base.ref == "main" and .head.repo.full_name == "iamaman11/sing-box")] | if length == 1 then .[0].number else error("HOST_PUBLIC_PR_NOT_EXACT") end')"
          [[ "${pr}" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.draft')" = true
          reservation="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
          [[ "${reservation}" =~ ^[0-9a-f]{40}$ ]]
          record="<!-- sing-box-vm-signer-begin/v1 machine=${TARGET_MACHINE} comment=${SOURCE_COMMENT_ID} revision=${GITHUB_SHA} run=${GITHUB_RUN_ID} branch=${branch} sha=${reservation} -->"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/26/comments" -f "body=${record}" >/dev/null
          echo "HOST_SIGNER_RESERVATION_SHA=${reservation}" >> "${GITHUB_ENV}"
          echo 'host_vm_signer=PROTECTED_PUBLIC_DRAFT_RESERVED_BEFORE_WRITE'

      - name: Install exactly five Host signer secret bindings once
        if: needs.host.outputs.operation == 'WORKER_AUTHORIZER_PREFLIGHT'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/host-vm-signer-private"
          pub="${RUNNER_TEMP}/host-vm-signer-public"
          trap 'rm -f "${key}"' EXIT
          test -n "${HOST_SIGNER_RESERVATION_SHA}"
          "${HOST_VM_WORKER_OWNER}" host --hosts-pb "${HOST_FLEET_REGISTRY}" --hosts-sha256 "${HOST_FLEET_SHA256}" \
            vm-worker-signer-commit "${TARGET_MACHINE}" --key-path "${key}" --public-path "${pub}" |
            tee "${RUNNER_TEMP}/host-signer-evidence.txt"
          # Exact Rust Result is the admission; printable diagnostics are not parsed.

      - name: Open reserved VM signer PR for protected review
        if: needs.host.outputs.operation == 'WORKER_AUTHORIZER_PREFLIGHT'
        shell: bash
        env:
          REGISTRATION_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${REGISTRATION_TOKEN}"
          branch="host-signer-${TARGET_MACHINE}-${SOURCE_COMMENT_ID}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${GITHUB_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')" = "${HOST_SIGNER_RESERVATION_SHA}"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=iamaman11:${branch}" |
            jq -er --arg branch "${branch}" '[.[] | select(.head.ref == $branch and .base.ref == "main" and .head.repo.full_name == "iamaman11/sing-box")] | if length == 1 then .[0].number else error("HOST_PUBLIC_PR_NOT_EXACT") end')"
          [[ "${pr}" =~ ^[1-9][0-9]*$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.draft')" = true
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" \
            -f "body=Five VM Host signer bindings active and read back, public key only in protected Git. Original /host apply issue #1 comment ${SOURCE_COMMENT_ID}, accepted revision ${GITHUB_SHA}. First-use Worker credentials and receipt still absent; signed INSTALL NOT authorized." >/dev/null
          node="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.node_id')"
          test -n "${node}"
          # Minimal single-purpose mutation: gh pr ready/view may ask for
          # read:org even though the scoped repository token owns this PR.
          # If readiness cannot be changed, leave the existing public-only
          # reservation in Draft; NEVER replay a completed provider write.
          if ! gh api graphql -f 'query=mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' -f "id=${node}" | jq -e '(.errors == null) and (.data.markPullRequestReadyForReview.pullRequest.isDraft == false)' >/dev/null; then
            echo 'HOST_PUBLIC_GIT_PR_REMAINS_DRAFT_REVIEW_REQUIRED'
          fi
          echo 'host_vm_signer=AWAITING_PROTECTED_PUBLIC_GIT_MERGE'

  host_capabilities:
    # Not another public command or native mutation path. The same exact
    # authorized /host status --deep may observe existing protected secrets
    # and provider GET endpoints without reading or printing their values.
    needs: [host, host_report]
    if: >-
      needs.host.result == 'success' &&
      needs.host_report.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.run_attempt == 1 &&
      github.event.comment.body == format('/host status {0} --deep', needs.host.outputs.machine_id) &&
      needs.host.outputs.kind == 'VM' &&
      (startsWith(needs.host.outputs.desired_spec_path, 'infra/application/') ||
       startsWith(needs.host.outputs.desired_spec_path, 'infra/hosts/specs/'))
    runs-on: ubuntu-24.04
    # Native and hosted evidence append to ONE operator comment. Serialize
    # read-modify-PATCH across both existing GitHub workflow jobs, not VM ops.
    concurrency:
      group: host-deep-report-${{ github.event.comment.id }}
      cancel-in-progress: false
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
      REPORT_COMMENT_ID: ${{ needs.host_report.outputs.comment_id }}
      OPERATION_ID: issue1-comment-${{ github.event.comment.id }}
      GIT_PHASE: ${{ needs.host.outputs.diagnostic_git_phase }}
      GIT_OWNER: ${{ needs.host.outputs.diagnostic_git_owner }}
      GIT_REASON: ${{ needs.host.outputs.diagnostic_git_reason }}
      GIT_LAST_PROVEN_STEP: ${{ needs.host.outputs.diagnostic_git_last_proven_step }}
      GIT_NEXT_ACTION: ${{ needs.host.outputs.diagnostic_git_next_action }}
      RELEASE_SET_SHA256: ${{ needs.host.outputs.diagnostic_release_set_sha256 }}
    steps:
      - name: Checkout exact protected main for bounded capability observation
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f infra/hosts/hosts.textproto
          test -f infra/vultr/application-acceptance.json
      - name: Verify exact new per-host Protobuf authority before provider GET
        shell: bash
        env:
          TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
          TARGET_DESIRED_SPEC: ${{ needs.host.outputs.desired_spec_path }}
        run: |
          set -euo pipefail
          case "${TARGET_DESIRED_SPEC}" in
            infra/application/*.json)
              # Existing legacy hosts have their historical validated JSON.
              test -f "${TARGET_DESIRED_SPEC}"
              ;;
            infra/hosts/specs/*.textproto)
              [[ "${TARGET_MACHINE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]
              test "${TARGET_DESIRED_SPEC}" = "infra/hosts/specs/${TARGET_MACHINE}.textproto"
              test -f "${TARGET_DESIRED_SPEC}" && test ! -L "${TARGET_DESIRED_SPEC}"
              bash edge-platform/scripts/compile_vm_host_desired.sh "${TARGET_MACHINE}"
              ;;
            *) echo 'HOST_CAPABILITY_TYPED_GIT_PATH_INVALID' >&2; exit 1 ;;
          esac

      - name: Observe protected credentials and provider access with GET only
        shell: bash
        env:
          TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
          TARGET_DESIRED_SPEC: ${{ needs.host.outputs.desired_spec_path }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_VM_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          CLOUDFLARE_VM_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
          IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
        run: |
          set -euo pipefail
          result="$(python3 edge-platform/scripts/host_capability_preflight.py "${TARGET_MACHINE}" "${TARGET_DESIRED_SPEC}")"
          # The probe returns closed enums, not provider payloads.
          python3 -c 'import json,sys; a=json.loads(sys.argv[1]); assert a["provider_mutations"] == a["worker_mutations"] == a["github_mutations"] == 0; assert a["scope"] == "READ_ONLY_PROTECTED_ENVIRONMENT"' "${result}"
          # Ephemeral same-job evidence, never a second desired source.
          printf '%s\n' "${result}" > "${RUNNER_TEMP}/host-capabilities.json"
          echo 'host_mutations=0'

      - name: Prove current Git-pinned VM credential through Worker Access GET only
        id: vm_credential
        # Any unavailable exact release or Worker route is a visible
        # UNPROVEN diagnostic, NEVER silent admission or CREATE.
        continue-on-error: true
        shell: bash
        env:
          TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
          HOST_ORIGINAL_COMMAND: ${{ github.event.comment.body }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-credential-readonly
        run: |
          set -euo pipefail
          # The pinned, hidden Rust GET-only proof derives its candidate from
          # the accepted Git registry, NOT shell literals or an SSH response.
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          bin="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          fleet="${OUTPUT_DIR}/fleet-registry.pb"
          printf '%s  %s\n' "${EDGE_ORCHESTRATOR_SHA256}" "${bin}" | sha256sum --check --status
          chmod 0755 "${bin}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          if "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            vm-credential-proof "${TARGET_MACHINE}" \
            > "${RUNNER_TEMP}/vm-credential-readonly.out" \
            2> "${RUNNER_TEMP}/vm-credential-readonly.err"; then
            # All successful stdout values are public source identity only.
            cat "${RUNNER_TEMP}/vm-credential-readonly.out"
            echo host_vm_worker_live_source=GIT_PIN_EXACT_ACCESS_GET_PROVEN
            echo 'status=GIT_PIN_EXACT_ACCESS_GET_PROVEN' >> "${GITHUB_OUTPUT}"
          else
            # Do not fail ordinary /host status, but never claim admission;
            # never disclose raw HTTP bodies or secret-bearing diagnostics.
            reason="$(tail -n 1 "${RUNNER_TEMP}/vm-credential-readonly.err" | tr -d '\r\n')"
            [[ "${reason}" =~ ^[A-Z][A-Z0-9_]{3,119}$ ]] || reason=UNCLASSIFIED_GET_FAILURE
            echo "host_vm_worker_live_source=BLOCKED"
            echo 'status=BLOCKED' >> "${GITHUB_OUTPUT}"
            echo "host_vm_worker_live_reason=${reason}"
          fi
          echo host_worker_mutations=0
          echo host_provider_mutations=0


      - name: Publish one correlated deep diagnosis to original /host report
        shell: bash
        env:
          VM_BUNDLE_STATUS: ${{ steps.vm_credential.outputs.status || 'UNPROVEN_WORKER_PROOF_STEP_FAILED' }}
        run: |
          set -euo pipefail
          [[ "${REPORT_COMMENT_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "${OPERATION_ID}" =~ ^issue1-comment-[1-9][0-9]{0,19}$ ]]
          case "${VM_BUNDLE_STATUS}" in
            GIT_PIN_EXACT_ACCESS_GET_PROVEN|BLOCKED|UNPROVEN_WORKER_PROOF_STEP_FAILED) ;;
            *) echo HOST_DIAGNOSTIC_WORKER_PROOF_INVALID >&2; exit 1 ;;
          esac
          diagnostic="$(python3 edge-platform/scripts/host_diagnostic_summary.py \
            < "${RUNNER_TEMP}/host-capabilities.json")"
          # Reject any accidental sensitive material or false acceptance.
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["schema"] == "sing-box.host-diagnostic/v1"; assert d["mutation_authorized"] is False and d["physical_accepted"] is False and d["replay_allowed"] is False; assert d["provider_mutations"] == d["worker_mutations"] == d["github_mutations"] == 0' "${diagnostic}"
          {
            echo '### Unified deep host diagnosis (Git + provider GET + Worker + runner)'
            echo '~~~json'
            printf '%s\n' "${diagnostic}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
          # Reuse the one immediate report comment; no second diagnostic
          # thread, no duplicate state store and no new operator command.
          original="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${REPORT_COMMENT_ID}" --jq '.body')"
          (( ${#original} > 0 && ${#original} < 16000 ))
          appendix="$(printf '\n\n### Unified deep diagnosis — read only\n\n```json\n%s\n```\n\nSigned native receipt: **UNPROVEN** until the existing runner returns an independently verified root result.\n' "${diagnostic}")"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${REPORT_COMMENT_ID}" \
            -f "body=${original}${appendix}" >/dev/null
          echo HOST_DIAGNOSTIC=CORRELATED_ONE_REPORT_NO_MUTATION
  host_first_use:
    # Sole hosted CREATE owner; no SSH, no new service or runner root rights.
    needs: [host, host_report]
    if: >-
      needs.host.result == 'success' &&
      needs.host_report.result == 'success' &&
      needs.host.outputs.operation == 'FIRST_USE_PREFLIGHT' &&
      needs.host.outputs.kind == 'VM' &&
      github.event_name == 'issue_comment' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      GH_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
    steps:
      - name: Fetch exact accepted Git and native release
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash edge-platform/scripts/compile_vm_host_desired.sh "${TARGET_MACHINE}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          for part in fleet-registry.pb edge-orchestrator-linux-amd64 edge-agent-linux-amd64; do
            test -s "${OUTPUT_DIR}/${part}"
          done
          echo "${EDGE_ORCHESTRATOR_SHA256}  ${OUTPUT_DIR}/edge-orchestrator-linux-amd64" | sha256sum --check --status
          echo "${EDGE_AGENT_SHA256}  ${OUTPUT_DIR}/edge-agent-linux-amd64" | sha256sum --check --status
          chmod 0755 "${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Prove one empty VM, pinned Worker signer and Access GET without mutations
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/host-release/edge-orchestrator-linux-amd64"
          fleet="${RUNNER_TEMP}/host-release/fleet-registry.pb"
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            first-use-preflight "${TARGET_MACHINE}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${GITHUB_SHA}"
          test "${GITHUB_RUN_ATTEMPT}" = 1

      - name: Reserve unique Git receipt PR and durable BEGIN BEFORE VM CREATE
        id: begin
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${TARGET_MACHINE}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
          test -n "${GH_TOKEN}"
          main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${main}" = "${GITHUB_SHA}"
          # No previous receipt branch may represent an unknown earlier
          # first-use for the SAME VM epoch.
          previous="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/host-receipt-${TARGET_MACHINE}-")"
          test "$(jq 'length' <<< "${previous}")" = 0 || {
            echo HOST_FIRST_USE_PREVIOUS_BRANCH_NO_REPLAY >&2
            exit 1
          }
          name="sing-box-production-${TARGET_MACHINE}"
          runners="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100")"
          jq -e --arg name "${name}" '(.total_count <= 100) and all(.runners[]; .name != $name)' <<< "${runners}" >/dev/null || {
            echo HOST_FIRST_USE_RUNNER_NAME_ALREADY_REGISTERED_NO_REPLAY >&2
            exit 1
          }
          branch="host-receipt-${TARGET_MACHINE}-${SOURCE_COMMENT_ID}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${main}" >/dev/null
          old="$(gh api "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto?ref=${main}" --jq '.sha')"
          printf '\n# native-receipt-registration-pending %s issue1-comment-%s\n' "${TARGET_MACHINE}" "${SOURCE_COMMENT_ID}" > "${RUNNER_TEMP}/receipt-reservation.txt"
          cat infra/hosts/hosts.textproto "${RUNNER_TEMP}/receipt-reservation.txt" > "${RUNNER_TEMP}/receipt-reserved.textproto"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto" \
            -f "branch=${branch}" -f "sha=${old}" \
            -f "message=host: reserve native receipt for ${TARGET_MACHINE}" \
            -f "content=$(base64 -w0 < "${RUNNER_TEMP}/receipt-reserved.textproto")" >/dev/null
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
            -f "head=${branch}" -f base=main -F draft=true \
            -f "title=host: register native receipt for ${TARGET_MACHINE}" \
            -f "body=ONE-TIME BEGIN. Original authorized issue #1 comment ${SOURCE_COMMENT_ID}; accepted source ${main}. UNKNOWN_NO_REPLAY after provider request. First-use public root key and user-data scrub not yet proven." >/dev/null
          begin="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/26/comments" \
            -f "body=HOST_NATIVE_FIRST_USE_BEGIN_V1 machine=${TARGET_MACHINE} issue1_comment=${SOURCE_COMMENT_ID} revision=${main} run=${GITHUB_RUN_ID} attempt=1 no_replay=true" --jq '.id')"
          [[ "${begin}" =~ ^[1-9][0-9]*$ ]]
          echo "EDGE_HOST_BEGIN_COMMENT_ID=${begin}" >> "${GITHUB_ENV}"
          echo "begin_id=${begin}" >> "${GITHUB_OUTPUT}"
          echo HOST_FIRST_USE_DURABLE_BEGIN_RECORDED

      - name: Get one short-lived GitHub runner registration capability
        shell: bash
        run: |
          set -euo pipefail
          if ! result="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" 2>/dev/null)"; then
            echo HOST_FIRST_USE_RUNNER_REGISTRATION_API_DENIED_NO_CREATE >&2
            exit 1
          fi
          if ! token="$(jq -er '.token | select(type=="string")' <<< "${result}")" ||
             ! expiry="$(jq -er '.expires_at | select(type=="string")' <<< "${result}")"; then
            echo HOST_FIRST_USE_RUNNER_REGISTRATION_SCHEMA_INVALID_NO_CREATE >&2
            exit 1
          fi
          echo "::add-mask::${token}"
          deadline="$(date -u -d "${expiry}" +%s)"
          now="$(date -u +%s)"
          ((deadline >= now + 1200 && deadline <= now + 3600)) || {
            echo HOST_FIRST_USE_RUNNER_TOKEN_TTL_INVALID_NO_REPLAY >&2
            exit 1
          }
          # GitHub registration tokens are opaque; the official REST example
          # has 29 characters. Never invent a minimum token length.
          [[ "${token}" =~ ^[A-Za-z0-9._-]{1,512}$ ]] || {
            echo HOST_FIRST_USE_RUNNER_TOKEN_UNSAFE_SYNTAX_NO_CREATE >&2
            exit 1
          }
          echo "EDGE_HOST_RUNNER_REGISTRATION_TOKEN=${token}" >> "${GITHUB_ENV}"
          echo "EDGE_HOST_RUNNER_TOKEN_EXPIRY_UNIX=${deadline}" >> "${GITHUB_ENV}"

      - name: Execute exactly one no-SSH native Vultr CREATE
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/host-release/edge-orchestrator-linux-amd64"
          fleet="${RUNNER_TEMP}/host-release/fleet-registry.pb"
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            first-use "${TARGET_MACHINE}" \
            --installer-path edge-platform/scripts/install-vultr-production-runner.sh \
            --agent-path "${RUNNER_TEMP}/host-release/edge-agent-linux-amd64"
          echo HOST_FIRST_USE_CREATE_ONCE_NO_AUTOMATIC_REPLAY

  host_first_use_native_proof:
    needs: [host, host_first_use]
    if: needs.host_first_use.result == 'success'
    runs-on: ${{ fromJSON(needs.host.outputs.runner_labels) }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
    steps:
      - name: Collect signed public-only proof from exact new VM Root Agent
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_MACHINE}"
          owner=/usr/local/libexec/sing-box/edge-agent
          test "$(stat -c '%u:%g:%a' "${owner}")" = '0:0:755'
          sudo -n "${owner}" local host-bootstrap-proof > "${RUNNER_TEMP}/bootstrap-root-proof.pb"
          size="$(stat -c '%s' "${RUNNER_TEMP}/bootstrap-root-proof.pb")"
          ((size > 64 && size <= 512))
          echo HOST_FIRST_USE_NATIVE_PROOF=SIGNED_PUBLIC_ONLY_NOT_PROVIDER_ATTESTATION

      - uses: actions/upload-artifact@v4
        with:
          name: native-first-use-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/bootstrap-root-proof.pb
          if-no-files-found: error
          retention-days: 3

  host_first_use_finalize:
    needs: [host, host_first_use, host_first_use_native_proof]
    if: needs.host_first_use_native_proof.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      GH_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-first-use-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/native-public-proof

      - name: Verify signed root proof and scrub provider user-data with GET
        id: proof
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          echo "${EDGE_ORCHESTRATOR_SHA256}  ${OUTPUT_DIR}/edge-orchestrator-linux-amd64" | sha256sum --check --status
          chmod 0755 "${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          fleet="${OUTPUT_DIR}/fleet-registry.pb"
          bin="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            bootstrap-proof-check "${TARGET_MACHINE}" \
            --proof-path "${RUNNER_TEMP}/native-public-proof/bootstrap-root-proof.pb" \
            > "${RUNNER_TEMP}/public-proof-check.txt"
          cat "${RUNNER_TEMP}/public-proof-check.txt"
          public="$(sed -n 's/^bootstrap_native_receipt_public_key_hex=//p' "${RUNNER_TEMP}/public-proof-check.txt")"
          [[ "${public}" =~ ^[0-9a-f]{64}$ ]]
          echo "PUBLIC_ROOT_KEY_HEX=${public}" >> "${GITHUB_ENV}"
          # The private runner token was stored at the provider. A verified
          # GET/PATCH/GET scrub is mandatory before publishing the receipt PR.
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            first-use-scrub "${TARGET_MACHINE}"

      - name: Complete ONLY the reserved protected public receipt PR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${GITHUB_SHA}"
          [[ "${SOURCE_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          branch="host-receipt-${TARGET_MACHINE}-${SOURCE_COMMENT_ID}"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=iamaman11:${branch}" |
            jq -er --arg branch "${branch}" '[.[] | select(.head.ref == $branch and .base.ref == "main" and .head.repo.full_name == "iamaman11/sing-box" and .draft == true)] | if length == 1 then .[0].number else empty end')"
          [[ "${pr}" =~ ^[1-9][0-9]*$ ]]
          bin="${RUNNER_TEMP}/host-release/edge-orchestrator-linux-amd64"
          fleet="${RUNNER_TEMP}/host-release/fleet-registry.pb"
          candidate="${RUNNER_TEMP}/native-receipt-registration.pb"
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            register-receipt "${TARGET_MACHINE}" \
            --receipt-public-key-hex "${PUBLIC_ROOT_KEY_HEX}" \
            --output-path "${candidate}"
          buf="${RUNNER_TEMP}/buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64" -o "${buf}"
          printf '%s  %s\n' '8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1' "${buf}" | sha256sum --check --status
          chmod 0755 "${buf}"
          target="${RUNNER_TEMP}/native-registered-hosts.textproto"
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "${candidate}#format=binpb" --to "${target}#format=txtpb")
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "${target}#format=txtpb" \
            --to "${RUNNER_TEMP}/registered-roundtrip.pb#format=binpb")
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            verify-receipt "${TARGET_MACHINE}" \
            --receipt-public-key-hex "${PUBLIC_ROOT_KEY_HEX}" \
            --candidate-path "${RUNNER_TEMP}/registered-roundtrip.pb"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto?ref=${branch}" --jq '.sha')"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto" \
            -f "branch=${branch}" -f "sha=${sha}" \
            -f "message=host: register native receipt for ${TARGET_MACHINE}" \
            -f "content=$(base64 -w0 < "${target}")" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto?ref=${branch}" \
            --jq '.content' | base64 --decode | cmp -s - "${target}"
          node="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.node_id')"
          test -n "${node}"
          if ! gh api graphql -f 'query=mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' -f "id=${node}" |
              jq -e '(.errors == null) and (.data.markPullRequestReadyForReview.pullRequest.isDraft == false)' >/dev/null; then
            echo HOST_NATIVE_RECEIPT_DRAFT_REVIEW_REQUIRED
          fi
          echo "HOST_FIRST_USE=AWAITING_PROTECTED_PUBLIC_RECEIPT_MERGE"
          echo "HOST_SIGNED_INSTALL=NOT_YET_AUTHORIZED"

  host_first_use_abort:
    # The existing /host recover may retire ONLY a proven PRE-CREATE
    # failed reservation. It never retries first-use or touches Vultr.
    needs: [host, host_report]
    if: >-
      needs.host.result == 'success' &&
      needs.host_report.result == 'success' &&
      needs.host.outputs.kind == 'VM' &&
      needs.host.outputs.operation == 'FIRST_USE_ABORT_PREFLIGHT' &&
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
      issues: read
    env:
      TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      GITHUB_ACTOR_ID: ${{ github.actor_id }}
      GH_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
    steps:
      - name: Resolve exact protected main and immutable native provider
        shell: bash
        env:
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash edge-platform/scripts/compile_vm_host_desired.sh "${TARGET_MACHINE}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          echo "${EDGE_ORCHESTRATOR_SHA256}  ${OUTPUT_DIR}/edge-orchestrator-linux-amd64" | sha256sum --check --status
          chmod 0755 "${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Classify pre-CREATE abort or existing VM, without mutation
        id: phase
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/host-release/edge-orchestrator-linux-amd64"
          fleet="${RUNNER_TEMP}/host-release/fleet-registry.pb"
          bin_proof="${RUNNER_TEMP}/host-abort-preflight.txt"
          if "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            first-use-preflight "${TARGET_MACHINE}" > "${bin_proof}" 2>/dev/null; then
            grep -Fxq 'host_first_use_provider_plan=EXACT_CREATE_ONLY' "${bin_proof}"
            grep -Fxq 'host_first_use_preflight=PROVIDER_AND_WORKER_GET_PROVEN' "${bin_proof}"
            echo 'phase=PRECREATE' >> "${GITHUB_OUTPUT}"
            echo "HOST_ABORT_PROVIDER_PROOF=COMPLETE_TYPED_CREATE_PLAN_NO_MUTATION"
          else
            # This is NOT evidence of a VM: exact completed original CREATE,
            # runner proof and provider ownership must be independently proven
            # before the POST-CREATE branch can take ANY action.
            echo 'phase=POSTCREATE_UNPROVEN' >> "${GITHUB_OUTPUT}"
            echo 'HOST_FIRST_USE_POSTCREATE_PROOF_REQUIRED'
          fi

      - name: Retire only exact aborted GitHub first-use reservation
        if: steps.phase.outputs.phase == 'PRECREATE'
        shell: bash
        env:
          PROVIDER_PREFLIGHT_PROOF: ${{ runner.temp }}/host-abort-preflight.txt
        run: |
          set -euo pipefail
          python3 -B edge-platform/scripts/host_first_use_abort.py

      - name: Verify exact original first-use proof producer and reserved PR
        id: original
        if: steps.phase.outputs.phase == 'POSTCREATE_UNPROVEN'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B edge-platform/scripts/host_first_use_finalize_resume.py \
            --preflight --github-output "${GITHUB_OUTPUT}"

      - name: Download ONLY original native root proof
        if: steps.original.outputs.original_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.original.outputs.original_run }}
          name: native-first-use-proof-${{ steps.original.outputs.original_run }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          path: ${{ runner.temp }}/native-public-proof

      - name: Verify original release-bound root proof and scrub only owned VM
        if: steps.original.outputs.original_run != ''
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          ORIGINAL_SHA: ${{ steps.original.outputs.original_sha }}
          ORIGINAL_COMMENT: ${{ steps.original.outputs.original_comment }}
        run: |
          set -euo pipefail
          proof="${RUNNER_TEMP}/native-public-proof/bootstrap-root-proof.pb"
          test -f "${proof}" && test ! -L "${proof}"
          (( $(stat -c %s "${proof}") > 64 && $(stat -c %s "${proof}") <= 512 ))
          test "${ORIGINAL_SHA}" != "${GITHUB_SHA}"
          # Bind the immutable original Root proof to its ORIGINAL ReleaseSet,
          # not the newer main that introduced this recovery workflow.
          cp edge-platform/scripts/host_first_use_receipt_register.sh \
            "${RUNNER_TEMP}/host-recovery-register-receipt.sh"
          git fetch -q --no-tags --depth=1 origin "${ORIGINAL_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ORIGINAL_SHA}"
          export ACCEPTED_REVISION="${ORIGINAL_SHA}"
          export OUTPUT_DIR="${RUNNER_TEMP}/host-original-release"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${ORIGINAL_SHA}"
          bin="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          fleet="${OUTPUT_DIR}/fleet-registry.pb"
          echo "${EDGE_ORCHESTRATOR_SHA256}  ${bin}" | sha256sum --check --status
          chmod 0755 "${bin}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            bootstrap-proof-check "${TARGET_MACHINE}" \
            --proof-path "${proof}" > "${RUNNER_TEMP}/public-proof-check.txt"
          grep -Fxq 'bootstrap_proof=SELF_SIGNED_NOT_PROVIDER_ATTESTATION' "${RUNNER_TEMP}/public-proof-check.txt"
          public="$(sed -n 's/^bootstrap_native_receipt_public_key_hex=//p' "${RUNNER_TEMP}/public-proof-check.txt")"
          [[ "${public}" =~ ^[0-9a-f]{64}$ ]]
          echo "PUBLIC_ROOT_KEY_HEX=${public}" >> "${GITHUB_ENV}"
          # Native typed GET/PATCH/GET must prove exactly one owned instance
          # and its user-data scrub. No CREATE, SSH, retries or bypass.
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            first-use-scrub "${TARGET_MACHINE}"
          echo 'HOST_FIRST_USE_RECOVERY=SIGNED_ROOT_PROOF_AND_SCRUB_PROVEN'

      - name: Resume ONLY original protected receipt registration
        if: steps.original.outputs.original_run != ''
        shell: bash
        env:
          ORIGINAL_COMMENT: ${{ steps.original.outputs.original_comment }}
          ORIGINAL_BRANCH: ${{ steps.original.outputs.original_branch }}
        run: |
          set -euo pipefail
          # Reuse the existing exact receipt registration algorithm, but
          # require the reserved ORIGINAL branch, not this recovery comment.
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${GITHUB_SHA}"
          test "${ORIGINAL_BRANCH}" = "host-receipt-${TARGET_MACHINE}-${ORIGINAL_COMMENT}"
          bin="${RUNNER_TEMP}/host-original-release/edge-orchestrator-linux-amd64"
          fleet="${RUNNER_TEMP}/host-original-release/fleet-registry.pb"
          export EDGE_RELEASE_CONTEXT_PATH="${RUNNER_TEMP}/host-original-release/resolved.env"
          export SOURCE_COMMENT_ID="${ORIGINAL_COMMENT}"
          export PUBLIC_ROOT_KEY_HEX
          bash "${RUNNER_TEMP}/host-recovery-register-receipt.sh"

  host_resume_receipt:
    # The prior /host apply may continue only after its exact registration PR
    # was merged through main protection AND main CI/promotion succeeded.
    # All other successful CI events perform no VM mutation.
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'iamaman11/sing-box' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'iamaman11/sing-box' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      machine_id: ${{ steps.source.outputs.machine_id }}
      comment_id: ${{ steps.source.outputs.comment_id }}
      owner: ${{ steps.prepare.outputs.owner }}
      kind: ${{ steps.prepare.outputs.kind }}
      runner_labels: ${{ steps.prepare.outputs.runner_labels }}
      operation: ${{ steps.prepare.outputs.operation }}
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Prove one protected receipt merge and original operator authorization
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "${ACCEPTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${ACCEPTED_SHA}"
          release_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}")"
          test "$(jq -r '.head_sha' <<<"${release_run}")" = "${ACCEPTED_SHA}"
          test "$(jq -r '.conclusion' <<<"${release_run}")" = success
          associated="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ACCEPTED_SHA}/pulls?per_page=20")"
          receipt_pr="$(jq -cr --arg accepted "${ACCEPTED_SHA}" '
            [.[] | select(.merged_at != null and .base.ref == "main"
                        and .merge_commit_sha == $accepted)]
            | if length == 1 then .[0] else empty end
          ' <<<"${associated}")"
          if [[ -z "${receipt_pr}" ]]; then
            echo 'host_resume=NOT_A_PROTECTED_PR_MERGE'
            exit 0
          fi
          branch="$(jq -r '.head.ref' <<<"${receipt_pr}")"
          if [[ "${branch}" != host-receipt-* ]]; then
            echo 'host_resume=NOT_A_RECEIPT_REGISTRATION'
            exit 0
          fi
          if ! [[ "${branch}" =~ ^host-receipt-([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})-([1-9][0-9]*)$ ]]; then
            echo 'HOST_RECEIPT_MERGE_BRANCH_INVALID' >&2
            exit 1
          fi
          machine="${BASH_REMATCH[1]}"
          comment="${BASH_REMATCH[2]}"
          test "$(jq -r '.head.repo.full_name' <<<"${receipt_pr}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -r '.draft' <<<"${receipt_pr}")" = false
          test "$(jq -r '.title' <<<"${receipt_pr}")" = "host: register native receipt for ${machine}"
          source_comment="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}")"
          test "$(jq -r '.issue_url' <<<"${source_comment}")" = "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/1"
          test "$(jq -r '.user.id' <<<"${source_comment}")" = 44100369
          test "$(jq -r '.body' <<<"${source_comment}")" = "/host apply ${machine}"
          echo "machine_id=${machine}" >> "${GITHUB_OUTPUT}"
          echo "comment_id=${comment}" >> "${GITHUB_OUTPUT}"

      - name: Resolve published exact root owner and verify one-field Git merge
        if: steps.source.outputs.machine_id != ''
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.event.workflow_run.head_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-resume-release
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=2 origin "${ACCEPTED_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ACCEPTED_SHA}"
          test "$(git show -s --format=%P "${ACCEPTED_SHA}" | wc -w)" = 2
          prior="$(git rev-parse "${ACCEPTED_SHA}^1")"
          test "$(git diff --name-only "${prior}" "${ACCEPTED_SHA}")" = "infra/hosts/hosts.textproto"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${ACCEPTED_SHA}"
          bin="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          echo "${EDGE_ORCHESTRATOR_SHA256}  ${bin}" | sha256sum --check --status
          chmod 0755 "${bin}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          buf="${RUNNER_TEMP}/host-resume-buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64" -o "${buf}"
          echo "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1  ${buf}" | sha256sum --check --status
          chmod 0755 "${buf}"
          git show "${prior}:infra/hosts/hosts.textproto" > "${RUNNER_TEMP}/previous-hosts.textproto"
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "${RUNNER_TEMP}/previous-hosts.textproto#format=txtpb" \
            --to "${RUNNER_TEMP}/previous-hosts.pb#format=binpb")
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "../infra/hosts/hosts.textproto#format=txtpb" \
            --to "${RUNNER_TEMP}/current-hosts.pb#format=binpb")
          cmp -s "${OUTPUT_DIR}/fleet-registry.pb" "${RUNNER_TEMP}/current-hosts.pb"
          "${bin}" host \
            --hosts-pb "${RUNNER_TEMP}/current-hosts.pb" \
            --hosts-sha256 "$(sha256sum "${RUNNER_TEMP}/current-hosts.pb" | cut -d' ' -f1)" \
            verify-merged-receipt "${{ steps.source.outputs.machine_id }}" \
            --previous-path "${RUNNER_TEMP}/previous-hosts.pb" \
            | tee "${RUNNER_TEMP}/host-receipt-merge-proof.txt"

      - name: Prepare one fresh signed native intent under original operator scope
        id: prepare
        if: steps.source.outputs.machine_id != ''
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/host-resume-release/edge-orchestrator-linux-amd64"
          registry="${RUNNER_TEMP}/host-resume-release/fleet-registry.pb"
          "${bin}" host \
            --hosts-pb "${registry}" \
            --hosts-sha256 "$(sha256sum "${registry}" | cut -d' ' -f1)" \
            --github-output "${GITHUB_OUTPUT}" \
            --source-comment-id "${{ steps.source.outputs.comment_id }}" \
            --intent-output "${RUNNER_TEMP}/host-intent.pb" \
            apply "${{ steps.source.outputs.machine_id }}" \
            | tee "${RUNNER_TEMP}/host-resume-prepared.txt"
          test -s "${RUNNER_TEMP}/host-intent.pb"
          test -s "${RUNNER_TEMP}/host-intent.receipt.pb"

      - name: Transfer only typed prepared intent to installed native owner
        if: steps.prepare.outputs.operation == 'APPLY_PREFLIGHT'
        uses: actions/upload-artifact@v4
        with:
          name: host-intent-${{ steps.source.outputs.comment_id }}
          path: |
            ${{ runner.temp }}/host-intent.pb
            ${{ runner.temp }}/host-intent.receipt.pb
          if-no-files-found: error
          retention-days: 7

  host_resume_native_bootstrap:
    # First receive the protected public receipt, then refresh the exact
    # root trust snapshot WITHOUT resource replay and return fresh proof.
    needs: host_resume_receipt
    if: >-
      needs.host_resume_receipt.result == 'success' &&
      needs.host_resume_receipt.outputs.operation == 'APPLY_PREFLIGHT' &&
      needs.host_resume_receipt.outputs.kind == 'VM'
    runs-on: ${{ fromJSON(needs.host_resume_receipt.outputs.runner_labels) }}
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    env:
      TARGET_MACHINE: ${{ needs.host_resume_receipt.outputs.machine_id }}
    steps:
      - name: Refresh only native code/trust and sign fresh public recipient
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_MACHINE}"
          owner=/usr/local/libexec/sing-box/edge-agent
          sudo -n "${owner}" local host-refresh
          sudo -n "${owner}" local host-bootstrap-proof > "${RUNNER_TEMP}/bootstrap-root-proof.pb"
          size="$(stat -c '%s' "${RUNNER_TEMP}/bootstrap-root-proof.pb")"
          ((size > 64 && size <= 512))
          echo BOOTSTRAP_PROOF=ROOT_SIGNED_PUBLIC_ONLY

      - uses: actions/upload-artifact@v4
        with:
          name: native-enrolled-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/bootstrap-root-proof.pb
          if-no-files-found: error
          retention-days: 3

  host_resume_seal:
    # Plaintext Access identity exists only in this GitHub-hosted protected
    # job and in the VM Root Agent after decryption. Never in runner secrets,
    # Vultr user-data, Git, issue comments or logs.
    needs: [host_resume_receipt, host_resume_native_bootstrap]
    if: needs.host_resume_native_bootstrap.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      TARGET_MACHINE: ${{ needs.host_resume_receipt.outputs.machine_id }}
      ACCESS_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
      ACCESS_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-enrolled-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/native-root-proof

      - name: Encrypt exact Git-pinned Worker Access identity for native Root Agent
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.event.workflow_run.head_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
        run: |
          set -euo pipefail
          test -n "${ACCESS_ID}" && test -n "${ACCESS_SECRET}"
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ACCEPTED_REVISION}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${ACCEPTED_REVISION}"
          bin="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          printf '%s  %s\n' "${EDGE_ORCHESTRATOR_SHA256}" "${bin}" | sha256sum --check --status
          chmod 0755 "${bin}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          fleet="${OUTPUT_DIR}/fleet-registry.pb"
          # Shell builtin printf writes directly to hosted orchestrator stdin.
          # No GH artifact or runner environment ever contains clear bytes.
          printf 'CF_ACCESS_CLIENT_ID=%s\nCF_ACCESS_CLIENT_SECRET=%s\n' \
            "${ACCESS_ID}" "${ACCESS_SECRET}" | \
            "${bin}" host --hosts-pb "${fleet}" \
              --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
              bootstrap-seal "${TARGET_MACHINE}" \
              --proof-path "${RUNNER_TEMP}/native-root-proof/bootstrap-root-proof.pb" \
              --output-path "${RUNNER_TEMP}/native-access-encrypted.pb"
          test -s "${RUNNER_TEMP}/native-access-encrypted.pb"

      - uses: actions/upload-artifact@v4
        with:
          name: native-sealed-access-${{ github.run_id }}
          path: ${{ runner.temp }}/native-access-encrypted.pb
          if-no-files-found: error
          retention-days: 1

  host_resume_native_access:
    needs: [host_resume_receipt, host_resume_seal]
    if: needs.host_resume_seal.result == 'success'
    runs-on: ${{ fromJSON(needs.host_resume_receipt.outputs.runner_labels) }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      TARGET_MACHINE: ${{ needs.host_resume_receipt.outputs.machine_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-sealed-access-${{ github.run_id }}
          path: ${{ runner.temp }}/native-sealed-access

      - name: Root-only decrypt, real Cloudflare Access GET, one-shot commit
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_MACHINE}"
          owner=/usr/local/libexec/sing-box/edge-agent
          envelope="${RUNNER_TEMP}/native-sealed-access/native-access-encrypted.pb"
          test -f "${envelope}" && test ! -L "${envelope}"
          size="$(stat -c '%s' "${envelope}")"
          ((size > 80 && size <= 4096))
          sudo -n "${owner}" local host-bootstrap-access < "${envelope}" \
            > "${RUNNER_TEMP}/bootstrap-access-result.txt"
          grep -Fxq 'bootstrap_access=ROOT_ONLY_INSTALLED_WORKER_GET_PROVEN' "${RUNNER_TEMP}/bootstrap-access-result.txt"
          grep -Fxq 'bootstrap_replay_allowed=false' "${RUNNER_TEMP}/bootstrap-access-result.txt"
          echo BOOTSTRAP_ACCESS=ROOT_LOCAL_GET_PROVEN_SIGNED_INSTALL_PENDING

  host_resume_native:
    # Existing reusable root runner is transport only. Fresh Worker signature
    # and the native root journal still gate mutation after the protected merge.
    needs: [host_resume_receipt, host_resume_native_access]
    if: >-
      needs.host_resume_receipt.result == 'success' &&
      needs.host_resume_native_access.result == 'success' &&
      needs.host_resume_receipt.outputs.operation == 'APPLY_PREFLIGHT' &&
      needs.host_resume_receipt.outputs.kind == 'VM'
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/host-native-observe.yml
    with:
      machine_id: ${{ needs.host_resume_receipt.outputs.machine_id }}
      kind: VM
      owner: ${{ needs.host_resume_receipt.outputs.owner }}
      runner_labels: ${{ needs.host_resume_receipt.outputs.runner_labels }}
      operation: ${{ needs.host_resume_receipt.outputs.operation }}
      command_body: ${{ format('/host apply {0}', needs.host_resume_receipt.outputs.machine_id) }}
      source_comment_id: ${{ needs.host_resume_receipt.outputs.comment_id }}
