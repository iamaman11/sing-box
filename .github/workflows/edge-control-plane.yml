name: Edge Control Plane
run-name: ${{ startsWith(github.event.comment.body, '/') && github.event.comment.body || 'Edge Control Plane — NO_COMMAND' }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  application:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (startsWith(github.event.comment.body, '/application ') ||
       startsWith(github.event.comment.body, '/vm '))
    uses: ./.github/workflows/vm-application-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  production:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/production ')
    uses: ./.github/workflows/vm-application-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  credentials:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/credentials ')
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/credential-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  host:
    # One Rust-owned host lifecycle entry point. GitHub authorizes the caller;
    # existing release identity and typed protobuf identify the exact hosts.
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (github.event.comment.body == '/host status' ||
       startsWith(github.event.comment.body, '/host status ') ||
       startsWith(github.event.comment.body, '/host apply ') ||
       startsWith(github.event.comment.body, '/host recover '))
    outputs:
      kind: ${{ steps.observe.outputs.kind }}
      owner: ${{ steps.observe.outputs.owner }}
      runner_labels: ${{ steps.observe.outputs.runner_labels }}
      machine_id: ${{ steps.observe.outputs.machine_id }}
      desired_spec_path: ${{ steps.observe.outputs.desired_spec_path }}
      operation: ${{ steps.observe.outputs.operation }}
      windows_runner_label: ${{ steps.observe.outputs.windows_runner_label }}
      admitted_at_unix: ${{ steps.observe.outputs.admitted_at_unix }}
      host_matrix: ${{ steps.observe.outputs.host_matrix }}
      host_targets_present: ${{ steps.observe.outputs.host_targets_present }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      COMMAND_BODY: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
      BUF_VERSION: "1.73.0"
      BUF_LINUX_X86_64_SHA256: "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1"
    steps:
      - name: Fetch exact protected Git desired state
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f infra/hosts/hosts.textproto

      - name: Resolve exact immutable native Rust owner
        shell: bash
        env:
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          echo "HOST_OWNER=${owner}" >> "${GITHUB_ENV}"

      - name: Validate exact Git host through pinned protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          buf_bin="${RUNNER_TEMP}/buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            --output "${buf_bin}"
          echo "${BUF_LINUX_X86_64_SHA256}  ${buf_bin}" | sha256sum --check -
          chmod 0755 "${buf_bin}"
          test "$("${buf_bin}" --version)" = "${BUF_VERSION}"
          cd edge-platform
          "${buf_bin}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "../infra/hosts/hosts.textproto#format=txtpb" \
            --to "${RUNNER_TEMP}/hosts.binpb#format=binpb"
          test -s "${RUNNER_TEMP}/hosts.binpb"
          echo "HOSTS_SHA256=$(sha256sum "${RUNNER_TEMP}/hosts.binpb" | cut -d' ' -f1)" >> "${GITHUB_ENV}"

      - name: Read official runner registration for host routing
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            > "${RUNNER_TEMP}/host-runners.json"; then
            rm -f "${RUNNER_TEMP}/host-runners.json"
            # Read-only host diagnostics still dispatch to the exact
            # Git-owned runner label. The physical owner independently
            # validates its immutable RUNNER_NAME before any diagnostic.
            echo 'RUNNER_API_UNAVAILABLE_NATIVE_OWNER_AND_FRESHNESS_WILL_VERIFY' >&2
          fi
          if [[ -e "${RUNNER_TEMP}/host-runners.json" ]]; then
            test -s "${RUNNER_TEMP}/host-runners.json" || exit 1
          fi

      - name: Read complete existing GitHub journal for mutation admission
        if: startsWith(github.event.comment.body, '/host apply ') || startsWith(github.event.comment.body, '/host recover ')
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/26/comments?per_page=100" \
            > "${RUNNER_TEMP}/host-issue-pages.json"
          jq -e 'type == "array" and length > 0 and all(.[]; type == "array")' \
            "${RUNNER_TEMP}/host-issue-pages.json" >/dev/null
          jq -c 'add' "${RUNNER_TEMP}/host-issue-pages.json" > "${RUNNER_TEMP}/host-issue-history.json"
          expected="$(gh api "repos/${GITHUB_REPOSITORY}/issues/26" --jq '.comments')"
          [[ "${expected}" =~ ^[0-9]+$ ]]
          jq -e --argjson count "${expected}" \
            'length == $count and all(.[]; .id != null and (.body | type == "string"))' \
            "${RUNNER_TEMP}/host-issue-history.json" >/dev/null
          echo "HOST_JOURNAL_PATH=${RUNNER_TEMP}/host-issue-history.json" >> "${GITHUB_ENV}"

      - name: Show one typed native host status
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${COMMAND_BODY}" == "/host status" ]]; then
            command=(status)
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]status[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})([[:space:]]--deep)?$ ]]; then
            machine="${BASH_REMATCH[1]}"
            command=(status "${machine}")
            if [[ "${COMMAND_BODY}" == *" --deep" ]]; then command+=(--deep); fi
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]](apply|recover)[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})$ ]]; then
            command=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}")
          else
            echo 'HOST_COMMAND_INVALID' >&2
            exit 1
          fi
          runner_args=()
          if [[ -f "${RUNNER_TEMP}/host-runners.json" ]]; then
            runner_args=(--runner-inventory-json "${RUNNER_TEMP}/host-runners.json")
          fi
          journal_args=()
          if [[ -n "${HOST_JOURNAL_PATH:-}" ]]; then
            journal_args=(--journal-history-json "${HOST_JOURNAL_PATH}")
          fi
          "${HOST_OWNER}" host \
            --hosts-pb "${RUNNER_TEMP}/hosts.binpb" \
            --hosts-sha256 "${HOSTS_SHA256}" \
            --github-output "${GITHUB_OUTPUT}" \
            "${runner_args[@]}" \
            "${journal_args[@]}" \
            "${command[@]}" | tee "${RUNNER_TEMP}/host-observation.txt"
          grep -Fxq 'host_mutations=0' "${RUNNER_TEMP}/host-observation.txt"
          {
            echo '### Host — exact typed operation'
            echo '~~~text'
            cat "${RUNNER_TEMP}/host-observation.txt"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

  host_observe:
    # One read-only native owner job definition, distributed by the *Rust*
    # typed inventory. Offline/unproven fleet entries are reported by the
    # admission job, not silently counted as physically healthy.
    needs: host
    if: >-
      needs.host.result == 'success' &&
      needs.host.outputs.host_targets_present == 'true' &&
      (github.event.comment.body == '/host status' ||
       startsWith(github.event.comment.body, '/host status ') ||
       needs.host.outputs.operation == 'RECOVER_READ_ONLY')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host.outputs.host_matrix) }}
    runs-on: ${{ matrix.runner_labels }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TARGET_MACHINE: ${{ matrix.machine_id }}
      TARGET_OWNER: ${{ matrix.owner }}
      TARGET_KIND: ${{ matrix.kind }}
      COMMAND_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Verify installed Windows native owner and diagnose without mutation
        if: env.TARGET_KIND == 'WINDOWS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne $env:TARGET_OWNER) {
            throw 'HOST_WINDOWS_OWNER_MISMATCH'
          }
          $root = 'C:\sing-box'
          $doctor = Join-Path $root 'bin\edge-diagnostic.exe'
          $current = Join-Path $root 'current.pb'
          if (-not (Test-Path -LiteralPath $doctor -PathType Leaf) -or
              -not (Test-Path -LiteralPath $current -PathType Leaf)) {
            throw 'HOST_WINDOWS_NATIVE_OWNER_MISSING'
          }
          if ($env:COMMAND_BODY -like '* --deep' -or
              $env:COMMAND_BODY -like '/host recover *') {
            & $doctor doctor $current
            if ($LASTEXITCODE -ne 0) { throw 'HOST_WINDOWS_NATIVE_DEEP_FAILED' }
          } else {
            & $doctor doctor $current --fast
            if ($LASTEXITCODE -ne 0) {
              # Older accepted immutable diagnostic has only doctor <current.pb>.
              # Its exact owner can still diagnose read-only; don't install
              # a new version, restart SCM or claim that FAST succeeded.
              Write-Output 'host_fast_unavailable=INSTALLED_NATIVE_VERB_NOT_ACCEPTED'
              Write-Output 'host_observation_depth=DEEP_INSTALLED_OWNER_FALLBACK'
              & $doctor doctor $current
              if ($LASTEXITCODE -ne 0) { throw 'HOST_WINDOWS_NATIVE_FALLBACK_FAILED' }
            }
          }

      - name: Verify installed VM native owner and diagnose without mutation
        if: env.TARGET_KIND == 'VM'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          owner="/usr/local/libexec/sing-box/edge-agent"
          test -x "${owner}"
          test ! -L "${owner}"
          for path in /usr /usr/local /usr/local/libexec /usr/local/libexec/sing-box "${owner}"; do
            test ! -L "${path}"
            test "$(stat -c '%u:%g:%a' "${path}")" = "0:0:755"
          done
          test "$(id -u)" != 0
          if sudo -n id -u >/dev/null 2>&1; then
            echo 'HOST_VM_GENERIC_ROOT_AUTHORITY_FORBIDDEN' >&2
            exit 1
          fi
          test ! -r /var/run/docker.sock
          if [[ "${COMMAND_BODY}" == *" --deep" || "${COMMAND_BODY}" == "/host recover "* ]]; then
            sudo -n "${owner}" local diagnose
          else
            # Old installed sudoers may not yet grant --fast. Native deep
            # remains authorized and read-only; do not elevate privileges.
            if sudo -n -l "${owner}" local status --fast >/dev/null 2>&1; then
              sudo -n "${owner}" local status --fast
            else
              echo 'host_observation_depth=DEEP_INSTALLED_OWNER_FALLBACK'
              echo 'host_fast_unavailable=EXACT_SUDOERS_VERB_NOT_INSTALLED'
              sudo -n "${owner}" local diagnose
            fi
          fi

  host_report:
    # Post an immediate, bounded Actions run pointer. An offline runner
    # must not postpone ChatGPT's discovery of the physical status workflow.
    needs: host
    if: >-
      needs.host.result == 'success' &&
      (github.event.comment.body == '/host status' ||
       startsWith(github.event.comment.body, '/host status ') ||
       needs.host.outputs.operation == 'RECOVER_READ_ONLY')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      comment_id: ${{ steps.publish.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      COMMAND_BODY: ${{ github.event.comment.body }}
      TARGETS_PRESENT: ${{ needs.host.outputs.host_targets_present }}
    steps:
      - name: Publish one read-only observation pointer immediately
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMENT_ID}" =~ ^[0-9]+$ ]]
          case "${TARGETS_PRESENT}" in
            true) result=PENDING_NATIVE_OBSERVATION ;;
            false) result=NO_NATIVE_TARGET_AVAILABLE ;;
            *) exit 1 ;;
          esac
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf 'Host read-only report for operator command #%s\n\nOperation: `%s`\nResult: `%s`\nPhysical dispatch selected: `%s`\nCI evidence: %s\n\nNo credentials, SCM, DNS, routing or TUN mutation.\n' \
            "${SOURCE_COMMENT_ID}" "${COMMAND_BODY}" "${result}" "${TARGETS_PRESENT}" "${run_url}")"
          comment_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f "body=${body}" --jq '.id')"
          [[ "${comment_id}" =~ ^[0-9]+$ ]]
          echo "comment_id=${comment_id}" >> "${GITHUB_OUTPUT}"

  host_report_finalize:
    # Transport-only update of the SAME response. The native job cannot
    # write Issues, and GitHub never infers runtime health from a queued job.
    needs: [host_report, host_observe]
    if: >-
      always() &&
      needs.host_report.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_COMMENT_ID: ${{ needs.host_report.outputs.comment_id }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      COMMAND_BODY: ${{ github.event.comment.body }}
      OBSERVED_RESULT: ${{ needs.host_observe.result }}
      TARGETS_PRESENT: ${{ needs.host.outputs.host_targets_present }}
    steps:
      - name: Finalize exactly the existing operator result comment
        shell: bash
        run: |
          set -euo pipefail
          [[ "${REPORT_COMMENT_ID}" =~ ^[0-9]+$ ]]
          [[ "${SOURCE_COMMENT_ID}" =~ ^[0-9]+$ ]]
          case "${OBSERVED_RESULT}" in
            success) result=NATIVE_READ_ONLY_COMPLETED ;;
            failure) result=NATIVE_DIAGNOSTIC_FAILED ;;
            cancelled) result=NATIVE_DIAGNOSTIC_CANCELLED ;;
            skipped) result=NO_NATIVE_OBSERVATION ;;
            *) result=UNKNOWN_NOT_ACCEPTED ;;
          esac
          case "${TARGETS_PRESENT}" in true|false) ;; *) exit 1 ;; esac
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf 'Host read-only report for operator command #%s\n\nOperation: `%s`\nResult: `%s`\nPhysical dispatch selected: `%s`\nCI evidence: %s\n\nNo credentials, SCM, DNS, routing or TUN mutation.\n' \
            "${SOURCE_COMMENT_ID}" "${COMMAND_BODY}" "${result}" "${TARGETS_PRESENT}" "${run_url}")"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${REPORT_COMMENT_ID}" -f "body=${body}" >/dev/null

  host_apply_windows:
    needs: host
    if: >-
      needs.host.result == 'success' &&
      needs.host.outputs.operation == 'APPLY' &&
      needs.host.outputs.kind == 'WINDOWS' &&
      needs.host.outputs.admitted_at_unix != ''
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/windows-physical.yml
    with:
      command_body: '/windows apply'
      host_machine_id: ${{ needs.host.outputs.machine_id }}
      host_runner_label: ${{ needs.host.outputs.windows_runner_label }}
      host_runner_name: ${{ needs.host.outputs.owner }}
      host_admitted_at_unix: ${{ needs.host.outputs.admitted_at_unix }}

  host_apply_vm:
    needs: host
    if: >-
      needs.host.result == 'success' &&
      needs.host.outputs.operation == 'APPLY' &&
      needs.host.outputs.kind == 'VM' &&
      needs.host.outputs.machine_id == 'production-1' &&
      needs.host.outputs.admitted_at_unix != ''
    uses: ./.github/workflows/vm-application-lifecycle.yml
    with:
      command_body: '/production converge'
      host_admitted_at_unix: ${{ needs.host.outputs.admitted_at_unix }}
    secrets: inherit

  windows:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (
        github.event.comment.body == '/windows diagnose' ||
        github.event.comment.body == '/windows apply' ||
        github.event.comment.body == '/windows offline-preflight' ||
        github.event.comment.body == '/windows quality-line1' ||
        github.event.comment.body == '/windows converge' ||
        github.event.comment.body == '/windows start' ||
        github.event.comment.body == '/windows stop' ||
        github.event.comment.body == '/windows restart-controller' ||
        github.event.comment.body == '/windows repair' ||
        github.event.comment.body == '/windows rollback' ||
        startsWith(github.event.comment.body, '/windows acceptance-reconcile ') ||
        startsWith(github.event.comment.body, '/windows initial-pair-stage ') ||
        startsWith(github.event.comment.body, '/windows initial-pair-prepare ')
      )
    permissions:
      contents: read
      actions: read
      # Only the exact durable initial-stage journal owner actually uses WRITE;
      # unrelated Windows physical jobs retain their own job-level read-only scope.
      issues: write
    uses: ./.github/workflows/windows-physical.yml
    with:
      command_body: ${{ github.event.comment.body }}

  vultr:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/vultr ')
    uses: ./.github/workflows/vultr-lifecycle.yml
    # Exactly this reusable caller may write the one-shot non-secret
    # BEGIN to Issue #26. Other control-plane routes keep read-only token.
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  vpc:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/vpc ')
    uses: ./.github/workflows/vultr-vpc-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

