name: Edge Control Plane
run-name: ${{ startsWith(github.event.comment.body, '/') && github.event.comment.body || 'Edge Control Plane — NO_COMMAND' }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  application:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (startsWith(github.event.comment.body, '/application ') ||
       startsWith(github.event.comment.body, '/vm '))
    uses: ./.github/workflows/vm-application-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  production:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/production ')
    uses: ./.github/workflows/vm-application-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  credentials:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/credentials ')
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/credential-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  fleet:
    # One read-only native Rust entry point. GitHub authorizes the caller;
    # existing release identity and typed protobuf identify the exact hosts.
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (github.event.comment.body == '/fleet inventory' ||
       github.event.comment.body == '/fleet status' ||
       startsWith(github.event.comment.body, '/fleet inspect ') ||
       startsWith(github.event.comment.body, '/fleet fast ') ||
       startsWith(github.event.comment.body, '/fleet doctor '))
    outputs:
      kind: ${{ steps.observe.outputs.kind }}
      owner: ${{ steps.observe.outputs.owner }}
      runner_labels: ${{ steps.observe.outputs.runner_labels }}
      machine_id: ${{ steps.observe.outputs.machine_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      COMMAND_BODY: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
      BUF_VERSION: "1.73.0"
      BUF_LINUX_X86_64_SHA256: "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1"
    steps:
      - name: Fetch exact protected Git desired state
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f infra/fleet/hosts.textproto

      - name: Resolve exact immutable native Rust owner
        shell: bash
        env:
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/fleet-release
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          echo "FLEET_OWNER=${owner}" >> "${GITHUB_ENV}"

      - name: Validate exact Git fleet through pinned protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          buf_bin="${RUNNER_TEMP}/buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            --output "${buf_bin}"
          echo "${BUF_LINUX_X86_64_SHA256}  ${buf_bin}" | sha256sum --check -
          chmod 0755 "${buf_bin}"
          test "$("${buf_bin}" --version)" = "${BUF_VERSION}"
          cd edge-platform
          "${buf_bin}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "../infra/fleet/hosts.textproto#format=txtpb" \
            --to "${RUNNER_TEMP}/fleet.binpb#format=binpb"
          test -s "${RUNNER_TEMP}/fleet.binpb"
          echo "FLEET_INVENTORY_SHA256=$(sha256sum "${RUNNER_TEMP}/fleet.binpb" | cut -d' ' -f1)" >> "${GITHUB_ENV}"

      - name: Read GitHub runner registration before physical dispatch
        if: github.event.comment.body == '/fleet status' || startsWith(github.event.comment.body, '/fleet doctor ') || startsWith(github.event.comment.body, '/fleet fast ')
        shell: bash
        run: |
          set -euo pipefail
          # Official registration reports online/busy/labels. Job history does not.
          # No retry, runner installation, or relabeling here.
          if ! gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            > "${RUNNER_TEMP}/fleet-runners.json"; then
            rm -f "${RUNNER_TEMP}/fleet-runners.json"
            echo 'RUNNER_API_UNAVAILABLE: registration endpoint not authorized' >&2
            if [[ "${COMMAND_BODY}" != "/fleet status" ]]; then
              echo 'RUNNER_API_UNAVAILABLE: no physical job dispatched' >> "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
          fi
          if [[ -e "${RUNNER_TEMP}/fleet-runners.json" ]]; then
            test -s "${RUNNER_TEMP}/fleet-runners.json" || \
              { echo 'RUNNER_API_INCOMPLETE' >&2; exit 1; }
          fi

      - name: Execute bounded read-only Fleet operation
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          command=( )
          if [[ "${COMMAND_BODY}" == "/fleet inventory" ]]; then
            command=(inventory)
          elif [[ "${COMMAND_BODY}" == "/fleet status" ]]; then
            command=(status)
          elif [[ "${COMMAND_BODY}" == "/fleet inspect "* ||
                  "${COMMAND_BODY}" == "/fleet doctor "* ||
                  "${COMMAND_BODY}" == "/fleet fast "* ]]; then
            if [[ "${COMMAND_BODY}" == "/fleet doctor "* ]]; then
              machine="${COMMAND_BODY#/fleet doctor }"
            elif [[ "${COMMAND_BODY}" == "/fleet fast "* ]]; then
              machine="${COMMAND_BODY#/fleet fast }"
            else
              machine="${COMMAND_BODY#/fleet inspect }"
            fi
            [[ "${machine}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]] ||
              { echo 'Invalid Fleet machine selector' >&2; exit 1; }
            command=(inspect "${machine}")
          else
            echo 'Unsupported Fleet command' >&2
            exit 1
          fi
          runner_args=()
          if [[ -f "${RUNNER_TEMP}/fleet-runners.json" ]]; then
            runner_args=(--runner-inventory-json "${RUNNER_TEMP}/fleet-runners.json")
          fi
          "${FLEET_OWNER}" fleet \
            --inventory-pb "${RUNNER_TEMP}/fleet.binpb" \
            --inventory-sha256 "${FLEET_INVENTORY_SHA256}" \
            --github-output "${GITHUB_OUTPUT}" \
            "${runner_args[@]}" \
            "${command[@]}" | tee "${RUNNER_TEMP}/fleet-observation.txt"
          grep -Fxq 'fleet_mutations=0' "${RUNNER_TEMP}/fleet-observation.txt"
          {
            echo '### Fleet — native read-only observation'
            echo '~~~text'
            cat "${RUNNER_TEMP}/fleet-observation.txt"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

  fleet_doctor:
    # Real physical diagnostics are executed on the Git-selected machine,
    # via the existing native diagnostic/agent owner. No new service, remote
    # shell, credential publish, SCM start, network rewrite, or host mutation.
    needs: fleet
    if: >-
      needs.fleet.result == 'success' &&
      (startsWith(github.event.comment.body, '/fleet doctor ') ||
       startsWith(github.event.comment.body, '/fleet fast ')) &&
      (needs.fleet.outputs.kind == 'WINDOWS' ||
       needs.fleet.outputs.kind == 'VM')
    runs-on: ${{ fromJSON(needs.fleet.outputs.runner_labels) }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TARGET_MACHINE: ${{ needs.fleet.outputs.machine_id }}
      TARGET_OWNER: ${{ needs.fleet.outputs.owner }}
      TARGET_KIND: ${{ needs.fleet.outputs.kind }}
      COMMAND_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Verify installed Windows native owner and diagnose without mutation
        if: env.TARGET_KIND == 'WINDOWS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne $env:TARGET_OWNER) {
            throw 'FLEET_WINDOWS_OWNER_MISMATCH'
          }
          $root = 'C:\sing-box'
          $doctor = Join-Path $root 'bin\edge-diagnostic.exe'
          $current = Join-Path $root 'current.pb'
          if (-not (Test-Path -LiteralPath $doctor -PathType Leaf) -or
              -not (Test-Path -LiteralPath $current -PathType Leaf)) {
            throw 'FLEET_WINDOWS_NATIVE_OWNER_MISSING'
          }
          $depth = if ($env:COMMAND_BODY -like '/fleet fast *') { 'fast' } else { 'doctor' }
          & $doctor $depth $current
          if ($LASTEXITCODE -ne 0) { throw 'FLEET_WINDOWS_NATIVE_DIAGNOSE_FAILED' }

      - name: Verify installed VM native owner and diagnose without mutation
        if: env.TARGET_KIND == 'VM'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          owner="/usr/local/libexec/sing-box/edge-agent"
          test -x "${owner}"
          test ! -L "${owner}"
          for path in /usr /usr/local /usr/local/libexec /usr/local/libexec/sing-box "${owner}"; do
            test ! -L "${path}"
            test "$(stat -c '%u:%g:%a' "${path}")" = "0:0:755"
          done
          test "$(id -u)" != 0
          if sudo -n id -u >/dev/null 2>&1; then
            echo 'FLEET_VM_GENERIC_ROOT_AUTHORITY_FORBIDDEN' >&2
            exit 1
          fi
          test ! -r /var/run/docker.sock
          if [[ "${COMMAND_BODY}" == "/fleet fast "* ]]; then
            sudo -n "${owner}" local fast
          else
            sudo -n "${owner}" local diagnose
          fi

  windows:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (
        github.event.comment.body == '/windows smoke' ||
        github.event.comment.body == '/windows diagnose' ||
        github.event.comment.body == '/windows status' ||
        github.event.comment.body == '/windows apply' ||
        github.event.comment.body == '/windows offline-preflight' ||
        github.event.comment.body == '/windows quality-line1' ||
        github.event.comment.body == '/windows converge' ||
        github.event.comment.body == '/windows start' ||
        github.event.comment.body == '/windows stop' ||
        github.event.comment.body == '/windows restart-controller' ||
        github.event.comment.body == '/windows repair' ||
        github.event.comment.body == '/windows rollback' ||
        startsWith(github.event.comment.body, '/windows acceptance-reconcile ') ||
        startsWith(github.event.comment.body, '/windows initial-pair-stage ') ||
        startsWith(github.event.comment.body, '/windows initial-pair-prepare ')
      )
    permissions:
      contents: read
      actions: read
      # Only the exact durable initial-stage journal owner actually uses WRITE;
      # unrelated Windows physical jobs retain their own job-level read-only scope.
      issues: write
    uses: ./.github/workflows/windows-physical.yml
    with:
      command_body: ${{ github.event.comment.body }}

  vultr:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/vultr ')
    uses: ./.github/workflows/vultr-lifecycle.yml
    # Exactly this reusable caller may write the one-shot non-secret
    # BEGIN to Issue #26. Other control-plane routes keep read-only token.
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  vpc:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/vpc ')
    uses: ./.github/workflows/vultr-vpc-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

