      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '/dns ')
    uses: ./.github/workflows/cloudflare-dns-lifecycle.yml
    with:
      command_body: ${{ github.event.comment.body }}
    secrets: inherit

  mesh:
