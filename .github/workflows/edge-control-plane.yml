name: Edge Control Plane
run-name: ${{ startsWith(github.event.comment.body, '/') && github.event.comment.body || 'Edge Control Plane — NO_COMMAND' }}

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  host:
    # One Rust-owned host lifecycle entry point. GitHub authorizes the caller;
    # existing release identity and typed protobuf identify the exact hosts.
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1 &&
      (github.event.comment.body == '/host status' ||
       startsWith(github.event.comment.body, '/host status ') ||
       startsWith(github.event.comment.body, '/host apply ') ||
       startsWith(github.event.comment.body, '/host recover '))
    outputs:
      kind: ${{ steps.observe.outputs.kind }}
      owner: ${{ steps.observe.outputs.owner }}
      runner_labels: ${{ steps.observe.outputs.runner_labels }}
      machine_id: ${{ steps.observe.outputs.machine_id }}
      desired_spec_path: ${{ steps.observe.outputs.desired_spec_path }}
      operation: ${{ steps.observe.outputs.operation }}
      windows_runner_label: ${{ steps.observe.outputs.windows_runner_label }}
      admitted_at_unix: ${{ steps.observe.outputs.admitted_at_unix }}
      host_matrix: ${{ steps.observe.outputs.host_matrix }}
      host_targets_present: ${{ steps.observe.outputs.host_targets_present }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      COMMAND_BODY: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
      BUF_VERSION: "1.73.0"
      BUF_LINUX_X86_64_SHA256: "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1"
    steps:
      - name: Fetch exact protected Git desired state
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f infra/hosts/hosts.textproto

      - name: Resolve exact immutable native Rust owner
        shell: bash
        env:
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"
          echo "HOST_OWNER=${owner}" >> "${GITHUB_ENV}"

      - name: Validate exact Git host through pinned protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          buf_bin="${RUNNER_TEMP}/buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" \
            --output "${buf_bin}"
          echo "${BUF_LINUX_X86_64_SHA256}  ${buf_bin}" | sha256sum --check -
          chmod 0755 "${buf_bin}"
          test "$("${buf_bin}" --version)" = "${BUF_VERSION}"
          cd edge-platform
          "${buf_bin}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "../infra/hosts/hosts.textproto#format=txtpb" \
            --to "${RUNNER_TEMP}/hosts.binpb#format=binpb"
          test -s "${RUNNER_TEMP}/hosts.binpb"
          echo "HOSTS_SHA256=$(sha256sum "${RUNNER_TEMP}/hosts.binpb" | cut -d' ' -f1)" >> "${GITHUB_ENV}"

      - name: Read official runner registration for host routing
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            > "${RUNNER_TEMP}/host-runners.json"; then
            rm -f "${RUNNER_TEMP}/host-runners.json"
            # Read-only host diagnostics still dispatch to the exact
            # Git-owned runner label. The physical owner independently
            # validates its immutable RUNNER_NAME before any diagnostic.
            echo 'RUNNER_API_UNAVAILABLE_NATIVE_OWNER_AND_FRESHNESS_WILL_VERIFY' >&2
          fi
          if [[ -e "${RUNNER_TEMP}/host-runners.json" ]]; then
            test -s "${RUNNER_TEMP}/host-runners.json" || exit 1
          fi

      - name: Show one typed native host status or read-only lifecycle preflight
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${COMMAND_BODY}" == "/host status" ]]; then
            command=(status)
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]status[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})([[:space:]]--deep)?$ ]]; then
            machine="${BASH_REMATCH[1]}"
            command=(status "${machine}")
            if [[ "${COMMAND_BODY}" == *" --deep" ]]; then command+=(--deep); fi
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]]apply[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})[[:space:]](config/[A-Za-z0-9][A-Za-z0-9._-]{0,63}/(line1-gateway|line2-proxy))$ ]]; then
            command=(apply "${BASH_REMATCH[1]}" --resource-id "${BASH_REMATCH[2]}")
          elif [[ "${COMMAND_BODY}" =~ ^/host[[:space:]](apply|recover)[[:space:]]([a-zA-Z0-9][a-zA-Z0-9._-]{0,63})$ ]]; then
            command=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}")
          else
            echo 'HOST_COMMAND_INVALID' >&2
            exit 1
          fi
          # The old accepted main may still support diagnostic STATUS, but
          # must never mint a signed mutation from a release missing its Git
          # registry. Compare the published asset to our independent exact
          # checked-out textproto compilation, before preparing HostIntent.
          if [[ "${command[0]}" != "status" ]]; then
            source "${RUNNER_TEMP}/host-release/resolved.env"
            test "${EDGE_RELEASE_SCHEMA_VERSION}" = "7"
            [[ "${EDGE_FLEET_REGISTRY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            test "${EDGE_FLEET_REGISTRY_SHA256}" = "${HOSTS_SHA256}"
            cmp -s "${RUNNER_TEMP}/host-release/fleet-registry.pb" "${RUNNER_TEMP}/hosts.binpb"
            test -s "${RUNNER_TEMP}/host-release/application-bundle.pb"
          fi
          runner_args=()
          if [[ -f "${RUNNER_TEMP}/host-runners.json" ]]; then
            runner_args=(--runner-inventory-json "${RUNNER_TEMP}/host-runners.json")
          fi
          "${HOST_OWNER}" host \
            --hosts-pb "${RUNNER_TEMP}/hosts.binpb" \
            --hosts-sha256 "${HOSTS_SHA256}" \
            --github-output "${GITHUB_OUTPUT}" \
            --source-comment-id "${{ github.event.comment.id }}" \
            --intent-output "${RUNNER_TEMP}/host-intent.pb" \
            "${runner_args[@]}" \
            "${command[@]}" | tee "${RUNNER_TEMP}/host-observation.txt"
          grep -Fxq 'host_mutations=0' "${RUNNER_TEMP}/host-observation.txt"
          {
            echo '### Host — exact typed operation'
            echo '~~~text'
            cat "${RUNNER_TEMP}/host-observation.txt"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Retain one typed intent and blocked/prepared receipt
        if: ${{ steps.observe.outputs.operation == 'APPLY_PREFLIGHT' || steps.observe.outputs.operation == 'RECOVER_PREFLIGHT' }}
        uses: actions/upload-artifact@v4
        with:
          name: host-intent-${{ github.event.comment.id }}
          path: |
            ${{ runner.temp }}/host-intent.pb
            ${{ runner.temp }}/host-intent.receipt.pb
          if-no-files-found: error
          retention-days: 7

  host_observe:
    # Every typed host is an INDEPENDENT reusable workflow invocation.
    # An absent production runner cannot delay completion or reporting for
    # a healthy Windows / acceptance VM owner.
    needs: [host, host_report]
    if: >-
      needs.host.result == 'success' &&
      needs.host_report.result == 'success' &&
      needs.host.outputs.host_targets_present == 'true' &&
      (github.event.comment.body == '/host status' ||
       startsWith(github.event.comment.body, '/host status ') ||
       needs.host.outputs.operation == 'APPLY_PREFLIGHT' ||
       needs.host.outputs.operation == 'RECOVER_PREFLIGHT')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host.outputs.host_matrix) }}
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/host-native-observe.yml
    with:
      machine_id: ${{ matrix.machine_id }}
      owner: ${{ matrix.owner }}
      kind: ${{ matrix.kind }}
      runner_labels: ${{ toJSON(matrix.runner_labels) }}
      command_body: ${{ github.event.comment.body }}
      source_comment_id: ${{ github.event.comment.id }}

  host_report:
    # Post an immediate, bounded Actions run pointer. An offline runner
    # must not postpone ChatGPT's discovery of the physical status workflow.
    needs: host
    if: >-
      github.run_attempt == 1 &&
      needs.host.result == 'success' &&
      (github.event.comment.body == '/host status' ||
       startsWith(github.event.comment.body, '/host status ') ||
       needs.host.outputs.operation == 'APPLY_PREFLIGHT' ||
       needs.host.outputs.operation == 'RECOVER_PREFLIGHT' ||
       needs.host.outputs.operation == 'FIRST_USE_PREFLIGHT')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      comment_id: ${{ steps.publish.outputs.comment_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      COMMAND_BODY: ${{ github.event.comment.body }}
      TARGETS_PRESENT: ${{ needs.host.outputs.host_targets_present }}
    steps:
      - name: Publish one read-only observation pointer immediately
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMENT_ID}" =~ ^[0-9]+$ ]]
          case "${TARGETS_PRESENT}" in
            true) result=PER_HOST_NATIVE_REPORTS_INDEPENDENT ;;
            false)
              if [[ "${COMMAND_BODY}" == "/host apply "* ]]; then
                result=FIRST_USE_GIT_RECEIPT_REGISTRATION_REQUIRED
              else
                result=NO_NATIVE_TARGET_AVAILABLE
              fi
              ;;
            *) exit 1 ;;
          esac
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf 'Host read-only report for operator command #%s\n\nOperation: `%s`\nResult: `%s`\nPhysical dispatch selected: `%s`\nCI evidence: %s\n\nIndividual host outcomes arrive as separate correlated replies. Unresponsive runners remain UNPROVEN. This coordinator does not mutate; an eligible VM root owner may execute one signed HostIntent.\n' \
            "${SOURCE_COMMENT_ID}" "${COMMAND_BODY}" "${result}" "${TARGETS_PRESENT}" "${run_url}")"
          comment_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f "body=${body}" --jq '.id')"
          [[ "${comment_id}" =~ ^[0-9]+$ ]]
          echo "comment_id=${comment_id}" >> "${GITHUB_OUTPUT}"


  host_first_use:
    # A continuation of ONE issue /host apply, not another public ingress.
    # First-use is a bounded GitHub-hosted provider/root bootstrap, never
    # executed by the low-privilege VM runner or the legacy Vultr workflow.
    needs: [host, host_report]
    if: >-
      needs.host.result == 'success' &&
      needs.host_report.result == 'success' &&
      needs.host.outputs.operation == 'FIRST_USE_PREFLIGHT' &&
      needs.host.outputs.kind == 'VM' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      TARGET_MACHINE: ${{ needs.host.outputs.machine_id }}
      SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact accepted Git source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Resolve immutable published native owner and fleet
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/host-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          [[ "${EDGE_FLEET_REGISTRY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum "${OUTPUT_DIR}/fleet-registry.pb" | cut -d' ' -f1)" = "${EDGE_FLEET_REGISTRY_SHA256}"
          test "$(sha256sum "${OUTPUT_DIR}/edge-orchestrator-linux-amd64" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sha256sum "${OUTPUT_DIR}/edge-agent-linux-amd64" | cut -d' ' -f1)" = "${EDGE_AGENT_SHA256}"
          chmod 0755 "${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          for key in EDGE_DOCKER_ENGINE_VERSION EDGE_CONTAINERD_VERSION EDGE_COMPOSE_VERSION; do
            echo "${key}=${!key}" >> "${GITHUB_ENV}"
          done
          echo "EDGE_RELEASE_CONTEXT_PATH=${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Materialize bounded operator key and egress identity
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="${RUNNER_TEMP}/singbox-first-use-operator"
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key}"
          test -s "${key}"
          chmod 0600 "${key}"
          echo "EDGE_SSH_PRIVATE_KEY_PATH=${key}" >> "${GITHUB_ENV}"
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1])
          if value.version != 4 or not value.is_global:
              raise SystemExit("HOST_FIRST_USE_EGRESS_INVALID")
          PY
          echo "EDGE_CONTROLLER_IPV4=${ip}" >> "${GITHUB_ENV}"

      - name: Obtain single ephemeral VM runner enrollment credential
        shell: bash
        env:
          CONTROL_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CONTROL_TOKEN}"
          token="$(curl --fail --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${CONTROL_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" | jq -er '.token')"
          test -n "${token}"
          echo "::add-mask::${token}"
          echo "EDGE_RUNNER_REGISTRATION_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Run one typed provider CREATE and native root enrollment
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          bin="${RUNNER_TEMP}/host-release/edge-orchestrator-linux-amd64"
          "${bin}" host \
            --hosts-pb "${RUNNER_TEMP}/host-release/fleet-registry.pb" \
            --hosts-sha256 "$(sha256sum "${RUNNER_TEMP}/host-release/fleet-registry.pb" | cut -d' ' -f1)" \
            first-use "${TARGET_MACHINE}" \
            --installer-path edge-platform/scripts/install-vultr-production-runner.sh \
            --agent-path "${RUNNER_TEMP}/host-release/edge-agent-linux-amd64" \
            | tee "${RUNNER_TEMP}/host-first-use-evidence.txt"

      - name: Stage root receipt identity through a protected Git pull request
        shell: bash
        env:
          REGISTRATION_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
        run: |
          set -euo pipefail
          # One-shot: never rerun CREATE/enrollment after an uncertain result.
          test "${GITHUB_RUN_ATTEMPT}" = 1
          [[ "${TARGET_MACHINE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]
          [[ "${SOURCE_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          evidence="${RUNNER_TEMP}/host-first-use-evidence.txt"
          test -f "${evidence}" && test ! -L "${evidence}"
          # Exactly one bounded receipt key line, with no trailing payload.
          test "$(grep -Ec '^host_first_use_receipt_public_key_hex=[0-9a-f]{64}' "${evidence}")" = 1
          public_key="$(sed -n 's/^host_first_use_receipt_public_key_hex=//p' "${evidence}")"
          test "${#public_key}" = 64
          bin="${RUNNER_TEMP}/host-release/edge-orchestrator-linux-amd64"
          fleet="${RUNNER_TEMP}/host-release/fleet-registry.pb"
          new_fleet="${RUNNER_TEMP}/host-receipt-candidate.pb"
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            register-receipt "${TARGET_MACHINE}" \
            --receipt-public-key-hex "${public_key}" --output-path "${new_fleet}" \
            | tee "${RUNNER_TEMP}/host-registration-proof.txt"
          grep -Fxq 'host_receipt_registration=PROTECTED_GIT_CANDIDATE_ONLY' "${RUNNER_TEMP}/host-registration-proof.txt"
          grep -Fxq 'host_mutations=0' "${RUNNER_TEMP}/host-registration-proof.txt"
          buf="${RUNNER_TEMP}/host-buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64" -o "${buf}"
          echo "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1  ${buf}" | sha256sum --check -
          chmod 0755 "${buf}"
          target="${RUNNER_TEMP}/receipt-hosts.textproto"
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "${new_fleet}#format=binpb" --to "${target}#format=txtpb")
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "${target}#format=txtpb" \
            --to "${RUNNER_TEMP}/receipt-roundtrip.pb#format=binpb")
          # Compare typed meaning, not Protobuf wire order: Buf and prost
          # are conforming independent encoders.
          "${bin}" host --hosts-pb "${fleet}" \
            --hosts-sha256 "$(sha256sum "${fleet}" | cut -d' ' -f1)" \
            verify-receipt "${TARGET_MACHINE}" \
            --receipt-public-key-hex "${public_key}" \
            --candidate-path "${RUNNER_TEMP}/receipt-roundtrip.pb" \
            | tee "${RUNNER_TEMP}/host-receipt-verification.txt"
          grep -Fxq 'host_receipt_candidate=EXACT_ONE_PUBLIC_KEY_CHANGE' "${RUNNER_TEMP}/host-receipt-verification.txt"
          grep -Fxq 'host_mutations=0' "${RUNNER_TEMP}/host-receipt-verification.txt"
          # PAT needs contents:write and pull_requests:write. No protected
          # main write and no CI bypass: normal PR + required checks only.
          test -n "${REGISTRATION_TOKEN}"
          export GH_TOKEN="${REGISTRATION_TOKEN}"
          base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${base}" = "${GITHUB_SHA}"
          branch="host-receipt-${TARGET_MACHINE}-${SOURCE_COMMENT_ID}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${branch}" -f "sha=${GITHUB_SHA}" >/dev/null
          original_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto?ref=${GITHUB_SHA}" --jq '.sha')"
          encoded="$(base64 -w0 < "${target}")"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/infra/hosts/hosts.textproto" \
            -f "branch=${branch}" -f "sha=${original_sha}" \
            -f "message=host: register native receipt for ${TARGET_MACHINE}" \
            -f "content=${encoded}" >/dev/null
          gh pr create -R "${GITHUB_REPOSITORY}" -B main -H "${branch}" \
            -t "host: register native receipt for ${TARGET_MACHINE}" \
            -b "Protected Git native receipt registration. Original request: issue #1 comment ${SOURCE_COMMENT_ID}. Source ReleaseSet revision: ${GITHUB_SHA}. Host: ${TARGET_MACHINE}. Public key SHA256: $(printf '%s' "${public_key}" | sha256sum | cut -d' ' -f1). Root private key remains on VM. Merge only after required Source checks and Candidate complete; no signed INSTALL has run."
          echo 'host_first_use=AWAITING_PROTECTED_GIT_PR_MERGE'
          echo 'host_signed_install=NOT_YET_AUTHORIZED'
