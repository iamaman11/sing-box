name: Vultr Research Probe

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  probe:
    if: >-
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == '1' &&
      github.event.comment.body == '/vultr-research probe'
    runs-on: ubuntu-latest
    environment: production-vultr
    timeout-minutes: 3

    steps:
      - name: Check production-vultr secret availability
        id: secret_check
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          failed=0

          if [[ -n "${VULTR_API_KEY:-}" ]]; then
            echo "secret.vultr_api_key=present"
          else
            echo "secret.vultr_api_key=missing"
            failed=1
          fi

          if [[ -n "${VULTR_SSH_PRIVATE_KEY:-}" ]]; then
            echo "secret.vultr_ssh_private_key=present"
          else
            echo "secret.vultr_ssh_private_key=missing"
            failed=1
          fi

          if [[ "${failed}" -ne 0 ]]; then
            exit 1
          fi

      - name: Probe required Vultr read endpoints
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          set -euo pipefail

          endpoints=(
            "/v2/instances?per_page=1"
            "/v2/ssh-keys?per_page=1"
            "/v2/firewalls?per_page=1"
            "/v2/regions?per_page=1"
            "/v2/plans?per_page=1"
            "/v2/os?per_page=1"
          )

          failed=0
          for endpoint in "${endpoints[@]}"; do
            code="$(
              curl                 --silent                 --show-error                 --connect-timeout 10                 --max-time 20                 --output /dev/null                 --write-out '%{http_code}'                 --header "Authorization: Bearer ${VULTR_API_KEY}"                 --header "Accept: application/json"                 "https://api.vultr.com${endpoint}"
            )"

            printf 'probe endpoint=%s status=%s\n' "${endpoint%%\?*}" "${code}"

            if [[ "${code}" != "200" ]]; then
              failed=1
            fi
          done

          if [[ "${failed}" -ne 0 ]]; then
            echo "vultr_read_probe=FAIL"
            exit 1
          fi

          echo "vultr_read_probe=PASS"
