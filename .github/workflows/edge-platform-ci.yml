          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          RUNTIME_INPUT_SHA256: ${{ needs.dependencies.outputs.runtime_input_sha256 }}
        run: |
          set -euo pipefail
          base_dir="${RUNNER_TEMP}/base-edge-platform-release"
          ACCEPTED_REVISION="${BASE_REVISION}" OUTPUT_DIR="${base_dir}" \
            bash edge-platform/scripts/resolve_durable_release.sh
          source "${base_dir}/resolved.env"

          decision="$(python3 edge-platform/scripts/runtime_input_digest.py decide \
            --candidate-digest "${RUNTIME_INPUT_SHA256}" \
            --base-schema "${EDGE_RELEASE_SCHEMA_VERSION}" \
            --base-digest "${EDGE_RUNTIME_INPUT_SHA256}" \
            --base-runtime-source-revision "${EDGE_RUNTIME_SOURCE_REVISION}" \
            --base-agent-sha256 "${EDGE_AGENT_SHA256}" \
            --gateway-ref "${EDGE_GATEWAY_IMAGE}" \
            --warp-ref "${EDGE_WARP_EGRESS_IMAGE}")"
          test "${decision}" = "REUSE" || test "${decision}" = "BUILD"

          reuse=false
          runtime_source_revision="${CANDIDATE_REVISION}"
          if [[ "${decision}" = "REUSE" ]]; then
            candidate_agent_sha="$(sha256sum edge-platform/target/release/edge-agent | awk '{print $1}')"
            test "${candidate_agent_sha}" = "${EDGE_AGENT_SHA256}" || {
              echo "equal runtime input digest produced different edge-agent bytes" >&2
              exit 1
            }
            reuse=true
            runtime_source_revision="${EDGE_RUNTIME_SOURCE_REVISION}"
            printf 'base_agent_path=%s\n' "${base_dir}/edge-agent-linux-amd64" >> "${GITHUB_OUTPUT}"
            printf 'gateway_ref=%s\n' "${EDGE_GATEWAY_IMAGE}" >> "${GITHUB_OUTPUT}"
            printf 'warp_ref=%s\n' "${EDGE_WARP_EGRESS_IMAGE}" >> "${GITHUB_OUTPUT}"
          fi

          printf 'reuse=%s\n' "${reuse}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_source_revision=%s\n' "${runtime_source_revision}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_input_sha256=%s\n' "${RUNTIME_INPUT_SHA256}" >> "${GITHUB_OUTPUT}"

          {
            echo '### VM runtime reuse decision'
            echo
            echo "- decision: \`${decision}\`"
            echo "- candidate runtime input: \`${RUNTIME_INPUT_SHA256}\`"
            echo "- base schema: \`${EDGE_RELEASE_SCHEMA_VERSION}\`"
            echo "- base runtime input: \`${EDGE_RUNTIME_INPUT_SHA256:-legacy-missing}\`"
            echo "- runtime source revision: \`${runtime_source_revision}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build or reuse exact candidate images
        id: images
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          REUSE_RUNTIME: ${{ steps.runtime_reuse.outputs.reuse }}
          REUSED_GATEWAY_REF: ${{ steps.runtime_reuse.outputs.gateway_ref }}
          REUSED_WARP_REF: ${{ steps.runtime_reuse.outputs.warp_ref }}
          SING_BOX_VERSION: ${{ needs.dependencies.outputs.sing_box_version }}
          SING_BOX_URL: ${{ needs.dependencies.outputs.sing_box_linux_url }}
          SING_BOX_SHA256: ${{ needs.dependencies.outputs.sing_box_linux_sha256 }}
          WARP_VERSION: ${{ needs.dependencies.outputs.warp_version }}
          WARP_URL: ${{ needs.dependencies.outputs.warp_url }}
          WARP_SHA256: ${{ needs.dependencies.outputs.warp_sha256 }}
          DEBIAN_BASE_IMAGE: ${{ needs.dependencies.outputs.debian_base_image }}
          UBUNTU_BASE_IMAGE: ${{ needs.dependencies.outputs.ubuntu_base_image }}
        run: |
          set -euo pipefail
          registry="ghcr.io"
          owner="iamaman11"
          printf '%s' "${GHCR_TOKEN}" | docker login "${registry}" -u "${GITHUB_ACTOR}" --password-stdin

          if [[ "${REUSE_RUNTIME}" = "true" ]]; then
            gateway_ref="${REUSED_GATEWAY_REF}"
            warp_ref="${REUSED_WARP_REF}"
            [[ "${gateway_ref}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
            [[ "${warp_ref}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]
            docker pull "${gateway_ref}" >/dev/null
            docker pull "${warp_ref}" >/dev/null
            evidence_image="${gateway_ref}"
          else
            # VM_RUNTIME_BUILD_CONTRACT_BEGIN
            build_tag="candidate-${CANDIDATE_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gateway_tag="${registry}/${owner}/vultr-edge-gateway:${build_tag}"
            warp_tag="${registry}/${owner}/vultr-warp-egress:${build_tag}"

            docker build \
              --label "org.opencontainers.image.revision=${CANDIDATE_REVISION}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --build-arg "BASE_IMAGE=${DEBIAN_BASE_IMAGE}" \
              --build-arg "SING_BOX_VERSION=${SING_BOX_VERSION}" \
              --build-arg "SING_BOX_URL=${SING_BOX_URL}" \
              --build-arg "SING_BOX_SHA256=${SING_BOX_SHA256}" \
              -t "${gateway_tag}" \
              win/vultr-waw/stack/edge-gateway
            docker push "${gateway_tag}"

            docker build \
              --label "org.opencontainers.image.revision=${CANDIDATE_REVISION}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --build-arg "BASE_IMAGE=${UBUNTU_BASE_IMAGE}" \
              --build-arg "WARP_VERSION=${WARP_VERSION}" \
              --build-arg "WARP_URL=${WARP_URL}" \
              --build-arg "WARP_SHA256=${WARP_SHA256}" \
              -t "${warp_tag}" \
              win/vultr-waw/stack/warp-egress
            docker push "${warp_tag}"
            # VM_RUNTIME_BUILD_CONTRACT_END

            gateway_digest="$(docker buildx imagetools inspect "${gateway_tag}" --format '{{json .Manifest.Digest}}' | jq -er '.')"
            warp_digest="$(docker buildx imagetools inspect "${warp_tag}" --format '{{json .Manifest.Digest}}' | jq -er '.')"
            [[ "${gateway_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${warp_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            gateway_ref="${registry}/${owner}/vultr-edge-gateway@${gateway_digest}"
            warp_ref="${registry}/${owner}/vultr-warp-egress@${warp_digest}"
            evidence_image="${gateway_tag}"
          fi

          sing_box_evidence="${RUNNER_TEMP}/sing-box-linux"
          gateway_container="$(docker create "${evidence_image}")"
          docker cp "${gateway_container}:/usr/local/bin/sing-box" "${sing_box_evidence}"
          docker rm "${gateway_container}" >/dev/null
          chmod 0755 "${sing_box_evidence}"
          sing_box_binary_sha="$(sha256sum "${sing_box_evidence}" | awk '{print $1}')"

          config_check="${RUNNER_TEMP}/sing-box-config-check"
          install -d -m 0755 "${config_check}"
          export PROXY_USERNAME="ci-user"
          export PROXY_PASSWORD="ci-password"
          export PROXY_CERT_CN="edge.example.com"
          export VLESS_UUID="11111111-1111-4111-8111-111111111111"
          export HY2_PASSWORD="ci-hy2-direct"
          export REALITY_PRIVATE_KEY="UuMBgl7MXTPx9inmQp2UC7Jcnwc6XYbwDNebonM-FCc"
          export REALITY_PUBLIC_KEY="jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0"
          export REALITY_SHORT_ID="0123456789abcdef"
          export VLESS_WARP_UUID="22222222-2222-4222-8222-222222222222"
          export HY2_WARP_PASSWORD="ci-hy2-warp"
          export REALITY_WARP_PRIVATE_KEY="UuMBgl7MXTPx9inmQp2UC7Jcnwc6XYbwDNebonM-FCc"
          export REALITY_WARP_PUBLIC_KEY="jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0"
          export REALITY_WARP_SHORT_ID="abcdef0123456789"
          export REALITY_SERVER_NAME="www.microsoft.com"
          export TUNNEL_DOMAIN="edge.example.com"
          export ACME_EMAIL="admin@example.com"
          export ACME_PROVIDER="letsencrypt"
          export PROXY_CERT_PATH="${config_check}/proxy.crt"
          export PROXY_KEY_PATH="${config_check}/proxy.key"
          export CONFIG_CHECK_DIR="${config_check}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("win/vultr-waw/stack")
          out = Path(os.environ["CONFIG_CHECK_DIR"])
          for source, target in [
              (root / "line1-gateway/config.template.json", out / "line1-gateway.json"),
              (root / "line2-proxy/config.template.json", out / "line2-proxy.json"),
          ]:
              payload = json.loads(os.path.expandvars(source.read_text()))
              for inbound in payload.get("inbounds", []):
                  tls = inbound.get("tls")
                  if not isinstance(tls, dict):
                      continue
                  if tls.get("certificate_path") == "/certs/proxy.crt":
                      tls["certificate_path"] = str(out / "proxy.crt")
                  if tls.get("key_path") == "/certs/proxy.key":
                      tls["key_path"] = str(out / "proxy.key")
              target.write_text(json.dumps(payload, indent=2) + "\n")
          PY
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "${config_check}/proxy.key" \
            -out "${config_check}/proxy.crt" \
            -days 1 \
            -subj "/CN=edge.example.com" >/dev/null 2>&1
          "${sing_box_evidence}" check -c "${config_check}/line1-gateway.json"
          "${sing_box_evidence}" check -c "${config_check}/line2-proxy.json"

          docker buildx imagetools inspect "${gateway_ref}" >/dev/null
          docker buildx imagetools inspect "${warp_ref}" >/dev/null
          docker logout "${registry}" >/dev/null

          printf 'gateway_ref=%s\n' "${gateway_ref}" >> "${GITHUB_OUTPUT}"
          printf 'warp_ref=%s\n' "${warp_ref}" >> "${GITHUB_OUTPUT}"
          printf 'sing_box_binary_sha256=%s\n' "${sing_box_binary_sha}" >> "${GITHUB_OUTPUT}"

      - name: Package exact Linux candidate
        id: package
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          RUNTIME_REUSE: ${{ steps.runtime_reuse.outputs.reuse }}
          REUSED_AGENT_PATH: ${{ steps.runtime_reuse.outputs.base_agent_path }}
          RUNTIME_SOURCE_REVISION: ${{ steps.runtime_reuse.outputs.runtime_source_revision }}
          RUNTIME_INPUT_SHA256: ${{ steps.runtime_reuse.outputs.runtime_input_sha256 }}
          EDGE_GATEWAY_IMAGE: ${{ steps.images.outputs.gateway_ref }}
          EDGE_WARP_EGRESS_IMAGE: ${{ steps.images.outputs.warp_ref }}
          SING_BOX_VERSION: ${{ needs.dependencies.outputs.sing_box_version }}
          SING_BOX_LINUX_SHA256: ${{ needs.dependencies.outputs.sing_box_linux_sha256 }}
          SING_BOX_BINARY_SHA256: ${{ steps.images.outputs.sing_box_binary_sha256 }}
          DOCKER_ENGINE_VERSION: ${{ needs.dependencies.outputs.docker_engine_version }}
          CONTAINERD_VERSION: ${{ needs.dependencies.outputs.containerd_version }}
          COMPOSE_VERSION: ${{ needs.dependencies.outputs.compose_version }}
          WARP_VERSION: ${{ needs.dependencies.outputs.warp_version }}
          WARP_SHA256: ${{ needs.dependencies.outputs.warp_sha256 }}
          DEBIAN_BASE_IMAGE: ${{ needs.dependencies.outputs.debian_base_image }}
          UBUNTU_BASE_IMAGE: ${{ needs.dependencies.outputs.ubuntu_base_image }}
          MESH_IMAGE: ${{ needs.dependencies.outputs.mesh_image }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/edge-platform-release"
          install -d -m 0755 "${out}"
          install -m 0755 edge-platform/target/release/edge-controller "${out}/edge-controller"
          install -m 0755 edge-platform/target/release/edge-orchestrator "${out}/edge-orchestrator"
          if [[ "${RUNTIME_REUSE}" = "true" ]]; then
            test -f "${REUSED_AGENT_PATH}"
            install -m 0755 "${REUSED_AGENT_PATH}" "${out}/edge-agent"
          else
            install -m 0755 edge-platform/target/release/edge-agent "${out}/edge-agent"
          fi
          install -m 0755 edge-platform/target/release/edge-release-set "${out}/edge-release-set"
          install -m 0755 "${RUNNER_TEMP}/sing-box-linux" "${out}/sing-box-linux"

          controller_sha="$(sha256sum "${out}/edge-controller" | awk '{print $1}')"
          orchestrator_sha="$(sha256sum "${out}/edge-orchestrator" | awk '{print $1}')"
          agent_sha="$(sha256sum "${out}/edge-agent" | awk '{print $1}')"
          sing_box_binary_sha="$(sha256sum "${out}/sing-box-linux" | awk '{print $1}')"
          test "${sing_box_binary_sha}" = "${SING_BOX_BINARY_SHA256}"
          source_tree="$(git rev-parse 'HEAD^{tree}')"

          [[ "${EDGE_GATEWAY_IMAGE}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
          [[ "${EDGE_WARP_EGRESS_IMAGE}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]

          jq -n \
            --arg source_revision "${CANDIDATE_REVISION}" \
            --arg source_tree "${source_tree}" \
            --arg runtime_source_revision "${RUNTIME_SOURCE_REVISION}" \
            --arg runtime_input_sha256 "${RUNTIME_INPUT_SHA256}" \
            --argjson runtime_reused "${RUNTIME_REUSE}" \
            --arg controller_sha256 "${controller_sha}" \
            --arg orchestrator_sha256 "${orchestrator_sha}" \
            --arg agent_sha256 "${agent_sha}" \
            --arg edge_gateway_image "${EDGE_GATEWAY_IMAGE}" \
            --arg edge_warp_egress_image "${EDGE_WARP_EGRESS_IMAGE}" \
            --arg sing_box_version "${SING_BOX_VERSION}" \
            --arg sing_box_linux_sha256 "${SING_BOX_LINUX_SHA256}" \
            --arg sing_box_binary_sha256 "${sing_box_binary_sha}" \
            --arg docker_engine_version "${DOCKER_ENGINE_VERSION}" \
            --arg containerd_version "${CONTAINERD_VERSION}" \
            --arg compose_version "${COMPOSE_VERSION}" \
            --arg warp_version "${WARP_VERSION}" \
            --arg warp_sha256 "${WARP_SHA256}" \
            --arg debian_base_image "${DEBIAN_BASE_IMAGE}" \
            --arg ubuntu_base_image "${UBUNTU_BASE_IMAGE}" \
            --arg mesh_image "${MESH_IMAGE}" \
            '{
              schema:4,
              source_revision:$source_revision,
              runtime_source_revision:$runtime_source_revision,
              runtime_input_sha256:$runtime_input_sha256,
              runtime_reused:$runtime_reused,
              source_tree:$source_tree,
              controller_sha256:$controller_sha256,
              orchestrator_sha256:$orchestrator_sha256,
              agent_sha256:$agent_sha256,
              edge_gateway_image:$edge_gateway_image,
              edge_warp_egress_image:$edge_warp_egress_image,
              sing_box_version:$sing_box_version,
              sing_box_linux_sha256:$sing_box_linux_sha256,
              sing_box_binary_sha256:$sing_box_binary_sha256,
              docker_engine_version:$docker_engine_version,
              containerd_version:$containerd_version,
              compose_version:$compose_version,
              warp_version:$warp_version,
              warp_sha256:$warp_sha256,
              debian_base_image:$debian_base_image,
              ubuntu_base_image:$ubuntu_base_image,
              mesh_image:$mesh_image
            }' > "${out}/manifest.json"
          printf 'edge_agent_sha256=%s\n' "${agent_sha}" >> "${GITHUB_OUTPUT}"
          printf 'edge_controller_sha256=%s\n' "${controller_sha}" >> "${GITHUB_OUTPUT}"
          printf 'edge_orchestrator_sha256=%s\n' "${orchestrator_sha}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_input_sha256=%s\n' "${RUNTIME_INPUT_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_source_revision=%s\n' "${RUNTIME_SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_reused=%s\n' "${RUNTIME_REUSE}" >> "${GITHUB_OUTPUT}"

      - name: Store exact Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/edge-platform-release
          if-no-files-found: error
          retention-days: 30


  release_authority:
    name: Create canonical ReleaseSet candidate
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [dependencies, windows, linux_candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      release_set_sha256: ${{ steps.authority.outputs.release_set_sha256 }}
    steps:
      - name: Download exact platform candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/candidate/windows" "${RUNNER_TEMP}/candidate/linux"
          gh run download "${GITHUB_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-windows-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/candidate/windows"
          gh run download "${GITHUB_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-release-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/candidate/linux"

      - name: Create and verify canonical ReleaseSet
        id: authority
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          SING_BOX_VERSION: ${{ needs.dependencies.outputs.sing_box_version }}
          WINDOWS_ARTIFACT_SHA256: ${{ needs.windows.outputs.artifact_sha256 }}
          WINDOWS_CONTROLLER_SHA256: ${{ needs.windows.outputs.controller_sha256 }}
          WINDOWS_CONSOLE_SHA256: ${{ needs.windows.outputs.console_sha256 }}
          WINDOWS_SING_BOX_SHA256: ${{ needs.windows.outputs.sing_box_binary_sha256 }}
          WINDOWS_INPUT_SHA256: ${{ needs.dependencies.outputs.windows_input_sha256 }}
          WINDOWS_SOURCE_REVISION: ${{ needs.dependencies.outputs.windows_source_revision }}
          LINUX_SING_BOX_SHA256: ${{ needs.linux_candidate.outputs.sing_box_binary_sha256 }}
          EDGE_AGENT_SHA256: ${{ needs.linux_candidate.outputs.edge_agent_sha256 }}
          EDGE_CONTROLLER_SHA256: ${{ needs.linux_candidate.outputs.edge_controller_sha256 }}
          EDGE_ORCHESTRATOR_SHA256: ${{ needs.linux_candidate.outputs.edge_orchestrator_sha256 }}
          RUNTIME_INPUT_SHA256: ${{ needs.linux_candidate.outputs.runtime_input_sha256 }}
          RUNTIME_SOURCE_REVISION: ${{ needs.linux_candidate.outputs.runtime_source_revision }}
          RUNTIME_REUSED: ${{ needs.linux_candidate.outputs.runtime_reused }}
          EDGE_GATEWAY_IMAGE: ${{ needs.linux_candidate.outputs.gateway_ref }}
          EDGE_WARP_EGRESS_IMAGE: ${{ needs.linux_candidate.outputs.warp_ref }}
          DOCKER_ENGINE_VERSION: ${{ needs.dependencies.outputs.docker_engine_version }}
          CONTAINERD_VERSION: ${{ needs.dependencies.outputs.containerd_version }}
          COMPOSE_VERSION: ${{ needs.dependencies.outputs.compose_version }}
          WARP_VERSION: ${{ needs.dependencies.outputs.warp_version }}
          MESH_IMAGE: ${{ needs.dependencies.outputs.mesh_image }}
        run: |
          set -euo pipefail
          windows="${RUNNER_TEMP}/candidate/windows"
          linux="${RUNNER_TEMP}/candidate/linux"
          unpacked="${RUNNER_TEMP}/candidate/windows-package"
          authority="${RUNNER_TEMP}/candidate/release-set"
          tool="${linux}/edge-release-set"
          install -d "${unpacked}" "${authority}"
          chmod 0755 "${tool}"
          unzip -q "${windows}/edge-platform-windows.zip" -d "${unpacked}"

          test "$(sha256sum "${windows}/edge-platform-windows.zip" | awk '{print $1}')" = "${WINDOWS_ARTIFACT_SHA256}"
          test "$(sha256sum "${unpacked}/bin/edge-controller.exe" | awk '{print $1}')" = "${WINDOWS_CONTROLLER_SHA256}"
          test "$(sha256sum "${unpacked}/bin/edge-console.exe" | awk '{print $1}')" = "${WINDOWS_CONSOLE_SHA256}"
          test "$(sha256sum "${unpacked}/bin/sing-box.exe" | awk '{print $1}')" = "${WINDOWS_SING_BOX_SHA256}"
          test "$(sha256sum "${linux}/sing-box-linux" | awk '{print $1}')" = "${LINUX_SING_BOX_SHA256}"
          test "$(sha256sum "${linux}/edge-agent" | awk '{print $1}')" = "${EDGE_AGENT_SHA256}"
          test "$(sha256sum "${linux}/edge-controller" | awk '{print $1}')" = "${EDGE_CONTROLLER_SHA256}"
          test "$(sha256sum "${linux}/edge-orchestrator" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"

          "${tool}" create \
            --output "${authority}/release-set.pb" \
            --sha256-output "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --sing-box-version "${SING_BOX_VERSION}" \
            --windows-sing-box-sha256 "${WINDOWS_SING_BOX_SHA256}" \
            --linux-sing-box-sha256 "${LINUX_SING_BOX_SHA256}" \
            --windows-artifact-sha256 "${WINDOWS_ARTIFACT_SHA256}" \
            --windows-controller-sha256 "${WINDOWS_CONTROLLER_SHA256}" \
            --windows-console-sha256 "${WINDOWS_CONSOLE_SHA256}" \
            --windows-input-sha256 "${WINDOWS_INPUT_SHA256}" \
            --windows-source-revision "${WINDOWS_SOURCE_REVISION}" \
            --edge-agent-sha256 "${EDGE_AGENT_SHA256}" \
            --edge-controller-sha256 "${EDGE_CONTROLLER_SHA256}" \
            --edge-orchestrator-sha256 "${EDGE_ORCHESTRATOR_SHA256}" \
            --runtime-input-sha256 "${RUNTIME_INPUT_SHA256}" \
            --runtime-source-revision "${RUNTIME_SOURCE_REVISION}" \
            --sing-box-image "${EDGE_GATEWAY_IMAGE}" \
            --warp-egress-image "${EDGE_WARP_EGRESS_IMAGE}" \
            --docker-engine-version "${DOCKER_ENGINE_VERSION}" \
            --containerd-version "${CONTAINERD_VERSION}" \
            --compose-version "${COMPOSE_VERSION}" \
            --warp-version "${WARP_VERSION}" \
            --mesh-image "${MESH_IMAGE}"

          verify_output="$("${tool}" verify \
            --input "${authority}/release-set.pb" \
            --sha256-file "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --windows-artifact "${windows}/edge-platform-windows.zip" \
            --windows-controller "${unpacked}/bin/edge-controller.exe" \
            --windows-console "${unpacked}/bin/edge-console.exe" \
            --windows-sing-box "${unpacked}/bin/sing-box.exe" \
            --linux-sing-box "${linux}/sing-box-linux" \
            --edge-agent "${linux}/edge-agent" \
            --edge-controller "${linux}/edge-controller" \
            --edge-orchestrator "${linux}/edge-orchestrator")"
          printf '%s\n' "${verify_output}"

          release_set_sha="$(sed -n 's/^release_set_sha256=//p' <<<"${verify_output}")"
          test "$(wc -l <<<"${release_set_sha}")" -eq 1
          [[ "${release_set_sha}" =~ ^[0-9a-f]{64}$ ]]
          printf 'release_set_sha256=%s\n' "${release_set_sha}" >> "${GITHUB_OUTPUT}"

          vm_verify_output="$("${tool}" verify-vm \
            --input "${authority}/release-set.pb" \
            --sha256-file "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --edge-agent "${linux}/edge-agent" \
            --edge-controller "${linux}/edge-controller" \
            --edge-orchestrator "${linux}/edge-orchestrator")"
          printf '%s\n' "${vm_verify_output}"
          test "$(sed -n 's/^release_set_sha256=//p' <<<"${vm_verify_output}")" = "${release_set_sha}"
          test "$(sed -n 's/^schema_version=//p' <<<"${vm_verify_output}")" = "4"
          test "$(sed -n 's/^source_revision=//p' <<<"${vm_verify_output}")" = "${CANDIDATE_REVISION}"
          test "$(sed -n 's/^edge_agent_sha256=//p' <<<"${vm_verify_output}")" = "${EDGE_AGENT_SHA256}"
          test "$(sed -n 's/^edge_controller_sha256=//p' <<<"${vm_verify_output}")" = "${EDGE_CONTROLLER_SHA256}"
          test "$(sed -n 's/^edge_orchestrator_sha256=//p' <<<"${vm_verify_output}")" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sed -n 's/^runtime_input_sha256=//p' <<<"${vm_verify_output}")" = "${RUNTIME_INPUT_SHA256}"
          test "$(sed -n 's/^runtime_source_revision=//p' <<<"${vm_verify_output}")" = "${RUNTIME_SOURCE_REVISION}"
          test "$(sed -n 's/^sing_box_image=//p' <<<"${vm_verify_output}")" = "${EDGE_GATEWAY_IMAGE}"
          test "$(sed -n 's/^warp_egress_image=//p' <<<"${vm_verify_output}")" = "${EDGE_WARP_EGRESS_IMAGE}"
          test "$(sed -n 's/^mesh_image=//p' <<<"${vm_verify_output}")" = "${MESH_IMAGE}"
          test "$(sed -n 's/^docker_engine_version=//p' <<<"${vm_verify_output}")" = "${DOCKER_ENGINE_VERSION}"
          test "$(sed -n 's/^containerd_version=//p' <<<"${vm_verify_output}")" = "${CONTAINERD_VERSION}"
          test "$(sed -n 's/^compose_version=//p' <<<"${vm_verify_output}")" = "${COMPOSE_VERSION}"

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools inspect "${EDGE_GATEWAY_IMAGE}" >/dev/null
          docker buildx imagetools inspect "${EDGE_WARP_EGRESS_IMAGE}" >/dev/null
          docker logout ghcr.io >/dev/null
          docker buildx imagetools inspect "${MESH_IMAGE}" >/dev/null

          {
            echo '### Canonical ReleaseSet candidate'
            echo
            echo "- source: \`${CANDIDATE_REVISION}\`"
            echo "- release-set SHA-256: \`${release_set_sha}\`"
            echo "- Docker Engine package: \`${DOCKER_ENGINE_VERSION}\`"
            echo "- containerd package: \`${CONTAINERD_VERSION}\`"
            echo "- Compose package: \`${COMPOSE_VERSION}\`"
            echo "- VM runtime input: \`${RUNTIME_INPUT_SHA256}\`"
            echo "- VM runtime source: \`${RUNTIME_SOURCE_REVISION}\`"
            echo "- VM runtime reused: \`${RUNTIME_REUSED}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Store canonical ReleaseSet candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-set-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate/release-set
          if-no-files-found: error
          retention-days: 30

  candidate_complete:
    name: Candidate complete
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [verify, dependencies, windows, linux_candidate, release_authority]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete exact candidate
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          SOURCE_RESULT: ${{ needs.verify.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux_candidate.result }}
          RELEASE_AUTHORITY_RESULT: ${{ needs.release_authority.result }}
          RELEASE_SET_SHA256: ${{ needs.release_authority.outputs.release_set_sha256 }}
        run: |
          set -euo pipefail
          test "${SOURCE_RESULT}" = "success"
          test "${DEPENDENCIES_RESULT}" = "success"
          test "${WINDOWS_RESULT}" = "success"
          test "${LINUX_RESULT}" = "success"
          test "${RELEASE_AUTHORITY_RESULT}" = "success"
          [[ "${RELEASE_SET_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          echo "candidate_revision=${CANDIDATE_REVISION}"
          echo "release_set_sha256=${RELEASE_SET_SHA256}"
          echo "All candidate build and verification jobs passed."

  promote:
    name: Promote accepted candidate
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - name: Locate exact successful candidate
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${ACCEPTED_REVISION}" =~ ^[0-9a-f]{40}$ ]]

          candidate_revision="${EVENT_CANDIDATE_REVISION}"
          [[ "${candidate_revision}" =~ ^[0-9a-f]{40}$ ]]

          accepted_tree="$(gh api "repos/${REPOSITORY}/git/commits/${ACCEPTED_REVISION}" --jq '.tree.sha')"
          candidate_tree="$(gh api "repos/${REPOSITORY}/git/commits/${candidate_revision}" --jq '.tree.sha')"
          test "${accepted_tree}" = "${candidate_tree}"

          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/edge-platform-ci.yml/runs?event=pull_request&head_sha=${candidate_revision}&per_page=100")"
          latest_run="$(jq -cer --arg head "${candidate_revision}" --argjson current_run_id "${CURRENT_RUN_ID}" '
            [.workflow_runs[]
              | select(.head_sha == $head)
              | select(.event == "pull_request")
              | select(.id != $current_run_id)
              | select(.status == "completed")
              | select(.conclusion == "success")]
            | sort_by(.id)
            | last
          ' <<<"${runs}")"
          test "$(jq -er '.status' <<<"${latest_run}")" = "completed"
          test "$(jq -er '.conclusion' <<<"${latest_run}")" = "success"
          candidate_run_id="$(jq -er '.id' <<<"${latest_run}")"

          printf 'accepted_revision=%s\n' "${ACCEPTED_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_revision=%s\n' "${candidate_revision}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_tree=%s\n' "${candidate_tree}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_run_id=%s\n' "${candidate_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download exact candidate artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REVISION: ${{ steps.locate.outputs.candidate_revision }}
          CANDIDATE_RUN_ID: ${{ steps.locate.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/accepted/windows" "${RUNNER_TEMP}/accepted/linux" "${RUNNER_TEMP}/accepted/release-set"
          gh run download "${CANDIDATE_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-windows-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/accepted/windows"
          gh run download "${CANDIDATE_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-release-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/accepted/linux"
          gh run download "${CANDIDATE_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-release-set-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/accepted/release-set"

      - name: Verify exact candidate provenance
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACCEPTED_REVISION: ${{ steps.locate.outputs.accepted_revision }}
          CANDIDATE_REVISION: ${{ steps.locate.outputs.candidate_revision }}
          CANDIDATE_TREE: ${{ steps.locate.outputs.candidate_tree }}
          CANDIDATE_RUN_ID: ${{ steps.locate.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          windows="${RUNNER_TEMP}/accepted/windows"
          linux="${RUNNER_TEMP}/accepted/linux"

          test "$(jq -er '.source_revision' "${windows}/manifest.json")" = "${CANDIDATE_REVISION}"
          test "$(jq -er '.source_tree' "${windows}/manifest.json")" = "${CANDIDATE_TREE}"
          test "$(jq -er '.source_revision' "${linux}/manifest.json")" = "${CANDIDATE_REVISION}"
          test "$(jq -er '.source_tree' "${linux}/manifest.json")" = "${CANDIDATE_TREE}"
          test "$(jq -er '.schema' "${linux}/manifest.json")" = "4"
          jq -e '.runtime_input_sha256 | test("^[0-9a-f]{64}$")' "${linux}/manifest.json" >/dev/null
          jq -e '.runtime_source_revision | test("^[0-9a-f]{40}$")' "${linux}/manifest.json" >/dev/null
          jq -e '.runtime_reused | type == "boolean"' "${linux}/manifest.json" >/dev/null

          authority="${RUNNER_TEMP}/accepted/release-set"
          unpacked="${RUNNER_TEMP}/accepted/windows-package"
          tool="${linux}/edge-release-set"
          install -d "${unpacked}"
          chmod 0755 "${tool}"
          unzip -q "${windows}/edge-platform-windows.zip" -d "${unpacked}"

          verify_output="$("${tool}" verify \
            --input "${authority}/release-set.pb" \
            --sha256-file "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --windows-artifact "${windows}/edge-platform-windows.zip" \
            --windows-controller "${unpacked}/bin/edge-controller.exe" \
            --windows-console "${unpacked}/bin/edge-console.exe" \
            --windows-sing-box "${unpacked}/bin/sing-box.exe" \
            --linux-sing-box "${linux}/sing-box-linux" \
            --edge-agent "${linux}/edge-agent" \
            --edge-controller "${linux}/edge-controller" \
            --edge-orchestrator "${linux}/edge-orchestrator")"
          printf '%s\n' "${verify_output}"

          gateway_ref="$(sed -n 's/^sing_box_image=//p' <<<"${verify_output}")"
          warp_ref="$(sed -n 's/^warp_egress_image=//p' <<<"${verify_output}")"
          mesh_ref="$(sed -n 's/^mesh_image=//p' <<<"${verify_output}")"
          [[ "${gateway_ref}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
          [[ "${warp_ref}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]
          [[ "${mesh_ref}" =~ ^docker\.io/cloudflare/mesh@sha256:[0-9a-f]{64}$ ]]

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools inspect "${gateway_ref}" >/dev/null
          docker buildx imagetools inspect "${warp_ref}" >/dev/null
          docker logout ghcr.io >/dev/null
          docker buildx imagetools inspect "${mesh_ref}" >/dev/null

          jq -n \
            --arg accepted_revision "${ACCEPTED_REVISION}" \
            --arg candidate_revision "${CANDIDATE_REVISION}" \
            --arg source_tree "${CANDIDATE_TREE}" \
            --arg candidate_run_id "${CANDIDATE_RUN_ID}" \
            '{
              schema:1,
              accepted_revision:$accepted_revision,
              candidate_revision:$candidate_revision,
              source_tree:$source_tree,
              candidate_run_id:$candidate_run_id
            }' > "${windows}/acceptance.json"
          cp "${windows}/acceptance.json" "${linux}/acceptance.json"
          cp "${windows}/acceptance.json" "${authority}/acceptance.json"

      - name: Publish durable immutable release without rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ steps.locate.outputs.accepted_revision }}
          CANDIDATE_REVISION: ${{ steps.locate.outputs.candidate_revision }}
          CANDIDATE_RUN_ID: ${{ steps.locate.outputs.candidate_run_id }}
          WINDOWS_DIR: ${{ runner.temp }}/accepted/windows
          LINUX_DIR: ${{ runner.temp }}/accepted/linux
          RELEASE_SET_DIR: ${{ runner.temp }}/accepted/release-set
          OUTPUT_DIR: ${{ runner.temp }}/durable-release
        run: |
          set -euo pipefail
          publisher="${RUNNER_TEMP}/publish-durable-release.sh"
          payload="$(gh api "repos/${REPOSITORY}/contents/edge-platform/scripts/publish_durable_release.sh?ref=${ACCEPTED_REVISION}")"
          test "$(jq -er '.type' <<<"${payload}")" = "file"
          test "$(jq -er '.encoding' <<<"${payload}")" = "base64"
          jq -r '.content' <<<"${payload}" | tr -d '\n' | base64 --decode > "${publisher}"
          bash -n "${publisher}"
          bash "${publisher}"

      - name: Publish accepted Windows artifact without rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-windows-${{ steps.locate.outputs.accepted_revision }}
          path: ${{ runner.temp }}/accepted/windows
          if-no-files-found: error
          retention-days: 30

      - name: Publish accepted Linux artifact without rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-${{ steps.locate.outputs.accepted_revision }}
          path: ${{ runner.temp }}/accepted/linux
          if-no-files-found: error
          retention-days: 30

      - name: Publish accepted ReleaseSet without rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-set-${{ steps.locate.outputs.accepted_revision }}
          path: ${{ runner.temp }}/accepted/release-set
          if-no-files-found: error
          retention-days: 30
)) {
              throw "base durable release tag is invalid"
            }
            gh release download $env:BASE_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "edge-platform-windows.zip" --dir $out
            if ($LASTEXITCODE -ne 0) { throw "failed to download exact accepted Windows artifact" }
            $artifactSha = (Get-FileHash -Algorithm SHA256 $packagePath).Hash.ToLowerInvariant()
            if ($artifactSha -ne $env:BASE_ARTIFACT_SHA256) {
              throw "reused Windows artifact digest mismatch"
            }
            $unpacked = Join-Path $env:RUNNER_TEMP "edge-platform-windows-reused"
            Expand-Archive -LiteralPath $packagePath -DestinationPath $unpacked -Force
            Copy-Item (Join-Path $unpacked "bin\edge-controller.exe") (Join-Path $out "edge-controller.exe")
            Copy-Item (Join-Path $unpacked "bin\edge-console.exe") (Join-Path $out "edge-console.exe")
            Copy-Item (Join-Path $unpacked "bin\sing-box.exe") (Join-Path $out "sing-box.exe")
          } else {
            Copy-Item "edge-platform\target\release\edge-controller.exe" (Join-Path $out "edge-controller.exe")
            Copy-Item "edge-platform\target\release\edge-console.exe" (Join-Path $out "edge-console.exe")
            $resolvedSingBox = Get-ChildItem (Join-Path $env:RUNNER_TEMP "sing-box-windows") -Recurse -File -Filter sing-box.exe | Select-Object -First 1
            if (-not $resolvedSingBox) { throw "verified sing-box.exe candidate is missing" }
            Copy-Item $resolvedSingBox.FullName (Join-Path $out "sing-box.exe")

            $packageRoot = Join-Path $env:RUNNER_TEMP "edge-platform-windows-package"
            $packageBin = Join-Path $packageRoot "bin"
            New-Item -ItemType Directory -Force -Path $packageBin | Out-Null
            Copy-Item (Join-Path $out "edge-controller.exe") (Join-Path $packageBin "edge-controller.exe")
            Copy-Item (Join-Path $out "edge-console.exe") (Join-Path $packageBin "edge-console.exe")
            Copy-Item (Join-Path $out "sing-box.exe") (Join-Path $packageBin "sing-box.exe")
            Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $packagePath -CompressionLevel Optimal
            $artifactSha = (Get-FileHash -Algorithm SHA256 $packagePath).Hash.ToLowerInvariant()
          }

          $artifactSha = (Get-FileHash -Algorithm SHA256 $packagePath).Hash.ToLowerInvariant()
          $controllerSha = (Get-FileHash -Algorithm SHA256 (Join-Path $out "edge-controller.exe")).Hash.ToLowerInvariant()
          $consoleSha = (Get-FileHash -Algorithm SHA256 (Join-Path $out "edge-console.exe")).Hash.ToLowerInvariant()
          $singBoxSha = (Get-FileHash -Algorithm SHA256 (Join-Path $out "sing-box.exe")).Hash.ToLowerInvariant()

          if ($env:REUSE_WINDOWS -eq "true") {
            if ($controllerSha -ne $env:BASE_CONTROLLER_SHA256) { throw "reused Windows controller digest mismatch" }
            if ($consoleSha -ne $env:BASE_CONSOLE_SHA256) { throw "reused Windows console digest mismatch" }
            if ($singBoxSha -ne $env:BASE_SING_BOX_SHA256) { throw "reused Windows sing-box digest mismatch" }
          }

          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          $manifest = [ordered]@{
            schema = 3
            source_revision = $env:CANDIDATE_REVISION
            source_tree = $sourceTree
            windows_input_sha256 = $env:WINDOWS_INPUT_SHA256
            windows_source_revision = $env:WINDOWS_SOURCE_REVISION
            reused = ($env:REUSE_WINDOWS -eq "true")
            sing_box_version = $env:SING_BOX_VERSION
            sing_box_archive_sha256 = $env:SING_BOX_WINDOWS_SHA256
            sing_box_binary_sha256 = $singBoxSha
            artifact_sha256 = $artifactSha
            controller_sha256 = $controllerSha
            console_sha256 = $consoleSha
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $out "manifest.json")
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "artifact_sha256=$artifactSha"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "controller_sha256=$controllerSha"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "console_sha256=$consoleSha"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sing_box_binary_sha256=$singBoxSha"

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Windows candidate"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- reuse: `$env:REUSE_WINDOWS`"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- input SHA-256: `$env:WINDOWS_INPUT_SHA256`"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- artifact source revision: `$env:WINDOWS_SOURCE_REVISION`"
      # WINDOWS_CANDIDATE_BUILD_CONTRACT_END

      - name: Store exact Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-windows-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/edge-platform-windows
          if-no-files-found: error
          retention-days: 30


  linux_candidate:
    name: Build Linux and OCI candidate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor_id == '44100369'
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      gateway_ref: ${{ steps.images.outputs.gateway_ref }}
      warp_ref: ${{ steps.images.outputs.warp_ref }}
      sing_box_binary_sha256: ${{ steps.images.outputs.sing_box_binary_sha256 }}
      edge_agent_sha256: ${{ steps.package.outputs.edge_agent_sha256 }}
      edge_controller_sha256: ${{ steps.package.outputs.edge_controller_sha256 }}
      edge_orchestrator_sha256: ${{ steps.package.outputs.edge_orchestrator_sha256 }}
      runtime_input_sha256: ${{ steps.package.outputs.runtime_input_sha256 }}
      runtime_source_revision: ${{ steps.package.outputs.runtime_source_revision }}
      runtime_reused: ${{ steps.package.outputs.runtime_reused }}
    steps:
      - name: Checkout exact candidate revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Build exact reusable Linux binaries
        working-directory: edge-platform
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p edge-controller --bin edge-controller
          cargo build --locked --release -p edge-orchestrator --bin edge-orchestrator
          cargo build --locked --release -p edge-agent --bin edge-agent
          cargo build --locked --release -p edge-shared-types --bin edge-release-set

      - name: Resolve exact accepted VM runtime reuse
        id: runtime_reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          RUNTIME_INPUT_SHA256: ${{ needs.dependencies.outputs.runtime_input_sha256 }}
        run: |
          set -euo pipefail
          base_dir="${RUNNER_TEMP}/base-edge-platform-release"
          ACCEPTED_REVISION="${BASE_REVISION}" OUTPUT_DIR="${base_dir}" \
            bash edge-platform/scripts/resolve_durable_release.sh
          source "${base_dir}/resolved.env"

          decision="$(python3 edge-platform/scripts/runtime_input_digest.py decide \
            --candidate-digest "${RUNTIME_INPUT_SHA256}" \
            --base-schema "${EDGE_RELEASE_SCHEMA_VERSION}" \
            --base-digest "${EDGE_RUNTIME_INPUT_SHA256}" \
            --base-runtime-source-revision "${EDGE_RUNTIME_SOURCE_REVISION}" \
            --base-agent-sha256 "${EDGE_AGENT_SHA256}" \
            --gateway-ref "${EDGE_GATEWAY_IMAGE}" \
            --warp-ref "${EDGE_WARP_EGRESS_IMAGE}")"
          test "${decision}" = "REUSE" || test "${decision}" = "BUILD"

          reuse=false
          runtime_source_revision="${CANDIDATE_REVISION}"
          if [[ "${decision}" = "REUSE" ]]; then
            candidate_agent_sha="$(sha256sum edge-platform/target/release/edge-agent | awk '{print $1}')"
            test "${candidate_agent_sha}" = "${EDGE_AGENT_SHA256}" || {
              echo "equal runtime input digest produced different edge-agent bytes" >&2
              exit 1
            }
            reuse=true
            runtime_source_revision="${EDGE_RUNTIME_SOURCE_REVISION}"
            printf 'base_agent_path=%s\n' "${base_dir}/edge-agent-linux-amd64" >> "${GITHUB_OUTPUT}"
            printf 'gateway_ref=%s\n' "${EDGE_GATEWAY_IMAGE}" >> "${GITHUB_OUTPUT}"
            printf 'warp_ref=%s\n' "${EDGE_WARP_EGRESS_IMAGE}" >> "${GITHUB_OUTPUT}"
          fi

          printf 'reuse=%s\n' "${reuse}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_source_revision=%s\n' "${runtime_source_revision}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_input_sha256=%s\n' "${RUNTIME_INPUT_SHA256}" >> "${GITHUB_OUTPUT}"

          {
            echo '### VM runtime reuse decision'
            echo
            echo "- decision: \`${decision}\`"
            echo "- candidate runtime input: \`${RUNTIME_INPUT_SHA256}\`"
            echo "- base schema: \`${EDGE_RELEASE_SCHEMA_VERSION}\`"
            echo "- base runtime input: \`${EDGE_RUNTIME_INPUT_SHA256:-legacy-missing}\`"
            echo "- runtime source revision: \`${runtime_source_revision}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build or reuse exact candidate images
        id: images
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          REUSE_RUNTIME: ${{ steps.runtime_reuse.outputs.reuse }}
          REUSED_GATEWAY_REF: ${{ steps.runtime_reuse.outputs.gateway_ref }}
          REUSED_WARP_REF: ${{ steps.runtime_reuse.outputs.warp_ref }}
          SING_BOX_VERSION: ${{ needs.dependencies.outputs.sing_box_version }}
          SING_BOX_URL: ${{ needs.dependencies.outputs.sing_box_linux_url }}
          SING_BOX_SHA256: ${{ needs.dependencies.outputs.sing_box_linux_sha256 }}
          WARP_VERSION: ${{ needs.dependencies.outputs.warp_version }}
          WARP_URL: ${{ needs.dependencies.outputs.warp_url }}
          WARP_SHA256: ${{ needs.dependencies.outputs.warp_sha256 }}
          DEBIAN_BASE_IMAGE: ${{ needs.dependencies.outputs.debian_base_image }}
          UBUNTU_BASE_IMAGE: ${{ needs.dependencies.outputs.ubuntu_base_image }}
        run: |
          set -euo pipefail
          registry="ghcr.io"
          owner="iamaman11"
          printf '%s' "${GHCR_TOKEN}" | docker login "${registry}" -u "${GITHUB_ACTOR}" --password-stdin

          if [[ "${REUSE_RUNTIME}" = "true" ]]; then
            gateway_ref="${REUSED_GATEWAY_REF}"
            warp_ref="${REUSED_WARP_REF}"
            [[ "${gateway_ref}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
            [[ "${warp_ref}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]
            docker pull "${gateway_ref}" >/dev/null
            docker pull "${warp_ref}" >/dev/null
            evidence_image="${gateway_ref}"
          else
            # VM_RUNTIME_BUILD_CONTRACT_BEGIN
            build_tag="candidate-${CANDIDATE_REVISION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gateway_tag="${registry}/${owner}/vultr-edge-gateway:${build_tag}"
            warp_tag="${registry}/${owner}/vultr-warp-egress:${build_tag}"

            docker build \
              --label "org.opencontainers.image.revision=${CANDIDATE_REVISION}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --build-arg "BASE_IMAGE=${DEBIAN_BASE_IMAGE}" \
              --build-arg "SING_BOX_VERSION=${SING_BOX_VERSION}" \
              --build-arg "SING_BOX_URL=${SING_BOX_URL}" \
              --build-arg "SING_BOX_SHA256=${SING_BOX_SHA256}" \
              -t "${gateway_tag}" \
              win/vultr-waw/stack/edge-gateway
            docker push "${gateway_tag}"

            docker build \
              --label "org.opencontainers.image.revision=${CANDIDATE_REVISION}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --build-arg "BASE_IMAGE=${UBUNTU_BASE_IMAGE}" \
              --build-arg "WARP_VERSION=${WARP_VERSION}" \
              --build-arg "WARP_URL=${WARP_URL}" \
              --build-arg "WARP_SHA256=${WARP_SHA256}" \
              -t "${warp_tag}" \
              win/vultr-waw/stack/warp-egress
            docker push "${warp_tag}"
            # VM_RUNTIME_BUILD_CONTRACT_END

            gateway_digest="$(docker buildx imagetools inspect "${gateway_tag}" --format '{{json .Manifest.Digest}}' | jq -er '.')"
            warp_digest="$(docker buildx imagetools inspect "${warp_tag}" --format '{{json .Manifest.Digest}}' | jq -er '.')"
            [[ "${gateway_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "${warp_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            gateway_ref="${registry}/${owner}/vultr-edge-gateway@${gateway_digest}"
            warp_ref="${registry}/${owner}/vultr-warp-egress@${warp_digest}"
            evidence_image="${gateway_tag}"
          fi

          sing_box_evidence="${RUNNER_TEMP}/sing-box-linux"
          gateway_container="$(docker create "${evidence_image}")"
          docker cp "${gateway_container}:/usr/local/bin/sing-box" "${sing_box_evidence}"
          docker rm "${gateway_container}" >/dev/null
          chmod 0755 "${sing_box_evidence}"
          sing_box_binary_sha="$(sha256sum "${sing_box_evidence}" | awk '{print $1}')"

          config_check="${RUNNER_TEMP}/sing-box-config-check"
          install -d -m 0755 "${config_check}"
          export PROXY_USERNAME="ci-user"
          export PROXY_PASSWORD="ci-password"
          export PROXY_CERT_CN="edge.example.com"
          export VLESS_UUID="11111111-1111-4111-8111-111111111111"
          export HY2_PASSWORD="ci-hy2-direct"
          export REALITY_PRIVATE_KEY="UuMBgl7MXTPx9inmQp2UC7Jcnwc6XYbwDNebonM-FCc"
          export REALITY_PUBLIC_KEY="jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0"
          export REALITY_SHORT_ID="0123456789abcdef"
          export VLESS_WARP_UUID="22222222-2222-4222-8222-222222222222"
          export HY2_WARP_PASSWORD="ci-hy2-warp"
          export REALITY_WARP_PRIVATE_KEY="UuMBgl7MXTPx9inmQp2UC7Jcnwc6XYbwDNebonM-FCc"
          export REALITY_WARP_PUBLIC_KEY="jNXHt1yRo0vDuchQlIP6Z0ZvjT3KtzVI-T4E7RoLJS0"
          export REALITY_WARP_SHORT_ID="abcdef0123456789"
          export REALITY_SERVER_NAME="www.microsoft.com"
          export TUNNEL_DOMAIN="edge.example.com"
          export ACME_EMAIL="admin@example.com"
          export ACME_PROVIDER="letsencrypt"
          export PROXY_CERT_PATH="${config_check}/proxy.crt"
          export PROXY_KEY_PATH="${config_check}/proxy.key"
          export CONFIG_CHECK_DIR="${config_check}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("win/vultr-waw/stack")
          out = Path(os.environ["CONFIG_CHECK_DIR"])
          for source, target in [
              (root / "line1-gateway/config.template.json", out / "line1-gateway.json"),
              (root / "line2-proxy/config.template.json", out / "line2-proxy.json"),
          ]:
              payload = json.loads(os.path.expandvars(source.read_text()))
              for inbound in payload.get("inbounds", []):
                  tls = inbound.get("tls")
                  if not isinstance(tls, dict):
                      continue
                  if tls.get("certificate_path") == "/certs/proxy.crt":
                      tls["certificate_path"] = str(out / "proxy.crt")
                  if tls.get("key_path") == "/certs/proxy.key":
                      tls["key_path"] = str(out / "proxy.key")
              target.write_text(json.dumps(payload, indent=2) + "\n")
          PY
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "${config_check}/proxy.key" \
            -out "${config_check}/proxy.crt" \
            -days 1 \
            -subj "/CN=edge.example.com" >/dev/null 2>&1
          "${sing_box_evidence}" check -c "${config_check}/line1-gateway.json"
          "${sing_box_evidence}" check -c "${config_check}/line2-proxy.json"

          docker buildx imagetools inspect "${gateway_ref}" >/dev/null
          docker buildx imagetools inspect "${warp_ref}" >/dev/null
          docker logout "${registry}" >/dev/null

          printf 'gateway_ref=%s\n' "${gateway_ref}" >> "${GITHUB_OUTPUT}"
          printf 'warp_ref=%s\n' "${warp_ref}" >> "${GITHUB_OUTPUT}"
          printf 'sing_box_binary_sha256=%s\n' "${sing_box_binary_sha}" >> "${GITHUB_OUTPUT}"

      - name: Package exact Linux candidate
        id: package
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          RUNTIME_REUSE: ${{ steps.runtime_reuse.outputs.reuse }}
          REUSED_AGENT_PATH: ${{ steps.runtime_reuse.outputs.base_agent_path }}
          RUNTIME_SOURCE_REVISION: ${{ steps.runtime_reuse.outputs.runtime_source_revision }}
          RUNTIME_INPUT_SHA256: ${{ steps.runtime_reuse.outputs.runtime_input_sha256 }}
          EDGE_GATEWAY_IMAGE: ${{ steps.images.outputs.gateway_ref }}
          EDGE_WARP_EGRESS_IMAGE: ${{ steps.images.outputs.warp_ref }}
          SING_BOX_VERSION: ${{ needs.dependencies.outputs.sing_box_version }}
          SING_BOX_LINUX_SHA256: ${{ needs.dependencies.outputs.sing_box_linux_sha256 }}
          SING_BOX_BINARY_SHA256: ${{ steps.images.outputs.sing_box_binary_sha256 }}
          DOCKER_ENGINE_VERSION: ${{ needs.dependencies.outputs.docker_engine_version }}
          CONTAINERD_VERSION: ${{ needs.dependencies.outputs.containerd_version }}
          COMPOSE_VERSION: ${{ needs.dependencies.outputs.compose_version }}
          WARP_VERSION: ${{ needs.dependencies.outputs.warp_version }}
          WARP_SHA256: ${{ needs.dependencies.outputs.warp_sha256 }}
          DEBIAN_BASE_IMAGE: ${{ needs.dependencies.outputs.debian_base_image }}
          UBUNTU_BASE_IMAGE: ${{ needs.dependencies.outputs.ubuntu_base_image }}
          MESH_IMAGE: ${{ needs.dependencies.outputs.mesh_image }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/edge-platform-release"
          install -d -m 0755 "${out}"
          install -m 0755 edge-platform/target/release/edge-controller "${out}/edge-controller"
          install -m 0755 edge-platform/target/release/edge-orchestrator "${out}/edge-orchestrator"
          if [[ "${RUNTIME_REUSE}" = "true" ]]; then
            test -f "${REUSED_AGENT_PATH}"
            install -m 0755 "${REUSED_AGENT_PATH}" "${out}/edge-agent"
          else
            install -m 0755 edge-platform/target/release/edge-agent "${out}/edge-agent"
          fi
          install -m 0755 edge-platform/target/release/edge-release-set "${out}/edge-release-set"
          install -m 0755 "${RUNNER_TEMP}/sing-box-linux" "${out}/sing-box-linux"

          controller_sha="$(sha256sum "${out}/edge-controller" | awk '{print $1}')"
          orchestrator_sha="$(sha256sum "${out}/edge-orchestrator" | awk '{print $1}')"
          agent_sha="$(sha256sum "${out}/edge-agent" | awk '{print $1}')"
          sing_box_binary_sha="$(sha256sum "${out}/sing-box-linux" | awk '{print $1}')"
          test "${sing_box_binary_sha}" = "${SING_BOX_BINARY_SHA256}"
          source_tree="$(git rev-parse 'HEAD^{tree}')"

          [[ "${EDGE_GATEWAY_IMAGE}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
          [[ "${EDGE_WARP_EGRESS_IMAGE}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]

          jq -n \
            --arg source_revision "${CANDIDATE_REVISION}" \
            --arg source_tree "${source_tree}" \
            --arg runtime_source_revision "${RUNTIME_SOURCE_REVISION}" \
            --arg runtime_input_sha256 "${RUNTIME_INPUT_SHA256}" \
            --argjson runtime_reused "${RUNTIME_REUSE}" \
            --arg controller_sha256 "${controller_sha}" \
            --arg orchestrator_sha256 "${orchestrator_sha}" \
            --arg agent_sha256 "${agent_sha}" \
            --arg edge_gateway_image "${EDGE_GATEWAY_IMAGE}" \
            --arg edge_warp_egress_image "${EDGE_WARP_EGRESS_IMAGE}" \
            --arg sing_box_version "${SING_BOX_VERSION}" \
            --arg sing_box_linux_sha256 "${SING_BOX_LINUX_SHA256}" \
            --arg sing_box_binary_sha256 "${sing_box_binary_sha}" \
            --arg docker_engine_version "${DOCKER_ENGINE_VERSION}" \
            --arg containerd_version "${CONTAINERD_VERSION}" \
            --arg compose_version "${COMPOSE_VERSION}" \
            --arg warp_version "${WARP_VERSION}" \
            --arg warp_sha256 "${WARP_SHA256}" \
            --arg debian_base_image "${DEBIAN_BASE_IMAGE}" \
            --arg ubuntu_base_image "${UBUNTU_BASE_IMAGE}" \
            --arg mesh_image "${MESH_IMAGE}" \
            '{
              schema:4,
              source_revision:$source_revision,
              runtime_source_revision:$runtime_source_revision,
              runtime_input_sha256:$runtime_input_sha256,
              runtime_reused:$runtime_reused,
              source_tree:$source_tree,
              controller_sha256:$controller_sha256,
              orchestrator_sha256:$orchestrator_sha256,
              agent_sha256:$agent_sha256,
              edge_gateway_image:$edge_gateway_image,
              edge_warp_egress_image:$edge_warp_egress_image,
              sing_box_version:$sing_box_version,
              sing_box_linux_sha256:$sing_box_linux_sha256,
              sing_box_binary_sha256:$sing_box_binary_sha256,
              docker_engine_version:$docker_engine_version,
              containerd_version:$containerd_version,
              compose_version:$compose_version,
              warp_version:$warp_version,
              warp_sha256:$warp_sha256,
              debian_base_image:$debian_base_image,
              ubuntu_base_image:$ubuntu_base_image,
              mesh_image:$mesh_image
            }' > "${out}/manifest.json"
          printf 'edge_agent_sha256=%s\n' "${agent_sha}" >> "${GITHUB_OUTPUT}"
          printf 'edge_controller_sha256=%s\n' "${controller_sha}" >> "${GITHUB_OUTPUT}"
          printf 'edge_orchestrator_sha256=%s\n' "${orchestrator_sha}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_input_sha256=%s\n' "${RUNTIME_INPUT_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_source_revision=%s\n' "${RUNTIME_SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'runtime_reused=%s\n' "${RUNTIME_REUSE}" >> "${GITHUB_OUTPUT}"

      - name: Store exact Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/edge-platform-release
          if-no-files-found: error
          retention-days: 30


  release_authority:
    name: Create canonical ReleaseSet candidate
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [dependencies, windows, linux_candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      release_set_sha256: ${{ steps.authority.outputs.release_set_sha256 }}
    steps:
      - name: Download exact platform candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/candidate/windows" "${RUNNER_TEMP}/candidate/linux"
          gh run download "${GITHUB_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-windows-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/candidate/windows"
          gh run download "${GITHUB_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-release-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/candidate/linux"

      - name: Create and verify canonical ReleaseSet
        id: authority
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          SING_BOX_VERSION: ${{ needs.dependencies.outputs.sing_box_version }}
          WINDOWS_ARTIFACT_SHA256: ${{ needs.windows.outputs.artifact_sha256 }}
          WINDOWS_CONTROLLER_SHA256: ${{ needs.windows.outputs.controller_sha256 }}
          WINDOWS_CONSOLE_SHA256: ${{ needs.windows.outputs.console_sha256 }}
          WINDOWS_SING_BOX_SHA256: ${{ needs.windows.outputs.sing_box_binary_sha256 }}
          LINUX_SING_BOX_SHA256: ${{ needs.linux_candidate.outputs.sing_box_binary_sha256 }}
          EDGE_AGENT_SHA256: ${{ needs.linux_candidate.outputs.edge_agent_sha256 }}
          EDGE_CONTROLLER_SHA256: ${{ needs.linux_candidate.outputs.edge_controller_sha256 }}
          EDGE_ORCHESTRATOR_SHA256: ${{ needs.linux_candidate.outputs.edge_orchestrator_sha256 }}
          RUNTIME_INPUT_SHA256: ${{ needs.linux_candidate.outputs.runtime_input_sha256 }}
          RUNTIME_SOURCE_REVISION: ${{ needs.linux_candidate.outputs.runtime_source_revision }}
          RUNTIME_REUSED: ${{ needs.linux_candidate.outputs.runtime_reused }}
          EDGE_GATEWAY_IMAGE: ${{ needs.linux_candidate.outputs.gateway_ref }}
          EDGE_WARP_EGRESS_IMAGE: ${{ needs.linux_candidate.outputs.warp_ref }}
          DOCKER_ENGINE_VERSION: ${{ needs.dependencies.outputs.docker_engine_version }}
          CONTAINERD_VERSION: ${{ needs.dependencies.outputs.containerd_version }}
          COMPOSE_VERSION: ${{ needs.dependencies.outputs.compose_version }}
          WARP_VERSION: ${{ needs.dependencies.outputs.warp_version }}
          MESH_IMAGE: ${{ needs.dependencies.outputs.mesh_image }}
        run: |
          set -euo pipefail
          windows="${RUNNER_TEMP}/candidate/windows"
          linux="${RUNNER_TEMP}/candidate/linux"
          unpacked="${RUNNER_TEMP}/candidate/windows-package"
          authority="${RUNNER_TEMP}/candidate/release-set"
          tool="${linux}/edge-release-set"
          install -d "${unpacked}" "${authority}"
          chmod 0755 "${tool}"
          unzip -q "${windows}/edge-platform-windows.zip" -d "${unpacked}"

          test "$(sha256sum "${windows}/edge-platform-windows.zip" | awk '{print $1}')" = "${WINDOWS_ARTIFACT_SHA256}"
          test "$(sha256sum "${unpacked}/bin/edge-controller.exe" | awk '{print $1}')" = "${WINDOWS_CONTROLLER_SHA256}"
          test "$(sha256sum "${unpacked}/bin/edge-console.exe" | awk '{print $1}')" = "${WINDOWS_CONSOLE_SHA256}"
          test "$(sha256sum "${unpacked}/bin/sing-box.exe" | awk '{print $1}')" = "${WINDOWS_SING_BOX_SHA256}"
          test "$(sha256sum "${linux}/sing-box-linux" | awk '{print $1}')" = "${LINUX_SING_BOX_SHA256}"
          test "$(sha256sum "${linux}/edge-agent" | awk '{print $1}')" = "${EDGE_AGENT_SHA256}"
          test "$(sha256sum "${linux}/edge-controller" | awk '{print $1}')" = "${EDGE_CONTROLLER_SHA256}"
          test "$(sha256sum "${linux}/edge-orchestrator" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"

          "${tool}" create \
            --output "${authority}/release-set.pb" \
            --sha256-output "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --sing-box-version "${SING_BOX_VERSION}" \
            --windows-sing-box-sha256 "${WINDOWS_SING_BOX_SHA256}" \
            --linux-sing-box-sha256 "${LINUX_SING_BOX_SHA256}" \
            --windows-artifact-sha256 "${WINDOWS_ARTIFACT_SHA256}" \
            --windows-controller-sha256 "${WINDOWS_CONTROLLER_SHA256}" \
            --windows-console-sha256 "${WINDOWS_CONSOLE_SHA256}" \
            --edge-agent-sha256 "${EDGE_AGENT_SHA256}" \
            --edge-controller-sha256 "${EDGE_CONTROLLER_SHA256}" \
            --edge-orchestrator-sha256 "${EDGE_ORCHESTRATOR_SHA256}" \
            --runtime-input-sha256 "${RUNTIME_INPUT_SHA256}" \
            --runtime-source-revision "${RUNTIME_SOURCE_REVISION}" \
            --sing-box-image "${EDGE_GATEWAY_IMAGE}" \
            --warp-egress-image "${EDGE_WARP_EGRESS_IMAGE}" \
            --docker-engine-version "${DOCKER_ENGINE_VERSION}" \
            --containerd-version "${CONTAINERD_VERSION}" \
            --compose-version "${COMPOSE_VERSION}" \
            --warp-version "${WARP_VERSION}" \
            --mesh-image "${MESH_IMAGE}"

          verify_output="$("${tool}" verify \
            --input "${authority}/release-set.pb" \
            --sha256-file "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --windows-artifact "${windows}/edge-platform-windows.zip" \
            --windows-controller "${unpacked}/bin/edge-controller.exe" \
            --windows-console "${unpacked}/bin/edge-console.exe" \
            --windows-sing-box "${unpacked}/bin/sing-box.exe" \
            --linux-sing-box "${linux}/sing-box-linux" \
            --edge-agent "${linux}/edge-agent" \
            --edge-controller "${linux}/edge-controller" \
            --edge-orchestrator "${linux}/edge-orchestrator")"
          printf '%s\n' "${verify_output}"

          release_set_sha="$(sed -n 's/^release_set_sha256=//p' <<<"${verify_output}")"
          test "$(wc -l <<<"${release_set_sha}")" -eq 1
          [[ "${release_set_sha}" =~ ^[0-9a-f]{64}$ ]]
          printf 'release_set_sha256=%s\n' "${release_set_sha}" >> "${GITHUB_OUTPUT}"

          vm_verify_output="$("${tool}" verify-vm \
            --input "${authority}/release-set.pb" \
            --sha256-file "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --edge-agent "${linux}/edge-agent" \
            --edge-controller "${linux}/edge-controller" \
            --edge-orchestrator "${linux}/edge-orchestrator")"
          printf '%s\n' "${vm_verify_output}"
          test "$(sed -n 's/^release_set_sha256=//p' <<<"${vm_verify_output}")" = "${release_set_sha}"
          test "$(sed -n 's/^schema_version=//p' <<<"${vm_verify_output}")" = "4"
          test "$(sed -n 's/^source_revision=//p' <<<"${vm_verify_output}")" = "${CANDIDATE_REVISION}"
          test "$(sed -n 's/^edge_agent_sha256=//p' <<<"${vm_verify_output}")" = "${EDGE_AGENT_SHA256}"
          test "$(sed -n 's/^edge_controller_sha256=//p' <<<"${vm_verify_output}")" = "${EDGE_CONTROLLER_SHA256}"
          test "$(sed -n 's/^edge_orchestrator_sha256=//p' <<<"${vm_verify_output}")" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sed -n 's/^runtime_input_sha256=//p' <<<"${vm_verify_output}")" = "${RUNTIME_INPUT_SHA256}"
          test "$(sed -n 's/^runtime_source_revision=//p' <<<"${vm_verify_output}")" = "${RUNTIME_SOURCE_REVISION}"
          test "$(sed -n 's/^sing_box_image=//p' <<<"${vm_verify_output}")" = "${EDGE_GATEWAY_IMAGE}"
          test "$(sed -n 's/^warp_egress_image=//p' <<<"${vm_verify_output}")" = "${EDGE_WARP_EGRESS_IMAGE}"
          test "$(sed -n 's/^mesh_image=//p' <<<"${vm_verify_output}")" = "${MESH_IMAGE}"
          test "$(sed -n 's/^docker_engine_version=//p' <<<"${vm_verify_output}")" = "${DOCKER_ENGINE_VERSION}"
          test "$(sed -n 's/^containerd_version=//p' <<<"${vm_verify_output}")" = "${CONTAINERD_VERSION}"
          test "$(sed -n 's/^compose_version=//p' <<<"${vm_verify_output}")" = "${COMPOSE_VERSION}"

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools inspect "${EDGE_GATEWAY_IMAGE}" >/dev/null
          docker buildx imagetools inspect "${EDGE_WARP_EGRESS_IMAGE}" >/dev/null
          docker logout ghcr.io >/dev/null
          docker buildx imagetools inspect "${MESH_IMAGE}" >/dev/null

          {
            echo '### Canonical ReleaseSet candidate'
            echo
            echo "- source: \`${CANDIDATE_REVISION}\`"
            echo "- release-set SHA-256: \`${release_set_sha}\`"
            echo "- Docker Engine package: \`${DOCKER_ENGINE_VERSION}\`"
            echo "- containerd package: \`${CONTAINERD_VERSION}\`"
            echo "- Compose package: \`${COMPOSE_VERSION}\`"
            echo "- VM runtime input: \`${RUNTIME_INPUT_SHA256}\`"
            echo "- VM runtime source: \`${RUNTIME_SOURCE_REVISION}\`"
            echo "- VM runtime reused: \`${RUNTIME_REUSED}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Store canonical ReleaseSet candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-set-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/candidate/release-set
          if-no-files-found: error
          retention-days: 30

  candidate_complete:
    name: Candidate complete
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: [verify, dependencies, windows, linux_candidate, release_authority]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete exact candidate
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          SOURCE_RESULT: ${{ needs.verify.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux_candidate.result }}
          RELEASE_AUTHORITY_RESULT: ${{ needs.release_authority.result }}
          RELEASE_SET_SHA256: ${{ needs.release_authority.outputs.release_set_sha256 }}
        run: |
          set -euo pipefail
          test "${SOURCE_RESULT}" = "success"
          test "${DEPENDENCIES_RESULT}" = "success"
          test "${WINDOWS_RESULT}" = "success"
          test "${LINUX_RESULT}" = "success"
          test "${RELEASE_AUTHORITY_RESULT}" = "success"
          [[ "${RELEASE_SET_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          echo "candidate_revision=${CANDIDATE_REVISION}"
          echo "release_set_sha256=${RELEASE_SET_SHA256}"
          echo "All candidate build and verification jobs passed."

  promote:
    name: Promote accepted candidate
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - name: Locate exact successful candidate
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${ACCEPTED_REVISION}" =~ ^[0-9a-f]{40}$ ]]

          candidate_revision="${EVENT_CANDIDATE_REVISION}"
          [[ "${candidate_revision}" =~ ^[0-9a-f]{40}$ ]]

          accepted_tree="$(gh api "repos/${REPOSITORY}/git/commits/${ACCEPTED_REVISION}" --jq '.tree.sha')"
          candidate_tree="$(gh api "repos/${REPOSITORY}/git/commits/${candidate_revision}" --jq '.tree.sha')"
          test "${accepted_tree}" = "${candidate_tree}"

          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/edge-platform-ci.yml/runs?event=pull_request&head_sha=${candidate_revision}&per_page=100")"
          latest_run="$(jq -cer --arg head "${candidate_revision}" --argjson current_run_id "${CURRENT_RUN_ID}" '
            [.workflow_runs[]
              | select(.head_sha == $head)
              | select(.event == "pull_request")
              | select(.id != $current_run_id)
              | select(.status == "completed")
              | select(.conclusion == "success")]
            | sort_by(.id)
            | last
          ' <<<"${runs}")"
          test "$(jq -er '.status' <<<"${latest_run}")" = "completed"
          test "$(jq -er '.conclusion' <<<"${latest_run}")" = "success"
          candidate_run_id="$(jq -er '.id' <<<"${latest_run}")"

          printf 'accepted_revision=%s\n' "${ACCEPTED_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_revision=%s\n' "${candidate_revision}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_tree=%s\n' "${candidate_tree}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_run_id=%s\n' "${candidate_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download exact candidate artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_REVISION: ${{ steps.locate.outputs.candidate_revision }}
          CANDIDATE_RUN_ID: ${{ steps.locate.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/accepted/windows" "${RUNNER_TEMP}/accepted/linux" "${RUNNER_TEMP}/accepted/release-set"
          gh run download "${CANDIDATE_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-windows-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/accepted/windows"
          gh run download "${CANDIDATE_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-release-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/accepted/linux"
          gh run download "${CANDIDATE_RUN_ID}" -R "${REPOSITORY}" \
            -n "edge-platform-release-set-${CANDIDATE_REVISION}" \
            -D "${RUNNER_TEMP}/accepted/release-set"

      - name: Verify exact candidate provenance
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACCEPTED_REVISION: ${{ steps.locate.outputs.accepted_revision }}
          CANDIDATE_REVISION: ${{ steps.locate.outputs.candidate_revision }}
          CANDIDATE_TREE: ${{ steps.locate.outputs.candidate_tree }}
          CANDIDATE_RUN_ID: ${{ steps.locate.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          windows="${RUNNER_TEMP}/accepted/windows"
          linux="${RUNNER_TEMP}/accepted/linux"

          test "$(jq -er '.source_revision' "${windows}/manifest.json")" = "${CANDIDATE_REVISION}"
          test "$(jq -er '.source_tree' "${windows}/manifest.json")" = "${CANDIDATE_TREE}"
          test "$(jq -er '.source_revision' "${linux}/manifest.json")" = "${CANDIDATE_REVISION}"
          test "$(jq -er '.source_tree' "${linux}/manifest.json")" = "${CANDIDATE_TREE}"
          test "$(jq -er '.schema' "${linux}/manifest.json")" = "4"
          jq -e '.runtime_input_sha256 | test("^[0-9a-f]{64}$")' "${linux}/manifest.json" >/dev/null
          jq -e '.runtime_source_revision | test("^[0-9a-f]{40}$")' "${linux}/manifest.json" >/dev/null
          jq -e '.runtime_reused | type == "boolean"' "${linux}/manifest.json" >/dev/null

          authority="${RUNNER_TEMP}/accepted/release-set"
          unpacked="${RUNNER_TEMP}/accepted/windows-package"
          tool="${linux}/edge-release-set"
          install -d "${unpacked}"
          chmod 0755 "${tool}"
          unzip -q "${windows}/edge-platform-windows.zip" -d "${unpacked}"

          verify_output="$("${tool}" verify \
            --input "${authority}/release-set.pb" \
            --sha256-file "${authority}/release-set.pb.sha256" \
            --source-revision "${CANDIDATE_REVISION}" \
            --windows-artifact "${windows}/edge-platform-windows.zip" \
            --windows-controller "${unpacked}/bin/edge-controller.exe" \
            --windows-console "${unpacked}/bin/edge-console.exe" \
            --windows-sing-box "${unpacked}/bin/sing-box.exe" \
            --linux-sing-box "${linux}/sing-box-linux" \
            --edge-agent "${linux}/edge-agent" \
            --edge-controller "${linux}/edge-controller" \
            --edge-orchestrator "${linux}/edge-orchestrator")"
          printf '%s\n' "${verify_output}"

          gateway_ref="$(sed -n 's/^sing_box_image=//p' <<<"${verify_output}")"
          warp_ref="$(sed -n 's/^warp_egress_image=//p' <<<"${verify_output}")"
          mesh_ref="$(sed -n 's/^mesh_image=//p' <<<"${verify_output}")"
          [[ "${gateway_ref}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
          [[ "${warp_ref}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]
          [[ "${mesh_ref}" =~ ^docker\.io/cloudflare/mesh@sha256:[0-9a-f]{64}$ ]]

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools inspect "${gateway_ref}" >/dev/null
          docker buildx imagetools inspect "${warp_ref}" >/dev/null
          docker logout ghcr.io >/dev/null
          docker buildx imagetools inspect "${mesh_ref}" >/dev/null

          jq -n \
            --arg accepted_revision "${ACCEPTED_REVISION}" \
            --arg candidate_revision "${CANDIDATE_REVISION}" \
            --arg source_tree "${CANDIDATE_TREE}" \
            --arg candidate_run_id "${CANDIDATE_RUN_ID}" \
            '{
              schema:1,
              accepted_revision:$accepted_revision,
              candidate_revision:$candidate_revision,
              source_tree:$source_tree,
              candidate_run_id:$candidate_run_id
            }' > "${windows}/acceptance.json"
          cp "${windows}/acceptance.json" "${linux}/acceptance.json"
          cp "${windows}/acceptance.json" "${authority}/acceptance.json"

      - name: Publish durable immutable release without rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ steps.locate.outputs.accepted_revision }}
          CANDIDATE_REVISION: ${{ steps.locate.outputs.candidate_revision }}
          CANDIDATE_RUN_ID: ${{ steps.locate.outputs.candidate_run_id }}
          WINDOWS_DIR: ${{ runner.temp }}/accepted/windows
          LINUX_DIR: ${{ runner.temp }}/accepted/linux
          RELEASE_SET_DIR: ${{ runner.temp }}/accepted/release-set
          OUTPUT_DIR: ${{ runner.temp }}/durable-release
        run: |
          set -euo pipefail
          publisher="${RUNNER_TEMP}/publish-durable-release.sh"
          payload="$(gh api "repos/${REPOSITORY}/contents/edge-platform/scripts/publish_durable_release.sh?ref=${ACCEPTED_REVISION}")"
          test "$(jq -er '.type' <<<"${payload}")" = "file"
          test "$(jq -er '.encoding' <<<"${payload}")" = "base64"
          jq -r '.content' <<<"${payload}" | tr -d '\n' | base64 --decode > "${publisher}"
          bash -n "${publisher}"
          bash "${publisher}"

      - name: Publish accepted Windows artifact without rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-windows-${{ steps.locate.outputs.accepted_revision }}
          path: ${{ runner.temp }}/accepted/windows
          if-no-files-found: error
          retention-days: 30

      - name: Publish accepted Linux artifact without rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-${{ steps.locate.outputs.accepted_revision }}
          path: ${{ runner.temp }}/accepted/linux
          if-no-files-found: error
          retention-days: 30

      - name: Publish accepted ReleaseSet without rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: edge-platform-release-set-${{ steps.locate.outputs.accepted_revision }}
          path: ${{ runner.temp }}/accepted/release-set
          if-no-files-found: error
          retention-days: 30
