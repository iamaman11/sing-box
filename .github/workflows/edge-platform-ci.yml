      edge_agent_sha256: ${{ steps.package.outputs.edge_agent_sha256 }}
      edge_controller_sha256: ${{ steps.package.outputs.edge_controller_sha256 }}
      edge_orchestrator_sha256: ${{ steps.package.outputs.edge_orchestrator_sha256 }}
      runtime_input_sha256: ${{ steps.package.outputs.runtime_input_sha256 }}
      runtime_source_revision: ${{ steps.package.outputs.runtime_source_revision }}
      runtime_reused: ${{ steps.package.outputs.runtime_reused }}
    steps:
      - name: Checkout exact candidate revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Build exact reusable Linux binaries
        working-directory: edge-platform
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p edge-controller --bin edge-controller
          cargo build --locked --release -p edge-orchestrator --bin edge-orchestrator
          cargo build --locked --release -p edge-agent --bin edge-agent
          cargo build --locked --release -p edge-shared-types --bin edge-release-set

      - name: Resolve exact accepted VM runtime reuse
        id: runtime_reuse
