name: Native Host Observation

on:
  workflow_call:
    inputs:
      machine_id:
        required: true
        type: string
      kind:
        required: true
        type: string
      owner:
        required: true
        type: string
      runner_labels:
        required: true
        type: string
      command_body:
        required: true
        type: string
      operation:
        required: true
        type: string
      source_comment_id:
        required: true
        type: string

permissions: {}

jobs:
  observe:
    # A VM signed apply MUST NOT overlap its own or another VM root upgrade:
    # the existing production lease group serializes upgrade and native BEGIN.
    # Status remains independent and read-only; Windows is not affected.
    concurrency:
      group: ${{ (inputs.kind == 'VM' && (inputs.operation == 'APPLY_PREFLIGHT' || inputs.operation == 'RECOVER_PREFLIGHT' || inputs.operation == 'ADMIN')) && 'vultr-control-plane-production' || format('host-readonly-{0}', inputs.source_comment_id) }}
      cancel-in-progress: false
    # Git selects a single owner from Rust's exact protobuf matrix.
    # This job NEVER holds issues:write, Docker socket or generic root.
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      TARGET_MACHINE: ${{ inputs.machine_id }}
      TARGET_OWNER: ${{ inputs.owner }}
      TARGET_KIND: ${{ inputs.kind }}
      COMMAND_BODY: ${{ inputs.command_body }}
      HOST_OPERATION: ${{ inputs.operation }}
    steps:
      - name: Receive exact approved administrative request in existing runner
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'ADMIN'
        uses: actions/download-artifact@v4
        with:
          name: host-intent-${{ inputs.source_comment_id }}
          path: ${{ runner.temp }}/host-admin

      - name: Deliver signed native root administration without runner root rights
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'ADMIN'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          test "${TARGET_MACHINE}" = "${TARGET_OWNER}"
          test "$(id -u)" != 0
          owner=/usr/local/libexec/sing-box/edge-agent
          test -x "${owner}" && test ! -L "${owner}"
          for path in /usr /usr/local /usr/local/libexec /usr/local/libexec/sing-box "${owner}"; do
            test ! -L "${path}"
            test "$(stat -c '%u:%g:%a' "${path}")" = "0:0:755"
          done
          if sudo -n id -u >/dev/null 2>&1; then
            echo 'HOST_ADMIN_RUNNER_GENERIC_SUDO_FORBIDDEN' >&2
            exit 1
          fi
          test ! -r /var/run/docker.sock
          request="${RUNNER_TEMP}/host-admin/host-intent.pb"
          result="${RUNNER_TEMP}/host-admin/admin-result.pb"
          test -f "${request}" && test ! -L "${request}"
          test "$(stat -c '%s' "${request}")" -gt 0
          test "$(stat -c '%s' "${request}")" -le 32768
          sudo -n -l "${owner}" local host-admin >/dev/null
          # Exact accepted root owner, independent Worker authorization,
          # journal BEGIN, native signed result. The workflow NEVER runs
          # argv, bash -c or Docker itself, and never logs raw root output.
          sudo -n "${owner}" local host-admin < "${request}" > "${result}"
          test -s "${result}" && test "$(stat -c '%s' "${result}")" -le 140000
          echo 'host_admin_native_result=ROOT_SIGNED_PROOF_PENDING_INDEPENDENT_VERIFICATION'

      - name: Preserve native signed administrative result even when command failed
        if: (success() || failure()) && env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'ADMIN'
        uses: actions/upload-artifact@v4
        with:
          name: host-admin-result-${{ inputs.source_comment_id }}
          path: ${{ runner.temp }}/host-admin/admin-result.pb
          if-no-files-found: warn
          retention-days: 7

      - name: Receive one same-run immutable diagnostic request
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'DIAGNOSE'
        uses: actions/download-artifact@v4
        with:
          name: host-intent-${{ inputs.source_comment_id }}
          path: ${{ runner.temp }}/host-diagnostic

      - name: Run one native unprivileged VM diagnostic through existing Root Agent
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'DIAGNOSE'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          test "${TARGET_MACHINE}" = "${TARGET_OWNER}"
          test "$(id -u)" != 0
          owner=/usr/local/libexec/sing-box/edge-agent
          test -x "${owner}" && test ! -L "${owner}"
          for path in /usr /usr/local /usr/local/libexec /usr/local/libexec/sing-box "${owner}"; do
            test ! -L "${path}"
            test "$(stat -c '%u:%g:%a' "${path}")" = "0:0:755"
          done
          if sudo -n id -u >/dev/null 2>&1; then
            echo 'HOST_VM_GENERIC_ROOT_AUTHORITY_FORBIDDEN' >&2
            exit 1
          fi
          test ! -r /var/run/docker.sock
          request="${RUNNER_TEMP}/host-diagnostic/host-intent.pb"
          test -f "${request}" && test ! -L "${request}"
          test "$(stat -c '%s' "${request}")" -gt 0
          test "$(stat -c '%s' "${request}")" -le 4096
          if ! sudo -n -l "${owner}" local host-probe >/dev/null 2>&1; then
            echo 'HOST_DIAG_INSTALLED_NATIVE_VERB_UNAVAILABLE' >&2
            exit 1
          fi
          # One read-only request; local root owner drops privileges before
          # launching any system binary. No shell argv or sudo via runner.
          sudo -n "${owner}" local host-probe < "${request}"
          echo 'host_diagnostic_native_proof=RUNNER_COPIED_NOT_SIGNED_RECEIPT'

      - name: Verify installed Windows native owner and diagnose without mutation
        if: env.TARGET_KIND == 'WINDOWS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne $env:TARGET_OWNER) {
            throw 'HOST_WINDOWS_OWNER_MISMATCH'
          }
          $root = 'C:\sing-box'
          $doctor = Join-Path $root 'bin\edge-diagnostic.exe'
          $current = Join-Path $root 'current.pb'
          if (-not (Test-Path -LiteralPath $doctor -PathType Leaf) -or
              -not (Test-Path -LiteralPath $current -PathType Leaf)) {
            throw 'HOST_WINDOWS_NATIVE_OWNER_MISSING'
          }
          if ($env:COMMAND_BODY -like '* --deep' -or
              $env:COMMAND_BODY -like '/host recover *' -or
              $env:COMMAND_BODY -like '/host apply *') {
            & $doctor doctor $current
            if ($LASTEXITCODE -ne 0) { throw 'HOST_WINDOWS_NATIVE_DEEP_FAILED' }
          } else {
            & $doctor doctor $current --fast
            if ($LASTEXITCODE -ne 0) {
              # Older accepted immutable diagnostic has only doctor <current.pb>.
              # Its exact owner can still diagnose read-only; don't install
              # a new version, restart SCM or claim that FAST succeeded.
              Write-Output 'host_fast_unavailable=INSTALLED_NATIVE_VERB_NOT_ACCEPTED'
              Write-Output 'host_observation_depth=DEEP_INSTALLED_OWNER_FALLBACK'
              & $doctor doctor $current
              if ($LASTEXITCODE -ne 0) { throw 'HOST_WINDOWS_NATIVE_FALLBACK_FAILED' }
            }
          }

      - name: Verify installed VM native owner and diagnose without mutation
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION != 'DIAGNOSE'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          owner="/usr/local/libexec/sing-box/edge-agent"
          test -x "${owner}"
          test ! -L "${owner}"
          for path in /usr /usr/local /usr/local/libexec /usr/local/libexec/sing-box "${owner}"; do
            test ! -L "${path}"
            test "$(stat -c '%u:%g:%a' "${path}")" = "0:0:755"
          done
          # Observation of the exact installed executable, not a guess from
          # first-use Actions. Runner-copied evidence does NOT authenticate a
          # mutation receipt or authorize an owner replacement.
          actual_agent_sha="$(sha256sum "${owner}" | cut -d' ' -f1)"
          [[ "${actual_agent_sha}" =~ ^[0-9a-f]{64}$ ]]
          echo "host_vm_installed_agent_sha256_observed=${actual_agent_sha}"
          echo 'host_vm_installed_agent_identity_proof=RUNNER_COPIED_UNAUTHENTICATED'
          test "$(id -u)" != 0
          if sudo -n id -u >/dev/null 2>&1; then
            echo 'HOST_VM_GENERIC_ROOT_AUTHORITY_FORBIDDEN' >&2
            exit 1
          fi
          test ! -r /var/run/docker.sock
          # Read-only sudo -l checks the INSTALLED runner capability, not
          # just the updated source installer. This cannot perform a mutation.
          vm_runner_mutate=ABSENT
          # Same forbidden capability list as the canonical VM installer.
          # Old installed sudoers are not silently accepted by the new flow.
          for unsafe_command in \
            "local bundle-converge" \
            "local host-enroll machine release" \
            "local host-enroll machine release key" \
            "local bundle-rollback" \
            "local bootstrap-full" \
            "local mesh-cleanup" \
            "local credential-stage 1" \
            "local credential-transition promote" \
            "local credential-existing-join 1 2 3"; do
            read -r -a argv <<< "${unsafe_command}"
            if sudo -n -l "${owner}" "${argv[@]}" >/dev/null 2>&1; then
              vm_runner_mutate=LEGACY_DIRECT_MUTATION_PRESENT
              break
            fi
          done
          echo "host_runner_direct_mutation_authority=${vm_runner_mutate}"
          if [[ "${HOST_OPERATION}" == APPLY_PREFLIGHT || "${HOST_OPERATION}" == RECOVER_PREFLIGHT ]] &&
             [[ "${vm_runner_mutate}" != ABSENT ]]; then
            echo 'HOST_VM_LEGACY_DIRECT_MUTATION_AUTHORITY_FORBIDDEN' >&2
            exit 1
          fi
          if [[ "${COMMAND_BODY}" == *" --deep" || "${HOST_OPERATION}" == RECOVER_PREFLIGHT ||
                "${HOST_OPERATION}" == APPLY_PREFLIGHT ]]; then
            sudo -n "${owner}" local diagnose
          else
            # Old installed sudoers may not yet grant --fast. Native deep
            # remains authorized and read-only; do not elevate privileges.
            if sudo -n -l "${owner}" local status --fast >/dev/null 2>&1; then
              sudo -n "${owner}" local status --fast
            else
              echo 'host_observation_depth=DEEP_INSTALLED_OWNER_FALLBACK'
              echo 'host_fast_unavailable=EXACT_SUDOERS_VERB_NOT_INSTALLED'
              sudo -n "${owner}" local diagnose
            fi
          fi


      - name: Refresh exact root owner for code-only recover, without resource replay
        # /host recover VM is explicit operator authorization for a protected
        # code/trust refresh only. Root verifies latest protected main itself.
        # It never changes Docker, the journal, credentials or network.
        # There is NO signed host-apply in this operation.
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'RECOVER_PREFLIGHT'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          owner=/usr/local/libexec/sing-box/edge-agent
          test -x "${owner}" && test ! -L "${owner}"
          sudo -n -l "${owner}" local host-refresh >/dev/null
          sudo -n "${owner}" local host-refresh
          echo 'host_recover_effect=CODE_ONLY_REFRESH_NO_RESOURCE_MUTATION'
          echo 'host_recover_resource_replay_authorized=false'
          # Re-observe using the newly installed code in the same owner job.
          sudo -n "${owner}" local diagnose

      - name: Transfer exact same-run typed HostIntent with native Actions artifact
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'APPLY_PREFLIGHT'
        uses: actions/download-artifact@v4
        with:
          name: host-intent-${{ inputs.source_comment_id }}
          path: ${{ runner.temp }}/host-operation

      - name: Refresh protected Git main release with existing native root owner
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'APPLY_PREFLIGHT'
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          owner=/usr/local/libexec/sing-box/edge-agent
          test -x "${owner}" && test ! -L "${owner}"
          # The root Agent has NO caller-supplied SHA, path or secret; it
          # fetches/proves latest protected main and checks the local receipt.
          # It owns one lock across trust and atomic binary replacement.
          sudo -n -l "${owner}" local host-refresh >/dev/null
          sudo -n "${owner}" local host-refresh

      - name: Dispatch one signed native VM host transaction
        if: env.TARGET_KIND == 'VM' && env.HOST_OPERATION == 'APPLY_PREFLIGHT'
        shell: bash
        env:
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
        run: |
          set -euo pipefail
          # The runner is a transport ONLY. All authority comes from the
          # installed root Agent + Worker + exact published Git/ReleaseSet.
          [[ "${TARGET_MACHINE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]
          [[ "${SOURCE_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          test "${RUNNER_NAME}" = "sing-box-production-${TARGET_OWNER}"
          # Native Rust decodes the only signed HostIntent and its exact scope.
          test "${HOST_OPERATION}" = APPLY_PREFLIGHT
          owner=/usr/local/libexec/sing-box/edge-agent
          test -x "${owner}" && test ! -L "${owner}"
          # No generic sudo, no bundle-converge/rollback/credentials paths.
          # Older installed sudoers intentionally fails closed here.
          sudo -n -l "${owner}" local host-apply >/dev/null
          # The official same-run artifact action has already transferred
          # only the exact prepared protobuf from the existing GitHub owner.
          # Do not require gh CLI on the low-privilege VM runner.
          path="${RUNNER_TEMP}/host-operation"
          test -d "${path}" && test ! -L "${path}"
          intent="${path}/host-intent.pb"
          test -f "${intent}" && test ! -L "${intent}"
          test "$(stat -c '%s' "${intent}")" -gt 0
          test "$(stat -c '%s' "${intent}")" -le 4096
          # Never retry after an uncertain result, even if stdout is lost.
          result="${path}/host-result.pb"
          sudo -n "${owner}" local host-apply < "${intent}" > "${result}"
          test -s "${result}"
          test "$(stat -c '%s' "${result}")" -le 8192
          echo 'host_native_execution=ROOT_OWNER_ONE_SHOT'
          echo 'host_native_result=LOCAL_PROTOBUF_NOT_YET_REMOTE_ATTESTED'

      - name: Capture exact installed Windows typed readback when supported
        if: env.TARGET_KIND == 'WINDOWS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $doctor = 'C:\sing-box\bin\edge-diagnostic.exe'
          $current = 'C:\sing-box\current.pb'
          $output = Join-Path $env:RUNNER_TEMP 'host-native-observation.pb'
          Remove-Item -LiteralPath $output -Force -ErrorAction SilentlyContinue
          # An older installed ReleaseSet may not expose this read-only verb.
          # Do not upgrade here, invoke a privileged dispatcher or claim PASS.
          & $doctor host-observe $current > $output
          if ($LASTEXITCODE -ne 0 -or
              -not (Test-Path -LiteralPath $output -PathType Leaf) -or
              (Get-Item -LiteralPath $output).Length -gt 4096 -or
              (Get-Item -LiteralPath $output).Length -eq 0) {
            Remove-Item -LiteralPath $output -Force -ErrorAction SilentlyContinue
            Write-Output 'host_typed_readback=UNAVAILABLE_INSTALLED_VERSION_OR_EVIDENCE'
          } else {
            Write-Output 'host_typed_readback=BOUNDED_PROTOBUF_CAPTURED_UNAUTHENTICATED'
          }

      - name: Capture exact installed VM typed readback when permitted
        # On a failed native transaction retain a read-only postmortem.
        # A failure cannot authorize replay and may have physical effects.
        if: (success() || failure()) && env.TARGET_KIND == 'VM'
        shell: bash
        run: |
          set -euo pipefail
          owner=/usr/local/libexec/sing-box/edge-agent
          output="${RUNNER_TEMP}/host-native-observation.pb"
          rm -f "${output}"
          if sudo -n -l "${owner}" local host-observe >/dev/null 2>&1 &&
             sudo -n "${owner}" local host-observe > "${output}" &&
             test -s "${output}" && test "$(stat -c '%s' "${output}")" -le 4096; then
            echo 'host_typed_readback=BOUNDED_PROTOBUF_CAPTURED_UNAUTHENTICATED'
          else
            rm -f "${output}"
            echo 'host_typed_readback=UNAVAILABLE_INSTALLED_VERSION_OR_SUDOERS'
          fi

      - name: Capture bounded VM per-container resource evidence
        if: (success() || failure()) && env.TARGET_KIND == 'VM' && (endsWith(env.COMMAND_BODY, ' --deep') || env.HOST_OPERATION == 'APPLY_PREFLIGHT' || env.HOST_OPERATION == 'RECOVER_PREFLIGHT')
        shell: bash
        run: |
          set -euo pipefail
          owner=/usr/local/libexec/sing-box/edge-agent
          output="${RUNNER_TEMP}/host-native-resources.pb"
          rm -f "${output}"
          # Older installations may not yet offer the exact read-only verb.
          # Missing support is UNPROVEN, not an excuse for a direct Docker call.
          if sudo -n -l "${owner}" local host-resources >/dev/null 2>&1 &&
             sudo -n "${owner}" local host-resources > "${output}" &&
             test -f "${output}" && test ! -L "${output}" &&
             test -s "${output}" &&
             test "$(stat -c '%s' "${output}")" -le 32768; then
            echo 'host_vm_resources_capture=BOUNDED_UNAUTHENTICATED'
          else
            rm -f "${output}"
            echo 'host_vm_resources_capture=UNPROVEN_INSTALLED_OWNER'
          fi

      - name: Retain native bounded protobuf as transport evidence
        # Preserve diagnostic bytes even if host-apply failed after BEGIN.
        # Never export local journal contents, Docker logs or credentials.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-readback-${{ inputs.machine_id }}-${{ inputs.source_comment_id }}
          path: |
            ${{ runner.temp }}/host-native-observation.pb
            ${{ runner.temp }}/host-native-resources.pb
            ${{ runner.temp }}/host-operation/host-result.pb
          if-no-files-found: ignore
          retention-days: 30

  report:
    # An unavailable third runner must not hold the reports for healthy peers.
    # A runner queued forever cannot produce a PASS; no claim is inferred.
    needs: observe
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_MACHINE: ${{ inputs.machine_id }}
      TARGET_KIND: ${{ inputs.kind }}
      SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
      OBSERVED_RESULT: ${{ needs.observe.result }}
      COMMAND_BODY: ${{ inputs.command_body }}
      HOST_OPERATION: ${{ inputs.operation }}
    steps:
      - name: Validate optional native protobuf with the exact Rust Fleet Orchestrator
        id: typed
        # Failed first-party native runs may still contain valid read-only
        # artifacts; validate them without upgrading to a signed receipt.
        if: env.OBSERVED_RESULT == 'success' || env.OBSERVED_RESULT == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TARGET_MACHINE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]
          name="native-readback-${TARGET_MACHINE}-${SOURCE_COMMENT_ID}"
          out="${RUNNER_TEMP}/host-native-readback"
          mkdir -p "${out}"
          if [[ "${HOST_OPERATION}" != ADMIN ]]; then
            # Native ADMIN has its own exact authenticated receipt.
            if ! gh run download "${GITHUB_RUN_ID}" -R "${GITHUB_REPOSITORY}" -n "${name}" -D "${out}" >/dev/null 2>&1; then
              echo 'typed_verdict=UNAVAILABLE_INSTALLED_OWNER_VERSION' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            observation="${out}/host-native-observation.pb"
            test -f "${observation}" && test ! -L "${observation}"
            test "$(stat -c '%s' "${observation}")" -gt 0
            test "$(stat -c '%s' "${observation}")" -le 4096
          fi
          # Resolve the ONE accepted Git commit and exact immutable runtime,
          # matching the primary control-plane path. Never execute a
          # checkout-built or runner-supplied orchestrator.
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          export ACCEPTED_REVISION="${GITHUB_SHA}"
          export REPOSITORY="${GITHUB_REPOSITORY}"
          export OUTPUT_DIR="${RUNNER_TEMP}/host-readback-release"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          echo "${EDGE_ORCHESTRATOR_SHA256}  ${owner}" | sha256sum --check --status
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          # Reparse protected Git desired with the already-pinned compiler;
          # never consume inventory supplied by the native runner.
          buf="${RUNNER_TEMP}/host-readback-buf"
          curl --fail --silent --show-error --location \
            "https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64" -o "${buf}"
          echo "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1  ${buf}" | sha256sum --check --status
          chmod 0755 "${buf}"
          (cd edge-platform && "${buf}" convert proto/edge/platform/v1/fleet.proto \
            --type edge.platform.v1.FleetDesiredState \
            --from "../infra/hosts/hosts.textproto#format=txtpb" \
            --to "${RUNNER_TEMP}/host-readback-registry.pb#format=binpb")
          registry="${RUNNER_TEMP}/host-readback-registry.pb"
          test -s "${registry}"
          if [[ "${TARGET_KIND}" = VM && "${HOST_OPERATION}" = ADMIN ]]; then
            admin_name="host-admin-result-${SOURCE_COMMENT_ID}"
            if ! gh run download "${GITHUB_RUN_ID}" -R "${GITHUB_REPOSITORY}" -n "${admin_name}" -D "${out}" >/dev/null 2>&1; then
              echo 'typed_verdict=ADMIN_RECEIPT_MISSING_UNKNOWN_NO_REPLAY' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            intent_dir="${RUNNER_TEMP}/host-admin-verified-intent"
            mkdir -p "${intent_dir}"
            gh run download "${GITHUB_RUN_ID}" -R "${GITHUB_REPOSITORY}" \
              -n "host-intent-${SOURCE_COMMENT_ID}" -D "${intent_dir}"
            request="${intent_dir}/host-intent.pb"
            signed="${out}/admin-result.pb"
            test -f "${request}" && test ! -L "${request}"
            test -f "${signed}" && test ! -L "${signed}"
            "${owner}" host --hosts-pb "${registry}" \
              --hosts-sha256 "$(sha256sum "${registry}" | cut -d' ' -f1)" \
              --github-output "${GITHUB_OUTPUT}" \
              admin-result "${TARGET_MACHINE}" --request-path "${request}" \
              --result-path "${signed}" > "${RUNNER_TEMP}/host-admin-audit.txt"
            echo 'typed_verdict=ADMIN_RECEIPT_CRYPTO_VERIFIED' >> "${GITHUB_OUTPUT}"
            {
              echo '### Independent native admin receipt verification'
              echo '~~~text'
              cat "${RUNNER_TEMP}/host-admin-audit.txt"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          extra=()
          if [[ "${TARGET_KIND}" = VM && -s "${out}/host-native-resources.pb" ]]; then
            resource_report="${out}/host-native-resources.pb"
            test -f "${resource_report}" && test ! -L "${resource_report}"
            test "$(stat -c '%s' "${resource_report}")" -le 32768
            extra=(--resources-path "${resource_report}")
          fi
          "${owner}" host --hosts-pb "${registry}" \
            --hosts-sha256 "$(sha256sum "${registry}" | cut -d' ' -f1)" \
            --github-output "${GITHUB_OUTPUT}" \
            readback "${TARGET_MACHINE}" --observation-path "${observation}" "${extra[@]}" \
            > "${RUNNER_TEMP}/host-readback-result.txt"
          result="${RUNNER_TEMP}/host-readback-result.txt"
          # One exact Rust parser also audits the native transaction result.
          # This is correlation, never authenticated SYSTEM/root attestation.
          if [[ "${TARGET_KIND}" = VM && "${HOST_OPERATION}" = APPLY_PREFLIGHT &&
                -s "${out}/host-operation/host-result.pb" ]]; then
            intent_dir="${RUNNER_TEMP}/host-readback-intent"
            install -d -m 0700 "${intent_dir}"
            gh run download "${GITHUB_RUN_ID}" -R "${GITHUB_REPOSITORY}" \
              -n "host-intent-${SOURCE_COMMENT_ID}" -D "${intent_dir}"
            intent="${intent_dir}/host-intent.pb"
            test -f "${intent}" && test ! -L "${intent}"
            test "$(stat -c '%s' "${intent}")" -gt 0
            test "$(stat -c '%s' "${intent}")" -le 4096
            "${owner}" host --hosts-pb "${registry}" \
              --hosts-sha256 "$(sha256sum "${registry}" | cut -d' ' -f1)" \
              --github-output "${GITHUB_OUTPUT}" \
              native-result "${TARGET_MACHINE}" --intent-path "${intent}" \
              --result-path "${out}/host-operation/host-result.pb" \
              > "${RUNNER_TEMP}/host-native-result-correlation.txt"
            audit="${RUNNER_TEMP}/host-native-result-correlation.txt"
            {
              echo '### Native owner cryptographically verified receipt'
              echo '~~~text'
              cat "${audit}"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          {
            echo '### Exact typed Host readback (UNAUTHENTICATED runner copy)'
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Return bounded result for this ONE native owner
        if: always()
        env:
          TYPED_OUTCOME: ${{ steps.typed.outcome }}
          TYPED_VERDICT: ${{ steps.typed.outputs.typed_verdict }}
          NATIVE_RECEIPT_PROOF: ${{ steps.typed.outputs.native_receipt_proof }}
          ADMIN_RECEIPT_PROOF: ${{ steps.typed.outputs.admin_receipt_proof }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMENT_ID}" =~ ^[0-9]+$ ]]
          [[ "${TARGET_MACHINE}" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$ ]]
          case "${TARGET_KIND}" in WINDOWS|VM) ;; *) exit 1 ;; esac
          case "${OBSERVED_RESULT}" in
            success) result=NATIVE_DIAGNOSTIC_EXECUTED ;;
            failure) result=NATIVE_DIAGNOSTIC_FAILED ;;
            cancelled) result=NATIVE_DIAGNOSTIC_CANCELLED ;;
            skipped) result=OWNER_NOT_OBSERVED ;;
            *) result=UNKNOWN_NOT_ACCEPTED ;;
          esac
          native_note='Native mutation authority: NONE. A read-only observation is not an authenticated owner receipt.'
          if [[ "${TARGET_KIND}" = VM && "${HOST_OPERATION}" = RECOVER_PREFLIGHT ]]; then
            # Operator requested a code/trust-only refresh; the same root owner
            # chose exact main, without any resource effect or journal replay.
            native_note='VM code/trust owner refresh attempted under root lock. No Docker, journal, DNS, firewall or credential resource mutation. Runner-copied diagnosis is UNAUTHENTICATED and never lifts pending/NO_REPLAY.'
            if [[ "${OBSERVED_RESULT}" = success ]]; then
              result=ROOT_CODE_ONLY_REFRESH_COMPLETED_NO_RESOURCE_AUTHORITY
            else
              result=ROOT_CODE_ONLY_REFRESH_BLOCKED_NO_REPLAY
            fi
          fi
          if [[ "${TARGET_KIND}" = VM && "${HOST_OPERATION}" = ADMIN ]]; then
            native_note='Native ADMIN: no independent signed result established.'
            if [[ "${TYPED_OUTCOME}" = success && "${ADMIN_RECEIPT_PROOF}" = VERIFIED_EXIT_ZERO ]]; then
              result=ADMIN_SIGNED_EXIT_ZERO
              native_note='Ed25519 native receipt verified against exact Git request; physical poststate requires independent observation.'
            elif [[ "${TYPED_OUTCOME}" = success && "${ADMIN_RECEIPT_PROOF}" = VERIFIED_EXIT_NONZERO ]]; then
              result=ADMIN_SIGNED_EXIT_NONZERO
              native_note='Ed25519 native receipt verified; program returned a nonzero exit status.'
            elif [[ "${TYPED_OUTCOME}" = success && "${ADMIN_RECEIPT_PROOF}" = VERIFIED_OUTPUT_INCOMPLETE_NO_REPLAY ]]; then
              result=ADMIN_SIGNED_OUTPUT_INCOMPLETE_NO_REPLAY
              native_note='Direct child exited but inherited output pipe did not reach EOF; signed partial output only, no replay.'
            elif [[ "${TYPED_OUTCOME}" = success && "${ADMIN_RECEIPT_PROOF}" = VERIFIED_EXIT_124_OR_137_AMBIGUOUS ]]; then
              result=ADMIN_SIGNED_EXIT_AMBIGUOUS
              native_note='Ed25519 receipt verifies exit 124/137, not whether timeout or application supplied the code.'
            elif [[ "${TYPED_OUTCOME}" = success && "${ADMIN_RECEIPT_PROOF}" = VERIFIED_NO_EXIT ]]; then
              result=ADMIN_SIGNED_NO_EXIT
              native_note='Signed result exists but normal child completion is not proved; no replay.'
            else
              result=ADMIN_UNVERIFIED_UNKNOWN_NO_REPLAY
            fi
          fi
          if [[ "${TARGET_KIND}" = VM && "${HOST_OPERATION}" = APPLY_PREFLIGHT ]]; then
            # Only the exact Rust Ed25519 verifier can upgrade this result.
            # A successful runner step or unsigned readback never can.
            native_note='Native VM transaction: remote authenticated receipt UNPROVEN.'
            if [[ "${TYPED_OUTCOME}" = success &&
                  "${NATIVE_RECEIPT_PROOF}" = VERIFIED_PHYSICAL ]]; then
              result=NATIVE_RECEIPT_VERIFIED_PHYSICAL
              native_note='Git-pinned Ed25519 native-owner receipt verified against exact intent and native physical readback; external TLS/auth/egress acceptance remains separate.'
            elif [[ "${TYPED_OUTCOME}" = success &&
                    "${NATIVE_RECEIPT_PROOF}" = OBSERVED_ONLY ]]; then
              result=NATIVE_RECEIPT_OBSERVED_ONLY
              native_note='Git-pinned Ed25519 native-owner receipt verified; no physical mutation poststate accepted.'
            else
              result=NATIVE_EXECUTION_NOT_VERIFIED_NO_REPLAY
            fi
          fi
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${TYPED_OUTCOME}" = failure ]]; then
            typed=REJECTED_EXACT_RUST_VALIDATION
          else
            typed="${TYPED_VERDICT:-UNPROVEN_NO_TYPED_READBACK}"
          fi
          [[ "${typed}" =~ ^[A-Z0-9_]{1,96}$ ]]
          body="$(printf 'Host native result for operator command #%s\n\nHost: `%s`\nKind: `%s`\nResult: `%s`\nTyped readback: `%s`\nEvidence: %s\n\n%s\n' \
            "${SOURCE_COMMENT_ID}" "${TARGET_MACHINE}" "${TARGET_KIND}" "${result}" "${typed}" "${run_url}" "${native_note}")"
          # Summarize only Rust-validated, bounded, structurally correlated
          # per-container evidence. Never parse arbitrary runner protobuf.
          if [[ "${TYPED_OUTCOME}" = success && "${TARGET_KIND}" = VM &&
                ( "${COMMAND_BODY}" = "/host status ${TARGET_MACHINE} --deep" ||
                  "${HOST_OPERATION}" = APPLY_PREFLIGHT ) ]]; then
            report="${RUNNER_TEMP}/host-readback-result.txt"
            if [[ -f "${report}" && ! -L "${report}" ]] &&
               grep -q '^host_vm_resources_count=' "${report}" &&
               grep -Fxq 'host_vm_resources_origin=RUNNER_COPIED_UNAUTHENTICATED' "${report}"; then
              per_resource="$(awk '/^host_vm_resource=/{print; if (++n == 24) exit}' "${report}")"
              counts="$(grep -E '^host_vm_resources_(count|problem_count)=' "${report}")"
              body="${body}$(printf '\nVM containers / post-failure evidence (Rust-validated; runner copy UNAUTHENTICATED; no mutation authority):\n~~~text\n%s\n%s\n~~~\n' "${counts}" "${per_resource}")"
            else
              body="${body}$(printf '\nVM containers: UNPROVEN — no accepted installed-owner resource report.\n')"
            fi
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f "body=${body}" >/dev/null
          if [[ "${TYPED_OUTCOME}" = failure ]]; then
            echo 'HOST_TYPED_READBACK_REJECTED' >&2
            exit 1
          fi
