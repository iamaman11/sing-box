name: VM Application Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        description: Authorized /application or /production command from the control-plane router
        required: true
        type: string

permissions: {}

# Acceptance/production application operations share the same managed VM and
# Cloudflare DNS/Worker ownership as disposable first-use. Never interleave
# another application operation between GitHub BEGIN and consumer verification.
# A read-only diagnose must not hold the credentials mutation lock when
# the selected VM self-hosted runner is offline. All writes retain that lock.
concurrency:
  group: ${{ (inputs.command_body == '/production diagnose' || inputs.command_body == '/production quality-line2' || startsWith(inputs.command_body, '/vm diagnose ') || startsWith(inputs.command_body, '/vm quality-line2 ') || startsWith(inputs.command_body, '/vm credential-runtime-source ') || startsWith(inputs.command_body, '/vm credential-initial-probe ')) && format('vm-observe-{0}', github.run_id) || format('credential-transaction-{0}', github.repository_id) }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      command_family: ${{ steps.parse.outputs.command_family }}
      operation: ${{ steps.parse.outputs.operation }}
      spec_path: ${{ steps.parse.outputs.spec_path }}
      authorized_digest: ${{ steps.parse.outputs.authorized_digest }}
      runtime_machine: ${{ steps.parse.outputs.runtime_machine }}

    steps:
      - name: Checkout exact canonical VM inventory before selecting any runner
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.command_body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import json
          import re
          from pathlib import Path

          def fail(message):
              raise SystemExit(message)

          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          command_family = ""
          operation = ""
          spec_path = ""
          authorized_digest = ""
          runtime_machine = ""

          if len(tokens) == 2 and tokens[0] == "/production" and tokens[1] in {
              "enroll-runtime",
              "converge",
              "verify",
              "diagnose",
              "quality-line2",
              "rollback",
          }:
              command_family = "production"
              operation = tokens[1]
              spec_path = "infra/production/production.textproto"
              runtime_machine = "production-1"
          elif len(tokens) == 3 and tokens[0] == "/vm" and tokens[1] in {
              "diagnose", "quality-line2", "credential-runtime-source", "credential-initial-probe",
          }:
              # Git chooses the machine; no caller-controlled IP, runner label,
              # shell, or second authority source.
              spec_path = tokens[2]
              if not re.fullmatch(r"infra/application/[a-z0-9][a-z0-9_-]*\.json", spec_path):
                  fail("VM target must be an existing exact Git-owned application manifest")
              desired = json.loads(Path(spec_path).read_text(encoding="utf-8"))
              bundle_root = desired.get("bundle_root", "")
              if (desired.get("schema") != 2 or
                  desired.get("runtime_env_required") is not True or
                  not isinstance(bundle_root, str) or
                  not re.fullmatch(r"(?:[a-z0-9][a-z0-9_-]*/){1,8}[a-z0-9][a-z0-9_-]*", bundle_root)):
                  fail("VM application manifest has an unsupported typed schema/relative bundle owner")
              runtime_machine = desired.get("machine_id", "")
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,62}", runtime_machine):
                  fail("VM application machine identity is malformed")
              provider_spec = desired.get("vultr_spec_path", "")
              if not isinstance(provider_spec, str) or not re.fullmatch(
                  r"infra/vultr/[a-z0-9][a-z0-9_-]*\.json", provider_spec
              ):
                  fail("VM manifest has an invalid Git-owned Vultr spec reference")
              inventory = json.loads(Path(provider_spec).read_text(encoding="utf-8"))
              machines = inventory.get("machines", [])
              if (inventory.get("schema") != 1 or
                  not isinstance(machines, list) or
                  len([m for m in machines if isinstance(m, dict) and m.get("id") == runtime_machine]) != 1):
                  fail("VM machine is not uniquely declared in the referenced Git Vultr inventory")
              machine = next(m for m in machines if m["id"] == runtime_machine)
              if (desired.get("environment") != inventory.get("environment") or
                  desired.get("application_profile") not in machine.get("application_profiles", []) or
                  machine.get("bootstrap_profile") != "singbox-host-v2"):
                  fail("VM application policy and provider inventory disagree on machine ownership")
              command_family = "vm"
              operation = tokens[1]
          elif len(tokens) == 2 and tokens[0] == "/application" and tokens[1] in {
              "mesh-profile-plan", "mesh-profile-verify",
          }:
              command_family = "mesh_profile"
              operation = tokens[1]
              spec_path = "infra/cloudflare/zero-trust-lifecycle.json"
          elif len(tokens) == 3 and tokens[:2] == ["/application", "mesh-profile-apply"]:
              digest = tokens[2]
              if len(digest) != 64 or any(c not in "0123456789abcdef" for c in digest):
                  fail("mesh-profile-apply requires one exact lowercase SHA-256 authority")
              command_family = "mesh_profile"
              operation = "mesh-profile-apply"
              authorized_digest = digest
              spec_path = "infra/cloudflare/zero-trust-lifecycle.json"
          elif tokens == ["/application", "acceptance"]:
              command_family = "application"
              operation = "acceptance"
              spec_path = "infra/application/disposable-acceptance.json"
          elif tokens == ["/application", "cleanup"]:
              command_family = "application"
              operation = "cleanup"
              spec_path = "infra/application/disposable-acceptance.json"
          else:
              fail(
                  "unsupported command grammar; steady-state production uses "
                  "/production enroll-runtime|converge|verify|diagnose|quality-line2|rollback, provider-only target-plane commands, "
                  "or /application mesh-profile-plan|mesh-profile-verify|mesh-profile-apply <authority>, " 
                  "or /vm diagnose|quality-line2|credential-runtime-source|credential-initial-probe infra/application/<git-owned-manifest>.json, "
                  "or disposable /application acceptance|cleanup"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"command_family={command_family}\n")
              handle.write(f"operation={operation}\n")
              handle.write(f"spec_path={spec_path}\n")
              handle.write(f"authorized_digest={authorized_digest}\n")
              handle.write(f"runtime_machine={runtime_machine}\n")
          PY

  mesh_profile:
    needs: authorize
    if: needs.authorize.outputs.command_family == 'mesh_profile'
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f infra/cloudflare/zero-trust-guardrails.json
          test -f infra/cloudflare/zero-trust-lifecycle.json

      - name: Resolve exact accepted release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${RUNNER_TEMP}/edge-platform-release/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          chmod 0755 "${RUNNER_TEMP}/edge-platform-release/edge-orchestrator-linux-amd64"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${RUNNER_TEMP}/edge-platform-release/resolved.env" >> "${GITHUB_ENV}"

      - name: Execute exact scoped Mesh profile command
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDGE_OPERATION: ${{ needs.authorize.outputs.operation }}
          EDGE_PLAN_AUTHORITY: ${{ needs.authorize.outputs.authorized_digest }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          bin="${RUNNER_TEMP}/edge-platform-release/edge-orchestrator-linux-amd64"
          case "${EDGE_OPERATION}" in
            mesh-profile-plan)
              "${bin}" cloudflare-target-plane acceptance-profile plan
              ;;
            mesh-profile-verify)
              "${bin}" cloudflare-target-plane acceptance-profile verify
              ;;
            mesh-profile-apply)
              [[ "${EDGE_PLAN_AUTHORITY}" =~ ^[0-9a-f]{64}$ ]]
              "${bin}" cloudflare-target-plane acceptance-profile apply "${EDGE_PLAN_AUTHORITY}"
              ;;
            *)
              echo 'not an exact Mesh profile operation' >&2
              exit 1
              ;;
          esac

  production_enroll:
    needs: authorize
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    if: >-
      needs.authorize.outputs.command_family == 'production' &&
      needs.authorize.outputs.operation == 'enroll-runtime'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          agent="${dir}/edge-agent-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sha256sum "${agent}" | awk '{print $1}')" = "${EDGE_AGENT_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_ENROLL_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_ENROLL_AGENT=%s\n' "${agent}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"
          printf 'EDGE_DOCKER_ENGINE_VERSION=%s\n' "${EDGE_DOCKER_ENGINE_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_CONTAINERD_VERSION=%s\n' "${EDGE_CONTAINERD_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_COMPOSE_VERSION=%s\n' "${EDGE_COMPOSE_VERSION}" >> "${GITHUB_ENV}"

      - name: Materialize bounded bootstrap SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Discover bounded bootstrap egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4 or not value.is_global:
              raise SystemExit("bootstrap egress is not a global IPv4 address")
          print(value)
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Mint short-lived runner registration token
        shell: bash
        env:
          IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN:-}"
          response="$(curl --fail --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runners/registration-token")"
          token="$(jq -er '.token' <<<"${response}")"
          echo "::add-mask::${token}"
          printf 'EDGE_RUNNER_REGISTRATION_TOKEN=%s\n' "${token}" >> "${GITHUB_ENV}"

      - name: Enroll canonical production runtime transport
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          "${EDGE_ENROLL_ORCHESTRATOR}" production enroll-runtime \
            "${EDGE_ENROLL_AGENT}" \
            "edge-platform/scripts/install-vultr-production-runner.sh" \
            | tee "${RUNNER_TEMP}/production-enroll-result.txt"
          grep -Fxq 'operation=ENROLL_RUNTIME' "${RUNNER_TEMP}/production-enroll-result.txt"
          grep -Fxq 'steady_state_transport=GITHUB_SELF_HOSTED_RUNNER' "${RUNNER_TEMP}/production-enroll-result.txt"
          grep -Fxq 'transient_support_access=ABSENT' "${RUNNER_TEMP}/production-enroll-result.txt"

      - name: Verify production runner online
        shell: bash
        env:
          IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_name="sing-box-production-production-1"
          for attempt in {1..20}; do
            response="$(curl --fail --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${REPOSITORY}/actions/runners?per_page=100")"
            if jq -e --arg name "${expected_name}" '
              .runners[]
              | select(.name == $name and .status == "online")
              | [.labels[].name] as $labels
              | ($labels | index("self-hosted")) != null
                and ($labels | index("Linux")) != null
                and ($labels | index("X64")) != null
                and ($labels | index("sing-box-production-vm")) != null
                and ($labels | index("production-1")) != null
                and ($labels | index("vultr-root")) == null
                and ($labels | index("test-vm")) == null
            ' <<<"${response}" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "production runtime runner did not become online" >&2
          exit 1

      - name: Remove bootstrap SSH authority material
        if: always()
        shell: bash
        run: |
          rm -f "${EDGE_SSH_PRIVATE_KEY_PATH:-}" || true


  production_provider:
    needs: authorize
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    if: >-
      needs.authorize.outputs.command_family == 'production' &&
      (
        needs.authorize.outputs.operation == 'converge' ||
        needs.authorize.outputs.operation == 'verify' ||
        needs.authorize.outputs.operation == 'rollback'
      )
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      accepted_revision: ${{ steps.release.outputs.accepted_revision }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      agent_sha256: ${{ steps.release.outputs.agent_sha256 }}
      application_bundle_sha256: ${{ steps.release.outputs.application_bundle_sha256 }}
      application_bundle_asset_id: ${{ steps.release.outputs.application_bundle_asset_id }}
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test "${SPEC_PATH}" = "infra/production/production.textproto"
          test -f "${SPEC_PATH}"

      - name: Resolve exact durable Edge Platform release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_PROVIDER_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"
          printf 'accepted_revision=%s\n' "${EDGE_ACCEPTED_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'agent_sha256=%s\n' "${EDGE_AGENT_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'application_bundle_sha256=%s\n' "${EDGE_APPLICATION_BUNDLE_SHA256}" >> "${GITHUB_OUTPUT}"
          release_json="$(gh api "repos/${REPOSITORY}/releases/tags/${EDGE_RELEASE_TAG}")"
          application_bundle_asset_id="$(jq -er '
            [.assets[] | select(.name == "application-bundle.pb")]
            | if length == 1 then .[0].id else error("application-bundle.pb asset cardinality mismatch") end
          ' <<<"${release_json}")"
          [[ "${application_bundle_asset_id}" =~ ^[0-9]+$ ]]
          printf 'application_bundle_asset_id=%s\n' "${application_bundle_asset_id}" >> "${GITHUB_OUTPUT}"

      - name: Read-only production DNS ownership gate
        shell: bash
        env:
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          set -euo pipefail
          case "${REQUESTED_OPERATION}" in
            converge|verify|rollback)
              ;;
            *)
              echo "provider plane received unsupported production operation" >&2
              exit 1
              ;;
          esac
          # This is the actual GitHub operator path, before VM bundle mutation.
          # No Cloudflare target-plane converge or implicit DNS/Mesh publication.
          result="${RUNNER_TEMP}/production-provider-result.txt"
          "${EDGE_PROVIDER_ORCHESTRATOR}" production dns-noop | tee "${result}"
          grep -Fxq 'operation=PRODUCTION_DNS_NOOP' "${result}"
          grep -Fxq 'provider_mutations=0' "${result}"
          grep -Fxq 'production_runtime_mutations=0' "${result}"
          {
            echo '### Production provider plane'
            echo
            echo 'Provider credentials existed only on this GitHub-hosted job.'
            echo 'No SSH key, runtime credential plaintext, or production-VM runner authority was materialized.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

  production_observe:
    needs: authorize
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    if: >-
      needs.authorize.outputs.command_family == 'production' &&
      needs.authorize.outputs.operation == 'diagnose'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      accepted_revision: ${{ steps.release.outputs.accepted_revision }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      agent_sha256: ${{ steps.release.outputs.agent_sha256 }}
    env:
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test "${SPEC_PATH}" = "infra/production/production.textproto"
          test -f "${SPEC_PATH}"

      - name: Resolve exact durable Edge Platform release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_APPLICATION_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"
          printf 'accepted_revision=%s\n' "${EDGE_ACCEPTED_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'release_set_sha256=%s\n' "${EDGE_RELEASE_SET_SHA256}" >> "${GITHUB_OUTPUT}"
          printf 'agent_sha256=%s\n' "${EDGE_AGENT_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Execute read-only production provider inventory
        if: needs.authorize.outputs.operation == 'diagnose'
        shell: bash
        env:
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/cloudflare-production-inventory.txt"
          {
            echo '### Cloudflare production read-only inventory'
            echo
            echo 'Typed Rust owns COMPLETE/BLOCKED/failure semantics and zero-mutation safety. Steady-state diagnosis observes only the dedicated active production account and the explicit shared DNS boundary; historical retirement authority is not part of normal production diagnosis.'
            echo
            echo '~~~text'
          } >> "${GITHUB_STEP_SUMMARY}"

          set +e
          "${EDGE_APPLICATION_ORCHESTRATOR}" production diagnose 2>&1 | tee "${result}"
          command_rc=${PIPESTATUS[0]}
          set -e

          cat "${result}" >> "${GITHUB_STEP_SUMMARY}"
          echo '~~~' >> "${GITHUB_STEP_SUMMARY}"
          exit "${command_rc}"
  production_runtime:
    needs:
      - authorize
      - production_provider
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      (
        (
          needs.authorize.outputs.command_family == 'vm' &&
          (
            needs.authorize.outputs.operation == 'diagnose' ||
            needs.authorize.outputs.operation == 'quality-line2' ||
            needs.authorize.outputs.operation == 'credential-runtime-source' ||
            needs.authorize.outputs.operation == 'credential-initial-probe'
          )
        ) ||
        (
          needs.authorize.outputs.command_family == 'production' &&
          (
            needs.authorize.outputs.operation == 'diagnose' ||
            needs.authorize.outputs.operation == 'quality-line2' ||
            (
              (
                needs.authorize.outputs.operation == 'converge' ||
                needs.authorize.outputs.operation == 'verify' ||
                needs.authorize.outputs.operation == 'rollback'
              ) &&
              needs.production_provider.result == 'success'
            )
          )
        )
      )
    concurrency:
      # Lock only the exact Git-selected VM. An absent legacy production-1
      # runner must not block a healthy application-acceptance-1 runner.
      # All mutating workflows still use the global credential/provider lock.
      group: sing-box-production-runtime-${{ needs.authorize.outputs.runtime_machine }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - Linux
      - X64
      - sing-box-production-vm
      - ${{ needs.authorize.outputs.runtime_machine }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}
      VM_RUNTIME_MACHINE: ${{ needs.authorize.outputs.runtime_machine }}
      PROVIDER_ACCEPTED_REVISION: ${{ needs.production_provider.outputs.accepted_revision }}
      PROVIDER_RELEASE_SET_SHA256: ${{ needs.production_provider.outputs.release_set_sha256 }}
      PROVIDER_AGENT_SHA256: ${{ needs.production_provider.outputs.agent_sha256 }}
      PROVIDER_APPLICATION_BUNDLE_SHA256: ${{ needs.production_provider.outputs.application_bundle_sha256 }}
      PROVIDER_APPLICATION_BUNDLE_ASSET_ID: ${{ needs.production_provider.outputs.application_bundle_asset_id }}

    steps:
      - name: Download exact ReleaseSet-bound VM bundle
        if: env.REQUESTED_OPERATION == 'converge' || env.REQUESTED_OPERATION == 'verify' || env.REQUESTED_OPERATION == 'rollback'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "${PROVIDER_APPLICATION_BUNDLE_ASSET_ID}" =~ ^[0-9]+$ ]]
          out="${RUNNER_TEMP}/production-runtime-bundle"
          install -d -m 0700 "${out}"
          bundle="${out}/application-bundle.pb"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --connect-timeout 10 \
            --max-time 60 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "${bundle}" \
            "https://api.github.com/repos/${REPOSITORY}/releases/assets/${PROVIDER_APPLICATION_BUNDLE_ASSET_ID}"
          test -s "${bundle}"

      - name: Verify bounded local runtime authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VM_RUNTIME_MACHINE}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo 'vm_runtime_target=BLOCKED_INVALID_GIT_IDENTITY' >&2
            exit 1
          fi
          if [[ "${RUNNER_NAME}" != "sing-box-production-${VM_RUNTIME_MACHINE}" ]]; then
            echo 'vm_runtime_target=BLOCKED_RUNNER_IDENTITY_MISMATCH' >&2
            exit 1
          fi
          owner="/usr/local/libexec/sing-box/edge-agent"
          if [[ ! -x "${owner}" || -L "${owner}" ]]; then
            echo 'vm_owner_identity=BLOCKED_INSTALLED_OWNER_PATH' >&2
            exit 1
          fi

          # Native host filesystem authority for reading its own actual state.
          # Refuse writable/symlinked paths before invoking the fixed sudo allowlist.
          for path in /usr /usr/local /usr/local/libexec "$(dirname "${owner}")" "${owner}"; do
            if [[ -L "${path}" || "$(stat -c '%u:%g:%a' "${path}")" != "0:0:755" ]]; then
              echo 'vm_owner_identity=BLOCKED_INSTALLED_OWNER_FILESYSTEM_TRUST' >&2
              exit 1
            fi
          done
          if [[ "$(id -u)" = "0" ]]; then
            echo 'production self-hosted runner must not run as root' >&2
            exit 1
          fi
          if sudo -n id -u >/dev/null 2>&1; then
            echo 'production self-hosted runner unexpectedly has generic root authority' >&2
            exit 1
          fi
          if test -r /var/run/docker.sock; then
            echo 'production self-hosted runner unexpectedly has direct Docker socket authority' >&2
            exit 1
          fi

          if ! observed="$(sha256sum "${owner}" | awk '{print $1}')"; then
            echo 'vm_owner_identity=BLOCKED_OWNER_DIGEST_UNAVAILABLE' >&2
            exit 1
          fi
          echo "vm_owner_observed_sha256=${observed}"
          echo "vm_owner_desired_revision=${GITHUB_SHA}"

          case "${REQUESTED_OPERATION}" in
            diagnose|quality-line2|credential-runtime-source|credential-initial-probe)
              # Read existing VM state using its installed, root-owned Rust owner.
              # Desired ReleaseSet drift must not blind read-only diagnostics.
              echo 'vm_owner_identity=PASS_NATIVE_INSTALLED_READONLY'
              ;;
            converge|verify|rollback)
              expected_revision="${PROVIDER_ACCEPTED_REVISION}"
              expected_release_set="${PROVIDER_RELEASE_SET_SHA256}"
              expected_owner="${PROVIDER_AGENT_SHA256}"
              if [[ "${expected_revision}" != "${GITHUB_SHA}" ||
                    ! "${expected_release_set}" =~ ^[0-9a-f]{64}$ ||
                    ! "${expected_owner}" =~ ^[0-9a-f]{64}$ ]]; then
                echo 'vm_owner_identity=BLOCKED_EXPECTED_RELEASE_AUTHORITY' >&2
                exit 1
              fi
              echo "vm_owner_expected_sha256=${expected_owner}"
              echo "vm_owner_expected_release_set=${expected_release_set}"
              if [[ "${observed}" != "${expected_owner}" ]]; then
                echo 'vm_owner_identity=BLOCKED_INSTALLED_OWNER_MISMATCH' >&2
                exit 1
              fi
              echo 'vm_owner_identity=PASS_EXACT_ACCEPTED_OWNER'
              sudo -n "${owner}" local status >/dev/null
              ;;
            *)
              echo 'vm_owner_identity=BLOCKED_UNSUPPORTED_OPERATION' >&2
              exit 1
              ;;
          esac

      - name: Verify exact transported application bundle
        if: env.REQUESTED_OPERATION == 'converge' || env.REQUESTED_OPERATION == 'verify'
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/production-runtime-bundle/application-bundle.pb"
          test -s "${bundle}"
          [[ "${PROVIDER_APPLICATION_BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          observed="$(sha256sum "${bundle}" | awk '{print $1}')"
          test "${observed}" = "${PROVIDER_APPLICATION_BUNDLE_SHA256}"
          chmod 0600 "${bundle}"
          printf 'EDGE_LOCAL_APPLICATION_BUNDLE=%s\n' "${bundle}" >> "${GITHUB_ENV}"

      - name: Execute typed local runtime operation
        shell: bash
        run: |
          set -euo pipefail
          owner="/usr/local/libexec/sing-box/edge-agent"
          case "${REQUESTED_OPERATION}" in
            converge)
              local_operation="bundle-converge"
              ;;
            verify)
              local_operation="bundle-verify"
              ;;
            rollback)
              local_operation="bundle-rollback"
              ;;
            diagnose)
              local_operation="diagnose"
              ;;
            quality-line2)
              local_operation="quality-line2"
              ;;
            credential-runtime-source)
              # Installed sudoers grants exact local diagnose, not arbitrary
              # future subcommands. Diagnose owns this read-only attestation.
              local_operation="diagnose"
              ;;
            credential-initial-probe)
              local_operation="credential-initial-probe"
              ;;
            *)
              echo "runtime plane received unsupported production operation" >&2
              exit 1
              ;;
          esac

          result="${RUNNER_TEMP}/production-runtime-result.txt"
          if [[ "${REQUESTED_OPERATION}" = "converge" || "${REQUESTED_OPERATION}" = "verify" || "${REQUESTED_OPERATION}" = "rollback" ]]; then
            test -s "${EDGE_LOCAL_APPLICATION_BUNDLE}"
            sudo -n "${owner}" local "${local_operation}" < "${EDGE_LOCAL_APPLICATION_BUNDLE}" | tee "${result}"
          else
            sudo -n "${owner}" local "${local_operation}" | tee "${result}"
          fi
          if [[ "${REQUESTED_OPERATION}" == "credential-runtime-source" ]]; then
            grep -Fxq 'credential_runtime_proof=PASS_PROCESS_VISIBLE_FILES' "${result}" || {
              echo 'VM credential-source evidence incomplete; no promotion authorization' >&2
              exit 1
            }
          fi
          if [[ "${REQUESTED_OPERATION}" == "diagnose" ]]; then
            # The existing root-owned typed read API exposes generation metadata;
            # never copy the credential bundle digest, bytes, or key material.
            if credential_evidence="$(sudo -n "${owner}" local credential-state)"; then
              printf '%s\n' 'vm_credential_observation=PASS' | tee -a "${result}"
              printf '%s\n' "${credential_evidence}" |
                grep -E '^credential_(state_present|active_present|active_generation|active_slot|candidate_present|previous_present)=' |
                tee -a "${result}" || {
                  printf '%s\n' 'vm_credential_fields=UNPROVEN' | tee -a "${result}"
                }
            else
              printf '%s\n' 'vm_credential_observation=UNAVAILABLE' | tee -a "${result}"
            fi
          fi

          {
            echo "### VM runtime plane: ${VM_RUNTIME_MACHINE}"
            echo
            printf 'Operation: `%s` -> local owner `%s`\n' "${REQUESTED_OPERATION}" "${local_operation}"
            echo
            echo 'Transport: exact ReleaseSet-bound application bundle via GitHub Actions artifact.'
            echo 'Privilege boundary: fixed sudo allowlist -> root-owned local edge-agent.'
            echo 'The self-hosted runner performs no source checkout, semantic rendering, provider mutation or direct Docker operation.'
            echo
            echo '~~~text'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    needs: authorize
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    if: needs.authorize.outputs.command_family == 'application' && needs.authorize.outputs.operation == 'cleanup'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}
      DNS_SPEC_PATH: infra/cloudflare/application-acceptance-dns.json
      MESH_SPEC_PATH: infra/cloudflare/application-acceptance-mesh.json
      VPC_SPEC_PATH: infra/vultr/application-acceptance-vpc.json

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"
          test -f "${DNS_SPEC_PATH}"
          test -f "${MESH_SPEC_PATH}"
          test -f "${VPC_SPEC_PATH}"

      - name: Resolve exact durable Edge Platform release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_APPLICATION_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"

      - name: Validate disposable cleanup authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er '.environment' "${SPEC_PATH}")" = "application-acceptance"
          test "$(jq -er '.machine_id' "${SPEC_PATH}")" = "application-acceptance-1"
          test "$(jq -er '.record_name' "${DNS_SPEC_PATH}")" = "stage2-acceptance.alegria.by"
          test "$(jq -er '.environment' "${VPC_SPEC_PATH}")" = "application-acceptance"
          test "$(jq -er '.machine_id' "${VPC_SPEC_PATH}")" = "application-acceptance-1"
          if grep -R --fixed-strings -n "miu.alegria.by" \
              "${MESH_SPEC_PATH}" "${DNS_SPEC_PATH}" "${VPC_SPEC_PATH}" "${SPEC_PATH}"; then
            echo "disposable cleanup must not reference permanent production DNS" >&2
            exit 1
          fi

      - name: Run typed disposable cleanup coordinator
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/application-cleanup-result.json"
          set +e
          "${EDGE_APPLICATION_ORCHESTRATOR}" application-cleanup \
            "${SPEC_PATH}" \
            "${DNS_SPEC_PATH}" \
            "${MESH_SPEC_PATH}" \
            "${VPC_SPEC_PATH}" \
            | tee "${result}"
          operation_rc="${PIPESTATUS[0]}"
          set -e

          if [[ -s "${result}" ]]; then
            {
              echo '### Disposable application cleanup'
              echo '~~~json'
              cat "${result}"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit "${operation_rc}"


  acceptance:
    needs: authorize
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    if: needs.authorize.outputs.command_family == 'application' && needs.authorize.outputs.operation == 'acceptance'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified application artifacts
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          agent="${dir}/edge-agent-linux-amd64"
          agent_manifest="${RUNNER_TEMP}/edge-agent-artifact.json"
          chmod 0755 "${orchestrator}" "${agent}"
          export EDGE_RELEASE_CONTEXT_PATH="${dir}/resolved.env"
          "${orchestrator}" application-lifecycle materialize \
            "${SPEC_PATH}" "${agent_manifest}" "${agent}"
          chmod 0600 "${agent_manifest}"
          printf 'EDGE_DOCKER_ENGINE_VERSION=%s\n' "${EDGE_DOCKER_ENGINE_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_CONTAINERD_VERSION=%s\n' "${EDGE_CONTAINERD_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_COMPOSE_VERSION=%s\n' "${EDGE_COMPOSE_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ARTIFACT=%s\n' "${agent}" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ARTIFACT_MANIFEST=%s\n' "${agent_manifest}" >> "${GITHUB_ENV}"

      - name: Materialize strict SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Verify provider authorities before acceptance
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENROLLED_DEVICE_REACHABILITY_CONFIRMED: ${{ vars.CLOUDFLARE_ENROLLED_DEVICE_REACHABILITY_CONFIRMED }}
        run: |
          set -euo pipefail
          test -n "${VULTR_API_KEY}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -s "${EDGE_SSH_PRIVATE_KEY_PATH}"

          bin="${EDGE_APPLICATION_ORCHESTRATOR}"
          vultr_spec="$(jq -er '.vultr_spec_path' "${SPEC_PATH}")"
          test -f "${vultr_spec}"

          "${bin}" vultr-lifecycle doctor "${vultr_spec}"             > "${RUNNER_TEMP}/acceptance-vultr-authority-doctor.json"
          jq -e '
            .status == "PASS" and
            .catalog_validation == "PASS" and
            .operator_key_match == "PASS" and
            .mutations_performed == 0
          ' "${RUNNER_TEMP}/acceptance-vultr-authority-doctor.json" >/dev/null

          # The typed doctor writes its structured observation before returning BLOCKED.
          # Surface only boolean readiness, never account/device/connector names or secrets.
          cf_report="${RUNNER_TEMP}/acceptance-zero-trust-doctor.json"
          cf_exit=0
          "${bin}" cloudflare-zero-trust doctor infra/cloudflare/zero-trust-guardrails.json --scope vm-server > "${cf_report}" || cf_exit=$?
          if [[ -s "${cf_report}" ]]; then
            jq -c '{
              scope,
              status,
              token_read_authority,
              device_settings_ready: .device_settings.ready,
              connectors_ready: .connectors.ready,
              unexpected_connector_count: (.connectors.unexpected_names | length),
              mesh_node_profile_ready: .mesh_node_profile.ready,
              mesh_selector_matches: .mesh_node_profile.exact_selector_matches,
              mesh_cidr_included: .mesh_node_profile.mesh_cidr_included,
              enrollment_ready: .enrollment.ready,
              gateway_ready: .gateway.ready,
              manual_prerequisites_ready: .manual_prerequisites.ready
            }' "${cf_report}" | tee "${RUNNER_TEMP}/acceptance-cloudflare-readiness-summary.json"
            {
              echo '### Disposable application Cloudflare readiness (read-only)'
              echo '~~~json'
              cat "${RUNNER_TEMP}/acceptance-cloudflare-readiness-summary.json"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ "${cf_exit}" -ne 0 ]]; then
            echo "Cloudflare Zero Trust readiness blocked disposable application acceptance before VM creation" >&2
            exit "${cf_exit}"
          fi
          # Cloudflare requires the warp_connector Mesh NODE profile before
          # server attachment. That is distinct from Android client E2E
          # enrollment/traffic, which remains a separate Stage 4B.5 gate.
          # Keep account prerequisites fail-closed before disposable VM creation.
          jq -e '
            .scope == "vm-server" and
            .status == "PASS" and
            .token_read_authority == "PASS" and
            .connectors.ready == true and
            .mesh_node_profile.ready == true
          ' "${cf_report}" >/dev/null

      - name: Validate disposable provider desired state
        shell: bash
        run: |
          set -euo pipefail
          mesh_base_spec="infra/cloudflare/application-acceptance-mesh.json"
          dns_spec="infra/cloudflare/application-acceptance-dns.json"
          vpc_spec="infra/vultr/application-acceptance-vpc.json"
          test -f "${mesh_base_spec}"
          test -f "${dns_spec}"
          test -f "${vpc_spec}"
          test "$(jq -er '.account_id' "${mesh_base_spec}")" = "4426df1449e417511bc7697d60b7f62f"
          test "$(jq -er '.routes | length' "${mesh_base_spec}")" = "0"
          test "$(jq -er '.record_name' "${dns_spec}")" = "stage2-acceptance.alegria.by"
          test "$(jq -er '.zone_name' "${dns_spec}")" = "alegria.by"
          test "$(jq -er '.environment' "${vpc_spec}")" = "application-acceptance"
          test "$(jq -er '.machine_id' "${vpc_spec}")" = "application-acceptance-1"
          if grep -R --fixed-strings -n "miu.alegria.by" \
              "${mesh_base_spec}" "${dns_spec}" "${vpc_spec}" "${SPEC_PATH}"; then
            echo "disposable acceptance must not reference permanent production DNS" >&2
            exit 1
          fi
          printf 'EDGE_ACCEPTANCE_MESH_BASE_SPEC=%s\n' "${mesh_base_spec}" >> "${GITHUB_ENV}"
          printf 'EDGE_ACCEPTANCE_DNS_SPEC=%s\n' "${dns_spec}" >> "${GITHUB_ENV}"
          printf 'EDGE_ACCEPTANCE_VPC_SPEC=%s\n' "${vpc_spec}" >> "${GITHUB_ENV}"

      - name: Discover controller egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4 or not value.is_global:
              raise SystemExit("controller egress is not a global IPv4 address")
          print(value)
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Run typed provider-backed disposable acceptance
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/application-acceptance-result.json"

          set +e
          "${EDGE_APPLICATION_ORCHESTRATOR}" application-acceptance \
            "${SPEC_PATH}" \
            "${EDGE_APPLICATION_ARTIFACT_MANIFEST}" \
            "${EDGE_APPLICATION_ARTIFACT}" \
            "${EDGE_ACCEPTANCE_DNS_SPEC}" \
            "${EDGE_ACCEPTANCE_MESH_BASE_SPEC}" \
            "${EDGE_ACCEPTANCE_VPC_SPEC}" \
            | tee "${result}"
          operation_rc="${PIPESTATUS[0]}"
          set -e

          if [[ -s "${result}" ]]; then
            {
              echo '### Full disposable Stage 2 application acceptance'
              echo '~~~json'
              cat "${result}"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit "${operation_rc}"

      - name: Remove local sensitive material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${EDGE_SSH_PRIVATE_KEY_PATH:-${RUNNER_TEMP}/singbox-vultr-ops}"
