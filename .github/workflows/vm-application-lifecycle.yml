name: VM Application Lifecycle

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: vm-application-lifecycle-production
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'iamaman11/sing-box' &&
      github.repository_id == '1221750822' &&
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.actor_id == '44100369' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.parse.outputs.operation }}
      spec_path: ${{ steps.parse.outputs.spec_path }}
      rollback_digest: ${{ steps.parse.outputs.rollback_digest }}

    steps:
      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re

          spec_re = re.compile(r"^infra/application/[A-Za-z0-9._/-]+\.json$")
          digest_re = re.compile(r"^[0-9a-f]{64}$")

          def fail(message):
              raise SystemExit(message)

          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          operation = ""
          spec_path = ""
          rollback_digest = ""

          if len(tokens) == 3 and tokens[0] == "/application" and tokens[1] in {
              "plan", "apply", "verify", "upgrade", "rollback-plan"
          }:
              operation = tokens[1]
              spec_path = tokens[2]
          elif (
              len(tokens) == 4
              and tokens[0] == "/application"
              and tokens[1] == "rollback-apply"
          ):
              operation = "rollback-apply"
              spec_path = tokens[2]
              rollback_digest = tokens[3]
          else:
              fail("unsupported /application command grammar")

          if not spec_re.fullmatch(spec_path) or ".." in spec_path or "//" in spec_path:
              fail("invalid application spec path")
          if operation == "rollback-apply":
              if not digest_re.fullmatch(rollback_digest):
                  fail("rollback-apply requires a lowercase 64-character digest")
          elif rollback_digest:
              fail("rollback digest is only valid for rollback-apply")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"operation={operation}\n")
              handle.write(f"spec_path={spec_path}\n")
              handle.write(f"rollback_digest={rollback_digest}\n")
          PY

  verify:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Build exact controller and Linux edge-agent without production secrets
        working-directory: edge-platform
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p edge-controller --bin edge-controller
          cargo build --locked --release -p edge-agent --bin edge-agent

  execute:
    needs: [authorize, verify]
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}
      ROLLBACK_DIGEST: ${{ needs.authorize.outputs.rollback_digest }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Build exact application control binaries
        working-directory: edge-platform
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p edge-controller --bin edge-controller
          cargo build --locked --release -p edge-agent --bin edge-agent

      - name: Bind exact edge-agent artifact to source revision
        shell: bash
        run: |
          set -euo pipefail
          artifact="edge-platform/target/release/edge-agent"
          test -x "${artifact}"
          sha="$(sha256sum "${artifact}" | awk '{print $1}')"
          [[ "${sha}" =~ ^[0-9a-f]{64}$ ]]
          manifest="${RUNNER_TEMP}/edge-agent-artifact.json"
          jq -n             --arg source_revision "${GITHUB_SHA}"             --arg sha256 "${sha}"             '{schema:1, source_revision:$source_revision, sha256:$sha256}' > "${manifest}"
          chmod 600 "${manifest}"
          printf 'EDGE_APPLICATION_ARTIFACT=%s\n' "${artifact}" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ARTIFACT_MANIFEST=%s\n' "${manifest}" >> "${GITHUB_ENV}"

      - name: Materialize strict SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Discover controller egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4 or not value.is_global:
              raise SystemExit("controller egress is not a global IPv4 address")
          print(value)
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Execute typed application lifecycle operation
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          set -euo pipefail
          bin="edge-platform/target/release/edge-controller"
          result="${RUNNER_TEMP}/application-result.json"

          run_desired() {
            "${bin}" application-lifecycle "${REQUESTED_OPERATION}"               "${SPEC_PATH}" "${EDGE_APPLICATION_ARTIFACT_MANIFEST}" "${EDGE_APPLICATION_ARTIFACT}"
          }

          case "${REQUESTED_OPERATION}" in
            plan|apply|verify|upgrade)
              run_desired | tee "${result}"
              ;;
            rollback-plan)
              "${bin}" application-lifecycle rollback-plan "${SPEC_PATH}" | tee "${result}"
              ;;
            rollback-apply)
              "${bin}" application-lifecycle rollback-apply "${SPEC_PATH}" "${ROLLBACK_DIGEST}" | tee "${result}"
              ;;
            *)
              echo "unsupported authorized application operation" >&2
              exit 1
              ;;
          esac

          {
            echo '### VM application lifecycle result'
            echo '~~~json'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"
