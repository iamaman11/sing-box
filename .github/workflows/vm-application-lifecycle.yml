name: VM Application Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        description: Authorized /application command from the control-plane router
        required: true
        type: string

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.parse.outputs.operation }}
      spec_path: ${{ steps.parse.outputs.spec_path }}
      rollback_digest: ${{ steps.parse.outputs.rollback_digest }}

    steps:
      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.command_body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re

          spec_re = re.compile(r"^infra/application/[A-Za-z0-9._/-]+\.json$")
          digest_re = re.compile(r"^[0-9a-f]{64}$")

          def fail(message):
              raise SystemExit(message)

          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          operation = ""
          spec_path = ""
          rollback_digest = ""

          if tokens == ["/application", "acceptance"]:
              operation = "acceptance"
              spec_path = "infra/application/disposable-acceptance.json"
          elif len(tokens) == 3 and tokens[0] == "/application" and tokens[1] in {
              "plan", "apply", "verify", "upgrade", "rollback-plan"
          }:
              operation = tokens[1]
              spec_path = tokens[2]
          elif (
              len(tokens) == 4
              and tokens[0] == "/application"
              and tokens[1] == "rollback-apply"
          ):
              operation = "rollback-apply"
              spec_path = tokens[2]
              rollback_digest = tokens[3]
          else:
              fail("unsupported /application command grammar")

          if not spec_re.fullmatch(spec_path) or ".." in spec_path or "//" in spec_path:
              fail("invalid application spec path")
          if operation == "rollback-apply":
              if not digest_re.fullmatch(rollback_digest):
                  fail("rollback-apply requires a lowercase 64-character digest")
          elif rollback_digest:
              fail("rollback digest is only valid for rollback-apply")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"operation={operation}\n")
              handle.write(f"spec_path={spec_path}\n")
              handle.write(f"rollback_digest={rollback_digest}\n")
          PY

  verify:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve_release.outputs.release_tag }}
      release_set_sha256: ${{ steps.resolve_release.outputs.release_set_sha256 }}
    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"

      - name: Resolve and verify exact durable Edge Platform release
        id: resolve_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

  execute:
    needs: [authorize, verify]
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    if: needs.authorize.outputs.operation != 'acceptance'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}
      ROLLBACK_DIGEST: ${{ needs.authorize.outputs.rollback_digest }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          EXPECTED_RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified application artifacts
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "${{ needs.verify.outputs.release_tag }}"
          controller="${dir}/edge-controller-linux-amd64"
          agent="${dir}/edge-agent-linux-amd64"
          test "$(sha256sum "${controller}" | awk '{print $1}')" = "${EDGE_CONTROLLER_SHA256}"
          test "$(sha256sum "${agent}" | awk '{print $1}')" = "${EDGE_AGENT_SHA256}"
          gateway_image="${EDGE_GATEWAY_IMAGE}"
          warp_image="${EDGE_WARP_EGRESS_IMAGE}"
          mesh_image="${EDGE_MESH_IMAGE}"
          [[ "${gateway_image}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
          [[ "${warp_image}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]
          [[ "${mesh_image}" =~ ^docker\.io/cloudflare/mesh@sha256:[0-9a-f]{64}$ ]]
          bundle_root="$(jq -er '.bundle_root' "${SPEC_PATH}")"
          test -d "${bundle_root}"
          printf 'EDGE_GATEWAY_IMAGE=%s\nEDGE_WARP_EGRESS_IMAGE=%s\nCLOUDFLARE_MESH_IMAGE=%s\n' \
            "${gateway_image}" "${warp_image}" "${mesh_image}" > "${bundle_root}/.images.env"
          chmod 0644 "${bundle_root}/.images.env"
          chmod 0755 "${controller}" "${agent}"
          printf 'EDGE_DOCKER_ENGINE_VERSION=%s\n' "${EDGE_DOCKER_ENGINE_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_CONTAINERD_VERSION=%s\n' "${EDGE_CONTAINERD_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_COMPOSE_VERSION=%s\n' "${EDGE_COMPOSE_VERSION}" >> "${GITHUB_ENV}"
          agent_manifest="${RUNNER_TEMP}/edge-agent-artifact.json"
          jq -n \
            --arg source_revision "${GITHUB_SHA}" \
            --arg sha256 "${EDGE_AGENT_SHA256}" \
            '{schema:1,source_revision:$source_revision,sha256:$sha256}' \
            > "${agent_manifest}"
          chmod 600 "${agent_manifest}"
          printf 'EDGE_APPLICATION_CONTROLLER=%s\n' "${controller}" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ARTIFACT=%s\n' "${agent}" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ARTIFACT_MANIFEST=%s\n' "${agent_manifest}" >> "${GITHUB_ENV}"

      - name: Materialize strict SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Discover controller egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4 or not value.is_global:
              raise SystemExit("controller egress is not a global IPv4 address")
          print(value)
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Execute typed application lifecycle operation
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          set -euo pipefail
          bin="${EDGE_APPLICATION_CONTROLLER}"
          result="${RUNNER_TEMP}/application-result.json"
          access_acquire="${RUNNER_TEMP}/application-access-acquire.json"
          access_release="${RUNNER_TEMP}/application-access-release.json"
          vultr_spec="$(jq -er '.vultr_spec_path' "${SPEC_PATH}")"
          machine="$(jq -er '.machine_id' "${SPEC_PATH}")"
          test -f "${vultr_spec}"

          ACCESS_CLEANUP_ARMED=0

          cleanup_access() {
            if [[ "${ACCESS_CLEANUP_ARMED}" != "1" ]]; then
              return 0
            fi
            local release_plan="${RUNNER_TEMP}/application-access-release-plan.json"
            local release_authority
            "${bin}" vultr-lifecycle release-access-plan "${vultr_spec}" "${machine}" > "${release_plan}"
            release_authority="$(jq -er '.plan_authority.authority_digest' "${release_plan}")"
            [[ "${release_authority}" =~ ^[0-9a-f]{64}$ ]]
            "${bin}" vultr-lifecycle release-access "${vultr_spec}" "${machine}" "${release_authority}" \
              | tee "${access_release}"
          }

          finish() {
            local operation_rc=$?
            trap - EXIT
            set +e
            cleanup_access
            local cleanup_rc=$?
            set -e
            if [[ ${cleanup_rc} -ne 0 ]]; then
              echo "ephemeral SSH ingress cleanup failed with rc=${cleanup_rc}" >&2
              if [[ ${operation_rc} -eq 0 ]]; then
                operation_rc=${cleanup_rc}
              fi
            fi
            exit "${operation_rc}"
          }

          trap finish EXIT
          ACCESS_CLEANUP_ARMED=1

          access_acquire_plan="${RUNNER_TEMP}/application-access-acquire-plan.json"
          "${bin}" vultr-lifecycle acquire-access-plan "${vultr_spec}" "${machine}" > "${access_acquire_plan}"
          access_acquire_authority="$(jq -er '.plan_authority.authority_digest' "${access_acquire_plan}")"
          [[ "${access_acquire_authority}" =~ ^[0-9a-f]{64}$ ]]
          "${bin}" vultr-lifecycle acquire-access "${vultr_spec}" "${machine}" "${access_acquire_authority}" \
            | tee "${access_acquire}"

          case "${REQUESTED_OPERATION}" in
            plan|verify)
              "${bin}" application-lifecycle "${REQUESTED_OPERATION}" \
                "${SPEC_PATH}" "${EDGE_APPLICATION_ARTIFACT_MANIFEST}" "${EDGE_APPLICATION_ARTIFACT}" \
                | tee "${result}"
              ;;
            apply|upgrade)
              authority_plan="${RUNNER_TEMP}/application-authority-plan.json"
              "${bin}" application-lifecycle plan \
                "${SPEC_PATH}" "${EDGE_APPLICATION_ARTIFACT_MANIFEST}" "${EDGE_APPLICATION_ARTIFACT}" \
                > "${authority_plan}"
              authority_digest="$(jq -er '.plan_authority.authority_digest' "${authority_plan}")"
              [[ "${authority_digest}" =~ ^[0-9a-f]{64}$ ]]
              "${bin}" application-lifecycle "${REQUESTED_OPERATION}" \
                "${SPEC_PATH}" "${EDGE_APPLICATION_ARTIFACT_MANIFEST}" "${EDGE_APPLICATION_ARTIFACT}" \
                "${authority_digest}" | tee "${result}"
              ;;
            rollback-plan)
              "${bin}" application-lifecycle rollback-plan "${SPEC_PATH}" | tee "${result}"
              ;;
            rollback-apply)
              rollback_plan="${RUNNER_TEMP}/application-rollback-authority-plan.json"
              "${bin}" application-lifecycle rollback-plan "${SPEC_PATH}" > "${rollback_plan}"
              planned_rollback_digest="$(jq -er '.rollback.rollback_digest' "${rollback_plan}")"
              authority_digest="$(jq -er '.plan_authority.authority_digest' "${rollback_plan}")"
              test "${planned_rollback_digest}" = "${ROLLBACK_DIGEST}"
              [[ "${authority_digest}" =~ ^[0-9a-f]{64}$ ]]
              "${bin}" application-lifecycle rollback-apply \
                "${SPEC_PATH}" "${ROLLBACK_DIGEST}" "${authority_digest}" | tee "${result}"
              ;;
            *)
              echo "unsupported authorized application operation" >&2
              exit 1
              ;;
          esac

          {
            echo '### VM application lifecycle result'
            echo
            echo 'Ephemeral SSH ingress was acquired through the Vultr support-resource authority.'
            echo 'The EXIT trap releases the exact runner /32 and fails the job if absence is not verified.'
            echo
            echo '~~~json'
            cat "${result}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

  acceptance:
    needs: [authorize, verify]
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    if: needs.authorize.outputs.operation == 'acceptance'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          EXPECTED_RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified application artifacts
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "${{ needs.verify.outputs.release_tag }}"
          controller="${dir}/edge-controller-linux-amd64"
          agent="${dir}/edge-agent-linux-amd64"
          test "$(sha256sum "${controller}" | awk '{print $1}')" = "${EDGE_CONTROLLER_SHA256}"
          test "$(sha256sum "${agent}" | awk '{print $1}')" = "${EDGE_AGENT_SHA256}"
          gateway_image="${EDGE_GATEWAY_IMAGE}"
          warp_image="${EDGE_WARP_EGRESS_IMAGE}"
          mesh_image="${EDGE_MESH_IMAGE}"
          [[ "${gateway_image}" =~ ^ghcr\.io/iamaman11/vultr-edge-gateway@sha256:[0-9a-f]{64}$ ]]
          [[ "${warp_image}" =~ ^ghcr\.io/iamaman11/vultr-warp-egress@sha256:[0-9a-f]{64}$ ]]
          [[ "${mesh_image}" =~ ^docker\.io/cloudflare/mesh@sha256:[0-9a-f]{64}$ ]]
          bundle_root="$(jq -er '.bundle_root' "${SPEC_PATH}")"
          test -d "${bundle_root}"
          printf 'EDGE_GATEWAY_IMAGE=%s\nEDGE_WARP_EGRESS_IMAGE=%s\nCLOUDFLARE_MESH_IMAGE=%s\n' \
            "${gateway_image}" "${warp_image}" "${mesh_image}" > "${bundle_root}/.images.env"
          chmod 0644 "${bundle_root}/.images.env"
          chmod 0755 "${controller}" "${agent}"
          printf 'EDGE_DOCKER_ENGINE_VERSION=%s\n' "${EDGE_DOCKER_ENGINE_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_CONTAINERD_VERSION=%s\n' "${EDGE_CONTAINERD_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_COMPOSE_VERSION=%s\n' "${EDGE_COMPOSE_VERSION}" >> "${GITHUB_ENV}"
          agent_manifest="${RUNNER_TEMP}/edge-agent-artifact.json"
          jq -n \
            --arg source_revision "${GITHUB_SHA}" \
            --arg sha256 "${EDGE_AGENT_SHA256}" \
            '{schema:1,source_revision:$source_revision,sha256:$sha256}' \
            > "${agent_manifest}"
          chmod 600 "${agent_manifest}"
          printf 'EDGE_APPLICATION_CONTROLLER=%s\n' "${controller}" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ARTIFACT=%s\n' "${agent}" >> "${GITHUB_ENV}"
          printf 'EDGE_APPLICATION_ARTIFACT_MANIFEST=%s\n' "${agent_manifest}" >> "${GITHUB_ENV}"

      - name: Materialize strict SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Validate disposable provider desired state
        shell: bash
        run: |
          set -euo pipefail
          mesh_base_spec="infra/cloudflare/application-acceptance-mesh.json"
          dns_spec="infra/cloudflare/application-acceptance-dns.json"
          vpc_spec="infra/vultr/application-acceptance-vpc.json"
          test -f "${mesh_base_spec}"
          test -f "${dns_spec}"
          test -f "${vpc_spec}"
          test "$(jq -er '.account_id' "${mesh_base_spec}")" = "4426df1449e417511bc7697d60b7f62f"
          test "$(jq -er '.routes | length' "${mesh_base_spec}")" = "0"
          test "$(jq -er '.record_name' "${dns_spec}")" = "stage2-acceptance.alegria.by"
          test "$(jq -er '.zone_name' "${dns_spec}")" = "alegria.by"
          test "$(jq -er '.environment' "${vpc_spec}")" = "application-acceptance"
          test "$(jq -er '.machine_id' "${vpc_spec}")" = "application-acceptance-1"
          if grep -R --fixed-strings -n "miu.alegria.by" \
              "${mesh_base_spec}" "${dns_spec}" "${vpc_spec}" "${SPEC_PATH}"; then
            echo "disposable acceptance must not reference permanent production DNS" >&2
            exit 1
          fi
          printf 'EDGE_ACCEPTANCE_MESH_BASE_SPEC=%s\n' "${mesh_base_spec}" >> "${GITHUB_ENV}"
          printf 'EDGE_ACCEPTANCE_DNS_SPEC=%s\n' "${dns_spec}" >> "${GITHUB_ENV}"
          printf 'EDGE_ACCEPTANCE_VPC_SPEC=%s\n' "${vpc_spec}" >> "${GITHUB_ENV}"

      - name: Discover controller egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4 or not value.is_global:
              raise SystemExit("controller egress is not a global IPv4 address")
          print(value)
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Run full provider-backed disposable acceptance
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bin="${EDGE_APPLICATION_CONTROLLER}"
          app_spec="${SPEC_PATH}"
          vultr_spec="$(jq -er '.vultr_spec_path' "${app_spec}")"
          machine="$(jq -er '.machine_id' "${app_spec}")"
          dns_spec="${EDGE_ACCEPTANCE_DNS_SPEC}"
          mesh_base_spec="${EDGE_ACCEPTANCE_MESH_BASE_SPEC}"
          vpc_spec="${EDGE_ACCEPTANCE_VPC_SPEC}"
          source_revision="${GITHUB_SHA}"
          artifact="${EDGE_APPLICATION_ARTIFACT}"
          manifest="${EDGE_APPLICATION_ARTIFACT_MANIFEST}"
          access_release="${RUNNER_TEMP}/acceptance-access-release.json"

          test -f "${vultr_spec}"
          test -f "${dns_spec}"
          test -f "${mesh_base_spec}"
          test -f "${vpc_spec}"
          test -n "${VULTR_API_KEY}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -s "${EDGE_SSH_PRIVATE_KEY_PATH}"
          test "$(jq -r '.bootstrap_mode' "${app_spec}")" = "full"
          test "$(jq -r '.runtime_policy.line1.acme_provider' "${app_spec}")" = \
            "https://acme-staging-v02.api.letsencrypt.org/directory"

          plan_authority() {
            jq -er '.plan_authority.authority_digest' "$1"
          }

          machine_authority() {
            jq -er '.authorized_plans[0].authority.authority_digest' "$1"
          }

          cleanup_mesh_provider() {
            local plan="${RUNNER_TEMP}/acceptance-emergency-mesh-plan.json"
            local digest authority
            for _ in 1 2 3 4; do
              if ! "${bin}" line3-mesh cleanup-plan "${mesh_base_spec}" > "${plan}" 2>/dev/null; then
                return 0
              fi
              digest="$(jq -r '.plan.destructive_digest // empty' "${plan}")"
              if [[ -z "${digest}" ]]; then
                return 0
              fi
              authority="$(plan_authority "${plan}" 2>/dev/null || true)"
              if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ || ! "${authority}" =~ ^[0-9a-f]{64}$ ]]; then
                return 0
              fi
              "${bin}" line3-mesh cleanup-apply "${mesh_base_spec}" "${digest}" "${authority}" \
                >/dev/null 2>&1 || return 0
            done
          }

          cleanup_dns_provider() {
            local plan="${RUNNER_TEMP}/acceptance-emergency-dns-plan.json"
            local digest authority
            if "${bin}" cloudflare-dns cleanup-plan "${dns_spec}" > "${plan}" 2>/dev/null; then
              digest="$(jq -r '.plan.destructive_digest // empty' "${plan}")"
              authority="$(plan_authority "${plan}" 2>/dev/null || true)"
              if [[ "${digest}" =~ ^[0-9a-f]{64}$ && "${authority}" =~ ^[0-9a-f]{64}$ ]]; then
                "${bin}" cloudflare-dns cleanup-apply "${dns_spec}" "${digest}" "${authority}" \
                  >/dev/null 2>&1 || true
              fi
            fi
          }

          cleanup_vpc_provider() {
            local plan="${RUNNER_TEMP}/acceptance-emergency-vpc-plan.json"
            local digest authority
            for _ in 1 2 3 4; do
              if ! "${bin}" vultr-vpc cleanup-plan "${vpc_spec}" > "${plan}" 2>/dev/null; then
                return 0
              fi
              digest="$(jq -r '.plan.destructive_digest // empty' "${plan}")"
              if [[ -z "${digest}" ]]; then
                return 0
              fi
              authority="$(plan_authority "${plan}" 2>/dev/null || true)"
              if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ || ! "${authority}" =~ ^[0-9a-f]{64}$ ]]; then
                return 0
              fi
              "${bin}" vultr-vpc cleanup-apply "${vpc_spec}" "${digest}" "${authority}" \
                >/dev/null 2>&1 || return 0
            done
          }

          ensure_vpc_clean_room() {
            local plan="${RUNNER_TEMP}/acceptance-vpc-before.json"
            local apply_result="${RUNNER_TEMP}/acceptance-vpc-preflight-cleanup.json"
            local digest authority
            local attempt

            for attempt in 1 2 3 4; do
              "${bin}" vultr-vpc cleanup-plan "${vpc_spec}" > "${plan}"
              digest="$(jq -r '.plan.destructive_digest // empty' "${plan}")"
              if [[ -z "${digest}" ]]; then
                jq -e '.plan.action.kind == "NOOP" and .plan.destructive_digest == null' \
                  "${plan}" >/dev/null
                return 0
              fi

              [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
              authority="$(plan_authority "${plan}")"
              [[ "${authority}" =~ ^[0-9a-f]{64}$ ]]

              "${bin}" vultr-vpc cleanup-apply "${vpc_spec}" "${digest}" "${authority}" \
                > "${apply_result}"
            done

            "${bin}" vultr-vpc cleanup-plan "${vpc_spec}" > "${plan}"
            jq -e '.plan.action.kind == "NOOP" and .plan.destructive_digest == null' \
              "${plan}" >/dev/null
          }

          cleanup_acceptance() {
            set +e
            "${bin}" line3-mesh runtime-cleanup "${app_spec}" >/dev/null 2>&1 || true
            cleanup_mesh_provider
            cleanup_dns_provider
            cleanup_vpc_provider
            local access_release_plan="${RUNNER_TEMP}/acceptance-emergency-release-plan.json"
            if "${bin}" vultr-lifecycle release-access-plan "${vultr_spec}" "${machine}" \
                > "${access_release_plan}" 2>/dev/null; then
              local access_release_authority
              access_release_authority="$(plan_authority "${access_release_plan}" 2>/dev/null || true)"
              if [[ "${access_release_authority}" =~ ^[0-9a-f]{64}$ ]]; then
                "${bin}" vultr-lifecycle release-access "${vultr_spec}" "${machine}" "${access_release_authority}" \
                  > "${RUNNER_TEMP}/acceptance-emergency-release.json" 2>&1 || true
              fi
            fi

            local destroy_json="${RUNNER_TEMP}/acceptance-emergency-destroy.json"
            if "${bin}" vultr-lifecycle destroy-plan \
                "${vultr_spec}" "${machine}" "${source_revision}" \
                > "${destroy_json}" 2>/dev/null; then
              local digest authority
              digest="$(jq -r '.destroy_digest // empty' "${destroy_json}")"
              authority="$(plan_authority "${destroy_json}" 2>/dev/null || true)"
              if [[ "${digest}" =~ ^[0-9a-f]{64}$ && "${authority}" =~ ^[0-9a-f]{64}$ ]]; then
                "${bin}" vultr-lifecycle destroy-apply \
                  "${vultr_spec}" "${machine}" "${source_revision}" "${digest}" "${authority}" \
                  >/dev/null 2>&1 || true
              fi
            fi
            local support_plan="${RUNNER_TEMP}/acceptance-emergency-support-cleanup-plan.json"
            if "${bin}" vultr-lifecycle cleanup-plan "${vultr_spec}" > "${support_plan}" 2>/dev/null; then
              local support_authority
              support_authority="$(plan_authority "${support_plan}" 2>/dev/null || true)"
              if [[ "${support_authority}" =~ ^[0-9a-f]{64}$ ]]; then
                "${bin}" vultr-lifecycle cleanup "${vultr_spec}" "${support_authority}" >/dev/null 2>&1 || true
              fi
            fi
          }

          "${bin}" vultr-lifecycle plan "${vultr_spec}" "${machine}" \
            > "${RUNNER_TEMP}/acceptance-plan-before.json"
          jq -e '.plans[0].class == "CREATE"' \
            "${RUNNER_TEMP}/acceptance-plan-before.json" >/dev/null
          vm_authority="$(machine_authority "${RUNNER_TEMP}/acceptance-plan-before.json")"
          [[ "${vm_authority}" =~ ^[0-9a-f]{64}$ ]]

          "${bin}" cloudflare-dns cleanup-plan "${dns_spec}" \
            > "${RUNNER_TEMP}/acceptance-dns-before.json"
          jq -e '.plan.action.kind == "NOOP" and .plan.destructive_digest == null' \
            "${RUNNER_TEMP}/acceptance-dns-before.json" >/dev/null

          "${bin}" line3-mesh cleanup-plan "${mesh_base_spec}" \
            > "${RUNNER_TEMP}/acceptance-mesh-before.json"
          jq -e '.plan.action.kind == "NOOP" and .plan.destructive_digest == null' \
            "${RUNNER_TEMP}/acceptance-mesh-before.json" >/dev/null

          ensure_vpc_clean_room

          trap 'rc=$?; if [[ $rc -ne 0 ]]; then cleanup_acceptance; fi; exit $rc' EXIT

          "${bin}" vultr-vpc plan "${vpc_spec}" \
            > "${RUNNER_TEMP}/acceptance-vpc-plan.json"
          vpc_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-vpc-plan.json")"
          "${bin}" vultr-vpc apply "${vpc_spec}" "${vpc_authority}" \
            > "${RUNNER_TEMP}/acceptance-vpc-apply.json"
          jq -e '.performed.kind == "CREATE_VPC" and .next_plan.action.kind == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-vpc-apply.json" >/dev/null

          "${bin}" vultr-lifecycle apply "${vultr_spec}" "${machine}" "${vm_authority}" \
            > "${RUNNER_TEMP}/acceptance-vm-apply.json"
          jq -e '.action == "CREATED" and .strict_ssh_acceptance == "PASS"' \
            "${RUNNER_TEMP}/acceptance-vm-apply.json" >/dev/null
          vm_ip="$(jq -er '.main_ip' "${RUNNER_TEMP}/acceptance-vm-apply.json")"

          "${bin}" vultr-vpc attachment-plan "${vpc_spec}" \
            > "${RUNNER_TEMP}/acceptance-vpc-attachment-plan.json"
          jq -e '.plan.action.kind == "ATTACH_INSTANCE"' \
            "${RUNNER_TEMP}/acceptance-vpc-attachment-plan.json" >/dev/null
          attachment_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-vpc-attachment-plan.json")"
          "${bin}" vultr-vpc attachment-apply "${vpc_spec}" "${attachment_authority}" \
            > "${RUNNER_TEMP}/acceptance-vpc-attachment-apply.json"
          jq -e '.performed.kind == "ATTACH_INSTANCE" and .next_plan.action.kind == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-vpc-attachment-apply.json" >/dev/null

          # Reboot after attachment so the guest network stack sees the provider-added VPC NIC.
          "${bin}" vultr-lifecycle action-plan "${vultr_spec}" "${machine}" reboot \
            > "${RUNNER_TEMP}/acceptance-vpc-reboot-plan.json"
          reboot_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-vpc-reboot-plan.json")"
          "${bin}" vultr-lifecycle action "${vultr_spec}" "${machine}" reboot "${reboot_authority}" \
            > "${RUNNER_TEMP}/acceptance-vpc-reboot.json"
          "${bin}" vultr-lifecycle plan "${vultr_spec}" "${machine}" \
            > "${RUNNER_TEMP}/acceptance-vpc-post-reboot-plan.json"
          post_reboot_vm_authority="$(machine_authority "${RUNNER_TEMP}/acceptance-vpc-post-reboot-plan.json")"
          "${bin}" vultr-lifecycle apply "${vultr_spec}" "${machine}" "${post_reboot_vm_authority}" \
            > "${RUNNER_TEMP}/acceptance-vpc-post-reboot-vm.json"
          jq -e '.action == "NOOP" and .strict_ssh_acceptance == "PASS"' \
            "${RUNNER_TEMP}/acceptance-vpc-post-reboot-vm.json" >/dev/null

          "${bin}" vultr-vpc verify "${vpc_spec}" \
            > "${RUNNER_TEMP}/acceptance-vpc-verify.json"
          jq -e '.status == "PASS" and (.cidr | type == "string") and (.private_ipv4 | type == "string")' \
            "${RUNNER_TEMP}/acceptance-vpc-verify.json" >/dev/null

          "${bin}" cloudflare-dns plan "${dns_spec}" "${vm_ip}" \
            > "${RUNNER_TEMP}/acceptance-dns-plan.json"
          jq -e '.plan.action.kind == "CREATE"' \
            "${RUNNER_TEMP}/acceptance-dns-plan.json" >/dev/null
          dns_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-dns-plan.json")"
          "${bin}" cloudflare-dns apply "${dns_spec}" "${vm_ip}" "${dns_authority}" \
            > "${RUNNER_TEMP}/acceptance-dns-apply.json"
          jq -e '.next_plan.action.kind == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-dns-apply.json" >/dev/null

          "${bin}" application-lifecycle plan "${app_spec}" "${manifest}" "${artifact}" \
            > "${RUNNER_TEMP}/acceptance-app-plan.json"
          app_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-app-plan.json")"
          "${bin}" application-lifecycle apply "${app_spec}" "${manifest}" "${artifact}" "${app_authority}" \
            > "${RUNNER_TEMP}/acceptance-app-apply.json"
          jq -e '.initial_plan.class == "APPLY" and .final_plan.class == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-app-apply.json" >/dev/null

          mesh_noop=0
          for _ in 1 2 3 4; do
            "${bin}" line3-mesh vpc-plan "${mesh_base_spec}" "${vpc_spec}" "${app_spec}" \
              > "${RUNNER_TEMP}/acceptance-mesh-plan.json"
            jq -e '.guest_vpc.status == "PASS"' \
              "${RUNNER_TEMP}/acceptance-mesh-plan.json" >/dev/null
            if jq -e '.plan.action.kind == "NOOP"' \
                "${RUNNER_TEMP}/acceptance-mesh-plan.json" >/dev/null; then
              mesh_noop=1
              break
            fi
            mesh_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-mesh-plan.json")"
            "${bin}" line3-mesh vpc-apply "${mesh_base_spec}" "${vpc_spec}" "${app_spec}" "${mesh_authority}" \
              > "${RUNNER_TEMP}/acceptance-mesh-apply.json"
            jq -e '.guest_vpc.status == "PASS"' \
              "${RUNNER_TEMP}/acceptance-mesh-apply.json" >/dev/null
          done
          test "${mesh_noop}" = "1"

          "${bin}" line3-mesh vpc-runtime-apply "${mesh_base_spec}" "${vpc_spec}" "${app_spec}" \
            > "${RUNNER_TEMP}/acceptance-mesh-runtime-apply.json"
          jq -e \
            '.status == "READY" and
             .runtime.runtime_ready == true and
             .runtime.exact_image_ready == true and
             .provider_observation.nodes[0].status == "healthy"' \
            "${RUNNER_TEMP}/acceptance-mesh-runtime-apply.json" >/dev/null

          "${bin}" line3-mesh vpc-runtime-verify "${mesh_base_spec}" "${vpc_spec}" "${app_spec}" \
            > "${RUNNER_TEMP}/acceptance-mesh-runtime-verify.json"
          jq -e '.status == "PASS" and .runtime.runtime_ready == true' \
            "${RUNNER_TEMP}/acceptance-mesh-runtime-verify.json" >/dev/null

          "${bin}" application-lifecycle plan "${app_spec}" "${manifest}" "${artifact}" \
            > "${RUNNER_TEMP}/acceptance-app-noop-plan.json"
          app_noop_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-app-noop-plan.json")"
          "${bin}" application-lifecycle apply "${app_spec}" "${manifest}" "${artifact}" "${app_noop_authority}" \
            > "${RUNNER_TEMP}/acceptance-app-noop.json"
          jq -e '.initial_plan.class == "NOOP" and .final_plan.class == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-app-noop.json" >/dev/null

          "${bin}" application-lifecycle verify "${app_spec}" "${manifest}" "${artifact}" \
            > "${RUNNER_TEMP}/acceptance-verify-v1.json"
          jq -e '.status == "PASS" and .plan.class == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-verify-v1.json" >/dev/null

          "${bin}" cloudflare-dns plan "${dns_spec}" "${vm_ip}" \
            > "${RUNNER_TEMP}/acceptance-dns-noop.json"
          jq -e '.plan.action.kind == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-dns-noop.json" >/dev/null

          release_v1="$(jq -er '.final_plan.desired_release.release_id' \
            "${RUNNER_TEMP}/acceptance-app-noop.json")"
          bundle_v1="$(jq -er '.final_plan.desired_release.bundle_digest' \
            "${RUNNER_TEMP}/acceptance-app-noop.json")"

          upgrade_spec="${RUNNER_TEMP}/application-upgrade.json"
          jq '.runtime_policy.line2.proxy_username = "acceptance-v2"' \
            "${app_spec}" > "${upgrade_spec}"
          "${bin}" application-lifecycle plan "${upgrade_spec}" "${manifest}" "${artifact}" \
            > "${RUNNER_TEMP}/acceptance-upgrade-plan.json"
          upgrade_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-upgrade-plan.json")"
          "${bin}" application-lifecycle upgrade "${upgrade_spec}" "${manifest}" "${artifact}" "${upgrade_authority}" \
            > "${RUNNER_TEMP}/acceptance-upgrade.json"
          jq -e '.initial_plan.class == "UPGRADE" and .final_plan.class == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-upgrade.json" >/dev/null

          release_v2="$(jq -er '.final_plan.desired_release.release_id' \
            "${RUNNER_TEMP}/acceptance-upgrade.json")"
          bundle_v2="$(jq -er '.final_plan.desired_release.bundle_digest' \
            "${RUNNER_TEMP}/acceptance-upgrade.json")"
          test "${release_v1}" != "${release_v2}"
          test "${bundle_v1}" != "${bundle_v2}"

          "${bin}" application-lifecycle rollback-plan "${app_spec}" \
            > "${RUNNER_TEMP}/acceptance-rollback-plan.json"
          rollback_digest="$(jq -er '.rollback.rollback_digest' \
            "${RUNNER_TEMP}/acceptance-rollback-plan.json")"
          [[ "${rollback_digest}" =~ ^[0-9a-f]{64}$ ]]
          jq -e --arg current "${release_v2}" --arg previous "${release_v1}" \
            '.rollback.current_release.release_id == $current and
             .rollback.previous_release.release_id == $previous' \
            "${RUNNER_TEMP}/acceptance-rollback-plan.json" >/dev/null

          rollback_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-rollback-plan.json")"
          "${bin}" application-lifecycle rollback-apply "${app_spec}" "${rollback_digest}" "${rollback_authority}" \
            > "${RUNNER_TEMP}/acceptance-rollback-apply.json"
          jq -e '.status == "ROLLED_BACK"' \
            "${RUNNER_TEMP}/acceptance-rollback-apply.json" >/dev/null

          "${bin}" application-lifecycle verify "${app_spec}" "${manifest}" "${artifact}" \
            > "${RUNNER_TEMP}/acceptance-verify-rollback.json"
          jq -e '.status == "PASS" and .plan.class == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-verify-rollback.json" >/dev/null

          "${bin}" vultr-lifecycle action-plan "${vultr_spec}" "${machine}" reboot \
            > "${RUNNER_TEMP}/acceptance-reboot-plan.json"
          reboot_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-reboot-plan.json")"
          "${bin}" vultr-lifecycle action "${vultr_spec}" "${machine}" reboot "${reboot_authority}" \
            > "${RUNNER_TEMP}/acceptance-reboot.json"
          "${bin}" vultr-lifecycle plan "${vultr_spec}" "${machine}" \
            > "${RUNNER_TEMP}/acceptance-post-reboot-plan.json"
          post_reboot_authority="$(machine_authority "${RUNNER_TEMP}/acceptance-post-reboot-plan.json")"
          "${bin}" vultr-lifecycle apply "${vultr_spec}" "${machine}" "${post_reboot_authority}" \
            > "${RUNNER_TEMP}/acceptance-post-reboot-vm.json"
          jq -e '.action == "NOOP" and .strict_ssh_acceptance == "PASS"' \
            "${RUNNER_TEMP}/acceptance-post-reboot-vm.json" >/dev/null

          "${bin}" application-lifecycle verify "${app_spec}" "${manifest}" "${artifact}" \
            > "${RUNNER_TEMP}/acceptance-post-reboot-app.json"
          jq -e '.status == "PASS" and .plan.class == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-post-reboot-app.json" >/dev/null

          "${bin}" line3-mesh vpc-runtime-verify "${mesh_base_spec}" "${vpc_spec}" "${app_spec}" \
            > "${RUNNER_TEMP}/acceptance-post-reboot-mesh.json"
          jq -e '.status == "PASS" and .runtime.runtime_ready == true' \
            "${RUNNER_TEMP}/acceptance-post-reboot-mesh.json" >/dev/null

          "${bin}" cloudflare-dns plan "${dns_spec}" "${vm_ip}" \
            > "${RUNNER_TEMP}/acceptance-post-reboot-dns.json"
          jq -e '.plan.action.kind == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-post-reboot-dns.json" >/dev/null

          "${bin}" vultr-vpc verify "${vpc_spec}" \
            > "${RUNNER_TEMP}/acceptance-post-reboot-vpc.json"
          jq -e -s \
            '.[0].status == "PASS" and
             .[1].status == "PASS" and
             .[0].cidr == .[1].cidr and
             .[0].private_ipv4 == .[1].private_ipv4' \
            "${RUNNER_TEMP}/acceptance-vpc-verify.json" \
            "${RUNNER_TEMP}/acceptance-post-reboot-vpc.json" >/dev/null

          "${bin}" line3-mesh runtime-cleanup "${app_spec}" \
            > "${RUNNER_TEMP}/acceptance-mesh-runtime-cleanup.json"
          jq -e \
            '.status == "ABSENT" and
             .runtime.token_store_present == false and
             .runtime.container_running == false' \
            "${RUNNER_TEMP}/acceptance-mesh-runtime-cleanup.json" >/dev/null

          mesh_absent=0
          for _ in 1 2 3 4; do
            "${bin}" line3-mesh cleanup-plan "${mesh_base_spec}" \
              > "${RUNNER_TEMP}/acceptance-mesh-cleanup-plan.json"
            mesh_digest="$(jq -r '.plan.destructive_digest // empty' \
              "${RUNNER_TEMP}/acceptance-mesh-cleanup-plan.json")"
            if [[ -z "${mesh_digest}" ]]; then
              jq -e '.plan.action.kind == "NOOP"' \
                "${RUNNER_TEMP}/acceptance-mesh-cleanup-plan.json" >/dev/null
              mesh_absent=1
              break
            fi
            [[ "${mesh_digest}" =~ ^[0-9a-f]{64}$ ]]
            mesh_cleanup_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-mesh-cleanup-plan.json")"
            "${bin}" line3-mesh cleanup-apply "${mesh_base_spec}" "${mesh_digest}" "${mesh_cleanup_authority}" \
              > "${RUNNER_TEMP}/acceptance-mesh-cleanup-apply.json"
          done
          test "${mesh_absent}" = "1"

          "${bin}" cloudflare-dns cleanup-plan "${dns_spec}" \
            > "${RUNNER_TEMP}/acceptance-dns-cleanup-plan.json"
          dns_digest="$(jq -er '.plan.destructive_digest' \
            "${RUNNER_TEMP}/acceptance-dns-cleanup-plan.json")"
          [[ "${dns_digest}" =~ ^[0-9a-f]{64}$ ]]
          dns_cleanup_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-dns-cleanup-plan.json")"
          "${bin}" cloudflare-dns cleanup-apply "${dns_spec}" "${dns_digest}" "${dns_cleanup_authority}" \
            > "${RUNNER_TEMP}/acceptance-dns-cleanup-apply.json"
          jq -e '.next_plan.action.kind == "NOOP"' \
            "${RUNNER_TEMP}/acceptance-dns-cleanup-apply.json" >/dev/null

          vpc_absent=0
          for _ in 1 2 3 4; do
            "${bin}" vultr-vpc cleanup-plan "${vpc_spec}" \
              > "${RUNNER_TEMP}/acceptance-vpc-cleanup-plan.json"
            vpc_digest="$(jq -r '.plan.destructive_digest // empty' \
              "${RUNNER_TEMP}/acceptance-vpc-cleanup-plan.json")"
            if [[ -z "${vpc_digest}" ]]; then
              jq -e '.plan.action.kind == "NOOP"' \
                "${RUNNER_TEMP}/acceptance-vpc-cleanup-plan.json" >/dev/null
              vpc_absent=1
              break
            fi
            [[ "${vpc_digest}" =~ ^[0-9a-f]{64}$ ]]
            vpc_cleanup_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-vpc-cleanup-plan.json")"
            "${bin}" vultr-vpc cleanup-apply "${vpc_spec}" "${vpc_digest}" "${vpc_cleanup_authority}" \
              > "${RUNNER_TEMP}/acceptance-vpc-cleanup-apply.json"
          done
          test "${vpc_absent}" = "1"

          "${bin}" vultr-lifecycle release-access-plan "${vultr_spec}" "${machine}" \
            > "${RUNNER_TEMP}/acceptance-access-release-plan.json"
          access_release_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-access-release-plan.json")"
          "${bin}" vultr-lifecycle release-access "${vultr_spec}" "${machine}" "${access_release_authority}" \
            | tee "${access_release}"
          jq -e '.verified_absent == true or .action == "NOOP"' "${access_release}" >/dev/null

          "${bin}" vultr-lifecycle destroy-plan \
            "${vultr_spec}" "${machine}" "${source_revision}" \
            > "${RUNNER_TEMP}/acceptance-destroy-plan.json"
          destroy_digest="$(jq -er '.destroy_digest' \
            "${RUNNER_TEMP}/acceptance-destroy-plan.json")"
          destroy_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-destroy-plan.json")"
          "${bin}" vultr-lifecycle destroy-apply \
            "${vultr_spec}" "${machine}" "${source_revision}" "${destroy_digest}" "${destroy_authority}" \
            > "${RUNNER_TEMP}/acceptance-destroy-apply.json"
          jq -e '.absence_verified == true' \
            "${RUNNER_TEMP}/acceptance-destroy-apply.json" >/dev/null

          "${bin}" vultr-lifecycle cleanup-plan "${vultr_spec}" \
            > "${RUNNER_TEMP}/acceptance-support-cleanup-plan.json"
          support_cleanup_authority="$(plan_authority "${RUNNER_TEMP}/acceptance-support-cleanup-plan.json")"
          "${bin}" vultr-lifecycle cleanup "${vultr_spec}" "${support_cleanup_authority}" \
            > "${RUNNER_TEMP}/acceptance-support-cleanup.json"
          jq -e '.environment_in_use == false' "${RUNNER_TEMP}/acceptance-support-cleanup.json" >/dev/null
          "${bin}" vultr-lifecycle cleanup-plan "${vultr_spec}" \
            > "${RUNNER_TEMP}/acceptance-support-cleanup-noop-plan.json"
          jq -e '.plan.action == "NOOP"' "${RUNNER_TEMP}/acceptance-support-cleanup-noop-plan.json" >/dev/null
          "${bin}" vultr-lifecycle plan "${vultr_spec}" "${machine}" \
            > "${RUNNER_TEMP}/acceptance-plan-after.json"
          jq -e '.plans[0].class == "CREATE"' \
            "${RUNNER_TEMP}/acceptance-plan-after.json" >/dev/null

          "${bin}" cloudflare-dns cleanup-plan "${dns_spec}" \
            > "${RUNNER_TEMP}/acceptance-dns-after.json"
          jq -e '.plan.action.kind == "NOOP" and .plan.destructive_digest == null' \
            "${RUNNER_TEMP}/acceptance-dns-after.json" >/dev/null

          "${bin}" line3-mesh cleanup-plan "${mesh_base_spec}" \
            > "${RUNNER_TEMP}/acceptance-mesh-after.json"
          jq -e '.plan.action.kind == "NOOP" and .plan.destructive_digest == null' \
            "${RUNNER_TEMP}/acceptance-mesh-after.json" >/dev/null

          "${bin}" vultr-vpc cleanup-plan "${vpc_spec}" \
            > "${RUNNER_TEMP}/acceptance-vpc-after.json"
          jq -e '.plan.action.kind == "NOOP" and .plan.destructive_digest == null' \
            "${RUNNER_TEMP}/acceptance-vpc-after.json" >/dev/null

          trap - EXIT

          jq -n \
            --arg source_revision "${source_revision}" \
            --arg release_v1 "${release_v1}" \
            --arg release_v2 "${release_v2}" \
            --arg bundle_v1 "${bundle_v1}" \
            --arg bundle_v2 "${bundle_v2}" \
            '{
              acceptance:"PASS",
              source_revision:$source_revision,
              clean_room_precondition:"PASS",
              fresh_vm:"PASS",
              vpc:"CREATE_ATTACH_READY_TO_ABSENT",
              dns:"CREATE_TO_NOOP_TO_ABSENT",
              clean_room_certificate:"STAGING_ACME_PASS",
              direct_warp_datapath:"PASS",
              mesh_provider_runtime:"PASS",
              first_apply:"APPLY_TO_NOOP",
              repeat_apply:"NOOP",
              verify:"PASS",
              upgrade:"UPGRADE_TO_NOOP",
              rollback:"PASS",
              reboot_verify:"PASS",
              mesh_runtime_cleanup:"PASS",
              dns_mesh_vpc_provider_cleanup:"PASS",
              access_cleanup:"PASS",
              destroy_absence:"PASS",
              support_cleanup:"PASS",
              zero_leaked_resources:"PASS",
              release_v1:$release_v1,
              release_v2:$release_v2,
              bundle_v1:$bundle_v1,
              bundle_v2:$bundle_v2
            }' | tee "${RUNNER_TEMP}/application-acceptance-result.json"

          {
            echo '### Full disposable Stage 2 application acceptance'
            echo '~~~json'
            cat "${RUNNER_TEMP}/application-acceptance-result.json"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove local sensitive material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${EDGE_SSH_PRIVATE_KEY_PATH:-${RUNNER_TEMP}/singbox-vultr-ops}"
