name: Vultr Lifecycle

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Typed lifecycle operation
        required: true
        type: choice
        default: doctor
        options:
          - doctor
          - inventory
          - plan
          - apply
          - action
          - destroy-plan
          - destroy-apply
          - cleanup
          - acceptance
      spec_path:
        description: Canonical desired-state path under infra/vultr/
        required: true
        type: string
        default: infra/vultr/disposable-acceptance.json
      machine_id:
        description: Logical machine id when the operation targets one machine
        required: false
        type: string
        default: lifecycle-acceptance-1
      action:
        description: Instance action
        required: false
        type: choice
        default: reboot
        options:
          - start
          - halt
          - reboot
      destroy_digest:
        description: 64-character digest returned by destroy-plan
        required: false
        type: string
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  lifecycle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.repository_id == '1221750822' &&
        github.event.issue.number == 1 &&
        !github.event.issue.pull_request &&
        github.actor_id == '44100369' &&
        github.event.comment.body == '/vultr-lifecycle acceptance'
      )
    concurrency:
      group: vultr-lifecycle-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 45
    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      REQUESTED_OPERATION: ${{ github.event_name == 'issue_comment' && 'acceptance' || inputs.operation }}
      SPEC_PATH: ${{ github.event_name == 'issue_comment' && 'infra/vultr/disposable-acceptance.json' || inputs.spec_path }}
      MACHINE_ID: ${{ github.event_name == 'issue_comment' && 'lifecycle-acceptance-1' || inputs.machine_id }}
      INSTANCE_ACTION: ${{ inputs.action }}
      DESTROY_DIGEST: ${{ inputs.destroy_digest }}

    steps:
      - name: Checkout exact revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"

      - name: Validate closed request grammar
        shell: bash
        run: |
          set -euo pipefail
          case "${REQUESTED_OPERATION}" in
            doctor|inventory|plan|apply|action|destroy-plan|destroy-apply|cleanup|acceptance) ;;
            *) echo "unsupported lifecycle operation" >&2; exit 2 ;;
          esac

          [[ "${SPEC_PATH}" == infra/vultr/*.json ]]
          [[ "${SPEC_PATH}" != *".."* ]]
          [[ -f "${SPEC_PATH}" ]]

          if [[ -n "${MACHINE_ID}" ]]; then
            [[ "${MACHINE_ID}" =~ ^[A-Za-z0-9._-]+$ ]]
          fi

          case "${REQUESTED_OPERATION}" in
            apply|action|destroy-plan|destroy-apply)
              [[ -n "${MACHINE_ID}" ]]
              ;;
          esac

          if [[ "${REQUESTED_OPERATION}" == "action" ]]; then
            case "${INSTANCE_ACTION}" in
              start|halt|reboot) ;;
              *) echo "invalid instance action" >&2; exit 2 ;;
            esac
          fi

          if [[ "${REQUESTED_OPERATION}" == "destroy-apply" ]]; then
            [[ "${DESTROY_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          fi

          if [[ "${REQUESTED_OPERATION}" == "acceptance" ]]; then
            test "${SPEC_PATH}" = "infra/vultr/disposable-acceptance.json"
            test "${MACHINE_ID}" = "lifecycle-acceptance-1"
          fi

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Build exact lifecycle controller
        working-directory: edge-platform
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p edge-controller --bin edge-controller

      - name: Materialize SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Discover controller egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4:
              raise SystemExit("controller egress is not IPv4")
          print(value)
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Execute typed lifecycle operation
        shell: bash
        run: |
          set -euo pipefail
          bin="edge-platform/target/debug/edge-controller"
          spec="${SPEC_PATH}"
          machine="${MACHINE_ID}"
          source_revision="${GITHUB_SHA}"

          run_lifecycle() {
            "${bin}" vultr-lifecycle "$@"
          }

          emit_result() {
            local file="$1"
            echo '### Vultr lifecycle result' >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${file}" >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~' >> "${GITHUB_STEP_SUMMARY}"
          }

          cleanup_acceptance() {
            set +e
            local destroy_json="${RUNNER_TEMP}/acceptance-emergency-destroy.json"
            if run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" > "${destroy_json}" 2>/dev/null; then
              local digest
              digest="$(jq -r '.destroy_digest // empty' "${destroy_json}")"
              if [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
                run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${digest}" >/dev/null 2>&1 || true
              fi
            fi
            run_lifecycle cleanup "${spec}" >/dev/null 2>&1 || true
          }

          case "${REQUESTED_OPERATION}" in
            doctor)
              run_lifecycle doctor "${spec}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            inventory)
              run_lifecycle inventory "${spec}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            plan)
              if [[ -n "${machine}" ]]; then
                run_lifecycle plan "${spec}" "${machine}" | tee "${RUNNER_TEMP}/result.json"
              else
                run_lifecycle plan "${spec}" | tee "${RUNNER_TEMP}/result.json"
              fi
              ;;
            apply)
              run_lifecycle apply "${spec}" "${machine}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            action)
              run_lifecycle action "${spec}" "${machine}" "${INSTANCE_ACTION}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            destroy-plan)
              run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            destroy-apply)
              run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${DESTROY_DIGEST}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            cleanup)
              run_lifecycle cleanup "${spec}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            acceptance)
              trap 'rc=$?; if [[ $rc -ne 0 ]]; then cleanup_acceptance; fi; exit $rc' EXIT

              run_lifecycle doctor "${spec}" > "${RUNNER_TEMP}/doctor.json"
              run_lifecycle inventory "${spec}" > "${RUNNER_TEMP}/inventory-before.json"
              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/plan-before.json"

              run_lifecycle apply "${spec}" "${machine}" > "${RUNNER_TEMP}/apply-first.json"
              jq -e '.action == "CREATED" or .action == "NOOP"' "${RUNNER_TEMP}/apply-first.json" >/dev/null

              run_lifecycle apply "${spec}" "${machine}" > "${RUNNER_TEMP}/apply-noop.json"
              jq -e '.action == "NOOP" and .strict_ssh_acceptance == "PASS" and .user_data_scrubbed == true'                 "${RUNNER_TEMP}/apply-noop.json" >/dev/null

              run_lifecycle action "${spec}" "${machine}" halt > "${RUNNER_TEMP}/halt.json"
              jq -e '.power_status == "stopped"' "${RUNNER_TEMP}/halt.json" >/dev/null
              run_lifecycle action "${spec}" "${machine}" start > "${RUNNER_TEMP}/start.json"
              jq -e '.power_status == "running"' "${RUNNER_TEMP}/start.json" >/dev/null
              run_lifecycle apply "${spec}" "${machine}" > "${RUNNER_TEMP}/post-start-apply.json"
              jq -e '.action == "NOOP" and .strict_ssh_acceptance == "PASS"' "${RUNNER_TEMP}/post-start-apply.json" >/dev/null

              run_lifecycle action "${spec}" "${machine}" reboot > "${RUNNER_TEMP}/reboot.json"
              run_lifecycle apply "${spec}" "${machine}" > "${RUNNER_TEMP}/post-reboot-apply.json"
              jq -e '.action == "NOOP" and .strict_ssh_acceptance == "PASS"' "${RUNNER_TEMP}/post-reboot-apply.json" >/dev/null

              run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" > "${RUNNER_TEMP}/destroy-plan.json"
              digest="$(jq -r '.destroy_digest' "${RUNNER_TEMP}/destroy-plan.json")"
              [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]

              stale_digest="$(printf '0%.0s' {1..64})"
              if [[ "${stale_digest}" == "${digest}" ]]; then
                stale_digest="$(printf '1%.0s' {1..64})"
              fi
              if run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${stale_digest}" > "${RUNNER_TEMP}/stale-unexpected.json" 2> "${RUNNER_TEMP}/stale-error.txt"; then
                echo "stale destroy digest was incorrectly accepted" >&2
                exit 1
              fi
              grep -q "destroy digest is stale" "${RUNNER_TEMP}/stale-error.txt"

              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/plan-after-stale.json"
              jq -e '.plans[0].class == "NOOP"' "${RUNNER_TEMP}/plan-after-stale.json" >/dev/null

              run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" > "${RUNNER_TEMP}/destroy-plan-final.json"
              digest="$(jq -r '.destroy_digest' "${RUNNER_TEMP}/destroy-plan-final.json")"
              run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${digest}" > "${RUNNER_TEMP}/destroy-apply.json"
              jq -e '.absence_verified == true' "${RUNNER_TEMP}/destroy-apply.json" >/dev/null

              run_lifecycle cleanup "${spec}" > "${RUNNER_TEMP}/cleanup-idempotent.json"
              jq -e '.environment_in_use == false and .ssh_key_removed == false and (.firewall_groups_removed | length) == 0'                 "${RUNNER_TEMP}/cleanup-idempotent.json" >/dev/null

              run_lifecycle inventory "${spec}" > "${RUNNER_TEMP}/inventory-after.json"
              jq -e '[.inventory.resources[] | select(.ownership.environment == "lifecycle-acceptance")] | length == 0'                 "${RUNNER_TEMP}/inventory-after.json" >/dev/null
              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/plan-after.json"
              jq -e '.plans[0].class == "CREATE"' "${RUNNER_TEMP}/plan-after.json" >/dev/null

              trap - EXIT
              jq -n                 --arg revision "${source_revision}"                 --arg first_action "$(jq -r '.action' "${RUNNER_TEMP}/apply-first.json")"                 --arg provider_id "$(jq -r '.provider_id' "${RUNNER_TEMP}/destroy-apply.json")"                 '{
                  acceptance: "PASS",
                  source_revision: $revision,
                  first_apply: $first_action,
                  repeat_apply: "NOOP",
                  strict_ssh: "PASS",
                  user_data_scrub: "PASS",
                  halt_start_reboot: "PASS",
                  stale_destroy_digest_refusal: "PASS",
                  destroy_absence: "PASS",
                  support_cleanup: "PASS",
                  provider_id: $provider_id
                }' | tee "${RUNNER_TEMP}/result.json"
              ;;
          esac

          emit_result "${RUNNER_TEMP}/result.json"

      - name: Remove SSH authority material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${EDGE_SSH_PRIVATE_KEY_PATH:-${RUNNER_TEMP}/singbox-vultr-ops}"
