name: Vultr Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        description: Authorized /vultr command from the control-plane router
        required: true
        type: string

permissions: {}

# One native Vultr transaction can span the first-use VM, both independent
# host attestations, GitHub BEGIN, paired Workers and two consumers.
# Share the existing credential workflow's lock so no concurrent rotation
# can interleave with an irreversible first-use PATCH.
concurrency:
  group: credential-transaction-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.parse.outputs.operation }}
      spec_path: ${{ steps.parse.outputs.spec_path }}
      machine_id: ${{ steps.parse.outputs.machine_id }}
      instance_action: ${{ steps.parse.outputs.instance_action }}
      destroy_digest: ${{ steps.parse.outputs.destroy_digest }}

    steps:
      - name: Parse and authorize typed request
        id: parse
        shell: bash
        env:
          COMMENT_BODY: ${{ inputs.command_body }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re

          spec_re = re.compile(r"^infra/vultr/[A-Za-z0-9._/-]+\.json$")
          machine_re = re.compile(r"^[A-Za-z0-9._-]+$")
          digest_re = re.compile(r"^[0-9a-f]{64}$")

          def fail(message):
              raise SystemExit(message)

          operation = ""
          spec_path = ""
          machine_id = ""
          action = ""
          destroy_digest = ""

          tokens = os.environ.get("COMMENT_BODY", "").strip().split()
          if tokens == ["/vultr", "initial-vm-install"]:
              # Exact irreversible credential publication remains owned by
              # later independent host/Worker/durable-GitHub BEGIN guards.
              # Only the complete physical 4+6 + reboot + cleanup workflow
              # can finish with PASS; partial work always fails closed.
              operation = "initial-vm-install"
              spec_path = "infra/vultr/application-acceptance.json"
              machine_id = "application-acceptance-1"
          elif tokens == ["/vultr", "acceptance"]:
              operation = "acceptance"
              spec_path = "infra/vultr/disposable-acceptance.json"
              machine_id = "lifecycle-acceptance-1"
          elif len(tokens) >= 3 and tokens[0] == "/vultr":
              verb = tokens[1]
              if verb in {"doctor", "inventory", "cleanup-plan", "cleanup"} and len(tokens) == 3:
                  operation, spec_path = verb, tokens[2]
              elif verb == "plan" and len(tokens) in {3, 4}:
                  operation, spec_path = "plan", tokens[2]
                  if len(tokens) == 4:
                      machine_id = tokens[3]
              elif verb == "access-release" and len(tokens) == 4:
                  operation, spec_path, machine_id = "access-release", tokens[2], tokens[3]
              elif verb == "action-plan" and len(tokens) == 5:
                  operation, spec_path, machine_id, action = (
                      "action-plan",
                      tokens[2],
                      tokens[3],
                      tokens[4],
                  )
              elif verb == "apply" and len(tokens) == 4:
                  operation, spec_path, machine_id = "apply", tokens[2], tokens[3]
              elif verb == "runner-bootstrap" and len(tokens) == 4:
                  operation, spec_path, machine_id = "runner-bootstrap", tokens[2], tokens[3]
              elif verb in {"start", "halt", "reboot"} and len(tokens) == 4:
                  operation, action, spec_path, machine_id = "action", verb, tokens[2], tokens[3]
              elif verb == "destroy-plan" and len(tokens) == 4:
                  operation, spec_path, machine_id = "destroy-plan", tokens[2], tokens[3]
              elif verb == "destroy-apply" and len(tokens) == 5:
                  operation, spec_path, machine_id, destroy_digest = (
                      "destroy-apply",
                      tokens[2],
                      tokens[3],
                      tokens[4],
                  )
              else:
                  fail("unsupported /vultr command grammar")
          else:
              fail("comment is not an authorized /vultr command")

          if operation not in {
              "doctor", "inventory", "plan", "access-release", "action-plan", "apply",
              "runner-bootstrap", "action", "destroy-plan", "destroy-apply",
              "cleanup-plan", "cleanup", "acceptance", "initial-vm-install",
          }:
              fail("unsupported lifecycle operation")

          production_destroy = (
              spec_path == "infra/production/production.textproto"
              and machine_id == "production-1"
              and operation in {"destroy-plan", "destroy-apply"}
          )
          if not production_destroy and (
              not spec_re.fullmatch(spec_path)
              or ".." in spec_path
              or "//" in spec_path
          ):
              fail("invalid spec_path")
          if spec_path == "infra/production/production.textproto" and not production_destroy:
              fail("production VM deletion is limited to exact owned production-1 plan/apply")

          if machine_id and not machine_re.fullmatch(machine_id):
              fail("invalid machine_id")

          if operation in {
              "apply", "runner-bootstrap", "access-release", "action-plan", "action",
              "destroy-plan", "destroy-apply", "initial-vm-install"
          } and not machine_id:
              fail("machine_id is required for targeted operation")

          if operation in {"action-plan", "action"} and action not in {"start", "halt", "reboot"}:
              fail("invalid instance action")

          if operation == "destroy-apply" and not digest_re.fullmatch(destroy_digest):
              fail("destroy-apply requires a lowercase 64-character digest")
          if operation != "destroy-apply" and destroy_digest:
              fail("destroy_digest is only valid for destroy-apply")

          # This bounded mutation may never be replayed after an uncertain SSH ACK.
          if operation == "initial-vm-install" and os.environ.get("GITHUB_RUN_ATTEMPT") != "1":
              fail("initial VM provider/policy/Access installation replay forbidden; reconcile read-only before disposal")

          if operation == "acceptance":
              if spec_path != "infra/vultr/disposable-acceptance.json":
                  fail("acceptance uses only the canonical disposable spec")
              if machine_id != "lifecycle-acceptance-1":
                  fail("acceptance uses only the canonical disposable machine")
              action = ""
              destroy_digest = ""

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"operation={operation}\n")
              handle.write(f"spec_path={spec_path}\n")
              handle.write(f"machine_id={machine_id}\n")
              handle.write(f"instance_action={action}\n")
              handle.write(f"destroy_digest={destroy_digest}\n")
          PY

  execute:
    outputs:
      first_use_provider_mutation_attempted: ${{ steps.execute_lifecycle.outputs.first_use_provider_mutation_attempted }}
      first_use_create_confirmed: ${{ steps.execute_lifecycle.outputs.first_use_create_confirmed }}
    # A reusable VM's provider/substrate and policy-only installation is
    # independent of Windows. N1 may stage an empty owned VM without touching
    # Windows SCM/TUN/DNS or publishing credentials. Later paired first-use
    # publication remains gated on BOTH independent host attestations.
    needs: authorize
    if: needs.authorize.result == 'success'
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REQUESTED_OPERATION: ${{ needs.authorize.outputs.operation }}
      SPEC_PATH: ${{ needs.authorize.outputs.spec_path }}
      MACHINE_ID: ${{ needs.authorize.outputs.machine_id }}
      INSTANCE_ACTION: ${{ needs.authorize.outputs.instance_action }}
      DESTROY_DIGEST: ${{ needs.authorize.outputs.destroy_digest }}

    steps:
      - name: Checkout exact canonical revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${REVISION}"
          test -f "${SPEC_PATH}"

      - name: Resolve exact durable Edge Platform release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          bash edge-platform/scripts/resolve_durable_release.sh

      - name: Materialize verified lifecycle controller
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/edge-platform-release"
          source "${dir}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          orchestrator="${dir}/edge-orchestrator-linux-amd64"
          agent="${dir}/edge-agent-linux-amd64"
          test "$(sha256sum "${orchestrator}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sha256sum "${agent}" | awk '{print $1}')" = "${EDGE_AGENT_SHA256}"
          chmod 0755 "${orchestrator}"
          printf 'EDGE_LIFECYCLE_ORCHESTRATOR=%s\n' "${orchestrator}" >> "${GITHUB_ENV}"
          printf 'EDGE_LIFECYCLE_AGENT=%s\n' "${agent}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${dir}/resolved.env" >> "${GITHUB_ENV}"
          printf 'EDGE_DOCKER_ENGINE_VERSION=%s\n' "${EDGE_DOCKER_ENGINE_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_CONTAINERD_VERSION=%s\n' "${EDGE_CONTAINERD_VERSION}" >> "${GITHUB_ENV}"
          printf 'EDGE_COMPOSE_VERSION=%s\n' "${EDGE_COMPOSE_VERSION}" >> "${GITHUB_ENV}"

      - name: Materialize SSH authority
        shell: bash
        env:
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key_path}"
          test -s "${key_path}"
          chmod 600 "${key_path}"
          printf 'EDGE_SSH_PRIVATE_KEY_PATH=%s\n' "${key_path}" >> "${GITHUB_ENV}"

      - name: Discover controller egress IPv4
        shell: bash
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          python3 - "${ip}" <<'PY'
          import ipaddress
          import sys
          value = ipaddress.ip_address(sys.argv[1].strip())
          if value.version != 4 or not value.is_global:
              raise SystemExit("controller egress is not a global IPv4 address")
          print(value)
          PY
          printf 'EDGE_CONTROLLER_IPV4=%s\n' "${ip}" >> "${GITHUB_ENV}"

      - name: Mint short-lived runner registration token
        if: env.REQUESTED_OPERATION == 'runner-bootstrap'
        shell: bash
        env:
          IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "${IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN:-}" || {
            echo "IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN secret is required for runner-bootstrap" >&2
            exit 1
          }
          response="$(curl --fail --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runners/registration-token")"
          token="$(jq -er '.token' <<<"${response}")"
          expires_at="$(jq -er '.expires_at' <<<"${response}")"
          echo "::add-mask::${token}"
          printf 'EDGE_RUNNER_REGISTRATION_TOKEN=%s\n' "${token}" >> "${GITHUB_ENV}"
          printf 'EDGE_RUNNER_REGISTRATION_EXPIRES_AT=%s\n' "${expires_at}" >> "${GITHUB_ENV}"

      - name: Execute typed lifecycle operation
        id: execute_lifecycle
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          # Only bounded first-use/bootstrap transport can deliver the
          # VM host Access identity directly to its root-owned local owner.
          # The low-privilege self-hosted runner never receives the plaintext.
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID: ${{ (needs.authorize.outputs.operation == 'initial-vm-install' || needs.authorize.outputs.operation == 'runner-bootstrap') && secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID || '' }}
          EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET: ${{ (needs.authorize.outputs.operation == 'initial-vm-install' || needs.authorize.outputs.operation == 'runner-bootstrap') && secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET || '' }}
          CLOUDFLARE_API_TOKEN: ${{ needs.authorize.outputs.operation == 'initial-vm-install' && secrets.CLOUDFLARE_API_TOKEN || '' }}
        run: |
          set -euo pipefail
          bin="${EDGE_LIFECYCLE_ORCHESTRATOR}"
          spec="${SPEC_PATH}"
          machine="${MACHINE_ID}"
          source_revision="${GITHUB_SHA}"

          run_lifecycle() {
            "${bin}" vultr-lifecycle "$@"
          }

          plan_authority() {
            jq -er '.plan_authority.authority_digest' "$1"
          }

          machine_authority() {
            jq -er '.authorized_plans[0].authority.authority_digest' "$1"
          }

          converge_host_substrate() {
            local spec="$1"
            local machine="$2"
            local prefix="$3"
            local verify_output="$4"
            local converged=0

            for iteration in 1 2 3 4; do
              local plan="${RUNNER_TEMP}/${prefix}-substrate-plan-${iteration}.json"
              run_lifecycle substrate-plan "${spec}" "${machine}" > "${plan}"
              local action
              action="$(jq -er '.plan.action' "${plan}")"
              case "${action}" in
                NOOP)
                  converged=1
                  break
                  ;;
                SCRUB_USER_DATA|ROTATE_HOST_CERTIFICATE)
                  local authority
                  authority="$(plan_authority "${plan}")"
                  [[ "${authority}" =~ ^[0-9a-f]{64}$ ]]
                  run_lifecycle substrate-apply "${spec}" "${machine}" "${authority}" \
                    > "${RUNNER_TEMP}/${prefix}-substrate-apply-${iteration}.json"
                  ;;
                BLOCKED_PROVIDER|BLOCKED_STRICT_SSH|BLOCKED_SUBSTRATE)
                  cat "${plan}" >&2
                  echo "host substrate convergence is blocked: ${action}" >&2
                  return 1
                  ;;
                *)
                  cat "${plan}" >&2
                  echo "unexpected host substrate action: ${action}" >&2
                  return 1
                  ;;
              esac
            done

            test "${converged}" = "1" || {
              echo "host substrate convergence exceeded bounded mutation steps" >&2
              return 1
            }
            if ! run_lifecycle substrate-verify "${spec}" "${machine}" > "${verify_output}"; then
              cat "${verify_output}" >&2
              return 1
            fi
            jq -e '.status == "PASS" and .plan.action == "NOOP"' "${verify_output}" >/dev/null
          }
          acquire_host_access() {
            local spec="$1"
            local machine="$2"
            local prefix="$3"
            local result="${RUNNER_TEMP}/${prefix}-access-acquire.json"
            run_lifecycle lease-acquire "${spec}" "${machine}" > "${result}"
            jq -e '.status == "READY" and .lease_phase == "READY" and .tcp_readiness.final_state == "READY"' \
              "${result}" >/dev/null
          }

          release_host_access() {
            local spec="$1"
            local machine="$2"
            local prefix="$3"
            local result="${RUNNER_TEMP}/${prefix}-access-release.json"
            run_lifecycle lease-release "${spec}" "${machine}" > "${result}"
            jq -e '.status == "RELEASED"' "${result}" >/dev/null
          }

          emit_result() {
            local file="$1"
            echo '### Vultr lifecycle result' >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~json' >> "${GITHUB_STEP_SUMMARY}"
            cat "${file}" >> "${GITHUB_STEP_SUMMARY}"
            echo '~~~' >> "${GITHUB_STEP_SUMMARY}"
          }

          cleanup_acceptance() {
            set +e
            release_host_access "${spec}" "${machine}" "acceptance-emergency" >/dev/null 2>&1 || true
            local destroy_json="${RUNNER_TEMP}/acceptance-emergency-destroy.json"
            if run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" > "${destroy_json}" 2>/dev/null; then
              local digest authority
              digest="$(jq -r '.destroy_digest // empty' "${destroy_json}")"
              authority="$(plan_authority "${destroy_json}" 2>/dev/null || true)"
              if [[ "${digest}" =~ ^[0-9a-f]{64}$ && "${authority}" =~ ^[0-9a-f]{64}$ ]]; then
                run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${digest}" "${authority}" >/dev/null 2>&1 || true
              fi
            fi
            local support_plan="${RUNNER_TEMP}/acceptance-emergency-support-plan.json"
            if run_lifecycle cleanup-plan "${spec}" > "${support_plan}" 2>/dev/null; then
              local support_authority
              support_authority="$(plan_authority "${support_plan}" 2>/dev/null || true)"
              if [[ "${support_authority}" =~ ^[0-9a-f]{64}$ ]]; then
                run_lifecycle cleanup "${spec}" "${support_authority}" >/dev/null 2>&1 || true
              fi
            fi
          }

          case "${REQUESTED_OPERATION}" in
            initial-vm-install)
              test "${spec}" = "infra/vultr/application-acceptance.json"
              test "${machine}" = "application-acceptance-1"
              test -n "${EDGE_VM_CREDENTIAL_ACCESS_CLIENT_ID}"
              test -n "${EDGE_VM_CREDENTIAL_ACCESS_CLIENT_SECRET}"
              application_spec="infra/application/disposable-acceptance.json"
              test -f "${application_spec}"
              agent_manifest="${RUNNER_TEMP}/initial-policy-edge-agent.json"
              "${bin}" application-lifecycle materialize \
                "${application_spec}" "${agent_manifest}" "${EDGE_LIFECYCLE_AGENT}"
              chmod 0600 "${agent_manifest}"

              # One native lifecycle for both a new disposable VM and an
              # already-owned acceptance VM. NEVER create a second VM when
              # the Git-owned provider plan is NOOP. Refuse UPDATE/DELETE/DRIFT
              # and ambiguous observations before acquiring host authority.
              run_lifecycle inventory "${spec}" > "${RUNNER_TEMP}/initial-vm-inventory.json"
              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/initial-vm-plan.json"
              jq -e '.plans | length == 1 and
                     (.[0].class == "CREATE" or .[0].class == "NOOP")' \
                "${RUNNER_TEMP}/initial-vm-plan.json" >/dev/null
              machine_class="$(jq -er '.plans[0].class' "${RUNNER_TEMP}/initial-vm-plan.json")"
              existing_owned_count="$(jq -er '[.inventory.resources[] | select(.ownership.environment == "application-acceptance")] | length' \
                "${RUNNER_TEMP}/initial-vm-inventory.json")"
              case "${machine_class}" in
                NOOP)
                  test "${existing_owned_count}" = "1"
                  # Reusing an existing exact owned VM is a read-only provider
                  # decision, not another CREATE attempt. It is never eligible
                  # for this run's automatic destructive cleanup.
                  jq -e '.plans[0].provider_id | type == "string" and length > 0' \
                    "${RUNNER_TEMP}/initial-vm-plan.json" >/dev/null
                  provider_id="$(jq -er '.plans[0].provider_id' "${RUNNER_TEMP}/initial-vm-plan.json")"
                  jq -e --arg id "${provider_id}" '
                    [.inventory.resources[] | select(.provider_id == $id and
                       .ownership.environment == "application-acceptance" and
                       .ownership.logical_id == "application-acceptance-1")] | length == 1
                  ' "${RUNNER_TEMP}/initial-vm-inventory.json" >/dev/null
                  echo 'first_use_create_confirmed=false' >> "${GITHUB_OUTPUT}"
                  jq -n --slurpfile plan "${RUNNER_TEMP}/initial-vm-plan.json" \
                    '{action:"REUSED_OWNED",provider_id:$plan[0].plans[0].provider_id,
                      provider_mutations:0,host_substrate_required:true}' \
                    > "${RUNNER_TEMP}/initial-vm-create.json"
                  ;;
                CREATE)
                  test "${existing_owned_count}" = "0"
                  authority="$(machine_authority "${RUNNER_TEMP}/initial-vm-plan.json")"
                  [[ "${authority}" =~ ^[0-9a-f]{64}$ ]]
                  # A lost CREATE ACK is terminal, no automatic retry or
                  # resource adoption from guessed IP/hostname.
                  echo 'first_use_provider_mutation_attempted=true' >> "${GITHUB_OUTPUT}"
                  run_lifecycle apply "${spec}" "${machine}" "${authority}" > "${RUNNER_TEMP}/initial-vm-create.json"
                  jq -e '.action == "CREATED" and .provider_ready == true and .host_substrate_required == true' \
                    "${RUNNER_TEMP}/initial-vm-create.json" >/dev/null
                  echo 'first_use_create_confirmed=true' >> "${GITHUB_OUTPUT}"
                  ;;
              esac

              # One exact native DNS convergence: CREATE only if absent,
              # else accept a matching owned NOOP. Never UPDATE, never upsert,
              # never retry an unknown provider ACK.
              test -n "${CLOUDFLARE_API_TOKEN}"
              run_lifecycle initial-dns-converge \
                infra/cloudflare/application-acceptance-dns.json "${application_spec}" \
                > "${RUNNER_TEMP}/initial-vm-dns.json"
              jq -e '.operation == "INITIAL_VM_DNS_CONVERGE" and
                     .status == "PASS" and
                     .record == "stage2-acceptance.alegria.by" and
                     .external_tls == "UNPROVEN" and
                     .provider_mutation_replay_allowed == false and
                     ((.outcome == "CREATED" and .provider_mutations == 1) or
                      (.outcome == "REUSED_OWNED" and .provider_mutations == 0))' \
                "${RUNNER_TEMP}/initial-vm-dns.json" >/dev/null

              # No compensation after an uncertain create/apply result. The
              # exact disposable identity remains available for read-only
              # reconciliation and separately authorized explicit cleanup.

              # A staged VM must have one strictly bounded SSH owner lease.
              # The same existing lease-release closes access on all outcomes.
              acquire_host_access "${spec}" "${machine}" "initial-vm-install"
              trap 'release_host_access "${spec}" "${machine}" "initial-vm-install-final" >/dev/null 2>&1 || true' EXIT
              converge_host_substrate "${spec}" "${machine}" "initial-vm-install" "${RUNNER_TEMP}/initial-vm-substrate.json"
              run_lifecycle initial-policy-stage \
                "${spec}" "${machine}" "${application_spec}" \
                "${agent_manifest}" "${EDGE_LIFECYCLE_AGENT}" \
                | tee "${RUNNER_TEMP}/result.json"
              jq -e '
                .operation == "INITIAL_VM_POLICY_STAGE" and
                .status == "PASS" and
                .machine_id == "application-acceptance-1" and
                .runtime_credentials == "ABSENT" and
                .application_containers == "NOT_STARTED" and
                .vm_access_identity_installed == true and
                .vm_access_identity_owner == "ROOT_0600" and
                .provider_credential_mutations == 0 and
                (.bundle_digest | type == "string")
              ' "${RUNNER_TEMP}/result.json" >/dev/null
              release_host_access "${spec}" "${machine}" "initial-vm-install"
              trap - EXIT
              cp "${RUNNER_TEMP}/result.json" "${RUNNER_TEMP}/initial-vm-policy.json"
              jq -n \
                --slurpfile machine "${RUNNER_TEMP}/initial-vm-create.json" \
                --slurpfile substrate "${RUNNER_TEMP}/initial-vm-substrate.json" \
                --slurpfile dns "${RUNNER_TEMP}/initial-vm-dns.json" \
                --slurpfile policy "${RUNNER_TEMP}/initial-vm-policy.json" \
                --arg revision "${source_revision}" \
                '{
                  operation: "INITIAL_VM_INSTALL",
                  status: "STAGED_NOT_ACCEPTED",
                  source_revision: $revision,
                  provider_id: $machine[0].provider_id,
                  machine_id: $policy[0].machine_id,
                  release_set_sha256: $policy[0].release_set_sha256,
                  host_substrate: $substrate[0],
                  dns: $dns[0],
                  staged_policy: $policy[0],
                  external_line1: "UNPROVEN",
                  external_line2: "UNPROVEN",
                  provider_credential_mutations: 0
                }' | tee "${RUNNER_TEMP}/result.json"
              ;;
            doctor)
              run_lifecycle doctor "${spec}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            inventory)
              run_lifecycle inventory "${spec}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            plan)
              if [[ -n "${machine}" ]]; then
                run_lifecycle plan "${spec}" "${machine}" | tee "${RUNNER_TEMP}/result.json"
              else
                run_lifecycle plan "${spec}" | tee "${RUNNER_TEMP}/result.json"
              fi
              ;;
            access-release)
              release_host_access "${spec}" "${machine}" "explicit"
              cp "${RUNNER_TEMP}/explicit-access-release.json" "${RUNNER_TEMP}/result.json"
              jq -e '.status == "RELEASED"
                and .access.next_plan.action == "NOOP"
                and (.access.next_plan.matching_rule_ids | length) == 0' "${RUNNER_TEMP}/result.json" >/dev/null
              cat "${RUNNER_TEMP}/result.json"
              ;;
            runner-bootstrap)
              acquire_host_access "${spec}" "${machine}" "runner-bootstrap"
              trap 'release_host_access "${spec}" "${machine}" "runner-bootstrap-emergency" >/dev/null 2>&1 || true' EXIT
              run_lifecycle runner-bootstrap "${spec}" "${machine}" \
                "edge-platform/scripts/install-vultr-production-runner.sh" \
                "${RUNNER_TEMP}/edge-platform-release/edge-agent-linux-amd64" \
                | tee "${RUNNER_TEMP}/result.json"
              jq -e '
                .status == "PASS"
                and .machine_id == env.MACHINE_ID
                and .runner_user == "github-runner"
                and .generic_root_authority == false
                and .bounded_runtime_dispatch == true
                and .docker_socket_authority == false
                and .acceptance_rpc_service_enabled == false
                and .tcp_50061_listener == false
                and .listener == "PASS"
                and .registration_token_persisted == false
              ' "${RUNNER_TEMP}/result.json" >/dev/null
              release_host_access "${spec}" "${machine}" "runner-bootstrap"
              trap - EXIT
              ;;
            action-plan)
              run_lifecycle action-plan "${spec}" "${machine}" "${INSTANCE_ACTION}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            apply)
              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/apply-authority-plan.json"
              authority="$(machine_authority "${RUNNER_TEMP}/apply-authority-plan.json")"
              run_lifecycle apply "${spec}" "${machine}" "${authority}" > "${RUNNER_TEMP}/apply-provider.json"
              acquire_host_access "${spec}" "${machine}" "apply"

              substrate_rc=0
              set +e
              converge_host_substrate "${spec}" "${machine}" "apply" "${RUNNER_TEMP}/apply-substrate-verify.json"
              substrate_rc=$?
              set -e

              release_rc=0
              set +e
              release_host_access "${spec}" "${machine}" "apply"
              release_rc=$?
              set -e

              if [[ "${substrate_rc}" -ne 0 ]]; then
                exit "${substrate_rc}"
              fi
              if [[ "${release_rc}" -ne 0 ]]; then
                echo "host substrate passed but transient SSH access release failed" >&2
                exit "${release_rc}"
              fi

              jq -s '.[0] + {host_substrate: .[1]}' \
                "${RUNNER_TEMP}/apply-provider.json" "${RUNNER_TEMP}/apply-substrate-verify.json" \
                | tee "${RUNNER_TEMP}/result.json"
              ;;
            action)
              run_lifecycle action-plan "${spec}" "${machine}" "${INSTANCE_ACTION}" > "${RUNNER_TEMP}/action-authority-plan.json"
              authority="$(plan_authority "${RUNNER_TEMP}/action-authority-plan.json")"
              run_lifecycle action "${spec}" "${machine}" "${INSTANCE_ACTION}" "${authority}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            destroy-plan)
              run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            destroy-apply)
              run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" > "${RUNNER_TEMP}/destroy-authority-plan.json"
              planned_digest="$(jq -er '.destroy_digest' "${RUNNER_TEMP}/destroy-authority-plan.json")"
              authority="$(plan_authority "${RUNNER_TEMP}/destroy-authority-plan.json")"
              test "${planned_digest}" = "${DESTROY_DIGEST}"
              run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${DESTROY_DIGEST}" "${authority}" > "${RUNNER_TEMP}/destroy-result.json"
              run_lifecycle cleanup-plan "${spec}" > "${RUNNER_TEMP}/destroy-support-plan.json"
              support_authority="$(plan_authority "${RUNNER_TEMP}/destroy-support-plan.json")"
              run_lifecycle cleanup "${spec}" "${support_authority}" > "${RUNNER_TEMP}/destroy-support-result.json"
              jq -s '.[0] + {support_cleanup: .[1]}' \
                "${RUNNER_TEMP}/destroy-result.json" "${RUNNER_TEMP}/destroy-support-result.json" \
                | tee "${RUNNER_TEMP}/result.json"
              ;;
            cleanup-plan)
              run_lifecycle cleanup-plan "${spec}" | tee "${RUNNER_TEMP}/result.json"
              jq -e '.plan.action | type == "string"' "${RUNNER_TEMP}/result.json" >/dev/null
              jq -e '.plan.environment_in_use | type == "boolean"' "${RUNNER_TEMP}/result.json" >/dev/null
              jq -e '.plan_authority.authority_digest | test("^[0-9a-f]{64}$")' "${RUNNER_TEMP}/result.json" >/dev/null
              ;;
            cleanup)
              run_lifecycle cleanup-plan "${spec}" > "${RUNNER_TEMP}/cleanup-authority-plan.json"
              authority="$(plan_authority "${RUNNER_TEMP}/cleanup-authority-plan.json")"
              run_lifecycle cleanup "${spec}" "${authority}" | tee "${RUNNER_TEMP}/result.json"
              ;;
            acceptance)
              run_lifecycle doctor "${spec}" > "${RUNNER_TEMP}/doctor.json"
              run_lifecycle inventory "${spec}" > "${RUNNER_TEMP}/inventory-before.json"
              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/plan-before.json"
              jq -e '.plans[0].class == "CREATE"' "${RUNNER_TEMP}/plan-before.json" >/dev/null
              create_authority="$(machine_authority "${RUNNER_TEMP}/plan-before.json")"

              trap 'rc=$?; if [[ $rc -ne 0 ]]; then cleanup_acceptance; fi; exit $rc' EXIT

              run_lifecycle apply "${spec}" "${machine}" "${create_authority}" > "${RUNNER_TEMP}/apply-first.json"
              jq -e '.action == "CREATED" and .provider_ready == true and .host_substrate_required == true' \
                "${RUNNER_TEMP}/apply-first.json" >/dev/null
              acquire_host_access "${spec}" "${machine}" "acceptance"
              converge_host_substrate "${spec}" "${machine}" "acceptance-first" "${RUNNER_TEMP}/substrate-first-verify.json"

              run_lifecycle transport-proof "${spec}" "${machine}" "${EDGE_LIFECYCLE_AGENT}" \
                > "${RUNNER_TEMP}/restricted-transport-t0a.json"
              jq -e '
                .status == "PASS"
                and .transport_user == "edge-control"
                and .transport_target == "127.0.0.1:50061"
                and .agent.get_version == "PASS"
                and .agent.get_health == "PASS"
                and .agent.observe_ipv4_network == "PASS"
                and .negative_capabilities.shell_rejected == true
                and .negative_capabilities.exec_rejected == true
                and .negative_capabilities.scp_rejected == true
                and .negative_capabilities.sftp_rejected == true
                and .negative_capabilities.pty_rejected == true
                and .negative_capabilities.remote_forward_rejected == true
                and .legacy_bootstrap_used == true
                and .exclusive_transport_key_capability_proven == false
              ' "${RUNNER_TEMP}/restricted-transport-t0a.json" >/dev/null

              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/apply-noop-plan.json"
              noop_authority="$(machine_authority "${RUNNER_TEMP}/apply-noop-plan.json")"
              run_lifecycle apply "${spec}" "${machine}" "${noop_authority}" > "${RUNNER_TEMP}/apply-noop.json"
              jq -e '.action == "NOOP" and .provider_ready == true' "${RUNNER_TEMP}/apply-noop.json" >/dev/null
              if ! run_lifecycle substrate-verify "${spec}" "${machine}" > "${RUNNER_TEMP}/apply-noop-substrate.json"; then
                cat "${RUNNER_TEMP}/apply-noop-substrate.json" >&2
                exit 1
              fi
              jq -e '.status == "PASS" and .plan.action == "NOOP"' "${RUNNER_TEMP}/apply-noop-substrate.json" >/dev/null

              run_lifecycle action-plan "${spec}" "${machine}" halt > "${RUNNER_TEMP}/halt-plan.json"
              halt_authority="$(plan_authority "${RUNNER_TEMP}/halt-plan.json")"
              run_lifecycle action "${spec}" "${machine}" halt "${halt_authority}" > "${RUNNER_TEMP}/halt.json"
              jq -e '.power_status == "stopped"' "${RUNNER_TEMP}/halt.json" >/dev/null
              run_lifecycle action-plan "${spec}" "${machine}" start > "${RUNNER_TEMP}/start-plan.json"
              start_authority="$(plan_authority "${RUNNER_TEMP}/start-plan.json")"
              run_lifecycle action "${spec}" "${machine}" start "${start_authority}" > "${RUNNER_TEMP}/start.json"
              jq -e '.power_status == "running"' "${RUNNER_TEMP}/start.json" >/dev/null
              if ! run_lifecycle substrate-verify "${spec}" "${machine}" > "${RUNNER_TEMP}/post-start-substrate.json"; then
                cat "${RUNNER_TEMP}/post-start-substrate.json" >&2
                exit 1
              fi
              jq -e '.status == "PASS" and .plan.action == "NOOP"' \
                "${RUNNER_TEMP}/post-start-substrate.json" >/dev/null

              run_lifecycle action-plan "${spec}" "${machine}" reboot > "${RUNNER_TEMP}/reboot-plan.json"
              reboot_authority="$(plan_authority "${RUNNER_TEMP}/reboot-plan.json")"
              if ! run_lifecycle action "${spec}" "${machine}" reboot "${reboot_authority}" > "${RUNNER_TEMP}/reboot.json"; then
                cat "${RUNNER_TEMP}/reboot.json" >&2
                exit 1
              fi
              if ! run_lifecycle substrate-verify "${spec}" "${machine}" > "${RUNNER_TEMP}/post-reboot-substrate.json"; then
                cat "${RUNNER_TEMP}/post-reboot-substrate.json" >&2
                exit 1
              fi
              jq -e '.status == "PASS" and .plan.action == "NOOP"' \
                "${RUNNER_TEMP}/post-reboot-substrate.json" >/dev/null

              release_host_access "${spec}" "${machine}" "acceptance"

              run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" > "${RUNNER_TEMP}/destroy-plan.json"
              digest="$(jq -r '.destroy_digest' "${RUNNER_TEMP}/destroy-plan.json")"
              destroy_authority="$(plan_authority "${RUNNER_TEMP}/destroy-plan.json")"
              [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
              [[ "${destroy_authority}" =~ ^[0-9a-f]{64}$ ]]

              stale_digest="$(printf '0%.0s' {1..64})"
              if [[ "${stale_digest}" == "${digest}" ]]; then
                stale_digest="$(printf '1%.0s' {1..64})"
              fi
              if run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${stale_digest}" "${destroy_authority}"                 > "${RUNNER_TEMP}/stale-unexpected.json" 2> "${RUNNER_TEMP}/stale-error.txt"; then
                echo "stale destroy digest was incorrectly accepted" >&2
                exit 1
              fi
              grep -q "destroy digest is stale" "${RUNNER_TEMP}/stale-error.txt"

              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/plan-after-stale.json"
              jq -e '.plans[0].class == "NOOP"' "${RUNNER_TEMP}/plan-after-stale.json" >/dev/null

              run_lifecycle destroy-plan "${spec}" "${machine}" "${source_revision}" > "${RUNNER_TEMP}/destroy-plan-final.json"
              digest="$(jq -r '.destroy_digest' "${RUNNER_TEMP}/destroy-plan-final.json")"
              destroy_authority="$(plan_authority "${RUNNER_TEMP}/destroy-plan-final.json")"
              run_lifecycle destroy-apply "${spec}" "${machine}" "${source_revision}" "${digest}" "${destroy_authority}" > "${RUNNER_TEMP}/destroy-apply.json"
              jq -e '.absence_verified == true' "${RUNNER_TEMP}/destroy-apply.json" >/dev/null

              run_lifecycle cleanup-plan "${spec}" > "${RUNNER_TEMP}/support-cleanup-plan.json"
              support_authority="$(plan_authority "${RUNNER_TEMP}/support-cleanup-plan.json")"
              run_lifecycle cleanup "${spec}" "${support_authority}" > "${RUNNER_TEMP}/support-cleanup.json"
              jq -e '.environment_in_use == false' "${RUNNER_TEMP}/support-cleanup.json" >/dev/null

              run_lifecycle cleanup-plan "${spec}" > "${RUNNER_TEMP}/cleanup-idempotent-plan.json"
              jq -e '.plan.action == "NOOP"' "${RUNNER_TEMP}/cleanup-idempotent-plan.json" >/dev/null
              noop_support_authority="$(plan_authority "${RUNNER_TEMP}/cleanup-idempotent-plan.json")"
              run_lifecycle cleanup "${spec}" "${noop_support_authority}" > "${RUNNER_TEMP}/cleanup-idempotent.json"
              jq -e '.action == "NOOP" and .environment_in_use == false and .ssh_key_removed == false and (.firewall_groups_removed | length) == 0' "${RUNNER_TEMP}/cleanup-idempotent.json" >/dev/null

              run_lifecycle inventory "${spec}" > "${RUNNER_TEMP}/inventory-after.json"
              jq -e '[.inventory.resources[] | select(.ownership.environment == "lifecycle-acceptance")] | length == 0'                 "${RUNNER_TEMP}/inventory-after.json" >/dev/null
              run_lifecycle plan "${spec}" "${machine}" > "${RUNNER_TEMP}/plan-after.json"
              jq -e '.plans[0].class == "CREATE"' "${RUNNER_TEMP}/plan-after.json" >/dev/null

              trap - EXIT
              jq -n                 --arg revision "${source_revision}"                 --arg first_action "$(jq -r '.action' "${RUNNER_TEMP}/apply-first.json")"                 --arg provider_id "$(jq -r '.provider_id' "${RUNNER_TEMP}/destroy-apply.json")"                 '{
                  acceptance: "PASS",
                  source_revision: $revision,
                  first_apply: $first_action,
                  repeat_apply: "NOOP",
                  strict_ssh: "PASS",
                  restricted_transport_t0a: "PASS",
                  user_data_scrub: "PASS",
                  halt_start_reboot: "PASS",
                  stale_destroy_digest_refusal: "PASS",
                  destroy_absence: "PASS",
                  support_cleanup: "PASS",
                  provider_id: $provider_id
                }' | tee "${RUNNER_TEMP}/result.json"
              ;;
          esac

          emit_result "${RUNNER_TEMP}/result.json"

      - name: Verify self-hosted runner online
        if: env.REQUESTED_OPERATION == 'runner-bootstrap'
        shell: bash
        env:
          IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN: ${{ secrets.IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_name="sing-box-production-${MACHINE_ID}"
          for attempt in {1..20}; do
            response="$(curl --fail --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${IAMAMAN11_SING_BOX_CONTROL_PLANE_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${REPOSITORY}/actions/runners?per_page=100")"
            if jq -e --arg name "${expected_name}" --arg machine "${MACHINE_ID}" '
              .runners[]
              | select(.name == $name and .status == "online")
              | [.labels[].name] as $labels
              | ($labels | index("self-hosted")) != null
                and ($labels | index("Linux")) != null
                and ($labels | index("X64")) != null
                and ($labels | index("sing-box-production-vm")) != null
                and ($labels | index("vultr-root")) == null
                and ($labels | index("test-vm")) == null
                and ($labels | index($machine)) != null
            ' <<<"${response}" >/dev/null; then
              echo "self-hosted production VM runner is online: ${expected_name}"
              exit 0
            fi
            sleep 3
          done
          echo "self-hosted production VM runner did not become online: ${expected_name}" >&2
          exit 1

      - name: Remove SSH authority material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${EDGE_SSH_PRIVATE_KEY_PATH:-${RUNNER_TEMP}/singbox-vultr-ops}"

# All first-use owners execute inside the SAME authorized issue-comment run.
  # One CLI command, no separate credential-issuance issue command, no replay.
  initial_worker_proof_upgrade:
    name: Bind exact Worker slot proof without changing opaque secrets
    needs: authorize
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Persist proof-code BEGIN and migrate exact Worker code once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          test -n "${CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN}"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ACCEPTED_REVISION}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          umask 077
          history="${RUNNER_TEMP}/proof-upgrade-history.json"
          exact="${RUNNER_TEMP}/proof-upgrade-begin.txt"
          gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" |
            jq -s 'add' > "${history}"
          "${owner}" credentials initial-pair-journal-observe "${history}" > "${RUNNER_TEMP}/first-use-empty.txt"
          grep -Fxq 'credential_initial_journal_empty=true' "${RUNNER_TEMP}/first-use-empty.txt"
          "${owner}" credentials initial-worker-proof-plan "${GITHUB_RUN_ID}" \
            "${history}" "${exact}" > "${RUNNER_TEMP}/proof-plan.txt"
          grep -Fxq 'worker_provider_mutations=0' "${RUNNER_TEMP}/proof-plan.txt"
          if grep -Fxq 'worker_proof_upgrade_required=false' "${RUNNER_TEMP}/proof-plan.txt"; then
            test ! -e "${exact}"
            grep -Fxq 'worker_proof_code_verified=EXACT_TWO_ACTIVE' "${RUNNER_TEMP}/proof-plan.txt"
            echo 'WORKER_EXACT_SLOT_PROOF_CODE=ALREADY_EXACT_READ_ONLY' >> "${GITHUB_STEP_SUMMARY}"
          else
            grep -Fxq 'worker_proof_upgrade_required=true' "${RUNNER_TEMP}/proof-plan.txt"
            test -s "${exact}"
            # Write BEGIN only once; an unknown POST ACK can never be replayed.
            gh api --method POST "repos/${REPOSITORY}/issues/26/comments" \
              --raw-field "body=$(cat "${exact}")" > "${RUNNER_TEMP}/proof-begin-ack.json"
            jq -e --arg body "$(cat "${exact}")" \
              '.body == $body and (.id|type == "number")' "${RUNNER_TEMP}/proof-begin-ack.json" >/dev/null
            gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" |
              jq -s 'add' > "${history}"
            "${owner}" credentials initial-worker-proof-upgrade "${GITHUB_RUN_ID}" \
              "${history}" "${exact}" > "${RUNNER_TEMP}/proof-upgrade.txt"
            grep -Fxq 'worker_proof_durable_begin=EXACT_READBACK' "${RUNNER_TEMP}/proof-upgrade.txt"
            grep -Fxq 'worker_secret_patch_mutations=0' "${RUNNER_TEMP}/proof-upgrade.txt"
            grep -Fxq 'worker_actual_binding_dummy=UNPROVEN_BY_PROVIDER_METADATA' "${RUNNER_TEMP}/proof-upgrade.txt"
            echo 'WORKER_EXACT_SLOT_PROOF_CODE=DEPLOYED_VERSION_FENCED' >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo 'WORKER_A_B_SECRET_CONTENTS=UNPROVEN_UNTIL_HOST_ATTEST' >> "${GITHUB_STEP_SUMMARY}"

  initial_preflight:
    name: Bind first-use Cloudflare version intent
    needs: [authorize, initial_worker_proof_upgrade]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      intent: ${{ steps.proof.outputs.intent }}
      release_set: ${{ steps.proof.outputs.release_set }}
      generation: ${{ steps.proof.outputs.generation }}
    steps:
      - name: Read exact published release and empty GitHub journal
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ACCEPTED_REVISION}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          history="${RUNNER_TEMP}/initial-history.json"
          gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" | jq -s 'add' > "${history}"
          "${owner}" credentials initial-pair-journal-observe "${history}" > "${RUNNER_TEMP}/journal.txt"
          grep -Fxq 'credential_initial_journal_empty=true' "${RUNNER_TEMP}/journal.txt"
          [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          "${owner}" credentials initial-pair-preflight "${GITHUB_RUN_ID}" b > "${RUNNER_TEMP}/preflight.txt"
          grep -Fxq 'initial_publication_authorized=false' "${RUNNER_TEMP}/preflight.txt"
          grep -Fxq 'credential_provider_mutations=0' "${RUNNER_TEMP}/preflight.txt"
          intent="$(sed -n 's/^initial_pair_provider_intent_sha256=//p' "${RUNNER_TEMP}/preflight.txt")"
          [[ "${intent}" =~ ^[0-9a-f]{64}$ ]]
          test "$(grep -c '^initial_pair_provider_intent_sha256=' "${RUNNER_TEMP}/preflight.txt")" -eq 1
          printf 'intent=%s\nrelease_set=%s\ngeneration=%s\n' \
            "${intent}" "${EDGE_RELEASE_SET_SHA256}" "${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

  initial_vm_attest:
    name: Attest exact disposable VM owner
    needs: [authorize, execute, initial_preflight]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      attestation: ${{ steps.vm.outputs.attestation }}
    steps:
      - name: Authenticate VM binary and genuine dummy A/B slots
        id: vm
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          INTENT: ${{ needs.initial_preflight.outputs.intent }}
          RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
          GENERATION: ${{ needs.initial_preflight.outputs.generation }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${RELEASE_SET}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          agent="${OUTPUT_DIR}/edge-agent-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sha256sum "${agent}" | cut -d' ' -f1)" = "${EDGE_AGENT_SHA256}"
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          key="${RUNNER_TEMP}/singbox-vultr-ops"
          umask 077
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key}"
          test -s "${key}"
          export EDGE_SSH_PRIVATE_KEY_PATH="${key}"
          ip="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          export EDGE_CONTROLLER_IPV4="${ip}"
          "${owner}" vultr-lifecycle lease-acquire infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/lease.json"
          jq -e '.status == "READY" and .lease_phase == "READY"' "${RUNNER_TEMP}/lease.json" >/dev/null
          trap '"${owner}" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 >/dev/null 2>&1 || true' EXIT
          "${owner}" vultr-lifecycle initial-host-probe \
            infra/vultr/application-acceptance.json application-acceptance-1 \
            "${GENERATION}" b "${INTENT}" "${RELEASE_SET}" "${GITHUB_RUN_ID}" "${agent}" \
            > "${RUNNER_TEMP}/vm-proof.json"
          jq -e --arg g "${GENERATION}" --arg rel "${RELEASE_SET}" --arg intent "${INTENT}" \
            '.status == "PASS" and .operation == "CREDENTIAL_INITIAL_HOST_PROBE" and
             .credential_projection == "VM" and .credential_generation == ($g|tonumber) and
             .release_set_sha256 == $rel and .provider_intent_sha256 == $intent and
             .credential_slot == "b" and
             .credential_slot_B == "EXACT_CANONICAL_DUMMY" and
             .credential_selected_slot_exact_dummy == true and
             .credential_peer_slot_overwrite_authorized == false and
             .credential_store_present == false and .credential_provider_mutations == 0 and
             .credential_runtime_mutations == 0 and
             (.credential_host_attestation_sha256|test("^[0-9a-f]{64}$"))' \
            "${RUNNER_TEMP}/vm-proof.json" >/dev/null
          attestation="$(jq -er .credential_host_attestation_sha256 "${RUNNER_TEMP}/vm-proof.json")"
          "${owner}" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/lease-release.json"
          jq -e '.status == "RELEASED"' "${RUNNER_TEMP}/lease-release.json" >/dev/null
          trap - EXIT
          printf 'attestation=%s\n' "${attestation}" >> "${GITHUB_OUTPUT}"

  initial_windows_isolate:
    name: Install separate exact Windows ProxyOnly acceptance consumer, no SCM
    needs: [authorize, initial_preflight]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 25
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      EDGE_INSTALL_ROOT: C:\sing-box-acceptance
      RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
      EDGE_GITHUB_TOKEN: ${{ github.token }}
      EDGE_WINDOWS_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_WINDOWS_ACCESS_CLIENT_ID }}
      EDGE_WINDOWS_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_WINDOWS_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize isolated release from accepted immutable ReleaseSet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'Windows acceptance installation replay forbidden' }
          if ($env:GITHUB_REPOSITORY -cne 'iamaman11/sing-box' -or $env:GITHUB_REPOSITORY_ID -cne '1221750822') {
            throw 'Windows isolated acceptance refuses foreign repository'
          }
          if (-not $env:EDGE_WINDOWS_ACCESS_CLIENT_ID -or -not $env:EDGE_WINDOWS_ACCESS_CLIENT_SECRET) {
            throw 'Windows Access bootstrap unavailable; never borrow serving local credentials'
          }
          $root = $env:EDGE_INSTALL_ROOT
          if ($root -cne 'C:\sing-box-acceptance') { throw 'Only isolated acceptance root is permitted' }
          if (Test-Path -LiteralPath $root) { throw 'Existing Windows acceptance root: reconcile read-only, never overwrite' }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          # The disposable tree must be accessible only to its exact runner
          # identity, built-in Administrators and SYSTEM, not ordinary users.
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $root '/inheritance:r' '/grant:r' "*${sid}:(OI)(CI)F" 'SYSTEM:(OI)(CI)F' 'Administrators:(OI)(CI)F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance ACL confinement failed' }
          $sentinel = Join-Path $root '.first-use-run'
          [IO.File]::WriteAllText($sentinel, "${env:GITHUB_RUN_ID}|${env:RELEASE_SET}")
          $installer = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\install-windows-release.ps1'
          & $installer -Repository 'iamaman11/sing-box' -ReleaseSetSha256 $env:RELEASE_SET -AcceptedRevision $env:GITHUB_SHA -InstallRoot $root -GitHubToken $env:EDGE_GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'Windows exact isolated release installation failed' }
          $diagnostic = Join-Path $root 'bin\edge-diagnostic.exe'
          $doctor = @(& $diagnostic doctor (Join-Path $root 'current.pb'))
          if ($LASTEXITCODE -ne 0 -or -not ($doctor -contains 'windows_datapath_mode=ProxyOnly') -or -not ($doctor -contains "release_set_sha256=$env:RELEASE_SET")) {
            throw 'Windows installed acceptance release does not prove exact ProxyOnly'
          }
          $console = Join-Path $root 'bin\edge-console.exe'
          & $console credential-initial-acceptance-bootstrap --install-root $root
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Windows Access bootstrap failed; do not retry' }
          Write-Host 'WINDOWS_ISOLATED_EXACT_RELEASE=PASS'
          Write-Host 'WINDOWS_SERVING_INSTALL_ROOT=UNTOUCHED'
          Write-Host 'WINDOWS_TUN_MUTATIONS=0'
          Write-Host 'WINDOWS_DNS_MUTATIONS=0'
          Write-Host 'WINDOWS_SCM_MUTATIONS=0'

  initial_windows_attest:
    name: Attest isolated Windows host without TUN or DNS mutation
    needs: [authorize, initial_preflight, initial_windows_isolate]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    outputs:
      attestation: ${{ steps.windows.outputs.attestation }}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box-acceptance
      RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
      GENERATION: ${{ needs.initial_preflight.outputs.generation }}
      INTENT: ${{ needs.initial_preflight.outputs.intent }}
    steps:
      - name: Read-only local credential projection and exact release attestation
        id: windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'First-use attestation replay forbidden' }
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Windows release doctor failed' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -cne $env:RELEASE_SET) {
            throw 'Windows local binary does not match first-use immutable ReleaseSet'
          }
          # Never use the existing ManagedTun production host as the disposable
          # first-use Windows consumer, even when its local credential store is
          # absent. The proof must be from an independently installed ProxyOnly
          # owner, otherwise the paired Cloudflare mutation never starts.
          if ([string]$values['windows_datapath_mode'] -cne 'ProxyOnly') {
            throw 'FIRST_USE_WINDOWS_ISOLATION_BLOCKED: installed Windows owner is not ProxyOnly; never stage on ManagedTun production'
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or
              -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Immutable installed console missing'
          }
          $raw = @(& $console credential-initial-attest $env:GENERATION b $env:INTENT $env:RELEASE_SET $env:GITHUB_RUN_ID --install-root $env:EDGE_INSTALL_ROOT)
          if ($LASTEXITCODE -ne 0) { throw 'Windows exact dummy A/B attestation failed' }
          $proof = @{}
          foreach ($line in $raw) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $proof[$parts[0]] = $parts[1] }
          }
          if ([string]$proof['operation'] -cne 'CREDENTIAL_INITIAL_ATTEST' -or
              [string]$proof['credential_projection'] -cne 'WINDOWS' -or
              [string]$proof['credential_generation'] -cne $env:GENERATION -or
              [string]$proof['credential_github_run_id'] -cne $env:GITHUB_RUN_ID -or
              [string]$proof['credential_slot_B'] -cne 'EXACT_CANONICAL_DUMMY' -or
              [string]$proof['credential_selected_slot_exact_dummy'] -cne 'true' -or
              [string]$proof['credential_provider_mutations'] -cne '0' -or
              [string]$proof['credential_runtime_mutations'] -cne '0' -or
              [string]$proof['windows_tun_mutations'] -cne '0' -or
              [string]$proof['windows_dns_mutations'] -cne '0' -or
              [string]$proof['credential_host_attestation_sha256'] -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Windows native attestation incomplete or unsafe'
          }
          # The acceptance consumer is independent of the intentionally
          # stopped serving Windows SCM. Check only the isolated local cursor.
          if (Test-Path -LiteralPath (Join-Path $env:EDGE_INSTALL_ROOT 'state\secrets\application-v2')) {
            throw 'First-use isolated Windows credential cursor already exists'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:EDGE_INSTALL_ROOT '.first-use-run'))) {
            throw 'Windows acceptance owner sentinel absent'
          }
          "attestation=$($proof['credential_host_attestation_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_OUTPUT
          Write-Host 'WINDOWS_INITIAL_READONLY_ATTEST=PASS'

  initial_pair_publish:
    name: One-time GitHub BEGIN then version-fenced paired Worker publication
    needs: [authorize, initial_preflight, initial_vm_attest, initial_windows_attest]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - name: Commit exact durable BEGIN once and publish both projections
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          CLOUDFLARE_CONTROL_TOKEN: ${{ secrets.CLOUDFLARE_CONTROL_TOKEN }}
          CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN: ${{ secrets.CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN }}
          INTENT: ${{ needs.initial_preflight.outputs.intent }}
          RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
          GENERATION: ${{ needs.initial_preflight.outputs.generation }}
          VM_ATTESTATION: ${{ needs.initial_vm_attest.outputs.attestation }}
          WINDOWS_ATTESTATION: ${{ needs.initial_windows_attest.outputs.attestation }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          [[ "${INTENT}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${VM_ATTESTATION}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${WINDOWS_ATTESTATION}" =~ ^[0-9a-f]{64}$ ]]
          test "${VM_ATTESTATION}" != "${WINDOWS_ATTESTATION}"
          test -n "${CLOUDFLARE_CONTROL_TOKEN}"
          test -n "${CLOUDFLARE_CREDENTIAL_ROTATION_TOKEN}"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_SET_SHA256}" = "${RELEASE_SET}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          umask 077
          history="${RUNNER_TEMP}/initial-history.json"
          exact="${RUNNER_TEMP}/exact-initial-begin.txt"
          # The pre-write observation must be empty; no duplicate BEGIN,
          # malformed record, changed intent, or unknown state is repairable.
          gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" | jq -s 'add' > "${history}"
          "${owner}" credentials initial-pair-journal-plan "${GENERATION}" b \
            "${INTENT}" "${VM_ATTESTATION}" "${WINDOWS_ATTESTATION}" "${GITHUB_RUN_ID}" \
            "${history}" "${exact}" > "${RUNNER_TEMP}/journal-plan.txt"
          grep -Fxq 'initial_publication_authorized=false' "${RUNNER_TEMP}/journal-plan.txt"
          test -s "${exact}"
          # Write ONCE. A failed or missing POST acknowledgement is UNKNOWN.
          # The workflow NEVER repeats POST, and NEVER PATCHes on UNKNOWN.
          gh api --method POST "repos/${REPOSITORY}/issues/26/comments" \
            --raw-field "body=$(cat "${exact}")" > "${RUNNER_TEMP}/begin-post.json"
          jq -e --arg body "$(cat "${exact}")" \
            '.body == $body and (.id|type == "number")' "${RUNNER_TEMP}/begin-post.json" >/dev/null
          gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" | jq -s 'add' > "${history}"
          "${owner}" credentials initial-pair-journal-readback "${history}" "${exact}" > "${RUNNER_TEMP}/readback.txt"
          grep -Fxq 'credential_initial_journal_exact_begin=true' "${RUNNER_TEMP}/readback.txt"
          # The Rust publisher rechecks the same durable BEGIN, source,
          # host attestations, Worker versions and identities before mutation.
          "${owner}" credentials initial-pair-publish "${GENERATION}" b \
            "${INTENT}" "${VM_ATTESTATION}" "${WINDOWS_ATTESTATION}" "${GITHUB_RUN_ID}" \
            "${history}" "${exact}" | tee "${RUNNER_TEMP}/pair-publish.txt"
          grep -Fxq 'credential_initial_pair_provider_publish=PASS' "${RUNNER_TEMP}/pair-publish.txt"
          grep -Fxq 'credential_initial_begin_record=EXACT_READBACK' "${RUNNER_TEMP}/pair-publish.txt"
          grep -Fxq 'paired_projection_count=2' "${RUNNER_TEMP}/pair-publish.txt"
          echo 'PAIRED_WORKER_FIRST_USE=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'External Line1 and Line2 remain UNPROVEN until physical acceptance.' >> "${GITHUB_STEP_SUMMARY}"

  initial_vm_runtime:
    name: Apply once and verify native VM runtime credential consumption
    needs: [authorize, initial_preflight, initial_pair_publish]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Revalidate original BEGIN before one-time apply then read-only verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
          GENERATION: ${{ needs.initial_preflight.outputs.generation }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${RELEASE_SET}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          agent="${OUTPUT_DIR}/edge-agent-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sha256sum "${agent}" | cut -d' ' -f1)" = "${EDGE_AGENT_SHA256}"
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          umask 077
          history="${RUNNER_TEMP}/initial-history.json"
          exact="${RUNNER_TEMP}/exact-initial-begin.txt"
          gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" | jq -s 'add' > "${history}"
          # Reject another or malformed BEGIN; runtime's native journal gate
          # independently validates exact SHA/release/run/generation.
          jq -er --arg marker '<!-- sing-box-credential-initial-attempt/v1 -->' \
            '[.[]|.body|select(startswith($marker))] | if length == 1 then .[0] else error("not exactly one first-use BEGIN") end' \
            "${history}" > "${exact}"
          python3 - "${exact}" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          p.write_bytes(p.read_bytes().removesuffix(b"\n"))
          PY
          "${owner}" credentials initial-pair-journal-readback "${history}" "${exact}" \
            > "${RUNNER_TEMP}/readback.txt"
          grep -Fxq 'credential_initial_journal_exact_begin=true' "${RUNNER_TEMP}/readback.txt"
          key="${RUNNER_TEMP}/singbox-vultr-ops"
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key}"
          test -s "${key}"
          export EDGE_SSH_PRIVATE_KEY_PATH="${key}"
          export EDGE_CONTROLLER_IPV4="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          "${owner}" vultr-lifecycle lease-acquire infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/lease.json"
          jq -e '.status == "READY" and .lease_phase == "READY"' "${RUNNER_TEMP}/lease.json" >/dev/null
          trap '"${owner}" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 >/dev/null 2>&1 || true' EXIT
          "${owner}" vultr-lifecycle initial-runtime-apply \
            infra/vultr/application-acceptance.json application-acceptance-1 \
            "${GENERATION}" "${RELEASE_SET}" "${GITHUB_RUN_ID}" "${history}" "${exact}" "${agent}" \
            > "${RUNNER_TEMP}/runtime-apply.json"
          jq -e '.status == "PASS" and .operation == "INITIAL_VM_RUNTIME_APPLY" and
             .candidate_materialized == true and .candidate_unpromoted == true and
             .external_line1_4_of_4 == "UNPROVEN" and .external_line2_6_of_6 == "UNPROVEN"' \
            "${RUNNER_TEMP}/runtime-apply.json" >/dev/null
          "${owner}" vultr-lifecycle initial-runtime-verify \
            infra/vultr/application-acceptance.json application-acceptance-1 \
            "${GENERATION}" "${RELEASE_SET}" "${GITHUB_RUN_ID}" "${history}" "${exact}" "${agent}" \
            > "${RUNNER_TEMP}/runtime-verify.json"
          jq -e '.status == "PASS" and .operation == "INITIAL_VM_RUNTIME_VERIFY" and
             .candidate_unpromoted == true and .candidate_materialized == true and
             (.vm_local_line2|length == 6) and
             all(.vm_local_line2[]; .successful_samples == 5 and .failed_samples == 0 and .negative_auth_rejected == true) and
             .external_line1_4_of_4 == "UNPROVEN" and .external_line2_6_of_6 == "UNPROVEN"' \
            "${RUNNER_TEMP}/runtime-verify.json" >/dev/null
          "${owner}" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/lease-release.json"
          jq -e '.status == "RELEASED"' "${RUNNER_TEMP}/lease-release.json" >/dev/null
          trap - EXIT
          echo 'N1_FIRST_USE_VM_LOCAL_RUNTIME=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'N2_EXTERNAL_TEN_ENDPOINTS=UNPROVEN' >> "${GITHUB_STEP_SUMMARY}"

  initial_line2_external:
    name: Independent public-port Line2 six-proxy HTTPS/TLS/auth witness
    needs: [authorize, initial_preflight, initial_pair_publish, initial_vm_runtime]
    outputs:
      vm_ipv4: ${{ steps.external.outputs.vm_ipv4 }}
      provider_id: ${{ steps.external.outputs.provider_id }}
      tls_domain: ${{ steps.external.outputs.tls_domain }}
      username: ${{ steps.external.outputs.username }}
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify exact VM ownership, then prove six external proxy ports
        id: external
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          GENERATION: ${{ needs.initial_preflight.outputs.generation }}
          RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VM_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          VM_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${VM_ACCESS_CLIENT_ID}"
          test -n "${VM_ACCESS_CLIENT_SECRET}"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ACCEPTED_REVISION}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_RELEASE_SET_SHA256}" = "${RELEASE_SET}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | cut -d' ' -f1)" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          "${owner}" vultr-lifecycle plan infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/external-plan.json"
          provider_id="$(jq -er '
            if (.plans|length)==1 and .plans[0].machine_id=="application-acceptance-1" and
               .plans[0].class=="NOOP" and (.plans[0].provider_id|type)=="string"
            then .plans[0].provider_id else error("external witness requires exact owned NOOP VM") end
          ' "${RUNNER_TEMP}/external-plan.json")"
          "${owner}" vultr-lifecycle inventory infra/vultr/application-acceptance.json > "${RUNNER_TEMP}/external-inventory.json"
          vm_ipv4="$(jq -er --arg id "${provider_id}" '
            [.inventory.resources[]|select(.provider_id==$id)] |
            if length==1 and (.[0].main_ip|type)=="string"
            then .[0].main_ip else error("external witness provider IP ambiguous") end
          ' "${RUNNER_TEMP}/external-inventory.json")"
          spec="infra/application/disposable-acceptance.json"
          test "$(jq -er .environment "${spec}")" = "application-acceptance"
          test "$(jq -er .machine_id "${spec}")" = "application-acceptance-1"
          domain="$(jq -er '.runtime_policy.line1.tunnel_domain' "${spec}")"
          username="$(jq -er '.runtime_policy.line2.proxy_username' "${spec}")"
          test "$(jq -er '.runtime_policy.line2.proxy_cert_cn' "${spec}")" = "${domain}"
          identity="${RUNNER_TEMP}/vm-worker-access.env"
          umask 077
          printf 'CF_ACCESS_CLIENT_ID=%s\nCF_ACCESS_CLIENT_SECRET=%s\n' \
            "${VM_ACCESS_CLIENT_ID}" "${VM_ACCESS_CLIENT_SECRET}" > "${identity}"
          trap 'rm -f "${identity}"' EXIT
          "${owner}" credentials initial-line2-external-witness \
            "${GENERATION}" "${vm_ipv4}" "${domain}" "${username}" "${identity}" \
            > "${RUNNER_TEMP}/line2-external.txt"
          grep -Fxq 'line2_external_6_of_6=PASS' "${RUNNER_TEMP}/line2-external.txt"
          grep -Fxq 'line2_direct_warp_egress_distinct=true' "${RUNNER_TEMP}/line2-external.txt"
          grep -Fxq 'vm_runtime_mutations=0' "${RUNNER_TEMP}/line2-external.txt"
          test "$(grep -c '^line2_external_endpoint=' "${RUNNER_TEMP}/line2-external.txt")" -eq 6
          echo 'N2_EXTERNAL_LINE2_6_OF_6=PASS' >> "${GITHUB_STEP_SUMMARY}"
          printf 'vm_ipv4=%s\nprovider_id=%s\ntls_domain=%s\nusername=%s\n' "${vm_ipv4}" "${provider_id}" "${domain}" "${username}" >> "${GITHUB_OUTPUT}"

  initial_windows_consume:
    name: Consume and validate Worker-v2 Windows candidate without TUN
    needs: [authorize, initial_preflight, initial_windows_attest, initial_pair_publish]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box-acceptance
      RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
      GENERATION: ${{ needs.initial_preflight.outputs.generation }}
    steps:
      - name: Stage and validate initial Windows projection, never apply or activate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'First-use Windows delivery replay forbidden' }
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw 'Initial Windows candidate cannot prove exact installed release' }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -cne $env:RELEASE_SET) {
            throw 'Initial Windows credential candidate requires exact accepted ReleaseSet'
          }
          if ([string]$values['windows_datapath_mode'] -cne 'ProxyOnly') {
            throw 'FIRST_USE_WINDOWS_ISOLATION_CHANGED: owner lost ProxyOnly before credential stage; refuse mutation'
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Initial Windows immutable console missing'
          }
          # Host eligibility was independently proven BEFORE paired publish.
          # No active runtime, candidate or legacy path is ever overwritten.
          # This is a one-time mutation: no retry after uncertain dispatch ACK.
          & $console credential-initial-acceptance-stage ([UInt64]$env:GENERATION) --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Windows Worker candidate stage failed; do not replay' }
          & $console credential-transition validate-candidate --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Initial Windows candidate config validation failed; do not replay stage' }
          # Read-back and native sing-box check are performed by the
          # existing credential-transition validate-candidate owner. No
          # activation, controller RPC or secret output is required.
          $external = @(& $console credential-initial-line1-witness ([UInt64]$env:GENERATION) --install-root $env:EDGE_INSTALL_ROOT)
          if ($LASTEXITCODE -ne 0 -or -not ($external -contains 'line1_external_4_of_4=PASS') -or
              -not ($external -contains 'line1_direct_warp_egress_distinct=true') -or
              -not ($external -contains 'windows_tun_mutations=0') -or
              -not ($external -contains 'windows_scm_mutations=0')) {
            throw 'Independent authenticated Line1 direct/WARP 4/4 external witness failed'
          }
          Write-Host 'N2_EXTERNAL_LINE1_4_OF_4=PASS'
          Write-Host 'WINDOWS_WORKER_PROJECTION_CONSUMED=PASS'
          Write-Host 'WINDOWS_CANDIDATE_VALIDATED=PASS'
          Write-Host 'WINDOWS_TUN_MUTATIONS=0'
          Write-Host 'WINDOWS_DNS_MUTATIONS=0'
          Write-Host 'WINDOWS_ACTIVE_CREDENTIAL_PROMOTION=NOT_PERFORMED'
          Write-Host 'WINDOWS_SERVING_INSTALL_ROOT=UNTOUCHED'

# Candidate and VM-local checks are necessary but never an external PASS.
  # Keep this native one-command installation fail-closed until the required
  # independent external witness and reboot/cleanup proof are implemented.
  initial_windows_post_reboot:
    name: Repeat independent external 4/4 Line1 after real VM reboot
    needs: [authorize, initial_preflight, initial_windows_consume, initial_reboot]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      GENERATION: ${{ needs.initial_preflight.outputs.generation }}
      RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
    steps:
      - name: Reuse only exact isolated candidate; prove public 4/4 after reboot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'External reboot proof cannot replay first-use mutations' }
          $root = 'C:\sing-box-acceptance'
          $sentinel = Join-Path $root '.first-use-run'
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf) -or
              [IO.File]::ReadAllText($sentinel) -cne "${env:GITHUB_RUN_ID}|${env:RELEASE_SET}") {
            throw 'Post-reboot Line1 witness refuses unowned acceptance root'
          }
          $diagnostic = Join-Path $root 'bin\edge-diagnostic.exe'
          $doctor = @(& $diagnostic doctor (Join-Path $root 'current.pb'))
          if ($LASTEXITCODE -ne 0 -or -not ($doctor -contains "release_set_sha256=$env:RELEASE_SET") -or
              -not ($doctor -contains 'windows_datapath_mode=ProxyOnly')) {
            throw 'Post-reboot Line1 witness requires exact immutable ProxyOnly ReleaseSet'
          }
          $console = Join-Path $root 'bin\edge-console.exe'
          $proof = @(& $console credential-initial-line1-witness ([UInt64]$env:GENERATION) --install-root $root)
          if ($LASTEXITCODE -ne 0 -or
              -not ($proof -contains 'line1_external_4_of_4=PASS') -or
              -not ($proof -contains 'line1_direct_warp_egress_distinct=true') -or
              -not ($proof -contains 'windows_tun_mutations=0') -or
              -not ($proof -contains 'windows_scm_mutations=0')) {
            throw 'Post-reboot independent authenticated Line1 external 4/4 failed'
          }
          Write-Host 'N2_POST_REBOOT_EXTERNAL_LINE1_4_OF_4=PASS'
          Write-Host 'WINDOWS_SERVING_INSTALL_ROOT=UNTOUCHED'
          Write-Host 'WINDOWS_TUN_MUTATIONS=0'

  initial_acceptance_verdict:
    name: Pre-cleanup physical 10/10 and reboot acceptance gate
    needs: [authorize, execute, initial_vm_attest, initial_windows_attest, initial_pair_publish, initial_vm_runtime, initial_windows_consume, initial_line2_external, initial_reboot, initial_windows_post_reboot]
    if: always() && needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every native host, credential and external endpoint proof
        shell: bash
        env:
          VM_INSTALL_JOB: ${{ needs.execute.result }}
          VM_LOCAL_JOB: ${{ needs.initial_vm_runtime.result }}
          WINDOWS_CANDIDATE_JOB: ${{ needs.initial_windows_consume.result }}
          VM_ATTEST_JOB: ${{ needs.initial_vm_attest.result }}
          WINDOWS_ATTEST_JOB: ${{ needs.initial_windows_attest.result }}
          PAIRED_WORKERS_JOB: ${{ needs.initial_pair_publish.result }}
          PRE_REBOOT_LINE2_JOB: ${{ needs.initial_line2_external.result }}
          POST_REBOOT_LINE1_JOB: ${{ needs.initial_windows_post_reboot.result }}
          REBOOT_AND_POST_LINE2_JOB: ${{ needs.initial_reboot.result }}
        run: |
          set -euo pipefail
          for field in VM_INSTALL_JOB VM_LOCAL_JOB WINDOWS_CANDIDATE_JOB VM_ATTEST_JOB WINDOWS_ATTEST_JOB PAIRED_WORKERS_JOB PRE_REBOOT_LINE2_JOB POST_REBOOT_LINE1_JOB REBOOT_AND_POST_LINE2_JOB; do
            if [[ "${!field}" != "success" ]]; then
              echo "::error title=N1/N2 acceptance failed::${field}=${!field}"
              exit 1
            fi
          done
          echo 'N1_N2_EXTERNAL_LINE1_4_OF_4=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'N1_N2_EXTERNAL_LINE2_6_OF_6=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'N1_N2_POST_REBOOT_EXTERNAL_4_6=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'N1_N2_PRE_CLEANUP_TRAFFIC=PASS' >> "${GITHUB_STEP_SUMMARY}"


# One bounded disposable cleanup after the physical verdict, on BOTH PASS
  # and FAIL. Reuse the exact existing native application-cleanup owner; no
  # generic shell executor, foreign environment or alternate provider writer.
  # Only a positively ACKed exact CREATE can authorize auto-disposal.
  # Unknown CREATE ACK must stop at read-only reconciliation, never blindly
  # compensate a potentially foreign resource or replay the provider mutation.
  # A cleanup failure remains DIAGNOSTIC_REQUIRED, never a fake PASS.
  initial_windows_cleanup:
    name: Destroy only this run's isolated Windows acceptance tree
    needs: [authorize, initial_preflight, initial_windows_isolate, initial_acceptance_verdict]
    if: >-
      always() &&
      needs.authorize.outputs.operation == 'initial-vm-install' &&
      needs.initial_windows_isolate.result != 'skipped'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    timeout-minutes: 10
    permissions: {}
    env:
      RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
    steps:
      - name: Refuse unknown scope; remove only exact owned acceptance root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = 'C:\sing-box-acceptance'
          if (-not (Test-Path -LiteralPath $root)) {
            Write-Host 'WINDOWS_ISOLATED_CLEANUP=ALREADY_ABSENT'
            exit 0
          }
          $item = Get-Item -LiteralPath $root -Force
          if (-not $item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'Windows acceptance cleanup refuses foreign or symlinked root'
          }
          $sentinel = Join-Path $root '.first-use-run'
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) {
            throw 'Windows acceptance cleanup refuses root lacking durable run sentinel'
          }
          $expected = "${env:GITHUB_RUN_ID}|${env:RELEASE_SET}"
          if ([IO.File]::ReadAllText($sentinel) -cne $expected) {
            throw 'Windows acceptance cleanup refuses unknown owner or ReleaseSet'
          }
          if (Get-ChildItem -LiteralPath $root -Recurse -Force |
              Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) {
            throw 'Windows acceptance cleanup refuses link to foreign project state'
          }
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
          if (Test-Path -LiteralPath $root) {
            throw 'Windows acceptance root cleanup unconfirmed, no blind retry'
          }
          Write-Host 'WINDOWS_ISOLATED_OWNED_CLEANUP=PASS'
          Write-Host 'WINDOWS_SERVING_INSTALL_ROOT=UNTOUCHED'

  initial_cleanup:
    name: Dispose exact first-use VM and prove zero-leak provider state
    needs: [authorize, execute, initial_acceptance_verdict]
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.operation == 'initial-vm-install' &&
      needs.execute.result != 'skipped' &&
      needs.execute.outputs.first_use_create_confirmed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    concurrency:
      group: vultr-control-plane-production
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Resolve exact immutable tested cleanup binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ACCEPTED_REVISION}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_TAG}" = "edge-release-${EDGE_RELEASE_SET_SHA256}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          chmod 0755 "${owner}"
          printf 'EDGE_APPLICATION_ORCHESTRATOR=%s\n' "${owner}" >> "${GITHUB_ENV}"
          printf 'EDGE_RELEASE_CONTEXT_PATH=%s\n' "${OUTPUT_DIR}/resolved.env" >> "${GITHUB_ENV}"

      - name: Validate exact disposable scope before any provider cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er '.environment' infra/application/disposable-acceptance.json)" = "application-acceptance"
          test "$(jq -er '.machine_id' infra/application/disposable-acceptance.json)" = "application-acceptance-1"
          test "$(jq -er '.record_name' infra/cloudflare/application-acceptance-dns.json)" = "stage2-acceptance.alegria.by"
          test "$(jq -er '.environment' infra/vultr/application-acceptance-vpc.json)" = "application-acceptance"
          test "$(jq -er '.machine_id' infra/vultr/application-acceptance-vpc.json)" = "application-acceptance-1"
          if grep -F -n 'miu.alegria.by' \
              infra/application/disposable-acceptance.json \
              infra/cloudflare/application-acceptance-dns.json \
              infra/cloudflare/application-acceptance-mesh.json \
              infra/vultr/application-acceptance-vpc.json; then
            echo 'first-use cleanup must not reference production hostname' >&2
            exit 1
          fi

      - name: Execute existing typed cleanup once and retain certificate
        shell: bash
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/initial-disposable-cleanup.json"
          set +e
          "${EDGE_APPLICATION_ORCHESTRATOR}" application-cleanup \
            infra/application/disposable-acceptance.json \
            infra/cloudflare/application-acceptance-dns.json \
            infra/cloudflare/application-acceptance-mesh.json \
            infra/vultr/application-acceptance-vpc.json \
            > "${result}"
          rc="$?"
          set -e
          if [[ -s "${result}" ]]; then
            {
              echo '### First-use disposable cleanup certificate'
              echo '~~~json'
              cat "${result}"
              echo '~~~'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          test "${rc}" -eq 0
          jq -e '.outcome == "PASS" and .zero_leaked_resources == "PASS" and .terminal_stage == "complete"' "${result}" >/dev/null
          echo 'N1_N2_DISPOSABLE_ZERO_LEAK_CLEANUP=PASS' >> "${GITHUB_STEP_SUMMARY}"

# Single authorized provider reboot after *both* isolated consumers have
  # validated their initial candidates. Reuse native boot-ID change proof and
  # native VM read-only candidate observation. Never repeat a lost reboot ACK.
  initial_reboot:
    name: One provider reboot and read-only credential recovery proof
    needs: [authorize, initial_preflight, initial_vm_runtime, initial_windows_consume, initial_line2_external]
    if: needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    environment:
      name: production-vultr
      deployment: false
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Prove changed guest boot ID and post-reboot six authenticated VM-local proxies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/edge-platform-release
          RELEASE_SET: ${{ needs.initial_preflight.outputs.release_set }}
          GENERATION: ${{ needs.initial_preflight.outputs.generation }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          VM_PUBLIC_IPV4: ${{ needs.initial_line2_external.outputs.vm_ipv4 }}
          VM_PROVIDER_ID: ${{ needs.initial_line2_external.outputs.provider_id }}
          VM_TLS_DOMAIN: ${{ needs.initial_line2_external.outputs.tls_domain }}
          VM_PROXY_USERNAME: ${{ needs.initial_line2_external.outputs.username }}
          VM_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_ID }}
          VM_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_VM_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${ACCEPTED_REVISION}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${ACCEPTED_REVISION}"
          bash edge-platform/scripts/resolve_durable_release.sh
          source "${OUTPUT_DIR}/resolved.env"
          test "${EDGE_ACCEPTED_REVISION}" = "${GITHUB_SHA}"
          test "${EDGE_RELEASE_SET_SHA256}" = "${RELEASE_SET}"
          owner="${OUTPUT_DIR}/edge-orchestrator-linux-amd64"
          agent="${OUTPUT_DIR}/edge-agent-linux-amd64"
          test "$(sha256sum "${owner}" | awk '{print $1}')" = "${EDGE_ORCHESTRATOR_SHA256}"
          test "$(sha256sum "${agent}" | awk '{print $1}')" = "${EDGE_AGENT_SHA256}"
          chmod 0755 "${owner}"
          export EDGE_RELEASE_CONTEXT_PATH="${OUTPUT_DIR}/resolved.env"
          umask 077
          history="${RUNNER_TEMP}/initial-history.json"
          exact="${RUNNER_TEMP}/exact-initial-begin.txt"
          gh api --paginate "repos/${REPOSITORY}/issues/26/comments?per_page=100" | jq -s 'add' > "${history}"
          jq -er --arg marker '<!-- sing-box-credential-initial-attempt/v1 -->' \
            '[.[]|.body|select(startswith($marker))] | if length == 1 then .[0] else error("not exactly one first-use BEGIN") end' \
            "${history}" > "${exact}"
          python3 - "${exact}" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          p.write_bytes(p.read_bytes().removesuffix(b"\n"))
          PY
          "${owner}" credentials initial-pair-journal-readback "${history}" "${exact}" > "${RUNNER_TEMP}/readback.txt"
          grep -Fxq 'credential_initial_journal_exact_begin=true' "${RUNNER_TEMP}/readback.txt"

          key="${RUNNER_TEMP}/singbox-vultr-ops"
          printf '%s\n' "${VULTR_SSH_PRIVATE_KEY}" > "${key}"
          test -s "${key}"
          chmod 0600 "${key}"
          export EDGE_SSH_PRIVATE_KEY_PATH="${key}"
          export EDGE_CONTROLLER_IPV4="$(curl -4 --fail --silent --show-error --connect-timeout 10 --max-time 20 https://api.ipify.org)"
          "${owner}" vultr-lifecycle lease-acquire infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/lease.json"
          jq -e '.status == "READY" and .lease_phase == "READY"' "${RUNNER_TEMP}/lease.json" >/dev/null
          trap '"${owner}" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 >/dev/null 2>&1 || true' EXIT

          "${owner}" vultr-lifecycle action-plan infra/vultr/application-acceptance.json application-acceptance-1 reboot > "${RUNNER_TEMP}/reboot-plan.json"
          authority="$(jq -er '.plan_authority.authority_digest' "${RUNNER_TEMP}/reboot-plan.json")"
          [[ "${authority}" =~ ^[0-9a-f]{64}$ ]]
          # One authorized provider reboot. On missing acknowledgement, stop.
          "${owner}" vultr-lifecycle action infra/vultr/application-acceptance.json application-acceptance-1 reboot "${authority}" > "${RUNNER_TEMP}/reboot.json"
          jq -e '.mutations_performed == 1 and .reboot_observation.boot_id_changed == true and
                 (.reboot_observation.boot_id_before != .reboot_observation.boot_id_after)' \
            "${RUNNER_TEMP}/reboot.json" >/dev/null
          if ! "${owner}" vultr-lifecycle substrate-verify infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/reboot-substrate.json"; then
            cat "${RUNNER_TEMP}/reboot-substrate.json" >&2
            exit 1
          fi
          jq -e '.status == "PASS" and .plan.action == "NOOP"' "${RUNNER_TEMP}/reboot-substrate.json" >/dev/null

          # Must be a separate READ-ONLY RPC; the first-use apply is never
          # repeated after reboot, even if candidate runtime did not recover.
          "${owner}" vultr-lifecycle initial-runtime-verify \
            infra/vultr/application-acceptance.json application-acceptance-1 \
            "${GENERATION}" "${RELEASE_SET}" "${GITHUB_RUN_ID}" "${history}" "${exact}" "${agent}" > "${RUNNER_TEMP}/reboot-runtime.json"
          jq -e '.operation == "INITIAL_VM_RUNTIME_VERIFY" and .status == "PASS" and
                 .candidate_materialized == true and .candidate_unpromoted == true and
                 (.vm_local_line2 | length) == 6 and
                 all(.vm_local_line2[]; .successful_samples == 5 and .failed_samples == 0 and .negative_auth_rejected == true) and
                 .external_line1_4_of_4 == "UNPROVEN" and .external_line2_6_of_6 == "UNPROVEN"' \
            "${RUNNER_TEMP}/reboot-runtime.json" >/dev/null
          "${owner}" vultr-lifecycle lease-release infra/vultr/application-acceptance.json application-acceptance-1 > "${RUNNER_TEMP}/lease-release.json"
          jq -e '.status == "RELEASED"' "${RUNNER_TEMP}/lease-release.json" >/dev/null
          trap - EXIT
          echo 'N1_N2_POST_REBOOT_GUEST_BOOT_ID=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'N1_N2_POST_REBOOT_VM_LOCAL_LINE2=PASS' >> "${GITHUB_STEP_SUMMARY}"
          # Independent PUBLIC endpoint test after the guest boot ID change.
          # Validate the same provider and IP again instead of trusting stale
          # pre-reboot address metadata or a VM-local loopback result.
          "${owner}" vultr-lifecycle inventory infra/vultr/application-acceptance.json > "${RUNNER_TEMP}/reboot-inventory.json"
          jq -e --arg id "${VM_PROVIDER_ID}" --arg ip "${VM_PUBLIC_IPV4}" '
            [.inventory.resources[]|select(.provider_id==$id)] |
            length==1 and .[0].main_ip==$ip
          ' "${RUNNER_TEMP}/reboot-inventory.json" >/dev/null
          identity="${RUNNER_TEMP}/post-reboot-vm-worker-access.env"
          test -n "${VM_ACCESS_CLIENT_ID}"
          test -n "${VM_ACCESS_CLIENT_SECRET}"
          umask 077
          printf 'CF_ACCESS_CLIENT_ID=%s\nCF_ACCESS_CLIENT_SECRET=%s\n' \
            "${VM_ACCESS_CLIENT_ID}" "${VM_ACCESS_CLIENT_SECRET}" > "${identity}"
          trap 'rm -f "${identity}"' EXIT
          "${owner}" credentials initial-line2-external-witness \
            "${GENERATION}" "${VM_PUBLIC_IPV4}" "${VM_TLS_DOMAIN}" "${VM_PROXY_USERNAME}" "${identity}" \
            > "${RUNNER_TEMP}/line2-reboot-external.txt"
          grep -Fxq 'line2_external_6_of_6=PASS' "${RUNNER_TEMP}/line2-reboot-external.txt"
          grep -Fxq 'line2_direct_warp_egress_distinct=true' "${RUNNER_TEMP}/line2-reboot-external.txt"
          test "$(grep -c '^line2_external_endpoint=' "${RUNNER_TEMP}/line2-reboot-external.txt")" -eq 6
          echo 'N2_POST_REBOOT_EXTERNAL_LINE2_6_OF_6=PASS' >> "${GITHUB_STEP_SUMMARY}"

  initial_acceptance_final:
    name: Final N1/N2 physical result after exact scoped cleanup
    needs: [authorize, execute, initial_acceptance_verdict, initial_windows_cleanup, initial_cleanup]
    if: always() && needs.authorize.outputs.operation == 'initial-vm-install'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require accepted 10/10 traffic, Windows cleanup and safe VM ownership
        shell: bash
        env:
          TRAFFIC: ${{ needs.initial_acceptance_verdict.result }}
          WINDOWS_CLEANUP: ${{ needs.initial_windows_cleanup.result }}
          VM_CLEANUP: ${{ needs.initial_cleanup.result }}
          FIRST_USE_CREATE_CONFIRMED: ${{ needs.execute.outputs.first_use_create_confirmed }}
        run: |
          set -euo pipefail
          if [[ "${TRAFFIC}" != "success" || "${WINDOWS_CLEANUP}" != "success" ]]; then
            echo "::error title=N1/N2 NOT_ACCEPTED::Transport or isolated Windows cleanup failed"
            exit 1
          fi
          if [[ "${FIRST_USE_CREATE_CONFIRMED}" == "true" ]]; then
            if [[ "${VM_CLEANUP}" != "success" ]]; then
              echo "::error title=N1/N2 NOT_ACCEPTED::New disposable VM cleanup failed"
              exit 1
            fi
            echo 'N1_N2_OWNED_NEW_VM_ZERO_LEAK=PASS' >> "${GITHUB_STEP_SUMMARY}"
          else
            if [[ "${FIRST_USE_CREATE_CONFIRMED}" != "false" || "${VM_CLEANUP}" != "skipped" ]]; then
              echo "::error title=N1/N2 NOT_ACCEPTED::Unknown VM creation/cleanup state"
              exit 1
            fi
            echo 'N1_N2_REUSED_OWNED_VM=PRESERVED_NOT_DISPOSED' >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo 'N1_N2_ISOLATED_WINDOWS_CLEANUP=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'N1_N2_EXTERNAL_PRE_AND_POST_REBOOT_4_PLUS_6=PASS' >> "${GITHUB_STEP_SUMMARY}"
          echo 'N1_N2_PHYSICAL_ACCEPTANCE=PASS' >> "${GITHUB_STEP_SUMMARY}"

