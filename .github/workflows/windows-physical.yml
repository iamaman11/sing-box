name: Windows Physical Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Authorize Windows lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      accepted_revision: ${{ steps.auth.outputs.accepted_revision }}
      operation: ${{ steps.auth.outputs.operation }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      expected_mode: ${{ steps.mode.outputs.expected_mode }}
    steps:
      - name: Authorize fixed command on protected main
        id: auth
        shell: bash
        env:
          COMMAND_BODY: ${{ inputs.command_body }}
          CONTROL_SHA: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          case "$COMMAND_BODY" in
            "/windows diagnose") operation="diagnose" ;;
            "/windows quality-line1") operation="quality-line1" ;;
            "/windows converge"|"/windows smoke") operation="converge" ;;
            "/windows start") operation="start" ;;
            "/windows stop") operation="stop" ;;
            "/windows restart-controller") operation="restart-controller" ;;
            "/windows repair") operation="repair" ;;
            "/windows rollback") operation="rollback" ;;
            *) exit 2 ;;
          esac
          test "$CONTROL_REF" = "refs/heads/main"
          test "$CONTROL_PROTECTED" = "true"
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'accepted_revision=%s\n' "$CONTROL_SHA" >> "$GITHUB_OUTPUT"
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout exact accepted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.auth.outputs.accepted_revision }}
          persist-credentials: false
          clean: true

      - name: Resolve expected Windows datapath mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -Ec '^windows_datapath_mode: WINDOWS_DATAPATH_MODE_(PROXY_ONLY|MANAGED_TUN)$' infra/production/production.textproto)"
          test "$count" -eq 1
          if grep -Fxq 'windows_datapath_mode: WINDOWS_DATAPATH_MODE_PROXY_ONLY' infra/production/production.textproto; then
            expected_mode='ProxyOnly'
          elif grep -Fxq 'windows_datapath_mode: WINDOWS_DATAPATH_MODE_MANAGED_TUN' infra/production/production.textproto; then
            expected_mode='ManagedTun'
          else
            echo 'Unsupported Windows datapath mode' >&2
            exit 1
          fi
          printf 'expected_mode=%s\n' "$expected_mode" >> "$GITHUB_OUTPUT"

      - name: Resolve exact durable ReleaseSet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ steps.auth.outputs.accepted_revision }}
          OUTPUT_DIR: ${{ runner.temp }}/windows-release-authority
        run: |
          set -euo pipefail
          edge-platform/scripts/resolve_durable_release.sh
          . "${OUTPUT_DIR}/resolved.env"
          printf 'release_set_sha256=%s\n' "$EDGE_RELEASE_SET_SHA256" >> "$GITHUB_OUTPUT"

  physical:
    name: Windows / ${{ needs.resolve.outputs.operation }}
    needs: resolve
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 20
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:45151
      EDGE_ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.resolve.outputs.release_set_sha256 }}
      EDGE_OPERATION: ${{ needs.resolve.outputs.operation }}
      EDGE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
    steps:
      - name: Assert isolated root and observe pre-state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_INSTALL_ROOT -cne 'C:\sing-box') { throw 'Unexpected install root' }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          if ($workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Runner workspace overlaps managed install root'
          }
          $stableDiagnostic = Join-Path $root 'bin\edge-diagnostic.exe'
          if (-not (Test-Path -LiteralPath $stableDiagnostic -PathType Leaf)) { throw 'Installed stable diagnostic is missing' }
          $current = Join-Path $root 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact active release files'
          }

          $stoppedOwnerRecovery = $false
          $cleanStoppedBootstrap = $false
          $runningLegacyDiagnosticRecovery = $false
          $legacyManagedPid = ''
          if ($bootstrapExit -ne 0) {
            $boundedStoppedOwner = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1
            )
            $boundedCleanStopped = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['exact_release_files'] -ceq 'PASS' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 0 -and
              [string]$bootstrapValues['managed_tun_present'] -ceq 'false'
            )
            # Only the installed known broken diagnostic may use this one-time
            # upgrade path. SCM parent match is not sufficient as authority.
            $legacyCandidates = @(
              $bootstrapDoctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $boundedRunningLegacy = (
              $env:EDGE_OPERATION -eq 'converge' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun' -and
              [string]$bootstrapValues['release_set_sha256'] -ceq '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -and
              [string]$env:EDGE_RELEASE_SET_SHA256 -cne [string]$bootstrapValues['release_set_sha256'] -and
              [string]$bootstrapValues['windows_datapath_mode'] -ceq 'ManagedTun' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Running' -and
              [string]$bootstrapValues['scm_process_id'] -match '^\d+$' -and
              [string]$bootstrapValues['scm_executable_matches_release'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_present'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_pid'] -ceq [string]$bootstrapValues['scm_process_id'] -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['orphan_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1 -and
              $legacyCandidates.Count -eq 1 -and
              ($legacyCandidates[0].Split(':')[1]) -ceq [string]$bootstrapValues['scm_process_id']
            )
            if ($boundedRunningLegacy) {
              # The installed old doctor returns before network observations.
              # Prove TUN from read-only OS state, not a missing doctor field.
              $adapters = @(Get-NetAdapter -Name 'sing-box-tun' -ErrorAction Stop)
              if ($adapters.Count -ne 1 -or [string]$adapters[0].Status -cne 'Up') {
                throw 'Legacy managed TUN adapter is not uniquely Up'
              }
              $tunIf = [int]$adapters[0].ifIndex
              $ips = @(Get-NetIPAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                Where-Object { $_.IPAddress -ceq '172.19.0.1' -and $_.PrefixLength -eq 30 })
              if ($ips.Count -ne 1) { throw 'Legacy managed TUN exact IPv4 address is absent' }
              $tunDns = @(Get-DnsClientServerAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses)
              if ($tunDns -notcontains '172.19.0.2') {
                throw 'Legacy managed TUN DNS is not on the canonical interface'
              }
              Write-Host 'legacy_managed_tun_os_readonly=PASS'
            }
            if (-not $boundedStoppedOwner -and -not $boundedCleanStopped -and -not $boundedRunningLegacy) {
              throw "Stable pre-state diagnostic failed: $bootstrapExit"
            }

            $stableConsole = Join-Path $root 'bin\edge-console.exe'
            if (-not (Test-Path -LiteralPath $stableConsole -PathType Leaf)) {
              throw 'Installed stable console is missing for bounded recovery evidence'
            }
            $recoveryEvidence = @(& $stableConsole privileged-runtime-evidence --install-root $root)
            $recoveryEvidenceExit = $LASTEXITCODE
            $recoveryEvidence | Write-Host
            if ($recoveryEvidenceExit -ne 0) {
              throw "Bounded privileged evidence failed: $recoveryEvidenceExit"
            }
            $recoveryDetail = [string]($recoveryEvidence |
              Where-Object { [string]$_ -like 'detail=*' } |
              Select-Object -Last 1)
            if ([string]::IsNullOrWhiteSpace($recoveryDetail) -or
                $recoveryDetail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
              throw 'Bounded recovery did not return the privileged evidence contract'
            }
            if ($recoveryDetail -notmatch 'external_owner_evidence=INCOMPLETE;external_count=0(?:;|$)') {
              throw 'Bounded recovery still observes privileged external sing-box ownership'
            }

            if ($boundedRunningLegacy) {
              $parts = $legacyCandidates[0].Split(':')
              $owner = [regex]::Escape([string]$bootstrapValues['scm_process_id'])
              $child = [regex]::Escape([string]$parts[0])
              if ($recoveryDetail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                  $recoveryDetail -notmatch ';external_count=0(?:;|$)' -or
                  $recoveryDetail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
                throw 'Old diagnostic disagreement lacks exact SYSTEM managed-owner proof'
              }
              $legacyManagedPid = [string]$parts[0]
              $runningLegacyDiagnosticRecovery = $true
              Write-Host 'running_legacy_diagnostic=PRIVILEGED_EXACT_PROOF'
            } elseif ($boundedStoppedOwner) {
              $stoppedOwnerRecovery = $true
              "EDGE_STOPPED_OWNER_RECOVERY=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Recovering stopped SCM owner only after privileged evidence proved zero external sing-box owners'
            } else {
              $cleanStoppedBootstrap = $true
              "EDGE_CLEAN_STOPPED_BOOTSTRAP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Bootstrapping Release A from the already-proven clean stopped ManagedTun state'
            }
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ($doctorExit -ne 0 -and -not $stoppedOwnerRecovery -and -not $cleanStoppedBootstrap -and -not $runningLegacyDiagnosticRecovery) {
            throw "Exact pre-state diagnostic failed: $doctorExit"
          }
          if ($stoppedOwnerRecovery) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1) {
              throw 'Stopped-owner recovery evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'stopped_owner_recovery_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CONFLICT'
            }
          }
          if ($cleanStoppedBootstrap) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['managed_tun_present'] -cne 'false') {
              throw 'Clean stopped bootstrap evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'clean_stopped_bootstrap_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CLEAN_STATE'
            }
          }
          if ($runningLegacyDiagnosticRecovery) {
            $exactCandidates = @(
              $doctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $expectedPair = ([string]$legacyManagedPid) + ':' + ([string]$values['scm_process_id'])
            if ([string]$values['release_set_sha256'] -cne '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_executable_matches_release'] -cne 'true' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1 -or
                $exactCandidates.Count -ne 1 -or
                $exactCandidates[0] -cne $expectedPair -or
                [string]$values['scm_process_id'] -cne [string]$bootstrapValues['scm_process_id']) {
              throw 'Legacy active runtime changed after bounded SYSTEM owner proof'
            }
            $LASTEXITCODE = 0
            Write-Host 'running_legacy_diagnostic_exit=NORMALIZED_AFTER_PRIVILEGED_EXACT_PROOF'
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') {
            throw 'Exact active diagnostic could not verify its ReleaseSet files'
          }
          $currentRelease = [string]$values['release_set_sha256']
          if ($env:EDGE_OPERATION -eq 'repair' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Repair target must equal the exact current ReleaseSet before runtime stop'
          }
          if ($env:EDGE_OPERATION -eq 'quality-line1' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Line1 quality requires the exact accepted installed ReleaseSet; never probe an older binary'
          }
          $currentMode = [string]$values['windows_datapath_mode']
          $currentTun = if ($runningLegacyDiagnosticRecovery) { 'true' } else { [string]$values['managed_tun_present'] }
          # The exact currently installed release still calls the retired
          # DNS-reset heuristic and ignores process termination confirmation
          # on shutdown. The newer published ReleaseSet cannot protect a
          # handoff executed by the OLD console/controller.
          # Never initiate this release's destructive handoff over the same
          # TUN-dependent GitHub transport. A supervised local-admin physical
          # transition needs separate acceptance; diagnose remains read-only.
          if ($currentRelease -ceq '1ebe355143ac3d59a11d4c40755e1f8aa2aa9060c957822d831f18d4ace667b5' -and
              $currentMode -ceq 'ManagedTun' -and
              $env:EDGE_OPERATION -in @('converge','repair','restart-controller','start')) {
            throw 'PRE_MUTATION_LEGACY_DNS_WRITER_BLOCKED: installed ReleaseSet contains unsafe shutdown DNS reset and unconfirmed sing-box termination; physical local-admin recovery gate is not accepted'
          }
          # Stage 4B.2-C: NO teardown before independent foreign CloudflareWARP DNS
          # recovery and an independent control-channel restore have been proven.
          # This is deliberately before 'Execute typed lifecycle mutation'.
          if ($env:EDGE_OPERATION -in @('stop','rollback')) {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: stop/rollback requires independently proven CloudflareWARP DNS and control-channel restoration'
          }
          if ($currentMode -ceq 'ManagedTun' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ProxyOnly' -and
              $env:EDGE_OPERATION -in @('converge','repair')) {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: ManagedTun to ProxyOnly requires independent DNS/control-channel recovery'
          }
          switch ($currentMode) {
            'ProxyOnly' {
              if ($currentTun -cne 'false') { throw 'ProxyOnly state unexpectedly owns managed TUN' }
            }
            'ManagedTun' {
              if ($currentTun -cne 'true') {
                if ($env:EDGE_OPERATION -in @('diagnose','quality-line1')) {
                  throw 'ManagedTun state is missing managed TUN'
                }
                Write-Warning 'Recovering a partial ManagedTun activation with no managed TUN present'
                "EDGE_BEFORE_PARTIAL_MANAGED_TUN=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              }
            }
            default { throw "Unsupported installed Windows datapath mode: $currentMode" }
          }
          if ($env:EDGE_OPERATION -in @('diagnose','quality-line1') -and $currentMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Installed datapath mode $currentMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          "EDGE_BEFORE_MODE=$currentMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Immutable console path is unavailable'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($stoppedOwnerRecovery) {
            if ($externalPids.Count -ne 1) {
              throw "Stopped-owner recovery expected one unprivileged ambiguous sing-box, observed $($externalPids.Count)"
            }
            $signature = ''
          } else {
            if ($externalPids.Count -ne 0) {
              throw "Stage 4B.2-C requires zero external sing-box owners; observed $($externalPids.Count)"
            }
            $signature = $externalPids -join ','
          }
          $managedBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($runningLegacyDiagnosticRecovery) { $managedBefore = @($legacyManagedPid) }
          $unknownBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownBefore.Count -gt 0) {
            if ($unknownBefore.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_process_id'] -notmatch '^\d+$') {
              throw 'Pre-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $privileged = @(& $console privileged-runtime-evidence --install-root $root)
            if ($LASTEXITCODE -ne 0) { throw 'Pre-state privileged runtime identity evidence unavailable' }
            $detail = [string]($privileged | Where-Object { [string]$_ -like 'detail=*' } | Select-Object -Last 1)
            $owner = [regex]::Escape([string]$values['scm_process_id'])
            $child = [regex]::Escape([string]$unknownBefore[0])
            if ($detail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY;' -or
                $detail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detail -notmatch ';external_count=0(?:;|$)' -or
                $detail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
              throw 'Pre-state UNKNOWN sing-box is not confirmed by exact privileged owner evidence'
            }
            $managedBefore = @($unknownBefore[0])
            Write-Host 'prestate_managed_owner=PRIVILEGED_EXACT_PROOF'
          }
          "EDGE_BEFORE_CONTROLLER_PID=$([string]$values['scm_process_id'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_MANAGED_PID=$($managedBefore -join ',')" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'start' -and $managedBefore.Count -eq 1) {
            "EDGE_START_NOOP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]$values['scm_state'] -cne 'Running' -or
                $managedBefore.Count -ne 1 -or
                [string]$values['managed_tun_present'] -cne 'true') {
              throw 'restart-controller requires healthy Running ManagedTun pre-state'
            }
          }
          if ($env:EDGE_OPERATION -in @('repair','rollback')) {
            $previous = Join-Path $root 'previous.pb'
            $previousDoctor = @(& $diagnostic doctor $previous)
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed: $LASTEXITCODE" }
            $previousValues = @{}
            foreach ($line in $previousDoctor) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousValues['exact_release_files'] -cne 'PASS') {
              throw 'Previous ReleaseSet exact files are not verified'
            }
            "EDGE_BEFORE_PREVIOUS_RELEASE=$([string]$previousValues['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_EXTERNAL_PIDS_BEFORE=$signature" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $doctor | Write-Host

      - name: Execute typed lifecycle mutation
        id: lifecycle_mutation
        if: ${{ needs.resolve.outputs.operation != 'diagnose' && needs.resolve.outputs.operation != 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:EDGE_OPERATION) {
            'converge' {
              & $env:EDGE_CURRENT_CONSOLE privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            }
            'start' {
              if ($env:EDGE_START_NOOP -ceq 'YES') {
                Write-Host 'runtime_start=NOOP_ALREADY_RUNNING'
                $LASTEXITCODE = 0
              } else {
                & $env:EDGE_CURRENT_CONSOLE start-local $env:EDGE_CONTROLLER_ENDPOINT
              }
            }
            'stop' {
              & $env:EDGE_CURRENT_CONSOLE stop-local $env:EDGE_CONTROLLER_ENDPOINT
            }
            'restart-controller' {
              & $env:EDGE_CURRENT_CONSOLE privileged-restart-controller-service --install-root $env:EDGE_INSTALL_ROOT
            }
            'repair' {
              & $env:EDGE_CURRENT_CONSOLE privileged-reinstall-accepted $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            }
            'rollback' {
              & $env:EDGE_CURRENT_CONSOLE privileged-rollback-previous --install-root $env:EDGE_INSTALL_ROOT
            }
            default { throw "Unsupported operation: $env:EDGE_OPERATION" }
          }
          if ($LASTEXITCODE -ne 0) { throw "Lifecycle mutation failed: $LASTEXITCODE" }

      - name: Verify exact authority and SCM handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stableDiagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          if ($bootstrapExit -ne 0) { throw "Stable post-state diagnostic failed: $bootstrapExit" }
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact post-state release files'
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable post-state diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          if ($doctorExit -ne 0) { throw "Exact post-state diagnostic failed: $doctorExit" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') { throw 'Exact release files are not verified' }
          $afterMode = [string]$values['windows_datapath_mode']
          $afterTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $afterMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Active datapath mode $afterMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          switch ($afterMode) {
            'ProxyOnly' {
              if ($afterTun -cne 'false') { throw 'ProxyOnly state unexpectedly owns managed TUN' }
            }
            'ManagedTun' {
              if ($env:EDGE_OPERATION -eq 'stop') {
                if ($afterTun -cne 'false') { throw 'Managed TUN remained present after explicit runtime stop' }
              } else {
                if ($afterTun -cne 'true') { throw 'ManagedTun state is missing managed TUN' }
                if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') {
                  throw "Unexpected managed TUN IPv4: $($values['managed_tun_ipv4'])"
                }
                if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') {
                  throw "Unexpected managed TUN DNS IPv4: $($values['managed_tun_dns_ipv4'])"
                }
              }
            }
            default { throw "Unsupported active Windows datapath mode: $afterMode" }
          }
          if (($env:EDGE_OPERATION -in @('converge','repair') -or $env:EDGE_OPERATION -eq 'quality-line1') -and [string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Accepted ReleaseSet is not active'
          }
          if ($env:EDGE_OPERATION -in @('start','stop','restart-controller') -and [string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_RELEASE) {
            throw 'Transient runtime control changed ReleaseSet authority'
          }
          if ($env:EDGE_OPERATION -eq 'rollback') {
            if ([string]$values['release_set_sha256'] -ceq $env:EDGE_BEFORE_RELEASE) {
              throw 'Rollback did not change ReleaseSet authority'
            }
            if ([string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Rollback did not activate the exact previous ReleaseSet observed before mutation'
            }
          }
          if ($env:EDGE_OPERATION -eq 'repair') {
            $previousAfter = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'previous.pb'))
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed after repair: $LASTEXITCODE" }
            $previousAfterValues = @{}
            foreach ($line in $previousAfter) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousAfterValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousAfterValues['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Repair changed previous ReleaseSet authority'
            }
          }
          $managedAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $afterControllerPid = [string]$values['scm_process_id']
          $unknownAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownAfter.Count -gt 0) {
            if ($unknownAfter.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0) {
              throw 'Post-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $managedAfter = @($unknownAfter[0])
            Write-Host 'poststate_process_identity=UNKNOWN_AWAIT_PRIVILEGED_EVIDENCE'
          }
          $afterManagedPid = $managedAfter -join ','
          "EDGE_AFTER_CONTROLLER_PID=$afterControllerPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MANAGED_PID=$afterManagedPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_CONTROLLER_PID) -or
                $env:EDGE_BEFORE_CONTROLLER_PID -ceq 'ABSENT' -or
                $afterControllerPid -ceq $env:EDGE_BEFORE_CONTROLLER_PID) {
              throw 'SCM restart did not replace controller PID'
            }
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_MANAGED_PID) -or
                $afterManagedPid -ceq $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'SCM restart did not replace the exact managed child'
            }
          }
          if ($env:EDGE_OPERATION -eq 'start' -and $env:EDGE_START_NOOP -ceq 'YES') {
            if ($afterControllerPid -cne $env:EDGE_BEFORE_CONTROLLER_PID -or
                $afterManagedPid -cne $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'Idempotent start caused controller or managed-child PID churn'
            }
            Write-Host 'runtime_start_noop_identity=PASS'
          }
          $console = [string]$values['console_path']
          $controller = [string]$values['controller_path']
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MODE=$afterMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ([string]$values['scm_service_name'] -cne 'EdgePlatformController') { throw 'SCM controller is missing' }
          if ([string]$values['scm_account'] -cne 'NT SERVICE\EdgePlatformController') { throw 'Unexpected SCM identity' }
          if ([string]$values['scm_state'] -cne 'Running') { throw 'SCM controller is not running' }
          if ([string]$values['scm_start_type'] -cne 'AutoStart') { throw 'SCM controller is not automatic' }
          if ([string]$values['scm_executable_matches_release'] -cne 'true') { throw 'SCM binary does not match the active release' }
          $authority = ([Uri]$env:EDGE_CONTROLLER_ENDPOINT).Authority
          $expected = "$controller windows-service $env:EDGE_INSTALL_ROOT $authority"
          if ([string]$values['scm_executable_path'] -cne $expected) { throw 'SCM executable authority mismatch' }

      - name: Measure native Line1 named-outbound quality without changing routing
        if: ${{ needs.resolve.outputs.operation == 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_EXPECTED_MODE -cne 'ManagedTun' -or $env:EDGE_BEFORE_MODE -cne 'ManagedTun') {
            throw 'Line1 quality requires healthy accepted ManagedTun'
          }
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $before = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality pre-measurement owner evidence unavailable' }
          $routeBefore = @($before | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          if ($routeBefore.Count -eq 0) { throw 'Native quality route evidence is missing' }
          $warpDnsBefore = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedBefore = @($before | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmBefore = @($before | Where-Object { $_ -match '^scm_process_id=' })
          if ($managedBefore.Count -ne 1 -or $scmBefore.Count -ne 1) {
            throw 'Native quality requires exactly one independently observed SCM and sing-box process'
          }
          $result = @(& $env:EDGE_CURRENT_CONSOLE quality-line1)
          $qualityExit = $LASTEXITCODE
          $result | Write-Host
          $after = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality post-measurement owner evidence unavailable' }
          $routeAfter = @($after | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          $warpDnsAfter = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedAfter = @($after | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmAfter = @($after | Where-Object { $_ -match '^scm_process_id=' })
          if (($routeAfter -join "`n") -cne ($routeBefore -join "`n") -or
              ($managedAfter -join "`n") -cne ($managedBefore -join "`n") -or
              ($scmAfter -join "`n") -cne ($scmBefore -join "`n") -or
              ($warpDnsAfter -join ',') -cne ($warpDnsBefore -join ',')) {
            throw 'Line1 quality changed (or observed drift in) route, process owner or foreign WARP DNS evidence'
          }
          Write-Host 'native_line1_owner_route_dns_parity=PASS'
          if ($qualityExit -ne 0) { throw "Native Line1 quality reported unavailable HTTP samples: exit=$qualityExit" }

      - name: Prove managed DIRECT and WARP without runtime restart
        if: ${{ needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE verify-runtime
          if ($LASTEXITCODE -ne 0) { throw "Managed proxy verification failed: $LASTEXITCODE" }

      - name: Read-only privileged runtime evidence after restart
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceStrict = $true
          $evidenceConsole = $env:EDGE_CURRENT_CONSOLE
          if ([string]::IsNullOrWhiteSpace($evidenceConsole) -or
              -not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            $evidenceStrict = $false
            $evidenceConsole = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-console.exe'
          }
          if (-not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            Write-Warning 'Privileged runtime evidence console is unavailable after an earlier lifecycle failure'
            exit 0
          }

          $evidenceLines = @(& $evidenceConsole privileged-runtime-evidence --install-root $env:EDGE_INSTALL_ROOT)
          $evidenceExit = $LASTEXITCODE
          $evidenceLines | Write-Host
          if ($evidenceExit -ne 0) {
            if ($evidenceStrict) { throw "Privileged read-only runtime evidence failed: $evidenceExit" }
            Write-Warning "Privileged conflict evidence failed read-only: $evidenceExit"
            exit 0
          }

          $detailLine = [string]($evidenceLines |
            Where-Object { [string]$_ -like 'detail=*' } |
            Select-Object -Last 1)
          if ([string]::IsNullOrWhiteSpace($detailLine) -or
              $detailLine -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
            if ($evidenceStrict) { throw 'Privileged runtime evidence did not return the bounded typed detail contract' }
            Write-Warning 'Privileged conflict evidence did not return the bounded typed detail contract'
            exit 0
          }

          if ($evidenceStrict -and $detailLine -notmatch '(?:^|;)controller_service_error=ABSENT(?:;|$)') {
            throw 'Controller service retains current startup-failure evidence after successful lifecycle verification'
          }
          $modeAtEvidence = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MODE)) { $env:EDGE_BEFORE_MODE } else { $env:EDGE_AFTER_MODE }
          if ($evidenceStrict -and $modeAtEvidence -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop') {
            $expectedChild = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MANAGED_PID)) { $env:EDGE_BEFORE_MANAGED_PID } else { $env:EDGE_AFTER_MANAGED_PID }
            $expectedController = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_CONTROLLER_PID)) { $env:EDGE_BEFORE_CONTROLLER_PID } else { $env:EDGE_AFTER_CONTROLLER_PID }
            if ([string]::IsNullOrWhiteSpace($expectedChild) -or $expectedChild -notmatch '^\d+$' -or
                [string]::IsNullOrWhiteSpace($expectedController) -or $expectedController -notmatch '^\d+$') {
              throw 'Privileged managed process identity lacks an exact diagnostic PID candidate'
            }
            $child = [regex]::Escape($expectedChild)
            $owner = [regex]::Escape($expectedController)
            if ($detailLine -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detailLine -notmatch ';external_count=0(?:;|$)') {
              throw 'Privileged managed identity differs from the exact runner process observation'
            }
            "EDGE_PRIVILEGED_MANAGED_PID=$expectedChild" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            "EDGE_PRIVILEGED_CONTROLLER_PID=$expectedController" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            Write-Host 'managed_process_identity=PRIVILEGED_EXACT_PROOF'
          }
          if ($evidenceStrict -and $env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun') {
            if ($detailLine -match '(?:^|;)stderr=MISSING(?:;|$)') {
              throw 'Managed sing-box stderr evidence is missing after lifecycle verification'
            }
            if ($detailLine -notmatch '(?:^|;)stderr=') {
              throw 'Managed sing-box stderr evidence was omitted from the bounded privileged result'
            }
            if ($detailLine -match 'failed to search process:\s*Access is denied') {
              throw 'Managed sing-box process lookup still reports Access is denied after fresh restart'
            }
            Write-Host 'managed_tun_process_search_access_denied=ABSENT'
          }

      - name: Prove MANAGED_TUN ordinary Windows traffic DNS and foreign Mesh coexistence
        if: ${{ (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for managed TUN proof'
          }
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw "Managed TUN diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['managed_tun_present'] -cne 'true') { throw 'Managed TUN is absent' }
          $tunIndex = [uint32]$values['managed_tun_interface_index']
          if ($tunIndex -eq 0) { throw 'Managed TUN interface index is invalid' }
          if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') { throw 'Managed TUN IPv4 mismatch' }
          if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') { throw 'Managed TUN DNS mismatch' }
          $statusLines = @(& $env:EDGE_CURRENT_CONSOLE status $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Typed controller status failed: $LASTEXITCODE" }
          $serverIp = $null
          foreach ($line in $statusLines) {
            if ([string]$line -match '^Server IP\s+:\s+((?:\d{1,3}\.){3}\d{1,3})\s*$') {
              $serverIp = $Matches[1]
              break
            }
          }
          $parsedServerIp = [System.Net.IPAddress]::None
          if ([string]::IsNullOrWhiteSpace($serverIp) -or
              -not [System.Net.IPAddress]::TryParse($serverIp, [ref]$parsedServerIp) -or
              $parsedServerIp.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) {
            throw "Typed controller status did not expose a valid production server IPv4: $serverIp"
          }
          $serverRoute = Find-NetRoute -RemoteIPAddress $serverIp |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $serverRoute) { throw "No Windows best route exists for production server $serverIp" }
          if ([uint32]$serverRoute.InterfaceIndex -eq $tunIndex) {
            throw "Production server $serverIp is captured by managed TUN"
          }
          $serverAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$serverRoute.InterfaceIndex) -ErrorAction Stop

          $dns = Resolve-DnsName 'www.gstatic.com' -Type A -DnsOnly -ErrorAction Stop |
            Where-Object { $_.IPAddress } |
            Select-Object -First 1
          if (-not $dns -or [string]::IsNullOrWhiteSpace([string]$dns.IPAddress)) {
            throw 'Ordinary Windows DNS did not return an IPv4 address'
          }
          $route = Find-NetRoute -RemoteIPAddress ([string]$dns.IPAddress) |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $route -or [uint32]$route.InterfaceIndex -ne $tunIndex) {
            throw 'Ordinary Internet destination does not select managed TUN'
          }

          $http = (& curl.exe --noproxy '*' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $http -cne '204') {
            throw "Ordinary no-proxy Windows HTTPS failed through managed TUN: exit=$LASTEXITCODE http=$http"
          }

          $localHttp = (& curl.exe --proxy 'http://127.0.0.1:17891' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $localHttp -cne '204') {
            throw "Canonical local proxy failed with managed TUN: exit=$LASTEXITCODE http=$localHttp"
          }

          $meshRoute = Find-NetRoute -RemoteIPAddress '100.96.0.2' |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $meshRoute) { throw 'Foreign Mesh/device route is absent' }
          $meshAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$meshRoute.InterfaceIndex) -ErrorAction Stop
          if ([string]$meshAdapter.Name -cne 'CloudflareWARP') {
            throw "Foreign Mesh/device route escaped CloudflareWARP: $($meshAdapter.Name)"
          }
          if ([uint32]$meshRoute.InterfaceIndex -eq $tunIndex) {
            throw 'Managed TUN captured the foreign Mesh/device route'
          }

          $warpAdapter = Get-NetAdapter -Name 'CloudflareWARP' -ErrorAction Stop
          if ([string]$warpAdapter.Status -cne 'Up') {
            throw "Foreign CloudflareWARP adapter is not Up: $($warpAdapter.Status)"
          }
          $warpDns = @(
            Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
              ForEach-Object ServerAddresses
          )
          if ($warpDns -contains '172.31.255.2') {
            throw "Foreign CloudflareWARP still carries retired legacy TUN DNS 172.31.255.2: $($warpDns -join ',')"
          }

          Write-Host "managed_tun_server_bypass_ip=$serverIp"
          Write-Host "managed_tun_server_bypass_owner=$($serverAdapter.Name)"
          Write-Host 'managed_tun_server_bypass=PASS'
          Write-Host 'managed_tun_ordinary_dns=PASS'
          Write-Host 'managed_tun_ordinary_https=PASS'
          Write-Host 'managed_tun_local_proxy=PASS'
          Write-Host 'foreign_mesh_route_owner=CloudflareWARP'
          Write-Host "foreign_cloudflarewarp_dns=$($warpDns -join ',')"
          Write-Host "foreign_cloudflarewarp_tun_dns_repin=$($warpDns -contains '172.19.0.2')"

      - name: Refuse unproven automatic rollback after MANAGED_TUN verification failure
        if: ${{ failure() && steps.lifecycle_mutation.outcome == 'success' && (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'managed_tun_automatic_rollback=BLOCKED_NO_INDEPENDENT_DNS_RESTORE'
          throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: automatic rollback cannot prove CloudflareWARP DNS/control-channel recovery; preserve current runtime for independent diagnostics'

      - name: Final diagnostics and transport-only boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for final verification'
          }
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Final diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $unknownFinal = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $finalManagedCount = [int]$values['managed_singbox_process_count']
          if ($unknownFinal.Count -gt 0) {
            if ($unknownFinal.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                $finalManagedCount -ne 0 -or [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$env:EDGE_PRIVILEGED_MANAGED_PID -cne [string]$unknownFinal[0] -or
                [string]$env:EDGE_PRIVILEGED_CONTROLLER_PID -cne [string]$values['scm_process_id']) {
              throw 'Final process identity is UNKNOWN without exact matching privileged evidence'
            }
            $finalManagedCount = 1
          }
          if ($env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $finalManagedCount -ne 1) {
            throw "Expected one managed proxy process after $env:EDGE_OPERATION, observed $finalManagedCount"
          }
          if ($env:EDGE_OPERATION -eq 'stop' -and ($finalManagedCount -ne 0 -or $unknownFinal.Count -ne 0)) {
            throw "Expected zero managed proxy processes after stop, observed $($values['managed_singbox_process_count'])"
          }
          $finalMode = [string]$values['windows_datapath_mode']
          $finalTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $finalMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Final datapath mode $finalMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          if ($finalMode -ceq 'ProxyOnly' -and $finalTun -cne 'false') { throw 'Final ProxyOnly state owns managed TUN' }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -eq 'stop' -and $finalTun -cne 'false') {
            throw 'Final explicit runtime stop left managed TUN present'
          }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop' -and $finalTun -cne 'true') {
            throw 'Final ManagedTun state is missing managed TUN'
          }
          if ($finalMode -notin @('ProxyOnly','ManagedTun')) { throw "Unsupported final datapath mode: $finalMode" }
          if ($env:EDGE_OPERATION -eq 'rollback' -and $finalMode -ceq 'ProxyOnly') {
            $warpDnsAfterTunRemoval = @(
              Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses
            )
            if ($warpDnsAfterTunRemoval -contains '172.19.0.2') {
              throw "Foreign CloudflareWARP still depends on removed managed TUN DNS after ProxyOnly rollback: $($warpDnsAfterTunRemoval -join ',')"
            }
            Write-Host "foreign_cloudflarewarp_dns_after_tun_removal=$($warpDnsAfterTunRemoval -join ',')"
            Write-Host 'foreign_cloudflarewarp_tun_dns_cleanup=PASS'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $signature = $externalPids -join ','
          if ($signature -cne $env:EDGE_EXTERNAL_PIDS_BEFORE) { throw 'External sing-box owner changed after verification' }
          foreach ($relative in @('state','runtime','logs')) {
            $path = Join-Path $env:EDGE_INSTALL_ROOT $relative
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries($path) | Out-Null } catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "Runner unexpectedly has direct private-state access: $relative" }
          }
          $doctor | Write-Host

      - name: Observe Cloudflare One effective client state (read-only)
        if: ${{ needs.resolve.outputs.operation == 'diagnose' }}
        shell: powershell
        run: |
          # Only observe an independently owned client. Never emit raw settings or
          # diagnostics: they can include private organization and network data.
          $ErrorActionPreference = 'Stop'
          $serviceState = 'UNKNOWN'
          $servicePid = 0
          try {
            $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='CloudflareWARP'" -ErrorAction Stop
            if ($null -ne $svc) {
              $serviceState = if ([string]$svc.State -ceq 'Running') { 'RUNNING' } else { 'NOT_RUNNING' }
              $servicePid = [int]$svc.ProcessId
            }
          } catch { $serviceState = 'UNKNOWN' }

          $listener = 'UNKNOWN'
          try {
            $dnsEndpoints = @(
              @(Get-NetUDPEndpoint -LocalPort 53 -ErrorAction Stop) +
              @(Get-NetTCPConnection -LocalPort 53 -State Listen -ErrorAction Stop)
            ) | Where-Object { $_.LocalAddress -in @('127.0.2.2','127.0.2.3') }
            $listener = if ($dnsEndpoints.Count -eq 0) { 'NOT_OBSERVED' }
                        elseif ($servicePid -gt 0 -and @($dnsEndpoints | Where-Object { [int]$_.OwningProcess -eq $servicePid }).Count -gt 0) { 'WARP_SERVICE_PROCESS' }
                        else { 'OTHER_OR_UNATTRIBUTED' }
          } catch { $listener = 'UNKNOWN' }

          # Only the installed vendor CLI at its exact standard path is allowed.
          # The child CLI is bounded; a timed-out child is closed, not warp-svc.
          $warpCli = Join-Path $env:ProgramFiles 'Cloudflare\Cloudflare WARP\warp-cli.exe'
          function Read-CloudflareClient([string]$verb) {
            if (-not (Test-Path -LiteralPath $warpCli -PathType Leaf)) {
              return @{ outcome = 'CLI_NOT_FOUND'; value = '' }
            }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $warpCli
            $psi.Arguments = $verb
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $child = New-Object System.Diagnostics.Process
            $child.StartInfo = $psi
            try {
              if (-not $child.Start()) { return @{ outcome = 'START_FAILED'; value = '' } }
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(10000)) {
                try { $child.Kill(); $child.WaitForExit(2000) | Out-Null } catch {}
                return @{ outcome = 'CLI_TIMEOUT'; value = '' }
              }
              if ($child.ExitCode -ne 0) { return @{ outcome = 'CLI_ERROR'; value = '' } }
              $value = $stdout.GetAwaiter().GetResult()
              if ($value.Length -gt 65536) { return @{ outcome = 'OVERSIZE'; value = '' } }
              return @{ outcome = 'OK'; value = $value }
            } catch {
              return @{ outcome = 'CLI_UNAVAILABLE'; value = '' }
            } finally { $child.Dispose() }
          }

          $status = Read-CloudflareClient 'status'
          $settings = Read-CloudflareClient 'settings'
          $connectivity = 'UNKNOWN'
          if ($status.outcome -ceq 'OK') {
            if ($status.value -match '\bConnected\b') { $connectivity = 'CONNECTED' }
            elseif ($status.value -match '\bDisconnected\b') { $connectivity = 'DISCONNECTED' }
          }
          $mode = 'UNKNOWN'
          $split = 'UNKNOWN'
          $profileHash = 'UNKNOWN'
          $splitHash = 'UNKNOWN'
          $fallback = 'UNKNOWN'
          $meshSplitExact = 'UNKNOWN'
          if ($settings.outcome -ceq 'OK') {
            $modeMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Mode:\s*(WarpWithDnsOverHttps|TunnelOnly|DnsOverHttps|WarpProxy|PostureOnly)\b')
            if ($modeMatch.Success) { $mode = $modeMatch.Groups[1].Value }
            $profileMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Profile ID:\s*([0-9a-fA-F-]{36})(?:\s|$)')
            if ($profileMatch.Success) {
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $profileHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($profileMatch.Groups[1].Value.ToLowerInvariant()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
            }
            $splitMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?(Exclude|Include) mode, with hosts/ips:')
            if ($splitMatch.Success) {
              $split = $splitMatch.Groups[1].Value.ToUpperInvariant()
              $section = $settings.value.Substring($splitMatch.Index + $splitMatch.Length)
              $nextField = [regex]::Match($section, '(?m)^\s*\([^)\r\n]+\)\s+\S[^:\r\n]*:')
              if ($nextField.Success) { $section = $section.Substring(0, $nextField.Index) }
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $splitHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($section.Trim()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
              $meshSplitExact = if ($section -match '(?m)^\s*100\.96\.0\.0/12(?:\s|$)') { 'YES' } else { 'NO' }
            }
            $fallback = if ($settings.value -match '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Fallback domains:') { 'PRESENT' } else { 'NOT_LISTED' }
          }
          # No registry NameServer or local listener proves a DNS writer or failover.
          Write-Host "cloudflare_one_service=$serviceState"
          Write-Host "cloudflare_one_local_dns_listener=$listener"
          Write-Host "cloudflare_one_cli_status=$($status.outcome)"
          Write-Host "cloudflare_one_connectivity=$connectivity"
          Write-Host "cloudflare_one_cli_settings=$($settings.outcome)"
          Write-Host "cloudflare_one_effective_mode=$mode"
          Write-Host "cloudflare_one_profile_id_sha256=$profileHash"
          Write-Host "cloudflare_one_split_tunnel_mode=$split"
          Write-Host "cloudflare_one_split_entries_sha256=$splitHash"
          Write-Host "cloudflare_one_split_mesh_cidr_exact=$meshSplitExact"
          Write-Host "cloudflare_one_local_domain_fallback=$fallback"
          Write-Host 'cloudflare_one_dns_writer=UNKNOWN'
          Write-Host 'cloudflare_one_no_tun_recovery=UNPROVEN'

      - name: Publish bounded lifecycle evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          @(
            "### Windows $env:EDGE_AFTER_MODE lifecycle",
            '- Operation: ${{ needs.resolve.outputs.operation }}',
            "- Before ReleaseSet: $env:EDGE_BEFORE_RELEASE",
            "- After ReleaseSet: $env:EDGE_AFTER_RELEASE",
            '- Local Windows build: NO',
            '- External sing-box mutation: FORBIDDEN / equality-checked',
            "- Expected mode: $env:EDGE_EXPECTED_MODE",
            "- Before mode: $env:EDGE_BEFORE_MODE",
            "- After mode: $env:EDGE_AFTER_MODE",
            "- TUN requested by desired state: $($env:EDGE_EXPECTED_MODE -ceq 'ManagedTun')",
            '- Foreign CloudflareWARP mutation: FORBIDDEN',
            '- External sing-box owner: FORBIDDEN / equality-checked'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
