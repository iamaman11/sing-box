name: Windows Physical Cycle

on:
  workflow_call:
    inputs:
      command_body:
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Authorize exact Windows smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      accepted_revision: ${{ steps.authorize.outputs.accepted_revision }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Authorize fixed command and current main
        id: authorize
        shell: bash
        env:
          COMMAND_BODY: ${{ inputs.command_body }}
          CONTROL_SHA: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$COMMAND_BODY" = "/windows smoke"
          test "$CONTROL_REF" = "refs/heads/main"
          test "$CONTROL_PROTECTED" = "true"
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'accepted_revision=%s\n' "$CONTROL_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact accepted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.authorize.outputs.accepted_revision }}
          persist-credentials: false
          clean: true

      - name: Resolve exact durable ReleaseSet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ steps.authorize.outputs.accepted_revision }}
          OUTPUT_DIR: ${{ runner.temp }}/windows-release-authority
        run: |
          set -euo pipefail
          edge-platform/scripts/resolve_durable_release.sh
          . "${OUTPUT_DIR}/resolved.env"
          printf 'release_set_sha256=%s\n' "$EDGE_RELEASE_SET_SHA256" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$EDGE_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish authorization summary
        shell: bash
        run: |
          {
            echo '### Windows physical smoke authority'
            echo '- Command: `/windows smoke`'
            echo '- Accepted main: `${{ steps.authorize.outputs.accepted_revision }}`'
            echo '- ReleaseSet: `${{ steps.release.outputs.release_set_sha256 }}`'
            echo '- Physical mode: **NON_TUN_LOOPBACK**'
            echo '- Legacy Windows runtime mutation: **FORBIDDEN**'
            echo '- Local build on Windows: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"

  physical:
    name: Install -> launch -> non-TUN smoke -> diagnose
    needs: resolve
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      EDGE_ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.resolve.outputs.release_set_sha256 }}
    steps:
      - name: Assert isolated physical execution root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_INSTALL_ROOT -cne 'C:\sing-box') {
            throw "Windows lab install root must be exactly C:\sing-box"
          }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $installRoot = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          if ($workspace.StartsWith($installRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'GitHub runner workspace must stay outside C:\sing-box'
          }
          foreach ($legacy in @(
            'C:\Users\Bose\temp\sing-box',
            'C:\Users\Bose\AppData\Local\sing-box-vultr-dual',
            'C:\Users\Bose\AppData\Local\edge-platform-win-target'
          )) {
            if ($installRoot.StartsWith([IO.Path]::GetFullPath($legacy), [StringComparison]::OrdinalIgnoreCase)) {
              throw "New install root overlaps legacy runtime: $legacy"
            }
          }
          $client = [System.Net.Sockets.TcpClient]::new()
          try {
            $connect = $client.ConnectAsync('127.0.0.1', 51051)
            if ($connect.Wait(300) -and $client.Connected) {
              throw 'Isolated controller endpoint 127.0.0.1:51051 is already occupied'
            }
          } finally {
            $client.Dispose()
          }
          if (-not (Test-Path -LiteralPath $installRoot -PathType Container)) {
            throw 'C:\sing-box trust anchor is not bootstrapped'
          }
          Write-Host 'WINDOWS_ISOLATION_PRECONDITION=PASS'

      - name: Resolve current immutable console
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Initial activation doctor failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Current activation did not provide an immutable console path'
          }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Converge exact accepted ReleaseSet through privileged dispatcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Privileged exact-release activation failed: $LASTEXITCODE" }
      - name: Verify exact activation independently
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Independent activation doctor failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['release_set_sha256'] -ne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Active Windows ReleaseSet does not match accepted authority'
          }
          if ([string]$values['exact_release_files'] -ne 'PASS') {
            throw 'Independent diagnostic did not prove exact release files'
          }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Verified activation did not provide current immutable console path'
          }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV

      - name: Start isolated NOT_CONFIGURED controller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $console = $env:EDGE_CURRENT_CONSOLE
          & $console ensure-controller $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw "Isolated controller startup failed: $LASTEXITCODE" }

          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Exact controller-path diagnostic failed: $LASTEXITCODE" }
          if ($doctor -notcontains 'controller_running=true') {
            throw 'The exact controller from current.pb is not running'
          }

          & $console status $env:EDGE_CONTROLLER_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw "Isolated controller status failed: $LASTEXITCODE" }

      - name: Run exact non-TUN loopback proxy smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $console = $env:EDGE_CURRENT_CONSOLE
          & $console smoke-runtime
          if ($LASTEXITCODE -ne 0) { throw "Non-TUN smoke failed: $LASTEXITCODE" }

      - name: Verify exact activation after runtime smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          & $diagnostic doctor $current
          if ($LASTEXITCODE -ne 0) { throw "Post-smoke activation doctor failed: $LASTEXITCODE" }

      - name: Publish bounded physical evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          @(
            '### Windows physical non-TUN cycle',
            '- Install root: `C:\sing-box`',
            '- Accepted main: `${{ needs.resolve.outputs.accepted_revision }}`',
            '- ReleaseSet: `${{ needs.resolve.outputs.release_set_sha256 }}`',
            '- Local Windows build: **NO**',
            '- TUN requested: **NO**',
            '- DNS/route/system-proxy mutation requested: **NO**',
            '- Legacy runtime mutation requested: **NO**',
            '- Next action: **STOP_FOR_ANALYSIS**'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
