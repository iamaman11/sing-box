name: Windows Physical Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        required: true
        type: string

permissions: {}

jobs:
  resolve:
    name: Authorize Windows lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      accepted_revision: ${{ steps.auth.outputs.accepted_revision }}
      operation: ${{ steps.auth.outputs.operation }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      windows_artifact_sha256: ${{ steps.release.outputs.windows_artifact_sha256 }}
      windows_diagnostic_sha256: ${{ steps.release.outputs.windows_diagnostic_sha256 }}
    steps:
      - name: Authorize fixed command on protected main
        id: auth
        shell: bash
        env:
          COMMAND_BODY: ${{ inputs.command_body }}
          CONTROL_SHA: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          case "$COMMAND_BODY" in
            "/windows diagnose") operation="diagnose" ;;
            "/windows converge"|"/windows smoke") operation="converge" ;;
            "/windows repair") operation="repair" ;;
            "/windows rollback") operation="rollback" ;;
            *) exit 2 ;;
          esac
          test "$CONTROL_REF" = "refs/heads/main"
          test "$CONTROL_PROTECTED" = "true"
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'accepted_revision=%s\n' "$CONTROL_SHA" >> "$GITHUB_OUTPUT"
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"

      - name: Checkout exact accepted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.auth.outputs.accepted_revision }}
          persist-credentials: false
          clean: true

      - name: Enforce PROXY_ONLY gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'windows_datapath_mode: WINDOWS_DATAPATH_MODE_PROXY_ONLY' infra/production/production.textproto
          ! grep -Fq 'windows_datapath_mode: WINDOWS_DATAPATH_MODE_MANAGED_TUN' infra/production/production.textproto

      - name: Resolve exact durable ReleaseSet
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ steps.auth.outputs.accepted_revision }}
          OUTPUT_DIR: ${{ runner.temp }}/windows-release-authority
        run: |
          set -euo pipefail
          edge-platform/scripts/resolve_durable_release.sh
          . "${OUTPUT_DIR}/resolved.env"
          printf 'release_set_sha256=%s\n' "$EDGE_RELEASE_SET_SHA256" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$EDGE_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'windows_artifact_sha256=%s\n' "$EDGE_WINDOWS_ARTIFACT_SHA256" >> "$GITHUB_OUTPUT"
          printf 'windows_diagnostic_sha256=%s\n' "$EDGE_WINDOWS_DIAGNOSTIC_SHA256" >> "$GITHUB_OUTPUT"

  physical:
    name: Windows / ${{ needs.resolve.outputs.operation }}
    needs: resolve
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 20
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:51051
      EDGE_ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.resolve.outputs.release_set_sha256 }}
      EDGE_RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      EDGE_WINDOWS_ARTIFACT_SHA256: ${{ needs.resolve.outputs.windows_artifact_sha256 }}
      EDGE_WINDOWS_DIAGNOSTIC_SHA256: ${{ needs.resolve.outputs.windows_diagnostic_sha256 }}
      EDGE_REPOSITORY: ${{ github.repository }}
      EDGE_OPERATION: ${{ needs.resolve.outputs.operation }}
    steps:
      - name: Assert isolated root and observe pre-state
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_INSTALL_ROOT -cne 'C:\sing-box') { throw 'Unexpected install root' }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          if ($workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Runner workspace overlaps managed install root'
          }
          $diagnostic = Join-Path $root 'bin\edge-diagnostic.exe'
          if ($env:EDGE_OPERATION -in @('converge','repair')) {
            if ($env:EDGE_RELEASE_TAG -notmatch '^edge-release-[0-9a-f]{64}$') { throw 'Target durable release tag is invalid' }
            if ($env:EDGE_WINDOWS_ARTIFACT_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Target Windows artifact digest is invalid' }
            if ($env:EDGE_WINDOWS_DIAGNOSTIC_SHA256 -notmatch '^[0-9a-f]{64}$') { throw 'Target Windows diagnostic digest is invalid' }
            $targetRoot = Join-Path $env:RUNNER_TEMP ('edge-target-diagnostic-' + $env:EDGE_RELEASE_SET_SHA256)
            $archive = Join-Path $targetRoot 'edge-platform-windows.zip'
            if (Test-Path -LiteralPath $targetRoot) { Remove-Item -LiteralPath $targetRoot -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $targetRoot | Out-Null
            $url = 'https://github.com/' + $env:EDGE_REPOSITORY + '/releases/download/' + $env:EDGE_RELEASE_TAG + '/edge-platform-windows.zip'
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $archive
            $artifactSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($artifactSha -cne $env:EDGE_WINDOWS_ARTIFACT_SHA256) { throw 'Target Windows artifact digest mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath $targetRoot -Force
            $diagnostic = Join-Path $targetRoot 'bin\edge-diagnostic.exe'
            if (-not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) { throw 'Target diagnostic is missing from exact Windows artifact' }
            $diagnosticSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $diagnostic).Hash.ToLowerInvariant()
            if ($diagnosticSha -cne $env:EDGE_WINDOWS_DIAGNOSTIC_SHA256) { throw 'Target Windows diagnostic digest mismatch' }
          }
          $current = Join-Path $root 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Pre-state diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['windows_datapath_mode'] -cne 'ProxyOnly') { throw 'Lifecycle requires ProxyOnly' }
          if ([string]$values['managed_tun_present'] -cne 'false') { throw 'Managed TUN already present' }
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Immutable console path is unavailable'
          }
          if ($env:EDGE_OPERATION -ne 'diagnose') {
            & $console stop-local $env:EDGE_CONTROLLER_ENDPOINT
            if ($LASTEXITCODE -ne 0) { throw "Failed to stop exact managed proxy before lifecycle mutation: $LASTEXITCODE" }
            $doctor = @(& $diagnostic doctor $current)
            if ($LASTEXITCODE -ne 0) { throw "Post-stop diagnostic failed: $LASTEXITCODE" }
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($env:EDGE_OPERATION -ne 'diagnose' -and $externalPids.Count -gt 1) {
            throw "Expected at most one preserved external sing-box owner after stopping the managed proxy; observed $($externalPids.Count)"
          }
          $signature = $externalPids -join ','
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_EXTERNAL_PIDS_BEFORE=$signature" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $doctor | Write-Host

      - name: Execute typed lifecycle mutation
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:EDGE_OPERATION) {
            'converge' {
              & $env:EDGE_CURRENT_CONSOLE privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            }
            'repair' {
              & $env:EDGE_CURRENT_CONSOLE privileged-reinstall-accepted $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            }
            'rollback' {
              & $env:EDGE_CURRENT_CONSOLE privileged-rollback-previous --install-root $env:EDGE_INSTALL_ROOT
            }
            default { throw "Unsupported operation: $env:EDGE_OPERATION" }
          }
          if ($LASTEXITCODE -ne 0) { throw "Lifecycle mutation failed: $LASTEXITCODE" }

      - name: Verify exact authority and SCM handoff
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Post-state diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') { throw 'Exact release files are not verified' }
          if ([string]$values['windows_datapath_mode'] -cne 'ProxyOnly') { throw 'Datapath escaped ProxyOnly' }
          if ([string]$values['managed_tun_present'] -cne 'false') { throw 'Managed TUN appeared' }
          if ($env:EDGE_OPERATION -in @('converge','repair') -and [string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Accepted ReleaseSet is not active'
          }
          if ($env:EDGE_OPERATION -eq 'rollback' -and [string]$values['release_set_sha256'] -ceq $env:EDGE_BEFORE_RELEASE) {
            throw 'Rollback did not change ReleaseSet authority'
          }
          $console = [string]$values['console_path']
          $controller = [string]$values['controller_path']
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $service = Get-CimInstance Win32_Service -Filter "Name='EdgePlatformController'"
          if (-not $service) { throw 'SCM controller is missing' }
          if ([string]$service.StartName -cne 'NT SERVICE\EdgePlatformController') { throw 'Unexpected SCM identity' }
          if ([string]$service.State -cne 'Running') { throw 'SCM controller is not running' }
          if ([string]$service.StartMode -cne 'Auto') { throw 'SCM controller is not automatic' }
          $authority = ([Uri]$env:EDGE_CONTROLLER_ENDPOINT).Authority
          $expected = "$controller windows-service $env:EDGE_INSTALL_ROOT $authority"
          if ([string]$service.PathName -cne $expected) { throw 'SCM executable authority mismatch' }
          $doctor | Write-Host

      - name: Read-only privileged external-owner evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE privileged-runtime-evidence --install-root $env:EDGE_INSTALL_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Privileged read-only runtime evidence failed: $LASTEXITCODE" }

      - name: Prove managed PROXY_ONLY DIRECT and WARP
        if: ${{ needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE restart-verify-runtime
          if ($LASTEXITCODE -ne 0) { throw "Managed proxy verification failed: $LASTEXITCODE" }

      - name: Final diagnostics and transport-only boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw "Final diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ($env:EDGE_OPERATION -in @('converge','repair') -and [int]$values['managed_singbox_process_count'] -ne 1) {
            throw "Expected one managed proxy process after $env:EDGE_OPERATION, observed $($values['managed_singbox_process_count'])"
          }
          if ([string]$values['managed_tun_present'] -cne 'false') { throw 'Managed TUN appeared' }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $signature = $externalPids -join ','
          if ($signature -cne $env:EDGE_EXTERNAL_PIDS_BEFORE) { throw 'External sing-box owner changed after verification' }
          foreach ($relative in @('state','runtime','logs')) {
            $path = Join-Path $env:EDGE_INSTALL_ROOT $relative
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries($path) | Out-Null } catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "Runner unexpectedly has direct private-state access: $relative" }
          }
          $doctor | Write-Host

      - name: Publish bounded lifecycle evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          @(
            '### Windows PROXY_ONLY lifecycle',
            '- Operation: ${{ needs.resolve.outputs.operation }}',
            "- Before ReleaseSet: $env:EDGE_BEFORE_RELEASE",
            "- After ReleaseSet: $env:EDGE_AFTER_RELEASE",
            '- Local Windows build: NO',
            '- External sing-box mutation: FORBIDDEN / equality-checked',
            '- TUN requested: NO',
            '- DNS/route/system-proxy mutation requested: NO'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
