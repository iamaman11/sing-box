name: Windows Physical Lifecycle

on:
  workflow_call:
    inputs:
      command_body:
        required: true
        type: string
      host_machine_id:
        required: false
        type: string
        default: sing-box-windows-lab
      host_runner_label:
        required: false
        type: string
        default: sing-box-windows-lab
      host_runner_name:
        required: false
        type: string
        default: DESKTOP-0E1F6UQ

permissions: {}

jobs:
  resolve:
    name: Authorize Windows lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      accepted_revision: ${{ steps.auth.outputs.accepted_revision }}
      operation: ${{ steps.auth.outputs.operation }}
      readonly_purpose: ${{ steps.auth.outputs.readonly_purpose }}
      source_run_id: ${{ steps.auth.outputs.source_run_id }}
      source_release_sha256: ${{ steps.auth.outputs.source_release_sha256 }}
      premarker_authorized: ${{ steps.source.outputs.premarker_authorized }}
      release_set_sha256: ${{ steps.release.outputs.release_set_sha256 }}
      expected_mode: ${{ steps.mode.outputs.expected_mode }}
      initial_generation: ${{ steps.initial_begin.outputs.generation }}
      initial_slot: ${{ steps.initial_begin.outputs.slot }}
    steps:
      - name: Authorize fixed command on protected main
        id: auth
        shell: bash
        env:
          COMMAND_BODY: ${{ inputs.command_body }}
          CONTROL_SHA: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          case "$COMMAND_BODY" in
            "/windows diagnose") operation="diagnose"; readonly_purpose="ordinary" ;;
            "/windows offline-preflight") operation="diagnose"; readonly_purpose="offline-preflight" ;;
            "/windows apply") operation="apply" ;;
            "/windows initial-pair-prepare "*|"/windows initial-pair-stage "*)
              if [[ "$COMMAND_BODY" == "/windows initial-pair-prepare "* ]]; then
                remainder="${COMMAND_BODY#/windows initial-pair-prepare }"
                operation="initial-pair-prepare"
              else
                remainder="${COMMAND_BODY#/windows initial-pair-stage }"
                operation="initial-pair-stage"
              fi
              if [[ "$remainder" =~ ^[1-9][0-9]{7,18}$ ]]; then
                source_run_id="$remainder"
              else
                echo 'Windows permanent first-use stage requires original GitHub run ID' >&2
                exit 2
              fi
              test "$GITHUB_RUN_ATTEMPT" = "1" || {
                echo 'first-use mutation replay forbidden, reconcile read-only' >&2
                exit 1
              }
              ;;
            "/windows quality-line1") operation="quality-line1" ;;
            "/windows converge") operation="converge" ;;
            "/windows start") operation="start" ;;
            "/windows stop") operation="stop" ;;
            "/windows restart-controller") operation="restart-controller" ;;
            "/windows repair") operation="repair" ;;
            "/windows rollback") operation="rollback" ;;
            "/windows acceptance-reconcile "*)
              remainder="${COMMAND_BODY#/windows acceptance-reconcile }"
              if [[ "$remainder" =~ ^([1-9][0-9]{7,18})[[:space:]]([0-9a-f]{64})$ ]]; then
                operation="acceptance-reconcile"
                source_run_id="${BASH_REMATCH[1]}"
                source_release_sha256="${BASH_REMATCH[2]}"
              else
                echo "Malformed exact aborted-run identity" >&2
                exit 2
              fi ;;
            *) exit 2 ;;
          esac
          test "$CONTROL_REF" = "refs/heads/main"
          test "$CONTROL_PROTECTED" = "true"
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'accepted_revision=%s\n' "$CONTROL_SHA" >> "$GITHUB_OUTPUT"
          printf 'operation=%s\n' "$operation" >> "$GITHUB_OUTPUT"
          printf 'readonly_purpose=%s\n' "${readonly_purpose:-none}" >> "$GITHUB_OUTPUT"
          printf 'source_run_id=%s\n' "${source_run_id:-}" >> "$GITHUB_OUTPUT"
          printf 'source_release_sha256=%s\n' "${source_release_sha256:-}" >> "$GITHUB_OUTPUT"

      - name: Require terminal failed initial attempt for an exact source run
        id: source
        if: steps.auth.outputs.operation == 'acceptance-reconcile'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.auth.outputs.source_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > "${RUNNER_TEMP}/first-use-source.json"
          jq -e --argjson id "$SOURCE_RUN_ID" '
            .id == $id and .event == "issue_comment" and .name == "/vultr initial-vm-install" and
            .path == ".github/workflows/edge-control-plane.yml" and
            .status == "completed" and (.conclusion | IN("failure", "cancelled", "skipped")) and
            .repository.id == 1221750822
          ' "${RUNNER_TEMP}/first-use-source.json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/1" > "${RUNNER_TEMP}/first-use-attempt.json"
          jq -e '.status == "completed" and (.conclusion | IN("failure", "cancelled"))' \
            "${RUNNER_TEMP}/first-use-attempt.json" >/dev/null
          # Only a failed materialization step of the exact first-use Windows
          # job may authorize empty, pre-sentinel root reconciliation.
          # A generic failed run cannot authorize removing an unmarked path.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/first-use-source-jobs.json"
          jq -e '
            [.jobs[] | select(
              .name == "vultr / Install separate exact Windows ProxyOnly acceptance consumer, no SCM" and
              .conclusion == "failure" and
              ([.steps[] | select(
                .name == "Materialize isolated release from accepted immutable ReleaseSet" and
                .conclusion == "failure"
              )] | length == 1)
            )] | length == 1
          ' "${RUNNER_TEMP}/first-use-source-jobs.json" >/dev/null &&
            echo 'premarker_authorized=true' >> "${GITHUB_OUTPUT}"
          echo "Aborted first-use source verified read-only: ${SOURCE_RUN_ID}"

      - name: Checkout exact accepted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.auth.outputs.accepted_revision }}
          persist-credentials: false
          clean: true

      - name: Resolve expected Windows datapath mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -Ec '^windows_datapath_mode: WINDOWS_DATAPATH_MODE_(PROXY_ONLY|MANAGED_TUN)$' infra/production/production.textproto)"
          test "$count" -eq 1
          if grep -Fxq 'windows_datapath_mode: WINDOWS_DATAPATH_MODE_PROXY_ONLY' infra/production/production.textproto; then
            expected_mode='ProxyOnly'
          elif grep -Fxq 'windows_datapath_mode: WINDOWS_DATAPATH_MODE_MANAGED_TUN' infra/production/production.textproto; then
            expected_mode='ManagedTun'
          else
            echo 'Unsupported Windows datapath mode' >&2
            exit 1
          fi
          printf 'expected_mode=%s\n' "$expected_mode" >> "$GITHUB_OUTPUT"

      # Read-only observation uses the installed verified binary; no release needed.
      - name: Resolve exact durable ReleaseSet for mutations and offline handoff
        id: release
        if: (steps.auth.outputs.operation != 'diagnose' && steps.auth.outputs.operation != 'quality-line1') || steps.auth.outputs.readonly_purpose == 'offline-preflight'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_REVISION: ${{ steps.auth.outputs.accepted_revision }}
          OUTPUT_DIR: ${{ runner.temp }}/windows-release-authority
        run: |
          set -euo pipefail
          edge-platform/scripts/resolve_durable_release.sh
          . "${OUTPUT_DIR}/resolved.env"
          printf 'release_set_sha256=%s\n' "$EDGE_RELEASE_SET_SHA256" >> "$GITHUB_OUTPUT"

      - name: Read exact original first-use BEGIN
        id: initial_begin
        if: steps.auth.outputs.operation == 'initial-pair-stage' || steps.auth.outputs.operation == 'initial-pair-prepare'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.auth.outputs.source_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'iamaman11/sing-box'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/original.json"
          jq -e --argjson source "$SOURCE_RUN" '
            .id==$source and .event=="issue_comment" and
            .name=="/vultr initial-vm-install" and .head_branch=="main" and
            .run_attempt==1 and .status=="completed" and .conclusion=="failure"
          ' "$RUNNER_TEMP/original.json" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" |
            jq -s 'add' > "$RUNNER_TEMP/original-history.json"
          jq -e --argjson source "$SOURCE_RUN" '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->"))] |
            if length==1 then .[0] else error("original BEGIN count is not one") end |
            split("\n") |
            if length==2 then .[1]|fromjson else error("malformed first-use BEGIN") end |
            .schema=="sing-box.credential-initial-attempt/v1" and
            .phase=="BEGIN" and .generation==$source and .github_run_id==$source and
            (.slot=="A" or .slot=="B") and
            (.release_set_sha256|test("^[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/original-history.json" >/dev/null
          jq -r '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->"))] |
            .[0]|split("\n")[1]|fromjson|
            "generation=\(.generation)\nslot=\(.slot)"
          ' "$RUNNER_TEMP/original-history.json" >> "$GITHUB_OUTPUT"

  reconcile_first_use:
    name: Windows / reconcile exact aborted first-use root
    needs: resolve
    if: needs.resolve.outputs.operation == 'acceptance-reconcile'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 15
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout exact protected main (script only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Reconcile only original run sentinel and remove exact owned tree
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          SOURCE_RELEASE_SHA256: ${{ needs.resolve.outputs.source_release_sha256 }}
          PREMARKER_AUTHORIZED: ${{ needs.resolve.outputs.premarker_authorized }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\reconcile-windows-first-use.ps1'
          if ($env:PREMARKER_AUTHORIZED -ceq 'true') {
            & $script -SourceRunId $env:SOURCE_RUN_ID -ReleaseSetSha256 $env:SOURCE_RELEASE_SHA256 -RemoveOwned -RecoverEmptyPreMarker
          } else {
            & $script -SourceRunId $env:SOURCE_RUN_ID -ReleaseSetSha256 $env:SOURCE_RELEASE_SHA256 -RemoveOwned
          }
          if (-not $?) { throw 'Windows first-use reconciliation did not finish' }


  apply_existing_active:
    name: Windows / stopped ACTIVE program-only apply
    needs: resolve
    if: needs.resolve.outputs.operation == 'apply'
    runs-on: [self-hosted, Windows, X64, "${{ inputs.host_runner_label }}"]
    timeout-minutes: 18
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify registry-selected Windows apply owner
        shell: pwsh
        env:
          TARGET_MACHINE_ID: ${{ inputs.host_machine_id }}
          TARGET_RUNNER_NAME: ${{ inputs.host_runner_name }}
          TARGET_RUNNER_LABEL: ${{ inputs.host_runner_label }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -cne $env:TARGET_RUNNER_NAME -or
              $env:TARGET_MACHINE_ID -notmatch '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Observe existing ACTIVE and plan exact stopped release-only change
        id: active_preflight
        shell: pwsh
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_WINDOWS_APPLY_POLICY: EXISTING_ACTIVE_RELEASE_ONLY
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          $observed = @(& $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -ExistingActive -Preflight)
          if (-not $?) { throw 'WINDOWS_APPLY_BLOCKED: native SYSTEM ACTIVE preflight failed' }
          $from = @($observed | Where-Object { [string]$_ -cmatch '^windows_offline_source_release=[0-9a-f]{64}$' })
          $needed = @($observed | Where-Object { [string]$_ -cmatch '^windows_offline_transition_needed=(True|False)$' })
          if ($from.Count -ne 1 -or $needed.Count -ne 1 -or
              @($observed | Where-Object { [string]$_ -ceq 'windows_credential_policy=EXISTING_ACTIVE_RELEASE_ONLY' }).Count -ne 1) {
            throw 'WINDOWS_APPLY_BLOCKED: ambiguous status/plan result'
          }
          $source = ([string]$from[0]).Split('=',2)[1]
          $upgrade = ([string]$needed[0]).Split('=',2)[1] -ceq 'True'
          "source_release=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "needs_upgrade=$($upgrade.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $upgrade) { Write-Host 'windows_apply=NOOP_CURRENT_RELEASE_ACTIVE_UNCHANGED' }
      - name: Record immutable release-only BEGIN once before SYSTEM mutation
        if: steps.active_preflight.outputs.needs_upgrade == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE: ${{ steps.active_preflight.outputs.source_release }}
          TARGET_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          TARGET_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:SOURCE_RELEASE -notmatch '^[0-9a-f]{64}$' -or
              $env:TARGET_RELEASE -notmatch '^[0-9a-f]{64}$' -or
              $env:SOURCE_RELEASE -ceq $env:TARGET_RELEASE) {
            throw 'WINDOWS_APPLY_BLOCKED: exact first-attempt source and target required'
          }
          $reader = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\read-complete-gh-journal.ps1'
          $history = @(& $reader)
          $marker = '<!-- sing-box-windows-active-release-apply/v1 -->'
          foreach ($prior in @($history | Where-Object { [string]$_.body -like "*$marker*" })) {
            $body = [string]$prior.body
            if (-not $body.StartsWith("$marker`n")) { throw 'WINDOWS_APPLY_BLOCKED: malformed earlier intent' }
            $record = ConvertFrom-Json -InputObject $body.Substring($marker.Length + 1)
            if ([string]$record.schema -cne 'sing-box.windows-active-release-apply/v1') {
              throw 'WINDOWS_APPLY_BLOCKED: mismatched intent schema'
            }
            if ([string]$record.source_release_set_sha256 -ceq $env:SOURCE_RELEASE -or
                [string]$record.target_release_set_sha256 -ceq $env:TARGET_RELEASE) {
              throw 'WINDOWS_APPLY_BLOCKED: prior unresolved source or target attempt; read-only reconcile'
            }
          }
          $record = [ordered]@{
            schema = 'sing-box.windows-active-release-apply/v1'
            phase = 'BEGIN'
            github_run_id = [long]$env:GITHUB_RUN_ID
            source_release_set_sha256 = $env:SOURCE_RELEASE
            target_release_set_sha256 = $env:TARGET_RELEASE
            target_revision = $env:TARGET_REVISION
            mutation_scope = 'PROGRAM_ONLY_EXISTING_ACTIVE'
          }
          $body = $marker + "`n" + ($record | ConvertTo-Json -Compress)
          & gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$body" > $null
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPLY_UNKNOWN: journal write uncertain; no replay' }
          $readback = @(& $reader)
          if (@($readback | Where-Object { [string]$_.body -ceq $body }).Count -ne 1) {
            throw 'WINDOWS_APPLY_UNKNOWN: exact once-only intent not confirmed; no replay'
          }
          Write-Host 'windows_release_only_intent=COMMITTED_ONCE'
      - name: Single native SYSTEM offline release apply and bounded readback
        if: steps.active_preflight.outputs.needs_upgrade == 'true'
        shell: pwsh
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_WINDOWS_APPLY_POLICY: EXISTING_ACTIVE_RELEASE_ONLY
          SOURCE_RELEASE: ${{ steps.active_preflight.outputs.source_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -ExistingActive -ExpectedSourceReleaseSet $env:SOURCE_RELEASE
          if (-not $?) { throw 'WINDOWS_APPLY_UNKNOWN: native result uncertain; do not replay' }
          Write-Host 'windows_apply=PASS_STOPPED_PROGRAM_ONLY'
          Write-Host 'credential_origin=UNPROVEN_NOT_CREDENTIAL_MUTATION_AUTHORITY'

  initial_first_use_prepare:
    name: Windows / exactly stopped immutable upgrade BEFORE first-use BEGIN
    needs: resolve
    if: needs.resolve.outputs.operation == 'initial-pair-prepare'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 18
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact accepted native release owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Verify installed native capability and all preconditions before journalling
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -Preflight
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_UPGRADE_BLOCKED: native preflight failed before durable intent' }
      - name: Persist exactly one immutable program-upgrade intent BEFORE native mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          ACCEPTED_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'FIRST_USE_UPGRADE_BLOCKED: replay forbidden' }
          $reader = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\read-complete-gh-journal.ps1'
          $history = @(& $reader)
          $staging = @($history | Where-Object { [string]$_.body -like '*<!-- sing-box-windows-persistent-initial-stage/*' })
          if ($staging.Count -ne 0) { throw 'FIRST_USE_UPGRADE_BLOCKED: staging already begun; reconcile instead' }
          $attempts = @($history | Where-Object { [string]$_.body -like '*<!-- sing-box-windows-program-prepare/*' })
          if ($attempts.Count -ne 0) { throw 'FIRST_USE_UPGRADE_BLOCKED: program-upgrade intent already recorded; reconcile only' }
          $marker = '<!-- sing-box-windows-program-prepare/v1 -->'
          $record = [ordered]@{
            schema = 'sing-box.windows-program-prepare/v1'
            phase = 'BEGIN'
            original_run_id = [long]$env:SOURCE_RUN_ID
            github_run_id = [long]$env:GITHUB_RUN_ID
            source_revision = $env:ACCEPTED_REVISION
            release_set_sha256 = $env:ACCEPTED_RELEASE
          }
          $body = $marker + "`n" + ($record | ConvertTo-Json -Compress)
          & gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$body" > $null
          if ($LASTEXITCODE -ne 0) { throw 'FIRST_USE_UPGRADE_UNKNOWN: durable intent write uncertain; no replay' }
          $readback = @(& $reader)
          if (@($readback | Where-Object { [string]$_.body -ceq $body }).Count -ne 1) {
            throw 'FIRST_USE_UPGRADE_UNKNOWN: exactly-one durable intent readback unproven; no replay'
          }
          Write-Host 'first_use_upgrade_intent=COMMITTED_ONCE'
          Write-Host 'credential_staging_begin=NOT_WRITTEN'
      - name: Execute one stopped native offline ReleaseSet upgrade with bounded readback
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}'
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_UPGRADE_UNKNOWN: native offline handoff incomplete; do not replay' }
          Write-Host 'first_use_binary_prepare=EXACT_STOPPED_RELEASE_ACCEPTED'
          Write-Host 'first_use_staging_begin=NOT_WRITTEN'
          Write-Host 'credential_pair_committed=false'

  initial_first_use_preflight:
    name: Windows / read-only installed-owner capability before BEGIN
    needs: resolve
    if: needs.resolve.outputs.operation == 'initial-pair-stage'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 8
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout exact accepted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Verify installed native CLI and private SYSTEM cursor before marker
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $handoff -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -Preflight -RequireCurrentRelease
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'FIRST_USE_PREBEGIN_BLOCKED: installed native capability not proven'
          }

  initial_first_use_reservation:
    name: Windows / single-use durable candidate staging BEGIN
    needs: [resolve, initial_first_use_preflight]
    if: needs.resolve.outputs.operation == 'initial-pair-stage' && needs.initial_first_use_preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: credential-transaction-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Persist exact single-use staging authorization before host mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ needs.resolve.outputs.source_run_id }}
          GENERATION: ${{ needs.resolve.outputs.initial_generation }}
          SLOT: ${{ needs.resolve.outputs.initial_slot }}
          RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REPOSITORY" = 'iamaman11/sing-box'
          test "$ORIGINAL_RUN" = "$GENERATION"
          [[ "$RELEASE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SLOT" == A || "$SLOT" == B ]]
          history="$RUNNER_TEMP/initial-history.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" |
            jq -s 'add' > "$history"
          jq -e --argjson original "$ORIGINAL_RUN" --arg slot "$SLOT" '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->"))] |
            if length==1 then .[0] else error("not exactly one original issue BEGIN") end |
            split("\n") |
            if length==2 then .[1]|fromjson else error("original BEGIN malformed") end |
            .schema=="sing-box.credential-initial-attempt/v1" and
            .phase=="BEGIN" and .generation==$original and
            .github_run_id==$original and .slot==$slot
          ' "$history" >/dev/null
          jq -e '
            [.[]|.body|select(contains("<!-- sing-box-windows-persistent-initial-stage/"))]|length==0
          ' "$history" >/dev/null
          marker='<!-- sing-box-windows-persistent-initial-stage/v1 -->'
          record="$(jq -nc --argjson source "$ORIGINAL_RUN" \
            --argjson run "$GITHUB_RUN_ID" --arg slot "$SLOT" \
            --arg release "$RELEASE" --arg revision "$GITHUB_SHA" \
            '{schema:"sing-box.windows-persistent-initial-stage/v1",phase:"BEGIN",original_run_id:$source,github_run_id:$run,slot:$slot,release_set_sha256:$release,source_revision:$revision}')"
          body="$(printf '%s\n%s' "$marker" "$record")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/26/comments" \
            --raw-field "body=$body" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" |
            jq -s 'add' > "$history"
          jq -e --arg body "$body" '
            [.[]|.body|select(contains("<!-- sing-box-windows-persistent-initial-stage/"))] |
            length==1 and .[0]==$body
          ' "$history" >/dev/null
          echo 'first_use_stage_begin=COMMITTED_ONCE'
          echo 'credential_mutations=0'

  initial_first_use_stage:
    name: Windows / native persistent first-use candidate
    needs: [resolve, initial_first_use_reservation]
    if: needs.resolve.outputs.operation == 'initial-pair-stage' && needs.initial_first_use_reservation.result == 'success'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 18
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: One SYSTEM-owned offline candidate stage and native validation
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_FIRST_USE_TARGET_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
          EDGE_FIRST_USE_TARGET_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          FIRST_USE_GENERATION: ${{ needs.resolve.outputs.initial_generation }}
          FIRST_USE_SLOT: ${{ needs.resolve.outputs.initial_slot }}
        run: |
          $ErrorActionPreference = 'Stop'
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          # The irreversible GitHub BEGIN is already persisted. No release
          # download/install, SCM retarget or fallback is permitted after BEGIN.
          & $handoff -AcceptedRevision $env:EDGE_FIRST_USE_TARGET_REVISION -ReleaseSetSha256 $env:EDGE_FIRST_USE_TARGET_RELEASE -Preflight -RequireCurrentRelease
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_STAGE_BLOCKED: exact previously prepared Windows release was not preserved' }
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-initial-pair-stage.ps1'
          & $script -Generation ([long]$env:FIRST_USE_GENERATION) -Slot $env:FIRST_USE_SLOT
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'Windows initial stage ended without confirmed evidence' }

  physical:
    if: needs.resolve.outputs.operation != 'acceptance-reconcile' && needs.resolve.outputs.operation != 'initial-pair-stage' && needs.resolve.outputs.operation != 'initial-pair-prepare' && needs.resolve.outputs.operation != 'apply'
    name: Windows / ${{ needs.resolve.outputs.operation }}
    needs: resolve
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 20
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:45151
      EDGE_ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.resolve.outputs.release_set_sha256 }}
      EDGE_OPERATION: ${{ needs.resolve.outputs.operation }}
      EDGE_READONLY_PURPOSE: ${{ needs.resolve.outputs.readonly_purpose }}
      EDGE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
    steps:
      - name: Observe safe Windows state (read-only)
        if: ${{ needs.resolve.outputs.operation == 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if ($root -cne 'C:\sing-box' -or
              $workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: root/workspace isolation'
          }
          $current = Join-Path $root 'current.pb'
          $stable = Join-Path $root 'bin\edge-diagnostic.exe'
          if (-not (Test-Path -LiteralPath $stable -PathType Leaf)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: stable diagnostic missing'
          }
          function Read-Doctor([string]$binary) {
            $output = @(& $binary doctor $current)
            $code = $LASTEXITCODE
            $values = @{}
            foreach ($line in $output) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
            }
            return @{ values = $values; code = $code }
          }
          function Assert-Doctor([hashtable]$observation) {
            $v = $observation['values']
            if ([string]$v['exact_release_files'] -cne 'PASS' -or
                [string]$v['scm_service_name'] -cne 'EdgePlatformController' -or
                [string]$v['release_set_sha256'] -notmatch '^[0-9a-f]{64}$' -or
                [string]$v['windows_datapath_mode'] -notin @('ManagedTun','ProxyOnly') -or
                [string]$v['scm_start_type'] -notin @('AutoStart','OnDemand','Disabled')) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: exact release/SCM/mode incomplete'
            }
            $cleanStopped = (
              [string]$v['scm_state'] -ceq 'Stopped' -and
              [string]$v['managed_tun_present'] -ceq 'false' -and
              [string]$v['managed_singbox_process_count'] -ceq '0' -and
              [string]$v['orphan_singbox_process_count'] -ceq '0' -and
              [string]$v['conflicting_singbox_process_count'] -ceq '0' -and
              [string]$v['unknown_singbox_process_count'] -ceq '0'
            )
            if ($observation['code'] -ne 0 -and -not $cleanStopped) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: failed doctor without exact clean stopped evidence'
            }
            return $cleanStopped
          }
          $a = Read-Doctor $stable
          $stoppedA = Assert-Doctor $a
          $exact = [string]$a['values']['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($exact) -or -not (Test-Path -LiteralPath $exact -PathType Leaf)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: exact diagnostic missing'
          }
          $b = Read-Doctor $exact
          $stoppedB = Assert-Doctor $b
          if ($stoppedA -ne $stoppedB) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: stopped state drift' }
          foreach ($key in @('release_set_sha256','windows_datapath_mode','scm_state','scm_start_type',
              'managed_tun_present','managed_singbox_process_count','orphan_singbox_process_count',
              'conflicting_singbox_process_count','unknown_singbox_process_count')) {
            if ([string]$a['values'][$key] -cne [string]$b['values'][$key]) {
              throw "READ_ONLY_DIAGNOSE_BLOCKED: observation changed in $key"
            }
          }
          $v = $b['values']
          $desired = if ([string]$v['windows_datapath_mode'] -cne $env:EDGE_EXPECTED_MODE) { 'DEGRADED_INSTALLED_MODE' }
              elseif ($stoppedB -and $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun') { 'DEGRADED_STOPPED' }
              elseif ($b['code'] -eq 0) { 'PASS' } else { 'DEGRADED' }
          $safety = if ($stoppedB -and [string]$v['scm_start_type'] -ceq 'AutoStart') {
              'BLOCKED_STOPPED_OWNER_AUTOSTART'
            } else { 'BLOCKED_NO_INDEPENDENT_DNS_CONTROL_RECOVERY' }
          Write-Host 'observation_status=PASS'
          Write-Host "desired_state_status=$desired"
          Write-Host "scm_state=$([string]$v['scm_state'])"
          Write-Host "scm_start_type=$([string]$v['scm_start_type'])"
          Write-Host "managed_tun_present=$([string]$v['managed_tun_present'])"
          Write-Host "release_set_sha256=$([string]$v['release_set_sha256'])"
          Write-Host "managed_tun_restart_safety=$safety"
          Write-Host 'independent_no_tun_dns_control_recovery=UNPROVEN'
          # A single bounded SYSTEM observation, without runner access to
          # persistent secrets. No raw detail lines appear in public job logs.
          $ownerConsole = [string]$v['console_path']
          $ownerDetail = ''
          if (-not [string]::IsNullOrWhiteSpace($ownerConsole) -and
              (Test-Path -LiteralPath $ownerConsole -PathType Leaf)) {
            $ownerOutput = @(& $ownerConsole privileged-runtime-evidence --install-root $root)
            $ownerExit = $LASTEXITCODE
            $detailRows = @($ownerOutput | Where-Object { [string]$_ -like 'detail=runtime_evidence=BOUNDED_READ_ONLY;*' })
            if ($ownerExit -eq 0 -and $detailRows.Count -eq 1) {
              $ownerDetail = [string]$detailRows[0]
            }
          }
          function Read-BoundedField([string]$key, [string]$accepted) {
            if ([string]::IsNullOrEmpty($ownerDetail)) { return 'UNKNOWN' }
            $matches = [regex]::Matches($ownerDetail, '(?:^|;)' + [regex]::Escape($key) + '=([^;]*)')
            if ($matches.Count -ne 1) { return 'UNKNOWN' }
            $value = $matches[0].Groups[1].Value
            if ($value -cnotmatch $accepted) { return 'UNKNOWN' }
            return $value
          }
          $fields = @(
            ,@('credential_cursor','^(ABSENT|VALID)$')
            ,@('credential_active_present','^(true|false)$')
            ,@('credential_active_generation','^(0|[1-9][0-9]*)$')
            ,@('credential_active_slot','^(A|B|NONE|UNKNOWN)$')
            ,@('credential_candidate_present','^(true|false)$')
            ,@('credential_candidate_generation','^(0|[1-9][0-9]*)$')
            ,@('credential_candidate_slot','^(A|B|NONE|UNKNOWN)$')
            ,@('credential_previous_present','^(true|false)$')
            ,@('credential_active_sha256','^(ABSENT|[0-9a-f]{64})$')
            ,@('credential_candidate_sha256','^(ABSENT|[0-9a-f]{64})$')
            ,@('credential_initial_commit_receipt_present','^(true|false)$')
            ,@('credential_initial_recovery_receipt_present','^(true|false)$')
            ,@('first_use_runtime','^(ABSENT|PRESENT)$')
            ,@('first_use_config','^(ABSENT|PRESENT)$')
            ,@('first_use_access_identity','^(ABSENT|INVALID|PRESENT_NONEMPTY_UNVERIFIED)$')
            ,@('credential_lifecycle_state','^(FRESH_LOCAL_ONLY|FRESH_NEEDS_IDENTITY|EXISTING_ACTIVE_UNVERIFIED|EXISTING_CANDIDATE_UNVERIFIED|EXISTING_TRANSITION_UNVERIFIED|PARTIAL|UNKNOWN)$')
            ,@('credential_next_action','^(JOURNAL_AUTHORIZATION_REQUIRED|NATIVE_IDENTITY_BOOTSTRAP_REQUIRED|READ_ONLY_ORIGIN_RECONCILE|READ_ONLY_RECONCILE)$')
          )
          Write-Host "credential_evidence_status=$(if ($ownerDetail) { 'BOUNDED_READ_ONLY' } else { 'UNAVAILABLE' })"
          foreach ($entry in $fields) {
            $key = [string]$entry[0]
            Write-Host "$key=$(Read-BoundedField $key ([string]$entry[1]))"
          }
          Write-Host 'credential_origin=UNPROVEN'
          if ($stoppedB) {
            $route = Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop |
              Sort-Object RouteMetric,InterfaceMetric | Select-Object -First 1
            if ($null -eq $route -or [int]$route.InterfaceIndex -le 0) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: IPv4 default route missing'
            }
            $adapter = Get-NetAdapter -InterfaceIndex ([int]$route.InterfaceIndex) -ErrorAction Stop
            if ([string]$adapter.Name -ceq 'sing-box-tun') {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: route captured by sing-box'
            }
            Write-Host "direct_default_adapter=$($adapter.Name)"
            Write-Host "direct_default_gateway=$($route.NextHop)"
            $servers = @(Get-DnsClientServerAddress -InterfaceIndex ([int]$route.InterfaceIndex) -AddressFamily IPv4 -ErrorAction Stop |
              ForEach-Object ServerAddresses)
            if ($servers.Count -eq 0) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: IPv4 resolver missing' }
            Write-Host "direct_dns_server_count=$($servers.Count)"
            $dns = @(Resolve-DnsName www.gstatic.com -Type A -DnsOnly -ErrorAction Stop |
              Where-Object { $_.IPAddress })
            if ($dns.Count -eq 0) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: independent DNS failed' }
            Write-Host 'direct_dns_resolution=PASS'
            $http = (& curl.exe --noproxy '*' --silent --show-error --fail --connect-timeout 8 --max-time 15 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
            if ($LASTEXITCODE -ne 0 -or $http -cne '204') {
              throw "READ_ONLY_DIAGNOSE_BLOCKED: direct HTTPS failed exit=$LASTEXITCODE status=$http"
            }
            Write-Host 'direct_no_proxy_https=PASS'
          }
          if ($env:EDGE_READONLY_PURPOSE -ceq 'offline-preflight') {
            # This operator read-only preview must cover both safe source
            # states supported by the native first-use offline handoff.
            $formerManagedTun = (
              [string]$v['windows_datapath_mode'] -ceq 'ManagedTun' -and
              $desired -ceq 'DEGRADED_INSTALLED_MODE' -and
              [string]$v['scm_start_type'] -ceq 'AutoStart'
            )
            $stoppedProxyOnly = (
              [string]$v['windows_datapath_mode'] -ceq 'ProxyOnly' -and
              $desired -ceq 'PASS' -and
              [string]$v['scm_start_type'] -ceq 'OnDemand'
            )
            if (-not $stoppedB -or $env:EDGE_EXPECTED_MODE -cne 'ProxyOnly' -or
                (-not $formerManagedTun -and -not $stoppedProxyOnly)) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: requires exact stopped ManagedTun or manual ProxyOnly with no TUN'
            }
            $installed = [string]$v['release_set_sha256']
            $target = [string]$env:EDGE_RELEASE_SET_SHA256
            if ($target -notmatch '^[0-9a-f]{64}$' -or $installed -cnotmatch '^[0-9a-f]{64}$') {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: installed or accepted target identity is malformed'
            }
            $console = [string]$v['console_path']
            if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: exact installed immutable console missing'
            }
            $privileged = @(& $console privileged-runtime-evidence --install-root $root)
            if ($LASTEXITCODE -ne 0) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: installed privileged evidence task unreachable'
            }
            $detail = @($privileged | Where-Object { [string]$_ -like 'detail=*' })
            if ($detail.Count -ne 1 -or
                [string]$detail[0] -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY;' -or
                [string]$detail[0] -notmatch ';process_classification=ABSENT;process_evidence_complete=true;process_count=0;' -or
                [string]$detail[0] -notmatch ';external_owner_evidence=INCOMPLETE;external_count=0(?:;|$)') {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: privileged task could not attest zero managed and external owners'
            }
            $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='EdgePlatformController'" -ErrorAction Stop
            $expectedStartMode = if ($formerManagedTun) { 'Auto' } else { 'Manual' }
            if ($null -eq $service -or [string]$service.State -cne 'Stopped' -or
                [string]$service.StartMode -cne $expectedStartMode) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: SCM state or startup mode changed'
            }
            $installedCommands = @(& $console --help)
            if ($LASTEXITCODE -ne 0) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: exact installed console command contract unreadable'
            }
            $offlineCommandAdvertised = @(
              $installedCommands | Where-Object { [string]$_ -match '\bprivileged-offline-activate\b' }
            ).Count -gt 0
            if (-not $offlineCommandAdvertised) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: immutable installed native owner cannot perform offline upgrade'
            }
            Write-Host "offline_source_mode=$([string]$v['windows_datapath_mode'])"
            Write-Host 'offline_preflight_observation=PASS'
            Write-Host 'offline_privileged_task_readonly=PASS'
            Write-Host "offline_command_advertised=$offlineCommandAdvertised"
            Write-Host 'offline_zero_runtime_owners=PASS'
            Write-Host "offline_installed_release=$installed"
            Write-Host "offline_accepted_target_release=$target"
            Write-Host "offline_release_transition_needed=$($installed -cne $target)"
            Write-Host 'offline_native_activation=NOT_EXECUTED_READ_ONLY_PREFLIGHT'
            Write-Host 'offline_mutations_performed=0'
            Write-Host 'offline_service_or_tun_restarted=false'
            @(
              '### Offline handoff preflight (read-only)',
              '- Native privileged task: reachable / zero runtime owners',
              "- Installed release: $installed",
              "- Accepted release: $target",
              '- Offline activation: not executed; installed CLI capability observed above',
              '- Changes to Windows service / TUN / DNS / routes: none'
            ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          foreach ($name in @('state','runtime','logs')) {
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries((Join-Path $root $name)) | Out-Null }
            catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "READ_ONLY_DIAGNOSE_BLOCKED: runner can read private state: $name" }
          }
          @(
            '### Windows read-only observation',
            '- Observation: PASS',
            "- Desired state: $desired",
            "- SCM: $([string]$v['scm_state'])",
            "- TUN: $([string]$v['managed_tun_present'])",
            "- Startup: $([string]$v['scm_start_type'])",
            "- Safety: $safety",
            '- Independent DNS/control recovery: UNPROVEN'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Assert isolated root and observe pre-state
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_INSTALL_ROOT -cne 'C:\sing-box') { throw 'Unexpected install root' }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          if ($workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Runner workspace overlaps managed install root'
          }
          $stableDiagnostic = Join-Path $root 'bin\edge-diagnostic.exe'
          if (-not (Test-Path -LiteralPath $stableDiagnostic -PathType Leaf)) { throw 'Installed stable diagnostic is missing' }
          $current = Join-Path $root 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact active release files'
          }

          # A verified installed ProxyOnly release can be intentionally Stopped;
          # unlike ManagedTun this never requires host TUN teardown.
          $proxyOnlyStopped = (
            $env:EDGE_OPERATION -in @('start','stop','converge') -and
            $env:EDGE_EXPECTED_MODE -ceq 'ProxyOnly' -and
            [string]$bootstrapValues['windows_datapath_mode'] -ceq 'ProxyOnly' -and
            [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
            [string]$bootstrapValues['scm_start_type'] -ceq 'OnDemand' -and
            [string]$bootstrapValues['managed_tun_present'] -ceq 'false' -and
            [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['orphan_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['unknown_singbox_process_count'] -eq 0
          )
          $stoppedOwnerRecovery = $false
          $cleanStoppedBootstrap = $false
          $runningLegacyDiagnosticRecovery = $false
          $legacyManagedPid = ''
          if ($bootstrapExit -ne 0) {
            $boundedStoppedOwner = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1
            )
            $boundedCleanStopped = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['exact_release_files'] -ceq 'PASS' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 0 -and
              [string]$bootstrapValues['managed_tun_present'] -ceq 'false'
            )
            # Only the installed known broken diagnostic may use this one-time
            # upgrade path. SCM parent match is not sufficient as authority.
            $legacyCandidates = @(
              $bootstrapDoctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $boundedRunningLegacy = (
              $env:EDGE_OPERATION -eq 'converge' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun' -and
              [string]$bootstrapValues['release_set_sha256'] -ceq '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -and
              [string]$env:EDGE_RELEASE_SET_SHA256 -cne [string]$bootstrapValues['release_set_sha256'] -and
              [string]$bootstrapValues['windows_datapath_mode'] -ceq 'ManagedTun' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Running' -and
              [string]$bootstrapValues['scm_process_id'] -match '^\d+$' -and
              [string]$bootstrapValues['scm_executable_matches_release'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_present'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_pid'] -ceq [string]$bootstrapValues['scm_process_id'] -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['orphan_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1 -and
              $legacyCandidates.Count -eq 1 -and
              ($legacyCandidates[0].Split(':')[1]) -ceq [string]$bootstrapValues['scm_process_id']
            )
            if ($boundedRunningLegacy) {
              # The installed old doctor returns before network observations.
              # Prove TUN from read-only OS state, not a missing doctor field.
              $adapters = @(Get-NetAdapter -Name 'sing-box-tun' -ErrorAction Stop)
              if ($adapters.Count -ne 1 -or [string]$adapters[0].Status -cne 'Up') {
                throw 'Legacy managed TUN adapter is not uniquely Up'
              }
              $tunIf = [int]$adapters[0].ifIndex
              $ips = @(Get-NetIPAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                Where-Object { $_.IPAddress -ceq '172.19.0.1' -and $_.PrefixLength -eq 30 })
              if ($ips.Count -ne 1) { throw 'Legacy managed TUN exact IPv4 address is absent' }
              $tunDns = @(Get-DnsClientServerAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses)
              if ($tunDns -notcontains '172.19.0.2') {
                throw 'Legacy managed TUN DNS is not on the canonical interface'
              }
              Write-Host 'legacy_managed_tun_os_readonly=PASS'
            }
            if (-not $proxyOnlyStopped -and -not $boundedStoppedOwner -and -not $boundedCleanStopped -and -not $boundedRunningLegacy) {
              throw "Stable pre-state diagnostic failed: $bootstrapExit"
            }

            $stableConsole = Join-Path $root 'bin\edge-console.exe'
            if (-not (Test-Path -LiteralPath $stableConsole -PathType Leaf)) {
              throw 'Installed stable console is missing for bounded recovery evidence'
            }
            $recoveryEvidence = @(& $stableConsole privileged-runtime-evidence --install-root $root)
            $recoveryEvidenceExit = $LASTEXITCODE
            $recoveryEvidence | Write-Host
            if ($recoveryEvidenceExit -ne 0) {
              throw "Bounded privileged evidence failed: $recoveryEvidenceExit"
            }
            $recoveryDetail = [string]($recoveryEvidence |
              Where-Object { [string]$_ -like 'detail=*' } |
              Select-Object -Last 1)
            if ([string]::IsNullOrWhiteSpace($recoveryDetail) -or
                $recoveryDetail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
              throw 'Bounded recovery did not return the privileged evidence contract'
            }
            if ($recoveryDetail -notmatch 'external_owner_evidence=INCOMPLETE;external_count=0(?:;|$)') {
              throw 'Bounded recovery still observes privileged external sing-box ownership'
            }

            if ($boundedRunningLegacy) {
              $parts = $legacyCandidates[0].Split(':')
              $owner = [regex]::Escape([string]$bootstrapValues['scm_process_id'])
              $child = [regex]::Escape([string]$parts[0])
              if ($recoveryDetail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                  $recoveryDetail -notmatch ';external_count=0(?:;|$)' -or
                  $recoveryDetail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
                throw 'Old diagnostic disagreement lacks exact SYSTEM managed-owner proof'
              }
              $legacyManagedPid = [string]$parts[0]
              $runningLegacyDiagnosticRecovery = $true
              Write-Host 'running_legacy_diagnostic=PRIVILEGED_EXACT_PROOF'
            } elseif ($proxyOnlyStopped) {
              Write-Host 'proxy_only_stopped_owner=VERIFIED_NO_TUN'
            } elseif ($boundedStoppedOwner) {
              $stoppedOwnerRecovery = $true
              "EDGE_STOPPED_OWNER_RECOVERY=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Recovering stopped SCM owner only after privileged evidence proved zero external sing-box owners'
            } else {
              $cleanStoppedBootstrap = $true
              "EDGE_CLEAN_STOPPED_BOOTSTRAP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Bootstrapping Release A from the already-proven clean stopped ManagedTun state'
            }
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ($doctorExit -ne 0 -and -not $proxyOnlyStopped -and -not $stoppedOwnerRecovery -and -not $cleanStoppedBootstrap -and -not $runningLegacyDiagnosticRecovery) {
            throw "Exact pre-state diagnostic failed: $doctorExit"
          }
          if ($stoppedOwnerRecovery) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1) {
              throw 'Stopped-owner recovery evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'stopped_owner_recovery_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CONFLICT'
            }
          }
          if ($cleanStoppedBootstrap) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['managed_tun_present'] -cne 'false') {
              throw 'Clean stopped bootstrap evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'clean_stopped_bootstrap_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CLEAN_STATE'
            }
          }
          if ($runningLegacyDiagnosticRecovery) {
            $exactCandidates = @(
              $doctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $expectedPair = ([string]$legacyManagedPid) + ':' + ([string]$values['scm_process_id'])
            if ([string]$values['release_set_sha256'] -cne '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_executable_matches_release'] -cne 'true' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1 -or
                $exactCandidates.Count -ne 1 -or
                $exactCandidates[0] -cne $expectedPair -or
                [string]$values['scm_process_id'] -cne [string]$bootstrapValues['scm_process_id']) {
              throw 'Legacy active runtime changed after bounded SYSTEM owner proof'
            }
            $LASTEXITCODE = 0
            Write-Host 'running_legacy_diagnostic_exit=NORMALIZED_AFTER_PRIVILEGED_EXACT_PROOF'
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') {
            throw 'Exact active diagnostic could not verify its ReleaseSet files'
          }
          $currentRelease = [string]$values['release_set_sha256']
          if ($env:EDGE_OPERATION -eq 'repair' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Repair target must equal the exact current ReleaseSet before runtime stop'
          }
          $currentMode = [string]$values['windows_datapath_mode']
          $currentTun = if ($runningLegacyDiagnosticRecovery) { 'true' } else { [string]$values['managed_tun_present'] }
          # Independent ProxyOnly/no-TUN teardown remains unsupported. A strictly
          # managed-TUN previous-release rollback is an explicit release handoff,
          # not permission to stop the host TUN or mutate foreign DNS ownership.
          if ($env:EDGE_OPERATION -eq 'stop' -and $currentMode -cne 'ProxyOnly') {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: ManagedTun stop requires independent DNS/control restoration'
          }
          if ($env:EDGE_OPERATION -eq 'rollback') {
            if ($currentMode -cne 'ManagedTun' -or $env:EDGE_EXPECTED_MODE -cne 'ManagedTun' -or
                $currentTun -cne 'true' -or $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256 -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_executable_matches_release'] -cne 'true' -or
                [string]$values['controller_listener_present'] -cne 'true' -or
                [string]$values['controller_listener_pid'] -cne [string]$values['scm_process_id']) {
              throw 'PRE_MUTATION_ROLLBACK_BLOCKED: exact accepted Running ManagedTun owner required'
            }
            $foreignAdapter = Get-NetAdapter -Name 'CloudflareWARP' -ErrorAction Stop
            $foreignDns = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
            $routerDns = @(Get-DnsClientServerAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
            if ([string]$foreignAdapter.Status -cne 'Up' -or
                ($foreignDns -join ',') -cne '172.19.0.2,192.168.100.1' -or
                ($routerDns -join ',') -cne '192.168.100.1') {
              throw 'PRE_MUTATION_ROLLBACK_BLOCKED: foreign CloudflareWARP/Ethernet DNS or owner differs from accepted no-TUN rescue baseline'
            }
            Write-Host 'managed_tun_previous_rollback_dns_owner_preflight=PASS'
          }
          if ($currentMode -ceq 'ManagedTun' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ProxyOnly' -and
              $env:EDGE_OPERATION -in @('converge','repair')) {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: ManagedTun to ProxyOnly requires independent DNS/control-channel recovery'
          }
          switch ($currentMode) {
            'ProxyOnly' {
              if ($currentTun -cne 'false' -or
                  [string]$values['scm_start_type'] -cne 'OnDemand' -or
                  [string]$values['scm_executable_matches_release'] -cne 'true' -or
                  [string]$values['scm_state'] -notin @('Stopped','Running')) {
                throw 'PROXY_ONLY_SCM_BLOCKED: expected immutable Manual-start owner with no TUN'
              }
              if ($env:EDGE_OPERATION -eq 'converge' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
                if ([string]$values['scm_state'] -cne 'Stopped' -or
                    [int]$values['managed_singbox_process_count'] -ne 0 -or
                    [int]$values['orphan_singbox_process_count'] -ne 0 -or
                    [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                    [int]$values['unknown_singbox_process_count'] -ne 0) {
                  throw 'PROXY_ONLY_SCM_BLOCKED: release upgrade requires explicitly Stopped clean ProxyOnly; stop first'
                }
                Write-Host 'proxy_only_upgrade=EXACT_OFFLINE_CURRENT_TO_ACCEPTED'
              }
            }
            'ManagedTun' {
              # Incident 2026-10-10: never recapture host routes from a stopped,
              # partially activated or unowned ManagedTun before independently
              # proven no-TUN DNS/control recovery and live Line1 authentication.
              # Neither a green ReleaseSet nor sing-box config syntax proves it.
              # Read-only /windows diagnose uses its separate safe observation step.
              if ($currentTun -cne 'true' -or
                  [string]$values['scm_state'] -cne 'Running' -or
                  [int]$values['managed_singbox_process_count'] -ne 1) {
                throw 'PRE_MUTATION_MANAGED_TUN_PREAUTH_BLOCKED: active authenticated Line1 and independent no-TUN DNS/control restoration are UNPROVEN; do not capture Windows routes'
              }
            }
            default { throw "Unsupported installed Windows datapath mode: $currentMode" }
          }
          if ($env:EDGE_OPERATION -eq 'diagnose' -and $currentMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Installed datapath mode $currentMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          "EDGE_BEFORE_MODE=$currentMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Immutable console path is unavailable'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($stoppedOwnerRecovery) {
            if ($externalPids.Count -ne 1) {
              throw "Stopped-owner recovery expected one unprivileged ambiguous sing-box, observed $($externalPids.Count)"
            }
            $signature = ''
          } else {
            if ($externalPids.Count -ne 0) {
              throw "Stage 4B.2-C requires zero external sing-box owners; observed $($externalPids.Count)"
            }
            $signature = $externalPids -join ','
          }
          $managedBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($runningLegacyDiagnosticRecovery) { $managedBefore = @($legacyManagedPid) }
          $unknownBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownBefore.Count -gt 0) {
            if ($unknownBefore.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_process_id'] -notmatch '^\d+$') {
              throw 'Pre-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $privileged = @(& $console privileged-runtime-evidence --install-root $root)
            if ($LASTEXITCODE -ne 0) { throw 'Pre-state privileged runtime identity evidence unavailable' }
            $detail = [string]($privileged | Where-Object { [string]$_ -like 'detail=*' } | Select-Object -Last 1)
            $owner = [regex]::Escape([string]$values['scm_process_id'])
            $child = [regex]::Escape([string]$unknownBefore[0])
            if ($detail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY;' -or
                $detail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detail -notmatch ';external_count=0(?:;|$)' -or
                $detail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
              throw 'Pre-state UNKNOWN sing-box is not confirmed by exact privileged owner evidence'
            }
            $managedBefore = @($unknownBefore[0])
            Write-Host 'prestate_managed_owner=PRIVILEGED_EXACT_PROOF'
          }
          "EDGE_BEFORE_CONTROLLER_PID=$([string]$values['scm_process_id'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_MANAGED_PID=$($managedBefore -join ',')" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'start' -and $managedBefore.Count -eq 1 -and
              [string]$values['scm_state'] -ceq 'Running') {
            "EDGE_START_NOOP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]$values['scm_state'] -cne 'Running' -or
                $managedBefore.Count -ne 1 -or
                [string]$values['managed_tun_present'] -cne 'true') {
              throw 'restart-controller requires healthy Running ManagedTun pre-state'
            }
          }
          if ($env:EDGE_OPERATION -in @('repair','rollback')) {
            $previous = Join-Path $root 'previous.pb'
            $previousDoctor = @(& $diagnostic doctor $previous)
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed: $LASTEXITCODE" }
            $previousValues = @{}
            foreach ($line in $previousDoctor) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousValues['exact_release_files'] -cne 'PASS') {
              throw 'Previous ReleaseSet exact files are not verified'
            }
            if ($env:EDGE_OPERATION -eq 'rollback') {
              if ([string]$previousValues['release_set_sha256'] -ceq $currentRelease -or
                  [string]$previousValues['windows_datapath_mode'] -cne 'ManagedTun' -or
                  $managedBefore.Count -ne 1 -or
                  [string]$values['managed_tun_present'] -cne 'true' -or
                  [string]$values['managed_tun_ipv4'] -cne '172.19.0.1' -or
                  [string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: distinct verified previous release and exact single-owner ManagedTun required'
              }
              # The CURRENT diagnostic reports its own compiled mode even for
              # previous.pb. Use the verified PREVIOUS immutable diagnostic to
              # prove its distinct compiled desired mode (read-only, no fetch).
              # Its later live-owner check may fail while a newer SCM runs; only
              # the initial verified release identity/mode fields are consumed.
              $previousDiagnostic = [string]$previousValues['diagnostic_path']
              if ([string]::IsNullOrWhiteSpace($previousDiagnostic) -or
                  -not (Test-Path -LiteralPath $previousDiagnostic -PathType Leaf)) {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: previous exact diagnostic missing'
              }
              $previousStatic = @(& $previousDiagnostic doctor $previous 2>$null)
              $previousStaticRelease = @($previousStatic | Where-Object { [string]$_ -match '^release_set_sha256=' })
              $previousStaticSource = @($previousStatic | Where-Object { [string]$_ -match '^source_revision=' })
              $previousStaticMode = @($previousStatic | Where-Object { [string]$_ -match '^windows_datapath_mode=' })
              if ($previousStaticRelease.Count -ne 1 -or
                  $previousStaticSource.Count -ne 1 -or
                  $previousStaticMode.Count -ne 1 -or
                  [string]$previousStaticRelease[0] -cne "release_set_sha256=$([string]$previousValues['release_set_sha256'])" -or
                  [string]$previousStaticSource[0] -cne "source_revision=$([string]$previousValues['source_revision'])" -or
                  [string]$previousStaticMode[0] -cne 'windows_datapath_mode=ManagedTun' -or
                  @($previousStatic | Where-Object { [string]$_ -ceq 'exact_release_files=PASS' }).Count -ne 1) {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: verified previous binary does not attest exact ManagedTun source and files'
              }
              Write-Host 'previous_release_native_desired_managed_tun=PASS'
            }
            "EDGE_BEFORE_PREVIOUS_RELEASE=$([string]$previousValues['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_EXTERNAL_PIDS_BEFORE=$signature" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $doctor | Write-Host

      - name: Execute typed lifecycle mutation
        id: lifecycle_mutation
        if: ${{ needs.resolve.outputs.operation != 'diagnose' && needs.resolve.outputs.operation != 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:EDGE_OPERATION) {
            'converge' {
              if ($env:EDGE_BEFORE_MODE -ceq 'ProxyOnly') {
                $exactConsole = $env:EDGE_CURRENT_CONSOLE
                if ($env:EDGE_BEFORE_RELEASE -cne $env:EDGE_RELEASE_SET_SHA256) {
                  # Only a separately stopped exact ProxyOnly owner is eligible.
                  # Native offline activation owns accepted release, SCM, task
                  # and rollback; never use legacy privileged-activate here.
                  & $exactConsole privileged-offline-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
                  if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly offline upgrade outcome UNKNOWN; DO NOT REPLAY' }
                  $exactConsole = Join-Path $env:EDGE_INSTALL_ROOT ("releases\" + $env:EDGE_RELEASE_SET_SHA256 + "\bin\edge-console.exe")
                  if (-not (Test-Path -LiteralPath $exactConsole -PathType Leaf)) {
                    throw 'ProxyOnly offline upgrade missing exact new immutable console; do not replay'
                  }
                }
                & $exactConsole privileged-start-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
                if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly SCM converge uncertain; do not replay' }
                & $exactConsole start-local $env:EDGE_CONTROLLER_ENDPOINT
              } else {
                & $env:EDGE_CURRENT_CONSOLE privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
              }
            }
            'start' {
              if ($env:EDGE_START_NOOP -ceq 'YES') {
                Write-Host 'runtime_start=NOOP_ALREADY_RUNNING'
                $LASTEXITCODE = 0
              } else {
                if ($env:EDGE_BEFORE_MODE -ceq 'ProxyOnly') {
                  & $env:EDGE_CURRENT_CONSOLE privileged-start-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
                  if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly SCM start uncertain; do not replay' }
                }
                & $env:EDGE_CURRENT_CONSOLE start-local $env:EDGE_CONTROLLER_ENDPOINT
              }
            }
            'stop' {
              if ($env:EDGE_BEFORE_MODE -cne 'ProxyOnly') {
                throw 'ManagedTun stop remains blocked until independent DNS recovery is proven'
              }
              & $env:EDGE_CURRENT_CONSOLE privileged-stop-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
            }
            'restart-controller' {
              & $env:EDGE_CURRENT_CONSOLE privileged-restart-controller-service --install-root $env:EDGE_INSTALL_ROOT
            }
            'repair' {
              & $env:EDGE_CURRENT_CONSOLE privileged-reinstall-accepted $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            }
            'rollback' {
              & $env:EDGE_CURRENT_CONSOLE privileged-rollback-previous --install-root $env:EDGE_INSTALL_ROOT
            }
            default { throw "Unsupported operation: $env:EDGE_OPERATION" }
          }
          if ($LASTEXITCODE -ne 0) { throw "Lifecycle mutation failed: $LASTEXITCODE" }

      - name: Verify exact authority and SCM handoff
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stableDiagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          if ($bootstrapExit -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Stable post-state diagnostic failed: $bootstrapExit" }
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact post-state release files'
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable post-state diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          if ($doctorExit -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Exact post-state diagnostic failed: $doctorExit" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') { throw 'Exact release files are not verified' }
          $afterMode = [string]$values['windows_datapath_mode']
          $afterTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $afterMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Active datapath mode $afterMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          switch ($afterMode) {
            'ProxyOnly' {
              if ($afterTun -cne 'false') { throw 'ProxyOnly state unexpectedly owns managed TUN' }
            }
            'ManagedTun' {
              if ($env:EDGE_OPERATION -eq 'stop') {
                if ($afterTun -cne 'false') { throw 'Managed TUN remained present after explicit runtime stop' }
              } else {
                if ($afterTun -cne 'true') { throw 'ManagedTun state is missing managed TUN' }
                if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') {
                  throw "Unexpected managed TUN IPv4: $($values['managed_tun_ipv4'])"
                }
                if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') {
                  throw "Unexpected managed TUN DNS IPv4: $($values['managed_tun_dns_ipv4'])"
                }
              }
            }
            default { throw "Unsupported active Windows datapath mode: $afterMode" }
          }
          if ($env:EDGE_OPERATION -in @('converge','repair') -and [string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Accepted ReleaseSet is not active'
          }
          if ($env:EDGE_OPERATION -in @('start','stop','restart-controller') -and [string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_RELEASE) {
            throw 'Transient runtime control changed ReleaseSet authority'
          }
          if ($env:EDGE_OPERATION -eq 'rollback') {
            if ([string]$values['release_set_sha256'] -ceq $env:EDGE_BEFORE_RELEASE) {
              throw 'Rollback did not change ReleaseSet authority'
            }
            if ([string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Rollback did not activate the exact previous ReleaseSet observed before mutation'
            }
          }
          if ($env:EDGE_OPERATION -eq 'repair') {
            $previousAfter = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'previous.pb'))
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed after repair: $LASTEXITCODE" }
            $previousAfterValues = @{}
            foreach ($line in $previousAfter) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousAfterValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousAfterValues['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Repair changed previous ReleaseSet authority'
            }
          }
          $managedAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $afterControllerPid = [string]$values['scm_process_id']
          $unknownAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownAfter.Count -gt 0) {
            if ($unknownAfter.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0) {
              throw 'Post-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $managedAfter = @($unknownAfter[0])
            Write-Host 'poststate_process_identity=UNKNOWN_AWAIT_PRIVILEGED_EVIDENCE'
          }
          $afterManagedPid = $managedAfter -join ','
          "EDGE_AFTER_CONTROLLER_PID=$afterControllerPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MANAGED_PID=$afterManagedPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_CONTROLLER_PID) -or
                $env:EDGE_BEFORE_CONTROLLER_PID -ceq 'ABSENT' -or
                $afterControllerPid -ceq $env:EDGE_BEFORE_CONTROLLER_PID) {
              throw 'SCM restart did not replace controller PID'
            }
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_MANAGED_PID) -or
                $afterManagedPid -ceq $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'SCM restart did not replace the exact managed child'
            }
          }
          if ($env:EDGE_OPERATION -eq 'start' -and $env:EDGE_START_NOOP -ceq 'YES') {
            if ($afterControllerPid -cne $env:EDGE_BEFORE_CONTROLLER_PID -or
                $afterManagedPid -cne $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'Idempotent start caused controller or managed-child PID churn'
            }
            Write-Host 'runtime_start_noop_identity=PASS'
          }
          $console = [string]$values['console_path']
          $controller = [string]$values['controller_path']
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MODE=$afterMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ([string]$values['scm_service_name'] -cne 'EdgePlatformController') { throw 'SCM controller is missing' }
          if ([string]$values['scm_account'] -cne 'NT SERVICE\EdgePlatformController') { throw 'Unexpected SCM identity' }
          $expectedScm = if ($env:EDGE_OPERATION -eq 'stop') { 'Stopped' } else { 'Running' }
          $expectedStartup = if ($afterMode -ceq 'ProxyOnly') { 'OnDemand' } else { 'AutoStart' }
          if ([string]$values['scm_state'] -cne $expectedScm) { throw "SCM not $expectedScm" }
          if ([string]$values['scm_start_type'] -cne $expectedStartup) { throw "SCM startup not $expectedStartup" }
          if ($env:EDGE_OPERATION -eq 'stop' -and [string]$values['scm_process_id'] -cne 'ABSENT') {
            throw 'Stopped SCM has a process'
          }
          if ([string]$values['scm_executable_matches_release'] -cne 'true') { throw 'SCM binary does not match the active release' }
          $authority = ([Uri]$env:EDGE_CONTROLLER_ENDPOINT).Authority
          $expected = "$controller windows-service $env:EDGE_INSTALL_ROOT $authority"
          if ([string]$values['scm_executable_path'] -cne $expected) { throw 'SCM executable authority mismatch' }

      - name: Measure native Line1 named-outbound quality without changing routing
        if: ${{ needs.resolve.outputs.operation == 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_BEFORE_MODE -cne 'ManagedTun') {
            throw 'Line1 quality requires installed, running ManagedTun; no mode change is permitted'
          }
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $before = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality pre-measurement owner evidence unavailable' }
          $routeBefore = @($before | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          if ($routeBefore.Count -eq 0) { throw 'Native quality route evidence is missing' }
          $warpDnsBefore = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedBefore = @($before | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmBefore = @($before | Where-Object { $_ -match '^scm_process_id=' })
          if ($managedBefore.Count -ne 1 -or $scmBefore.Count -ne 1) {
            throw 'Native quality requires exactly one independently observed SCM and sing-box process'
          }
          Write-Host 'line1_quality_source=INSTALLED_VERIFIED_RELEASE'
          Write-Host "line1_quality_installed_release=$env:EDGE_BEFORE_RELEASE"
          Write-Host "line1_quality_target_mode=$env:EDGE_EXPECTED_MODE"
          $result = @(& $env:EDGE_CURRENT_CONSOLE quality-line1)
          $qualityExit = $LASTEXITCODE
          $result | Write-Host
          $after = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality post-measurement owner evidence unavailable' }
          $routeAfter = @($after | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          $warpDnsAfter = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedAfter = @($after | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmAfter = @($after | Where-Object { $_ -match '^scm_process_id=' })
          if (($routeAfter -join "`n") -cne ($routeBefore -join "`n") -or
              ($managedAfter -join "`n") -cne ($managedBefore -join "`n") -or
              ($scmAfter -join "`n") -cne ($scmBefore -join "`n") -or
              ($warpDnsAfter -join ',') -cne ($warpDnsBefore -join ',')) {
            throw 'Line1 quality changed (or observed drift in) route, process owner or foreign WARP DNS evidence'
          }
          Write-Host 'native_line1_owner_route_dns_parity=PASS'
          if ($qualityExit -ne 0) { throw "Native Line1 quality reported unavailable HTTP samples: exit=$qualityExit" }

      - name: Prove managed DIRECT and WARP without runtime restart
        if: ${{ needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE verify-runtime
          if ($LASTEXITCODE -ne 0) { throw "Managed proxy verification failed: $LASTEXITCODE" }

      - name: Read-only privileged runtime evidence after restart
        if: ${{ always() && needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceStrict = $true
          $evidenceConsole = $env:EDGE_CURRENT_CONSOLE
          if ([string]::IsNullOrWhiteSpace($evidenceConsole) -or
              -not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            $evidenceStrict = $false
            $evidenceConsole = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-console.exe'
          }
          if (-not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            Write-Warning 'Privileged runtime evidence console is unavailable after an earlier lifecycle failure'
            exit 0
          }

          $evidenceLines = @(& $evidenceConsole privileged-runtime-evidence --install-root $env:EDGE_INSTALL_ROOT)
          $evidenceExit = $LASTEXITCODE
          $evidenceLines | Write-Host
          if ($evidenceExit -ne 0) {
            if ($evidenceStrict) { throw "Privileged read-only runtime evidence failed: $evidenceExit" }
            Write-Warning "Privileged conflict evidence failed read-only: $evidenceExit"
            exit 0
          }

          $detailLine = [string]($evidenceLines |
            Where-Object { [string]$_ -like 'detail=*' } |
            Select-Object -Last 1)
          if ([string]::IsNullOrWhiteSpace($detailLine) -or
              $detailLine -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
            if ($evidenceStrict) { throw 'Privileged runtime evidence did not return the bounded typed detail contract' }
            Write-Warning 'Privileged conflict evidence did not return the bounded typed detail contract'
            exit 0
          }

          if ($evidenceStrict -and $detailLine -notmatch '(?:^|;)controller_service_error=ABSENT(?:;|$)') {
            throw 'Controller service retains current startup-failure evidence after successful lifecycle verification'
          }
          $modeAtEvidence = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MODE)) { $env:EDGE_BEFORE_MODE } else { $env:EDGE_AFTER_MODE }
          if ($evidenceStrict -and $modeAtEvidence -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop') {
            $expectedChild = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MANAGED_PID)) { $env:EDGE_BEFORE_MANAGED_PID } else { $env:EDGE_AFTER_MANAGED_PID }
            $expectedController = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_CONTROLLER_PID)) { $env:EDGE_BEFORE_CONTROLLER_PID } else { $env:EDGE_AFTER_CONTROLLER_PID }
            if ([string]::IsNullOrWhiteSpace($expectedChild) -or $expectedChild -notmatch '^\d+$' -or
                [string]::IsNullOrWhiteSpace($expectedController) -or $expectedController -notmatch '^\d+$') {
              throw 'Privileged managed process identity lacks an exact diagnostic PID candidate'
            }
            $child = [regex]::Escape($expectedChild)
            $owner = [regex]::Escape($expectedController)
            if ($detailLine -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detailLine -notmatch ';external_count=0(?:;|$)') {
              throw 'Privileged managed identity differs from the exact runner process observation'
            }
            "EDGE_PRIVILEGED_MANAGED_PID=$expectedChild" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            "EDGE_PRIVILEGED_CONTROLLER_PID=$expectedController" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            Write-Host 'managed_process_identity=PRIVILEGED_EXACT_PROOF'
          }
          if ($evidenceStrict -and $env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun') {
            if ($detailLine -match '(?:^|;)stderr=MISSING(?:;|$)') {
              throw 'Managed sing-box stderr evidence is missing after lifecycle verification'
            }
            if ($detailLine -notmatch '(?:^|;)stderr=') {
              throw 'Managed sing-box stderr evidence was omitted from the bounded privileged result'
            }
            if ($detailLine -match 'failed to search process:\s*Access is denied') {
              throw 'Managed sing-box process lookup still reports Access is denied after fresh restart'
            }
            Write-Host 'managed_tun_process_search_access_denied=ABSENT'
          }

      - name: Prove MANAGED_TUN ordinary Windows traffic DNS and foreign Mesh coexistence
        if: ${{ (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for managed TUN proof'
          }
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw "Managed TUN diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['managed_tun_present'] -cne 'true') { throw 'Managed TUN is absent' }
          $tunIndex = [uint32]$values['managed_tun_interface_index']
          if ($tunIndex -eq 0) { throw 'Managed TUN interface index is invalid' }
          if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') { throw 'Managed TUN IPv4 mismatch' }
          if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') { throw 'Managed TUN DNS mismatch' }
          $statusLines = @(& $env:EDGE_CURRENT_CONSOLE status $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Typed controller status failed: $LASTEXITCODE" }
          $serverIp = $null
          foreach ($line in $statusLines) {
            if ([string]$line -match '^Server IP\s+:\s+((?:\d{1,3}\.){3}\d{1,3})\s*$') {
              $serverIp = $Matches[1]
              break
            }
          }
          $parsedServerIp = [System.Net.IPAddress]::None
          if ([string]::IsNullOrWhiteSpace($serverIp) -or
              -not [System.Net.IPAddress]::TryParse($serverIp, [ref]$parsedServerIp) -or
              $parsedServerIp.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) {
            throw "Typed controller status did not expose a valid production server IPv4: $serverIp"
          }
          $serverRoute = Find-NetRoute -RemoteIPAddress $serverIp |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $serverRoute) { throw "No Windows best route exists for production server $serverIp" }
          if ([uint32]$serverRoute.InterfaceIndex -eq $tunIndex) {
            throw "Production server $serverIp is captured by managed TUN"
          }
          $serverAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$serverRoute.InterfaceIndex) -ErrorAction Stop

          $dns = Resolve-DnsName 'www.gstatic.com' -Type A -DnsOnly -ErrorAction Stop |
            Where-Object { $_.IPAddress } |
            Select-Object -First 1
          if (-not $dns -or [string]::IsNullOrWhiteSpace([string]$dns.IPAddress)) {
            throw 'Ordinary Windows DNS did not return an IPv4 address'
          }
          $route = Find-NetRoute -RemoteIPAddress ([string]$dns.IPAddress) |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $route -or [uint32]$route.InterfaceIndex -ne $tunIndex) {
            throw 'Ordinary Internet destination does not select managed TUN'
          }

          $http = (& curl.exe --noproxy '*' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $http -cne '204') {
            throw "Ordinary no-proxy Windows HTTPS failed through managed TUN: exit=$LASTEXITCODE http=$http"
          }

          $localHttp = (& curl.exe --proxy 'http://127.0.0.1:17891' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $localHttp -cne '204') {
            throw "Canonical local proxy failed with managed TUN: exit=$LASTEXITCODE http=$localHttp"
          }

          $meshRoute = Find-NetRoute -RemoteIPAddress '100.96.0.2' |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $meshRoute) { throw 'Foreign Mesh/device route is absent' }
          $meshAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$meshRoute.InterfaceIndex) -ErrorAction Stop
          if ([string]$meshAdapter.Name -cne 'CloudflareWARP') {
            throw "Foreign Mesh/device route escaped CloudflareWARP: $($meshAdapter.Name)"
          }
          if ([uint32]$meshRoute.InterfaceIndex -eq $tunIndex) {
            throw 'Managed TUN captured the foreign Mesh/device route'
          }

          $warpAdapter = Get-NetAdapter -Name 'CloudflareWARP' -ErrorAction Stop
          if ([string]$warpAdapter.Status -cne 'Up') {
            throw "Foreign CloudflareWARP adapter is not Up: $($warpAdapter.Status)"
          }
          $warpDns = @(
            Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
              ForEach-Object ServerAddresses
          )
          if ($warpDns -contains '172.31.255.2') {
            throw "Foreign CloudflareWARP still carries retired legacy TUN DNS 172.31.255.2: $($warpDns -join ',')"
          }

          Write-Host "managed_tun_server_bypass_ip=$serverIp"
          Write-Host "managed_tun_server_bypass_owner=$($serverAdapter.Name)"
          Write-Host 'managed_tun_server_bypass=PASS'
          Write-Host 'managed_tun_ordinary_dns=PASS'
          Write-Host 'managed_tun_ordinary_https=PASS'
          Write-Host 'managed_tun_local_proxy=PASS'
          Write-Host 'foreign_mesh_route_owner=CloudflareWARP'
          Write-Host "foreign_cloudflarewarp_dns=$($warpDns -join ',')"
          Write-Host "foreign_cloudflarewarp_tun_dns_repin=$($warpDns -contains '172.19.0.2')"

      - name: Refuse unproven automatic rollback after MANAGED_TUN verification failure
        if: ${{ failure() && steps.lifecycle_mutation.outcome == 'success' && (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'managed_tun_automatic_rollback=BLOCKED_NO_INDEPENDENT_DNS_RESTORE'
          throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: automatic rollback cannot prove CloudflareWARP DNS/control-channel recovery; preserve current runtime for independent diagnostics'

      - name: Final diagnostics and transport-only boundary
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for final verification'
          }
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Final diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $unknownFinal = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $finalManagedCount = [int]$values['managed_singbox_process_count']
          if ($unknownFinal.Count -gt 0) {
            if ($unknownFinal.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                $finalManagedCount -ne 0 -or [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$env:EDGE_PRIVILEGED_MANAGED_PID -cne [string]$unknownFinal[0] -or
                [string]$env:EDGE_PRIVILEGED_CONTROLLER_PID -cne [string]$values['scm_process_id']) {
              throw 'Final process identity is UNKNOWN without exact matching privileged evidence'
            }
            $finalManagedCount = 1
          }
          if ($env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $finalManagedCount -ne 1) {
            throw "Expected one managed proxy process after $env:EDGE_OPERATION, observed $finalManagedCount"
          }
          if ($env:EDGE_OPERATION -eq 'stop' -and ($finalManagedCount -ne 0 -or $unknownFinal.Count -ne 0)) {
            throw "Expected zero managed proxy processes after stop, observed $($values['managed_singbox_process_count'])"
          }
          $finalMode = [string]$values['windows_datapath_mode']
          $finalTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $finalMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Final datapath mode $finalMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          if ($finalMode -ceq 'ProxyOnly' -and $finalTun -cne 'false') { throw 'Final ProxyOnly state owns managed TUN' }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -eq 'stop' -and $finalTun -cne 'false') {
            throw 'Final explicit runtime stop left managed TUN present'
          }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop' -and $finalTun -cne 'true') {
            throw 'Final ManagedTun state is missing managed TUN'
          }
          if ($finalMode -notin @('ProxyOnly','ManagedTun')) { throw "Unsupported final datapath mode: $finalMode" }
          if ($env:EDGE_OPERATION -eq 'rollback' -and $finalMode -ceq 'ProxyOnly') {
            $warpDnsAfterTunRemoval = @(
              Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses
            )
            if ($warpDnsAfterTunRemoval -contains '172.19.0.2') {
              throw "Foreign CloudflareWARP still depends on removed managed TUN DNS after ProxyOnly rollback: $($warpDnsAfterTunRemoval -join ',')"
            }
            Write-Host "foreign_cloudflarewarp_dns_after_tun_removal=$($warpDnsAfterTunRemoval -join ',')"
            Write-Host 'foreign_cloudflarewarp_tun_dns_cleanup=PASS'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $signature = $externalPids -join ','
          if ($signature -cne $env:EDGE_EXTERNAL_PIDS_BEFORE) { throw 'External sing-box owner changed after verification' }
          foreach ($relative in @('state','runtime','logs')) {
            $path = Join-Path $env:EDGE_INSTALL_ROOT $relative
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries($path) | Out-Null } catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "Runner unexpectedly has direct private-state access: $relative" }
          }
          $doctor | Write-Host

      - name: Observe Cloudflare One effective client state (read-only)
        if: ${{ needs.resolve.outputs.operation == 'diagnose' }}
        shell: powershell
        run: |
          # Only observe an independently owned client. Never emit raw settings or
          # diagnostics: they can include private organization and network data.
          $ErrorActionPreference = 'Stop'
          $serviceState = 'UNKNOWN'
          $servicePid = 0
          try {
            $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='CloudflareWARP'" -ErrorAction Stop
            if ($null -ne $svc) {
              $serviceState = if ([string]$svc.State -ceq 'Running') { 'RUNNING' } else { 'NOT_RUNNING' }
              $servicePid = [int]$svc.ProcessId
            }
          } catch { $serviceState = 'UNKNOWN' }

          $listener = 'UNKNOWN'
          try {
            $dnsEndpoints = @(
              @(Get-NetUDPEndpoint -LocalPort 53 -ErrorAction Stop) +
              @(Get-NetTCPConnection -LocalPort 53 -State Listen -ErrorAction Stop)
            ) | Where-Object { $_.LocalAddress -in @('127.0.2.2','127.0.2.3') }
            $listener = if ($dnsEndpoints.Count -eq 0) { 'NOT_OBSERVED' }
                        elseif ($servicePid -gt 0 -and @($dnsEndpoints | Where-Object { [int]$_.OwningProcess -eq $servicePid }).Count -gt 0) { 'WARP_SERVICE_PROCESS' }
                        else { 'OTHER_OR_UNATTRIBUTED' }
          } catch { $listener = 'UNKNOWN' }

          # Only the installed vendor CLI at its exact standard path is allowed.
          # The child CLI is bounded; a timed-out child is closed, not warp-svc.
          $warpCli = Join-Path $env:ProgramFiles 'Cloudflare\Cloudflare WARP\warp-cli.exe'
          function Read-CloudflareClient([string]$verb) {
            if (-not (Test-Path -LiteralPath $warpCli -PathType Leaf)) {
              return @{ outcome = 'CLI_NOT_FOUND'; value = '' }
            }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $warpCli
            $psi.Arguments = $verb
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $child = New-Object System.Diagnostics.Process
            $child.StartInfo = $psi
            try {
              if (-not $child.Start()) { return @{ outcome = 'START_FAILED'; value = '' } }
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(10000)) {
                try { $child.Kill(); $child.WaitForExit(2000) | Out-Null } catch {}
                return @{ outcome = 'CLI_TIMEOUT'; value = '' }
              }
              if ($child.ExitCode -ne 0) { return @{ outcome = 'CLI_ERROR'; value = '' } }
              $value = $stdout.GetAwaiter().GetResult()
              if ($value.Length -gt 65536) { return @{ outcome = 'OVERSIZE'; value = '' } }
              return @{ outcome = 'OK'; value = $value }
            } catch {
              return @{ outcome = 'CLI_UNAVAILABLE'; value = '' }
            } finally { $child.Dispose() }
          }

          $status = Read-CloudflareClient 'status'
          $settings = Read-CloudflareClient 'settings'
          $connectivity = 'UNKNOWN'
          if ($status.outcome -ceq 'OK') {
            if ($status.value -match '\bConnected\b') { $connectivity = 'CONNECTED' }
            elseif ($status.value -match '\bDisconnected\b') { $connectivity = 'DISCONNECTED' }
          }
          $mode = 'UNKNOWN'
          $split = 'UNKNOWN'
          $profileHash = 'UNKNOWN'
          $splitHash = 'UNKNOWN'
          $fallback = 'UNKNOWN'
          $meshSplitExact = 'UNKNOWN'
          if ($settings.outcome -ceq 'OK') {
            $modeMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Mode:\s*(WarpWithDnsOverHttps|TunnelOnly|DnsOverHttps|WarpProxy|PostureOnly)\b')
            if ($modeMatch.Success) { $mode = $modeMatch.Groups[1].Value }
            $profileMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Profile ID:\s*([0-9a-fA-F-]{36})(?:\s|$)')
            if ($profileMatch.Success) {
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $profileHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($profileMatch.Groups[1].Value.ToLowerInvariant()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
            }
            $splitMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?(Exclude|Include) mode, with hosts/ips:')
            if ($splitMatch.Success) {
              $split = $splitMatch.Groups[1].Value.ToUpperInvariant()
              $section = $settings.value.Substring($splitMatch.Index + $splitMatch.Length)
              $nextField = [regex]::Match($section, '(?m)^\s*\([^)\r\n]+\)\s+\S[^:\r\n]*:')
              if ($nextField.Success) { $section = $section.Substring(0, $nextField.Index) }
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $splitHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($section.Trim()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
              $meshSplitExact = if ($section -match '(?m)^\s*100\.96\.0\.0/12(?:\s|$)') { 'YES' } else { 'NO' }
            }
            $fallback = if ($settings.value -match '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Fallback domains:') { 'PRESENT' } else { 'NOT_LISTED' }
          }
          # No registry NameServer or local listener proves a DNS writer or failover.
          Write-Host "cloudflare_one_service=$serviceState"
          Write-Host "cloudflare_one_local_dns_listener=$listener"
          Write-Host "cloudflare_one_cli_status=$($status.outcome)"
          Write-Host "cloudflare_one_connectivity=$connectivity"
          Write-Host "cloudflare_one_cli_settings=$($settings.outcome)"
          Write-Host "cloudflare_one_effective_mode=$mode"
          Write-Host "cloudflare_one_profile_id_sha256=$profileHash"
          Write-Host "cloudflare_one_split_tunnel_mode=$split"
          Write-Host "cloudflare_one_split_entries_sha256=$splitHash"
          Write-Host "cloudflare_one_split_mesh_cidr_exact=$meshSplitExact"
          Write-Host "cloudflare_one_local_domain_fallback=$fallback"
          Write-Host 'cloudflare_one_dns_writer=UNKNOWN'
          Write-Host 'cloudflare_one_no_tun_recovery=UNPROVEN'

      - name: Publish bounded lifecycle evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          @(
            "### Windows $env:EDGE_AFTER_MODE lifecycle",
            '- Operation: ${{ needs.resolve.outputs.operation }}',
            "- Before ReleaseSet: $env:EDGE_BEFORE_RELEASE",
            "- After ReleaseSet: $env:EDGE_AFTER_RELEASE",
            '- Local Windows build: NO',
            '- External sing-box mutation: FORBIDDEN / equality-checked',
            "- Expected mode: $env:EDGE_EXPECTED_MODE",
            "- Before mode: $env:EDGE_BEFORE_MODE",
            "- After mode: $env:EDGE_AFTER_MODE",
            "- TUN requested by desired state: $($env:EDGE_EXPECTED_MODE -ceq 'ManagedTun')",
            '- Foreign CloudflareWARP mutation: FORBIDDEN',
            '- External sing-box owner: FORBIDDEN / equality-checked'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
 -or
              $env:TARGET_RUNNER_LABEL -notmatch '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Observe existing ACTIVE and plan exact stopped release-only change
        id: active_preflight
        shell: pwsh
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_WINDOWS_APPLY_POLICY: EXISTING_ACTIVE_RELEASE_ONLY
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          $observed = @(& $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -ExistingActive -Preflight)
          if (-not $?) { throw 'WINDOWS_APPLY_BLOCKED: native SYSTEM ACTIVE preflight failed' }
          $from = @($observed | Where-Object { [string]$_ -cmatch '^windows_offline_source_release=[0-9a-f]{64}$' })
          $needed = @($observed | Where-Object { [string]$_ -cmatch '^windows_offline_transition_needed=(True|False)$' })
          if ($from.Count -ne 1 -or $needed.Count -ne 1 -or
              @($observed | Where-Object { [string]$_ -ceq 'windows_credential_policy=EXISTING_ACTIVE_RELEASE_ONLY' }).Count -ne 1) {
            throw 'WINDOWS_APPLY_BLOCKED: ambiguous status/plan result'
          }
          $source = ([string]$from[0]).Split('=',2)[1]
          $upgrade = ([string]$needed[0]).Split('=',2)[1] -ceq 'True'
          "source_release=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "needs_upgrade=$($upgrade.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $upgrade) { Write-Host 'windows_apply=NOOP_CURRENT_RELEASE_ACTIVE_UNCHANGED' }
      - name: Record immutable release-only BEGIN once before SYSTEM mutation
        if: steps.active_preflight.outputs.needs_upgrade == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE: ${{ steps.active_preflight.outputs.source_release }}
          TARGET_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          TARGET_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:SOURCE_RELEASE -notmatch '^[0-9a-f]{64}$' -or
              $env:TARGET_RELEASE -notmatch '^[0-9a-f]{64}$' -or
              $env:SOURCE_RELEASE -ceq $env:TARGET_RELEASE) {
            throw 'WINDOWS_APPLY_BLOCKED: exact first-attempt source and target required'
          }
          $reader = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\read-complete-gh-journal.ps1'
          $history = @(& $reader)
          $marker = '<!-- sing-box-windows-active-release-apply/v1 -->'
          foreach ($prior in @($history | Where-Object { [string]$_.body -like "*$marker*" })) {
            $body = [string]$prior.body
            if (-not $body.StartsWith("$marker`n")) { throw 'WINDOWS_APPLY_BLOCKED: malformed earlier intent' }
            $record = ConvertFrom-Json -InputObject $body.Substring($marker.Length + 1)
            if ([string]$record.schema -cne 'sing-box.windows-active-release-apply/v1') {
              throw 'WINDOWS_APPLY_BLOCKED: mismatched intent schema'
            }
            if ([string]$record.source_release_set_sha256 -ceq $env:SOURCE_RELEASE -or
                [string]$record.target_release_set_sha256 -ceq $env:TARGET_RELEASE) {
              throw 'WINDOWS_APPLY_BLOCKED: prior unresolved source or target attempt; read-only reconcile'
            }
          }
          $record = [ordered]@{
            schema = 'sing-box.windows-active-release-apply/v1'
            phase = 'BEGIN'
            github_run_id = [long]$env:GITHUB_RUN_ID
            source_release_set_sha256 = $env:SOURCE_RELEASE
            target_release_set_sha256 = $env:TARGET_RELEASE
            target_revision = $env:TARGET_REVISION
            mutation_scope = 'PROGRAM_ONLY_EXISTING_ACTIVE'
          }
          $body = $marker + "`n" + ($record | ConvertTo-Json -Compress)
          & gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$body" > $null
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPLY_UNKNOWN: journal write uncertain; no replay' }
          $readback = @(& $reader)
          if (@($readback | Where-Object { [string]$_.body -ceq $body }).Count -ne 1) {
            throw 'WINDOWS_APPLY_UNKNOWN: exact once-only intent not confirmed; no replay'
          }
          Write-Host 'windows_release_only_intent=COMMITTED_ONCE'
      - name: Single native SYSTEM offline release apply and bounded readback
        if: steps.active_preflight.outputs.needs_upgrade == 'true'
        shell: pwsh
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_WINDOWS_APPLY_POLICY: EXISTING_ACTIVE_RELEASE_ONLY
          SOURCE_RELEASE: ${{ steps.active_preflight.outputs.source_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -ExistingActive -ExpectedSourceReleaseSet $env:SOURCE_RELEASE
          if (-not $?) { throw 'WINDOWS_APPLY_UNKNOWN: native result uncertain; do not replay' }
          Write-Host 'windows_apply=PASS_STOPPED_PROGRAM_ONLY'
          Write-Host 'credential_origin=UNPROVEN_NOT_CREDENTIAL_MUTATION_AUTHORITY'

  initial_first_use_prepare:
    name: Windows / exactly stopped immutable upgrade BEFORE first-use BEGIN
    needs: resolve
    if: needs.resolve.outputs.operation == 'initial-pair-prepare'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 18
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact accepted native release owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Verify installed native capability and all preconditions before journalling
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -Preflight
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_UPGRADE_BLOCKED: native preflight failed before durable intent' }
      - name: Persist exactly one immutable program-upgrade intent BEFORE native mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          ACCEPTED_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'FIRST_USE_UPGRADE_BLOCKED: replay forbidden' }
          $reader = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\read-complete-gh-journal.ps1'
          $history = @(& $reader)
          $staging = @($history | Where-Object { [string]$_.body -like '*<!-- sing-box-windows-persistent-initial-stage/*' })
          if ($staging.Count -ne 0) { throw 'FIRST_USE_UPGRADE_BLOCKED: staging already begun; reconcile instead' }
          $attempts = @($history | Where-Object { [string]$_.body -like '*<!-- sing-box-windows-program-prepare/*' })
          if ($attempts.Count -ne 0) { throw 'FIRST_USE_UPGRADE_BLOCKED: program-upgrade intent already recorded; reconcile only' }
          $marker = '<!-- sing-box-windows-program-prepare/v1 -->'
          $record = [ordered]@{
            schema = 'sing-box.windows-program-prepare/v1'
            phase = 'BEGIN'
            original_run_id = [long]$env:SOURCE_RUN_ID
            github_run_id = [long]$env:GITHUB_RUN_ID
            source_revision = $env:ACCEPTED_REVISION
            release_set_sha256 = $env:ACCEPTED_RELEASE
          }
          $body = $marker + "`n" + ($record | ConvertTo-Json -Compress)
          & gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$body" > $null
          if ($LASTEXITCODE -ne 0) { throw 'FIRST_USE_UPGRADE_UNKNOWN: durable intent write uncertain; no replay' }
          $readback = @(& $reader)
          if (@($readback | Where-Object { [string]$_.body -ceq $body }).Count -ne 1) {
            throw 'FIRST_USE_UPGRADE_UNKNOWN: exactly-one durable intent readback unproven; no replay'
          }
          Write-Host 'first_use_upgrade_intent=COMMITTED_ONCE'
          Write-Host 'credential_staging_begin=NOT_WRITTEN'
      - name: Execute one stopped native offline ReleaseSet upgrade with bounded readback
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}'
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_UPGRADE_UNKNOWN: native offline handoff incomplete; do not replay' }
          Write-Host 'first_use_binary_prepare=EXACT_STOPPED_RELEASE_ACCEPTED'
          Write-Host 'first_use_staging_begin=NOT_WRITTEN'
          Write-Host 'credential_pair_committed=false'

  initial_first_use_preflight:
    name: Windows / read-only installed-owner capability before BEGIN
    needs: resolve
    if: needs.resolve.outputs.operation == 'initial-pair-stage'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 8
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout exact accepted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Verify installed native CLI and private SYSTEM cursor before marker
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $handoff -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -Preflight -RequireCurrentRelease
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'FIRST_USE_PREBEGIN_BLOCKED: installed native capability not proven'
          }

  initial_first_use_reservation:
    name: Windows / single-use durable candidate staging BEGIN
    needs: [resolve, initial_first_use_preflight]
    if: needs.resolve.outputs.operation == 'initial-pair-stage' && needs.initial_first_use_preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: credential-transaction-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Persist exact single-use staging authorization before host mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ needs.resolve.outputs.source_run_id }}
          GENERATION: ${{ needs.resolve.outputs.initial_generation }}
          SLOT: ${{ needs.resolve.outputs.initial_slot }}
          RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REPOSITORY" = 'iamaman11/sing-box'
          test "$ORIGINAL_RUN" = "$GENERATION"
          [[ "$RELEASE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SLOT" == A || "$SLOT" == B ]]
          history="$RUNNER_TEMP/initial-history.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" |
            jq -s 'add' > "$history"
          jq -e --argjson original "$ORIGINAL_RUN" --arg slot "$SLOT" '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->"))] |
            if length==1 then .[0] else error("not exactly one original issue BEGIN") end |
            split("\n") |
            if length==2 then .[1]|fromjson else error("original BEGIN malformed") end |
            .schema=="sing-box.credential-initial-attempt/v1" and
            .phase=="BEGIN" and .generation==$original and
            .github_run_id==$original and .slot==$slot
          ' "$history" >/dev/null
          jq -e '
            [.[]|.body|select(contains("<!-- sing-box-windows-persistent-initial-stage/"))]|length==0
          ' "$history" >/dev/null
          marker='<!-- sing-box-windows-persistent-initial-stage/v1 -->'
          record="$(jq -nc --argjson source "$ORIGINAL_RUN" \
            --argjson run "$GITHUB_RUN_ID" --arg slot "$SLOT" \
            --arg release "$RELEASE" --arg revision "$GITHUB_SHA" \
            '{schema:"sing-box.windows-persistent-initial-stage/v1",phase:"BEGIN",original_run_id:$source,github_run_id:$run,slot:$slot,release_set_sha256:$release,source_revision:$revision}')"
          body="$(printf '%s\n%s' "$marker" "$record")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/26/comments" \
            --raw-field "body=$body" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" |
            jq -s 'add' > "$history"
          jq -e --arg body "$body" '
            [.[]|.body|select(contains("<!-- sing-box-windows-persistent-initial-stage/"))] |
            length==1 and .[0]==$body
          ' "$history" >/dev/null
          echo 'first_use_stage_begin=COMMITTED_ONCE'
          echo 'credential_mutations=0'

  initial_first_use_stage:
    name: Windows / native persistent first-use candidate
    needs: [resolve, initial_first_use_reservation]
    if: needs.resolve.outputs.operation == 'initial-pair-stage' && needs.initial_first_use_reservation.result == 'success'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 18
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: One SYSTEM-owned offline candidate stage and native validation
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_FIRST_USE_TARGET_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
          EDGE_FIRST_USE_TARGET_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          FIRST_USE_GENERATION: ${{ needs.resolve.outputs.initial_generation }}
          FIRST_USE_SLOT: ${{ needs.resolve.outputs.initial_slot }}
        run: |
          $ErrorActionPreference = 'Stop'
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          # The irreversible GitHub BEGIN is already persisted. No release
          # download/install, SCM retarget or fallback is permitted after BEGIN.
          & $handoff -AcceptedRevision $env:EDGE_FIRST_USE_TARGET_REVISION -ReleaseSetSha256 $env:EDGE_FIRST_USE_TARGET_RELEASE -Preflight -RequireCurrentRelease
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_STAGE_BLOCKED: exact previously prepared Windows release was not preserved' }
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-initial-pair-stage.ps1'
          & $script -Generation ([long]$env:FIRST_USE_GENERATION) -Slot $env:FIRST_USE_SLOT
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'Windows initial stage ended without confirmed evidence' }

  physical:
    if: needs.resolve.outputs.operation != 'acceptance-reconcile' && needs.resolve.outputs.operation != 'initial-pair-stage' && needs.resolve.outputs.operation != 'initial-pair-prepare' && needs.resolve.outputs.operation != 'apply'
    name: Windows / ${{ needs.resolve.outputs.operation }}
    needs: resolve
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 20
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:45151
      EDGE_ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.resolve.outputs.release_set_sha256 }}
      EDGE_OPERATION: ${{ needs.resolve.outputs.operation }}
      EDGE_READONLY_PURPOSE: ${{ needs.resolve.outputs.readonly_purpose }}
      EDGE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
    steps:
      - name: Observe safe Windows state (read-only)
        if: ${{ needs.resolve.outputs.operation == 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if ($root -cne 'C:\sing-box' -or
              $workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: root/workspace isolation'
          }
          $current = Join-Path $root 'current.pb'
          $stable = Join-Path $root 'bin\edge-diagnostic.exe'
          if (-not (Test-Path -LiteralPath $stable -PathType Leaf)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: stable diagnostic missing'
          }
          function Read-Doctor([string]$binary) {
            $output = @(& $binary doctor $current)
            $code = $LASTEXITCODE
            $values = @{}
            foreach ($line in $output) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
            }
            return @{ values = $values; code = $code }
          }
          function Assert-Doctor([hashtable]$observation) {
            $v = $observation['values']
            if ([string]$v['exact_release_files'] -cne 'PASS' -or
                [string]$v['scm_service_name'] -cne 'EdgePlatformController' -or
                [string]$v['release_set_sha256'] -notmatch '^[0-9a-f]{64}$' -or
                [string]$v['windows_datapath_mode'] -notin @('ManagedTun','ProxyOnly') -or
                [string]$v['scm_start_type'] -notin @('AutoStart','OnDemand','Disabled')) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: exact release/SCM/mode incomplete'
            }
            $cleanStopped = (
              [string]$v['scm_state'] -ceq 'Stopped' -and
              [string]$v['managed_tun_present'] -ceq 'false' -and
              [string]$v['managed_singbox_process_count'] -ceq '0' -and
              [string]$v['orphan_singbox_process_count'] -ceq '0' -and
              [string]$v['conflicting_singbox_process_count'] -ceq '0' -and
              [string]$v['unknown_singbox_process_count'] -ceq '0'
            )
            if ($observation['code'] -ne 0 -and -not $cleanStopped) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: failed doctor without exact clean stopped evidence'
            }
            return $cleanStopped
          }
          $a = Read-Doctor $stable
          $stoppedA = Assert-Doctor $a
          $exact = [string]$a['values']['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($exact) -or -not (Test-Path -LiteralPath $exact -PathType Leaf)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: exact diagnostic missing'
          }
          $b = Read-Doctor $exact
          $stoppedB = Assert-Doctor $b
          if ($stoppedA -ne $stoppedB) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: stopped state drift' }
          foreach ($key in @('release_set_sha256','windows_datapath_mode','scm_state','scm_start_type',
              'managed_tun_present','managed_singbox_process_count','orphan_singbox_process_count',
              'conflicting_singbox_process_count','unknown_singbox_process_count')) {
            if ([string]$a['values'][$key] -cne [string]$b['values'][$key]) {
              throw "READ_ONLY_DIAGNOSE_BLOCKED: observation changed in $key"
            }
          }
          $v = $b['values']
          $desired = if ([string]$v['windows_datapath_mode'] -cne $env:EDGE_EXPECTED_MODE) { 'DEGRADED_INSTALLED_MODE' }
              elseif ($stoppedB -and $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun') { 'DEGRADED_STOPPED' }
              elseif ($b['code'] -eq 0) { 'PASS' } else { 'DEGRADED' }
          $safety = if ($stoppedB -and [string]$v['scm_start_type'] -ceq 'AutoStart') {
              'BLOCKED_STOPPED_OWNER_AUTOSTART'
            } else { 'BLOCKED_NO_INDEPENDENT_DNS_CONTROL_RECOVERY' }
          Write-Host 'observation_status=PASS'
          Write-Host "desired_state_status=$desired"
          Write-Host "scm_state=$([string]$v['scm_state'])"
          Write-Host "scm_start_type=$([string]$v['scm_start_type'])"
          Write-Host "managed_tun_present=$([string]$v['managed_tun_present'])"
          Write-Host "release_set_sha256=$([string]$v['release_set_sha256'])"
          Write-Host "managed_tun_restart_safety=$safety"
          Write-Host 'independent_no_tun_dns_control_recovery=UNPROVEN'
          # A single bounded SYSTEM observation, without runner access to
          # persistent secrets. No raw detail lines appear in public job logs.
          $ownerConsole = [string]$v['console_path']
          $ownerDetail = ''
          if (-not [string]::IsNullOrWhiteSpace($ownerConsole) -and
              (Test-Path -LiteralPath $ownerConsole -PathType Leaf)) {
            $ownerOutput = @(& $ownerConsole privileged-runtime-evidence --install-root $root)
            $ownerExit = $LASTEXITCODE
            $detailRows = @($ownerOutput | Where-Object { [string]$_ -like 'detail=runtime_evidence=BOUNDED_READ_ONLY;*' })
            if ($ownerExit -eq 0 -and $detailRows.Count -eq 1) {
              $ownerDetail = [string]$detailRows[0]
            }
          }
          function Read-BoundedField([string]$key, [string]$accepted) {
            if ([string]::IsNullOrEmpty($ownerDetail)) { return 'UNKNOWN' }
            $matches = [regex]::Matches($ownerDetail, '(?:^|;)' + [regex]::Escape($key) + '=([^;]*)')
            if ($matches.Count -ne 1) { return 'UNKNOWN' }
            $value = $matches[0].Groups[1].Value
            if ($value -cnotmatch $accepted) { return 'UNKNOWN' }
            return $value
          }
          $fields = @(
            ,@('credential_cursor','^(ABSENT|VALID)$')
            ,@('credential_active_present','^(true|false)$')
            ,@('credential_active_generation','^(0|[1-9][0-9]*)$')
            ,@('credential_active_slot','^(A|B|NONE|UNKNOWN)$')
            ,@('credential_candidate_present','^(true|false)$')
            ,@('credential_candidate_generation','^(0|[1-9][0-9]*)$')
            ,@('credential_candidate_slot','^(A|B|NONE|UNKNOWN)$')
            ,@('credential_previous_present','^(true|false)$')
            ,@('credential_active_sha256','^(ABSENT|[0-9a-f]{64})$')
            ,@('credential_candidate_sha256','^(ABSENT|[0-9a-f]{64})$')
            ,@('credential_initial_commit_receipt_present','^(true|false)$')
            ,@('credential_initial_recovery_receipt_present','^(true|false)$')
            ,@('first_use_runtime','^(ABSENT|PRESENT)$')
            ,@('first_use_config','^(ABSENT|PRESENT)$')
            ,@('first_use_access_identity','^(ABSENT|INVALID|PRESENT_NONEMPTY_UNVERIFIED)$')
            ,@('credential_lifecycle_state','^(FRESH_LOCAL_ONLY|FRESH_NEEDS_IDENTITY|EXISTING_ACTIVE_UNVERIFIED|EXISTING_CANDIDATE_UNVERIFIED|EXISTING_TRANSITION_UNVERIFIED|PARTIAL|UNKNOWN)$')
            ,@('credential_next_action','^(JOURNAL_AUTHORIZATION_REQUIRED|NATIVE_IDENTITY_BOOTSTRAP_REQUIRED|READ_ONLY_ORIGIN_RECONCILE|READ_ONLY_RECONCILE)$')
          )
          Write-Host "credential_evidence_status=$(if ($ownerDetail) { 'BOUNDED_READ_ONLY' } else { 'UNAVAILABLE' })"
          foreach ($entry in $fields) {
            $key = [string]$entry[0]
            Write-Host "$key=$(Read-BoundedField $key ([string]$entry[1]))"
          }
          Write-Host 'credential_origin=UNPROVEN'
          if ($stoppedB) {
            $route = Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop |
              Sort-Object RouteMetric,InterfaceMetric | Select-Object -First 1
            if ($null -eq $route -or [int]$route.InterfaceIndex -le 0) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: IPv4 default route missing'
            }
            $adapter = Get-NetAdapter -InterfaceIndex ([int]$route.InterfaceIndex) -ErrorAction Stop
            if ([string]$adapter.Name -ceq 'sing-box-tun') {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: route captured by sing-box'
            }
            Write-Host "direct_default_adapter=$($adapter.Name)"
            Write-Host "direct_default_gateway=$($route.NextHop)"
            $servers = @(Get-DnsClientServerAddress -InterfaceIndex ([int]$route.InterfaceIndex) -AddressFamily IPv4 -ErrorAction Stop |
              ForEach-Object ServerAddresses)
            if ($servers.Count -eq 0) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: IPv4 resolver missing' }
            Write-Host "direct_dns_server_count=$($servers.Count)"
            $dns = @(Resolve-DnsName www.gstatic.com -Type A -DnsOnly -ErrorAction Stop |
              Where-Object { $_.IPAddress })
            if ($dns.Count -eq 0) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: independent DNS failed' }
            Write-Host 'direct_dns_resolution=PASS'
            $http = (& curl.exe --noproxy '*' --silent --show-error --fail --connect-timeout 8 --max-time 15 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
            if ($LASTEXITCODE -ne 0 -or $http -cne '204') {
              throw "READ_ONLY_DIAGNOSE_BLOCKED: direct HTTPS failed exit=$LASTEXITCODE status=$http"
            }
            Write-Host 'direct_no_proxy_https=PASS'
          }
          if ($env:EDGE_READONLY_PURPOSE -ceq 'offline-preflight') {
            # This operator read-only preview must cover both safe source
            # states supported by the native first-use offline handoff.
            $formerManagedTun = (
              [string]$v['windows_datapath_mode'] -ceq 'ManagedTun' -and
              $desired -ceq 'DEGRADED_INSTALLED_MODE' -and
              [string]$v['scm_start_type'] -ceq 'AutoStart'
            )
            $stoppedProxyOnly = (
              [string]$v['windows_datapath_mode'] -ceq 'ProxyOnly' -and
              $desired -ceq 'PASS' -and
              [string]$v['scm_start_type'] -ceq 'OnDemand'
            )
            if (-not $stoppedB -or $env:EDGE_EXPECTED_MODE -cne 'ProxyOnly' -or
                (-not $formerManagedTun -and -not $stoppedProxyOnly)) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: requires exact stopped ManagedTun or manual ProxyOnly with no TUN'
            }
            $installed = [string]$v['release_set_sha256']
            $target = [string]$env:EDGE_RELEASE_SET_SHA256
            if ($target -notmatch '^[0-9a-f]{64}$' -or $installed -cnotmatch '^[0-9a-f]{64}$') {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: installed or accepted target identity is malformed'
            }
            $console = [string]$v['console_path']
            if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: exact installed immutable console missing'
            }
            $privileged = @(& $console privileged-runtime-evidence --install-root $root)
            if ($LASTEXITCODE -ne 0) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: installed privileged evidence task unreachable'
            }
            $detail = @($privileged | Where-Object { [string]$_ -like 'detail=*' })
            if ($detail.Count -ne 1 -or
                [string]$detail[0] -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY;' -or
                [string]$detail[0] -notmatch ';process_classification=ABSENT;process_evidence_complete=true;process_count=0;' -or
                [string]$detail[0] -notmatch ';external_owner_evidence=INCOMPLETE;external_count=0(?:;|$)') {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: privileged task could not attest zero managed and external owners'
            }
            $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='EdgePlatformController'" -ErrorAction Stop
            $expectedStartMode = if ($formerManagedTun) { 'Auto' } else { 'Manual' }
            if ($null -eq $service -or [string]$service.State -cne 'Stopped' -or
                [string]$service.StartMode -cne $expectedStartMode) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: SCM state or startup mode changed'
            }
            $installedCommands = @(& $console --help)
            if ($LASTEXITCODE -ne 0) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: exact installed console command contract unreadable'
            }
            $offlineCommandAdvertised = @(
              $installedCommands | Where-Object { [string]$_ -match '\bprivileged-offline-activate\b' }
            ).Count -gt 0
            if (-not $offlineCommandAdvertised) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: immutable installed native owner cannot perform offline upgrade'
            }
            Write-Host "offline_source_mode=$([string]$v['windows_datapath_mode'])"
            Write-Host 'offline_preflight_observation=PASS'
            Write-Host 'offline_privileged_task_readonly=PASS'
            Write-Host "offline_command_advertised=$offlineCommandAdvertised"
            Write-Host 'offline_zero_runtime_owners=PASS'
            Write-Host "offline_installed_release=$installed"
            Write-Host "offline_accepted_target_release=$target"
            Write-Host "offline_release_transition_needed=$($installed -cne $target)"
            Write-Host 'offline_native_activation=NOT_EXECUTED_READ_ONLY_PREFLIGHT'
            Write-Host 'offline_mutations_performed=0'
            Write-Host 'offline_service_or_tun_restarted=false'
            @(
              '### Offline handoff preflight (read-only)',
              '- Native privileged task: reachable / zero runtime owners',
              "- Installed release: $installed",
              "- Accepted release: $target",
              '- Offline activation: not executed; installed CLI capability observed above',
              '- Changes to Windows service / TUN / DNS / routes: none'
            ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          foreach ($name in @('state','runtime','logs')) {
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries((Join-Path $root $name)) | Out-Null }
            catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "READ_ONLY_DIAGNOSE_BLOCKED: runner can read private state: $name" }
          }
          @(
            '### Windows read-only observation',
            '- Observation: PASS',
            "- Desired state: $desired",
            "- SCM: $([string]$v['scm_state'])",
            "- TUN: $([string]$v['managed_tun_present'])",
            "- Startup: $([string]$v['scm_start_type'])",
            "- Safety: $safety",
            '- Independent DNS/control recovery: UNPROVEN'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Assert isolated root and observe pre-state
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_INSTALL_ROOT -cne 'C:\sing-box') { throw 'Unexpected install root' }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          if ($workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Runner workspace overlaps managed install root'
          }
          $stableDiagnostic = Join-Path $root 'bin\edge-diagnostic.exe'
          if (-not (Test-Path -LiteralPath $stableDiagnostic -PathType Leaf)) { throw 'Installed stable diagnostic is missing' }
          $current = Join-Path $root 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact active release files'
          }

          # A verified installed ProxyOnly release can be intentionally Stopped;
          # unlike ManagedTun this never requires host TUN teardown.
          $proxyOnlyStopped = (
            $env:EDGE_OPERATION -in @('start','stop','converge') -and
            $env:EDGE_EXPECTED_MODE -ceq 'ProxyOnly' -and
            [string]$bootstrapValues['windows_datapath_mode'] -ceq 'ProxyOnly' -and
            [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
            [string]$bootstrapValues['scm_start_type'] -ceq 'OnDemand' -and
            [string]$bootstrapValues['managed_tun_present'] -ceq 'false' -and
            [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['orphan_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['unknown_singbox_process_count'] -eq 0
          )
          $stoppedOwnerRecovery = $false
          $cleanStoppedBootstrap = $false
          $runningLegacyDiagnosticRecovery = $false
          $legacyManagedPid = ''
          if ($bootstrapExit -ne 0) {
            $boundedStoppedOwner = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1
            )
            $boundedCleanStopped = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['exact_release_files'] -ceq 'PASS' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 0 -and
              [string]$bootstrapValues['managed_tun_present'] -ceq 'false'
            )
            # Only the installed known broken diagnostic may use this one-time
            # upgrade path. SCM parent match is not sufficient as authority.
            $legacyCandidates = @(
              $bootstrapDoctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $boundedRunningLegacy = (
              $env:EDGE_OPERATION -eq 'converge' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun' -and
              [string]$bootstrapValues['release_set_sha256'] -ceq '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -and
              [string]$env:EDGE_RELEASE_SET_SHA256 -cne [string]$bootstrapValues['release_set_sha256'] -and
              [string]$bootstrapValues['windows_datapath_mode'] -ceq 'ManagedTun' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Running' -and
              [string]$bootstrapValues['scm_process_id'] -match '^\d+$' -and
              [string]$bootstrapValues['scm_executable_matches_release'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_present'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_pid'] -ceq [string]$bootstrapValues['scm_process_id'] -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['orphan_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1 -and
              $legacyCandidates.Count -eq 1 -and
              ($legacyCandidates[0].Split(':')[1]) -ceq [string]$bootstrapValues['scm_process_id']
            )
            if ($boundedRunningLegacy) {
              # The installed old doctor returns before network observations.
              # Prove TUN from read-only OS state, not a missing doctor field.
              $adapters = @(Get-NetAdapter -Name 'sing-box-tun' -ErrorAction Stop)
              if ($adapters.Count -ne 1 -or [string]$adapters[0].Status -cne 'Up') {
                throw 'Legacy managed TUN adapter is not uniquely Up'
              }
              $tunIf = [int]$adapters[0].ifIndex
              $ips = @(Get-NetIPAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                Where-Object { $_.IPAddress -ceq '172.19.0.1' -and $_.PrefixLength -eq 30 })
              if ($ips.Count -ne 1) { throw 'Legacy managed TUN exact IPv4 address is absent' }
              $tunDns = @(Get-DnsClientServerAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses)
              if ($tunDns -notcontains '172.19.0.2') {
                throw 'Legacy managed TUN DNS is not on the canonical interface'
              }
              Write-Host 'legacy_managed_tun_os_readonly=PASS'
            }
            if (-not $proxyOnlyStopped -and -not $boundedStoppedOwner -and -not $boundedCleanStopped -and -not $boundedRunningLegacy) {
              throw "Stable pre-state diagnostic failed: $bootstrapExit"
            }

            $stableConsole = Join-Path $root 'bin\edge-console.exe'
            if (-not (Test-Path -LiteralPath $stableConsole -PathType Leaf)) {
              throw 'Installed stable console is missing for bounded recovery evidence'
            }
            $recoveryEvidence = @(& $stableConsole privileged-runtime-evidence --install-root $root)
            $recoveryEvidenceExit = $LASTEXITCODE
            $recoveryEvidence | Write-Host
            if ($recoveryEvidenceExit -ne 0) {
              throw "Bounded privileged evidence failed: $recoveryEvidenceExit"
            }
            $recoveryDetail = [string]($recoveryEvidence |
              Where-Object { [string]$_ -like 'detail=*' } |
              Select-Object -Last 1)
            if ([string]::IsNullOrWhiteSpace($recoveryDetail) -or
                $recoveryDetail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
              throw 'Bounded recovery did not return the privileged evidence contract'
            }
            if ($recoveryDetail -notmatch 'external_owner_evidence=INCOMPLETE;external_count=0(?:;|$)') {
              throw 'Bounded recovery still observes privileged external sing-box ownership'
            }

            if ($boundedRunningLegacy) {
              $parts = $legacyCandidates[0].Split(':')
              $owner = [regex]::Escape([string]$bootstrapValues['scm_process_id'])
              $child = [regex]::Escape([string]$parts[0])
              if ($recoveryDetail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                  $recoveryDetail -notmatch ';external_count=0(?:;|$)' -or
                  $recoveryDetail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
                throw 'Old diagnostic disagreement lacks exact SYSTEM managed-owner proof'
              }
              $legacyManagedPid = [string]$parts[0]
              $runningLegacyDiagnosticRecovery = $true
              Write-Host 'running_legacy_diagnostic=PRIVILEGED_EXACT_PROOF'
            } elseif ($proxyOnlyStopped) {
              Write-Host 'proxy_only_stopped_owner=VERIFIED_NO_TUN'
            } elseif ($boundedStoppedOwner) {
              $stoppedOwnerRecovery = $true
              "EDGE_STOPPED_OWNER_RECOVERY=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Recovering stopped SCM owner only after privileged evidence proved zero external sing-box owners'
            } else {
              $cleanStoppedBootstrap = $true
              "EDGE_CLEAN_STOPPED_BOOTSTRAP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Bootstrapping Release A from the already-proven clean stopped ManagedTun state'
            }
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ($doctorExit -ne 0 -and -not $proxyOnlyStopped -and -not $stoppedOwnerRecovery -and -not $cleanStoppedBootstrap -and -not $runningLegacyDiagnosticRecovery) {
            throw "Exact pre-state diagnostic failed: $doctorExit"
          }
          if ($stoppedOwnerRecovery) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1) {
              throw 'Stopped-owner recovery evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'stopped_owner_recovery_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CONFLICT'
            }
          }
          if ($cleanStoppedBootstrap) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['managed_tun_present'] -cne 'false') {
              throw 'Clean stopped bootstrap evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'clean_stopped_bootstrap_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CLEAN_STATE'
            }
          }
          if ($runningLegacyDiagnosticRecovery) {
            $exactCandidates = @(
              $doctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $expectedPair = ([string]$legacyManagedPid) + ':' + ([string]$values['scm_process_id'])
            if ([string]$values['release_set_sha256'] -cne '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_executable_matches_release'] -cne 'true' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1 -or
                $exactCandidates.Count -ne 1 -or
                $exactCandidates[0] -cne $expectedPair -or
                [string]$values['scm_process_id'] -cne [string]$bootstrapValues['scm_process_id']) {
              throw 'Legacy active runtime changed after bounded SYSTEM owner proof'
            }
            $LASTEXITCODE = 0
            Write-Host 'running_legacy_diagnostic_exit=NORMALIZED_AFTER_PRIVILEGED_EXACT_PROOF'
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') {
            throw 'Exact active diagnostic could not verify its ReleaseSet files'
          }
          $currentRelease = [string]$values['release_set_sha256']
          if ($env:EDGE_OPERATION -eq 'repair' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Repair target must equal the exact current ReleaseSet before runtime stop'
          }
          $currentMode = [string]$values['windows_datapath_mode']
          $currentTun = if ($runningLegacyDiagnosticRecovery) { 'true' } else { [string]$values['managed_tun_present'] }
          # Independent ProxyOnly/no-TUN teardown remains unsupported. A strictly
          # managed-TUN previous-release rollback is an explicit release handoff,
          # not permission to stop the host TUN or mutate foreign DNS ownership.
          if ($env:EDGE_OPERATION -eq 'stop' -and $currentMode -cne 'ProxyOnly') {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: ManagedTun stop requires independent DNS/control restoration'
          }
          if ($env:EDGE_OPERATION -eq 'rollback') {
            if ($currentMode -cne 'ManagedTun' -or $env:EDGE_EXPECTED_MODE -cne 'ManagedTun' -or
                $currentTun -cne 'true' -or $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256 -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_executable_matches_release'] -cne 'true' -or
                [string]$values['controller_listener_present'] -cne 'true' -or
                [string]$values['controller_listener_pid'] -cne [string]$values['scm_process_id']) {
              throw 'PRE_MUTATION_ROLLBACK_BLOCKED: exact accepted Running ManagedTun owner required'
            }
            $foreignAdapter = Get-NetAdapter -Name 'CloudflareWARP' -ErrorAction Stop
            $foreignDns = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
            $routerDns = @(Get-DnsClientServerAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
            if ([string]$foreignAdapter.Status -cne 'Up' -or
                ($foreignDns -join ',') -cne '172.19.0.2,192.168.100.1' -or
                ($routerDns -join ',') -cne '192.168.100.1') {
              throw 'PRE_MUTATION_ROLLBACK_BLOCKED: foreign CloudflareWARP/Ethernet DNS or owner differs from accepted no-TUN rescue baseline'
            }
            Write-Host 'managed_tun_previous_rollback_dns_owner_preflight=PASS'
          }
          if ($currentMode -ceq 'ManagedTun' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ProxyOnly' -and
              $env:EDGE_OPERATION -in @('converge','repair')) {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: ManagedTun to ProxyOnly requires independent DNS/control-channel recovery'
          }
          switch ($currentMode) {
            'ProxyOnly' {
              if ($currentTun -cne 'false' -or
                  [string]$values['scm_start_type'] -cne 'OnDemand' -or
                  [string]$values['scm_executable_matches_release'] -cne 'true' -or
                  [string]$values['scm_state'] -notin @('Stopped','Running')) {
                throw 'PROXY_ONLY_SCM_BLOCKED: expected immutable Manual-start owner with no TUN'
              }
              if ($env:EDGE_OPERATION -eq 'converge' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
                if ([string]$values['scm_state'] -cne 'Stopped' -or
                    [int]$values['managed_singbox_process_count'] -ne 0 -or
                    [int]$values['orphan_singbox_process_count'] -ne 0 -or
                    [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                    [int]$values['unknown_singbox_process_count'] -ne 0) {
                  throw 'PROXY_ONLY_SCM_BLOCKED: release upgrade requires explicitly Stopped clean ProxyOnly; stop first'
                }
                Write-Host 'proxy_only_upgrade=EXACT_OFFLINE_CURRENT_TO_ACCEPTED'
              }
            }
            'ManagedTun' {
              # Incident 2026-10-10: never recapture host routes from a stopped,
              # partially activated or unowned ManagedTun before independently
              # proven no-TUN DNS/control recovery and live Line1 authentication.
              # Neither a green ReleaseSet nor sing-box config syntax proves it.
              # Read-only /windows diagnose uses its separate safe observation step.
              if ($currentTun -cne 'true' -or
                  [string]$values['scm_state'] -cne 'Running' -or
                  [int]$values['managed_singbox_process_count'] -ne 1) {
                throw 'PRE_MUTATION_MANAGED_TUN_PREAUTH_BLOCKED: active authenticated Line1 and independent no-TUN DNS/control restoration are UNPROVEN; do not capture Windows routes'
              }
            }
            default { throw "Unsupported installed Windows datapath mode: $currentMode" }
          }
          if ($env:EDGE_OPERATION -eq 'diagnose' -and $currentMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Installed datapath mode $currentMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          "EDGE_BEFORE_MODE=$currentMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Immutable console path is unavailable'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($stoppedOwnerRecovery) {
            if ($externalPids.Count -ne 1) {
              throw "Stopped-owner recovery expected one unprivileged ambiguous sing-box, observed $($externalPids.Count)"
            }
            $signature = ''
          } else {
            if ($externalPids.Count -ne 0) {
              throw "Stage 4B.2-C requires zero external sing-box owners; observed $($externalPids.Count)"
            }
            $signature = $externalPids -join ','
          }
          $managedBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($runningLegacyDiagnosticRecovery) { $managedBefore = @($legacyManagedPid) }
          $unknownBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownBefore.Count -gt 0) {
            if ($unknownBefore.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_process_id'] -notmatch '^\d+$') {
              throw 'Pre-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $privileged = @(& $console privileged-runtime-evidence --install-root $root)
            if ($LASTEXITCODE -ne 0) { throw 'Pre-state privileged runtime identity evidence unavailable' }
            $detail = [string]($privileged | Where-Object { [string]$_ -like 'detail=*' } | Select-Object -Last 1)
            $owner = [regex]::Escape([string]$values['scm_process_id'])
            $child = [regex]::Escape([string]$unknownBefore[0])
            if ($detail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY;' -or
                $detail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detail -notmatch ';external_count=0(?:;|$)' -or
                $detail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
              throw 'Pre-state UNKNOWN sing-box is not confirmed by exact privileged owner evidence'
            }
            $managedBefore = @($unknownBefore[0])
            Write-Host 'prestate_managed_owner=PRIVILEGED_EXACT_PROOF'
          }
          "EDGE_BEFORE_CONTROLLER_PID=$([string]$values['scm_process_id'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_MANAGED_PID=$($managedBefore -join ',')" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'start' -and $managedBefore.Count -eq 1 -and
              [string]$values['scm_state'] -ceq 'Running') {
            "EDGE_START_NOOP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]$values['scm_state'] -cne 'Running' -or
                $managedBefore.Count -ne 1 -or
                [string]$values['managed_tun_present'] -cne 'true') {
              throw 'restart-controller requires healthy Running ManagedTun pre-state'
            }
          }
          if ($env:EDGE_OPERATION -in @('repair','rollback')) {
            $previous = Join-Path $root 'previous.pb'
            $previousDoctor = @(& $diagnostic doctor $previous)
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed: $LASTEXITCODE" }
            $previousValues = @{}
            foreach ($line in $previousDoctor) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousValues['exact_release_files'] -cne 'PASS') {
              throw 'Previous ReleaseSet exact files are not verified'
            }
            if ($env:EDGE_OPERATION -eq 'rollback') {
              if ([string]$previousValues['release_set_sha256'] -ceq $currentRelease -or
                  [string]$previousValues['windows_datapath_mode'] -cne 'ManagedTun' -or
                  $managedBefore.Count -ne 1 -or
                  [string]$values['managed_tun_present'] -cne 'true' -or
                  [string]$values['managed_tun_ipv4'] -cne '172.19.0.1' -or
                  [string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: distinct verified previous release and exact single-owner ManagedTun required'
              }
              # The CURRENT diagnostic reports its own compiled mode even for
              # previous.pb. Use the verified PREVIOUS immutable diagnostic to
              # prove its distinct compiled desired mode (read-only, no fetch).
              # Its later live-owner check may fail while a newer SCM runs; only
              # the initial verified release identity/mode fields are consumed.
              $previousDiagnostic = [string]$previousValues['diagnostic_path']
              if ([string]::IsNullOrWhiteSpace($previousDiagnostic) -or
                  -not (Test-Path -LiteralPath $previousDiagnostic -PathType Leaf)) {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: previous exact diagnostic missing'
              }
              $previousStatic = @(& $previousDiagnostic doctor $previous 2>$null)
              $previousStaticRelease = @($previousStatic | Where-Object { [string]$_ -match '^release_set_sha256=' })
              $previousStaticSource = @($previousStatic | Where-Object { [string]$_ -match '^source_revision=' })
              $previousStaticMode = @($previousStatic | Where-Object { [string]$_ -match '^windows_datapath_mode=' })
              if ($previousStaticRelease.Count -ne 1 -or
                  $previousStaticSource.Count -ne 1 -or
                  $previousStaticMode.Count -ne 1 -or
                  [string]$previousStaticRelease[0] -cne "release_set_sha256=$([string]$previousValues['release_set_sha256'])" -or
                  [string]$previousStaticSource[0] -cne "source_revision=$([string]$previousValues['source_revision'])" -or
                  [string]$previousStaticMode[0] -cne 'windows_datapath_mode=ManagedTun' -or
                  @($previousStatic | Where-Object { [string]$_ -ceq 'exact_release_files=PASS' }).Count -ne 1) {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: verified previous binary does not attest exact ManagedTun source and files'
              }
              Write-Host 'previous_release_native_desired_managed_tun=PASS'
            }
            "EDGE_BEFORE_PREVIOUS_RELEASE=$([string]$previousValues['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_EXTERNAL_PIDS_BEFORE=$signature" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $doctor | Write-Host

      - name: Execute typed lifecycle mutation
        id: lifecycle_mutation
        if: ${{ needs.resolve.outputs.operation != 'diagnose' && needs.resolve.outputs.operation != 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:EDGE_OPERATION) {
            'converge' {
              if ($env:EDGE_BEFORE_MODE -ceq 'ProxyOnly') {
                $exactConsole = $env:EDGE_CURRENT_CONSOLE
                if ($env:EDGE_BEFORE_RELEASE -cne $env:EDGE_RELEASE_SET_SHA256) {
                  # Only a separately stopped exact ProxyOnly owner is eligible.
                  # Native offline activation owns accepted release, SCM, task
                  # and rollback; never use legacy privileged-activate here.
                  & $exactConsole privileged-offline-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
                  if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly offline upgrade outcome UNKNOWN; DO NOT REPLAY' }
                  $exactConsole = Join-Path $env:EDGE_INSTALL_ROOT ("releases\" + $env:EDGE_RELEASE_SET_SHA256 + "\bin\edge-console.exe")
                  if (-not (Test-Path -LiteralPath $exactConsole -PathType Leaf)) {
                    throw 'ProxyOnly offline upgrade missing exact new immutable console; do not replay'
                  }
                }
                & $exactConsole privileged-start-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
                if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly SCM converge uncertain; do not replay' }
                & $exactConsole start-local $env:EDGE_CONTROLLER_ENDPOINT
              } else {
                & $env:EDGE_CURRENT_CONSOLE privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
              }
            }
            'start' {
              if ($env:EDGE_START_NOOP -ceq 'YES') {
                Write-Host 'runtime_start=NOOP_ALREADY_RUNNING'
                $LASTEXITCODE = 0
              } else {
                if ($env:EDGE_BEFORE_MODE -ceq 'ProxyOnly') {
                  & $env:EDGE_CURRENT_CONSOLE privileged-start-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
                  if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly SCM start uncertain; do not replay' }
                }
                & $env:EDGE_CURRENT_CONSOLE start-local $env:EDGE_CONTROLLER_ENDPOINT
              }
            }
            'stop' {
              if ($env:EDGE_BEFORE_MODE -cne 'ProxyOnly') {
                throw 'ManagedTun stop remains blocked until independent DNS recovery is proven'
              }
              & $env:EDGE_CURRENT_CONSOLE privileged-stop-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
            }
            'restart-controller' {
              & $env:EDGE_CURRENT_CONSOLE privileged-restart-controller-service --install-root $env:EDGE_INSTALL_ROOT
            }
            'repair' {
              & $env:EDGE_CURRENT_CONSOLE privileged-reinstall-accepted $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            }
            'rollback' {
              & $env:EDGE_CURRENT_CONSOLE privileged-rollback-previous --install-root $env:EDGE_INSTALL_ROOT
            }
            default { throw "Unsupported operation: $env:EDGE_OPERATION" }
          }
          if ($LASTEXITCODE -ne 0) { throw "Lifecycle mutation failed: $LASTEXITCODE" }

      - name: Verify exact authority and SCM handoff
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stableDiagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          if ($bootstrapExit -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Stable post-state diagnostic failed: $bootstrapExit" }
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact post-state release files'
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable post-state diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          if ($doctorExit -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Exact post-state diagnostic failed: $doctorExit" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') { throw 'Exact release files are not verified' }
          $afterMode = [string]$values['windows_datapath_mode']
          $afterTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $afterMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Active datapath mode $afterMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          switch ($afterMode) {
            'ProxyOnly' {
              if ($afterTun -cne 'false') { throw 'ProxyOnly state unexpectedly owns managed TUN' }
            }
            'ManagedTun' {
              if ($env:EDGE_OPERATION -eq 'stop') {
                if ($afterTun -cne 'false') { throw 'Managed TUN remained present after explicit runtime stop' }
              } else {
                if ($afterTun -cne 'true') { throw 'ManagedTun state is missing managed TUN' }
                if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') {
                  throw "Unexpected managed TUN IPv4: $($values['managed_tun_ipv4'])"
                }
                if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') {
                  throw "Unexpected managed TUN DNS IPv4: $($values['managed_tun_dns_ipv4'])"
                }
              }
            }
            default { throw "Unsupported active Windows datapath mode: $afterMode" }
          }
          if ($env:EDGE_OPERATION -in @('converge','repair') -and [string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Accepted ReleaseSet is not active'
          }
          if ($env:EDGE_OPERATION -in @('start','stop','restart-controller') -and [string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_RELEASE) {
            throw 'Transient runtime control changed ReleaseSet authority'
          }
          if ($env:EDGE_OPERATION -eq 'rollback') {
            if ([string]$values['release_set_sha256'] -ceq $env:EDGE_BEFORE_RELEASE) {
              throw 'Rollback did not change ReleaseSet authority'
            }
            if ([string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Rollback did not activate the exact previous ReleaseSet observed before mutation'
            }
          }
          if ($env:EDGE_OPERATION -eq 'repair') {
            $previousAfter = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'previous.pb'))
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed after repair: $LASTEXITCODE" }
            $previousAfterValues = @{}
            foreach ($line in $previousAfter) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousAfterValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousAfterValues['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Repair changed previous ReleaseSet authority'
            }
          }
          $managedAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $afterControllerPid = [string]$values['scm_process_id']
          $unknownAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownAfter.Count -gt 0) {
            if ($unknownAfter.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0) {
              throw 'Post-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $managedAfter = @($unknownAfter[0])
            Write-Host 'poststate_process_identity=UNKNOWN_AWAIT_PRIVILEGED_EVIDENCE'
          }
          $afterManagedPid = $managedAfter -join ','
          "EDGE_AFTER_CONTROLLER_PID=$afterControllerPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MANAGED_PID=$afterManagedPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_CONTROLLER_PID) -or
                $env:EDGE_BEFORE_CONTROLLER_PID -ceq 'ABSENT' -or
                $afterControllerPid -ceq $env:EDGE_BEFORE_CONTROLLER_PID) {
              throw 'SCM restart did not replace controller PID'
            }
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_MANAGED_PID) -or
                $afterManagedPid -ceq $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'SCM restart did not replace the exact managed child'
            }
          }
          if ($env:EDGE_OPERATION -eq 'start' -and $env:EDGE_START_NOOP -ceq 'YES') {
            if ($afterControllerPid -cne $env:EDGE_BEFORE_CONTROLLER_PID -or
                $afterManagedPid -cne $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'Idempotent start caused controller or managed-child PID churn'
            }
            Write-Host 'runtime_start_noop_identity=PASS'
          }
          $console = [string]$values['console_path']
          $controller = [string]$values['controller_path']
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MODE=$afterMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ([string]$values['scm_service_name'] -cne 'EdgePlatformController') { throw 'SCM controller is missing' }
          if ([string]$values['scm_account'] -cne 'NT SERVICE\EdgePlatformController') { throw 'Unexpected SCM identity' }
          $expectedScm = if ($env:EDGE_OPERATION -eq 'stop') { 'Stopped' } else { 'Running' }
          $expectedStartup = if ($afterMode -ceq 'ProxyOnly') { 'OnDemand' } else { 'AutoStart' }
          if ([string]$values['scm_state'] -cne $expectedScm) { throw "SCM not $expectedScm" }
          if ([string]$values['scm_start_type'] -cne $expectedStartup) { throw "SCM startup not $expectedStartup" }
          if ($env:EDGE_OPERATION -eq 'stop' -and [string]$values['scm_process_id'] -cne 'ABSENT') {
            throw 'Stopped SCM has a process'
          }
          if ([string]$values['scm_executable_matches_release'] -cne 'true') { throw 'SCM binary does not match the active release' }
          $authority = ([Uri]$env:EDGE_CONTROLLER_ENDPOINT).Authority
          $expected = "$controller windows-service $env:EDGE_INSTALL_ROOT $authority"
          if ([string]$values['scm_executable_path'] -cne $expected) { throw 'SCM executable authority mismatch' }

      - name: Measure native Line1 named-outbound quality without changing routing
        if: ${{ needs.resolve.outputs.operation == 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_BEFORE_MODE -cne 'ManagedTun') {
            throw 'Line1 quality requires installed, running ManagedTun; no mode change is permitted'
          }
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $before = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality pre-measurement owner evidence unavailable' }
          $routeBefore = @($before | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          if ($routeBefore.Count -eq 0) { throw 'Native quality route evidence is missing' }
          $warpDnsBefore = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedBefore = @($before | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmBefore = @($before | Where-Object { $_ -match '^scm_process_id=' })
          if ($managedBefore.Count -ne 1 -or $scmBefore.Count -ne 1) {
            throw 'Native quality requires exactly one independently observed SCM and sing-box process'
          }
          Write-Host 'line1_quality_source=INSTALLED_VERIFIED_RELEASE'
          Write-Host "line1_quality_installed_release=$env:EDGE_BEFORE_RELEASE"
          Write-Host "line1_quality_target_mode=$env:EDGE_EXPECTED_MODE"
          $result = @(& $env:EDGE_CURRENT_CONSOLE quality-line1)
          $qualityExit = $LASTEXITCODE
          $result | Write-Host
          $after = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality post-measurement owner evidence unavailable' }
          $routeAfter = @($after | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          $warpDnsAfter = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedAfter = @($after | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmAfter = @($after | Where-Object { $_ -match '^scm_process_id=' })
          if (($routeAfter -join "`n") -cne ($routeBefore -join "`n") -or
              ($managedAfter -join "`n") -cne ($managedBefore -join "`n") -or
              ($scmAfter -join "`n") -cne ($scmBefore -join "`n") -or
              ($warpDnsAfter -join ',') -cne ($warpDnsBefore -join ',')) {
            throw 'Line1 quality changed (or observed drift in) route, process owner or foreign WARP DNS evidence'
          }
          Write-Host 'native_line1_owner_route_dns_parity=PASS'
          if ($qualityExit -ne 0) { throw "Native Line1 quality reported unavailable HTTP samples: exit=$qualityExit" }

      - name: Prove managed DIRECT and WARP without runtime restart
        if: ${{ needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE verify-runtime
          if ($LASTEXITCODE -ne 0) { throw "Managed proxy verification failed: $LASTEXITCODE" }

      - name: Read-only privileged runtime evidence after restart
        if: ${{ always() && needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceStrict = $true
          $evidenceConsole = $env:EDGE_CURRENT_CONSOLE
          if ([string]::IsNullOrWhiteSpace($evidenceConsole) -or
              -not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            $evidenceStrict = $false
            $evidenceConsole = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-console.exe'
          }
          if (-not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            Write-Warning 'Privileged runtime evidence console is unavailable after an earlier lifecycle failure'
            exit 0
          }

          $evidenceLines = @(& $evidenceConsole privileged-runtime-evidence --install-root $env:EDGE_INSTALL_ROOT)
          $evidenceExit = $LASTEXITCODE
          $evidenceLines | Write-Host
          if ($evidenceExit -ne 0) {
            if ($evidenceStrict) { throw "Privileged read-only runtime evidence failed: $evidenceExit" }
            Write-Warning "Privileged conflict evidence failed read-only: $evidenceExit"
            exit 0
          }

          $detailLine = [string]($evidenceLines |
            Where-Object { [string]$_ -like 'detail=*' } |
            Select-Object -Last 1)
          if ([string]::IsNullOrWhiteSpace($detailLine) -or
              $detailLine -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
            if ($evidenceStrict) { throw 'Privileged runtime evidence did not return the bounded typed detail contract' }
            Write-Warning 'Privileged conflict evidence did not return the bounded typed detail contract'
            exit 0
          }

          if ($evidenceStrict -and $detailLine -notmatch '(?:^|;)controller_service_error=ABSENT(?:;|$)') {
            throw 'Controller service retains current startup-failure evidence after successful lifecycle verification'
          }
          $modeAtEvidence = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MODE)) { $env:EDGE_BEFORE_MODE } else { $env:EDGE_AFTER_MODE }
          if ($evidenceStrict -and $modeAtEvidence -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop') {
            $expectedChild = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MANAGED_PID)) { $env:EDGE_BEFORE_MANAGED_PID } else { $env:EDGE_AFTER_MANAGED_PID }
            $expectedController = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_CONTROLLER_PID)) { $env:EDGE_BEFORE_CONTROLLER_PID } else { $env:EDGE_AFTER_CONTROLLER_PID }
            if ([string]::IsNullOrWhiteSpace($expectedChild) -or $expectedChild -notmatch '^\d+$' -or
                [string]::IsNullOrWhiteSpace($expectedController) -or $expectedController -notmatch '^\d+$') {
              throw 'Privileged managed process identity lacks an exact diagnostic PID candidate'
            }
            $child = [regex]::Escape($expectedChild)
            $owner = [regex]::Escape($expectedController)
            if ($detailLine -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detailLine -notmatch ';external_count=0(?:;|$)') {
              throw 'Privileged managed identity differs from the exact runner process observation'
            }
            "EDGE_PRIVILEGED_MANAGED_PID=$expectedChild" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            "EDGE_PRIVILEGED_CONTROLLER_PID=$expectedController" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            Write-Host 'managed_process_identity=PRIVILEGED_EXACT_PROOF'
          }
          if ($evidenceStrict -and $env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun') {
            if ($detailLine -match '(?:^|;)stderr=MISSING(?:;|$)') {
              throw 'Managed sing-box stderr evidence is missing after lifecycle verification'
            }
            if ($detailLine -notmatch '(?:^|;)stderr=') {
              throw 'Managed sing-box stderr evidence was omitted from the bounded privileged result'
            }
            if ($detailLine -match 'failed to search process:\s*Access is denied') {
              throw 'Managed sing-box process lookup still reports Access is denied after fresh restart'
            }
            Write-Host 'managed_tun_process_search_access_denied=ABSENT'
          }

      - name: Prove MANAGED_TUN ordinary Windows traffic DNS and foreign Mesh coexistence
        if: ${{ (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for managed TUN proof'
          }
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw "Managed TUN diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['managed_tun_present'] -cne 'true') { throw 'Managed TUN is absent' }
          $tunIndex = [uint32]$values['managed_tun_interface_index']
          if ($tunIndex -eq 0) { throw 'Managed TUN interface index is invalid' }
          if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') { throw 'Managed TUN IPv4 mismatch' }
          if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') { throw 'Managed TUN DNS mismatch' }
          $statusLines = @(& $env:EDGE_CURRENT_CONSOLE status $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Typed controller status failed: $LASTEXITCODE" }
          $serverIp = $null
          foreach ($line in $statusLines) {
            if ([string]$line -match '^Server IP\s+:\s+((?:\d{1,3}\.){3}\d{1,3})\s*$') {
              $serverIp = $Matches[1]
              break
            }
          }
          $parsedServerIp = [System.Net.IPAddress]::None
          if ([string]::IsNullOrWhiteSpace($serverIp) -or
              -not [System.Net.IPAddress]::TryParse($serverIp, [ref]$parsedServerIp) -or
              $parsedServerIp.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) {
            throw "Typed controller status did not expose a valid production server IPv4: $serverIp"
          }
          $serverRoute = Find-NetRoute -RemoteIPAddress $serverIp |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $serverRoute) { throw "No Windows best route exists for production server $serverIp" }
          if ([uint32]$serverRoute.InterfaceIndex -eq $tunIndex) {
            throw "Production server $serverIp is captured by managed TUN"
          }
          $serverAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$serverRoute.InterfaceIndex) -ErrorAction Stop

          $dns = Resolve-DnsName 'www.gstatic.com' -Type A -DnsOnly -ErrorAction Stop |
            Where-Object { $_.IPAddress } |
            Select-Object -First 1
          if (-not $dns -or [string]::IsNullOrWhiteSpace([string]$dns.IPAddress)) {
            throw 'Ordinary Windows DNS did not return an IPv4 address'
          }
          $route = Find-NetRoute -RemoteIPAddress ([string]$dns.IPAddress) |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $route -or [uint32]$route.InterfaceIndex -ne $tunIndex) {
            throw 'Ordinary Internet destination does not select managed TUN'
          }

          $http = (& curl.exe --noproxy '*' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $http -cne '204') {
            throw "Ordinary no-proxy Windows HTTPS failed through managed TUN: exit=$LASTEXITCODE http=$http"
          }

          $localHttp = (& curl.exe --proxy 'http://127.0.0.1:17891' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $localHttp -cne '204') {
            throw "Canonical local proxy failed with managed TUN: exit=$LASTEXITCODE http=$localHttp"
          }

          $meshRoute = Find-NetRoute -RemoteIPAddress '100.96.0.2' |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $meshRoute) { throw 'Foreign Mesh/device route is absent' }
          $meshAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$meshRoute.InterfaceIndex) -ErrorAction Stop
          if ([string]$meshAdapter.Name -cne 'CloudflareWARP') {
            throw "Foreign Mesh/device route escaped CloudflareWARP: $($meshAdapter.Name)"
          }
          if ([uint32]$meshRoute.InterfaceIndex -eq $tunIndex) {
            throw 'Managed TUN captured the foreign Mesh/device route'
          }

          $warpAdapter = Get-NetAdapter -Name 'CloudflareWARP' -ErrorAction Stop
          if ([string]$warpAdapter.Status -cne 'Up') {
            throw "Foreign CloudflareWARP adapter is not Up: $($warpAdapter.Status)"
          }
          $warpDns = @(
            Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
              ForEach-Object ServerAddresses
          )
          if ($warpDns -contains '172.31.255.2') {
            throw "Foreign CloudflareWARP still carries retired legacy TUN DNS 172.31.255.2: $($warpDns -join ',')"
          }

          Write-Host "managed_tun_server_bypass_ip=$serverIp"
          Write-Host "managed_tun_server_bypass_owner=$($serverAdapter.Name)"
          Write-Host 'managed_tun_server_bypass=PASS'
          Write-Host 'managed_tun_ordinary_dns=PASS'
          Write-Host 'managed_tun_ordinary_https=PASS'
          Write-Host 'managed_tun_local_proxy=PASS'
          Write-Host 'foreign_mesh_route_owner=CloudflareWARP'
          Write-Host "foreign_cloudflarewarp_dns=$($warpDns -join ',')"
          Write-Host "foreign_cloudflarewarp_tun_dns_repin=$($warpDns -contains '172.19.0.2')"

      - name: Refuse unproven automatic rollback after MANAGED_TUN verification failure
        if: ${{ failure() && steps.lifecycle_mutation.outcome == 'success' && (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'managed_tun_automatic_rollback=BLOCKED_NO_INDEPENDENT_DNS_RESTORE'
          throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: automatic rollback cannot prove CloudflareWARP DNS/control-channel recovery; preserve current runtime for independent diagnostics'

      - name: Final diagnostics and transport-only boundary
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for final verification'
          }
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Final diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $unknownFinal = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $finalManagedCount = [int]$values['managed_singbox_process_count']
          if ($unknownFinal.Count -gt 0) {
            if ($unknownFinal.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                $finalManagedCount -ne 0 -or [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$env:EDGE_PRIVILEGED_MANAGED_PID -cne [string]$unknownFinal[0] -or
                [string]$env:EDGE_PRIVILEGED_CONTROLLER_PID -cne [string]$values['scm_process_id']) {
              throw 'Final process identity is UNKNOWN without exact matching privileged evidence'
            }
            $finalManagedCount = 1
          }
          if ($env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $finalManagedCount -ne 1) {
            throw "Expected one managed proxy process after $env:EDGE_OPERATION, observed $finalManagedCount"
          }
          if ($env:EDGE_OPERATION -eq 'stop' -and ($finalManagedCount -ne 0 -or $unknownFinal.Count -ne 0)) {
            throw "Expected zero managed proxy processes after stop, observed $($values['managed_singbox_process_count'])"
          }
          $finalMode = [string]$values['windows_datapath_mode']
          $finalTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $finalMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Final datapath mode $finalMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          if ($finalMode -ceq 'ProxyOnly' -and $finalTun -cne 'false') { throw 'Final ProxyOnly state owns managed TUN' }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -eq 'stop' -and $finalTun -cne 'false') {
            throw 'Final explicit runtime stop left managed TUN present'
          }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop' -and $finalTun -cne 'true') {
            throw 'Final ManagedTun state is missing managed TUN'
          }
          if ($finalMode -notin @('ProxyOnly','ManagedTun')) { throw "Unsupported final datapath mode: $finalMode" }
          if ($env:EDGE_OPERATION -eq 'rollback' -and $finalMode -ceq 'ProxyOnly') {
            $warpDnsAfterTunRemoval = @(
              Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses
            )
            if ($warpDnsAfterTunRemoval -contains '172.19.0.2') {
              throw "Foreign CloudflareWARP still depends on removed managed TUN DNS after ProxyOnly rollback: $($warpDnsAfterTunRemoval -join ',')"
            }
            Write-Host "foreign_cloudflarewarp_dns_after_tun_removal=$($warpDnsAfterTunRemoval -join ',')"
            Write-Host 'foreign_cloudflarewarp_tun_dns_cleanup=PASS'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $signature = $externalPids -join ','
          if ($signature -cne $env:EDGE_EXTERNAL_PIDS_BEFORE) { throw 'External sing-box owner changed after verification' }
          foreach ($relative in @('state','runtime','logs')) {
            $path = Join-Path $env:EDGE_INSTALL_ROOT $relative
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries($path) | Out-Null } catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "Runner unexpectedly has direct private-state access: $relative" }
          }
          $doctor | Write-Host

      - name: Observe Cloudflare One effective client state (read-only)
        if: ${{ needs.resolve.outputs.operation == 'diagnose' }}
        shell: powershell
        run: |
          # Only observe an independently owned client. Never emit raw settings or
          # diagnostics: they can include private organization and network data.
          $ErrorActionPreference = 'Stop'
          $serviceState = 'UNKNOWN'
          $servicePid = 0
          try {
            $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='CloudflareWARP'" -ErrorAction Stop
            if ($null -ne $svc) {
              $serviceState = if ([string]$svc.State -ceq 'Running') { 'RUNNING' } else { 'NOT_RUNNING' }
              $servicePid = [int]$svc.ProcessId
            }
          } catch { $serviceState = 'UNKNOWN' }

          $listener = 'UNKNOWN'
          try {
            $dnsEndpoints = @(
              @(Get-NetUDPEndpoint -LocalPort 53 -ErrorAction Stop) +
              @(Get-NetTCPConnection -LocalPort 53 -State Listen -ErrorAction Stop)
            ) | Where-Object { $_.LocalAddress -in @('127.0.2.2','127.0.2.3') }
            $listener = if ($dnsEndpoints.Count -eq 0) { 'NOT_OBSERVED' }
                        elseif ($servicePid -gt 0 -and @($dnsEndpoints | Where-Object { [int]$_.OwningProcess -eq $servicePid }).Count -gt 0) { 'WARP_SERVICE_PROCESS' }
                        else { 'OTHER_OR_UNATTRIBUTED' }
          } catch { $listener = 'UNKNOWN' }

          # Only the installed vendor CLI at its exact standard path is allowed.
          # The child CLI is bounded; a timed-out child is closed, not warp-svc.
          $warpCli = Join-Path $env:ProgramFiles 'Cloudflare\Cloudflare WARP\warp-cli.exe'
          function Read-CloudflareClient([string]$verb) {
            if (-not (Test-Path -LiteralPath $warpCli -PathType Leaf)) {
              return @{ outcome = 'CLI_NOT_FOUND'; value = '' }
            }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $warpCli
            $psi.Arguments = $verb
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $child = New-Object System.Diagnostics.Process
            $child.StartInfo = $psi
            try {
              if (-not $child.Start()) { return @{ outcome = 'START_FAILED'; value = '' } }
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(10000)) {
                try { $child.Kill(); $child.WaitForExit(2000) | Out-Null } catch {}
                return @{ outcome = 'CLI_TIMEOUT'; value = '' }
              }
              if ($child.ExitCode -ne 0) { return @{ outcome = 'CLI_ERROR'; value = '' } }
              $value = $stdout.GetAwaiter().GetResult()
              if ($value.Length -gt 65536) { return @{ outcome = 'OVERSIZE'; value = '' } }
              return @{ outcome = 'OK'; value = $value }
            } catch {
              return @{ outcome = 'CLI_UNAVAILABLE'; value = '' }
            } finally { $child.Dispose() }
          }

          $status = Read-CloudflareClient 'status'
          $settings = Read-CloudflareClient 'settings'
          $connectivity = 'UNKNOWN'
          if ($status.outcome -ceq 'OK') {
            if ($status.value -match '\bConnected\b') { $connectivity = 'CONNECTED' }
            elseif ($status.value -match '\bDisconnected\b') { $connectivity = 'DISCONNECTED' }
          }
          $mode = 'UNKNOWN'
          $split = 'UNKNOWN'
          $profileHash = 'UNKNOWN'
          $splitHash = 'UNKNOWN'
          $fallback = 'UNKNOWN'
          $meshSplitExact = 'UNKNOWN'
          if ($settings.outcome -ceq 'OK') {
            $modeMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Mode:\s*(WarpWithDnsOverHttps|TunnelOnly|DnsOverHttps|WarpProxy|PostureOnly)\b')
            if ($modeMatch.Success) { $mode = $modeMatch.Groups[1].Value }
            $profileMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Profile ID:\s*([0-9a-fA-F-]{36})(?:\s|$)')
            if ($profileMatch.Success) {
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $profileHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($profileMatch.Groups[1].Value.ToLowerInvariant()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
            }
            $splitMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?(Exclude|Include) mode, with hosts/ips:')
            if ($splitMatch.Success) {
              $split = $splitMatch.Groups[1].Value.ToUpperInvariant()
              $section = $settings.value.Substring($splitMatch.Index + $splitMatch.Length)
              $nextField = [regex]::Match($section, '(?m)^\s*\([^)\r\n]+\)\s+\S[^:\r\n]*:')
              if ($nextField.Success) { $section = $section.Substring(0, $nextField.Index) }
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $splitHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($section.Trim()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
              $meshSplitExact = if ($section -match '(?m)^\s*100\.96\.0\.0/12(?:\s|$)') { 'YES' } else { 'NO' }
            }
            $fallback = if ($settings.value -match '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Fallback domains:') { 'PRESENT' } else { 'NOT_LISTED' }
          }
          # No registry NameServer or local listener proves a DNS writer or failover.
          Write-Host "cloudflare_one_service=$serviceState"
          Write-Host "cloudflare_one_local_dns_listener=$listener"
          Write-Host "cloudflare_one_cli_status=$($status.outcome)"
          Write-Host "cloudflare_one_connectivity=$connectivity"
          Write-Host "cloudflare_one_cli_settings=$($settings.outcome)"
          Write-Host "cloudflare_one_effective_mode=$mode"
          Write-Host "cloudflare_one_profile_id_sha256=$profileHash"
          Write-Host "cloudflare_one_split_tunnel_mode=$split"
          Write-Host "cloudflare_one_split_entries_sha256=$splitHash"
          Write-Host "cloudflare_one_split_mesh_cidr_exact=$meshSplitExact"
          Write-Host "cloudflare_one_local_domain_fallback=$fallback"
          Write-Host 'cloudflare_one_dns_writer=UNKNOWN'
          Write-Host 'cloudflare_one_no_tun_recovery=UNPROVEN'

      - name: Publish bounded lifecycle evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          @(
            "### Windows $env:EDGE_AFTER_MODE lifecycle",
            '- Operation: ${{ needs.resolve.outputs.operation }}',
            "- Before ReleaseSet: $env:EDGE_BEFORE_RELEASE",
            "- After ReleaseSet: $env:EDGE_AFTER_RELEASE",
            '- Local Windows build: NO',
            '- External sing-box mutation: FORBIDDEN / equality-checked',
            "- Expected mode: $env:EDGE_EXPECTED_MODE",
            "- Before mode: $env:EDGE_BEFORE_MODE",
            "- After mode: $env:EDGE_AFTER_MODE",
            "- TUN requested by desired state: $($env:EDGE_EXPECTED_MODE -ceq 'ManagedTun')",
            '- Foreign CloudflareWARP mutation: FORBIDDEN',
            '- External sing-box owner: FORBIDDEN / equality-checked'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
) {
            throw 'HOST_WINDOWS_APPLY_NATIVE_OWNER_MISMATCH'
          }
          Write-Host 'host_apply_native_owner=VERIFIED_WINDOWS_RUNNER'

      - name: Checkout exact accepted native release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Observe existing ACTIVE and plan exact stopped release-only change
        id: active_preflight
        shell: pwsh
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_WINDOWS_APPLY_POLICY: EXISTING_ACTIVE_RELEASE_ONLY
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          $observed = @(& $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -ExistingActive -Preflight)
          if (-not $?) { throw 'WINDOWS_APPLY_BLOCKED: native SYSTEM ACTIVE preflight failed' }
          $from = @($observed | Where-Object { [string]$_ -cmatch '^windows_offline_source_release=[0-9a-f]{64}$' })
          $needed = @($observed | Where-Object { [string]$_ -cmatch '^windows_offline_transition_needed=(True|False)$' })
          if ($from.Count -ne 1 -or $needed.Count -ne 1 -or
              @($observed | Where-Object { [string]$_ -ceq 'windows_credential_policy=EXISTING_ACTIVE_RELEASE_ONLY' }).Count -ne 1) {
            throw 'WINDOWS_APPLY_BLOCKED: ambiguous status/plan result'
          }
          $source = ([string]$from[0]).Split('=',2)[1]
          $upgrade = ([string]$needed[0]).Split('=',2)[1] -ceq 'True'
          "source_release=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "needs_upgrade=$($upgrade.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $upgrade) { Write-Host 'windows_apply=NOOP_CURRENT_RELEASE_ACTIVE_UNCHANGED' }
      - name: Record immutable release-only BEGIN once before SYSTEM mutation
        if: steps.active_preflight.outputs.needs_upgrade == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE: ${{ steps.active_preflight.outputs.source_release }}
          TARGET_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          TARGET_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:SOURCE_RELEASE -notmatch '^[0-9a-f]{64}$' -or
              $env:TARGET_RELEASE -notmatch '^[0-9a-f]{64}$' -or
              $env:SOURCE_RELEASE -ceq $env:TARGET_RELEASE) {
            throw 'WINDOWS_APPLY_BLOCKED: exact first-attempt source and target required'
          }
          $reader = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\read-complete-gh-journal.ps1'
          $history = @(& $reader)
          $marker = '<!-- sing-box-windows-active-release-apply/v1 -->'
          foreach ($prior in @($history | Where-Object { [string]$_.body -like "*$marker*" })) {
            $body = [string]$prior.body
            if (-not $body.StartsWith("$marker`n")) { throw 'WINDOWS_APPLY_BLOCKED: malformed earlier intent' }
            $record = ConvertFrom-Json -InputObject $body.Substring($marker.Length + 1)
            if ([string]$record.schema -cne 'sing-box.windows-active-release-apply/v1') {
              throw 'WINDOWS_APPLY_BLOCKED: mismatched intent schema'
            }
            if ([string]$record.source_release_set_sha256 -ceq $env:SOURCE_RELEASE -or
                [string]$record.target_release_set_sha256 -ceq $env:TARGET_RELEASE) {
              throw 'WINDOWS_APPLY_BLOCKED: prior unresolved source or target attempt; read-only reconcile'
            }
          }
          $record = [ordered]@{
            schema = 'sing-box.windows-active-release-apply/v1'
            phase = 'BEGIN'
            github_run_id = [long]$env:GITHUB_RUN_ID
            source_release_set_sha256 = $env:SOURCE_RELEASE
            target_release_set_sha256 = $env:TARGET_RELEASE
            target_revision = $env:TARGET_REVISION
            mutation_scope = 'PROGRAM_ONLY_EXISTING_ACTIVE'
          }
          $body = $marker + "`n" + ($record | ConvertTo-Json -Compress)
          & gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$body" > $null
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_APPLY_UNKNOWN: journal write uncertain; no replay' }
          $readback = @(& $reader)
          if (@($readback | Where-Object { [string]$_.body -ceq $body }).Count -ne 1) {
            throw 'WINDOWS_APPLY_UNKNOWN: exact once-only intent not confirmed; no replay'
          }
          Write-Host 'windows_release_only_intent=COMMITTED_ONCE'
      - name: Single native SYSTEM offline release apply and bounded readback
        if: steps.active_preflight.outputs.needs_upgrade == 'true'
        shell: pwsh
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_WINDOWS_APPLY_POLICY: EXISTING_ACTIVE_RELEASE_ONLY
          SOURCE_RELEASE: ${{ steps.active_preflight.outputs.source_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -ExistingActive -ExpectedSourceReleaseSet $env:SOURCE_RELEASE
          if (-not $?) { throw 'WINDOWS_APPLY_UNKNOWN: native result uncertain; do not replay' }
          Write-Host 'windows_apply=PASS_STOPPED_PROGRAM_ONLY'
          Write-Host 'credential_origin=UNPROVEN_NOT_CREDENTIAL_MUTATION_AUTHORITY'

  initial_first_use_prepare:
    name: Windows / exactly stopped immutable upgrade BEFORE first-use BEGIN
    needs: resolve
    if: needs.resolve.outputs.operation == 'initial-pair-prepare'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 18
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact accepted native release owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Verify installed native capability and all preconditions before journalling
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -Preflight
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_UPGRADE_BLOCKED: native preflight failed before durable intent' }
      - name: Persist exactly one immutable program-upgrade intent BEFORE native mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          ACCEPTED_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_RUN_ATTEMPT -cne '1') { throw 'FIRST_USE_UPGRADE_BLOCKED: replay forbidden' }
          $reader = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\read-complete-gh-journal.ps1'
          $history = @(& $reader)
          $staging = @($history | Where-Object { [string]$_.body -like '*<!-- sing-box-windows-persistent-initial-stage/*' })
          if ($staging.Count -ne 0) { throw 'FIRST_USE_UPGRADE_BLOCKED: staging already begun; reconcile instead' }
          $attempts = @($history | Where-Object { [string]$_.body -like '*<!-- sing-box-windows-program-prepare/*' })
          if ($attempts.Count -ne 0) { throw 'FIRST_USE_UPGRADE_BLOCKED: program-upgrade intent already recorded; reconcile only' }
          $marker = '<!-- sing-box-windows-program-prepare/v1 -->'
          $record = [ordered]@{
            schema = 'sing-box.windows-program-prepare/v1'
            phase = 'BEGIN'
            original_run_id = [long]$env:SOURCE_RUN_ID
            github_run_id = [long]$env:GITHUB_RUN_ID
            source_revision = $env:ACCEPTED_REVISION
            release_set_sha256 = $env:ACCEPTED_RELEASE
          }
          $body = $marker + "`n" + ($record | ConvertTo-Json -Compress)
          & gh api -X POST "repos/$env:GITHUB_REPOSITORY/issues/26/comments" --raw-field "body=$body" > $null
          if ($LASTEXITCODE -ne 0) { throw 'FIRST_USE_UPGRADE_UNKNOWN: durable intent write uncertain; no replay' }
          $readback = @(& $reader)
          if (@($readback | Where-Object { [string]$_.body -ceq $body }).Count -ne 1) {
            throw 'FIRST_USE_UPGRADE_UNKNOWN: exactly-one durable intent readback unproven; no replay'
          }
          Write-Host 'first_use_upgrade_intent=COMMITTED_ONCE'
          Write-Host 'credential_staging_begin=NOT_WRITTEN'
      - name: Execute one stopped native offline ReleaseSet upgrade with bounded readback
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $script -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}'
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_UPGRADE_UNKNOWN: native offline handoff incomplete; do not replay' }
          Write-Host 'first_use_binary_prepare=EXACT_STOPPED_RELEASE_ACCEPTED'
          Write-Host 'first_use_staging_begin=NOT_WRITTEN'
          Write-Host 'credential_pair_committed=false'

  initial_first_use_preflight:
    name: Windows / read-only installed-owner capability before BEGIN
    needs: resolve
    if: needs.resolve.outputs.operation == 'initial-pair-stage'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 8
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout exact accepted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: Verify installed native CLI and private SYSTEM cursor before marker
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          & $handoff -AcceptedRevision '${{ needs.resolve.outputs.accepted_revision }}' -ReleaseSetSha256 '${{ needs.resolve.outputs.release_set_sha256 }}' -Preflight -RequireCurrentRelease
          if ($LASTEXITCODE -ne 0 -or -not $?) {
            throw 'FIRST_USE_PREBEGIN_BLOCKED: installed native capability not proven'
          }

  initial_first_use_reservation:
    name: Windows / single-use durable candidate staging BEGIN
    needs: [resolve, initial_first_use_preflight]
    if: needs.resolve.outputs.operation == 'initial-pair-stage' && needs.initial_first_use_preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    concurrency:
      group: credential-transaction-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Persist exact single-use staging authorization before host mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ needs.resolve.outputs.source_run_id }}
          GENERATION: ${{ needs.resolve.outputs.initial_generation }}
          SLOT: ${{ needs.resolve.outputs.initial_slot }}
          RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$GITHUB_REPOSITORY" = 'iamaman11/sing-box'
          test "$ORIGINAL_RUN" = "$GENERATION"
          [[ "$RELEASE" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SLOT" == A || "$SLOT" == B ]]
          history="$RUNNER_TEMP/initial-history.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" |
            jq -s 'add' > "$history"
          jq -e --argjson original "$ORIGINAL_RUN" --arg slot "$SLOT" '
            [.[]|.body|select(startswith("<!-- sing-box-credential-initial-attempt/v1 -->"))] |
            if length==1 then .[0] else error("not exactly one original issue BEGIN") end |
            split("\n") |
            if length==2 then .[1]|fromjson else error("original BEGIN malformed") end |
            .schema=="sing-box.credential-initial-attempt/v1" and
            .phase=="BEGIN" and .generation==$original and
            .github_run_id==$original and .slot==$slot
          ' "$history" >/dev/null
          jq -e '
            [.[]|.body|select(contains("<!-- sing-box-windows-persistent-initial-stage/"))]|length==0
          ' "$history" >/dev/null
          marker='<!-- sing-box-windows-persistent-initial-stage/v1 -->'
          record="$(jq -nc --argjson source "$ORIGINAL_RUN" \
            --argjson run "$GITHUB_RUN_ID" --arg slot "$SLOT" \
            --arg release "$RELEASE" --arg revision "$GITHUB_SHA" \
            '{schema:"sing-box.windows-persistent-initial-stage/v1",phase:"BEGIN",original_run_id:$source,github_run_id:$run,slot:$slot,release_set_sha256:$release,source_revision:$revision}')"
          body="$(printf '%s\n%s' "$marker" "$record")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/26/comments" \
            --raw-field "body=$body" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/26/comments?per_page=100" |
            jq -s 'add' > "$history"
          jq -e --arg body "$body" '
            [.[]|.body|select(contains("<!-- sing-box-windows-persistent-initial-stage/"))] |
            length==1 and .[0]==$body
          ' "$history" >/dev/null
          echo 'first_use_stage_begin=COMMITTED_ONCE'
          echo 'credential_mutations=0'

  initial_first_use_stage:
    name: Windows / native persistent first-use candidate
    needs: [resolve, initial_first_use_reservation]
    if: needs.resolve.outputs.operation == 'initial-pair-stage' && needs.initial_first_use_reservation.result == 'success'
    runs-on: [self-hosted, Windows, X64, sing-box-windows-lab]
    timeout-minutes: 18
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.accepted_revision }}
          persist-credentials: false
          clean: true
      - name: One SYSTEM-owned offline candidate stage and native validation
        shell: powershell
        env:
          EDGE_FIRST_USE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
          EDGE_FIRST_USE_TARGET_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
          EDGE_FIRST_USE_TARGET_RELEASE: ${{ needs.resolve.outputs.release_set_sha256 }}
          FIRST_USE_GENERATION: ${{ needs.resolve.outputs.initial_generation }}
          FIRST_USE_SLOT: ${{ needs.resolve.outputs.initial_slot }}
        run: |
          $ErrorActionPreference = 'Stop'
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-first-use-offline-handoff.ps1'
          # The irreversible GitHub BEGIN is already persisted. No release
          # download/install, SCM retarget or fallback is permitted after BEGIN.
          & $handoff -AcceptedRevision $env:EDGE_FIRST_USE_TARGET_REVISION -ReleaseSetSha256 $env:EDGE_FIRST_USE_TARGET_RELEASE -Preflight -RequireCurrentRelease
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'FIRST_USE_STAGE_BLOCKED: exact previously prepared Windows release was not preserved' }
          $script = Join-Path $env:GITHUB_WORKSPACE 'edge-platform\scripts\windows-initial-pair-stage.ps1'
          & $script -Generation ([long]$env:FIRST_USE_GENERATION) -Slot $env:FIRST_USE_SLOT
          if ($LASTEXITCODE -ne 0 -or -not $?) { throw 'Windows initial stage ended without confirmed evidence' }

  physical:
    if: needs.resolve.outputs.operation != 'acceptance-reconcile' && needs.resolve.outputs.operation != 'initial-pair-stage' && needs.resolve.outputs.operation != 'initial-pair-prepare' && needs.resolve.outputs.operation != 'apply'
    name: Windows / ${{ needs.resolve.outputs.operation }}
    needs: resolve
    runs-on:
      - self-hosted
      - Windows
      - X64
      - sing-box-windows-lab
    timeout-minutes: 20
    concurrency:
      group: sing-box-windows-physical
      cancel-in-progress: false
    permissions: {}
    env:
      EDGE_INSTALL_ROOT: C:\sing-box
      EDGE_CONTROLLER_ENDPOINT: http://127.0.0.1:45151
      EDGE_ACCEPTED_REVISION: ${{ needs.resolve.outputs.accepted_revision }}
      EDGE_RELEASE_SET_SHA256: ${{ needs.resolve.outputs.release_set_sha256 }}
      EDGE_OPERATION: ${{ needs.resolve.outputs.operation }}
      EDGE_READONLY_PURPOSE: ${{ needs.resolve.outputs.readonly_purpose }}
      EDGE_EXPECTED_MODE: ${{ needs.resolve.outputs.expected_mode }}
    steps:
      - name: Observe safe Windows state (read-only)
        if: ${{ needs.resolve.outputs.operation == 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if ($root -cne 'C:\sing-box' -or
              $workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: root/workspace isolation'
          }
          $current = Join-Path $root 'current.pb'
          $stable = Join-Path $root 'bin\edge-diagnostic.exe'
          if (-not (Test-Path -LiteralPath $stable -PathType Leaf)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: stable diagnostic missing'
          }
          function Read-Doctor([string]$binary) {
            $output = @(& $binary doctor $current)
            $code = $LASTEXITCODE
            $values = @{}
            foreach ($line in $output) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
            }
            return @{ values = $values; code = $code }
          }
          function Assert-Doctor([hashtable]$observation) {
            $v = $observation['values']
            if ([string]$v['exact_release_files'] -cne 'PASS' -or
                [string]$v['scm_service_name'] -cne 'EdgePlatformController' -or
                [string]$v['release_set_sha256'] -notmatch '^[0-9a-f]{64}$' -or
                [string]$v['windows_datapath_mode'] -notin @('ManagedTun','ProxyOnly') -or
                [string]$v['scm_start_type'] -notin @('AutoStart','OnDemand','Disabled')) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: exact release/SCM/mode incomplete'
            }
            $cleanStopped = (
              [string]$v['scm_state'] -ceq 'Stopped' -and
              [string]$v['managed_tun_present'] -ceq 'false' -and
              [string]$v['managed_singbox_process_count'] -ceq '0' -and
              [string]$v['orphan_singbox_process_count'] -ceq '0' -and
              [string]$v['conflicting_singbox_process_count'] -ceq '0' -and
              [string]$v['unknown_singbox_process_count'] -ceq '0'
            )
            if ($observation['code'] -ne 0 -and -not $cleanStopped) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: failed doctor without exact clean stopped evidence'
            }
            return $cleanStopped
          }
          $a = Read-Doctor $stable
          $stoppedA = Assert-Doctor $a
          $exact = [string]$a['values']['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($exact) -or -not (Test-Path -LiteralPath $exact -PathType Leaf)) {
            throw 'READ_ONLY_DIAGNOSE_BLOCKED: exact diagnostic missing'
          }
          $b = Read-Doctor $exact
          $stoppedB = Assert-Doctor $b
          if ($stoppedA -ne $stoppedB) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: stopped state drift' }
          foreach ($key in @('release_set_sha256','windows_datapath_mode','scm_state','scm_start_type',
              'managed_tun_present','managed_singbox_process_count','orphan_singbox_process_count',
              'conflicting_singbox_process_count','unknown_singbox_process_count')) {
            if ([string]$a['values'][$key] -cne [string]$b['values'][$key]) {
              throw "READ_ONLY_DIAGNOSE_BLOCKED: observation changed in $key"
            }
          }
          $v = $b['values']
          $desired = if ([string]$v['windows_datapath_mode'] -cne $env:EDGE_EXPECTED_MODE) { 'DEGRADED_INSTALLED_MODE' }
              elseif ($stoppedB -and $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun') { 'DEGRADED_STOPPED' }
              elseif ($b['code'] -eq 0) { 'PASS' } else { 'DEGRADED' }
          $safety = if ($stoppedB -and [string]$v['scm_start_type'] -ceq 'AutoStart') {
              'BLOCKED_STOPPED_OWNER_AUTOSTART'
            } else { 'BLOCKED_NO_INDEPENDENT_DNS_CONTROL_RECOVERY' }
          Write-Host 'observation_status=PASS'
          Write-Host "desired_state_status=$desired"
          Write-Host "scm_state=$([string]$v['scm_state'])"
          Write-Host "scm_start_type=$([string]$v['scm_start_type'])"
          Write-Host "managed_tun_present=$([string]$v['managed_tun_present'])"
          Write-Host "release_set_sha256=$([string]$v['release_set_sha256'])"
          Write-Host "managed_tun_restart_safety=$safety"
          Write-Host 'independent_no_tun_dns_control_recovery=UNPROVEN'
          # A single bounded SYSTEM observation, without runner access to
          # persistent secrets. No raw detail lines appear in public job logs.
          $ownerConsole = [string]$v['console_path']
          $ownerDetail = ''
          if (-not [string]::IsNullOrWhiteSpace($ownerConsole) -and
              (Test-Path -LiteralPath $ownerConsole -PathType Leaf)) {
            $ownerOutput = @(& $ownerConsole privileged-runtime-evidence --install-root $root)
            $ownerExit = $LASTEXITCODE
            $detailRows = @($ownerOutput | Where-Object { [string]$_ -like 'detail=runtime_evidence=BOUNDED_READ_ONLY;*' })
            if ($ownerExit -eq 0 -and $detailRows.Count -eq 1) {
              $ownerDetail = [string]$detailRows[0]
            }
          }
          function Read-BoundedField([string]$key, [string]$accepted) {
            if ([string]::IsNullOrEmpty($ownerDetail)) { return 'UNKNOWN' }
            $matches = [regex]::Matches($ownerDetail, '(?:^|;)' + [regex]::Escape($key) + '=([^;]*)')
            if ($matches.Count -ne 1) { return 'UNKNOWN' }
            $value = $matches[0].Groups[1].Value
            if ($value -cnotmatch $accepted) { return 'UNKNOWN' }
            return $value
          }
          $fields = @(
            ,@('credential_cursor','^(ABSENT|VALID)$')
            ,@('credential_active_present','^(true|false)$')
            ,@('credential_active_generation','^(0|[1-9][0-9]*)$')
            ,@('credential_active_slot','^(A|B|NONE|UNKNOWN)$')
            ,@('credential_candidate_present','^(true|false)$')
            ,@('credential_candidate_generation','^(0|[1-9][0-9]*)$')
            ,@('credential_candidate_slot','^(A|B|NONE|UNKNOWN)$')
            ,@('credential_previous_present','^(true|false)$')
            ,@('credential_active_sha256','^(ABSENT|[0-9a-f]{64})$')
            ,@('credential_candidate_sha256','^(ABSENT|[0-9a-f]{64})$')
            ,@('credential_initial_commit_receipt_present','^(true|false)$')
            ,@('credential_initial_recovery_receipt_present','^(true|false)$')
            ,@('first_use_runtime','^(ABSENT|PRESENT)$')
            ,@('first_use_config','^(ABSENT|PRESENT)$')
            ,@('first_use_access_identity','^(ABSENT|INVALID|PRESENT_NONEMPTY_UNVERIFIED)$')
            ,@('credential_lifecycle_state','^(FRESH_LOCAL_ONLY|FRESH_NEEDS_IDENTITY|EXISTING_ACTIVE_UNVERIFIED|EXISTING_CANDIDATE_UNVERIFIED|EXISTING_TRANSITION_UNVERIFIED|PARTIAL|UNKNOWN)$')
            ,@('credential_next_action','^(JOURNAL_AUTHORIZATION_REQUIRED|NATIVE_IDENTITY_BOOTSTRAP_REQUIRED|READ_ONLY_ORIGIN_RECONCILE|READ_ONLY_RECONCILE)$')
          )
          Write-Host "credential_evidence_status=$(if ($ownerDetail) { 'BOUNDED_READ_ONLY' } else { 'UNAVAILABLE' })"
          foreach ($entry in $fields) {
            $key = [string]$entry[0]
            Write-Host "$key=$(Read-BoundedField $key ([string]$entry[1]))"
          }
          Write-Host 'credential_origin=UNPROVEN'
          if ($stoppedB) {
            $route = Get-NetRoute -AddressFamily IPv4 -DestinationPrefix '0.0.0.0/0' -ErrorAction Stop |
              Sort-Object RouteMetric,InterfaceMetric | Select-Object -First 1
            if ($null -eq $route -or [int]$route.InterfaceIndex -le 0) {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: IPv4 default route missing'
            }
            $adapter = Get-NetAdapter -InterfaceIndex ([int]$route.InterfaceIndex) -ErrorAction Stop
            if ([string]$adapter.Name -ceq 'sing-box-tun') {
              throw 'READ_ONLY_DIAGNOSE_BLOCKED: route captured by sing-box'
            }
            Write-Host "direct_default_adapter=$($adapter.Name)"
            Write-Host "direct_default_gateway=$($route.NextHop)"
            $servers = @(Get-DnsClientServerAddress -InterfaceIndex ([int]$route.InterfaceIndex) -AddressFamily IPv4 -ErrorAction Stop |
              ForEach-Object ServerAddresses)
            if ($servers.Count -eq 0) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: IPv4 resolver missing' }
            Write-Host "direct_dns_server_count=$($servers.Count)"
            $dns = @(Resolve-DnsName www.gstatic.com -Type A -DnsOnly -ErrorAction Stop |
              Where-Object { $_.IPAddress })
            if ($dns.Count -eq 0) { throw 'READ_ONLY_DIAGNOSE_BLOCKED: independent DNS failed' }
            Write-Host 'direct_dns_resolution=PASS'
            $http = (& curl.exe --noproxy '*' --silent --show-error --fail --connect-timeout 8 --max-time 15 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
            if ($LASTEXITCODE -ne 0 -or $http -cne '204') {
              throw "READ_ONLY_DIAGNOSE_BLOCKED: direct HTTPS failed exit=$LASTEXITCODE status=$http"
            }
            Write-Host 'direct_no_proxy_https=PASS'
          }
          if ($env:EDGE_READONLY_PURPOSE -ceq 'offline-preflight') {
            # This operator read-only preview must cover both safe source
            # states supported by the native first-use offline handoff.
            $formerManagedTun = (
              [string]$v['windows_datapath_mode'] -ceq 'ManagedTun' -and
              $desired -ceq 'DEGRADED_INSTALLED_MODE' -and
              [string]$v['scm_start_type'] -ceq 'AutoStart'
            )
            $stoppedProxyOnly = (
              [string]$v['windows_datapath_mode'] -ceq 'ProxyOnly' -and
              $desired -ceq 'PASS' -and
              [string]$v['scm_start_type'] -ceq 'OnDemand'
            )
            if (-not $stoppedB -or $env:EDGE_EXPECTED_MODE -cne 'ProxyOnly' -or
                (-not $formerManagedTun -and -not $stoppedProxyOnly)) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: requires exact stopped ManagedTun or manual ProxyOnly with no TUN'
            }
            $installed = [string]$v['release_set_sha256']
            $target = [string]$env:EDGE_RELEASE_SET_SHA256
            if ($target -notmatch '^[0-9a-f]{64}$' -or $installed -cnotmatch '^[0-9a-f]{64}$') {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: installed or accepted target identity is malformed'
            }
            $console = [string]$v['console_path']
            if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: exact installed immutable console missing'
            }
            $privileged = @(& $console privileged-runtime-evidence --install-root $root)
            if ($LASTEXITCODE -ne 0) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: installed privileged evidence task unreachable'
            }
            $detail = @($privileged | Where-Object { [string]$_ -like 'detail=*' })
            if ($detail.Count -ne 1 -or
                [string]$detail[0] -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY;' -or
                [string]$detail[0] -notmatch ';process_classification=ABSENT;process_evidence_complete=true;process_count=0;' -or
                [string]$detail[0] -notmatch ';external_owner_evidence=INCOMPLETE;external_count=0(?:;|$)') {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: privileged task could not attest zero managed and external owners'
            }
            $service = Get-CimInstance -ClassName Win32_Service -Filter "Name='EdgePlatformController'" -ErrorAction Stop
            $expectedStartMode = if ($formerManagedTun) { 'Auto' } else { 'Manual' }
            if ($null -eq $service -or [string]$service.State -cne 'Stopped' -or
                [string]$service.StartMode -cne $expectedStartMode) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: SCM state or startup mode changed'
            }
            $installedCommands = @(& $console --help)
            if ($LASTEXITCODE -ne 0) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: exact installed console command contract unreadable'
            }
            $offlineCommandAdvertised = @(
              $installedCommands | Where-Object { [string]$_ -match '\bprivileged-offline-activate\b' }
            ).Count -gt 0
            if (-not $offlineCommandAdvertised) {
              throw 'OFFLINE_PREFLIGHT_BLOCKED: immutable installed native owner cannot perform offline upgrade'
            }
            Write-Host "offline_source_mode=$([string]$v['windows_datapath_mode'])"
            Write-Host 'offline_preflight_observation=PASS'
            Write-Host 'offline_privileged_task_readonly=PASS'
            Write-Host "offline_command_advertised=$offlineCommandAdvertised"
            Write-Host 'offline_zero_runtime_owners=PASS'
            Write-Host "offline_installed_release=$installed"
            Write-Host "offline_accepted_target_release=$target"
            Write-Host "offline_release_transition_needed=$($installed -cne $target)"
            Write-Host 'offline_native_activation=NOT_EXECUTED_READ_ONLY_PREFLIGHT'
            Write-Host 'offline_mutations_performed=0'
            Write-Host 'offline_service_or_tun_restarted=false'
            @(
              '### Offline handoff preflight (read-only)',
              '- Native privileged task: reachable / zero runtime owners',
              "- Installed release: $installed",
              "- Accepted release: $target",
              '- Offline activation: not executed; installed CLI capability observed above',
              '- Changes to Windows service / TUN / DNS / routes: none'
            ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          foreach ($name in @('state','runtime','logs')) {
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries((Join-Path $root $name)) | Out-Null }
            catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "READ_ONLY_DIAGNOSE_BLOCKED: runner can read private state: $name" }
          }
          @(
            '### Windows read-only observation',
            '- Observation: PASS',
            "- Desired state: $desired",
            "- SCM: $([string]$v['scm_state'])",
            "- TUN: $([string]$v['managed_tun_present'])",
            "- Startup: $([string]$v['scm_start_type'])",
            "- Safety: $safety",
            '- Independent DNS/control recovery: UNPROVEN'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Assert isolated root and observe pre-state
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_INSTALL_ROOT -cne 'C:\sing-box') { throw 'Unexpected install root' }
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $root = [IO.Path]::GetFullPath($env:EDGE_INSTALL_ROOT)
          if ($workspace.StartsWith($root + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Runner workspace overlaps managed install root'
          }
          $stableDiagnostic = Join-Path $root 'bin\edge-diagnostic.exe'
          if (-not (Test-Path -LiteralPath $stableDiagnostic -PathType Leaf)) { throw 'Installed stable diagnostic is missing' }
          $current = Join-Path $root 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact active release files'
          }

          # A verified installed ProxyOnly release can be intentionally Stopped;
          # unlike ManagedTun this never requires host TUN teardown.
          $proxyOnlyStopped = (
            $env:EDGE_OPERATION -in @('start','stop','converge') -and
            $env:EDGE_EXPECTED_MODE -ceq 'ProxyOnly' -and
            [string]$bootstrapValues['windows_datapath_mode'] -ceq 'ProxyOnly' -and
            [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
            [string]$bootstrapValues['scm_start_type'] -ceq 'OnDemand' -and
            [string]$bootstrapValues['managed_tun_present'] -ceq 'false' -and
            [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['orphan_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 0 -and
            [int]$bootstrapValues['unknown_singbox_process_count'] -eq 0
          )
          $stoppedOwnerRecovery = $false
          $cleanStoppedBootstrap = $false
          $runningLegacyDiagnosticRecovery = $false
          $legacyManagedPid = ''
          if ($bootstrapExit -ne 0) {
            $boundedStoppedOwner = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1
            )
            $boundedCleanStopped = (
              $env:EDGE_OPERATION -eq 'converge' -and
              [string]$bootstrapValues['exact_release_files'] -ceq 'PASS' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Stopped' -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 0 -and
              [string]$bootstrapValues['managed_tun_present'] -ceq 'false'
            )
            # Only the installed known broken diagnostic may use this one-time
            # upgrade path. SCM parent match is not sufficient as authority.
            $legacyCandidates = @(
              $bootstrapDoctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $boundedRunningLegacy = (
              $env:EDGE_OPERATION -eq 'converge' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun' -and
              [string]$bootstrapValues['release_set_sha256'] -ceq '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -and
              [string]$env:EDGE_RELEASE_SET_SHA256 -cne [string]$bootstrapValues['release_set_sha256'] -and
              [string]$bootstrapValues['windows_datapath_mode'] -ceq 'ManagedTun' -and
              [string]$bootstrapValues['scm_state'] -ceq 'Running' -and
              [string]$bootstrapValues['scm_process_id'] -match '^\d+$' -and
              [string]$bootstrapValues['scm_executable_matches_release'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_present'] -ceq 'true' -and
              [string]$bootstrapValues['controller_listener_pid'] -ceq [string]$bootstrapValues['scm_process_id'] -and
              [int]$bootstrapValues['managed_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['orphan_singbox_process_count'] -eq 0 -and
              [int]$bootstrapValues['conflicting_singbox_process_count'] -eq 1 -and
              $legacyCandidates.Count -eq 1 -and
              ($legacyCandidates[0].Split(':')[1]) -ceq [string]$bootstrapValues['scm_process_id']
            )
            if ($boundedRunningLegacy) {
              # The installed old doctor returns before network observations.
              # Prove TUN from read-only OS state, not a missing doctor field.
              $adapters = @(Get-NetAdapter -Name 'sing-box-tun' -ErrorAction Stop)
              if ($adapters.Count -ne 1 -or [string]$adapters[0].Status -cne 'Up') {
                throw 'Legacy managed TUN adapter is not uniquely Up'
              }
              $tunIf = [int]$adapters[0].ifIndex
              $ips = @(Get-NetIPAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                Where-Object { $_.IPAddress -ceq '172.19.0.1' -and $_.PrefixLength -eq 30 })
              if ($ips.Count -ne 1) { throw 'Legacy managed TUN exact IPv4 address is absent' }
              $tunDns = @(Get-DnsClientServerAddress -InterfaceIndex $tunIf -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses)
              if ($tunDns -notcontains '172.19.0.2') {
                throw 'Legacy managed TUN DNS is not on the canonical interface'
              }
              Write-Host 'legacy_managed_tun_os_readonly=PASS'
            }
            if (-not $proxyOnlyStopped -and -not $boundedStoppedOwner -and -not $boundedCleanStopped -and -not $boundedRunningLegacy) {
              throw "Stable pre-state diagnostic failed: $bootstrapExit"
            }

            $stableConsole = Join-Path $root 'bin\edge-console.exe'
            if (-not (Test-Path -LiteralPath $stableConsole -PathType Leaf)) {
              throw 'Installed stable console is missing for bounded recovery evidence'
            }
            $recoveryEvidence = @(& $stableConsole privileged-runtime-evidence --install-root $root)
            $recoveryEvidenceExit = $LASTEXITCODE
            $recoveryEvidence | Write-Host
            if ($recoveryEvidenceExit -ne 0) {
              throw "Bounded privileged evidence failed: $recoveryEvidenceExit"
            }
            $recoveryDetail = [string]($recoveryEvidence |
              Where-Object { [string]$_ -like 'detail=*' } |
              Select-Object -Last 1)
            if ([string]::IsNullOrWhiteSpace($recoveryDetail) -or
                $recoveryDetail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
              throw 'Bounded recovery did not return the privileged evidence contract'
            }
            if ($recoveryDetail -notmatch 'external_owner_evidence=INCOMPLETE;external_count=0(?:;|$)') {
              throw 'Bounded recovery still observes privileged external sing-box ownership'
            }

            if ($boundedRunningLegacy) {
              $parts = $legacyCandidates[0].Split(':')
              $owner = [regex]::Escape([string]$bootstrapValues['scm_process_id'])
              $child = [regex]::Escape([string]$parts[0])
              if ($recoveryDetail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                  $recoveryDetail -notmatch ';external_count=0(?:;|$)' -or
                  $recoveryDetail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
                throw 'Old diagnostic disagreement lacks exact SYSTEM managed-owner proof'
              }
              $legacyManagedPid = [string]$parts[0]
              $runningLegacyDiagnosticRecovery = $true
              Write-Host 'running_legacy_diagnostic=PRIVILEGED_EXACT_PROOF'
            } elseif ($proxyOnlyStopped) {
              Write-Host 'proxy_only_stopped_owner=VERIFIED_NO_TUN'
            } elseif ($boundedStoppedOwner) {
              $stoppedOwnerRecovery = $true
              "EDGE_STOPPED_OWNER_RECOVERY=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Recovering stopped SCM owner only after privileged evidence proved zero external sing-box owners'
            } else {
              $cleanStoppedBootstrap = $true
              "EDGE_CLEAN_STOPPED_BOOTSTRAP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
              Write-Warning 'Bootstrapping Release A from the already-proven clean stopped ManagedTun state'
            }
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ($doctorExit -ne 0 -and -not $proxyOnlyStopped -and -not $stoppedOwnerRecovery -and -not $cleanStoppedBootstrap -and -not $runningLegacyDiagnosticRecovery) {
            throw "Exact pre-state diagnostic failed: $doctorExit"
          }
          if ($stoppedOwnerRecovery) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1) {
              throw 'Stopped-owner recovery evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'stopped_owner_recovery_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CONFLICT'
            }
          }
          if ($cleanStoppedBootstrap) {
            if ([string]$values['scm_state'] -cne 'Stopped' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['managed_tun_present'] -cne 'false') {
              throw 'Clean stopped bootstrap evidence changed between stable and immutable diagnostics'
            }
            if ($doctorExit -ne 0) {
              $LASTEXITCODE = 0
              Write-Host 'clean_stopped_bootstrap_diagnostic_exit=NORMALIZED_AFTER_PROVEN_CLEAN_STATE'
            }
          }
          if ($runningLegacyDiagnosticRecovery) {
            $exactCandidates = @(
              $doctor | ForEach-Object {
                if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false config_matches:false parent_matches:true parent:(\d+) start_unix_seconds:0 exe:UNKNOWN config:UNKNOWN cmd:\s*$') {
                  "$($Matches[1]):$($Matches[2])"
                }
              } | Sort-Object -Unique
            )
            $expectedPair = ([string]$legacyManagedPid) + ':' + ([string]$values['scm_process_id'])
            if ([string]$values['release_set_sha256'] -cne '123669b2503b08eec21fdd551d5a2803bb252f37e4c0ba021fe5b4d67a416c76' -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_executable_matches_release'] -cne 'true' -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 1 -or
                $exactCandidates.Count -ne 1 -or
                $exactCandidates[0] -cne $expectedPair -or
                [string]$values['scm_process_id'] -cne [string]$bootstrapValues['scm_process_id']) {
              throw 'Legacy active runtime changed after bounded SYSTEM owner proof'
            }
            $LASTEXITCODE = 0
            Write-Host 'running_legacy_diagnostic_exit=NORMALIZED_AFTER_PRIVILEGED_EXACT_PROOF'
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') {
            throw 'Exact active diagnostic could not verify its ReleaseSet files'
          }
          $currentRelease = [string]$values['release_set_sha256']
          if ($env:EDGE_OPERATION -eq 'repair' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Repair target must equal the exact current ReleaseSet before runtime stop'
          }
          $currentMode = [string]$values['windows_datapath_mode']
          $currentTun = if ($runningLegacyDiagnosticRecovery) { 'true' } else { [string]$values['managed_tun_present'] }
          # Independent ProxyOnly/no-TUN teardown remains unsupported. A strictly
          # managed-TUN previous-release rollback is an explicit release handoff,
          # not permission to stop the host TUN or mutate foreign DNS ownership.
          if ($env:EDGE_OPERATION -eq 'stop' -and $currentMode -cne 'ProxyOnly') {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: ManagedTun stop requires independent DNS/control restoration'
          }
          if ($env:EDGE_OPERATION -eq 'rollback') {
            if ($currentMode -cne 'ManagedTun' -or $env:EDGE_EXPECTED_MODE -cne 'ManagedTun' -or
                $currentTun -cne 'true' -or $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256 -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_executable_matches_release'] -cne 'true' -or
                [string]$values['controller_listener_present'] -cne 'true' -or
                [string]$values['controller_listener_pid'] -cne [string]$values['scm_process_id']) {
              throw 'PRE_MUTATION_ROLLBACK_BLOCKED: exact accepted Running ManagedTun owner required'
            }
            $foreignAdapter = Get-NetAdapter -Name 'CloudflareWARP' -ErrorAction Stop
            $foreignDns = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
            $routerDns = @(Get-DnsClientServerAddress -InterfaceAlias 'Ethernet' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
            if ([string]$foreignAdapter.Status -cne 'Up' -or
                ($foreignDns -join ',') -cne '172.19.0.2,192.168.100.1' -or
                ($routerDns -join ',') -cne '192.168.100.1') {
              throw 'PRE_MUTATION_ROLLBACK_BLOCKED: foreign CloudflareWARP/Ethernet DNS or owner differs from accepted no-TUN rescue baseline'
            }
            Write-Host 'managed_tun_previous_rollback_dns_owner_preflight=PASS'
          }
          if ($currentMode -ceq 'ManagedTun' -and
              $env:EDGE_EXPECTED_MODE -ceq 'ProxyOnly' -and
              $env:EDGE_OPERATION -in @('converge','repair')) {
            throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: ManagedTun to ProxyOnly requires independent DNS/control-channel recovery'
          }
          switch ($currentMode) {
            'ProxyOnly' {
              if ($currentTun -cne 'false' -or
                  [string]$values['scm_start_type'] -cne 'OnDemand' -or
                  [string]$values['scm_executable_matches_release'] -cne 'true' -or
                  [string]$values['scm_state'] -notin @('Stopped','Running')) {
                throw 'PROXY_ONLY_SCM_BLOCKED: expected immutable Manual-start owner with no TUN'
              }
              if ($env:EDGE_OPERATION -eq 'converge' -and $currentRelease -cne $env:EDGE_RELEASE_SET_SHA256) {
                if ([string]$values['scm_state'] -cne 'Stopped' -or
                    [int]$values['managed_singbox_process_count'] -ne 0 -or
                    [int]$values['orphan_singbox_process_count'] -ne 0 -or
                    [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                    [int]$values['unknown_singbox_process_count'] -ne 0) {
                  throw 'PROXY_ONLY_SCM_BLOCKED: release upgrade requires explicitly Stopped clean ProxyOnly; stop first'
                }
                Write-Host 'proxy_only_upgrade=EXACT_OFFLINE_CURRENT_TO_ACCEPTED'
              }
            }
            'ManagedTun' {
              # Incident 2026-10-10: never recapture host routes from a stopped,
              # partially activated or unowned ManagedTun before independently
              # proven no-TUN DNS/control recovery and live Line1 authentication.
              # Neither a green ReleaseSet nor sing-box config syntax proves it.
              # Read-only /windows diagnose uses its separate safe observation step.
              if ($currentTun -cne 'true' -or
                  [string]$values['scm_state'] -cne 'Running' -or
                  [int]$values['managed_singbox_process_count'] -ne 1) {
                throw 'PRE_MUTATION_MANAGED_TUN_PREAUTH_BLOCKED: active authenticated Line1 and independent no-TUN DNS/control restoration are UNPROVEN; do not capture Windows routes'
              }
            }
            default { throw "Unsupported installed Windows datapath mode: $currentMode" }
          }
          if ($env:EDGE_OPERATION -eq 'diagnose' -and $currentMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Installed datapath mode $currentMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          "EDGE_BEFORE_MODE=$currentMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $console = [string]$values['console_path']
          if ([string]::IsNullOrWhiteSpace($console) -or -not (Test-Path -LiteralPath $console -PathType Leaf)) {
            throw 'Immutable console path is unavailable'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($stoppedOwnerRecovery) {
            if ($externalPids.Count -ne 1) {
              throw "Stopped-owner recovery expected one unprivileged ambiguous sing-box, observed $($externalPids.Count)"
            }
            $signature = ''
          } else {
            if ($externalPids.Count -ne 0) {
              throw "Stage 4B.2-C requires zero external sing-box owners; observed $($externalPids.Count)"
            }
            $signature = $externalPids -join ','
          }
          $managedBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($runningLegacyDiagnosticRecovery) { $managedBefore = @($legacyManagedPid) }
          $unknownBefore = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownBefore.Count -gt 0) {
            if ($unknownBefore.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$values['scm_state'] -cne 'Running' -or
                [string]$values['scm_process_id'] -notmatch '^\d+$') {
              throw 'Pre-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $privileged = @(& $console privileged-runtime-evidence --install-root $root)
            if ($LASTEXITCODE -ne 0) { throw 'Pre-state privileged runtime identity evidence unavailable' }
            $detail = [string]($privileged | Where-Object { [string]$_ -like 'detail=*' } | Select-Object -Last 1)
            $owner = [regex]::Escape([string]$values['scm_process_id'])
            $child = [regex]::Escape([string]$unknownBefore[0])
            if ($detail -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY;' -or
                $detail -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detail -notmatch ';external_count=0(?:;|$)' -or
                $detail -notmatch ';controller_service_error=ABSENT(?:;|$)') {
              throw 'Pre-state UNKNOWN sing-box is not confirmed by exact privileged owner evidence'
            }
            $managedBefore = @($unknownBefore[0])
            Write-Host 'prestate_managed_owner=PRIVILEGED_EXACT_PROOF'
          }
          "EDGE_BEFORE_CONTROLLER_PID=$([string]$values['scm_process_id'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_MANAGED_PID=$($managedBefore -join ',')" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'start' -and $managedBefore.Count -eq 1 -and
              [string]$values['scm_state'] -ceq 'Running') {
            "EDGE_START_NOOP=YES" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]$values['scm_state'] -cne 'Running' -or
                $managedBefore.Count -ne 1 -or
                [string]$values['managed_tun_present'] -cne 'true') {
              throw 'restart-controller requires healthy Running ManagedTun pre-state'
            }
          }
          if ($env:EDGE_OPERATION -in @('repair','rollback')) {
            $previous = Join-Path $root 'previous.pb'
            $previousDoctor = @(& $diagnostic doctor $previous)
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed: $LASTEXITCODE" }
            $previousValues = @{}
            foreach ($line in $previousDoctor) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousValues['exact_release_files'] -cne 'PASS') {
              throw 'Previous ReleaseSet exact files are not verified'
            }
            if ($env:EDGE_OPERATION -eq 'rollback') {
              if ([string]$previousValues['release_set_sha256'] -ceq $currentRelease -or
                  [string]$previousValues['windows_datapath_mode'] -cne 'ManagedTun' -or
                  $managedBefore.Count -ne 1 -or
                  [string]$values['managed_tun_present'] -cne 'true' -or
                  [string]$values['managed_tun_ipv4'] -cne '172.19.0.1' -or
                  [string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: distinct verified previous release and exact single-owner ManagedTun required'
              }
              # The CURRENT diagnostic reports its own compiled mode even for
              # previous.pb. Use the verified PREVIOUS immutable diagnostic to
              # prove its distinct compiled desired mode (read-only, no fetch).
              # Its later live-owner check may fail while a newer SCM runs; only
              # the initial verified release identity/mode fields are consumed.
              $previousDiagnostic = [string]$previousValues['diagnostic_path']
              if ([string]::IsNullOrWhiteSpace($previousDiagnostic) -or
                  -not (Test-Path -LiteralPath $previousDiagnostic -PathType Leaf)) {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: previous exact diagnostic missing'
              }
              $previousStatic = @(& $previousDiagnostic doctor $previous 2>$null)
              $previousStaticRelease = @($previousStatic | Where-Object { [string]$_ -match '^release_set_sha256=' })
              $previousStaticSource = @($previousStatic | Where-Object { [string]$_ -match '^source_revision=' })
              $previousStaticMode = @($previousStatic | Where-Object { [string]$_ -match '^windows_datapath_mode=' })
              if ($previousStaticRelease.Count -ne 1 -or
                  $previousStaticSource.Count -ne 1 -or
                  $previousStaticMode.Count -ne 1 -or
                  [string]$previousStaticRelease[0] -cne "release_set_sha256=$([string]$previousValues['release_set_sha256'])" -or
                  [string]$previousStaticSource[0] -cne "source_revision=$([string]$previousValues['source_revision'])" -or
                  [string]$previousStaticMode[0] -cne 'windows_datapath_mode=ManagedTun' -or
                  @($previousStatic | Where-Object { [string]$_ -ceq 'exact_release_files=PASS' }).Count -ne 1) {
                throw 'PRE_MUTATION_ROLLBACK_BLOCKED: verified previous binary does not attest exact ManagedTun source and files'
              }
              Write-Host 'previous_release_native_desired_managed_tun=PASS'
            }
            "EDGE_BEFORE_PREVIOUS_RELEASE=$([string]$previousValues['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          }
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_BEFORE_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_EXTERNAL_PIDS_BEFORE=$signature" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          $doctor | Write-Host

      - name: Execute typed lifecycle mutation
        id: lifecycle_mutation
        if: ${{ needs.resolve.outputs.operation != 'diagnose' && needs.resolve.outputs.operation != 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          switch ($env:EDGE_OPERATION) {
            'converge' {
              if ($env:EDGE_BEFORE_MODE -ceq 'ProxyOnly') {
                $exactConsole = $env:EDGE_CURRENT_CONSOLE
                if ($env:EDGE_BEFORE_RELEASE -cne $env:EDGE_RELEASE_SET_SHA256) {
                  # Only a separately stopped exact ProxyOnly owner is eligible.
                  # Native offline activation owns accepted release, SCM, task
                  # and rollback; never use legacy privileged-activate here.
                  & $exactConsole privileged-offline-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
                  if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly offline upgrade outcome UNKNOWN; DO NOT REPLAY' }
                  $exactConsole = Join-Path $env:EDGE_INSTALL_ROOT ("releases\" + $env:EDGE_RELEASE_SET_SHA256 + "\bin\edge-console.exe")
                  if (-not (Test-Path -LiteralPath $exactConsole -PathType Leaf)) {
                    throw 'ProxyOnly offline upgrade missing exact new immutable console; do not replay'
                  }
                }
                & $exactConsole privileged-start-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
                if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly SCM converge uncertain; do not replay' }
                & $exactConsole start-local $env:EDGE_CONTROLLER_ENDPOINT
              } else {
                & $env:EDGE_CURRENT_CONSOLE privileged-activate $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
              }
            }
            'start' {
              if ($env:EDGE_START_NOOP -ceq 'YES') {
                Write-Host 'runtime_start=NOOP_ALREADY_RUNNING'
                $LASTEXITCODE = 0
              } else {
                if ($env:EDGE_BEFORE_MODE -ceq 'ProxyOnly') {
                  & $env:EDGE_CURRENT_CONSOLE privileged-start-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
                  if ($LASTEXITCODE -ne 0) { throw 'ProxyOnly SCM start uncertain; do not replay' }
                }
                & $env:EDGE_CURRENT_CONSOLE start-local $env:EDGE_CONTROLLER_ENDPOINT
              }
            }
            'stop' {
              if ($env:EDGE_BEFORE_MODE -cne 'ProxyOnly') {
                throw 'ManagedTun stop remains blocked until independent DNS recovery is proven'
              }
              & $env:EDGE_CURRENT_CONSOLE privileged-stop-proxy-only-controller --install-root $env:EDGE_INSTALL_ROOT
            }
            'restart-controller' {
              & $env:EDGE_CURRENT_CONSOLE privileged-restart-controller-service --install-root $env:EDGE_INSTALL_ROOT
            }
            'repair' {
              & $env:EDGE_CURRENT_CONSOLE privileged-reinstall-accepted $env:EDGE_ACCEPTED_REVISION $env:EDGE_RELEASE_SET_SHA256 --install-root $env:EDGE_INSTALL_ROOT
            }
            'rollback' {
              & $env:EDGE_CURRENT_CONSOLE privileged-rollback-previous --install-root $env:EDGE_INSTALL_ROOT
            }
            default { throw "Unsupported operation: $env:EDGE_OPERATION" }
          }
          if ($LASTEXITCODE -ne 0) { throw "Lifecycle mutation failed: $LASTEXITCODE" }

      - name: Verify exact authority and SCM handoff
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stableDiagnostic = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-diagnostic.exe'
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $bootstrapDoctor = @(& $stableDiagnostic doctor $current)
          $bootstrapExit = $LASTEXITCODE
          $bootstrapDoctor | Write-Host
          if ($bootstrapExit -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Stable post-state diagnostic failed: $bootstrapExit" }
          $bootstrapValues = @{}
          foreach ($line in $bootstrapDoctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $bootstrapValues[$parts[0]] = $parts[1] }
          }
          if ([string]$bootstrapValues['exact_release_files'] -cne 'PASS') {
            throw 'Stable diagnostic could not verify exact post-state release files'
          }
          $diagnostic = [string]$bootstrapValues['diagnostic_path']
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact immutable post-state diagnostic path is unavailable'
          }
          $doctor = @(& $diagnostic doctor $current)
          $doctorExit = $LASTEXITCODE
          $doctor | Write-Host
          if ($doctorExit -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Exact post-state diagnostic failed: $doctorExit" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['exact_release_files'] -cne 'PASS') { throw 'Exact release files are not verified' }
          $afterMode = [string]$values['windows_datapath_mode']
          $afterTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $afterMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Active datapath mode $afterMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          switch ($afterMode) {
            'ProxyOnly' {
              if ($afterTun -cne 'false') { throw 'ProxyOnly state unexpectedly owns managed TUN' }
            }
            'ManagedTun' {
              if ($env:EDGE_OPERATION -eq 'stop') {
                if ($afterTun -cne 'false') { throw 'Managed TUN remained present after explicit runtime stop' }
              } else {
                if ($afterTun -cne 'true') { throw 'ManagedTun state is missing managed TUN' }
                if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') {
                  throw "Unexpected managed TUN IPv4: $($values['managed_tun_ipv4'])"
                }
                if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') {
                  throw "Unexpected managed TUN DNS IPv4: $($values['managed_tun_dns_ipv4'])"
                }
              }
            }
            default { throw "Unsupported active Windows datapath mode: $afterMode" }
          }
          if ($env:EDGE_OPERATION -in @('converge','repair') -and [string]$values['release_set_sha256'] -cne $env:EDGE_RELEASE_SET_SHA256) {
            throw 'Accepted ReleaseSet is not active'
          }
          if ($env:EDGE_OPERATION -in @('start','stop','restart-controller') -and [string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_RELEASE) {
            throw 'Transient runtime control changed ReleaseSet authority'
          }
          if ($env:EDGE_OPERATION -eq 'rollback') {
            if ([string]$values['release_set_sha256'] -ceq $env:EDGE_BEFORE_RELEASE) {
              throw 'Rollback did not change ReleaseSet authority'
            }
            if ([string]$values['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Rollback did not activate the exact previous ReleaseSet observed before mutation'
            }
          }
          if ($env:EDGE_OPERATION -eq 'repair') {
            $previousAfter = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'previous.pb'))
            if ($LASTEXITCODE -ne 0) { throw "Previous authority diagnostic failed after repair: $LASTEXITCODE" }
            $previousAfterValues = @{}
            foreach ($line in $previousAfter) {
              $parts = ([string]$line).Split('=', 2)
              if ($parts.Count -eq 2) { $previousAfterValues[$parts[0]] = $parts[1] }
            }
            if ([string]$previousAfterValues['release_set_sha256'] -cne $env:EDGE_BEFORE_PREVIOUS_RELEASE) {
              throw 'Repair changed previous ReleaseSet authority'
            }
          }
          $managedAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $afterControllerPid = [string]$values['scm_process_id']
          $unknownAfter = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          if ($unknownAfter.Count -gt 0) {
            if ($unknownAfter.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                [int]$values['managed_singbox_process_count'] -ne 0 -or
                [int]$values['conflicting_singbox_process_count'] -ne 0) {
              throw 'Post-state uninspectable sing-box ownership is not uniquely bounded'
            }
            $managedAfter = @($unknownAfter[0])
            Write-Host 'poststate_process_identity=UNKNOWN_AWAIT_PRIVILEGED_EVIDENCE'
          }
          $afterManagedPid = $managedAfter -join ','
          "EDGE_AFTER_CONTROLLER_PID=$afterControllerPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MANAGED_PID=$afterManagedPid" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ($env:EDGE_OPERATION -eq 'restart-controller') {
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_CONTROLLER_PID) -or
                $env:EDGE_BEFORE_CONTROLLER_PID -ceq 'ABSENT' -or
                $afterControllerPid -ceq $env:EDGE_BEFORE_CONTROLLER_PID) {
              throw 'SCM restart did not replace controller PID'
            }
            if ([string]::IsNullOrWhiteSpace($env:EDGE_BEFORE_MANAGED_PID) -or
                $afterManagedPid -ceq $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'SCM restart did not replace the exact managed child'
            }
          }
          if ($env:EDGE_OPERATION -eq 'start' -and $env:EDGE_START_NOOP -ceq 'YES') {
            if ($afterControllerPid -cne $env:EDGE_BEFORE_CONTROLLER_PID -or
                $afterManagedPid -cne $env:EDGE_BEFORE_MANAGED_PID) {
              throw 'Idempotent start caused controller or managed-child PID churn'
            }
            Write-Host 'runtime_start_noop_identity=PASS'
          }
          $console = [string]$values['console_path']
          $controller = [string]$values['controller_path']
          "EDGE_CURRENT_CONSOLE=$console" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_CURRENT_EXACT_DIAGNOSTIC=$diagnostic" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_RELEASE=$([string]$values['release_set_sha256'])" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          "EDGE_AFTER_MODE=$afterMode" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
          if ([string]$values['scm_service_name'] -cne 'EdgePlatformController') { throw 'SCM controller is missing' }
          if ([string]$values['scm_account'] -cne 'NT SERVICE\EdgePlatformController') { throw 'Unexpected SCM identity' }
          $expectedScm = if ($env:EDGE_OPERATION -eq 'stop') { 'Stopped' } else { 'Running' }
          $expectedStartup = if ($afterMode -ceq 'ProxyOnly') { 'OnDemand' } else { 'AutoStart' }
          if ([string]$values['scm_state'] -cne $expectedScm) { throw "SCM not $expectedScm" }
          if ([string]$values['scm_start_type'] -cne $expectedStartup) { throw "SCM startup not $expectedStartup" }
          if ($env:EDGE_OPERATION -eq 'stop' -and [string]$values['scm_process_id'] -cne 'ABSENT') {
            throw 'Stopped SCM has a process'
          }
          if ([string]$values['scm_executable_matches_release'] -cne 'true') { throw 'SCM binary does not match the active release' }
          $authority = ([Uri]$env:EDGE_CONTROLLER_ENDPOINT).Authority
          $expected = "$controller windows-service $env:EDGE_INSTALL_ROOT $authority"
          if ([string]$values['scm_executable_path'] -cne $expected) { throw 'SCM executable authority mismatch' }

      - name: Measure native Line1 named-outbound quality without changing routing
        if: ${{ needs.resolve.outputs.operation == 'quality-line1' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EDGE_BEFORE_MODE -cne 'ManagedTun') {
            throw 'Line1 quality requires installed, running ManagedTun; no mode change is permitted'
          }
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          $before = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality pre-measurement owner evidence unavailable' }
          $routeBefore = @($before | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          if ($routeBefore.Count -eq 0) { throw 'Native quality route evidence is missing' }
          $warpDnsBefore = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedBefore = @($before | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmBefore = @($before | Where-Object { $_ -match '^scm_process_id=' })
          if ($managedBefore.Count -ne 1 -or $scmBefore.Count -ne 1) {
            throw 'Native quality requires exactly one independently observed SCM and sing-box process'
          }
          Write-Host 'line1_quality_source=INSTALLED_VERIFIED_RELEASE'
          Write-Host "line1_quality_installed_release=$env:EDGE_BEFORE_RELEASE"
          Write-Host "line1_quality_target_mode=$env:EDGE_EXPECTED_MODE"
          $result = @(& $env:EDGE_CURRENT_CONSOLE quality-line1)
          $qualityExit = $LASTEXITCODE
          $result | Write-Host
          $after = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0) { throw 'Native quality post-measurement owner evidence unavailable' }
          $routeAfter = @($after | Where-Object { $_ -match '^route_interface(_ipv6)?=' } | Sort-Object)
          $warpDnsAfter = @(Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop | ForEach-Object ServerAddresses)
          $managedAfter = @($after | Where-Object { $_ -match '^singbox_process=pid:' } | Sort-Object)
          $scmAfter = @($after | Where-Object { $_ -match '^scm_process_id=' })
          if (($routeAfter -join "`n") -cne ($routeBefore -join "`n") -or
              ($managedAfter -join "`n") -cne ($managedBefore -join "`n") -or
              ($scmAfter -join "`n") -cne ($scmBefore -join "`n") -or
              ($warpDnsAfter -join ',') -cne ($warpDnsBefore -join ',')) {
            throw 'Line1 quality changed (or observed drift in) route, process owner or foreign WARP DNS evidence'
          }
          Write-Host 'native_line1_owner_route_dns_parity=PASS'
          if ($qualityExit -ne 0) { throw "Native Line1 quality reported unavailable HTTP samples: exit=$qualityExit" }

      - name: Prove managed DIRECT and WARP without runtime restart
        if: ${{ needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:EDGE_CURRENT_CONSOLE verify-runtime
          if ($LASTEXITCODE -ne 0) { throw "Managed proxy verification failed: $LASTEXITCODE" }

      - name: Read-only privileged runtime evidence after restart
        if: ${{ always() && needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceStrict = $true
          $evidenceConsole = $env:EDGE_CURRENT_CONSOLE
          if ([string]::IsNullOrWhiteSpace($evidenceConsole) -or
              -not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            $evidenceStrict = $false
            $evidenceConsole = Join-Path $env:EDGE_INSTALL_ROOT 'bin\edge-console.exe'
          }
          if (-not (Test-Path -LiteralPath $evidenceConsole -PathType Leaf)) {
            Write-Warning 'Privileged runtime evidence console is unavailable after an earlier lifecycle failure'
            exit 0
          }

          $evidenceLines = @(& $evidenceConsole privileged-runtime-evidence --install-root $env:EDGE_INSTALL_ROOT)
          $evidenceExit = $LASTEXITCODE
          $evidenceLines | Write-Host
          if ($evidenceExit -ne 0) {
            if ($evidenceStrict) { throw "Privileged read-only runtime evidence failed: $evidenceExit" }
            Write-Warning "Privileged conflict evidence failed read-only: $evidenceExit"
            exit 0
          }

          $detailLine = [string]($evidenceLines |
            Where-Object { [string]$_ -like 'detail=*' } |
            Select-Object -Last 1)
          if ([string]::IsNullOrWhiteSpace($detailLine) -or
              $detailLine -notmatch '^detail=runtime_evidence=BOUNDED_READ_ONLY') {
            if ($evidenceStrict) { throw 'Privileged runtime evidence did not return the bounded typed detail contract' }
            Write-Warning 'Privileged conflict evidence did not return the bounded typed detail contract'
            exit 0
          }

          if ($evidenceStrict -and $detailLine -notmatch '(?:^|;)controller_service_error=ABSENT(?:;|$)') {
            throw 'Controller service retains current startup-failure evidence after successful lifecycle verification'
          }
          $modeAtEvidence = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MODE)) { $env:EDGE_BEFORE_MODE } else { $env:EDGE_AFTER_MODE }
          if ($evidenceStrict -and $modeAtEvidence -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop') {
            $expectedChild = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_MANAGED_PID)) { $env:EDGE_BEFORE_MANAGED_PID } else { $env:EDGE_AFTER_MANAGED_PID }
            $expectedController = if ([string]::IsNullOrEmpty($env:EDGE_AFTER_CONTROLLER_PID)) { $env:EDGE_BEFORE_CONTROLLER_PID } else { $env:EDGE_AFTER_CONTROLLER_PID }
            if ([string]::IsNullOrWhiteSpace($expectedChild) -or $expectedChild -notmatch '^\d+$' -or
                [string]::IsNullOrWhiteSpace($expectedController) -or $expectedController -notmatch '^\d+$') {
              throw 'Privileged managed process identity lacks an exact diagnostic PID candidate'
            }
            $child = [regex]::Escape($expectedChild)
            $owner = [regex]::Escape($expectedController)
            if ($detailLine -notmatch ";process_classification=MANAGED;process_evidence_complete=true;process_count=1;managed_pid=$child;managed_parent_pid=$owner;controller_pid=$owner(?:;|$)" -or
                $detailLine -notmatch ';external_count=0(?:;|$)') {
              throw 'Privileged managed identity differs from the exact runner process observation'
            }
            "EDGE_PRIVILEGED_MANAGED_PID=$expectedChild" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            "EDGE_PRIVILEGED_CONTROLLER_PID=$expectedController" | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_ENV
            Write-Host 'managed_process_identity=PRIVILEGED_EXACT_PROOF'
          }
          if ($evidenceStrict -and $env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $env:EDGE_EXPECTED_MODE -ceq 'ManagedTun') {
            if ($detailLine -match '(?:^|;)stderr=MISSING(?:;|$)') {
              throw 'Managed sing-box stderr evidence is missing after lifecycle verification'
            }
            if ($detailLine -notmatch '(?:^|;)stderr=') {
              throw 'Managed sing-box stderr evidence was omitted from the bounded privileged result'
            }
            if ($detailLine -match 'failed to search process:\s*Access is denied') {
              throw 'Managed sing-box process lookup still reports Access is denied after fresh restart'
            }
            Write-Host 'managed_tun_process_search_access_denied=ABSENT'
          }

      - name: Prove MANAGED_TUN ordinary Windows traffic DNS and foreign Mesh coexistence
        if: ${{ (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair' || needs.resolve.outputs.operation == 'start' || needs.resolve.outputs.operation == 'restart-controller' || needs.resolve.outputs.operation == 'rollback') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for managed TUN proof'
          }
          $doctor = @(& $diagnostic doctor (Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'))
          if ($LASTEXITCODE -ne 0) { throw "Managed TUN diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          if ([string]$values['managed_tun_present'] -cne 'true') { throw 'Managed TUN is absent' }
          $tunIndex = [uint32]$values['managed_tun_interface_index']
          if ($tunIndex -eq 0) { throw 'Managed TUN interface index is invalid' }
          if ([string]$values['managed_tun_ipv4'] -cne '172.19.0.1') { throw 'Managed TUN IPv4 mismatch' }
          if ([string]$values['managed_tun_dns_ipv4'] -cne '172.19.0.2') { throw 'Managed TUN DNS mismatch' }
          $statusLines = @(& $env:EDGE_CURRENT_CONSOLE status $env:EDGE_CONTROLLER_ENDPOINT)
          if ($LASTEXITCODE -ne 0) { throw "Typed controller status failed: $LASTEXITCODE" }
          $serverIp = $null
          foreach ($line in $statusLines) {
            if ([string]$line -match '^Server IP\s+:\s+((?:\d{1,3}\.){3}\d{1,3})\s*$') {
              $serverIp = $Matches[1]
              break
            }
          }
          $parsedServerIp = [System.Net.IPAddress]::None
          if ([string]::IsNullOrWhiteSpace($serverIp) -or
              -not [System.Net.IPAddress]::TryParse($serverIp, [ref]$parsedServerIp) -or
              $parsedServerIp.AddressFamily -ne [System.Net.Sockets.AddressFamily]::InterNetwork) {
            throw "Typed controller status did not expose a valid production server IPv4: $serverIp"
          }
          $serverRoute = Find-NetRoute -RemoteIPAddress $serverIp |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $serverRoute) { throw "No Windows best route exists for production server $serverIp" }
          if ([uint32]$serverRoute.InterfaceIndex -eq $tunIndex) {
            throw "Production server $serverIp is captured by managed TUN"
          }
          $serverAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$serverRoute.InterfaceIndex) -ErrorAction Stop

          $dns = Resolve-DnsName 'www.gstatic.com' -Type A -DnsOnly -ErrorAction Stop |
            Where-Object { $_.IPAddress } |
            Select-Object -First 1
          if (-not $dns -or [string]::IsNullOrWhiteSpace([string]$dns.IPAddress)) {
            throw 'Ordinary Windows DNS did not return an IPv4 address'
          }
          $route = Find-NetRoute -RemoteIPAddress ([string]$dns.IPAddress) |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $route -or [uint32]$route.InterfaceIndex -ne $tunIndex) {
            throw 'Ordinary Internet destination does not select managed TUN'
          }

          $http = (& curl.exe --noproxy '*' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $http -cne '204') {
            throw "Ordinary no-proxy Windows HTTPS failed through managed TUN: exit=$LASTEXITCODE http=$http"
          }

          $localHttp = (& curl.exe --proxy 'http://127.0.0.1:17891' --silent --show-error --fail --connect-timeout 15 --max-time 30 --output NUL --write-out '%{http_code}' 'https://www.gstatic.com/generate_204').Trim()
          if ($LASTEXITCODE -ne 0 -or $localHttp -cne '204') {
            throw "Canonical local proxy failed with managed TUN: exit=$LASTEXITCODE http=$localHttp"
          }

          $meshRoute = Find-NetRoute -RemoteIPAddress '100.96.0.2' |
            Sort-Object RouteMetric |
            Select-Object -First 1
          if (-not $meshRoute) { throw 'Foreign Mesh/device route is absent' }
          $meshAdapter = Get-NetAdapter -InterfaceIndex ([uint32]$meshRoute.InterfaceIndex) -ErrorAction Stop
          if ([string]$meshAdapter.Name -cne 'CloudflareWARP') {
            throw "Foreign Mesh/device route escaped CloudflareWARP: $($meshAdapter.Name)"
          }
          if ([uint32]$meshRoute.InterfaceIndex -eq $tunIndex) {
            throw 'Managed TUN captured the foreign Mesh/device route'
          }

          $warpAdapter = Get-NetAdapter -Name 'CloudflareWARP' -ErrorAction Stop
          if ([string]$warpAdapter.Status -cne 'Up') {
            throw "Foreign CloudflareWARP adapter is not Up: $($warpAdapter.Status)"
          }
          $warpDns = @(
            Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
              ForEach-Object ServerAddresses
          )
          if ($warpDns -contains '172.31.255.2') {
            throw "Foreign CloudflareWARP still carries retired legacy TUN DNS 172.31.255.2: $($warpDns -join ',')"
          }

          Write-Host "managed_tun_server_bypass_ip=$serverIp"
          Write-Host "managed_tun_server_bypass_owner=$($serverAdapter.Name)"
          Write-Host 'managed_tun_server_bypass=PASS'
          Write-Host 'managed_tun_ordinary_dns=PASS'
          Write-Host 'managed_tun_ordinary_https=PASS'
          Write-Host 'managed_tun_local_proxy=PASS'
          Write-Host 'foreign_mesh_route_owner=CloudflareWARP'
          Write-Host "foreign_cloudflarewarp_dns=$($warpDns -join ',')"
          Write-Host "foreign_cloudflarewarp_tun_dns_repin=$($warpDns -contains '172.19.0.2')"

      - name: Refuse unproven automatic rollback after MANAGED_TUN verification failure
        if: ${{ failure() && steps.lifecycle_mutation.outcome == 'success' && (needs.resolve.outputs.operation == 'converge' || needs.resolve.outputs.operation == 'repair') && needs.resolve.outputs.expected_mode == 'ManagedTun' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'managed_tun_automatic_rollback=BLOCKED_NO_INDEPENDENT_DNS_RESTORE'
          throw 'PRE_MUTATION_TUN_TEARDOWN_BLOCKED: automatic rollback cannot prove CloudflareWARP DNS/control-channel recovery; preserve current runtime for independent diagnostics'

      - name: Final diagnostics and transport-only boundary
        if: ${{ needs.resolve.outputs.operation != 'diagnose' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $diagnostic = $env:EDGE_CURRENT_EXACT_DIAGNOSTIC
          $current = Join-Path $env:EDGE_INSTALL_ROOT 'current.pb'
          if ([string]::IsNullOrWhiteSpace($diagnostic) -or -not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) {
            throw 'Exact active diagnostic is unavailable for final verification'
          }
          $doctor = @(& $diagnostic doctor $current)
          if ($LASTEXITCODE -ne 0 -and $env:EDGE_OPERATION -ne 'stop') { throw "Final diagnostic failed: $LASTEXITCODE" }
          $values = @{}
          foreach ($line in $doctor) {
            $parts = ([string]$line).Split('=', 2)
            if ($parts.Count -eq 2) { $values[$parts[0]] = $parts[1] }
          }
          $unknownFinal = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:false identity_unknown:true(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $finalManagedCount = [int]$values['managed_singbox_process_count']
          if ($unknownFinal.Count -gt 0) {
            if ($unknownFinal.Count -ne 1 -or [int]$values['unknown_singbox_process_count'] -ne 1 -or
                $finalManagedCount -ne 0 -or [int]$values['conflicting_singbox_process_count'] -ne 0 -or
                [string]$env:EDGE_PRIVILEGED_MANAGED_PID -cne [string]$unknownFinal[0] -or
                [string]$env:EDGE_PRIVILEGED_CONTROLLER_PID -cne [string]$values['scm_process_id']) {
              throw 'Final process identity is UNKNOWN without exact matching privileged evidence'
            }
            $finalManagedCount = 1
          }
          if ($env:EDGE_OPERATION -in @('converge','repair','start','restart-controller','rollback','quality-line1') -and $finalManagedCount -ne 1) {
            throw "Expected one managed proxy process after $env:EDGE_OPERATION, observed $finalManagedCount"
          }
          if ($env:EDGE_OPERATION -eq 'stop' -and ($finalManagedCount -ne 0 -or $unknownFinal.Count -ne 0)) {
            throw "Expected zero managed proxy processes after stop, observed $($values['managed_singbox_process_count'])"
          }
          $finalMode = [string]$values['windows_datapath_mode']
          $finalTun = [string]$values['managed_tun_present']
          if ($env:EDGE_OPERATION -ne 'rollback' -and $finalMode -cne $env:EDGE_EXPECTED_MODE) {
            throw "Final datapath mode $finalMode does not match accepted desired mode $env:EDGE_EXPECTED_MODE"
          }
          if ($finalMode -ceq 'ProxyOnly' -and $finalTun -cne 'false') { throw 'Final ProxyOnly state owns managed TUN' }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -eq 'stop' -and $finalTun -cne 'false') {
            throw 'Final explicit runtime stop left managed TUN present'
          }
          if ($finalMode -ceq 'ManagedTun' -and $env:EDGE_OPERATION -ne 'stop' -and $finalTun -cne 'true') {
            throw 'Final ManagedTun state is missing managed TUN'
          }
          if ($finalMode -notin @('ProxyOnly','ManagedTun')) { throw "Unsupported final datapath mode: $finalMode" }
          if ($env:EDGE_OPERATION -eq 'rollback' -and $finalMode -ceq 'ProxyOnly') {
            $warpDnsAfterTunRemoval = @(
              Get-DnsClientServerAddress -InterfaceAlias 'CloudflareWARP' -AddressFamily IPv4 -ErrorAction Stop |
                ForEach-Object ServerAddresses
            )
            if ($warpDnsAfterTunRemoval -contains '172.19.0.2') {
              throw "Foreign CloudflareWARP still depends on removed managed TUN DNS after ProxyOnly rollback: $($warpDnsAfterTunRemoval -join ',')"
            }
            Write-Host "foreign_cloudflarewarp_dns_after_tun_removal=$($warpDnsAfterTunRemoval -join ',')"
            Write-Host 'foreign_cloudflarewarp_tun_dns_cleanup=PASS'
          }
          $externalPids = @(
            $doctor | ForEach-Object {
              if ([string]$_ -match '^singbox_process=pid:(\d+) managed:false orphan:\w+ identity_unknown:false(?:\s|$)') { $Matches[1] }
            } | Sort-Object -Unique
          )
          $signature = $externalPids -join ','
          if ($signature -cne $env:EDGE_EXTERNAL_PIDS_BEFORE) { throw 'External sing-box owner changed after verification' }
          foreach ($relative in @('state','runtime','logs')) {
            $path = Join-Path $env:EDGE_INSTALL_ROOT $relative
            $denied = $false
            try { [IO.Directory]::GetFileSystemEntries($path) | Out-Null } catch [UnauthorizedAccessException] { $denied = $true }
            if (-not $denied) { throw "Runner unexpectedly has direct private-state access: $relative" }
          }
          $doctor | Write-Host

      - name: Observe Cloudflare One effective client state (read-only)
        if: ${{ needs.resolve.outputs.operation == 'diagnose' }}
        shell: powershell
        run: |
          # Only observe an independently owned client. Never emit raw settings or
          # diagnostics: they can include private organization and network data.
          $ErrorActionPreference = 'Stop'
          $serviceState = 'UNKNOWN'
          $servicePid = 0
          try {
            $svc = Get-CimInstance -ClassName Win32_Service -Filter "Name='CloudflareWARP'" -ErrorAction Stop
            if ($null -ne $svc) {
              $serviceState = if ([string]$svc.State -ceq 'Running') { 'RUNNING' } else { 'NOT_RUNNING' }
              $servicePid = [int]$svc.ProcessId
            }
          } catch { $serviceState = 'UNKNOWN' }

          $listener = 'UNKNOWN'
          try {
            $dnsEndpoints = @(
              @(Get-NetUDPEndpoint -LocalPort 53 -ErrorAction Stop) +
              @(Get-NetTCPConnection -LocalPort 53 -State Listen -ErrorAction Stop)
            ) | Where-Object { $_.LocalAddress -in @('127.0.2.2','127.0.2.3') }
            $listener = if ($dnsEndpoints.Count -eq 0) { 'NOT_OBSERVED' }
                        elseif ($servicePid -gt 0 -and @($dnsEndpoints | Where-Object { [int]$_.OwningProcess -eq $servicePid }).Count -gt 0) { 'WARP_SERVICE_PROCESS' }
                        else { 'OTHER_OR_UNATTRIBUTED' }
          } catch { $listener = 'UNKNOWN' }

          # Only the installed vendor CLI at its exact standard path is allowed.
          # The child CLI is bounded; a timed-out child is closed, not warp-svc.
          $warpCli = Join-Path $env:ProgramFiles 'Cloudflare\Cloudflare WARP\warp-cli.exe'
          function Read-CloudflareClient([string]$verb) {
            if (-not (Test-Path -LiteralPath $warpCli -PathType Leaf)) {
              return @{ outcome = 'CLI_NOT_FOUND'; value = '' }
            }
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $warpCli
            $psi.Arguments = $verb
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $child = New-Object System.Diagnostics.Process
            $child.StartInfo = $psi
            try {
              if (-not $child.Start()) { return @{ outcome = 'START_FAILED'; value = '' } }
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(10000)) {
                try { $child.Kill(); $child.WaitForExit(2000) | Out-Null } catch {}
                return @{ outcome = 'CLI_TIMEOUT'; value = '' }
              }
              if ($child.ExitCode -ne 0) { return @{ outcome = 'CLI_ERROR'; value = '' } }
              $value = $stdout.GetAwaiter().GetResult()
              if ($value.Length -gt 65536) { return @{ outcome = 'OVERSIZE'; value = '' } }
              return @{ outcome = 'OK'; value = $value }
            } catch {
              return @{ outcome = 'CLI_UNAVAILABLE'; value = '' }
            } finally { $child.Dispose() }
          }

          $status = Read-CloudflareClient 'status'
          $settings = Read-CloudflareClient 'settings'
          $connectivity = 'UNKNOWN'
          if ($status.outcome -ceq 'OK') {
            if ($status.value -match '\bConnected\b') { $connectivity = 'CONNECTED' }
            elseif ($status.value -match '\bDisconnected\b') { $connectivity = 'DISCONNECTED' }
          }
          $mode = 'UNKNOWN'
          $split = 'UNKNOWN'
          $profileHash = 'UNKNOWN'
          $splitHash = 'UNKNOWN'
          $fallback = 'UNKNOWN'
          $meshSplitExact = 'UNKNOWN'
          if ($settings.outcome -ceq 'OK') {
            $modeMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Mode:\s*(WarpWithDnsOverHttps|TunnelOnly|DnsOverHttps|WarpProxy|PostureOnly)\b')
            if ($modeMatch.Success) { $mode = $modeMatch.Groups[1].Value }
            $profileMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Profile ID:\s*([0-9a-fA-F-]{36})(?:\s|$)')
            if ($profileMatch.Success) {
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $profileHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($profileMatch.Groups[1].Value.ToLowerInvariant()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
            }
            $splitMatch = [regex]::Match($settings.value, '(?m)^\s*(?:\([^)\r\n]+\)\s*)?(Exclude|Include) mode, with hosts/ips:')
            if ($splitMatch.Success) {
              $split = $splitMatch.Groups[1].Value.ToUpperInvariant()
              $section = $settings.value.Substring($splitMatch.Index + $splitMatch.Length)
              $nextField = [regex]::Match($section, '(?m)^\s*\([^)\r\n]+\)\s+\S[^:\r\n]*:')
              if ($nextField.Success) { $section = $section.Substring(0, $nextField.Index) }
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $splitHash = [BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($section.Trim()))).Replace('-','').ToLowerInvariant() }
              finally { $sha.Dispose() }
              $meshSplitExact = if ($section -match '(?m)^\s*100\.96\.0\.0/12(?:\s|$)') { 'YES' } else { 'NO' }
            }
            $fallback = if ($settings.value -match '(?m)^\s*(?:\([^)\r\n]+\)\s*)?Fallback domains:') { 'PRESENT' } else { 'NOT_LISTED' }
          }
          # No registry NameServer or local listener proves a DNS writer or failover.
          Write-Host "cloudflare_one_service=$serviceState"
          Write-Host "cloudflare_one_local_dns_listener=$listener"
          Write-Host "cloudflare_one_cli_status=$($status.outcome)"
          Write-Host "cloudflare_one_connectivity=$connectivity"
          Write-Host "cloudflare_one_cli_settings=$($settings.outcome)"
          Write-Host "cloudflare_one_effective_mode=$mode"
          Write-Host "cloudflare_one_profile_id_sha256=$profileHash"
          Write-Host "cloudflare_one_split_tunnel_mode=$split"
          Write-Host "cloudflare_one_split_entries_sha256=$splitHash"
          Write-Host "cloudflare_one_split_mesh_cidr_exact=$meshSplitExact"
          Write-Host "cloudflare_one_local_domain_fallback=$fallback"
          Write-Host 'cloudflare_one_dns_writer=UNKNOWN'
          Write-Host 'cloudflare_one_no_tun_recovery=UNPROVEN'

      - name: Publish bounded lifecycle evidence
        if: ${{ always() }}
        shell: powershell
        run: |
          @(
            "### Windows $env:EDGE_AFTER_MODE lifecycle",
            '- Operation: ${{ needs.resolve.outputs.operation }}',
            "- Before ReleaseSet: $env:EDGE_BEFORE_RELEASE",
            "- After ReleaseSet: $env:EDGE_AFTER_RELEASE",
            '- Local Windows build: NO',
            '- External sing-box mutation: FORBIDDEN / equality-checked',
            "- Expected mode: $env:EDGE_EXPECTED_MODE",
            "- Before mode: $env:EDGE_BEFORE_MODE",
            "- After mode: $env:EDGE_AFTER_MODE",
            "- TUN requested by desired state: $($env:EDGE_EXPECTED_MODE -ceq 'ManagedTun')",
            '- Foreign CloudflareWARP mutation: FORBIDDEN',
            '- External sing-box owner: FORBIDDEN / equality-checked'
          ) | Add-Content -Encoding UTF8 -LiteralPath $env:GITHUB_STEP_SUMMARY
