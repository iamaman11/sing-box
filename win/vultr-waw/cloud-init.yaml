#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - jq
  - gettext-base
  - openssl
  - tar
write_files:
  - path: /etc/systemd/system/edge-agent.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Edge Agent
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=simple
      ExecStart=/opt/vultr-edge-stack/bin/edge-agent serve
      Restart=always
      RestartSec=2
      Environment=EDGE_AGENT_ADDR=127.0.0.1:50061
      Environment=EDGE_STACK_DIR=/opt/vultr-edge-stack/stack
      EnvironmentFile=-/opt/vultr-edge-stack/edge-agent.env
      WorkingDirectory=/opt/vultr-edge-stack

      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/install-docker.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      DOCKER_ENGINE_VERSION='@@DOCKER_ENGINE_VERSION@@'
      CONTAINERD_VERSION='@@CONTAINERD_VERSION@@'
      COMPOSE_VERSION='@@COMPOSE_VERSION@@'

      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      ARCH="$(dpkg --print-architecture)"
      cat <<EOF >/etc/apt/sources.list.d/docker.sources
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: ${VERSION_CODENAME}
      Components: stable
      Architectures: ${ARCH}
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF
      apt-get update
      apt-get remove -y docker.io docker-compose containerd runc || true
      apt-get install -y --no-install-recommends \
        "docker-ce=${DOCKER_ENGINE_VERSION}" \
        "docker-ce-cli=${DOCKER_ENGINE_VERSION}" \
        "containerd.io=${CONTAINERD_VERSION}" \
        "docker-compose-plugin=${COMPOSE_VERSION}"

      require_package_version() {
        local package="$1"
        local expected="$2"
        local actual
        actual="$(dpkg-query -W -f='${Version}' "$package")"
        if [[ "$actual" != "$expected" ]]; then
          echo "package version mismatch for $package: expected=$expected actual=$actual" >&2
          exit 1
        fi
      }

      require_package_version docker-ce "$DOCKER_ENGINE_VERSION"
      require_package_version docker-ce-cli "$DOCKER_ENGINE_VERSION"
      require_package_version containerd.io "$CONTAINERD_VERSION"
      require_package_version docker-compose-plugin "$COMPOSE_VERSION"
      apt-mark hold docker-ce docker-ce-cli containerd.io docker-compose-plugin >/dev/null

      install -d -m 0755 /var/lib/singbox-lifecycle
      cat > /var/lib/singbox-lifecycle/host-substrate.env <<EOF
      docker_engine_version=${DOCKER_ENGINE_VERSION}
      containerd_version=${CONTAINERD_VERSION}
      compose_version=${COMPOSE_VERSION}
      EOF
      chmod 0644 /var/lib/singbox-lifecycle/host-substrate.env
  - path: /usr/local/sbin/prepare-edge-host.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -d -m 0755 /opt/vultr-edge-stack
      install -d -m 0755 /opt/vultr-edge-stack/bin
      install -d -m 0755 /opt/vultr-edge-stack/stack
      systemctl daemon-reload
      systemctl enable edge-agent.service
runcmd:
  - [bash, -lc, "/usr/local/sbin/install-docker.sh"]
  - [bash, -lc, "systemctl enable docker --now"]
  - [bash, -lc, "/usr/local/sbin/prepare-edge-host.sh"]
  - [bash, -lc, "sudo docker version >/dev/null && sudo docker compose version >/dev/null && install -d -m 0755 /var/lib/singbox-lifecycle && printf '%s\\n' exact-substrate-ready > /var/lib/singbox-lifecycle/host-bootstrap"]
