#cloud-config
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - jq
  - gettext-base
  - openssl
  - tar
write_files:
  - path: /etc/systemd/system/edge-agent.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Edge Agent
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=simple
      ExecStart=/opt/vultr-edge-stack/bin/edge-agent serve
      Restart=always
      RestartSec=2
      Environment=EDGE_AGENT_ADDR=0.0.0.0:50061
      Environment=EDGE_STACK_DIR=/opt/vultr-edge-stack/stack
      EnvironmentFile=-/opt/vultr-edge-stack/edge-agent.env
      WorkingDirectory=/opt/vultr-edge-stack

      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/install-docker.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      apt-get update
      apt-get install -y ca-certificates curl
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      ARCH="$(dpkg --print-architecture)"
      cat <<EOF >/etc/apt/sources.list.d/docker.sources
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: ${VERSION_CODENAME}
      Components: stable
      Architectures: ${ARCH}
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF
      apt-get update
      apt-get remove -y docker.io docker-compose containerd runc || true
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - path: /usr/local/sbin/prepare-edge-host.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -d -m 0755 /opt/vultr-edge-stack
      install -d -m 0755 /opt/vultr-edge-stack/bin
      install -d -m 0755 /opt/vultr-edge-stack/stack
      systemctl daemon-reload
      systemctl enable edge-agent.service
runcmd:
  - [bash, -lc, "/usr/local/sbin/install-docker.sh"]
  - [bash, -lc, "systemctl enable docker --now"]
  - [bash, -lc, "/usr/local/sbin/prepare-edge-host.sh"]
