name: vultr-edge

services:
  warp-egress:
    image: ${EDGE_WARP_EGRESS_IMAGE:?EDGE_WARP_EGRESS_IMAGE is required}
    container_name: vultr-warp-egress
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ../warp-state:/var/lib/cloudflare-warp
    networks:
      - edge_net

  cloudflare-mesh:
    profiles:
      - mesh
    image: ${CLOUDFLARE_MESH_IMAGE:?CLOUDFLARE_MESH_IMAGE is required}
    container_name: vultr-cloudflare-mesh
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      MESH_NODE_TOKEN: ${MESH_NODE_TOKEN:-}
      SRCNAT_ENABLED: "true"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    volumes:
      - ../mesh-state:/var/lib/cloudflare-warp
    networks:
      - mesh_net

  line2-proxy:
    image: ${EDGE_GATEWAY_IMAGE:?EDGE_GATEWAY_IMAGE is required}
    container_name: vultr-line2-proxy
    restart: unless-stopped
    depends_on:
      - warp-egress
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    ports:
      - "3128:3128/tcp"
      - "1080:1080/tcp"
      - "9443:9443/tcp"
      - "4128:4128/tcp"
      - "4080:4080/tcp"
      - "4443:4443/tcp"
    volumes:
      - ./rendered/line2-proxy.json:/etc/sing-box/config.json:ro
      - ./certs:/certs:ro
      - ../certificate-state:/var/lib/sing-box:ro
    networks:
      - edge_net

  line1-gateway:
    profiles:
      - tunnel
    image: ${EDGE_GATEWAY_IMAGE:?EDGE_GATEWAY_IMAGE is required}
    container_name: vultr-line1-gateway
    restart: unless-stopped
    depends_on:
      - warp-egress
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "8443:8443/udp"
      - "5443:5443/tcp"
      - "9444:9444/udp"
    volumes:
      - ./rendered/line1-gateway.json:/etc/sing-box/config.json:ro
      - ../certificate-state:/var/lib/sing-box
    networks:
      - edge_net

networks:
  mesh_net:
    driver: bridge
  edge_net:
    driver: bridge
