name: warp-proxy

services:
  warp-egress:
    build:
      context: ./warp-egress
    container_name: vm-warp-egress
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./warp-state:/var/lib/cloudflare-warp
    networks:
      edge_net:
        ipv4_address: 172.22.10.2

  edge-gateway:
    build:
      context: ./edge-gateway
    container_name: vm-warp-proxy-gateway
    restart: unless-stopped
    depends_on:
      - warp-egress
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    ports:
      - '3128:3128/tcp'
      - '1080:1080/tcp'
      - '9443:9443/tcp'
    volumes:
      - ./edge-gateway/config.live.json:/etc/sing-box/config.json:ro
      - /etc/sing-box/certs/proxy.crt:/certs/proxy.crt:ro
      - /etc/sing-box/certs/proxy.key:/certs/proxy.key:ro
    networks:
      edge_net:
        ipv4_address: 172.22.10.3

networks:
  edge_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.10.0/24
